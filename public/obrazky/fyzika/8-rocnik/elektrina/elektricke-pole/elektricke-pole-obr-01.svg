<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kladně nabitá tyč se přiblíží ke kovu a k izolantu. V kovu se volné elektrony přesunou k bližší straně u tyče: tam elektrony přebývají a na vzdálené straně chybějí – to je elektrostatická indukce. V izolantu se elektrony posunou jen uvnitř atomů – to je polarizace. Obě tělesa zůstávají jako celek neutrální, ale k nabité tyči jsou přitahována. Animace: tyč se přiblíží, náboj se přerozdělí, po oddálení tyče se vrátí.">
<style>
/* Předloha: PDF lekce 19, s. 3 (kov: volné elektrony se nahromadí u kladné tyče) a s. 4 (izolant: elektrony se posunou jen uvnitř atomů).
   8 s: 0–8 % tyč daleko, 8–30 % se přiblíží; 15–35 % elektrony v kovu přejdou k tyči a obaly atomů izolantu se posunou o 12 px;
   drží do 80 %; 80–95 % tyč odjede a vše se vrátí (po oddálení tyče se náboj zase rozdělí rovnoměrně).
   Popisky „chybějí / přebývají“ a „posunou jen uvnitř atomů“ svítí 42–80 %.
   Popisek „kladně nabitá tyč“ stojí na místě a svítí jen 31–79 %, kdy je tyč u tělesa (nejede přes okraj, neořízne se).
   Izolant: jádro r = 8, obal rx = 40, každý atom má jedno jádro ⊕ a jeden „−“ na straně u tyče (1 : 1 = neutrální atom, kontrola 3. 10. 2026 N3).
   Bez animace = koncový stav: tyč u tělesa, elektrony u tyče, obaly posunuté, popisky viditelné. */
.ty { animation: ty 8s ease-in-out infinite; }
@keyframes ty { 0%, 8% { transform: translateX(240px); } 30%, 80% { transform: translateX(0px); } 95%, 100% { transform: translateX(240px); } }
.ob { animation: ob 8s ease-in-out infinite; }
@keyframes ob { 0%, 15% { transform: translateX(-12px); } 35%, 80% { transform: translateX(0px); } 92%, 100% { transform: translateX(-12px); } }
.st { animation: st 8s linear infinite; }
@keyframes st { 0%, 36% { opacity: 0; } 42%, 80% { opacity: 1; } 86%, 100% { opacity: 0; } }
.e1 { animation: e1 8s ease-in-out infinite; }
@keyframes e1 { 0%, 15% { transform: translate(-190px, 8px); } 35%, 80% { transform: translate(0px, 0px); } 92%, 100% { transform: translate(-190px, 8px); } }
.e2 { animation: e2 8s ease-in-out infinite; }
@keyframes e2 { 0%, 15% { transform: translate(-134px, -7px); } 35%, 80% { transform: translate(0px, 0px); } 92%, 100% { transform: translate(-134px, -7px); } }
.e3 { animation: e3 8s ease-in-out infinite; }
@keyframes e3 { 0%, 15% { transform: translate(-30px, -22px); } 35%, 80% { transform: translate(0px, 0px); } 92%, 100% { transform: translate(-30px, -22px); } }
.e4 { animation: e4 8s ease-in-out infinite; }
@keyframes e4 { 0%, 15% { transform: translate(-190px, -22px); } 35%, 80% { transform: translate(0px, 0px); } 92%, 100% { transform: translate(-190px, -22px); } }
.e5 { animation: e5 8s ease-in-out infinite; }
@keyframes e5 { 0%, 15% { transform: translate(-134px, -7px); } 35%, 80% { transform: translate(0px, 0px); } 92%, 100% { transform: translate(-134px, -7px); } }
.e6 { animation: e6 8s ease-in-out infinite; }
@keyframes e6 { 0%, 15% { transform: translate(-30px, 8px); } 35%, 80% { transform: translate(0px, 0px); } 92%, 100% { transform: translate(-30px, 8px); } }
.tl { animation: tl 8s linear infinite; }
@keyframes tl { 0%, 26% { opacity: 0; } 31%, 79% { opacity: 1; } 84%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ty, .ob, .st, .tl, .e1, .e2, .e3, .e4, .e5, .e6 { animation: none; } }
</style>
