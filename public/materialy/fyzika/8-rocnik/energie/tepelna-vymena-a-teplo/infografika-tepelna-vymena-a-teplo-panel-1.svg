"#343a40" /></g></g><g transform="translate(258,138) rotate(160)"><line x1="0" y1="0" x2="13" y2="0" stroke="#343a40" stroke-width="3" /><g><path d="M11,-5 L20,0 L11,5 z" fill="#343a40" /></g></g><g transform="translate(264,178) rotate(-70)"><line x1="0" y1="0" x2="13" y2="0" stroke="#343a40" stroke-width="3" /><g><path d="M11,-5 L20,0 L11,5 z" fill="#343a40" /></g></g><g transform="translate(258,212) rotate(200)"><line x1="0" y1="0" x2="13" y2="0" stroke="#343a40" stroke-width="3" /><g><path d="M11,-5 L20,0 L11,5 z" fill="#343a40" /></g></g></g><circle cx="200" cy="147" r="8" fill="#0c8599" stroke="#0b7285" stroke-width="1.5" /><circle cx="212" cy="182" r="8" fill="#0c8599" stroke="#0b7285" stroke-width="1.5" /><circle cx="192" cy="203" r="8" fill="#0c8599" stroke="#0b7285" stroke-width="1.5" /><circle cx="258" cy="138" r="8" fill="#0c8599" stroke="#0b7285" stroke-width="1.5" /><circle cx="264" cy="178" r="8" fill="#0c8599" stroke="#0b7285" stroke-width="1.5" /><circle cx="258" cy="212" r="8" fill="#0c8599" stroke="#0b7285" stroke-width="1.5" /></g>
