<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 800 1100" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kladkostroj s pevnou a volnou kladkou: výkon 400 mW, příkon 480 mW, účinnost přibližně 83 %, ztráty přibližně 17 %.">
<defs>
<marker id="a-cer" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e03131" /></marker>
<marker id="a-mod" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1971c2" /></marker>
<marker id="a-zel" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2f9e44" /></marker>
<marker id="a-ora" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e8590c" /></marker>
<marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2b2a26" /></marker>
<marker id="a-sed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#495057" /></marker>
<marker id="a-fia" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#7048e8" /></marker>
</defs>
<rect x="3" y="3" width="794" height="1094" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3" /><text x="400" y="48" font-size="34" fill="#2b2a26" text-anchor="middle">Kladkostroj: pevná a volná kladka</text><g transform="translate(110 65)"><rect x="170" y="80" width="240" height="14" fill="#2b2a26" />
<line x1="330.0" y1="94.0" x2="330.0" y2="130.0" stroke="#2b2a26" stroke-width="5" stroke-linecap="round" />
<circle cx="330.0" cy="170.0" r="40" fill="#ffffff" stroke="#2b2a26" stroke-width="4" />
<circle cx="330.0" cy="170.0" r="6" fill="#2b2a26" stroke="#2b2a26" stroke-width="1" />
<path d="M210,94 L210,320 A40,40 0 0 0 290,320 L290,170 A40,40 0 0 1 370,170 L370,390" fill="none" stroke="#e8590c" stroke-width="5" stroke-linejoin="round" />
<circle cx="250.0" cy="320.0" r="40" fill="#ffffff" stroke="#2b2a26" stroke-width="4" />
<circle cx="250.0" cy="320.0" r="6" fill="#2b2a26" stroke="#2b2a26" stroke-width="1" />
<line x1="250.0" y1="326.0" x2="250.0" y2="400.0" stroke="#2b2a26" stroke-width="5" stroke-linecap="round" />
<rect x="190" y="400" width="120" height="70" rx="6" fill="#a5d8ff" stroke="#2b2a26" stroke-width="3" />
<text x="250.0" y="443.0" font-size="32" fill="#2b2a26" text-anchor="middle">závaží</text>
<line x1="370.0" y1="400.0" x2="370.0" y2="470.0" stroke="#e8590c" stroke-width="5" marker-end="url(#a-ora)" stroke-linecap="round" />
<text x="388.0" y="440.0" font-size="32" font-weight="bold" fill="#a33c08" text-anchor="start">tah</text>
<line x1="320.0" y1="470.0" x2="320.0" y2="410.0" stroke="#2f9e44" stroke-width="5" marker-end="url(#a-zel)" stroke-linecap="round" />
<text x="190.0" y="500.0" font-size="32" font-weight="bold" fill="#216e30" text-anchor="start">závaží se zvedá</text>
<text x="388.0" y="140.0" font-size="32" font-weight="bold" fill="#2b2a26" text-anchor="start">pevná kladka</text>
<text x="190" y="285" font-size="32" font-weight="bold" fill="#2b2a26" text-anchor="end">volná kladka</text>
</g><rect x="30" y="600" width="740" height="270" rx="12" fill="white" stroke="#2b2a26" stroke-width="3" /><text x="60" y="650" font-size="36" fill="#216e30" text-anchor="start">Výkon P = 400 mW</text><text x="60" y="700" font-size="36" fill="#a33c08" text-anchor="start">Příkon P₀ = 480 mW</text><text x="60" y="747" font-size="32" fill="#2b2a26" text-anchor="start">Oba výkony v miliwattech (mW).</text><text x="60" y="800" font-size="36" fill="#2b2a26" text-anchor="start">η = P : P₀</text><text x="60" y="845" font-size="34" fill="#2b2a26" text-anchor="start">η = (400 : 480) · 100 % ≐ 83 %</text><text x="40" y="919" font-size="32" fill="#2b2a26" text-anchor="start">Z příkonu 100 % se využije přibližně:</text><rect x="40" y="942" width="597.6" height="56" fill="#8ce99a" stroke="#2b2a26" stroke-width="2" /><rect x="637.6" y="942" width="122.4" height="56" fill="#ffc9c9" stroke="#2b2a26" stroke-width="2" /><text x="320" y="982" font-size="32" fill="#2b2a26" text-anchor="middle">užitečně 83 %</text><text x="699" y="982" font-size="32" fill="#2b2a26" text-anchor="middle">17 %</text><text x="760" y="1035" font-size="32" fill="#a61e1e" text-anchor="end">ztráty třením</text><text x="40" y="1080" font-size="32" fill="#2b2a26" text-anchor="start">Účinnost je vždy menší než 100 %.</text></svg>
