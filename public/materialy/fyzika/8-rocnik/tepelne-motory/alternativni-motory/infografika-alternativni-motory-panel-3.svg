<svg viewBox="0 1354 460 660" width="460" height="660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Raketový motor v řezu raketou ve vesmíru, kde není vzduch: nahoře nádrž paliva, pod ní nádrž okysličovadla, potrubím tečou do spalovací komory, horké plyny unikají tryskou dolů; fialová šipka akce míří dolů na plyny, stejně dlouhá šipka reakce míří z nosu rakety nahoru; raketa funguje i ve vakuu" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
