<g class="celek">
<!-- duhy: schematicky (jako předloha) oblouky se středem C(410,372) pod obzorem; spodek zakryje zem,
     pravý konec ořízne rámeček. Geometrie (přepočet 3. 10. 2026, oprava 2): oko pozorovatele E(82,291),
     C leží na antisolární přímce (prodloužení slunečních paprsků okem; sklon 81/328 = 0,247, stejný
     jako sluneční paprsky). Úhel u oka mezi antisolárním směrem a paprskem z kapky: červená 42,0°
     (kapka 363.2,140.7 na červeném oblouku r 236), fialová 40,0° (kapka 331.4,168.6 na fialovém
     oblouku r 218). Nohy oblouků u obzoru x 147–192 — v dešti, s odstupem od pozorovatele i jeho stínu.
     Šířka pásu barev je zvětšená, aby byla vidět. -->
<g clip-path="url(#r4nad)" fill="none" stroke-width="5.5">
<!-- vedlejší duha: slabší, výš, opačné pořadí (fialová venku, červená uvnitř) -->
