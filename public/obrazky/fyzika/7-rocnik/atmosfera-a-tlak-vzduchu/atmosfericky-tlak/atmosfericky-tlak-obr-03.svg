<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tři přístroje na měření tlaku vzduchu. Rtuťový barometr: při normálním tlaku sahá rtuť v trubici do výšky 760 milimetrů. Aneroid, kovový barometr s ručičkou, ukazuje 1 013 hektopascalů. Barograf zapisuje tlak perem na papír na otáčejícím se válci. Animace: když tlak stoupne, rtuť vystoupí, ručička se pootočí doprava a pero zapíše čáru výš; když tlak klesne, je to naopak.">
<style>
/* Animace 8s, smyčka, všechny části se stejným lineárním průběhem tlaku: 0 % normální, 25 % vyšší, 50 % normální, 75 % nižší.
   Předloha: PDF lekce 16, str. 8 (rtuťový barometr — rtuť v trubici stoupá a klesá podle tlaku), str. 9–10 (aneroid s ručičkou),
   str. 10–11 (barograf: válec s papírem, krabičky, pero). Normální tlak 760 mm rtuti ≈ 1 013 hPa (výklad).
   Bez animace = koncový stav = normální tlak (rtuť na 760 mm, ručička na 1 013 hPa, stopa barografu celá). */
.sl { transform-box: fill-box; transform-origin: 50% 100%; animation: sl 8s linear infinite; }
.ru { transform-box: view-box; transform-origin: 0 0; animation: ru 8s linear infinite; }
.pero { animation: pero 8s linear infinite; }
.pap { animation: pap 8s linear infinite; }
.tn { animation: tn 8s linear infinite; }
.tv { animation: tv 8s linear infinite; }
.tz { animation: tz 8s linear infinite; }
@keyframes sl { 0%, 100% { transform: scaleY(1); } 25% { transform: scaleY(1.1053); } 50% { transform: scaleY(1); } 75% { transform: scaleY(0.8947); } }
@keyframes ru { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(40deg); } 50% { transform: rotate(0deg); } 75% { transform: rotate(-40deg); } }
@keyframes pero { 0%, 100% { transform: translateY(0px); } 25% { transform: translateY(-28px); } 50% { transform: translateY(0px); } 75% { transform: translateY(28px); } }
@keyframes pap { 0% { transform: translateX(0px); } 100% { transform: translateX(-380px); } }
@keyframes tn { 0%, 10% { opacity: 1; } 12%, 38% { opacity: 0; } 40%, 60% { opacity: 1; } 62%, 88% { opacity: 0; } 90%, 100% { opacity: 1; } }
@keyframes tv { 0%, 10% { opacity: 0; } 12%, 38% { opacity: 1; } 40%, 100% { opacity: 0; } }
@keyframes tz { 0%, 60% { opacity: 0; } 62%, 88% { opacity: 1; } 90%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sl, .ru, .pero, .pap, .tn, .tv, .tz { animation: none; } }
</style>
