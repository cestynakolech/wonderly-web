<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Mechanické náramkové hodinky s řemínkem: ciferník s čísly a třemi ručičkami, vteřinová poskočí každou sekundu. Vedle je strojek hodinek zevnitř: natažená pružina v bubínku pohání malinká ozubená kolečka, krok se pravidelně překlápí a pouští kolečko o zub dál, nepokoj kmitá sem a tam a šroubky drží díly pohromadě.">
<style>
/* Hodinky jdou skutečným tempem: vteřinová ručička poskočí každou sekundu a oběhne za 60 s,
   minutová za 1 h (3 600 s), hodinová za 12 h (43 200 s). Ve strojku nepokoj kmitá sem a tam (kmit 1 s),
   krok se při každém kyvu překlopí a pustí ozubené kolečko o jeden zub dál (tik).
   Bez animace: čas 10:10:00, nepokoj a krok v klidu. */
.sek7 { transform-box: view-box; transform-origin: 215px 350px; animation: sek7-k 60s steps(60, end) infinite; }
@keyframes sek7-k { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.min7 { transform-box: view-box; transform-origin: 215px 350px; animation: min7-k 3600s linear infinite; }
@keyframes min7-k { from { transform: rotate(60deg); } to { transform: rotate(420deg); } }
.hod7 { transform-box: view-box; transform-origin: 215px 350px; animation: hod7-k 43200s linear infinite; }
@keyframes hod7-k { from { transform: rotate(305deg); } to { transform: rotate(665deg); } }
.nepokoj { transform-box: view-box; transform-origin: 640px 462px; animation: nep-k 1s ease-in-out infinite; }
@keyframes nep-k { 0%, 100% { transform: rotate(-110deg); } 50% { transform: rotate(110deg); } }
.krok { transform-box: view-box; transform-origin: 748px 382px; animation: krok-k 1s ease-in-out infinite; }
@keyframes krok-k { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
.kol7 { transform-box: view-box; transform-origin: 745px 290px; animation: kol7-k 7.5s steps(15, end) infinite; }
@keyframes kol7-k { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sek7, .min7, .hod7, .nepokoj, .krok, .kol7 { animation: none; } }
</style>
