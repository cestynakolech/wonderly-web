<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Sluneční hodiny na kamenném podstavci v trávě. Na kruhové bronzové desce je stupnice s římskými číslicemi a uprostřed šikmá tyč. Slunce putuje po obloze zleva doprava a stín tyče se po stupnici otáčí opačně — ukazuje, kolik je hodin. V poledne míří stín na XII.">
<style>
/* Slunce putuje po obloze zleva (východ) doprava (západ), stín tyče se otáčí po stupnici
   od VII do V (16 s, smyčka). Bez animace (prefers-reduced-motion) platí atributy: poledne, stín na XII. */
.slunce { transform-box: view-box; transform-origin: 480px 640px; animation: slunce-k 16s linear infinite; }
.stin { transform-origin: 0px 0px; animation: stin-k 16s linear infinite; }
@keyframes slunce-k { 0% { transform: rotate(-50deg); opacity: 0; } 4% { opacity: 1; } 90% { transform: rotate(50deg); opacity: 1; } 96%, 100% { transform: rotate(50deg); opacity: 0; } }
@keyframes stin-k { 0% { transform: rotate(15deg); opacity: 0; } 4% { opacity: 0.55; } 90% { transform: rotate(165deg); opacity: 0.55; } 96%, 100% { transform: rotate(165deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .slunce, .stin { animation: none; } }
</style>
