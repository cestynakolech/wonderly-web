<svg viewBox="0 2624 460 670" width="460" height="670" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kladkostroj: pevné a volné kladky spojené dohromady, používá se u jeřábů, na lodích a v dílnách; lano vede od stropu dolů pod volnou kladku, nahoru přes pevnou kladku a dolů k ruce; závaží 2 kg s tíhou FG = 20 N drží dvě části lana, ruka táhne dolů silou F = 10 N, 20 N : 2 = 10 N; ruka stáhne lano dolů a volná kladka se závažím vyjede nahoru; pevná kladka mění směr, volná šetří sílu" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Kladka 5/5: Kladkostroj</title>
	<style>
		.p5-vol { animation: p5vol 8s infinite; }
