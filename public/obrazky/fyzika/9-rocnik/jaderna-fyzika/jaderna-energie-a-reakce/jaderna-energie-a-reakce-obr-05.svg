<g class="f5d" opacity="0"><path d="M70 201H30" stroke="#d9480f" stroke-width="3" stroke-linecap="round"/><path d="M70 215H30" stroke="#d9480f" stroke-width="3" stroke-linecap="round"/><path d="M70 229H30" stroke="#d9480f" stroke-width="3" stroke-linecap="round"/><circle cx="96.7" cy="215" r="14" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M89 215H104.4M96.7 207.3V222.7" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/><circle cx="123.3" cy="215" r="14" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><text x="110" y="261" font-size="22" fill="#212529" text-anchor="middle" font-weight="bold">vodík</text></g>
