<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Schéma: dva rezistory vedle sebe, odpory R₁ a R₂ jsou v poměru 2 : 1. Oranžové šipky ukazují proud: celkový proud I vede od kladného pólu článku vlevo nahoru do uzlu, tam se rozdělí na proud I₁ horní větví a I₂ prostřední větví, v pravém uzlu se proudy opět spojí a proud I se vrací přes zavřený spínač k zápornému pólu. Animace: oranžové značky proudu jedou obvodem; rezistorem R₂ s menším odporem jich projde dvakrát víc než rezistorem R₁, takže I₁ : I₂ = 1 : 2 a I = I₁ + I₂.">
<style>
/* Předloha: PDF lekce 29, s. 4 (schéma se šipkami proudu I, I₁, I₂ – proud z + zdroje vlevo nahoru do uzlu, ve větvích
   doprava, v pravém uzlu se spojí a vrací dolů a doleva k −) a s. 3 (proud se v uzlu dělí do větví; při poměru odporů
   2 : 1 se rozdělí v poměru 1 : 2; I = I₁ + I₂). Opora: výklad § 3. Barva proudu oranžová jako v ostatních obrázcích
   elektřiny 8. roč. (předloha má červenou; červená je u nás vyhrazena kationtu).
   Odchylka od předlohy: v PDF s. 4 je spínač nakreslený rozpojený, ačkoli obvodem teče proud – zde je zavřený.
   Animace: oranžové značky proudu jedou dohodnutým směrem stálou rychlostí 55 px/s. Horní větví (R₁) jede
   značka každých 220 px, prostřední větví (R₂) každých 110 px → za stejný čas projde R₂ dvakrát víc značek
   (I₁ : I₂ = 1 : 2); hlavním vedením projdou obě řady (I = I₁ + I₂). Smyčka přes R₁ měří 1320 px (6 značek,
   24 s), přes R₂ 1100 px (10 značek, 20 s); fáze horní řady posunuta o 55 px, aby se značky
   ve společném vedení nepřekrývaly. Uvnitř rezistoru a článku jsou značky zakryté značkou součástky.
   Bez animace (reduced-motion) = stejný obraz se stojícími značkami (směr a hustotu ukazují i tak). */
.m1 { animation: m1 24s linear infinite; }
.m2 { animation: m2 20s linear infinite; }
@keyframes m1 { 0.00% { transform: translate(192px, 420px) rotate(180deg); } 6.96% { transform: translate(100px, 420px) rotate(180deg); } 6.97% { transform: translate(100px, 420px) rotate(-90deg); } 26.66% { transform: translate(100px, 160px) rotate(-90deg); } 26.67% { transform: translate(100px, 160px) rotate(0deg); } 56.96% { transform: translate(500px, 160px) rotate(0deg); } 56.97% { transform: translate(500px, 160px) rotate(90deg); } 76.66% { transform: translate(500px, 420px) rotate(90deg); } 76.67% { transform: translate(500px, 420px) rotate(180deg); } 98.78% { transform: translate(208px, 420px) rotate(180deg); } 98.79% { transform: translate(208px, 420px) rotate(180deg); } 100.00% { transform: translate(192px, 420px) rotate(180deg); } }
@keyframes m2 { 0.00% { transform: translate(192px, 420px) rotate(180deg); } 8.35% { transform: translate(100px, 420px) rotate(180deg); } 8.36% { transform: translate(100px, 420px) rotate(-90deg); } 21.99% { transform: translate(100px, 270px) rotate(-90deg); } 22.00% { transform: translate(100px, 270px) rotate(0deg); } 58.35% { transform: translate(500px, 270px) rotate(0deg); } 58.36% { transform: translate(500px, 270px) rotate(90deg); } 71.99% { transform: translate(500px, 420px) rotate(90deg); } 72.00% { transform: translate(500px, 420px) rotate(180deg); } 98.54% { transform: translate(208px, 420px) rotate(180deg); } 98.55% { transform: translate(208px, 420px) rotate(180deg); } 100.00% { transform: translate(192px, 420px) rotate(180deg); } }
@media (prefers-reduced-motion: reduce) { .m1, .m2 { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="634" rx="14" fill="#f8f9fa"/>
<text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Proud se v uzlu dělí</text>
