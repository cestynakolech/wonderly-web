<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1788 460 832" width="460" height="832" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Rotor a stator: v elektrárně se otáčí magnet a cívky stojí; rotor je otáčející se část, vytváří proměnlivé pole, je to magnet nebo elektromagnet, roztáčí ho turbína; stator je pevná část s cívkami, ve kterých se indukuje napětí a proud; jedna cívka dává jednofázové napětí, tři cívky třífázové napětí, které se vyrábí v elektrárnách; graf tří posunutých napětí u1, u2, u3; v každém okamžiku u1 + u2 + u3 = 0.">
	<title>Vznik střídavého proudu, alternátor 4/6: Rotor a stator</title>
