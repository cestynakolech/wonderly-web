<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Schéma obvodu: zdroj (článek, kladná svorka nahoře), zavřený spínač, svítící žárovka a ampérmetr – kolečko s písmenem A – zapojený za sebou v jedné cestě. Oranžové šipky ukazují dohodnutý směr proudu od + zdroje přes spínač a žárovku do kladné svorky ampérmetru a dál k − zdroje. Ampérmetrem prochází tentýž proud jako žárovkou.">
<style>
/* Předloha: PDF lekce 23, s. 5 (schéma: článek vlevo, + nahoře; spínač nahoře; žárovka vpravo; ampérmetr dole).
   Oprava proti předloze: v PDF je spínač otevřený a žárovka přesto svítí – zde spínač zavřený, žárovka svítí.
   Doplněno z výkladu § 3, 5, 6: oranžové šipky dohodnutého směru proudu (od + k −), svorky ampérmetru + / −
   (+ svorka míří přes žárovku ke kladné svorce zdroje). Statický obrázek – stav zapojení, ne děj. */
</style>
