<svg viewBox="0 590 460 491" width="460" height="491" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zvednuté kladivo: čím výš kladivo zvedneš, tím víc energie získá a tím víc práce vykoná. Zvednuto nízko: hřebík trochu; zvednuto vysoko: hřebík hlouběji." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Energie a její přeměny 2/5: Zvednuté kladivo</title>
	<!-- Panel 2/5 výřezu z infografika-energie-a-jeji-premeny.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.ruA { transform-origin: 70px 886px; animation: ruA 4s linear infinite; }
		.ruB { transform-origin: 270px 886px; animation: ruB 4s linear infinite; }
		.hA { animation: hA 4s linear infinite; }
		.hB { animation: hB 4s linear infinite; }
		@keyframes ruA { 0%, 15% { transform: rotate(0deg); } 35%, 45% { transform: rotate(-30deg); } 55%, 100% { transform: rotate(0deg); } }
		@keyframes ruB { 0%, 15% { transform: rotate(0deg); } 35%, 45% { transform: rotate(-100deg); } 55%, 100% { transform: rotate(0deg); } }
		@keyframes hA { 0%, 20% { transform: translateY(0); opacity: 1; } 24% { transform: translateY(0); opacity: 0; } 24.1% { transform: translateY(-8px); opacity: 0; } 28%, 53.7% { transform: translateY(-8px); opacity: 1; } 55%, 100% { transform: translateY(0); opacity: 1; } }
		@keyframes hB { 0%, 20% { transform: translateY(0); opacity: 1; } 24% { transform: translateY(0); opacity: 0; } 24.1% { transform: translateY(-20px); opacity: 0; } 28%, 54% { transform: translateY(-20px); opacity: 1; } 55%, 100% { transform: translateY(0); opacity: 1; } }
		@media (prefers-reduced-motion: reduce) {
			.ruA, .ruB, .hA, .hB { animation: none; }
		}
	</style>
	<rect x="0" y="590" width="460" height="491" fill="#f3f1ea" />
	<g id="panel-2">
	<!-- ===== Panel 2: Zvednuté kladivo ===== -->
	<rect x="26" y="606" width="420" height="465" rx="10" fill="#2b2a26" />
	<rect x="20" y="600" width="420" height="465" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
	<circle cx="52" cy="634" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
	<text x="52" y="641" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
	<text x="80" y="643" font-size="28" font-weight="bold" fill="#2b2a26">Zvednuté kladivo</text>
	<text x="40" y="680" font-size="21" fill="#2b2a26">Čím <tspan font-weight="bold">výš</tspan> kladivo zvedneš,</text>
	<text x="40" y="708" font-size="21" fill="#2b2a26">tím víc <tspan font-weight="bold">energie</tspan> získá</text>
	<text x="40" y="736" font-size="21" fill="#2b2a26">a tím víc <tspan font-weight="bold">práce</tspan> vykoná.</text>
	<line x1="230" y1="770" x2="230" y2="972" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 6" />
	<!-- podlaha -->
	<rect x="34" y="980" width="392" height="12" fill="#c9a77c" stroke="#2b2a26" stroke-width="2" />

	<!-- scéna A: zvednuto nízko -->
	<g class="hA">
		<rect x="180" y="896" width="12" height="4" fill="#868e96" stroke="#2b2a26" stroke-width="1" />
		<rect x="184.75" y="900" width="2.5" height="20" fill="#868e96" />
		<polygon points="184.75,920 187.25,920 186,924" fill="#868e96" />
	</g>
	<rect x="156" y="912" width="60" height="28" fill="#e9b872" stroke="#2b2a26" stroke-width="2" />
	<path d="M 162 922 Q 176 918 190 922 M 196 932 Q 204 928 212 932" fill="none" stroke="#b07a3a" stroke-width="1.5" />
	<rect x="114" y="940" width="108" height="8" fill="#8d5a2b" stroke="#2b2a26" stroke-width="2" />
	<rect x="120" y="948" width="6" height="32" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1.5" />
	<rect x="210" y="948" width="6" height="32" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1.5" />
	<!-- stopa horní polohy kladiva (statická, vidět i bez animace) -->
	<g transform="rotate(-30 70 886)" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="4 3">
		<line x1="127" y1="884" x2="186" y2="884" />
		<rect x="179" y="872" width="14" height="24" />
	</g>
	<line x1="66" y1="936" x2="62" y2="975" stroke="#495057" stroke-width="9" stroke-linecap="round" />
	<line x1="74" y1="936" x2="80" y2="975" stroke="#495057" stroke-width="9" stroke-linecap="round" />
	<ellipse cx="63" cy="977" rx="8" ry="3.5" fill="#2b2a26" />
	<ellipse cx="84" cy="977" rx="8" ry="3.5" fill="#2b2a26" />
	<rect x="67" y="874" width="6" height="9" fill="#f1c27d" />
	<rect x="61" y="880" width="18" height="58" rx="7" fill="#ffa94d" stroke="#2b2a26" stroke-width="2" />
	<circle cx="70" cy="864" r="13" fill="#f1c27d" stroke="#2b2a26" stroke-width="2" />
	<path d="M 57 862 Q 58 848 71 849 Q 82 850 83 860 Q 74 855 57 862 Z" fill="#5c3d1e" />
	<circle cx="76" cy="864" r="1.8" fill="#2b2a26" />
	<!-- paže s kladivem PŘED tělem a hlavou, vychází z ramene (rukáv) -->
	<g class="ruA">
		<line x1="70" y1="886" x2="126" y2="884" stroke="#2b2a26" stroke-width="10" stroke-linecap="round" />
		<line x1="70" y1="886" x2="126" y2="884" stroke="#f1c27d" stroke-width="6" stroke-linecap="round" />
		<circle cx="70" cy="886" r="7" fill="#ffa94d" stroke="#2b2a26" stroke-width="2" />
		<line x1="131" y1="884" x2="186" y2="884" stroke="#8d5a2b" stroke-width="6" />
		<circle cx="127" cy="884" r="6" fill="#f1c27d" stroke="#2b2a26" stroke-width="2" />
		<rect x="179" y="872" width="14" height="24" fill="#868e96" stroke="#2b2a26" stroke-width="2" />
	</g>
	<text x="130" y="1016" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a26">nízko</text>
	<text x="130" y="1044" text-anchor="middle" font-size="21" fill="#2b2a26">hřebík trochu</text>

	<!-- scéna B: zvednuto vysoko -->
	<g class="hB">
		<rect x="380" y="908" width="12" height="4" fill="#868e96" stroke="#2b2a26" stroke-width="1" />
		<rect x="384.75" y="912" width="2.5" height="20" fill="#868e96" />
		<polygon points="384.75,932 387.25,932 386,936" fill="#868e96" />
	</g>
	<rect x="356" y="912" width="60" height="28" fill="#e9b872" stroke="#2b2a26" stroke-width="2" />
	<path d="M 362 922 Q 376 918 390 922 M 396 932 Q 404 928 412 932" fill="none" stroke="#b07a3a" stroke-width="1.5" />
	<rect x="314" y="940" width="108" height="8" fill="#8d5a2b" stroke="#2b2a26" stroke-width="2" />
	<rect x="320" y="948" width="6" height="32" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1.5" />
	<rect x="410" y="948" width="6" height="32" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1.5" />
	<g transform="rotate(-100 270 886)" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="4 3">
		<line x1="327" y1="896" x2="386" y2="896" />
		<rect x="379" y="884" width="14" height="24" />
	</g>
	<line x1="266" y1="936" x2="262" y2="975" stroke="#495057" stroke-width="9" stroke-linecap="round" />
	<line x1="274" y1="936" x2="280" y2="975" stroke="#495057" stroke-width="9" stroke-linecap="round" />
	<ellipse cx="263" cy="977" rx="8" ry="3.5" fill="#2b2a26" />
	<ellipse cx="284" cy="977" rx="8" ry="3.5" fill="#2b2a26" />
	<rect x="267" y="874" width="6" height="9" fill="#f1c27d" />
	<rect x="261" y="880" width="18" height="58" rx="7" fill="#ffa94d" stroke="#2b2a26" stroke-width="2" />
	<circle cx="270" cy="864" r="13" fill="#f1c27d" stroke="#2b2a26" stroke-width="2" />
	<path d="M 257 862 Q 258 848 271 849 Q 282 850 283 860 Q 274 855 257 862 Z" fill="#5c3d1e" />
	<circle cx="276" cy="864" r="1.8" fill="#2b2a26" />
	<g class="ruB">
		<line x1="270" y1="886" x2="326" y2="896" stroke="#2b2a26" stroke-width="10" stroke-linecap="round" />
		<line x1="270" y1="886" x2="326" y2="896" stroke="#f1c27d" stroke-width="6" stroke-linecap="round" />
		<circle cx="270" cy="886" r="7" fill="#ffa94d" stroke="#2b2a26" stroke-width="2" />
		<line x1="331" y1="896" x2="386" y2="896" stroke="#8d5a2b" stroke-width="6" />
		<circle cx="327" cy="896" r="6" fill="#f1c27d" stroke="#2b2a26" stroke-width="2" />
		<rect x="379" y="884" width="14" height="24" fill="#868e96" stroke="#2b2a26" stroke-width="2" />
	</g>
	<text x="330" y="1016" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a26">vysoko</text>
	<text x="330" y="1044" text-anchor="middle" font-size="21" fill="#2b2a26">hřebík hlouběji</text>

	</g>
</svg>
