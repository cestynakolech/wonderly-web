<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Příhradový stožár vysokého napětí s výstražnou cedulí. Jeden drát se utrhl a visí dolů, mezi jeho koncem a zemí přeskakuje elektrický oblouk a jiskří.Dítě stojí daleko a varuje: Nepřibližuj se, volej 112. Vysoké napětí může přeskočit vzduchem i bez dotyku.">
<style>
.oblouk { animation: obl 1.6s steps(1) infinite; }
@keyframes obl { 0% { opacity: 1; } 12% { opacity: 0.2; } 20% { opacity: 1; } 55% { opacity: 0; } 70% { opacity: 1; } }
.jis { animation: jis 0.8s steps(1) infinite; }
@keyframes jis { 0% { opacity: 1; } 50% { opacity: 0.15; } }
@media (prefers-reduced-motion: reduce) { .oblouk, .jis { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="634" rx="14" fill="#f8f9fa"/>

