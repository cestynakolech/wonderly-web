@keyframes f42 { 0%, 66% { opacity: 0; } 67%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
@keyframes z42 { 0%, 66% { opacity: 0; } 67% { opacity: 1; } 72%, 100% { opacity: 0; } }
.s4n { animation: s4n 9s linear infinite; }
