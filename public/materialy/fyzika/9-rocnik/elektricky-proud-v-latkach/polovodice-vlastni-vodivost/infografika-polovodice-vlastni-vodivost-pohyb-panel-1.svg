		<rect x="20" y="10" width="420" height="720" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/>
		<circle cx="52" cy="44" r="17" fill="#2b2a26"/>
		<text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
		<text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Ohřev: kov a křemík</text>
		<text x="34" y="96" font-size="21" fill="#2b2a26">Oba zahříváme stejně.</text>
		<text x="34" y="124" font-size="21" fill="#2b2a26">Ručička ukazuje proud.</text>

		<!-- levý sloupec: kov -->
