		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Kolik řidič uvidí?</text>
		<text x="40" y="96" font-size="20" fill="#2b2a26">Zleva jede auto, zakrývá ho dům.</text>
