			<rect x="22" y="480" width="416" height="12" fill="#69db7c" />
			<!-- terč na stojanu (z boku), barevné kruhy na přední straně -->
			<path d="M406 370L392 480M406 370L422 480" fill="none" stroke="#7a5c12" stroke-width="5" stroke-linecap="round" />
