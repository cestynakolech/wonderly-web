<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Mixážní pult s pěti kanály. Každý kanál má nahoře otočné ovladače a dole posuvný ovladač. Animace: některé posuvné ovladače se posouvají nahoru a dolů a jeden otočný ovladač se otáčí – tak se nastavuje zvuk.">
<style>
/* Předloha: PDF lekce 30, s. 10 (foto mixážního pultu s posuvnými a otočnými ovladači); foto nahrazeno kresbou.
   Ovladače se pohybují plynule ve smyčce; bez animace stojí ve výchozí poloze. */
.f1 { animation: f1 5s ease-in-out infinite; }
.f2 { animation: f2 7s ease-in-out infinite; }
.f3 { animation: f3 6s ease-in-out infinite; }
@keyframes f1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-90px); } }
@keyframes f2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(70px); } }
@keyframes f3 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-60px); } }
.kn { transform-box: fill-box; transform-origin: center; animation: kn 6s ease-in-out infinite; }
@keyframes kn { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(120deg); } }
@media (prefers-reduced-motion: reduce) { .f1, .f2, .f3, .kn { animation: none; } }
</style>
