		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Dočasný a trvalý magnet</text>
		<text x="40" y="96" font-size="20" fill="#2b2a26">Dvě tyče, každá z jiné oceli.</text>
		<g class="a2s0" opacity="0"><text x="40" y="124" font-size="22" font-weight="bold" fill="#2b2a26">Magnety jsou přiložené.</text></g>
		<g class="a2s1"><text x="40" y="124" font-size="22" font-weight="bold" fill="#2b2a26">Magnety jsme oddálili.</text></g>
		<g class="a2s2" opacity="0"><text x="40" y="124" font-size="22" font-weight="bold" fill="#2b2a26">Magnety přikládáme zpět.</text></g>
