 y="221" width="14" height="18" rx="3" fill="#495057"/><rect x="364" y="221" width="14" height="18" rx="3" fill="#495057"/><rect x="236" y="225" width="128" height="10" rx="5" fill="#9c4a17"/><text x="300" y="266" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">měděný drát – vodič</text><text class="sz" x="300" y="135" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Žárovka svítí.</text><text class="so" x="300" y="135" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Spínač otevřený.</text><path d="M20 290H580" stroke="#ced4da" stroke-width="2"/><path d="M90 398V350H170M250 350H510V390M510 450V490H372M228 490H90V442" fill="none" stroke="#212529" stroke-width="4" stroke-linecap="square"/><path d="M56 412H124" stroke="#212529" stroke-width="4"/><path d="M73 428H107" stroke="#212529" stroke-width="9"/><path d="M31 402H49M40 393V411" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><path d="M31 442H49" stroke="#1864ab" stroke-width="4" stroke-linecap="round"/><circle cx="176" cy="350" r="6" fill="#fff" stroke="#212529" stroke-width="3"/><circle cx="244" cy="350" r="6" fill="#fff" stroke="#212529" stroke-width="3"/><path class="ps" style="transform-origin:176px 350px" d="M182 348L246 344" stroke="#212529" stroke-width="4" stroke-linecap="round"/><text x="258" y="338" font-size="22" fill="#212529" text-anchor="start">spínač</text><circle cx="510" cy="420" r="30" fill="#fff" stroke="#212529" stroke-width="4"/><path d="M488.8 398.8L531.2 441.2M531.2 398.8L488.8 441.2" stroke="#212529" stroke-width="4"/><text x="466" y="428" font-size="22" fill="#212529" text-anchor="end">žárovka</text><rect x="222" y="481" width="14" height="18" rx="3" fill="#495057"/><rect x="364" y="481" width="14" height="18" rx="3" fill="#495057"/><rect x="236" y="482" width="128" height="16" rx="8" fill="#fff3bf" stroke="#868e96" stroke-width="2.5"/><text x="300" y="526" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">plastová tyčinka – izolant</text><text class="sz" x="300" y="395" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Žárovka nesvítí.</text><text class="so" x="300" y="395" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Spínač otevřený.</text><path d="M20 550H580" stroke="#ced4da" stroke-width="2"/><text x="300" y="588" font-size="22" fill="#212529" text-anchor="middle">Kovy vedou proud dobře.</text><text x="300" y="620" font-size="22" fill="#212529" text-anchor="middle">Plast má velmi velký odpor: je to izolant.</text></svg>
