 stroke="#495057" stroke-width="2"/><g transform="translate(445,400) rotate(35)"><g class="rP"><polygon points="0,-70 5,0 0,70 -5,0" fill="#495057"/></g></g><circle cx="445" cy="400" r="5" fill="#212529"/><g transform="translate(478.3,352.5)"><g class="zP"><g><circle cx="0" cy="0" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M-6.6 0H6.6M0 -6.6V6.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g></g></g><g><circle cx="465" cy="198" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M458.4 198H471.6M465 191.4V204.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g><circle cx="445" cy="466" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M438.4 466H451.6M445 459.4V472.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g class="sestup"><rect x="365" y="134" width="160" height="56" rx="26" fill="#d0ebff" stroke="#495057" stroke-width="2.5"/><g><circle cx="385" cy="147" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M378.4 147H391.6M385 140.4V153.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g><circle cx="415" cy="147" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M408.4 147H421.6M415 140.4V153.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g><circle cx="445" cy="147" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M438.4 147H451.6M445 140.4V153.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g><circle cx="475" cy="147" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M468.4 147H481.6M475 140.4V153.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g><circle cx="505" cy="147" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M498.4 147H511.6M505 140.4V153.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(475,175)"><g class="n1"><g><circle cx="0" cy="0" r="12" fill="#1864ab" stroke="#212529" stroke-width="1.5"/><path d="M-6.6 0H6.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g></g></g><g transform="translate(415,175)"><g class="n2"><g><circle cx="0" cy="0" r="12" fill="#1864ab" stroke="#212529" stroke-width="1.5"/><path d="M-6.6 0H6.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g></g></g><g transform="translate(445,175)"><g class="n3"><g><circle cx="0" cy="0" r="12" fill="#1864ab" stroke="#212529" stroke-width="1.5"/><path d="M-6.6 0H6.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g></g></g></g><text class="pt" x="155" y="570" font-size="22" fill="#212529" text-anchor="middle">elektrony přejdou</text><text class="pt" x="155" y="598" font-size="22" fill="#212529" text-anchor="middle">z hřebene na elektroskop</text><text class="pt" x="445" y="570" font-size="22" fill="#212529" text-anchor="middle">elektrony přejdou</text><text class="pt" x="445" y="598" font-size="22" fill="#212529" text-anchor="middle">z elektroskopu na tyč</text><text class="zt" x="300" y="650" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Ručička se vychýlí v obou případech –</text><text class="zt" x="300" y="678" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">výchylka neurčí znaménko náboje.</text></g>
