" font-weight="bold" fill="#a63d07" text-anchor="middle">I</text><path d="M470 385L444 385L444 377L420 390L444 403L444 395L470 395Z" fill="#e8590c" stroke="#a63d07" stroke-width="2" stroke-linejoin="round"/><text x="445" y="366" font-size="24" font-weight="bold" fill="#a63d07" text-anchor="middle">I</text><rect x="30" y="482" width="540" height="134" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="2.5"/><text x="300" y="518" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle" xml:space="preserve">R₁ : R₂ = 2 : 1   →   I₁ : I₂ = 1 : 2</text><text x="300" y="556" font-size="22" fill="#212529" text-anchor="middle">Menším odporem teče větší proud.</text><text x="300" y="596" font-size="26" font-weight="bold" fill="#a63d07" text-anchor="middle">I = I₁ + I₂</text>
</svg>
