<svg viewBox="0 3302 460 566" width="460" height="566" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Využití elektrolýzy: při elektrolýze se na elektrodách vylučují látky. Výroba čistých látek: chlor z roztoku soli, vodík a kyslík z vody, hliník z rudy (elektrometalurgie). Pokovování: zlacení šperků, pomědění mincí, pozinkování plechů, chromování. Proč pokovovat: cena, lesklý vzhled a ochrana před korozí (rezivěním)." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Proud v kapalinách 6/6: Využití elektrolýzy</title>
	<defs></defs>
	<rect x="0" y="3302" width="460" height="566" fill="#f8f9fa"/>
	<g id="panel-6"><rect x="26" y="3318" width="420" height="546" rx="12" fill="#dee2e6"/><rect x="20" y="3312" width="420" height="546" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="3346" r="17" fill="#2b2a26"/><text x="52" y="3354" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">6</text><text x="80" y="3355" font-size="25" font-weight="bold" fill="#2b2a26">Využití elektrolýzy</text><text x="34" y="3394" font-size="21" fill="#2b2a26">Při elektrolýze se na elektrodách</text><text x="34" y="3422" font-size="21" fill="#2b2a26">vylučují látky. K čemu to je?</text><rect x="34" y="3440" width="392" height="128" rx="8" fill="#fff" stroke="#ced4da" stroke-width="2"/><rect x="34" y="3578" width="392" height="128" rx="8" fill="#fff" stroke="#ced4da" stroke-width="2"/><rect x="34" y="3716" width="392" height="128" rx="8" fill="#fff" stroke="#ced4da" stroke-width="2"/><rect x="52" y="3470" width="44" height="70" rx="6" fill="#ced4da" stroke="#343a40" stroke-width="2"/><rect x="56" y="3464" width="36" height="8" rx="3" fill="#adb5bd" stroke="#343a40" stroke-width="1.5"/><line x1="60" y1="3480" x2="60" y2="3532" stroke="#fff" stroke-width="3"/><text x="74" y="3514" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">Al</text><text x="116" y="3472" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Výroba čistých látek</tspan></text><text x="116" y="3500" font-size="21" fill="#2b2a26">chlor z roztoku soli, vodík</text><text x="116" y="3528" font-size="21" fill="#2b2a26">a kyslík z vody, hliník</text><text x="116" y="3556" font-size="21" fill="#2b2a26">z rudy (elektrometalurgie)</text><circle cx="74" cy="3642" r="28" fill="#d9822b" stroke="#a35d16" stroke-width="3"/><circle cx="74" cy="3642" r="20" fill="none" stroke="#a35d16" stroke-width="2"/><text x="74" y="3650" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="116" y="3610" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Pokovování</tspan></text><text x="116" y="3638" font-size="21" fill="#2b2a26">zlacení šperků, pomědění</text><text x="116" y="3666" font-size="21" fill="#2b2a26">mincí, pozinkování plechů,</text><text x="116" y="3694" font-size="21" fill="#2b2a26">chromování</text><rect x="48" y="3766" width="52" height="26" fill="#adb5bd" stroke="#343a40" stroke-width="2"/><rect x="48" y="3758" width="52" height="8" fill="#e9ecef" stroke="#343a40" stroke-width="1.5"/><rect x="48" y="3792" width="52" height="8" fill="#e9ecef" stroke="#343a40" stroke-width="1.5"/><text x="116" y="3748" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Proč pokovovat?</tspan></text><text x="116" y="3776" font-size="21" fill="#2b2a26">cena, lesklý vzhled</text><text x="116" y="3804" font-size="21" fill="#2b2a26">a ochrana před korozí</text><text x="116" y="3832" font-size="21" fill="#2b2a26">(rezivěním)</text></g>
</svg>
