		<clipPath id="q1-orez-si"><rect x="263" y="319" width="134" height="88"/></clipPath>
		<g id="q1-elektron"><circle cx="0" cy="0" r="11" fill="#1971c2" stroke="#0b4f8a" stroke-width="1.5"/><text x="0" y="7" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">−</text></g>
		<g id="q1-dira"><circle cx="0" cy="0" r="11" fill="#fff" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="4 3"/><text x="0" y="7.5" font-size="21" font-weight="bold" text-anchor="middle" fill="#1b6b2d">+</text></g>
		<g id="q1-atom-kov"><circle cx="0" cy="0" r="9" fill="#868e96" stroke="#495057" stroke-width="2"/></g>
		<g id="q1-atom-si"><circle cx="0" cy="0" r="10" fill="#ffa94d" stroke="#e8590c" stroke-width="2"/></g>
		<g id="q1-kahan">
