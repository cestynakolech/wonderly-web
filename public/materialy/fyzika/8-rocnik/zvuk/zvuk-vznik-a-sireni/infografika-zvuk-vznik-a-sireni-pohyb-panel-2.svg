			<circle class="tl" style="animation-delay:1.193s" cx="370" cy="282" r="7" fill="#4dabf7" stroke="#1864ab" stroke-width="2" />
			<circle class="tl" style="animation-delay:1.267s" cx="390" cy="282" r="7" fill="#4dabf7" stroke="#1864ab" stroke-width="2" />
			<circle class="tl" style="animation-delay:1.341s" cx="410" cy="282" r="7" fill="#4dabf7" stroke="#1864ab" stroke-width="2" />
		</g>

		<!-- řádek 3: ocel (částice vázané — šedá spojnice) -->
		<text x="40" y="340" font-size="20" font-weight="bold" fill="#2b2a26">ocel <tspan font-weight="normal" fill="#495057">5 000 m/s</tspan></text>
		<text class="c1" x="430" y="340" text-anchor="end" font-size="20" font-weight="bold" fill="#2b2a26">1. v cíli</text>
		<path d="M428 344V392" stroke="#495057" stroke-width="2" stroke-dasharray="5 4" />
		<path d="M70 368H415" stroke="#495057" stroke-width="3" />
		<rect class="tl" x="40" y="346" width="8" height="44" rx="2" fill="#e8590c" stroke="#2b2a26" stroke-width="2" />
		<g>
			<circle class="tl" style="animation-delay:0.024s" cx="70" cy="368" r="6" fill="#868e96" stroke="#343a40" stroke-width="2" />
