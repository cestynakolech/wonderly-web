<svg viewBox="0 0 460 610" width="460" height="610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pokus: ke zdroji jsou za sebou připojeny měděný drát s malým odporem a odporový drát s velkým odporem, oběma prochází stejný proud. Po zapnutí se ohřeje jen odporový drát, měděný zůstane chladný. Když zvýšíme napětí zdroje, ručka ampérmetru ukáže větší proud a odporový drát se rozžhaví víc. Čím větší odpor a čím větší proud, tím víc tepla. Využití: topná spirála, vařič, žehlička, pájka" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Elektrická energie a její přeměny 2/3: Odpor a proud rozhodují</title>
	<style>
		.fa { animation: fa 10s linear infinite; } .fb { animation: fb 10s linear infinite; } .fc { animation: fc 10s linear infinite; }
		.rb { animation: rb 10s linear infinite; } .rc { animation: rc 10s linear infinite; }
		.tb { animation: tb 10s linear infinite; } .tc { animation: tc 10s linear infinite; }
		.ruc { transform-box: view-box; transform-origin: 130px 330px; animation: ruc 10s ease-in-out infinite; }
		.kno { transform-box: view-box; transform-origin: 216px 372px; animation: kno 10s ease-in-out infinite; }
		.fb.pb { animation-name: fb, pb; animation-duration: 10s, 0.9s; animation-timing-function: linear; animation-iteration-count: infinite; }
		.fc.pc { animation-name: fc, pc; animation-duration: 10s, 0.35s; animation-timing-function: linear; animation-iteration-count: infinite; }
		@keyframes fa { 0% { opacity: 1; } 14% { opacity: 1; } 15% { opacity: 0; } 95% { opacity: 0; } 96% { opacity: 1; } 100% { opacity: 1; } }
		@keyframes fb { 0% { opacity: 0; } 14% { opacity: 0; } 15% { opacity: 1; } 54% { opacity: 1; } 55% { opacity: 0; } 100% { opacity: 0; } }
		@keyframes fc { 0% { opacity: 0; } 54% { opacity: 0; } 55% { opacity: 1; } 94% { opacity: 1; } 95% { opacity: 0; } 100% { opacity: 0; } }
		@keyframes rb { 0% { opacity: 0; } 15% { opacity: 0; } 30% { opacity: 0.85; } 55% { opacity: 0.85; } 60% { opacity: 0; } 100% { opacity: 0; } }
		@keyframes rc { 0% { opacity: 0; } 55% { opacity: 0; } 65% { opacity: 1; } 94% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
		@keyframes tb { 0% { opacity: 0; } 25% { opacity: 0; } 35% { opacity: 1; } 94% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
		@keyframes tc { 0% { opacity: 0; } 60% { opacity: 0; } 70% { opacity: 1; } 94% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
		@keyframes ruc { 0% { transform: rotate(-55deg); } 14% { transform: rotate(-55deg); } 18% { transform: rotate(-25deg); } 54% { transform: rotate(-25deg); } 58% { transform: rotate(30deg); } 94% { transform: rotate(30deg); } 97% { transform: rotate(-55deg); } 100% { transform: rotate(-55deg); } }
		@keyframes kno { 0% { transform: rotate(-60deg); } 13% { transform: rotate(-60deg); } 15% { transform: rotate(-15deg); } 52% { transform: rotate(-15deg); } 55% { transform: rotate(50deg); } 94% { transform: rotate(50deg); } 96% { transform: rotate(-60deg); } 100% { transform: rotate(-60deg); } }
		@keyframes pb { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -18; } }
		@keyframes pc { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -18; } }
		@media (prefers-reduced-motion: reduce) { .fa, .fb, .fc, .rb, .rc, .tb, .tc, .ruc, .kno, .fb.pb, .fc.pc { animation: none; } .ruc { transform: rotate(30deg); } .kno { transform: rotate(50deg); } }
	</style>
