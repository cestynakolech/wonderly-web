<svg viewBox="0 2062 460 640" width="460" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pružná a trvalá deformace: síla může změnit tvar tělesa. Ruka táhne pružinu připevněnou ke zdi silou F, pružina se natáhne, po puštění se vrátí do původní délky — pružná deformace, stejně jako míč. Prst zmáčkne kouli modelíny na placku, po odtažení prstu modelína zůstane zmáčknutá, čárkovaně je původní kulatý tvar — trvalá deformace, stejně jako plech nebo auto po nárazu" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
