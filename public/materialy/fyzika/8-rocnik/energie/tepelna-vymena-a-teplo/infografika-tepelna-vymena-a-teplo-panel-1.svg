<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 460 670" width="460" height="670" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tepelná výměna: dotknou se dvě tělesa s různou teplotou, rychlejší částice teplejšího tělesa narážejí do pomalejších a předají jim část energie, rychlé zpomalí a pomalé zrychlí. Teplejšímu tělesu vnitřní energie klesá, chladnějšímu roste; výměna skončí, až se teploty vyrovnají.">
	<title>Tepelná výměna a teplo 1/6: Tepelná výměna</title>
	<!-- Panel 1/6 výřezu z infografika-tepelna-vymena-a-teplo.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.zmiz { animation: zmiz 6s linear infinite; }
		.objev { opacity: 0; animation: objev 6s linear infinite; }
		.p1-th-h { animation: p1-th-h 6s ease-in-out infinite; }
		.p1-th-c { animation: p1-th-c 6s ease-in-out infinite; }
		.p1-dl { animation: p1-dl 6s ease-in-out infinite; }
		.p1-hl { animation: p1-hl 6s ease-in-out infinite; }
		.p1-dr { animation: p1-dr 6s ease-in-out infinite; }
		.p1-hr { animation: p1-hr 6s ease-in-out infinite; }
		@keyframes zmiz { 0%, 92% { opacity: 1; } 100% { opacity: 0; } }
		@keyframes objev { 0%, 92% { opacity: 0; } 100% { opacity: 1; } }
		@keyframes p1-th-h { 0%, 10% { transform: scaleY(1.6000); } 50%, 100% { transform: scaleY(1); } }
		@keyframes p1-th-c { 0%, 10% { transform: scaleY(0.5333); } 50%, 100% { transform: scaleY(1); } }
		@keyframes p1-dl { 0%, 10% { transform: scaleX(1.7368); } 50%, 100% { transform: scaleX(1); } }
		@keyframes p1-hl { 0%, 10% { transform: translateX(14px); } 50%, 100% { transform: translateX(0); } }
		@keyframes p1-dr { 0%, 10% { transform: scaleX(0.6842); } 50%, 100% { transform: scaleX(1); } }
		@keyframes p1-hr { 0%, 10% { transform: translateX(-6px); } 50%, 100% { transform: translateX(0); } }
		@media (prefers-reduced-motion: reduce) { .zmiz, .objev, .p1-th-h, .p1-th-c, .p1-dl, .p1-hl, .p1-dr, .p1-hr { animation: none; } }
	</style>
	<rect x="0" y="70" width="460" height="670" fill="#f8f9fa" />
