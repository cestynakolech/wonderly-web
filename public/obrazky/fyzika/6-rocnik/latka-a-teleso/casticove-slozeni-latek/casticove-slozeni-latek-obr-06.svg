<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Čtyři kádinky s vodou za sebou, mezi nimi šipky. V první kape kapátko kapku fialového inkoustu do vody. Ve druhé inkoust klesá v proužcích. Ve třetí se rozptyluje do fialového mráčku. Ve čtvrté je celá voda stejně světle fialová. Dole: Nemícháme – částice se promíchají samy. Tomu říkáme difuze.">
<style>
/* Předloha: PDF Částicové složení látek, oddíl DIFUZE (obrázek čtyř kádinek s kapkou inkoustu, mezi nimi šipky). Překresleno kresbou, stejné uspořádání (4 kádinky v řadě, šipky z modré do fialové). Animovaná je jen kapka z kapátka (smyčka 3 s) – samotný děj difuze ukazuje animace obr-07. Bez animace = kapka skrytá, kádinky beze změny. */
@keyframes kapka { 0% { transform: translate(80px, 120px); opacity: 0 } 10% { transform: translate(80px, 122px); opacity: 1 } 45% { transform: translate(80px, 156px); opacity: 1 } 50% { transform: translate(80px, 162px); opacity: 0 } 100% { transform: translate(80px, 162px); opacity: 0 } }
@keyframes kruh { 0% { opacity: 0; transform: scale(0.2, 0.2) } 46% { opacity: 0; transform: scale(0.2, 0.2) } 55% { opacity: 1; transform: scale(0.6, 0.6) } 80% { opacity: 0; transform: scale(1, 1) } 100% { opacity: 0; transform: scale(1, 1) } }
.kp { animation: kapka 3s ease-in infinite; }
.kr { animation: kruh 3s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .dr { stroke-dasharray: none !important; } }
</style>
