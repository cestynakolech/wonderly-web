<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t04">
  <title id="t04">Ryba pod hladinou: paprsek od ryby se na hladině láme od kolmice, oko ho prodlouží rovně zpět a vidí rybu výš, než skutečně je</title>
  <style>
    .d1{animation:d1 8s linear infinite}
    .d2{animation:d2 8s linear infinite}
    .a1{animation:a1 8s linear infinite}
    .a2{animation:a2 8s linear infinite}
    .f{animation:f 8s linear infinite}
    @keyframes d1{0%{stroke-dashoffset:100;opacity:1}25%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes d2{0%,30%{stroke-dashoffset:100;opacity:1}55%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes a1{0%,24%{opacity:0}26%,92%{opacity:1}98%,100%{opacity:0}}
    @keyframes a2{0%,54%{opacity:0}56%,92%{opacity:1}98%,100%{opacity:0}}
    @keyframes f{0%,58%{opacity:0}68%,92%{opacity:1}98%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.d1,.d2,.a1,.a2,.f{animation:none}}
  </style>
  <!-- prostředí -->
  <rect x="0" y="0" width="600" height="200" fill="#f1f8ff"/>
  <rect x="0" y="200" width="600" height="240" fill="#a5d8ff"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="#1971c2" stroke-width="2"/>
  <text x="20" y="34" font-size="24" font-weight="bold" fill="#212529">Ryba pod hladinou: vidíme ji jinde</text>
  <text x="30" y="182" font-size="22" fill="#212529">vzduch</text>
  <text x="30" y="232" font-size="22" font-weight="bold" fill="#0b3d6b">voda</text>
  <!-- kolmice dopadu -->
  <line x1="330" y1="110" x2="330" y2="300" stroke="#212529" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="338" y="130" font-size="22" font-style="italic" fill="#212529">k</text>
  <text x="360" y="244" font-size="22" font-weight="bold" fill="#0b3d6b">lom OD kolmice</text>
  <!-- oko -->
  <path d="M515,35 Q545,13 575,35 Q545,57 515,35 Z" fill="#ffffff" stroke="#212529" stroke-width="3"/>
  <circle cx="537" cy="40" r="9" fill="#1c7ed6"/>
  <circle cx="535" cy="42" r="4" fill="#212529"/>
  <text x="545" y="80" text-anchor="middle" font-size="22" fill="#212529">oko</text>
  <!-- skutečná ryba -->
  <g>
    <polygon points="118,390 90,368 90,412" fill="#fcc419" stroke="#e67700" stroke-width="2"/>
    <ellipse cx="152" cy="390" rx="40" ry="22" fill="#fcc419" stroke="#e67700" stroke-width="2"/>
    <path d="M140,370 Q152,356 166,371" fill="#ffa94d" stroke="#e67700" stroke-width="2"/>
    <circle cx="176" cy="384" r="4" fill="#212529"/>
  </g>
  <text x="215" y="425" font-size="22" font-weight="bold" fill="#0b3d6b">tady ryba skutečně je</text>
  <!-- zdánlivá ryba a prodloužení paprsku -->
  <g class="f">
    <!-- zpětné prodloužení: tečkovaná oranžová (šedá čárkovaná = v obr. 01/02 „směr bez lomu“) -->
    <line x1="330" y1="200" x2="192" y2="307.5" stroke="#e8590c" stroke-width="4" stroke-dasharray="1 9" stroke-linecap="round"/>
    <line x1="22" y1="93" x2="58" y2="93" stroke="#e8590c" stroke-width="4" stroke-dasharray="1 9" stroke-linecap="round"/>
    <text x="66" y="100" font-size="20" fill="#212529">prodloužení paprsku zpět</text>
    <g opacity="0.55">
      <polygon points="118,309 90,287 90,331" fill="#ffffff" stroke="#e67700" stroke-width="2" stroke-dasharray="6 4"/>
      <ellipse cx="152" cy="309" rx="40" ry="22" fill="#ffffff" stroke="#e67700" stroke-width="2" stroke-dasharray="6 4"/>
      <circle cx="176" cy="303" r="4" fill="#212529"/>
    </g>
    <text x="40" y="268" font-size="22" font-weight="bold" fill="#0b3d6b">tady ji vidí oko</text>
  </g>
  <!-- paprsky -->
  <line class="d1" x1="190" y1="390" x2="330" y2="200" pathLength="100" stroke-dasharray="100" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
  <polygon class="a1" points="260.0,295.0 255.4,316.4 240.9,305.8" fill="#e8590c"/>
  <line class="d2" x1="330" y1="200" x2="497.3" y2="69.8" pathLength="100" stroke-dasharray="100" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
  <polygon class="a2" points="511.5,58.7 501.2,78.1 490.2,63.9" fill="#e8590c"/>
</svg>
