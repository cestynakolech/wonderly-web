<svg viewBox="0 1534 460 462" width="460" height="462" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Na čem závisí: vnitřní energie závisí na počtu částic v tělese a na teplotě tělesa, ne na pohybu tělesa ani na tom, jak vysoko je. Stejný míč se stejnou teplotou v klidu na stole i kutálející se má stejnou vnitřní energii." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Vnitřní energie tělesa 4/7: Na čem závisí</title>
	<!-- Panel 4/7 výřezu z infografika-vnitrni-energie-telesa.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.kut { animation: kut 5s linear infinite; }
		.toc { transform-box: fill-box; transform-origin: center; animation: toc 5s linear infinite; }
		@keyframes kut { 0% { transform: translateX(-150px); } 70%, 100% { transform: translateX(0); } }
		@keyframes toc { 0% { transform: rotate(-358deg); } 70%, 100% { transform: rotate(0deg); } }
		@media (prefers-reduced-motion: reduce) {
			.kut, .toc { animation: none; }
		}
	</style>
	<defs>
		<g id="mic">
			<circle r="24" fill="#fff" stroke="#2b2a26" stroke-width="2.5" />
			<path d="M 0 0 L 0 -24 A 24 24 0 0 1 20.8 12 Z" fill="#40c057" />
			<path d="M 0 0 L 20.8 12 A 24 24 0 0 1 -20.8 12 Z" fill="#1971c2" />
			<path d="M 0 0 L -20.8 12 A 24 24 0 0 1 0 -24 Z" fill="#fcc419" />
			<circle r="24" fill="none" stroke="#2b2a26" stroke-width="2.5" />
			<circle r="4" fill="#fff" stroke="#2b2a26" stroke-width="1.5" />
		</g>
	</defs>
	<rect x="0" y="1534" width="460" height="462" fill="#f3f1ea" />
	<g id="panel-4" transform="translate(0,1544)">
		<rect x="26" y="6" width="420" height="436" rx="10" fill="#2b2a26" />
		<rect x="20" y="0" width="420" height="436" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="34" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="41" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">4</text>
		<text x="80" y="43" font-size="28" font-weight="bold" fill="#2b2a26">Na čem závisí</text>

		<path d="M 37 73 L 43 80 L 54 66" fill="none" stroke="#1e7a34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
		<text x="64" y="80" font-size="21" fill="#2b2a26">na <tspan font-weight="bold">počtu částic</tspan> v tělese</text>
		<path d="M 37 103 L 43 110 L 54 96" fill="none" stroke="#1e7a34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
		<text x="64" y="110" font-size="21" fill="#2b2a26">na <tspan font-weight="bold">teplotě</tspan> tělesa</text>
		<path d="M 38 127 L 52 141 M 52 127 L 38 141" fill="none" stroke="#495057" stroke-width="4" stroke-linecap="round" />
		<text x="64" y="140" font-size="21" fill="#2b2a26"><tspan font-weight="bold">ne</tspan> na pohybu tělesa</text>
		<path d="M 38 157 L 52 171 M 52 157 L 38 171" fill="none" stroke="#495057" stroke-width="4" stroke-linecap="round" />
		<text x="64" y="170" font-size="21" fill="#2b2a26"><tspan font-weight="bold">ne</tspan> na tom, jak vysoko je</text>

		<!-- podlaha -->
		<rect x="34" y="340" width="392" height="14" fill="#c9a77c" stroke="#2b2a26" stroke-width="2" />
		<line x1="200" y1="347" x2="270" y2="347" stroke="#8d5a2b" stroke-width="2" />
		<!-- stůl s míčem v klidu -->
		<rect x="56" y="278" width="8" height="62" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1.5" />
		<rect x="158" y="278" width="8" height="62" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1.5" />
		<rect x="46" y="268" width="130" height="10" rx="2" fill="#d9a066" stroke="#2b2a26" stroke-width="2" />
		<use href="#mic" transform="translate(111,244)" />
		<text x="111" y="208" text-anchor="middle" font-size="21" fill="#495057">v klidu, výš</text>
		<!-- míč se kutálí po podlaze -->
		<text x="305" y="270" text-anchor="middle" font-size="21" fill="#495057">kutálí se</text>
		<g transform="translate(380,316)">
			<g class="kut"><g class="toc"><use href="#mic" /></g></g>
		</g>

		<text x="230" y="386" text-anchor="middle" font-size="21" fill="#2b2a26">stejný míč se stejnou teplotou</text>
		<text x="230" y="416" text-anchor="middle" font-size="21" fill="#2b2a26">→ <tspan font-weight="bold">stejná vnitřní energie</tspan></text>
	</g>
</svg>
