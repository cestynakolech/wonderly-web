<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 830" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Třetí Keplerův zákon na příkladu. Země obíhá ve vzdálenosti 1 AU a oběh jí trvá 1 rok. Vymyšlená planeta obíhá ve vzdálenosti 4 AU. Podle zákona je 1 na druhou ku T na druhou rovno 1 na třetí ku 4 na třetí, tedy T na druhou je 64 a T je 8 let. Animace: než planeta oběhne Slunce jednou, Země ho oběhne osmkrát, počítadla oběhů se zvyšují.">
