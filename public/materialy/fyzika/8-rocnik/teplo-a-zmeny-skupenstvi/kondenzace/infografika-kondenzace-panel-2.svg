<svg viewBox="0 0 460 720" width="460" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Obláček u úst a orosené brýle: vlevo stojí chlapec venku v mrazu a z úst mu vychází bílý obláček, protože teplý vlhký dech se ochladí a vzniknou drobné kapičky. Vpravo stejný chlapec přišel do vyhřáté místnosti s radiátorem a jeho studené brýle se postupně zamlží. Lupa ukazuje sklo brýlí, na kterém přibývají drobné kapky." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Kondenzace (kapalnění) 2/3: Obláček u úst a orosené brýle</title>
	<defs>
		<clipPath id="kon2-lupa"><circle cx="372" cy="204" r="48"/></clipPath>
		<marker id="kon2-sip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#495057"/></marker>
	</defs>
	<style>
		.k2-dech { transform-box: fill-box; transform-origin: left center; animation: k2dech 3s ease-out infinite; }
		@keyframes k2dech { 0% { transform: translate(0px, 0px) scale(0.3); opacity: 0; } 15% { opacity: 0.95; } 60% { opacity: 0.85; } 100% { transform: translate(34px, -34px) scale(1.3); opacity: 0; } }
		.k2-snih { animation: k2snih 4s linear infinite; }
		@keyframes k2snih { 0% { transform: translate(0px, -20px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(6px, 70px); opacity: 0; } }
		.k2-mlha { animation: k2mlha 10s linear infinite; }
		@keyframes k2mlha { 0%, 8% { opacity: 0; } 40%, 90% { opacity: 0.85; } 100% { opacity: 0; } }
		.k2-kap { transform-box: fill-box; transform-origin: center; animation: k2kap 10s linear infinite; }
		@keyframes k2kap { 0%, 8% { transform: scale(0); opacity: 0; } 12% { transform: scale(0.4); opacity: 1; } 45% { transform: scale(1); opacity: 1; } 90% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
		.k2-tep { animation: k2tep 1.2s ease-in-out infinite alternate; }
		@keyframes k2tep { from { opacity: 0.35; } to { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) { .k2-dech, .k2-snih, .k2-mlha, .k2-kap, .k2-tep { animation: none; } .k2-mlha { opacity: 0.85; } }
	</style>
	<rect x="0" y="0" width="460" height="720" fill="#f8f9fa"/>
	<g id="panel-2">
		<rect x="26" y="16" width="420" height="696" rx="12" fill="#dee2e6"/>
		<rect x="20" y="10" width="420" height="696" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/>
		<circle cx="52" cy="44" r="17" fill="#2b2a26"/>
		<text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">2</text>
		<text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Obláček a orosené brýle</text>
		<text x="34" y="92" font-size="21" fill="#2b2a26">Z mrazu přijdeme do teplé místnosti.</text>

		<!-- venku -->
		<path d="M38,110 Q30,110 30,118 L30,522 Q30,530 38,530 L228,530 L228,110 Z" fill="#dbe9f5"/>
		<rect x="30" y="470" width="198" height="60" fill="#ffffff"/>
		<line x1="30" y1="470" x2="228" y2="470" stroke="#adb5bd" stroke-width="2"/>
		<text x="42" y="138" font-size="18" font-weight="bold" fill="#1971c2">venku: mráz</text>
		<g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
			<path class="k2-snih" d="M51,170 h10 M56,165 v10 M52,166 l8,8 M60,166 l-8,8"/>
			<path class="k2-snih" style="animation-delay:-1s" d="M91,210 h10 M96,205 v10 M92,206 l8,8 M100,206 l-8,8"/>
			<path class="k2-snih" style="animation-delay:-2s" d="M181,200 h10 M186,195 v10 M182,196 l8,8 M190,196 l-8,8"/>
			<path class="k2-snih" style="animation-delay:-3s" d="M61,380 h10 M66,375 v10 M62,376 l8,8 M70,376 l-8,8"/>
			<path class="k2-snih" style="animation-delay:-1.5s" d="M195,390 h10 M200,385 v10 M196,386 l8,8 M204,386 l-8,8"/>
			<path class="k2-snih" style="animation-delay:-2.5s" d="M45,250 h10 M50,245 v10 M46,246 l8,8 M54,246 l-8,8"/>
		</g>

		<!-- uvnitř -->
		<rect x="232" y="110" width="198" height="360" fill="#fff4e6"/>
		<path d="M232,470 L430,470 L430,522 Q430,530 422,530 L232,530 Z" fill="#d9b38c"/>
		<line x1="232" y1="470" x2="430" y2="470" stroke="#a9744f" stroke-width="2"/>
		<text x="244" y="138" font-size="18" font-weight="bold" fill="#c92a2a">uvnitř: teplo</text>
		<!-- stěna se dveřmi -->
		<rect x="226" y="110" width="8" height="420" fill="#868e96"/>
		<line x1="160" y1="180" x2="300" y2="180" stroke="#495057" stroke-width="3" marker-end="url(#kon2-sip)"/>
		<text x="218" y="170" font-size="15" text-anchor="end" fill="#495057">přijde dovnitř</text>
		<!-- radiátor -->
		<g fill="#f1f3f5" stroke="#868e96" stroke-width="1.5">
			<rect x="392" y="396" width="10" height="64" rx="3"/><rect x="404" y="396" width="10" height="64" rx="3"/><rect x="416" y="396" width="10" height="64" rx="3"/>
		</g>
		<g class="k2-tep" fill="none" stroke="#c92a2a" stroke-width="2.5" stroke-linecap="round">
			<path d="M398,388 q-5,-8 0,-16 q5,-8 0,-16"/>
			<path d="M420,388 q-5,-8 0,-16 q5,-8 0,-16"/>
		</g>

		<!-- chlapec venku -->
		<g>
			<rect x="104" y="410" width="14" height="56" rx="5" fill="#343a40"/>
			<rect x="122" y="410" width="14" height="56" rx="5" fill="#343a40"/>
			<ellipse cx="109" cy="467" rx="11" ry="5" fill="#212529"/><ellipse cx="131" cy="467" rx="11" ry="5" fill="#212529"/>
			<rect x="92" y="330" width="56" height="88" rx="16" fill="#1971c2" stroke="#1864ab" stroke-width="1.5"/>
			<rect x="80" y="338" width="14" height="64" rx="6" fill="#1971c2" stroke="#1864ab" stroke-width="1.5"/>
			<rect x="146" y="338" width="14" height="64" rx="6" fill="#1971c2" stroke="#1864ab" stroke-width="1.5"/>
			<rect x="96" y="326" width="48" height="12" rx="6" fill="#c92a2a"/>
			<circle cx="120" cy="300" r="26" fill="#f4c7a1" stroke="#b07a50" stroke-width="1.5"/>
			<path d="M94,294 Q94,268 120,268 Q146,268 146,294 Z" fill="#c92a2a"/>
			<circle cx="120" cy="264" r="6" fill="#ffffff" stroke="#adb5bd"/>
			<g fill="#ffffff" fill-opacity="0.3" stroke="#2b2a26" stroke-width="2"><rect x="103" y="298" width="14" height="11" rx="3"/><rect x="123" y="298" width="14" height="11" rx="3"/></g>
			<line x1="117" y1="303" x2="123" y2="303" stroke="#2b2a26" stroke-width="2"/>
			<ellipse cx="128" cy="317" rx="4" ry="3" fill="#7a3b2e"/>
			<g class="k2-dech" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5">
				<path d="M134,316 q4,-12 16,-8 q6,-10 18,-4 q12,0 10,12 q8,8 -2,14 q-6,8 -18,4 q-10,6 -18,-2 q-10,-4 -6,-16 z"/>
			</g>
		</g>
		<!-- stálý obláček u úst, aby popisek „kapičky“ nikdy nevisel v prázdnu -->
		<path d="M136,312 q3,-8 11,-5 q5,-7 13,-3 q9,0 7,9 q6,6 -2,10 q-5,6 -13,3 q-7,4 -13,-2 q-7,-3 -3,-12 z" fill="#ffffff" fill-opacity="0.9" stroke="#adb5bd" stroke-width="1.2"/>
		<text x="180" y="270" font-size="15" text-anchor="middle" fill="#495057">kapičky</text>
		<line x1="174" y1="276" x2="158" y2="302" stroke="#495057" stroke-width="1.5"/>

		<!-- chlapec uvnitř -->
		<g>
			<rect x="314" y="410" width="14" height="56" rx="5" fill="#343a40"/>
			<rect x="332" y="410" width="14" height="56" rx="5" fill="#343a40"/>
			<ellipse cx="319" cy="467" rx="11" ry="5" fill="#212529"/><ellipse cx="341" cy="467" rx="11" ry="5" fill="#212529"/>
			<rect x="302" y="330" width="56" height="88" rx="16" fill="#1971c2" stroke="#1864ab" stroke-width="1.5"/>
			<rect x="290" y="338" width="14" height="64" rx="6" fill="#1971c2" stroke="#1864ab" stroke-width="1.5"/>
			<rect x="356" y="338" width="14" height="64" rx="6" fill="#1971c2" stroke="#1864ab" stroke-width="1.5"/>
			<rect x="306" y="326" width="48" height="12" rx="6" fill="#c92a2a"/>
			<circle cx="330" cy="300" r="26" fill="#f4c7a1" stroke="#b07a50" stroke-width="1.5"/>
			<path d="M304,294 Q304,268 330,268 Q356,268 356,294 Z" fill="#c92a2a"/>
			<circle cx="330" cy="264" r="6" fill="#ffffff" stroke="#adb5bd"/>
			<rect x="313" y="298" width="14" height="11" rx="3" fill="#ffffff" fill-opacity="0.3"/>
			<rect x="333" y="298" width="14" height="11" rx="3" fill="#ffffff" fill-opacity="0.3"/>
			<rect class="k2-mlha" x="313" y="298" width="14" height="11" rx="3" fill="#adb5bd" opacity="0"/>
			<rect class="k2-mlha" x="333" y="298" width="14" height="11" rx="3" fill="#adb5bd" opacity="0"/>
			<g fill="#a5d8ff" stroke="#1c7ed6" stroke-width="0.8">
				<circle class="k2-kap" cx="317" cy="302" r="1.8"/><circle class="k2-kap" style="animation-delay:-0.5s" cx="323" cy="306" r="1.8"/>
				<circle class="k2-kap" style="animation-delay:-0.3s" cx="337" cy="303" r="1.8"/><circle class="k2-kap" style="animation-delay:-0.8s" cx="343" cy="306" r="1.8"/>
			</g>
			<g fill="none" stroke="#2b2a26" stroke-width="2"><rect x="313" y="298" width="14" height="11" rx="3"/><rect x="333" y="298" width="14" height="11" rx="3"/></g>
			<line x1="327" y1="303" x2="333" y2="303" stroke="#2b2a26" stroke-width="2"/>
			<path d="M323,318 q7,4 14,0" fill="none" stroke="#7a3b2e" stroke-width="2" stroke-linecap="round"/>
		</g>

		<!-- lupa na brýle -->
		<line x1="346" y1="296" x2="358" y2="250" stroke="#2b2a26" stroke-width="2"/>
		<circle cx="372" cy="204" r="48" fill="#e7f5ff"/>
		<g clip-path="url(#kon2-lupa)">
			<rect class="k2-mlha" x="324" y="156" width="96" height="96" fill="#dee2e6" opacity="0"/>
			<g fill="#a5d8ff" stroke="#1c7ed6" stroke-width="1">
				<path class="k2-kap" d="M352,172 c-5,8 -5,13 0,14 c5,-1 5,-6 0,-14 z"/>
				<path class="k2-kap" style="animation-delay:-0.6s" d="M376,164 c-5,8 -5,13 0,14 c5,-1 5,-6 0,-14 z"/>
				<path class="k2-kap" style="animation-delay:-1.2s" d="M396,178 c-5,8 -5,13 0,14 c5,-1 5,-6 0,-14 z"/>
				<path class="k2-kap" style="animation-delay:-0.3s" d="M342,198 c-5,8 -5,13 0,14 c5,-1 5,-6 0,-14 z"/>
				<path class="k2-kap" style="animation-delay:-0.9s" d="M366,190 c-5,8 -5,13 0,14 c5,-1 5,-6 0,-14 z"/>
				<path class="k2-kap" style="animation-delay:-1.5s" d="M390,204 c-5,8 -5,13 0,14 c5,-1 5,-6 0,-14 z"/>
				<path class="k2-kap" style="animation-delay:-0.4s" d="M404,216 c-5,8 -5,13 0,14 c5,-1 5,-6 0,-14 z"/>
				<path class="k2-kap" style="animation-delay:-1.1s" d="M356,222 c-5,8 -5,13 0,14 c5,-1 5,-6 0,-14 z"/>
				<path class="k2-kap" style="animation-delay:-0.7s" d="M380,228 c-5,8 -5,13 0,14 c5,-1 5,-6 0,-14 z"/>
			</g>
		</g>
		<circle cx="372" cy="204" r="48" fill="none" stroke="#2b2a26" stroke-width="4"/>

		<!-- legenda a závěr -->
		<path d="M52,550 c-5,8 -5,13 0,14 c5,-1 5,-6 0,-14 z" fill="#a5d8ff" stroke="#1c7ed6" stroke-width="1.5"/>
		<text x="70" y="564" font-size="17" fill="#2b2a26">kapička vody na skle brýlí</text>
		<text x="34" y="600" font-size="18" fill="#2b2a26">Venku se teplý vlhký dech ochladí:</text>
		<text x="34" y="624" font-size="18" fill="#2b2a26">vidíme obláček drobných kapiček.</text>
		<text x="34" y="656" font-size="18" fill="#2b2a26">Uvnitř se vlhký vzduch ochladí</text>
		<text x="34" y="680" font-size="18" fill="#2b2a26">u studených brýlí a ty se orosí.</text>
	</g>
</svg>
