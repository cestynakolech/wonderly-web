<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace ve dvou částech. Nahoře trolej nad kolejí: drát vede od stožáru ke kladce na druhém stožáru a přes ni dolů k závaží. V létě se drát protáhne a závaží klesne níž, drát zůstane napnutý. V zimě se drát zkrátí a závaží vytáhne nahoru. Dole dva sloupy elektrického vedení s prověšenými dráty: v létě se dráty protáhnou a prověsí víc, v zimě se zkrátí a prověsí méně.">
<style>
/* Předloha: PDF Teplotní roztažnost — Dráty elektrického vedení, troleje pro elektrické lokomotivy a trolejbusy;
   řešení: troleje jsou napínány pomocí závaží, dráty vedení se staví prověšené. V PDF bez obrázku, kresba podle textu.
   Bez čísel; změny jsou pro názornost zvětšené. Závaží: léto o 30 níž než v zimě (lano 110 / 80, scaleY 0,727).
   Dráty vedení: prohnutí 60 v létě, 30 v zimě (scaleY 0,5 kolem úrovně úchytů, tloušťka čáry se neškáluje).
   Smyčka 10 s jako u kolejnic: 0–10 % zima, 40–60 % léto. Bez animace = léto. */
@keyframes lano { 0%, 10% { transform: translate(494px, 160px) scale(1, 0.7115); } 40%, 60% { transform: translate(494px, 160px) scale(1, 1); } 90%, 100% { transform: translate(494px, 160px) scale(1, 0.7115); } }
@keyframes zav { 0%, 10% { transform: translate(0, -30px); } 40%, 60% { transform: translate(0, 0); } 90%, 100% { transform: translate(0, -30px); } }
@keyframes pro { 0%, 10% { transform: translate(0, 440px) scale(1, 0.5); } 40%, 60% { transform: translate(0, 440px) scale(1, 1); } 90%, 100% { transform: translate(0, 440px) scale(1, 0.5); } }
@keyframes pro2 { 0%, 10% { transform: translate(0, 470px) scale(1, 0.5); } 40%, 60% { transform: translate(0, 470px) scale(1, 1); } 90%, 100% { transform: translate(0, 470px) scale(1, 0.5); } }
@keyframes leto { 0%, 20% { opacity: 0; } 35%, 65% { opacity: 1; } 80%, 100% { opacity: 0; } }
@keyframes zima { 0%, 20% { opacity: 1; } 35%, 65% { opacity: 0; } 80%, 100% { opacity: 1; } }
.lano { animation: lano 10s ease-in-out infinite; } .zav { animation: zav 10s ease-in-out infinite; }
.pro { animation: pro 10s ease-in-out infinite; } .pro2 { animation: pro2 10s ease-in-out infinite; }
.leto { animation: leto 10s ease-in-out infinite; } .zima { animation: zima 10s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .lano, .zav, .pro, .pro2, .leto, .zima { animation: none; } }
</style>
<defs>
<linearGradient id="stozar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#868e96"/><stop offset="0.4" stop-color="#dee2e6"/><stop offset="1" stop-color="#495057"/></linearGradient>
<linearGradient id="beton" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ced4da"/><stop offset="0.4" stop-color="#f1f3f5"/><stop offset="1" stop-color="#adb5bd"/></linearGradient>
<linearGradient id="kotouc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#495057"/><stop offset="0.4" stop-color="#adb5bd"/><stop offset="1" stop-color="#343a40"/></linearGradient>
<radialGradient id="kladka" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#495057"/></radialGradient>
<g id="slunce"><circle r="16" fill="#fcc419" stroke="#f08c00" stroke-width="2"/><path d="M0 -28V-21M0 21V28M-28 0H-21M21 0H28M-20 -20L-15 -15M15 15L20 20M-20 20L-15 15M15 -15L20 -20" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/></g>
<g id="vlocka" stroke="#1971c2" stroke-width="3" stroke-linecap="round"><path d="M0 -24V24M-21 -12L21 12M-21 12L21 -12"/><path d="M-6 -18L0 -12L6 -18M-6 18L0 12L6 18"/></g>
</defs>
<rect x="3" y="3" width="594" height="654" rx="14" fill="#f8f9fa"/>
<rect x="70" y="16" width="460" height="54" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="300" y="52" font-size="26" fill="#212529" text-anchor="middle">Troleje a dráty vedení</text>
<g class="leto"><use href="#slunce" x="60" y="108"/><text x="96" y="116" font-size="22" font-weight="bold" fill="#c92a2a">v létě</text></g>
<g class="zima" opacity="0"><use href="#vlocka" x="60" y="108"/><text x="96" y="116" font-size="22" font-weight="bold" fill="#1864ab">v zimě</text></g>
<!-- trolej se závažím -->
<path d="M30 330H570" stroke="#868e96" stroke-width="4"/>
<path d="M40 322H460M40 312H460" stroke="#495057" stroke-width="4"/>
<g fill="#a0522d"><rect x="56" y="308" width="10" height="20"/><rect x="106" y="308" width="10" height="20"/><rect x="156" y="308" width="10" height="20"/><rect x="206" y="308" width="10" height="20"/><rect x="256" y="308" width="10" height="20"/><rect x="306" y="308" width="10" height="20"/><rect x="356" y="308" width="10" height="20"/><rect x="406" y="308" width="10" height="20"/></g>
<rect x="34" y="144" width="14" height="186" fill="url(#stozar)" stroke="#495057" stroke-width="1.5"/>
<path d="M48 160H76" stroke="#495057" stroke-width="5"/>
<rect x="462" y="144" width="14" height="186" fill="url(#stozar)" stroke="#495057" stroke-width="1.5"/>
<path d="M76 160H466" stroke="#212529" stroke-width="3"/>
<path d="M120 160V176M200 160V176M280 160V176M360 160V176M440 160V176" stroke="#495057" stroke-width="2"/>
<path d="M80 176H460" stroke="#b35900" stroke-width="4"/>
<circle cx="480" cy="160" r="14" fill="url(#kladka)" stroke="#212529" stroke-width="2"/><circle cx="480" cy="160" r="3" fill="#212529"/>
<path d="M466 160A14 14 0 0 1 494 160" fill="none" stroke="#212529" stroke-width="3"/>
<g class="lano" transform="translate(494 160)"><rect x="-1.5" y="0" width="3" height="104" fill="#212529"/></g>
<g class="zav"><rect x="476" y="264" width="36" height="12" rx="2" fill="url(#kotouc)" stroke="#212529"/><rect x="476" y="278" width="36" height="12" rx="2" fill="url(#kotouc)" stroke="#212529"/><rect x="476" y="292" width="36" height="12" rx="2" fill="url(#kotouc)" stroke="#212529"/></g>
<text x="270" y="206" font-size="21" fill="#212529" text-anchor="middle">trolej</text>
<text x="516" y="300" font-size="20" fill="#212529">závaží</text>
<text x="300" y="358" font-size="20" fill="#212529" text-anchor="middle">Závaží drží trolej napnutou.</text>
<!-- elektrické vedení s prověšenými dráty -->
<rect x="30" y="378" width="540" height="196" rx="10" fill="#fff" stroke="#868e96" stroke-width="2"/>
<path d="M70 556L80 420H96L106 556Z" fill="url(#beton)" stroke="#868e96" stroke-width="1.5"/>
<path d="M494 556L504 420H520L530 556Z" fill="url(#beton)" stroke="#868e96" stroke-width="1.5"/>
<path d="M66 440H110M490 440H534M66 470H110M490 470H534" stroke="#495057" stroke-width="5"/>
<path d="M30 556H570" stroke="#8ce99a" stroke-width="4"/>
<g class="pro" transform="translate(0 440)"><path d="M88 0Q300 120 512 0" fill="none" stroke="#212529" stroke-width="3" vector-effect="non-scaling-stroke"/></g>
<g class="pro2" transform="translate(0 470)"><path d="M88 0Q300 120 512 0" fill="none" stroke="#212529" stroke-width="3" vector-effect="non-scaling-stroke"/></g>
<text x="300" y="406" font-size="21" font-weight="bold" fill="#212529" text-anchor="middle">Dráty vedení jsou prověšené.</text>
<!-- stav -->
<text x="300" y="606" font-size="21" font-weight="bold" fill="#c92a2a" text-anchor="middle" class="leto">V létě se dráty protáhnou: závaží klesne,</text>
<text x="300" y="636" font-size="21" font-weight="bold" fill="#c92a2a" text-anchor="middle" class="leto">dráty vedení se prověsí víc.</text>
<text x="300" y="606" font-size="21" font-weight="bold" fill="#1864ab" text-anchor="middle" class="zima" opacity="0">V zimě se dráty zkrátí: závaží stoupne,</text>
<text x="300" y="636" font-size="21" font-weight="bold" fill="#1864ab" text-anchor="middle" class="zima" opacity="0">dráty vedení se prověsí méně.</text>
</svg>
