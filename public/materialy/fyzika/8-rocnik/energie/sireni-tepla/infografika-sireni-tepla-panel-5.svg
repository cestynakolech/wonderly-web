	<text x="434" y="250" font-size="19" fill="#2b2a26" font-weight="bold" text-anchor="end">odrazí</text>
	<text x="120" y="396" font-size="19" fill="#2b2a26" font-weight="bold" text-anchor="middle">černé tričko</text>
	<text x="320" y="396" font-size="19" fill="#2b2a26" font-weight="bold" text-anchor="middle">bílé tričko</text>
	<text x="26" y="436" font-size="22" fill="#2b2a26">Proto je v létě na slunci v černém</text>
<text x="26" y="464" font-size="22" fill="#2b2a26">tričku větší horko než v bílém.</text>
</svg>
