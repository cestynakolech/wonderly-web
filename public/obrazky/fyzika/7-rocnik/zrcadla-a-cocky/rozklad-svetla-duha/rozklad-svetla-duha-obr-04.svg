<stop offset="0" stop-color="#5c8a3a"/><stop offset="1" stop-color="#3f6b26"/>
</linearGradient>
<radialGradient id="r4slunce" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#fff9db"/><stop offset="0.55" stop-color="#ffd43b"/><stop offset="1" stop-color="#fab005"/>
</radialGradient>
<radialGradient id="r4zare" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#fff3bf" stop-opacity="0.9"/><stop offset="1" stop-color="#fff3bf" stop-opacity="0"/>
</radialGradient>
<linearGradient id="r4mrak" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#868e96"/><stop offset="1" stop-color="#495057"/>
</linearGradient>
