		<rect x="44" y="1946" width="92" height="72" rx="8" />
		<rect x="44" y="2034" width="92" height="72" rx="8" />
		<rect x="44" y="2122" width="92" height="72" rx="8" />
		<rect x="44" y="2210" width="92" height="72" rx="8" />
		<rect x="44" y="2298" width="92" height="72" rx="8" />
		<rect x="44" y="2386" width="92" height="72" rx="8" />
		<rect x="44" y="2474" width="92" height="72" rx="8" />
		<rect x="44" y="2562" width="92" height="72" rx="8" />
	</g>
	<!-- šipky mezi řádky -->
	<g stroke="#2b2a26" stroke-width="3">
		<line x1="90" y1="2020" x2="90" y2="2026" /><line x1="90" y1="2108" x2="90" y2="2114" />
		<line x1="90" y1="2196" x2="90" y2="2202" /><line x1="90" y1="2284" x2="90" y2="2290" />
		<line x1="90" y1="2372" x2="90" y2="2378" /><line x1="90" y1="2460" x2="90" y2="2466" />
		<line x1="90" y1="2548" x2="90" y2="2554" />
	</g>
	<g fill="#2b2a26">
