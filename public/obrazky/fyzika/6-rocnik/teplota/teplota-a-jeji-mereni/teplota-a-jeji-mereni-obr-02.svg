<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Galileův teploměr: vysoký skleněný válec s mosazným víčkem a podstavcem je plný průhledné kapaliny. V kapalině jsou barevné skleněné baňky, na každé visí kovový štítek. Tři baňky plovou nahoře, dvě klesly ke dnu. Takový teploměr s plovoucími baňkami vymyslel Galileo Galilei v 17. století.">
<style>
/* Předloha: PDF Teplota — fotografie skleněného válce s kapalinou a barevnými plovoucími baňkami se štítky
   (Galileův teploměr). Překresleno, ne kopie. Čísla na štítcích záměrně nejsou (ve výkladu nemají oporu).
   Baňky se jen lehce pohupují. Bez animace = klidový stav. */
@keyframes hup { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -6px); } }
.h1 { animation: hup 3s ease-in-out infinite; } .h2 { animation: hup 3.6s ease-in-out 0.4s infinite; } .h3 { animation: hup 3.2s ease-in-out 0.8s infinite; }
@media (prefers-reduced-motion: reduce) { .h1, .h2, .h3 { animation: none; } }
</style>
