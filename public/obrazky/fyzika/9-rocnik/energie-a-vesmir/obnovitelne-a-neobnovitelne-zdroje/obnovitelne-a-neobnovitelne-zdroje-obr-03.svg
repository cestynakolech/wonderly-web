<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Přečerpávací elektrárna Dlouhé stráně. Horní nádrž na vrcholu hory, dolní nádrž v údolí, mezi nimi potrubí a ve strojovně turbína s generátorem. V noci, když je elektřiny přebytek, se voda čerpá z dolní nádrže do horní. Ve dne ve špičce voda teče dolů, roztáčí turbínu a generátor dodává elektřinu do sítě.">
<style>
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes rotz { to { transform: rotate(-360deg); } }
.rot { animation: rot 1.6s linear infinite; }
@keyframes tok { to { stroke-dashoffset: -36; } }
@keyframes tokz { to { stroke-dashoffset: 36; } }
.tok { stroke-dasharray: 12 24; animation: tok 1s linear infinite; }
.tokz { stroke-dasharray: 12 24; animation: tokz 1s linear infinite; }
@keyframes el { to { stroke-dashoffset: -18; } }
@keyframes elz { to { stroke-dashoffset: 18; } }
.el { stroke-dasharray: 8 10; animation: el 0.6s linear infinite; }
.elz { stroke-dasharray: 8 10; animation: elz 0.6s linear infinite; }
.noc { opacity: 0; animation: noc 12s linear infinite; }
@keyframes noc { 0%, 64% { opacity: 1; } 66.7%, 100% { opacity: 0; } }
.den { animation: den 12s linear infinite; }
@keyframes den { 0%, 64% { opacity: 0; } 66.7%, 100% { opacity: 1; } }
.tma { opacity: 0; animation: tma 12s linear infinite; }
@keyframes tma { 0%, 62% { opacity: 0.45; } 68%, 97% { opacity: 0; } 100% { opacity: 0.45; } }
.horni { transform-origin: 150px 218px; animation: horni 12s linear infinite; }
@keyframes horni { 0% { transform: scaleY(0.25); } 64% { transform: scaleY(1); } 66.7% { transform: scaleY(1); } 100% { transform: scaleY(0.25); } }
.dolni { transform-origin: 515px 466px; animation: dolni 12s linear infinite; }
@keyframes dolni { 0% { transform: scaleY(1); } 64% { transform: scaleY(0.3); } 66.7% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }
.rotz { animation: rotz 1.6s linear infinite; }
/* Smyčka 12 s: NOC 8 s (čerpá vodu nahoru, elektřina ze sítě), DEN 4 s (voda teče dolů,
   turbína a generátor dodávají elektřinu do sítě). Poměr 8 : 4 odpovídá výpočtu ve výkladu.
   Horní nádrž překreslena podle fotografie v předloze (oválná nádrž na vrcholu hory).
   Klid: den, obě nádrže s vodou. */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
