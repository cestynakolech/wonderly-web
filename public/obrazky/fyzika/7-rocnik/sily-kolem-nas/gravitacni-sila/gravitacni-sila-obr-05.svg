<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 520" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Rámeček s příkladem: batoh o hmotnosti 2 kg, g = 10 N/kg, Fg = 2 kg krát 10 N/kg = 20 N. Bublina připomíná, že základní jednotka hmotnosti je kilogram.">
<defs>
<marker id="a-cer" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e03131"/></marker>
<marker id="a-mod" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1971c2"/></marker>
<marker id="a-zel" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2f9e44"/></marker>
<marker id="a-ora" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e8590c"/></marker>
<marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2b2a26"/></marker>
<marker id="a-sed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#495057"/></marker>
<marker id="a-zlu" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#f08c00"/></marker>
<marker id="a-fia" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#7048e8"/></marker>
<marker id="b-cer" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e03131"/></marker>
<marker id="b-zel" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#2f9e44"/></marker>
<marker id="b-mod" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#1971c2"/></marker>
<marker id="b-ora" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e8590c"/></marker>
<marker id="b-ink" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#2b2a26"/></marker>
</defs>
<rect x="3" y="3" width="954" height="514" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="480.0" y="44.0" font-size="26" font-weight="bold" fill="#2b2a26" text-anchor="middle">Příklad: gravitační síla působící na batoh</text>
<rect x="90.0" y="180.0" width="120.0" height="150.0" rx="26" fill="#f76707" stroke="#c2410c" stroke-width="4"/>
<rect x="104.0" y="256.0" width="92.0" height="56.0" rx="10" fill="#fd7e14" stroke="#c2410c" stroke-width="3"/>
<line x1="104.0" y1="272.0" x2="196.0" y2="272.0" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
<path d="M120,180 Q150,130 180,180" fill="none" stroke="#c2410c" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="150.0" y="224.0" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">2 kg</text>
<rect x="300.0" y="80.0" width="620.0" height="400.0" rx="14" fill="#fff8e1" stroke="#f08c00" stroke-width="3"/>
<text x="340.0" y="140.0" font-size="30" font-weight="bold" fill="#2b2a26" text-anchor="start">m = 2 kg</text>
<text x="340.0" y="190.0" font-size="30" font-weight="bold" fill="#2b2a26" text-anchor="start">g = 10 N/kg</text>
<text x="340.0" y="240.0" font-size="30" font-weight="bold" fill="#2b2a26" text-anchor="start">F<tspan font-size="18" dy="5">g</tspan> = ? N</text>
<line x1="340.0" y1="268.0" x2="880.0" y2="268.0" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round"/>
<text x="340.0" y="318.0" font-size="28" fill="#2b2a26" text-anchor="start">F<tspan font-size="18" dy="5">g</tspan> = m · g</text>
<text x="340.0" y="368.0" font-size="28" fill="#2b2a26" text-anchor="start">F<tspan font-size="18" dy="5">g</tspan> = 2 kg · 10 N/kg</text>
<text x="340.0" y="425.0" font-size="34" font-weight="bold" fill="#e03131" text-anchor="start">F<tspan font-size="18" dy="5">g</tspan> = 20 N</text>
<path d="M600,121 L528,134 L600,147 z" fill="#fff3bf" stroke="#f08c00" stroke-width="2" stroke-linejoin="round"/>
<rect x="600.0" y="96.0" width="290.0" height="76.0" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<rect x="597" y="123" width="6" height="22" fill="#fff3bf"/>
<text x="745.0" y="127.5" font-size="20" font-weight="bold" fill="#2b2a26" text-anchor="middle">Základní jednotka</text>
<text x="745.0" y="154.5" font-size="20" fill="#2b2a26" text-anchor="middle">hmotnosti: kilogram!</text>
</svg>
