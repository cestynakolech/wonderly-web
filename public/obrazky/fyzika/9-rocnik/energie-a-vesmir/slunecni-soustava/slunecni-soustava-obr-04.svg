<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kamenné planety: Merkur je nejmenší, plný kráterů a bez měsíce. Venuše má nejhustší atmosféru a na povrchu asi 460 stupňů Celsia. Země je jediná planeta s podmínkami pro život, obíhá kolem ní Měsíc. Mars je rudá planeta s měsíci Phobos a Deimos (nakreslené zvětšené). Animace: měsíce obíhají kolem planet, mraky Venuše se posouvají.">
<style>
.mraky { animation: mraky 10s linear infinite; }
@keyframes mraky { 0.000% { transform:translate(0px,0px) } 100.000% { transform:translate(-60px,0px) } }
.mes { transform-origin: 155px 489px; animation: mes 9s linear infinite; }
@keyframes mes { 0.000% { transform:rotate(0deg) } 100.000% { transform:rotate(-360deg) } }
.pho { transform-origin: 445px 489px; animation: pho 3s linear infinite; }
@keyframes pho { 0.000% { transform:rotate(0deg) } 100.000% { transform:rotate(-360deg) } }
.dei { transform-origin: 445px 489px; animation: dei 7s linear infinite; }
@keyframes dei { 0.000% { transform:rotate(120deg) } 100.000% { transform:rotate(-240deg) } }
@media (prefers-reduced-motion: reduce) { .mraky, .mes, .pho, .dei { animation: none; } }
/* Předloha: fotografie Merkuru, Venuše, Země a Marsu (nahrazeny kresbou). Poloměry planet v poměru Merkur 24 : Venuše 60 : Země 64 : Mars 32 (Mars poloviční průměr Země; Phobos a Deimos jsou nakresleny zvětšené, skutečně jsou asi 50–80× menší (Phobos ~56×, Deimos ~77×)). Animace: Měsíc 9 s, Phobos 3 s, Deimos 7 s, mraky Venuše 10 s. Bez animace = měsíce v klidu. */
