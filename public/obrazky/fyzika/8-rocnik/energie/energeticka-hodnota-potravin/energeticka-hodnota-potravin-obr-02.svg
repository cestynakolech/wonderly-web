<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: kluk v modrém tričku. Zleva k jeho ústům putuje jablko (potrava, cukry a tuky) a k nosu kyslík ze vzduchu. V trupu se rozzáří žluté světlo s popiskem chemická energie. Z trupu běží energie nahoru do mozku, kolem hlavy zablikají blesky (mozek, elektrická energie), a dolů do svalu na noze, noha se pohne (svaly, pohybová energie). Dole věta: Tělo spaluje cukry a tuky spolu s kyslíkem. Chemickou energii využije pro svaly a mozek.">
<style>
/* Předloha: PDF „Energetická hodnota potravin“ (8/2 Energie/6), s. 1, odrážky 1–4
   (potrava → tělo spaluje cukry a tuky s kyslíkem → chemická energie → svaly = pohybová, mozek = elektrická).
   PDF na straně nemá obrázek, animace ilustruje text strany. Cyklus 8 s:
   0–25 % jablko a kyslík doputují k ústům a nosu; 28–38 % rozzáří se chemická energie v těle;
   40–60 % energie běží do mozku a do svalu; 60–90 % blikají blesky u hlavy a noha se pohne; 92–100 % návrat.
   Bez animace (reduced-motion) = koncový stav: vše vidět, záře svítí, blesky svítí, šipky ukazují cestu. */
.jidlo { transform-origin: 86px 262px; animation: jidlo 8s ease-in-out infinite; }
.kys { transform-origin: 86px 112px; animation: kys 8s ease-in-out infinite; }
.zare { animation: zare 8s ease-in-out infinite; }
.pu { opacity: 0; animation: pu 8s ease-in-out infinite; }
.pd { opacity: 0; animation: pd 8s ease-in-out infinite; }
.blesk { animation: blesk 8s linear infinite; }
.noha { transform-origin: 302px 400px; animation: noha 8s ease-in-out infinite; }
@keyframes jidlo { 0%, 4% { transform: translate(0,0) scale(1); opacity: 1; } 24% { transform: translate(172px,-52px) scale(0.3); opacity: 1; } 29% { transform: translate(172px,-52px) scale(0.3); opacity: 0; } 92% { transform: translate(0,0) scale(1); opacity: 0; } 100% { transform: translate(0,0) scale(1); opacity: 1; } }
@keyframes kys { 0%, 4% { transform: translate(0,0) scale(1); opacity: 1; } 24% { transform: translate(172px,84px) scale(0.4); opacity: 1; } 29% { transform: translate(172px,84px) scale(0.4); opacity: 0; } 92% { transform: translate(0,0) scale(1); opacity: 0; } 100% { transform: translate(0,0) scale(1); opacity: 1; } }
@keyframes zare { 0%, 27% { opacity: 0.1; } 38%, 90% { opacity: 1; } 100% { opacity: 0.1; } }
@keyframes pu { 0%, 39% { transform: translate(0,0); opacity: 0; } 41% { opacity: 1; } 58% { transform: translate(12px,-122px); opacity: 1; } 62%, 100% { transform: translate(12px,-122px); opacity: 0; } }
@keyframes pd { 0%, 39% { transform: translate(0,0); opacity: 0; } 41% { opacity: 1; } 58% { transform: translate(20px,92px); opacity: 1; } 62%, 100% { transform: translate(20px,92px); opacity: 0; } }
@keyframes blesk { 0%, 59% { opacity: 0; } 60%, 66% { opacity: 1; } 67%, 70% { opacity: 0.2; } 71%, 90% { opacity: 1; } 91%, 100% { opacity: 0; } }
@keyframes noha { 0%, 60% { transform: rotate(0deg); } 68% { transform: rotate(-14deg); } 76% { transform: rotate(0deg); } 84% { transform: rotate(-14deg); } 90%, 100% { transform: rotate(0deg); } }
@media (prefers-reduced-motion: reduce) { .jidlo, .kys, .zare, .pu, .pd, .blesk, .noha { animation: none; } }
</style>
<defs>
<radialGradient id="jab" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ff8787"/><stop offset="1" stop-color="#c92a2a"/></radialGradient>
<radialGradient id="zar" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd43b" stop-opacity="1"/><stop offset="0.6" stop-color="#fcc419" stop-opacity="0.7"/><stop offset="1" stop-color="#fcc419" stop-opacity="0"/></radialGradient>
<linearGradient id="tri" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#339af0"/><stop offset="0.5" stop-color="#74c0fc"/><stop offset="1" stop-color="#339af0"/></linearGradient>
<linearGradient id="kal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#343a40"/><stop offset="0.5" stop-color="#5c636a"/><stop offset="1" stop-color="#343a40"/></linearGradient>
<marker id="m-sed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#495057"/></marker>
<marker id="m-mod" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1864ab"/></marker>
<marker id="m-ora" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#d9480f"/></marker>
</defs>
<rect x="3" y="3" width="714" height="634" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="360" y="44" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Odkud bere tělo energii</text>

<!-- ===== POSTAVA ===== -->
<!-- levá noha -->
<rect x="212" y="393" width="52" height="140" rx="10" fill="url(#kal)" stroke="#212529" stroke-width="2"/>
<ellipse cx="232" cy="538" rx="34" ry="12" fill="#212529"/>
<!-- pravá noha se svalem -->
<g class="noha">
<rect x="276" y="393" width="52" height="140" rx="10" fill="url(#kal)" stroke="#212529" stroke-width="2"/>
<ellipse cx="308" cy="538" rx="34" ry="12" fill="#212529"/>
<ellipse cx="302" cy="445" rx="18" ry="36" fill="#ff8787" stroke="#c92a2a" stroke-width="3"/>
<path d="M294,420 q8,25 0,50 M302,414 q8,31 0,62 M310,420 q8,25 0,50" fill="none" stroke="#c92a2a" stroke-width="2" opacity="0.7"/>
</g>
<!-- ruce -->
<path d="M192,305 L186,385" stroke="#e0a77a" stroke-width="22" stroke-linecap="round"/>
<path d="M348,305 L354,385" stroke="#e0a77a" stroke-width="22" stroke-linecap="round"/>
<circle cx="186" cy="392" r="13" fill="#f3c9a0" stroke="#c08457" stroke-width="2"/>
<circle cx="354" cy="392" r="13" fill="#f3c9a0" stroke="#c08457" stroke-width="2"/>
<!-- krk a tričko -->
<rect x="258" y="218" width="24" height="24" fill="#f3c9a0" stroke="#c08457" stroke-width="2"/>
<path d="M205,245 L235,235 Q270,252 305,235 L335,245 L360,305 L335,315 L330,397 L210,397 L205,315 L180,305 Z" fill="url(#tri)" stroke="#1864ab" stroke-width="3" stroke-linejoin="round"/>
<path d="M235,235 Q270,256 305,235" fill="none" stroke="#1864ab" stroke-width="3"/>
<!-- záře chemické energie v těle -->
<circle class="zare" cx="270" cy="322" r="62" fill="url(#zar)"/>
<!-- hlava -->
<circle cx="220" cy="182" r="10" fill="#f3c9a0" stroke="#c08457" stroke-width="2"/>
<circle cx="320" cy="182" r="10" fill="#f3c9a0" stroke="#c08457" stroke-width="2"/>
<circle cx="270" cy="175" r="50" fill="#f3c9a0" stroke="#c08457" stroke-width="3"/>
<path d="M220,170 C216,126 246,118 270,118 C300,118 326,130 320,172 C312,150 292,140 270,144 C248,140 228,150 220,170 Z" fill="#7a4a1f" stroke="#5c3d1e" stroke-width="2"/>
<!-- mozek (průhled) -->
<path d="M240,160 C232,146 244,132 258,136 C262,126 280,126 284,136 C298,132 308,146 300,160 C302,172 288,176 280,170 C274,178 264,178 258,170 C250,176 236,172 240,160 Z" fill="#fcc2d7" stroke="#a61e4d" stroke-width="3"/>
<path d="M256,146 q6,6 0,14 M270,140 q-6,10 2,20 M284,146 q-6,6 0,14" fill="none" stroke="#a61e4d" stroke-width="2"/>
<!-- obličej -->
<circle cx="252" cy="190" r="5" fill="#212529"/>
<circle cx="288" cy="190" r="5" fill="#212529"/>
<path d="M270,192 q-6,10 0,13" fill="none" stroke="#c08457" stroke-width="3" stroke-linecap="round"/>
<path d="M256,208 Q270,219 284,208" fill="none" stroke="#a61e4d" stroke-width="3" stroke-linecap="round"/>

<!-- blesky u hlavy (elektrická energie mozku) -->
<g class="blesk" fill="#ffd43b" stroke="#d9480f" stroke-width="2" stroke-linejoin="round">
<path d="M332,108 L350,122 L341,125 L356,142 L333,128 L342,125 Z"/>
<path d="M208,108 L190,122 L199,125 L184,142 L207,128 L198,125 Z"/>
</g>

<!-- cesty energie v těle -->
<path d="M292,296 C302,262 318,226 304,176" fill="none" stroke="#d9480f" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#m-ora)"/>
<path d="M280,345 C290,375 296,400 300,424" fill="none" stroke="#d9480f" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#m-ora)"/>
<circle class="pu" cx="292" cy="300" r="10" fill="#ffd43b" stroke="#d9480f" stroke-width="3"/>
<circle class="pd" cx="280" cy="340" r="10" fill="#ffd43b" stroke="#d9480f" stroke-width="3"/>

<!-- ===== VSTUPY (vlevo) ===== -->
<path d="M124,124 C180,140 220,170 258,194" fill="none" stroke="#1864ab" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-mod)"/>
<path d="M128,258 C180,240 220,222 252,212" fill="none" stroke="#495057" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-sed)"/>
<g class="kys">
<circle cx="72" cy="112" r="17" fill="#a5d8ff" stroke="#1864ab" stroke-width="3"/>
<circle cx="100" cy="112" r="17" fill="#a5d8ff" stroke="#1864ab" stroke-width="3"/>
<text x="72" y="119" font-size="19" font-weight="bold" fill="#0b3d6b" text-anchor="middle">O</text>
<text x="100" y="119" font-size="19" font-weight="bold" fill="#0b3d6b" text-anchor="middle">O</text>
</g>
<text x="86" y="162" font-size="22" font-weight="bold" fill="#1864ab" text-anchor="middle">kyslík</text>
<text x="86" y="188" font-size="20" fill="#212529" text-anchor="middle">ze vzduchu</text>
<g class="jidlo">
<g transform="translate(86,262)">
<path d="M0,-24 C18,-40 46,-26 42,4 C40,32 18,40 0,32 C-18,40 -40,32 -42,4 C-46,-26 -18,-40 0,-24 Z" fill="url(#jab)" stroke="#8b1a1a" stroke-width="3"/>
<path d="M0,-24 q2,-14 8,-22" fill="none" stroke="#5c3d1e" stroke-width="4" stroke-linecap="round"/>
<path d="M6,-40 q18,-14 30,-4 q-14,14 -30,4 Z" fill="#40c057" stroke="#2b8a3e" stroke-width="2"/>
<ellipse cx="-18" cy="-8" rx="8" ry="12" fill="#ffffff" opacity="0.45"/>
</g>
</g>
<text x="86" y="330" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">potrava</text>
<text x="86" y="356" font-size="20" fill="#212529" text-anchor="middle">cukry a tuky</text>

<!-- ===== VÝSTUPY (vpravo) ===== -->
<path d="M396,166 L316,162" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#m-sed)"/>
<text x="404" y="160" font-size="24" font-weight="bold" fill="#a61e4d">mozek</text>
<text x="404" y="188" font-size="22" fill="#212529">elektrická energie</text>
<path d="M396,318 L336,320" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#m-sed)"/>
<text x="404" y="314" font-size="24" font-weight="bold" fill="#9c4600">chemická energie</text>
<text x="404" y="342" font-size="22" fill="#212529">uvolněná z potravy</text>
<path d="M396,450 L326,446" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#m-sed)"/>
<text x="404" y="444" font-size="24" font-weight="bold" fill="#c92a2a">svaly</text>
<text x="404" y="472" font-size="22" fill="#212529">pohybová energie</text>

<!-- ===== SHRNUTÍ ===== -->
<rect x="30" y="562" width="660" height="66" rx="14" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
<text x="360" y="589" font-size="21" fill="#212529" text-anchor="middle">Tělo spaluje cukry a tuky spolu s kyslíkem.</text>
<text x="360" y="616" font-size="21" fill="#212529" text-anchor="middle">Chemickou energii využije pro svaly a mozek.</text>
</svg>
