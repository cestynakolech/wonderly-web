<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dva měděné dráty stejné tloušťky, kratší a delší, s průhledem dovnitř. Uvnitř jsou šedé atomy mřížky a modré volné elektrony. Elektrony letí od záporné svorky ke kladné a narážejí do atomů; čárkovaná čára ukazuje lomenou dráhu jednoho elektronu. V kratším drátu elektron narazí do méně atomů – drát má menší odpor. V delším drátu narazí do více atomů – drát má větší odpor. Animace: elektrony se pohybují a odrážejí od atomů.">
<style>
/* Předloha: PDF lekce 26, s. 1 (délka vodiče: u dlouhých vodičů se elektrony setkají s velkým množstvím atomů;
   čím delší vodič, tím větší odpor). Obrázek v PDF chybí, děj nakreslen podle textu.
   Elektrony letí stejnou rychlostí 70 px/s po lomené dráze, body zlomu = dotyk s atomem mřížky
   (kratší drát 3 nárazy, delší 7). Bez animace (reduced-motion) = elektrony stojí v místech nárazů. */
@keyframes pk { 0.0% { transform: translate(72px, 210px); } 15.4% { transform: translate(100px, 193px); } 51.9% { transform: translate(170px, 227px); } 88.4% { transform: translate(240px, 193px); } 100.0% { transform: translate(258px, 210px); } }
.ek { animation: pk 3.05s linear infinite; }
@keyframes pd { 0.0% { transform: translate(72px, 420px); } 6.2% { transform: translate(100px, 403px); } 21.1% { transform: translate(170px, 437px); } 35.9% { transform: translate(240px, 403px); } 50.8% { transform: translate(310px, 437px); } 65.6% { transform: translate(380px, 403px); } 80.4% { transform: translate(450px, 437px); } 95.3% { transform: translate(520px, 403px); } 100.0% { transform: translate(538px, 420px); } }
.ed { animation: pd 7.49s linear infinite; }
@media (prefers-reduced-motion: reduce) { .ek, .ed { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="614" rx="14" fill="#f8f9fa"/>

<defs><radialGradient id="castice" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ced4da"/></radialGradient><linearGradient id="med" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9894f"/><stop offset="0.28" stop-color="#f0b98a"/><stop offset="0.55" stop-color="#b8642a"/><stop offset="1" stop-color="#6b3410"/></linearGradient><radialGradient id="rez" cx="40%" cy="40%" r="70%"><stop offset="0" stop-color="#f3c79d"/><stop offset="1" stop-color="#c77a3f"/></radialGradient></defs>
