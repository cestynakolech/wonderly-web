		<circle cx="391" cy="322" r="8" fill="#94d82d" stroke="#5c940d" stroke-width="1.5"/>
		<text x="369" y="356" font-size="15" text-anchor="middle" fill="#2b2a26">balení jídla</text>
	</g>
	<g>
		<!-- průhledný vak s tričkem a ventilem -->
		<rect x="331" y="386" width="76" height="48" rx="6" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2"/>
