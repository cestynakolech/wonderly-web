<g class="s1" opacity="0"><text x="300" y="706" font-size="20" fill="#212529" text-anchor="middle" font-weight="bold">Nabitou plastovou tyčí se dotkneme destičky.</text><text x="300" y="736" font-size="20" fill="#212529" text-anchor="middle">Náboj přejde na kovové části elektroskopu.</text></g>
<g class="s2"><text x="300" y="706" font-size="20" fill="#212529" text-anchor="middle" font-weight="bold">Tyčinka i ručička mají stejný náboj (−),</text><text x="300" y="736" font-size="20" fill="#212529" text-anchor="middle">odpuzují se a ručička se vychýlí.</text></g>
<g class="s3" opacity="0"><text x="300" y="706" font-size="20" fill="#212529" text-anchor="middle" font-weight="bold">Vybití: dotkneme se destičky rukou (uzemnění).</text><text x="300" y="736" font-size="20" fill="#212529" text-anchor="middle">Náboj odejde do země, ručička se vrátí.</text></g>
</svg>
