<svg xmlns="http://www.w3.org/2000/svg" width="460" height="520" viewBox="0 0 460 520" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Síla F popisuje, jak na sebe tělesa navzájem působí. Dotykem: ruka tlačí bednu, ruka působí na bednu a bedna na ruku, šipky jsou stejně dlouhé a mají opačný směr. Na dálku: magnet a hřebík se přitahují navzájem. Působení je vždy vzájemné.">
	<title>Síla 1/6: Vzájemné působení těles</title>
	<!-- Panel 1/6 k infografika-sila.svg (W47, 14. 10. 2026); bez animace = koncový stav. -->
	<style>
		.p1-ruka { animation: p1-ruka 7s ease-in-out infinite; }
		@keyframes p1-ruka { 0% { transform: translateX(-22px) } 8% { transform: translateX(-22px) } 22% { transform: translateX(0px) } 84% { transform: translateX(0px) } 96% { transform: translateX(-22px) } 100% { transform: translateX(-22px) } }
