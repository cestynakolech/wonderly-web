	<g transform="translate(96,360)"><g class="h3-in1"><line x1="0" y1="0" x2="34" y2="0" stroke="#c92a2a" stroke-width="4" /><path d="M32,-7 L46,0 L32,7 z" fill="#c92a2a" /></g></g>
	<text x="26" y="256" font-size="19" fill="#a61e1e" font-weight="bold">teplo</text>
	<text x="26" y="278" font-size="19" fill="#a61e1e" font-weight="bold">z kuchyně</text>
