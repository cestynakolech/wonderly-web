<svg viewBox="0 1740 460 972" width="460" height="972" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Energie nezmizí: energii nelze vytvořit ani zničit, jen se přeměňuje v jiný druh. Cesta energie od Slunce k žárovce: jaderná energie v jádru Slunce, světelná energie ze Slunce, chemická energie uložená v rostlinách, chemická energie v uhlí z rostlin, tepelná energie zahřáté páry, pohybová energie páry, elektrická energie v drátech, světlo a teplo v žárovce. Energie mění podobu, ale nezmizí." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Energie a její přeměny 4/5: Energie nezmizí</title>
	<!-- Panel 4/5 výřezu z infografika-energie-a-jeji-premeny.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.z { animation: z 8s linear infinite; }
		.z1 { animation-delay: 1s; }
		.z2 { animation-delay: 2s; }
		.z3 { animation-delay: 3s; }
		.z4 { animation-delay: 4s; }
		.z5 { animation-delay: 5s; }
		.z6 { animation-delay: 6s; }
		.z7 { animation-delay: 7s; }
		.zare { animation: zare 8s linear infinite; }
		.otac { transform-origin: 100px 2420px; animation: otac 2s linear infinite; }
		.para { animation: para 2s ease-out infinite; }
		@keyframes z { 0% { opacity: 0; } 2%, 11% { opacity: 1; } 13.5%, 100% { opacity: 0; } }
		@keyframes zare { 0%, 86% { opacity: 0.15; } 89%, 100% { opacity: 0.6; } }
		@keyframes otac { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
		@keyframes para { 0% { transform: translate(-4px, 4px); opacity: 0.2; } 100% { transform: translate(0, 0); opacity: 1; } }
		@media (prefers-reduced-motion: reduce) {
			.z, .zare, .otac, .para { animation: none; }
		}
	</style>
	<rect x="0" y="1740" width="460" height="972" fill="#f3f1ea" />
	<g id="panel-4">
	<!-- ===== Panel 4: Energie nezmizí ===== -->
	<rect x="26" y="1756" width="420" height="946" rx="10" fill="#2b2a26" />
	<rect x="20" y="1750" width="420" height="946" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
	<circle cx="52" cy="1784" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
	<text x="52" y="1791" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">4</text>
	<text x="80" y="1793" font-size="28" font-weight="bold" fill="#2b2a26">Energie nezmizí</text>
	<rect x="36" y="1812" width="388" height="80" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="2.5" />
	<text x="230" y="1845" text-anchor="middle" font-size="21" fill="#2b2a26">Energii nelze <tspan font-weight="bold" fill="#c92a2a">vytvořit</tspan> ani <tspan font-weight="bold" fill="#c92a2a">zničit</tspan>,</text>
	<text x="230" y="1875" text-anchor="middle" font-size="21" fill="#2b2a26">jen se <tspan font-weight="bold" fill="#c92a2a">přeměňuje</tspan> v jiný druh.</text>
	<text x="40" y="1926" font-size="21" font-weight="bold" fill="#2b2a26">Cesta energie od Slunce k žárovce:</text>

	<!-- rozsvěcované řádky (postupně 1 s každý) -->
	<rect class="z" opacity="0" x="30" y="1940" width="400" height="84" rx="10" fill="#ffe066" />
	<rect class="z z1" opacity="0" x="30" y="2028" width="400" height="84" rx="10" fill="#ffe066" />
	<rect class="z z2" opacity="0" x="30" y="2116" width="400" height="84" rx="10" fill="#ffe066" />
	<rect class="z z3" opacity="0" x="30" y="2204" width="400" height="84" rx="10" fill="#ffe066" />
	<rect class="z z4" opacity="0" x="30" y="2292" width="400" height="84" rx="10" fill="#ffe066" />
	<rect class="z z5" opacity="0" x="30" y="2380" width="400" height="84" rx="10" fill="#ffe066" />
	<rect class="z z6" opacity="0" x="30" y="2468" width="400" height="84" rx="10" fill="#ffe066" />
	<rect class="z z7" opacity="0" x="30" y="2556" width="400" height="84" rx="10" fill="#ffe066" />

	<!-- rámečky ikon -->
