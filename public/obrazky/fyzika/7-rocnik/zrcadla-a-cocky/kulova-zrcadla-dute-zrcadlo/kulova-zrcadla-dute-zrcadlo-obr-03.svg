<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 990" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Obraz v dutém zrcadle ve třech případech. Z vrcholu stromu vedou dva význačné paprsky: rovnoběžný s osou se odrazí přes ohnisko F, ohniskový se odrazí rovnoběžně s osou. 1) Předmět dál než r: paprsky se protnou před zrcadlem, obraz je skutečný, převrácený a zmenšený. 2) Předmět mezi r a f: obraz je skutečný, převrácený a zvětšený. 3) Předmět blíž než f: odražené paprsky se rozbíhají, jejich čárkovaná prodloužení se protnou za zrcadlem, obraz je zdánlivý, vzpřímený a zvětšený. Animace: paprsky se nakreslí a v místě průsečíku se objeví obraz.">
<style>
/* Animace 9 s, smyčka. Předloha: PDF lekce 23, str. 9 (dál než r), str. 10 (mezi r a f), str. 11 (blíž než f).
   f = 90 px, r = 180 px; a = 270 / 135 / 45 → b = 135 / 270 / −90 (1/a + 1/b = 1/f), zvětšení 1/2, 2, 2.
   Zrcadlo kreslené plošší (oblouk r = 800) jako v učebnicích – paprsky blízko osy; obraz leží v průsečíku nakreslených paprsků.
   paprsky 5–40 %, šipky 40–45 %, čárkovaná prodloužení 40–55 %, obraz 45–58 %, vše zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy níže ukazují vše. */
.pr { stroke-dasharray: 100 100; animation: pr 9s linear infinite; }
.si { animation: si 9s linear infinite; }
.pe { animation: pe 9s linear infinite; }
.ob { animation: ob 9s linear infinite; }
.celek { animation: celek 9s linear infinite; }
@keyframes pr { 0%, 5% { stroke-dashoffset: 100; } 40%, 100% { stroke-dashoffset: 0; } }
@keyframes si { 0%, 40% { opacity: 0; } 45%, 100% { opacity: 1; } }
@keyframes pe { 0%, 40% { opacity: 0; } 55%, 100% { opacity: 1; } }
@keyframes ob { 0%, 45% { opacity: 0; } 58%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pr, .si, .pe, .ob, .celek { animation: none; } }
</style>
