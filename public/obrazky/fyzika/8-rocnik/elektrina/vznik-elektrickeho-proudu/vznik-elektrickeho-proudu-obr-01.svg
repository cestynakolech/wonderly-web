<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Obvod: baterie, vodiče, spínač a žárovka. Když je spínač vypnutý, obvod je přerušený a žárovka nesvítí. Po zapnutí spínače je obvod uzavřený, volné elektrony ve vodičích se pohybují od záporné svorky − ke kladné svorce + a žárovka svítí. Oranžové šipky ukazují dohodnutý směr proudu od + k −, modré šipky pohyb elektronů opačně, od − k +.">
<style>
/* Předloha: PDF lekce 20, str. 1 a 3 (přístroj potřebuje obvod se zdrojem napětí; volné elektrony míří od − ke +);
   výklad: baterie, vodiče, spínač a žárovka; přerušený obvod = žárovka nesvítí; dohodnutý směr proudu od + k −
   (věta v § 1, opora 8. roč. elektricky-proud-mereni § 3). Cyklus 10 s: 0–45 % spínač vypnutý,
   elektrony stojí, žárovka nesvítí; 45–50 % spínač se zavře; 50–95 % elektrony obíhají od − ke +, žárovka svítí,
   ukáže se oranžová šipka dohodnutého směru proudu (od + k −) a modrá šipka elektronů (od − k +); 95–100 % spínač se otevře.
   Elektrony: jedna trasa po celém obvodu (od − svorky doleva, nahoru, doprava, dolů, zpět přes baterii), délka 1260 px,
   15 elektronů po 84 px, posun 252 px = 3 rozestupy (konec smyčky = začátek, bez švu); v rozích klíčový snímek,
   takže elektron zatáčí celý (žádné ořezy). Bez animace = koncový stav: spínač zapnutý, žárovka svítí, obě šipky vidět,
   elektrony ve výchozích polohách (atribut transform). */
.pak { transform-origin: 150px 420px; transform: rotate(-35deg); animation: pak 10s linear infinite; }
.on { opacity: 0; animation: on 10s linear infinite; }
.off { opacity: 1; animation: off 10s linear infinite; }
@keyframes pak { 0%, 45% { transform: rotate(-35deg); } 50%, 95% { transform: rotate(0deg); } 100% { transform: rotate(-35deg); } }
@keyframes on { 0%, 48% { opacity: 0; } 52%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
@keyframes off { 0%, 46% { opacity: 1; } 49%, 96% { opacity: 0; } 99%, 100% { opacity: 1; } }
.e0 { animation: e0 10s linear infinite; } .e1 { animation: e1 10s linear infinite; } .e2 { animation: e2 10s linear infinite; }
.e3 { animation: e3 10s linear infinite; } .e4 { animation: e4 10s linear infinite; } .e5 { animation: e5 10s linear infinite; }
.e6 { animation: e6 10s linear infinite; } .e7 { animation: e7 10s linear infinite; } .e8 { animation: e8 10s linear infinite; }
.e9 { animation: e9 10s linear infinite; } .e10 { animation: e10 10s linear infinite; } .e11 { animation: e11 10s linear infinite; }
.e12 { animation: e12 10s linear infinite; } .e13 { animation: e13 10s linear infinite; } .e14 { animation: e14 10s linear infinite; }
@keyframes e0 { 0%, 50% { transform: translate(218px, 420px); } 69.3% { transform: translate(110px, 420px); } 95%, 100% { transform: translate(110px, 276px); } }
@keyframes e1 { 0%, 50% { transform: translate(134px, 420px); } 54.3% { transform: translate(110px, 420px); } 95%, 100% { transform: translate(110px, 192px); } }
@keyframes e2 { 0%, 50% { transform: translate(110px, 360px); } 83.9% { transform: translate(110px, 170px); } 95%, 100% { transform: translate(172px, 170px); } }
@keyframes e3 { 0%, 50% { transform: translate(110px, 276px); } 68.9% { transform: translate(110px, 170px); } 95%, 100% { transform: translate(256px, 170px); } }
@keyframes e4 { 0%, 50% { transform: translate(110px, 192px); } 53.9% { transform: translate(110px, 170px); } 95%, 100% { transform: translate(340px, 170px); } }
@keyframes e5 { 0%, 50% { transform: translate(172px, 170px); } 95%, 100% { transform: translate(424px, 170px); } }
@keyframes e6 { 0%, 50% { transform: translate(256px, 170px); } 91.8% { transform: translate(490px, 170px); } 95%, 100% { transform: translate(490px, 188px); } }
@keyframes e7 { 0%, 50% { transform: translate(340px, 170px); } 76.8% { transform: translate(490px, 170px); } 95%, 100% { transform: translate(490px, 272px); } }
@keyframes e8 { 0%, 50% { transform: translate(424px, 170px); } 61.8% { transform: translate(490px, 170px); } 95%, 100% { transform: translate(490px, 356px); } }
@keyframes e9 { 0%, 50% { transform: translate(490px, 188px); } 91.4% { transform: translate(490px, 420px); } 95%, 100% { transform: translate(470px, 420px); } }
@keyframes e10 { 0%, 50% { transform: translate(490px, 272px); } 76.4% { transform: translate(490px, 420px); } 95%, 100% { transform: translate(386px, 420px); } }
@keyframes e11 { 0%, 50% { transform: translate(490px, 356px); } 61.4% { transform: translate(490px, 420px); } 95%, 100% { transform: translate(302px, 420px); } }
@keyframes e12 { 0%, 50% { transform: translate(470px, 420px); } 95%, 100% { transform: translate(218px, 420px); } }
@keyframes e13 { 0%, 50% { transform: translate(386px, 420px); } 95%, 100% { transform: translate(134px, 420px); } }
@keyframes e14 { 0%, 50% { transform: translate(302px, 420px); } 84.3% { transform: translate(110px, 420px); } 95%, 100% { transform: translate(110px, 360px); } }
@media (prefers-reduced-motion: reduce) { .pak { animation: none; transform: none; } .on { animation: none; opacity: 1; } .off { animation: none; opacity: 0; } .el { animation: none; } }
</style>
<defs>
<marker id="v-ora" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto"><path d="M0,0 L24,12 L0,24 z" fill="#e8590c"/></marker>
<marker id="v-mod" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto"><path d="M0,0 L24,12 L0,24 z" fill="#1864ab"/></marker>
</defs>
<rect x="3" y="3" width="594" height="574" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="36" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Obvod se spínačem</text>
