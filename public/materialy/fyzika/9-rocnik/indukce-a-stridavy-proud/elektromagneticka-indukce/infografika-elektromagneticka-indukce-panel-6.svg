" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">světlo</text><g class="zmiz"><g class="p6-ruka"><use href="#p6r"/></g></g><g class="objev"><use href="#p6r"/></g></g><rect x="36" y="2844" width="388" height="250" rx="8" fill="none" stroke="#ced4da" stroke-width="2"/><text x="40" y="3126" font-size="21" fill="#2b2a26">Kolo je otočené vzhůru nohama.</text><text x="40" y="3158" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Kolo roztáčí dynamo</tspan> → světlo svítí.</text><text x="40" y="3184" font-size="21" fill="#2b2a26">Kolo stojí → světlo nesvítí.</text><text x="40" y="3216" font-size="21" fill="#2b2a26">Energie se nevyrábí, jen přeměňuje:</text><text x="40" y="3242" font-size="21" fill="#2b2a26">pohybová → elektrická.</text><text x="40" y="3274" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Indukce dál:</tspan> alternátor v elektrárně,</text><text x="40" y="3300" font-size="21" fill="#2b2a26">transformátor, indukční varná deska,</text><text x="40" y="3326" font-size="21" fill="#2b2a26">bezdrátová nabíječka, elektrická kytara.</text></g>
