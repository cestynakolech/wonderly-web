<svg viewBox="0 0 460 558" width="460" height="558" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Páka kolem nás. Nůžky jsou dvojzvratná páka: osa O je šroubek mezi držadly a ostřím. Otvírák na lahve je jednozvratná páka: osa O je na okraji víčka, ruka zvedá držadlo silou F1 nahoru a víčko tlačí na háček silou F2 dolů, obě síly jsou na stejné straně osy. Páka je také v kleštích, rýči, páčidle, klice, maticovém klíči, louskáčku a vahách, a i v těle: loket a čelist." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Páka 6/6: Páka kolem nás</title>
	<!-- Panel 6/6 (W49, 14. 10. 2026), příklady podle PDF Páka, s. 3 a 12–13. Bez animace = nůžky otevřené, otvírák zvedá víčko. -->
	<style>
		.p6-a { transform-box: view-box; transform-origin: 200px 215px; animation: p6a 6s infinite; }
		@keyframes p6a { 0%, 15% { transform: none; animation-timing-function: ease-in-out; } 40%, 55% { transform: rotate(10deg); animation-timing-function: ease-in-out; } 80%, 100% { transform: none; } }
		.p6-b { transform-box: view-box; transform-origin: 200px 215px; animation: p6b 6s infinite; }
		@keyframes p6b { 0%, 15% { transform: none; animation-timing-function: ease-in-out; } 40%, 55% { transform: rotate(-10deg); animation-timing-function: ease-in-out; } 80%, 100% { transform: none; } }
		.p6-otv { transform-box: view-box; transform-origin: 354px 362px; animation: p6otv 6s infinite; }
		@keyframes p6otv { 0%, 15% { transform: rotate(-8deg); animation-timing-function: ease-in-out; } 40%, 70% { transform: none; animation-timing-function: ease-in-out; } 92%, 100% { transform: rotate(-8deg); } }
		.p6-sily { animation: p6sily 6s infinite; }
		@keyframes p6sily { 0%, 40% { opacity: 0; } 45%, 68% { opacity: 1; } 73%, 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .p6-a, .p6-b, .p6-otv, .p6-sily { animation: none; } }
	</style>
	<defs><clipPath id="ok6"><rect x="30" y="138" width="400" height="330" rx="8"/></clipPath></defs>
	<rect x="0" y="0" width="460" height="558" fill="#f8f9fa"/>
	<g id="panel-6">
		<rect x="26" y="16" width="420" height="538" rx="12" fill="#dee2e6"/>
		<rect x="20" y="10" width="420" height="538" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/>
		<circle cx="52" cy="44" r="17" fill="#2b2a26"/><text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">6</text>
		<text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Páka kolem nás</text>
		<text x="34" y="92" font-size="21" fill="#2b2a26">U každé páky najdi osu <tspan font-weight="bold">O</tspan>.</text>
		<text x="34" y="120" font-size="21" fill="#2b2a26">Poloha osy určuje druh páky.</text>
		<rect x="30" y="138" width="400" height="330" rx="8" fill="#ffffff"/>
		<g clip-path="url(#ok6)">
			<!-- NŮŽKY: dvojzvratná páka -->
			<text x="250" y="160" font-size="19" font-weight="bold" fill="#2b2a26">Nůžky</text>
			<text x="250" y="180" font-size="17" fill="#495057">dvojzvratná</text>
			<g transform="rotate(10 200 215)">
				<g class="p6-b">
					<!-- spodní ostří + horní držadlo -->
					<path d="M200,210 L330,214 Q337,216 330,218 L190,222 Z" fill="#ced4da" stroke="#495057" stroke-width="1.5"/>
					<line x1="196" y1="212" x2="122" y2="195" stroke="#e03131" stroke-width="9" stroke-linecap="round"/>
					<ellipse cx="98" cy="190" rx="24" ry="14" fill="none" stroke="#e03131" stroke-width="7"/>
				</g>
			</g>
			<g transform="rotate(-10 200 215)">
				<g class="p6-a">
					<!-- horní ostří + spodní držadlo -->
					<path d="M190,208 L330,212 Q337,214 330,216 L200,220 Z" fill="#dee2e6" stroke="#495057" stroke-width="1.5"/>
					<line x1="196" y1="218" x2="122" y2="235" stroke="#e03131" stroke-width="9" stroke-linecap="round"/>
					<ellipse cx="98" cy="240" rx="24" ry="14" fill="none" stroke="#e03131" stroke-width="7"/>
				</g>
			</g>
			<circle cx="200" cy="215" r="6" fill="#fff" stroke="#2b2a26" stroke-width="2.5"/>
			<text x="214" y="254" font-size="21" font-weight="bold" fill="#2b2a26">O</text>
			<line x1="40" y1="296" x2="420" y2="296" stroke="#dee2e6" stroke-width="2" stroke-dasharray="6 5"/>
			<!-- OTVÍRÁK: jednozvratná páka -->
			<path d="M314,378 L314,402 Q314,422 292,434 L292,470 L368,470 L368,434 Q346,422 346,402 L346,378 Z" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2"/>
			<rect x="311" y="374" width="38" height="7" rx="2" fill="#8ce99a" stroke="#2b8a3e" stroke-width="1.5"/>
			<g transform="rotate(8 354 362)"><g class="p6-otv">
				<!-- víčko -->
				<path d="M308,363 L352,363 L352,373 L349,376 L345,373 L341,376 L337,373 L333,376 L329,373 L325,376 L321,373 L317,376 L313,373 L308,376 Z" fill="#fab005" stroke="#a87100" stroke-width="1.5"/>
				<!-- otvírák s háčkem -->
				<path d="M300,363 L300,378 L310,378" fill="none" stroke="#495057" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
				<rect x="120" y="354" width="238" height="9" rx="4" fill="#868e96" stroke="#495057" stroke-width="1.5"/>
				<!-- ruka (paže zleva zdola) -->
				<line x1="136" y1="362" x2="34" y2="404" stroke="#4c6ef5" stroke-width="18" stroke-linecap="round"/>
				<rect x="130" y="344" width="34" height="30" rx="10" fill="#f1c9a5" stroke="#a0663d" stroke-width="1.5"/>
				<line x1="136" y1="354" x2="158" y2="354" stroke="#a0663d" stroke-width="1.5"/>
				<line x1="136" y1="363" x2="158" y2="363" stroke="#a0663d" stroke-width="1.5"/>
			</g></g>
			<circle cx="354" cy="362" r="5" fill="#fff" stroke="#2b2a26" stroke-width="2.5"/>
			<text x="368" y="354" font-size="21" font-weight="bold" fill="#2b2a26">O</text>
			<g class="p6-sily">
				<circle cx="168" cy="324" r="4" fill="#c92a2a"/>
				<line x1="168" y1="324" x2="168" y2="292" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/>
				<path d="M168,279 L160.5,292 L175.5,292 Z" fill="#c92a2a"/>
				<text x="180" y="298" font-size="19" font-weight="bold" fill="#c92a2a"><tspan font-style="italic">F</tspan><tspan font-size="15" dy="4">1</tspan></text>
				<circle cx="298" cy="374" r="4" fill="#c92a2a"/>
				<line x1="298" y1="374" x2="298" y2="404" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/>
				<path d="M298,417 L290.5,404 L305.5,404 Z" fill="#c92a2a"/>
				<text x="286" y="416" font-size="19" font-weight="bold" text-anchor="end" fill="#c92a2a"><tspan font-style="italic">F</tspan><tspan font-size="15" dy="4">2</tspan></text>
			</g>
			<text x="40" y="440" font-size="19" font-weight="bold" fill="#2b2a26">Otvírák na lahve</text>
			<text x="40" y="460" font-size="17" fill="#495057">jednozvratná</text>
		</g>
		<rect x="30" y="138" width="400" height="330" rx="8" fill="none" stroke="#ced4da" stroke-width="2"/>
		<text x="34" y="502" font-size="21" fill="#2b2a26">Také kleště, rýč, páčidlo, klika,</text>
		<text x="34" y="532" font-size="21" fill="#2b2a26">kolečko, louskáček, váhy. I loket!</text>
	</g>
</svg>
