<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Sluneční (fotovoltaická) elektrárna. Ve dne dopadá sluneční světlo na panely a ty vyrábějí elektřinu, která jde kabelem do domu. V noci Slunce nesvítí a panely elektřinu nevyrábějí.">
<style>
@keyframes tok { to { stroke-dashoffset: -36; } }
@keyframes tokz { to { stroke-dashoffset: 36; } }
.tok { stroke-dasharray: 12 24; animation: tok 1s linear infinite; }
.tokz { stroke-dasharray: 12 24; animation: tokz 1s linear infinite; }
@keyframes el { to { stroke-dashoffset: -18; } }
@keyframes elz { to { stroke-dashoffset: 18; } }
.el { stroke-dasharray: 8 10; animation: el 0.6s linear infinite; }
.elz { stroke-dasharray: 8 10; animation: elz 0.6s linear infinite; }
.slunce { animation: slunce 10s ease-in-out infinite; }
@keyframes slunce { 0%, 50% { transform: translate(0, 0); } 62%, 97% { transform: translate(0, 380px); } 100% { transform: translate(0, 0); } }
.den { animation: den 10s linear infinite; }
@keyframes den { 0%, 52% { opacity: 1; } 56%, 97% { opacity: 0; } 100% { opacity: 1; } }
.noc { opacity: 0; animation: noc 10s linear infinite; }
@keyframes noc { 0%, 56% { opacity: 0; } 62%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
.tma { opacity: 0; animation: tma 10s linear infinite; }
@keyframes tma { 0%, 52% { opacity: 0; } 62%, 95% { opacity: 0.5; } 100% { opacity: 0; } }
.okno { animation: okno 10s linear infinite; }
@keyframes okno { 0%, 54% { fill: #ffe066; } 58%, 97% { fill: #495057; } 100% { fill: #ffe066; } }
.paprsek { stroke-dasharray: 14 16; animation: papr 0.8s linear infinite; }
@keyframes papr { to { stroke-dashoffset: -30; } }
/* Smyčka 10 s: den (paprsky dopadají na panely, kabelem jde elektřina, v okně svítí),
   noc (Slunce zapadne, panely nevyrábějí, v okně je tma). Klid: den. */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
