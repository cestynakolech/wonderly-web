<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dva druhy zdrojů energie. Obnovitelné: slunce, vítr, voda, geotermální teplo, biomasa a vodík – stále se obnovují, jejich zásoba se doplní. Neobnovitelné: uhlí, ropa, zemní plyn, ropné břidlice a písky a jaderné palivo – je jich jen omezené množství a zásoba časem dojde.">
<style>
.zasA { transform-origin: 490px 292px; animation: zasA 10s ease-in-out infinite; }
@keyframes zasA { 0% { transform: scaleY(1); } 35% { transform: scaleY(0.3); } 75%, 100% { transform: scaleY(1); } }
.zasB { transform-origin: 490px 580px; transform: scaleY(0.1); animation: zasB 10s ease-in-out infinite; }
@keyframes zasB { 0% { transform: scaleY(1); opacity: 0; } 4% { opacity: 1; } 85%, 100% { transform: scaleY(0.1); opacity: 1; } }
/* Smyčka 10 s: zásoba obnovitelného zdroje ubude a zase se doplní; zásoba neobnovitelného
   jen ubývá (na konci smyčky se znovu objeví plná). Klid: obnovitelná plná, neobnovitelná skoro prázdná. */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="3" y="3" width="594" height="654" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300.0" y="42" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Dva druhy zdrojů energie</text>
