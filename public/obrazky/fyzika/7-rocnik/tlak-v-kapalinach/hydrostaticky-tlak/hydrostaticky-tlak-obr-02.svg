<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Helvetica, Arial, sans-serif">
<title>Příklad s ponorkou na tabuli</title>
<defs>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
<marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
</defs>
<rect width="960" height="640" fill="#ffffff"/>
<rect x="20" y="20" width="920" height="600" rx="10" fill="#2b4a3a" stroke="#6d4c2b" stroke-width="10" /><text x="50" y="70.0" font-size="19" text-anchor="start" font-weight="normal" fill="#f8f9fa">Jak velký tlak musí vydržet ponorka v mořské vodě s hustotou 1 030 kg/m³</text><text x="50" y="98.0" font-size="19" text-anchor="start" font-weight="normal" fill="#f8f9fa">v hloubce 2 km? Jak velká síla působí na okno ponorky o obsahu plochy 200 cm²?</text><text x="50" y="150.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">ρ = 1 030 kg/m³</text><text x="50" y="182.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">h = 2 km = 2 000 m</text><text x="50" y="214.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">S = 200 cm² = 0,02 m²</text><text x="50" y="246.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">g = 10 N/kg</text><text x="50" y="278.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">p<tspan font-size="14" dy="4.4">h</tspan><tspan dy="-4.4"> = ? Pa</tspan></text><rect x="415.0" y="135" width="250" height="34" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="2.5" />
<text x="540" y="158.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#212529">základní jednotka: metr</text><rect x="440.0" y="200" width="340" height="34" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="2.5" />
<text x="610" y="223.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#212529">základní jednotka: metr čtvereční</text><line x1="40" y1="300" x2="700" y2="300" stroke="#f8f9fa" stroke-width="2" /><text x="50" y="345.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">p<tspan font-size="14" dy="4.4">h</tspan><tspan dy="-4.4"> = h · ρ · g = 2 000 m · 1 030 kg/m³ · 10 N/kg</tspan></text><text x="50" y="382.0" font-size="22" text-anchor="start" font-weight="bold" fill="#f8f9fa">p<tspan font-size="16" dy="4.8">h</tspan><tspan dy="-4.8"> = 20 600 000 Pa = 20,6 MPa</tspan></text><text x="50" y="440.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">F = p · S = 20 600 000 Pa · 0,02 m²</text><text x="50" y="477.0" font-size="22" text-anchor="start" font-weight="bold" fill="#f8f9fa">F = 412 000 N = 412 kN</text><line x1="40" y1="505" x2="700" y2="505" stroke="#f8f9fa" stroke-width="2" /><text x="50" y="545.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">Ponorka musí vydržet tlak 20,6 MPa.</text><text x="50" y="577.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">Na okno ponorky působí síla 412 kN.</text><rect x="720" y="340" width="210" height="270" rx="0" fill="#74c0fc" stroke="none" stroke-width="0" opacity="0.55"/><line x1="720" y1="340" x2="930" y2="340" stroke="#1c7ed6" stroke-width="4" /><ellipse cx="830" cy="470" rx="80" ry="34" fill="#ffd43b" stroke="#212529" stroke-width="3"/><rect x="815" y="420" width="30" height="24" rx="0" fill="#ffd43b" stroke="#212529" stroke-width="3" /><circle cx="865" cy="470" r="9" fill="#d0ebff" stroke="#212529" stroke-width="2"/><text x="830" y="540.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#f8f9fa">ponorka</text>
</svg>
