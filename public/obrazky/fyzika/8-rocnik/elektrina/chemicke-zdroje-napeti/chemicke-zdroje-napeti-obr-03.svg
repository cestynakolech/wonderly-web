<text x="140" y="240" font-size="26" fill="#fff" font-weight="bold" text-anchor="middle">12 V</text>
<text x="290" y="124" font-size="26" fill="#212529" font-weight="bold">Vybíjení</text>
<text x="290" y="156" font-size="22" fill="#212529">žárovka svítí</text>
<text x="290" y="200" font-size="22" fill="#212529">zásoba chemické energie</text>
