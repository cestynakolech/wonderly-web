<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Schéma: zdroj 6 V ze čtyř článků za sebou, spínač a žárovka; voltmetr, kolečko s písmenem V, je připojený vedle žárovky, tedy paralelně, ke dvěma jejím vývodům, kladnou svorkou ke kladné straně. Dole stupnice voltmetru od 0 do 10 V. Když je spínač otevřený, žárovka nesvítí a ručička stojí na nule. Po zavření spínače žárovka svítí a voltmetr ukazuje 6 V.">
<style>
/* Předloha: PDF lekce 24, s. 5 (schéma: článek vlevo, spínač nahoře, žárovka vpravo, voltmetr V paralelně vedle žárovky).
   Zdroj 6 V = čtyři články po 1,5 V za sebou (výklad § 3: 4 · 1,5 V = 6 V), značka článku jako v elektricke-obvody-obr-02.
   6 s: 0–30 % spínač otevřený, žárovka nesvítí, ručička na 0; 30–36 % spínač se zavře; teprve v 36 % (obvod uzavřen)
   se žárovka rozsvítí a ručička se pohne, na 6 dojede ve 40 %; „U = 6 V“ až od 40 %.
   V 85 % se spínač začne otevírat: žárovka zhasne a ručička se do 88 % vrátí na 0; „U = 0 V“ až od 88 %.
   Bez animace (reduced-motion) = koncový stav děje: spínač zavřený, žárovka svítí, voltmetr ukazuje 6 V. */
.ps { transform-origin: 256px 100px; animation: ps 6s ease-in-out infinite; }
.ru { transform-origin: 300px 640px; animation: ru 6s ease-in-out infinite; }
@keyframes ps { 0%, 30% { transform: rotate(-22deg); } 36%, 85% { transform: rotate(0deg); } 91%, 100% { transform: rotate(-22deg); } }
@keyframes ru { 0%, 36% { transform: rotate(-60deg); } 40%, 85% { transform: rotate(0deg); } 88%, 100% { transform: rotate(-60deg); } }
.lit { animation: sv 6s step-end infinite; }
.sz { animation: sv 6s step-end infinite; }
.so { opacity: 0; animation: tm 6s step-end infinite; }
.uz { animation: uz 6s step-end infinite; }
.uo { opacity: 0; animation: uo 6s step-end infinite; }
@keyframes sv { 0% { opacity: 0; } 36% { opacity: 1; } 85% { opacity: 0; } }
@keyframes tm { 0% { opacity: 1; } 36% { opacity: 0; } 85% { opacity: 1; } }
@keyframes uz { 0% { opacity: 0; } 40% { opacity: 1; } 85% { opacity: 0; } }
@keyframes uo { 0% { opacity: 1; } 36% { opacity: 0; } 88% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ps, .ru, .lit, .sz, .so, .uz, .uo { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="684" rx="14" fill="#f8f9fa"/>
