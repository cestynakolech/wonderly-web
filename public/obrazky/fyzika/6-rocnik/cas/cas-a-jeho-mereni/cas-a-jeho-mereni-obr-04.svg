<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Přesýpací hodiny v dřevěném rámu se třemi soustruženými sloupky. Skleněná baňka je uprostřed zúžená. Písek se z horní části přesýpá do spodní stále stejnou rychlostí. Když je všechen dole, musí se hodiny otočit, aby měřily dál.">
<style>
/* Písek se přesýpá stále stejně rychle (0–80 %), pak se hodiny otočí (86–96 %) a děj se opakuje (14 s, smyčka).
   Bez animace platí atributy = konečný stav: písek je celý dole. */
.pisek-h { animation: ph-k 14s linear infinite; }
.pisek-d { animation: pd-k 14s linear infinite; }
.proud { animation: proud-k 14s linear infinite; }
.preklop { transform-box: view-box; transform-origin: 480px 330px; animation: preklop-k 14s ease-in-out infinite; }
.sipka-ot { animation: sipka-k 14s linear infinite; }
@keyframes ph-k { 0% { transform: translateY(0px); } 80%, 100% { transform: translateY(124px); } }
@keyframes pd-k { 0% { transform: translateY(124px); } 80%, 100% { transform: translateY(0px); } }
@keyframes proud-k { 0%, 79% { opacity: 1; } 80%, 100% { opacity: 0; } }
@keyframes preklop-k { 0%, 86% { transform: rotate(0deg); } 96%, 100% { transform: rotate(180deg); } }
@keyframes sipka-k { 0%, 80% { opacity: 0; } 84%, 96% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pisek-h, .pisek-d, .proud, .preklop, .sipka-ot { animation: none; } .proud { opacity: 0; } }
</style>
