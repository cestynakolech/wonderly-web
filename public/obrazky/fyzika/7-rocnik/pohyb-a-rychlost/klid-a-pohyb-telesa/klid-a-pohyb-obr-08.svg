<circle cx="686" cy="98" r="16" fill="#1971c2"/><text x="686" y="105" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="712" y="104" font-size="18" fill="#2b2a26" text-anchor="start">Žena vejde</text>
<text x="712" y="130" font-size="18" fill="#2b2a26" text-anchor="start">do výtahu.</text>
<circle cx="686" cy="176" r="16" fill="#1971c2"/><text x="686" y="183" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="712" y="182" font-size="18" fill="#2b2a26" text-anchor="start">Výtah vyjede</text>
<text x="712" y="208" font-size="18" fill="#2b2a26" text-anchor="start">nahoru. Žena je</text>
<text x="712" y="234" font-size="18" fill="#2b2a26" text-anchor="start"><tspan font-weight="bold">v klidu</tspan> vůči</text>
<text x="712" y="260" font-size="18" fill="#2b2a26" text-anchor="start">výtahu, ale</text>
<text x="712" y="286" font-size="18" fill="#2b2a26" text-anchor="start"><tspan font-weight="bold">v pohybu</tspan> vůči</text>
<text x="712" y="312" font-size="18" fill="#2b2a26" text-anchor="start">muži dole.</text>
<circle cx="686" cy="358" r="16" fill="#1971c2"/><text x="686" y="365" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="712" y="364" font-size="18" fill="#2b2a26" text-anchor="start">Pak jdou oba</text>
<text x="712" y="390" font-size="18" fill="#2b2a26" text-anchor="start">doprava: žena</text>
<text x="712" y="416" font-size="18" fill="#2b2a26" text-anchor="start">v patře, muž</text>
<text x="712" y="442" font-size="18" fill="#2b2a26" text-anchor="start">v přízemí.</text>
<text x="24" y="580" font-size="18" fill="#495057" text-anchor="start">Plně: poloha po kroku 2.  Průsvitně: poloha na začátku a na konci.</text>
</svg>
