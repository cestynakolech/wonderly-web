<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Světlo a látky. Bílé světlo ze svítilny, složené z červené, zelené a modré, dopadá na tři látky. Neprůhledné dřevo pohltí všechny barvy a za ním je tma. Průzračné sklo propustí všechny barvy, na stínítku je bílá skvrna. Barevný filtr propustí jen červenou a modrou, zelenou pohltí, na stínítku vznikne purpurové světlo. Animace: paprsky postupně doletí ke stínítku.">
<style>
/* Animace 9 s, smyčka. Předloha: PDF lekce 29, str. 5–6 (neprůhledná, průzračná průhledná, barevná průhledná látka; propuštěné modré + červené světlo — PDF ho chybně nazývá „růžové“, zde jednotně purpurové jako v obr-01, #ff00ff). paprsky ke stěně 5–30 %, paprsky za ní 32–55 %, skvrny na stínítku 55–62 %, zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy ukazují vše. */
.k1 { stroke-dasharray: 100 100; animation: k1 9s linear infinite; }
@keyframes k1 { 0%, 5% { stroke-dashoffset: 100; } 30%, 100% { stroke-dashoffset: 0; } }
.s1 { animation: s1 9s linear infinite; }
@keyframes s1 { 0%, 28% { opacity: 0; } 31%, 100% { opacity: 1; } }
.k2 { stroke-dasharray: 100 100; animation: k2 9s linear infinite; }
@keyframes k2 { 0%, 32% { stroke-dashoffset: 100; } 55%, 100% { stroke-dashoffset: 0; } }
.s2 { animation: s2 9s linear infinite; }
@keyframes s2 { 0%, 53% { opacity: 0; } 56%, 100% { opacity: 1; } }
.sv { animation: sv 9s linear infinite; }
@keyframes sv { 0%, 55% { opacity: 0; } 62%, 100% { opacity: 1; } }
.celek { animation: celek 9s linear infinite; }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .k1, .s1, .k2, .s2, .sv, .celek { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="694" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="38" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Světlo a látky</text><text x="300" y="66" font-size="22" font-weight="normal" fill="#212529" text-anchor="middle">bílé světlo = červená + zelená + modrá</text>
