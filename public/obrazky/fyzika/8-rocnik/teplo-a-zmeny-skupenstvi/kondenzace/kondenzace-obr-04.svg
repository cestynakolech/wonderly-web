<svg xmlns="http://www.w3.org/2000/svg" width="375" height="800" viewBox="0 0 375 800" role="img" aria-labelledby="title desc"><title id="title">Skladování plynů</title><desc id="desc">Vlevo podsaditá propan-butanová láhev s ochranným límcem kolem ventilu a patkou, v řezu dole světle modrá kapalina a nad ní plyn. Vpravo dvě vysoké úzké tlakové láhve s ochranným kloboukem, kyslík s bílým hrdlem a dusík s černým hrdlem; v řezu jen kuličky plynu bez hladiny.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="375" height="800" rx="0" fill="#fff" stroke="none"/><text x="187" y="33" font-size="21" text-anchor="middle" fill="#17324d">Skladování plynů</text><defs><linearGradient id="lahev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7f8c96"/><stop offset="0.3" stop-color="#d5dde3"/><stop offset="0.45" stop-color="#eef2f5"/><stop offset="0.7" stop-color="#a3afb8"/><stop offset="1" stop-color="#6f7c86"/></linearGradient><clipPath id="pb-rez"><rect x="41" y="462" width="88" height="136" rx="12"/></clipPath></defs><path d="M49 606 L47 620 H123 L121 606 Z" fill="#5d6d79" stroke="#17324d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M34 485 C34 448 55 440 85 440 C115 440 136 448 136 485 V570 C136 606 115 614 85 614 C55 614 34 606 34 570 Z" fill="url(#lahev)" stroke="#17324d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M34 527 L136 527" fill="none" stroke="#5d6d79" stroke-width="2"/><rect x="55" y="418" width="60" height="30" rx="6" fill="#8f9ca6" stroke="#17324d"/><rect x="67" y="422" width="36" height="7" rx="3" fill="#fff" stroke="none"/><rect x="71" y="433" width="28" height="15" rx="0" fill="#fff" stroke="none"/><rect x="79" y="434" width="12" height="14" rx="2" fill="#c9a227" stroke="#17324d"/><g clip-path="url(#pb-rez)"><rect x="41" y="462" width="88" height="136" rx="0" fill="#f4f7fa" stroke="none"/><rect x="41" y="496" width="88" height="104" rx="0" fill="#b8e3f7" stroke="none"/></g><p