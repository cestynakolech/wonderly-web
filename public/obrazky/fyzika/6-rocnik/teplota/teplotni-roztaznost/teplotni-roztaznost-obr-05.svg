<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: žehlička na žehlicím prkně s košilí, vedle ní teploměr se značkou nastavené teploty. Dole zjednodušený pohled do termostatu: bimetalový pásek je jedním koncem upnutý, druhým koncem se dotýká kontaktu a obvod s topným tělesem je sepnutý. Topné těleso žhne a kontrolka svítí, teplota stoupá. Při nastavené teplotě se pásek ohne, kontakty se rozpojí a topné těleso přestane hřát. Když teplota klesne, pásek se narovná, obvod se znovu sepne a žehlička zase hřeje.">
<style>
/* Předloha: PDF Teplotní roztažnost, TEPLOTNÍ SPÍNAČE — bimetalový termostat (žehlička, trouba, varná deska, topení):
   při dosažení nastavené teploty rozpojí obvod, topné těleso přestane hřát; při poklesu teploty obvod opět sepne.
   Fotografie žehličky na prkně s košilí překreslena kresbou; vnitřek termostatu zjednodušený. Teploměr ve stylu
   podtématu Teplota a její měření (červený líh), bez čísel. Pásek: kov 2 (oranžový) nahoře ⇒ při ohřevu se ohne dolů.
   Smyčka 12 s: 0–40 % topí (sloupec stoupá k značce), 40–45 % pásek se ohne (4 klouby po 3°), kontakty se rozpojí,
   45–90 % nehřeje a teplota klesá, 90–95 % pásek se narovná, obvod sepne. Bez animace = nastavená teplota, obvod rozpojený. */
@keyframes ohyb { 0%, 40% { transform: rotate(0deg); } 45%, 90% { transform: rotate(3deg); } 95%, 100% { transform: rotate(0deg); } }
@keyframes hreje { 0%, 41% { opacity: 1; } 45%, 91% { opacity: 0; } 95%, 100% { opacity: 1; } }
@keyframes sl { 0% { transform: translate(0, 25px); } 40%, 45% { transform: translate(0, 0); } 90%, 100% { transform: translate(0, 25px); } }
@keyframes tH { 0%, 41% { opacity: 1; } 43%, 91% { opacity: 0; } 93%, 100% { opacity: 1; } }
@keyframes tV { 0%, 43% { opacity: 0; } 45%, 89% { opacity: 1; } 91%, 100% { opacity: 0; } }
.k { animation: ohyb 12s ease-in-out infinite; } .hr { animation: hreje 12s linear infinite; }
.sl { animation: sl 12s ease-in-out infinite; } .tH { animation: tH 12s linear infinite; } .tV { animation: tV 12s linear infinite; }
@media (prefers-reduced-motion: reduce) { .k, .hr, .sl, .tH, .tV { animation: none; } }
</style>
<defs>
<linearGradient id="k1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ced4da"/><stop offset="1" stop-color="#868e96"/></linearGradient>
<linearGradient id="k2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a4c"/><stop offset="1" stop-color="#d9480f"/></linearGradient>
<linearGradient id="zehl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dee2e6"/></linearGradient>
<linearGradient id="tyrk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66d9e8"/><stop offset="1" stop-color="#0c8599"/></linearGradient>
<linearGradient id="plocha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ecef"/><stop offset="1" stop-color="#868e96"/></linearGradient>
<linearGradient id="skloc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dee2e6"/><stop offset="0.3" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ecef"/></linearGradient>
<linearGradient id="kov" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ecef"/><stop offset="1" stop-color="#868e96"/></linearGradient>
<clipPath id="kap"><rect x="436" y="108" width="8" height="174" rx="4"/><circle cx="440" cy="284" r="11"/></clipPath>
<g id="cl"><rect x="0" y="-9" width="48" height="9" fill="url(#k2)"/><rect x="0" y="0" width="48" height="9" fill="url(#k1)"/></g>
</defs>
