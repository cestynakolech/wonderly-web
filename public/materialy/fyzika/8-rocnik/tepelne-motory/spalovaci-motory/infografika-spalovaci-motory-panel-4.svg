<svg viewBox="0 2336 460 834" width="460" height="834" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zážehový a vznětový motor: zážehový spaluje benzín, směs zapálí jiskra ze svíčky, účinnost 20 až 33 %; vznětový (Dieselův) spaluje naftu, svíčku nepotřebuje — stlačený vzduch se zahřeje a vstříknutá nafta se v něm sama vznítí, účinnost 30 až 40 %; příklad: benzín 25 000 kJ při účinnosti 20 % dá 5 000 kJ na pohyb a 20 000 kJ odejde jako teplo; nafta 15 000 kJ při účinnosti 40 % dá 6 000 kJ na pohyb, zbytek je odpadní teplo" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
