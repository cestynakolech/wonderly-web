	<!-- PLÍCE: nádech (podtlak, vzduch dovnitř) 0–3 s, výdech (přetlak, vzduch ven) 3–6 s -->
	<!-- vlastní rámeček plic vlevo (OPRAVA 2: plíce už neleží pod sloupcem vakuum) -->
