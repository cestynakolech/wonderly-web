				<use href="#q1-atom-kov" x="79" y="396"/><use href="#q1-atom-kov" x="113" y="396"/><use href="#q1-atom-kov" x="147" y="396"/><use href="#q1-atom-kov" x="181" y="396"/>
			</g></g>
			<g class="q1-studeny" opacity="0"><g class="q1-e-rychle">
