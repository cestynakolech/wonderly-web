<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" font-family="Helvetica, Arial, sans-serif">
<title>Hydraulický zvedák s autem</title>
<defs>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
<marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
</defs>
<rect width="960" height="710" fill="#ffffff"/>
<path d="M110,424 H220 V520 H440 V354 H770 V560 H110 Z" fill="#a5d8ff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M110,260 V560 H770 V260" fill="none" stroke="#495057" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M220,260 V520 H440 V260" fill="none" stroke="#495057" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="113" y="400" width="104" height="24" rx="0" fill="#d9a066" stroke="#8a5a2b" stroke-width="3" /><rect x="443" y="330" width="324" height="24" rx="0" fill="#d9a066" stroke="#8a5a2b" stroke-width="3" /><rect x="443" y="316" width="324" height="14" rx="0" fill="#adb5bd" stroke="#212529" stroke-width="3" /><rect x="530" y="260" width="150" height="36" rx="8" fill="#e03131" stroke="#212529" stroke-width="3" /><path d="M540,260 l22,-30 h70 l26,30" fill="#e03131" stroke="#212529" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="565" cy="300" r="16" fill="#343a40" stroke="#212529" stroke-width="3"/><circle cx="645" cy="300" r="16" fill="#343a40" stroke="#212529" stroke-width="3"/><line x1="165" y1="400" x2="165" y2="350" stroke="#212529" stroke-width="8" /><rect x="130" y="335" width="100" height="16" rx="6" fill="#495057" stroke="#212529" stroke-width="2" /><rect x="30.0" y="110" width="270" height="105" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="2.5" />
<text x="165" y="144.5" font-size="20" text-anchor="middle" font-weight="normal" fill="#212529">Malý píst – malá síla</text>
<text x="165" y="169.5" font-size="20" text-anchor="middle" font-weight="normal" fill="#212529">(zde působíme rukou</text>
<text x="165" y="194.5" font-size="20" text-anchor="middle" font-weight="normal" fill="#212529">či nohou na pedálu)</text><rect x="450.0" y="70" width="310" height="105" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="2.5" />
<text x="605" y="104.5" font-size="20" text-anchor="middle" font-weight="normal" fill="#212529">Velký píst – velká síla</text>
<text x="605" y="129.5" font-size="20" text-anchor="middle" font-weight="normal" fill="#212529">(zde umístíme</text>
<text x="605" y="154.5" font-size="20" text-anchor="middle" font-weight="normal" fill="#212529">náklad)</text><rect x="50.0" y="610" width="860" height="76" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2.5" />
<text x="480" y="642.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#212529">Kolikrát je druhý píst větší než první,</text>
<text x="480" y="669.5" font-size="22" text-anchor="middle" font-weight="bold" fill="#212529">přesně tolikrát větší síla na něj působí</text>
</svg>
