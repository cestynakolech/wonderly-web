<svg viewBox="0 0 460 680" width="460" height="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Objem v pohybu, 1 litr = 1 dm³: odměrka se stupnicí je plná, voda sahá k rysce 1 l. Odměrku pomalu nakláníme a vodu přeléváme hubičkou do prázdné krychle s hranou 1 dm. Hladina v odměrce zůstává vodorovná. V odměrce vody ubývá, v krychli hladina stoupá, až je krychle přesně plná a odměrka prázdná. Platí 1 l = 1 dm³ a 1 dm³ = 1 000 cm³ = 1 000 ml." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Objem v pohybu: 1 litr = 1 dm³</title>
	<!-- W98 (oprava 2). Předloha: PDF 6/03 Fyzikální veličiny/ 8.  Objem, s. 2 (krychle s hranami), s. 3 (decimetr krychlový = 1 litr, 1 dm³ = 1 000 cm³), s. 4 (1 l = 1 000 ml, „1 litr = 1 decimetr krychlový“), s. 5 (most 1 l = 1 dm³, hrnek s uchem); výklad temata.ts. Měřítko 15 px/cm: hrana krychle 150 px = 10 cm; odměrka válcová, vnitřní průměr 11 cm (165 px), výška 11,5 cm (172,5 px), ryska 1 l ve výšce 10,5 cm (157,5 px): π·5,5²·10,5 = 998 cm³ ≈ 1 l; stupnice po 100 ml = 15,75 px.
	Hladina: voda je vodorovně oříznutá plocha. Skupina b3ot (posun + náklon o θ kolem ústí) → clipPath b3vn (vnitřek odměrky, otáčí se s ní) → b3or (rotate −θ, vrací vodorovnou polohu) → b3oh (výška hladiny pod ústím). Při lití je hladina přesně ve výšce ústí (h = 0), nikdy nad ním. θ(t) spočítán z bilance objemu válce (3D, vodorovná rovina): objem v odměrce = 1 l − objem v krychli, krychle se plní lineárně 1,76–4,4 s; odchylka ≤ 1,2 ml. Lití začíná při θ = 10,3°, končí při 90°. Cyklus 8 s: stojí 0–1,2 s, náklon k ústí do 1,76 s, přelévání do 4,4 s, výsledek od 4,8 s. Klid (reduced motion): prázdná ležící odměrka, plná krychle a rovnost. -->
	<defs>
		<clipPath id="b3vn"><rect x="-165" y="0" width="165" height="172.5" /></clipPath>
		<clipPath id="b3pk"><rect x="0" y="0" width="460" height="530" /></clipPath>
	</defs>
	<style>
		.b3pa { animation: b3pa 8s step-end infinite; }
		@keyframes b3pa { 0% { opacity: 1; } 60% { opacity: 0; } 100% { opacity: 0; } }
		.b3pb { animation: b3pb 8s step-end infinite; }
		@keyframes b3pb { 0% { opacity: 0; } 60% { opacity: 1; } 100% { opacity: 1; } }
		.b3pc { animation: b3pc 8s step-end infinite; }
		@keyframes b3pc { 0% { opacity: 1; } 15% { opacity: 0; } 100% { opacity: 0; } }
		.b3ps { animation: b3ps 8s step-end infinite; }
		@keyframes b3ps { 0% { opacity: 0; } 22% { opacity: 1; } 55% { opacity: 0; } 100% { opacity: 0; } }
		.b3ou { animation: b3ou 8s step-end infinite; }
		@keyframes b3ou { 0% { opacity: 1; } 55.5% { opacity: 0; } 100% { opacity: 0; } }
		.b3vp { animation: b3vp 8s linear infinite; }
		@keyframes b3vp { 0% { transform: translate(134px,530px) scale(1,0); } 22% { transform: translate(134px,530px) scale(1,0); } 55% { transform: translate(134px,530px) scale(1,1); } 100% { transform: translate(134px,530px) scale(1,1); } }
		.b3vb { animation: b3vb 8s linear infinite; }
		@keyframes b3vb { 0% { transform: translate(284px,530px) skewY(-37.235deg) scale(1,0); } 22% { transform: translate(284px,530px) skewY(-37.235deg) scale(1,0); } 55% { transform: translate(284px,530px) skewY(-37.235deg) scale(1,1); } 100% { transform: translate(284px,530px) skewY(-37.235deg) scale(1,1); } }
		.b3vh { animation: b3vh 8s linear infinite; }
		@keyframes b3vh { 0% { transform: translate(134px,528.5px); opacity: 0; } 22% { transform: translate(134px,528.5px); opacity: 0; } 23% { opacity: 1; } 55% { transform: translate(134px,380px); opacity: 1; } 100% { transform: translate(134px,380px); opacity: 1; } }
		.b3ot { animation: b3ot 8s linear infinite; }
		@keyframes b3ot { 0% { transform: translate(245px,150px) rotate(0deg); } 15% { transform: translate(245px,150px) rotate(0deg); } 18.5% { transform: translate(242.5px,153px) rotate(5.15deg); } 22% { transform: translate(240px,156px) rotate(10.3deg); } 23.38% { transform: translate(245px,160.1px) rotate(14.65deg); } 24.75% { transform: translate(249.9px,164.1px) rotate(18.82deg); } 26.13% { transform: translate(254.5px,167.9px) rotate(22.8deg); } 27.5% { transform: translate(257.9px,172.5px) rotate(26.57deg); } 28.88% { transform: translate(259.8px,178.2px) rotate(30.09deg); } 30.25% { transform: translate(261.6px,183.4px) rotate(33.39deg); } 31.63% { transform: translate(263.3px,188.3px) rotate(36.45deg); } 33% { transform: translate(264.9px,192.9px) rotate(39.29deg); } 34.38% { transform: translate(266.3px,197.1px) rotate(41.92deg); } 35.75% { transform: translate(267.6px,200.9px) rotate(44.34deg); } 37.13% { transform: translate(268.1px,205px) rotate(46.58deg); } 38.5% { transform: translate(268.2px,209px) rotate(48.73deg); } 39.88% { transform: translate(268.3px,213px) rotate(50.89deg); } 41.25% { transform: translate(268.4px,217.1px) rotate(53.12deg); } 42.63% { transform: translate(268.5px,221.5px) rotate(55.44deg); } 44% { transform: translate(268.6px,226px) rotate(57.87deg); } 45.38% { transform: translate(268.7px,230.9px) rotate(60.46deg); } 46.75% { transform: translate(268.8px,236px) rotate(63.22deg); } 48.13% { transform: translate(268.9px,241.5px) rotate(66.18deg); } 49.5% { transform: translate(269.1px,247.6px) rotate(69.41deg); } 50.88% { transform: translate(269.2px,254.2px) rotate(72.98deg); } 52.25% { transform: translate(269.4px,261.8px) rotate(77.01deg); } 53.63% { transform: translate(269.6px,270.8px) rotate(81.85deg); } 54.01% { transform: translate(269.7px,273.8px) rotate(83.47deg); } 54.51% { transform: translate(269.8px,278.4px) rotate(85.9deg); } 54.84% { transform: translate(269.9px,282.3px) rotate(88.04deg); } 55% { transform: translate(270px,286px) rotate(90deg); } 100% { transform: translate(270px,286px) rotate(90deg); } }
		.b3or { animation: b3or 8s linear infinite; }
		@keyframes b3or { 0% { transform: rotate(0deg); } 15% { transform: rotate(0deg); } 18.5% { transform: rotate(-5.15deg); } 22% { transform: rotate(-10.3deg); } 23.38% { transform: rotate(-14.65deg); } 24.75% { transform: rotate(-18.82deg); } 26.13% { transform: rotate(-22.8deg); } 27.5% { transform: rotate(-26.57deg); } 28.88% { transform: rotate(-30.09deg); } 30.25% { transform: rotate(-33.39deg); } 31.63% { transform: rotate(-36.45deg); } 33% { transform: rotate(-39.29deg); } 34.38% { transform: rotate(-41.92deg); } 35.75% { transform: rotate(-44.34deg); } 37.13% { transform: rotate(-46.58deg); } 38.5% { transform: rotate(-48.73deg); } 39.88% { transform: rotate(-50.89deg); } 41.25% { transform: rotate(-53.12deg); } 42.63% { transform: rotate(-55.44deg); } 44% { transform: rotate(-57.87deg); } 45.38% { transform: rotate(-60.46deg); } 46.75% { transform: rotate(-63.22deg); } 48.13% { transform: rotate(-66.18deg); } 49.5% { transform: rotate(-69.41deg); } 50.88% { transform: rotate(-72.98deg); } 52.25% { transform: rotate(-77.01deg); } 53.63% { transform: rotate(-81.85deg); } 54.01% { transform: rotate(-83.47deg); } 54.51% { transform: rotate(-85.9deg); } 54.84% { transform: rotate(-88.04deg); } 55% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }
		.b3oh { animation: b3oh 8s linear infinite; }
		@keyframes b3oh { 0% { transform: translate(0px,15px); } 15% { transform: translate(0px,15px); } 18.5% { transform: translate(0px,7.53px); } 22% { transform: translate(0px,0px); } 100% { transform: translate(0px,0px); } }
		.b3pr { animation: b3pr 8s linear infinite; }
		@keyframes b3pr { 0% { transform: translate(245px,150px); } 15% { transform: translate(245px,150px); } 18.5% { transform: translate(242.5px,153px); } 22% { transform: translate(240px,156px); } 23.38% { transform: translate(245px,160.1px); } 24.75% { transform: translate(249.9px,164.1px); } 26.13% { transform: translate(254.5px,167.9px); } 27.5% { transform: translate(257.9px,172.5px); } 28.88% { transform: translate(259.8px,178.2px); } 30.25% { transform: translate(261.6px,183.4px); } 31.63% { transform: translate(263.3px,188.3px); } 33% { transform: translate(264.9px,192.9px); } 34.38% { transform: translate(266.3px,197.1px); } 35.75% { transform: translate(267.6px,200.9px); } 37.13% { transform: translate(268.1px,205px); } 38.5% { transform: translate(268.2px,209px); } 39.88% { transform: translate(268.3px,213px); } 41.25% { transform: translate(268.4px,217.1px); } 42.63% { transform: translate(268.5px,221.5px); } 44% { transform: translate(268.6px,226px); } 45.38% { transform: translate(268.7px,230.9px); } 46.75% { transform: translate(268.8px,236px); } 48.13% { transform: translate(268.9px,241.5px); } 49.5% { transform: translate(269.1px,247.6px); } 50.88% { transform: translate(269.2px,254.2px); } 52.25% { transform: translate(269.4px,261.8px); } 53.63% { transform: translate(269.6px,270.8px); } 54.01% { transform: translate(269.7px,273.8px); } 54.51% { transform: translate(269.8px,278.4px); } 54.84% { transform: translate(269.9px,282.3px); } 55% { transform: translate(270px,286px); } 100% { transform: translate(270px,286px); } }
		@media (prefers-reduced-motion: reduce) {
			.b3pa, .b3pb, .b3pc, .b3ps, .b3ou, .b3vp, .b3vb, .b3vh, .b3ot, .b3or, .b3oh, .b3pr { animation: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="680" fill="#f8f9fa" />
	<g id="panel-1">
		<rect x="26" y="22" width="420" height="648" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="648" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">1</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">1 litr = 1 dm³</text>
		<text x="318" y="200" font-size="20" fill="#2b2a26">odměrka</text>
		<g class="b3pc" opacity="0">
			<text x="318" y="228" font-size="20" font-weight="bold" fill="#2b2a26">1 l vody</text>
			<text x="256" y="172" font-size="20" font-weight="bold" fill="#2b2a26">1 l</text>
		</g>
		<!-- skryté hrany krychle (za vodou) -->
		<path d="M184 342V492H334M184 492L134 530" fill="none" stroke="#2b2a26" stroke-width="2" stroke-dasharray="6 5" />
		<!-- proud vody z hubičky: jede s ústím, končí u dna krychle (pod hladinou ho zakryje voda) -->
		<g clip-path="url(#b3pk)">
			<g class="b3pr" transform="translate(270,286)">
				<rect class="b3ps" x="3" y="-1" width="7" height="400" fill="#228be6" opacity="0" />
			</g>
		</g>
		<!-- odměrka 11 cm × 11,5 cm (15 px/cm), ryska 1 l ve výšce 10,5 cm; otočný bod = ústí u hubičky (0,0) -->
		<g class="b3ot" transform="translate(270,286) rotate(90)">
			<!-- voda: vodorovně oříznutá plocha uvnitř odměrky, hladina nikdy nad ústím -->
			<g class="b3ou" opacity="0">
				<g clip-path="url(#b3vn)">
					<g class="b3or" transform="rotate(-90)">
						<g class="b3oh" transform="translate(0,0)">
							<rect x="-300" y="0" width="600" height="400" fill="#228be6" />
							<path d="M-300 0H300" stroke="#0b3d6e" stroke-width="2.5" />
						</g>
					</g>
				</g>
			</g>
			<rect x="-156" y="10" width="7" height="152" rx="3.5" fill="#ffffff" opacity="0.55" />
			<path d="M-14 156.75H-2M-14 141H-2M-14 125.25H-2M-14 109.5H-2M-26 93.75H-2M-14 78H-2M-14 62.25H-2M-14 46.5H-2M-14 30.75H-2M-30 15H-2" stroke="#2b2a26" stroke-width="2" />
			<path d="M-165 35C-200 35 -200 135 -165 135" fill="none" stroke="#495057" stroke-width="7" stroke-linecap="round" />
			<path d="M-165 35C-188 37 -188 133 -165 135" fill="none" stroke="#fbfaf6" stroke-width="2" opacity="0.6" />
			<path d="M-169 -7Q-165 -5 -165 0V172.5H0V0Q3 -0.5 9 -1.5" fill="none" stroke="#495057" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
			<path d="M-165 172.5H0" stroke="#495057" stroke-width="5" />
		</g>
		<!-- voda v krychli -->
		<g class="b3vb" transform="translate(284,530) skewY(-37.235) scale(1,1)"><rect x="0" y="-150" width="50" height="150" fill="#1971c2" /></g>
		<g class="b3vp" transform="translate(134,530) scale(1,1)"><rect x="0" y="-150" width="150" height="150" fill="#228be6" /></g>
		<g class="b3vh" transform="translate(134,380)"><path d="M0 0H150L200 -38H50Z" fill="#74c0fc" stroke="#0b3d6e" stroke-width="2" /></g>
		<!-- viditelné hrany krychle -->
		<path d="M134 380H284V530H134Z M134 380L184 342H334L284 380 M334 342V492L284 530" fill="none" stroke="#2b2a26" stroke-width="3" stroke-linejoin="round" />
		<g font-size="20" fill="#2b2a26">
			<text x="209" y="556" text-anchor="middle">1 dm</text>
			<text x="124" y="462" text-anchor="end">1 dm</text>
			<text x="324" y="538">1 dm</text>
		</g>
		<g class="b3pa" opacity="0">
			<text x="40" y="596" font-size="20" fill="#2b2a26">Přelijeme 1 l vody do prázdné</text>
			<text x="40" y="624" font-size="20" fill="#2b2a26">krychle s hranou 1 dm.</text>
		</g>
		<g class="b3pb">
			<text x="40" y="588" font-size="20" fill="#2b2a26">Voda krychli přesně zaplní:</text>
			<text x="40" y="618" font-size="24" font-weight="bold" fill="#c92a2a">1 l = 1 dm³</text>
			<text x="40" y="648" font-size="20" font-weight="bold" fill="#2b2a26">1 dm³ = 1 000 cm³ = 1 000 ml</text>
		</g>
	</g>
</svg>
