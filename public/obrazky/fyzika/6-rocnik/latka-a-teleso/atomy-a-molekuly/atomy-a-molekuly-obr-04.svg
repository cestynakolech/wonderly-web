<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Molekuly ze stejných atomů: molekula kyslíku O2 ze 2 atomů kyslíku, molekula vodíku H2 ze 2 atomů vodíku a molekula dusíku N2 ze 2 atomů dusíku. Animace: dva atomy se k sobě přiblíží a spojí do molekuly.">
<style>
@keyframes s00 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(-46px,0px); } 90%,100% { transform: translate(0,0); } }
.s00 { animation: s00 6s ease-in-out infinite; }
@keyframes s01 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(46px,0px); } 90%,100% { transform: translate(0,0); } }
.s01 { animation: s01 6s ease-in-out infinite; }
@keyframes s10 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(-46px,0px); } 90%,100% { transform: translate(0,0); } }
.s10 { animation: s10 6s ease-in-out infinite; }
@keyframes s11 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(46px,0px); } 90%,100% { transform: translate(0,0); } }
.s11 { animation: s11 6s ease-in-out infinite; }
@keyframes s20 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(-40px,-23px); } 90%,100% { transform: translate(0,0); } }
.s20 { animation: s20 6s ease-in-out infinite; }
@keyframes s21 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(40px,23px); } 90%,100% { transform: translate(0,0); } }
.s21 { animation: s21 6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
/* Předloha: molekuly O2, H2 a N2 jako spojené koule s popisky atomů.
   Animace (6 s): hotová molekula se rozdělí na atomy a ty se znovu spojí; bez animace = hotová molekula. */
</style>
<defs><radialGradient id="gH" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#f7f8fa"/><stop offset="0.16" stop-color="#f1f3f5"/><stop offset="0.78" stop-color="#f1f3f5"/><stop offset="1" stop-color="#adb5bd"/></radialGradient><radialGradient id="gO" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#e78d8d"/><stop offset="0.16" stop-color="#d32f2f"/><stop offset="0.78" stop-color="#d32f2f"/><stop offset="1" stop-color="#891f1f"/></radialGradient><radialGradient id="gC" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#8f9396"/><stop offset="0.16" stop-color="#343a40"/><stop offset="0.78" stop-color="#343a40"/><stop offset="1" stop-color="#22262a"/></radialGradient><radialGradient id="gN" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#93a5eb"/><stop offset="0.16" stop-color="#3b5bdb"/><stop offset="0.78" stop-color="#3b5bdb"/><stop offset="1" stop-color="#263b8e"/></radialGradient><radialGradient id="gCl" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#acebb7"/><stop offset="0.16" stop-color="#69db7c"/><stop offset="0.78" stop-color="#69db7c"/><stop offset="1" stop-color="#448e51"/></radialGradient><radialGradient id="gNa" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#b09af2"/><stop offset="0.16" stop-color="#7048e8"/><stop offset="0.78" stop-color="#7048e8"/><stop offset="1" stop-color="#492f97"/></radialGradient><radialGradient id="gHe" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#fddf80"/><stop offset="0.16" stop-color="#fcc419"/><stop offset="0.78" stop-color="#fcc419"/><stop offset="1" stop-color="#a47f10"/></radialGradient><radialGradient id="gP" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#fbab77"/><stop offset="0.16" stop-color="#f76707"/><stop offset="0.78" stop-color="#f76707"/><stop offset="1" stop-color="#a14305"/></radialGradient></defs>
<rect x="3" y="3" width="954" height="464" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/><text x="480.0" y="44" font-size="28" fill="#212529" text-anchor="middle" font-weight="bold">Molekuly ze stejných atomů</text><text x="480.0" y="78" font-size="20" fill="#495057" text-anchor="middle">Molekuly vznikají spojením dvou a více atomů.</text><g class="s00"><circle cx="128.0" cy="230.0" r="56.0" fill="url(#gO)" stroke="#6a1818" stroke-width="1.5"/><text x="106.0" y="241.9" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="bold">O</text></g><g class="s01"><circle cx="192.0" cy="230.0" r="56.0" fill="url(#gO)" stroke="#6a1818" stroke-width="1.5"/><text x="214.0" y="241.9" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="bold">O</text></g><text x="160" y="360" font-size="21" fill="#212529" text-anchor="middle" font-weight="bold">molekula kyslíku O<tspan font-size="14" dy="6">2</tspan></text><text x="160" y="390" font-size="20" fill="#495057" text-anchor="middle">2 atomy kyslíku O</text><g class="s10"><circle cx="460.0" cy="230.0" r="36.0" fill="url(#gH)" stroke="#868e96" stroke-width="1.5"/><text x="446.0" y="237.7" font-size="22" fill="#212529" text-anchor="middle" font-weight="bold">H</text></g><g class="s11"><circle cx="500.0" cy="230.0" r="36.0" fill="url(#gH)" stroke="#868e96" stroke-width="1.5"/><text x="514.0" y="237.7" font-size="22" fill="#212529" text-anchor="middle" font-weight="bold">H</text></g><text x="480" y="360" font-size="21" fill="#212529" text-anchor="middle" font-weight="bold">molekula vodíku H<tspan font-size="14" dy="6">2</tspan></text><text x="480" y="390" font-size="20" fill="#495057" text-anchor="middle">2 atomy vodíku H</text><g class="s20"><circle cx="770.0" cy="213.0" r="58.0" fill="url(#gN)" stroke="#1e2e6e" stroke-width="1.5"/><text x="770.0" y="224.9" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="bold">N</text></g><g class="s21"><circle cx="830.0" cy="247.0" r="58.0" fill="url(#gN)" stroke="#1e2e6e" stroke-width="1.5"/><text x="830.0" y="258.9" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="bold">N</text></g><text x="800" y="360" font-size="21" fill="#212529" text-anchor="middle" font-weight="bold">molekula dusíku N<tspan font-size="14" dy="6">2</tspan></text><text x="800" y="390" font-size="20" fill="#495057" text-anchor="middle">2 atomy dusíku N</text>
</svg>
