<!-- balónek -->
<g transform="translate(445 375)">
<path d="M0 50Q-6 56 3 60T0 68" stroke="#495057" stroke-width="2" fill="none"/>
<ellipse cx="0" cy="-4" rx="40" ry="48" fill="url(#bal)" stroke="#a63a07" stroke-width="2"/>
<path d="M-6 50L6 50L0 42Z" fill="#c2410c"/>
<ellipse cx="-16" cy="-26" rx="8" ry="14" fill="#fff" opacity="0.55" transform="rotate(25 -16 -26)"/>
</g>
<!-- hřebík -->
<g transform="translate(155 600) rotate(-25)">
<path d="M-62 -5L58 -5L82 0L58 5L-62 5Z" fill="url(#kov)" stroke="#343a40" stroke-width="2"/>
<rect x="-74" y="-18" width="12" height="36" rx="3" fill="url(#kov)" stroke="#343a40" stroke-width="2"/>
<path d="M-56 -2H50" stroke="#fff" stroke-width="2" opacity="0.7"/>
</g>
<!-- oblak -->
<g transform="translate(445 610)">
<path d="M-70 26Q-92 26 -90 6Q-88 -14 -64 -12Q-62 -40 -30 -42Q-10 -62 18 -46Q48 -58 60 -28Q90 -26 88 2Q86 26 62 26Z" fill="url(#oblak)" stroke="#868e96" stroke-width="3"/>
</g>
<!-- popisky šesti karet -->
<g font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">
<text x="155" y="245">stůl</text><text x="445" y="245">kniha</text>
<text x="155" y="470">mléko v lahvi</text><text x="445" y="470">vzduch v balónku</text>
<text x="155" y="695">hřebík</text><text x="445" y="695">oblak</text>
</g>
<g font-size="24" fill="#212529" text-anchor="middle">
<text x="155" y="273">ze dřeva</text><text x="445" y="273">z papíru</text>
<text x="155" y="498">z mléka</text><text x="445" y="498">ze vzduchu</text>
<text x="155" y="723">ze železa</text><text x="445" y="723">z vody</text>
</g>
<!-- okno -->
<rect x="50" y="772" width="180" height="178" rx="3" fill="url(#dr)" stroke="#6b3f17" stroke-width="2.5"/>
<rect x="64" y="786" width="70" height="150" fill="url(#sklo)" stroke="#6b3f17" stroke-width="2"/>
<rect x="146" y="786" width="70" height="150" fill="url(#sklo)" stroke="#6b3f17" stroke-width="2"/>
<path d="M74 830L110 794M74 860L124 810M156 830L192 794M156 860L206 810" stroke="#fff" stroke-width="5" opacity="0.7"/>
<rect x="134" y="786" width="12" height="150" fill="#b8763a" stroke="#6b3f17" stroke-width="1.5"/>
<rect x="135" y="852" width="10" height="16" rx="2" fill="url(#kov)" stroke="#343a40" stroke-width="1.5"/>
<rect x="138" y="862" width="6" height="34" rx="3" fill="url(#kov)" stroke="#343a40" stroke-width="1.5"/>
<g stroke="#212529" stroke-width="2"><path d="M256 806L196 806"/><path d="M256 866L224 900"/><path d="M256 926L146 884"/></g>
<g fill="#212529"><circle cx="196" cy="806" r="4"/><circle cx="224" cy="900" r="4"/><circle cx="146" cy="884" r="4"/></g>
<g font-size="24" fill="#212529"><text x="262" y="814">sklo</text><text x="262" y="874">dřevo</text><text x="262" y="934">železo</text></g>
<text x="470" y="838" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">okno</text>
<text x="470" y="874" font-size="24" fill="#212529" text-anchor="middle">z části ze skla,</text>
<text x="470" y="904" font-size="24" fill="#212529" text-anchor="middle">ze dřeva</text>
<text x="470" y="934" font-size="24" fill="#212529" text-anchor="middle">a ze železa</text>
</svg>
