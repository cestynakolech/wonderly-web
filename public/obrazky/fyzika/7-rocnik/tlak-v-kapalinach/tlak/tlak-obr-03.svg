<text x="480" y="52" font-size="28" text-anchor="middle" fill="#212529" font-weight="bold">Proč to bolí? Stejná osoba, stejná váha.</text><rect x="40" y="90" width="880" height="410" rx="14" fill="#fff3bf" stroke="#e67700" stroke-width="3"/><ellipse cx="200" cy="190" rx="50" ry="75" fill="#4dabf7" stroke="#1971c2" stroke-width="3"/><rect x="178" y="255" width="44" height="75" fill="#dee2e6" stroke="#495057" stroke-width="3"/><circle cx="200" cy="350" r="26" fill="#dee2e6" stroke="#495057" stroke-width="3"/><circle cx="200" cy="350" r="13" fill="#4dabf7" stroke="#1971c2" stroke-width="3"/><ellipse cx="760" cy="270" rx="80" ry="150" fill="#4dabf7" stroke="#1971c2" stroke-width="4"/><line x1="410" y1="240" x2="246" y2="240" stroke="#212529" stroke-width="4" marker-end="url(#ak)"/><line x1="550" y1="240" x2="668" y2="240" stroke="#212529" stroke-width="4" marker-end="url(#ak)"/><rect x="400" y="224" width="160" height="36" rx="8" fill="#ffffff" fill-opacity="0.95" stroke="#adb5bd" stroke-width="1.5"/><text x="480" y="248" font-size="22" text-anchor="middle" fill="#212529" font-weight="bold">stejná váha</text><text x="200" y="535" font-size="22" text-anchor="middle" fill="#212529" font-weight="bold">malá plocha, velký tlak</text><text x="760" y="535" font-size="22" text-anchor="middle" fill="#212529" font-weight="bold">velká plocha, malý tlak</text><text x="480" y="578" font-size="20" text-anchor="middle" fill="#1971c2" font-weight="bold">modře: dotyková plocha s podložkou</text>
