			<circle class="tl" style="animation-delay:0.674s" cx="230" cy="282" r="7" fill="#4dabf7" stroke="#1864ab" stroke-width="2" />
			<circle class="tl" style="animation-delay:0.748s" cx="250" cy="282" r="7" fill="#4dabf7" stroke="#1864ab" stroke-width="2" />
			<circle class="tl" style="animation-delay:0.822s" cx="270" cy="282" r="7" fill="#4dabf7" stroke="#1864ab" stroke-width="2" />
			<circle class="tl" style="animation-delay:0.896s" cx="290" cy="282" r="7" fill="#4dabf7" stroke="#1864ab" stroke-width="2" />
			<circle class="tl" style="animation-delay:0.970s" cx="310" cy="282" r="7" fill="#4dabf7" stroke="#1864ab" stroke-width="2" />
			<circle class="tl" style="animation-delay:1.044s" cx="330" cy="282" r="7" fill="#4dabf7" stroke="#1864ab" stroke-width="2" />
