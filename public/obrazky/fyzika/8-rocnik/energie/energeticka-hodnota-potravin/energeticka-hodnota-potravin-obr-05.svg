<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace výpočtu: kelímek jogurtu stojí na kuchyňské váze, displej ukazuje 150 g. Na obalu je 400 kJ ve 100 g. Vpravo se postupně objeví dlouhý pruh 100 g, kterému patří 400 kJ, pak poloviční pruh 50 g s 200 kJ (polovina ze 400 kJ) a nakonec výsledek: celý kelímek má 400 kJ + 200 kJ = 600 kJ.">
<style>
/* Předloha: PDF „Energetická hodnota potravin“ (8/2 Energie/6), s. 2 („udává se na 100 g; kolik jsme snědli, vypočteme podle hmotnosti potravin“).
   PDF na straně nemá obrázek, animace ilustruje text. Čísla (400 kJ / 100 g, kelímek 150 g, 400 + 200 = 600 kJ) jsou z příkladu
   ve výkladu (Pro zvídavé, „Počítáme energii porce“). Cyklus 8 s: 10–16 % pruh 100 g; 34–40 % pruh 50 g;
   58–64 % výsledek; do 94 % drží; 94–100 % zmizí. Bez animace (reduced-motion) = vše vidět najednou. */
.k1 { animation: k1 8s ease-in-out infinite; }
.k2 { animation: k2 8s ease-in-out infinite; }
.k3 { animation: k3 8s ease-in-out infinite; }
@keyframes k1 { 0%, 10% { opacity: 0; } 16%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes k2 { 0%, 34% { opacity: 0; } 40%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes k3 { 0%, 58% { opacity: 0; } 64%, 94% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .k1, .k2, .k3 { animation: none; } }
</style>
<defs>
<linearGradient id="kel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9ecef"/><stop offset="0.45" stop-color="#ffffff"/><stop offset="1" stop-color="#dee2e6"/></linearGradient>
<linearGradient id="vaha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dee2e6"/><stop offset="1" stop-color="#adb5bd"/></linearGradient>
<marker id="m-sed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#495057"/></marker>
</defs>
<rect x="3" y="3" width="714" height="554" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="360" y="44" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Kolik energie má kelímek jogurtu?</text>
<text x="360" y="84" font-size="22" fill="#212529" text-anchor="middle">Na obalu: 400 kJ ve 100 g · kelímek váží 150 g</text>

<!-- kuchyňská váha -->
<ellipse cx="180" cy="466" rx="130" ry="12" fill="#000" opacity="0.12"/>
<path d="M70,404 L290,404 L304,462 L56,462 Z" fill="url(#vaha)" stroke="#495057" stroke-width="3" stroke-linejoin="round"/>
<rect x="120" y="416" width="120" height="36" rx="6" fill="#212529"/>
<text x="180" y="443" font-size="24" font-weight="bold" fill="#8ce99a" text-anchor="middle">150 g</text>
<ellipse cx="180" cy="398" rx="118" ry="10" fill="#ced4da" stroke="#495057" stroke-width="3"/>

<!-- kelímek jogurtu -->
<path d="M114,232 L246,232 L232,392 L128,392 Z" fill="url(#kel)" stroke="#495057" stroke-width="3" stroke-linejoin="round"/>
<path d="M118,270 L242,270 L236,340 L124,340 Z" fill="#d0ebff" stroke="#1864ab" stroke-width="2"/>
<text x="180" y="300" font-size="22" font-weight="bold" fill="#1864ab" text-anchor="middle">JOGURT</text>
<text x="180" y="328" font-size="20" fill="#1864ab" text-anchor="middle">150 g</text>
<ellipse cx="180" cy="232" rx="68" ry="12" fill="#e9ecef" stroke="#495057" stroke-width="3"/>
<path d="M114,232 q-6,-8 4,-12 L242,220 q10,4 4,12" fill="#ced4da" stroke="#495057" stroke-width="2"/>
<path d="M134,244 L142,384" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

<!-- výpočet -->
<g class="k1">
<path d="M252,262 C290,250 310,200 342,182" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#m-sed)"/>
<rect x="350" y="150" width="200" height="64" rx="8" fill="#a5d8ff" stroke="#1864ab" stroke-width="3"/>
<text x="450" y="191" font-size="26" font-weight="bold" fill="#0b3d6b" text-anchor="middle">100 g</text>
<text x="566" y="191" font-size="28" font-weight="bold" fill="#c92a2a">400 kJ</text>
</g>
<g class="k2">
<path d="M252,300 C290,300 310,276 342,268" fill="none" stroke="#495057" stroke-width="3" marker-end="url(#m-sed)"/>
<rect x="350" y="236" width="100" height="64" rx="8" fill="#a5d8ff" stroke="#1864ab" stroke-width="3"/>
<text x="400" y="277" font-size="26" font-weight="bold" fill="#0b3d6b" text-anchor="middle">50 g</text>
<text x="566" y="277" font-size="28" font-weight="bold" fill="#c92a2a">200 kJ</text>
<text x="350" y="332" font-size="20" fill="#212529">50 g je polovina ze 100 g:</text>
<text x="350" y="358" font-size="20" fill="#212529">400 : 2 = 200 kJ</text>
</g>
<g class="k3">
<rect x="30" y="486" width="660" height="56" rx="14" fill="#fff3bf" stroke="#f08c00" stroke-width="3"/>
<text x="360" y="523" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">Celý kelímek: 400 kJ + 200 kJ = 600 kJ</text>
</g>
</svg>
