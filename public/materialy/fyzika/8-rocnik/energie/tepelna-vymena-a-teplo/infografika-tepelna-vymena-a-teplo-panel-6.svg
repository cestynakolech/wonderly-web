		@keyframes p6-zhav { 0%, 10% { opacity: 0; } 30%, 92% { opacity: 1; } 100% { opacity: 0; } }
		@keyframes p6-chl { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -40; } }
		@media (prefers-reduced-motion: reduce) { .p6-tok, .p6-zpet, .p6-zhav, .p6-chl { animation: none; } }
