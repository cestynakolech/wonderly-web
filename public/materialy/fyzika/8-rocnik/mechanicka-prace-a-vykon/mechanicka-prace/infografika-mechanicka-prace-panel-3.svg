<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 820 460 704" width="460" height="704" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kdy se práce nekoná: 1. těleso se nehne (Michal tlačí na tyč silou 20 N, s = 0 m, W = 0 J); 2. nepůsobí žádná síla (Michal na skateboardu se neodráží, F = 0 N, s = 250 m, W = 0 J); 3. síla míří kolmo na pohyb (neseš tašku vodorovně, F nahoru, s vodorovně, W = 0 J).">
	<title>Mechanická práce 3/4: Kdy se práce nekoná?</title>
	<!-- Panel 3/4 výřezu z infografika-mechanicka-prace.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.mpa-pulz { animation: mpa-pulz 1.4s ease-in-out infinite; }
		.mpa-skate { animation: mpa-klouz 5s linear infinite; }
		.mpa-taska { animation: mpa-nes 5s linear infinite; }
		@keyframes mpa-pulz { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
		@keyframes mpa-klouz { 0%, 10% { transform: translateX(-150px); } 80%, 100% { transform: translateX(0); } }
		@keyframes mpa-nes { 0%, 10% { transform: translateX(-110px); } 80%, 100% { transform: translateX(0); } }
		@media (prefers-reduced-motion: reduce) {
			.mpa-pulz, .mpa-skate, .mpa-taska { animation: none; }
		}
	</style>
	<defs>
		<marker id="mpa-cer" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#c92a2a" /></marker>
		<marker id="mpa-mod" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 z" fill="#1971c2" /></marker>
	</defs>

	<rect x="0" y="820" width="460" height="704" fill="#f8f9fa" />
	<g id="mpa-nekona">
		<rect x="10" y="830" width="440" height="684" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="2" />
		<text x="26" y="864" font-size="25" font-weight="bold" fill="#2b2a26">Kdy se práce nekoná?</text>

		<text x="26" y="908" font-size="22" font-weight="bold" fill="#2b2a26">1. Těleso se nehne</text>
		<rect x="26" y="1008" width="408" height="8" fill="#ced4da" />
		<line x1="26" y1="1008" x2="434" y2="1008" stroke="#495057" stroke-width="3" />
		<rect x="250" y="918" width="16" height="90" fill="#868e96" stroke="#495057" stroke-width="2" />
		<circle cx="196" cy="948" r="11" fill="#ffd8a8" stroke="#495057" stroke-width="2" />
		<line x1="200" y1="959" x2="188" y2="986" stroke="#343a40" stroke-width="9" stroke-linecap="round" />
		<line x1="199" y1="966" x2="249" y2="972" stroke="#343a40" stroke-width="5" stroke-linecap="round" />
		<line x1="188" y1="986" x2="176" y2="1008" stroke="#343a40" stroke-width="6" stroke-linecap="round" />
		<line x1="188" y1="986" x2="200" y2="1008" stroke="#343a40" stroke-width="6" stroke-linecap="round" />
		<line class="mpa-pulz" x1="212" y1="972" x2="248" y2="972" stroke="#c92a2a" stroke-width="6" marker-end="url(#mpa-cer)" />
		<text x="282" y="952" font-size="22" font-weight="bold" fill="#c92a2a">F = 20 N</text>
		<text x="282" y="982" font-size="22" font-weight="bold" fill="#1971c2">s = 0 m</text>
		<text x="26" y="1050" font-size="22" fill="#2b2a26">Michal tlačí na tyč, ta se nehne.</text>
		<text x="26" y="1078" font-size="22" font-weight="bold" fill="#2b2a26">W = 0 J → práci nekoná</text>

		<line x1="26" y1="1090" x2="434" y2="1090" stroke="#e9ecef" stroke-width="2" />
		<text x="26" y="1118" font-size="22" font-weight="bold" fill="#2b2a26">2. Nepůsobí žádná síla</text>
		<line x1="26" y1="1218" x2="434" y2="1218" stroke="#495057" stroke-width="3" />
		<g class="mpa-skate">
			<circle cx="230" cy="1140" r="11" fill="#ffd8a8" stroke="#495057" stroke-width="2" />
			<line x1="230" y1="1152" x2="230" y2="1180" stroke="#343a40" stroke-width="9" stroke-linecap="round" />
			<line x1="230" y1="1160" x2="214" y2="1172" stroke="#343a40" stroke-width="5" stroke-linecap="round" />
			<line x1="230" y1="1160" x2="246" y2="1172" stroke="#343a40" stroke-width="5" stroke-linecap="round" />
			<line x1="227" y1="1180" x2="221" y2="1202" stroke="#343a40" stroke-width="6" stroke-linecap="round" />
			<line x1="233" y1="1180" x2="239" y2="1202" stroke="#343a40" stroke-width="6" stroke-linecap="round" />
			<rect x="205" y="1203" width="50" height="6" rx="3" fill="#e8590c" />
			<circle cx="213" cy="1213" r="5" fill="#2b2a26" />
			<circle cx="247" cy="1213" r="5" fill="#2b2a26" />
		</g>
		<line x1="80" y1="1234" x2="236" y2="1234" stroke="#1971c2" stroke-width="4" marker-end="url(#mpa-mod)" />
		<text x="290" y="1160" font-size="22" font-weight="bold" fill="#c92a2a">F = 0 N</text>
		<text x="290" y="1190" font-size="22" font-weight="bold" fill="#1971c2">s = 250 m</text>
		<text x="26" y="1260" font-size="22" fill="#2b2a26">Michal na skateboardu se neodráží.</text>
		<text x="26" y="1288" font-size="22" font-weight="bold" fill="#2b2a26">W = 0 J → práci nekoná</text>

		<line x1="26" y1="1300" x2="434" y2="1300" stroke="#e9ecef" stroke-width="2" />
		<text x="26" y="1328" font-size="22" font-weight="bold" fill="#2b2a26">3. Síla kolmo na pohyb</text>
		<line x1="26" y1="1428" x2="434" y2="1428" stroke="#495057" stroke-width="3" />
		<g class="mpa-taska">
			<circle cx="200" cy="1352" r="11" fill="#ffd8a8" stroke="#495057" stroke-width="2" />
			<line x1="200" y1="1363" x2="200" y2="1395" stroke="#343a40" stroke-width="9" stroke-linecap="round" />
			<line x1="200" y1="1395" x2="188" y2="1428" stroke="#343a40" stroke-width="6" stroke-linecap="round" />
			<line x1="200" y1="1395" x2="212" y2="1428" stroke="#343a40" stroke-width="6" stroke-linecap="round" />
			<line x1="200" y1="1370" x2="226" y2="1386" stroke="#343a40" stroke-width="5" stroke-linecap="round" />
			<path d="M220,1396 Q228,1376 236,1396" fill="none" stroke="#495057" stroke-width="3" />
			<rect x="214" y="1394" width="28" height="18" rx="4" fill="#ffe8cc" stroke="#e8590c" stroke-width="3" />
			<line x1="228" y1="1382" x2="228" y2="1340" stroke="#c92a2a" stroke-width="6" marker-end="url(#mpa-cer)" />
		</g>
		<line x1="126" y1="1444" x2="236" y2="1444" stroke="#1971c2" stroke-width="4" marker-end="url(#mpa-mod)" />
		<text x="300" y="1370" font-size="22" font-weight="bold" fill="#c92a2a">F nahoru</text>
		<text x="300" y="1400" font-size="22" font-weight="bold" fill="#1971c2">s vodorovně</text>
		<text x="26" y="1470" font-size="22" fill="#2b2a26">Neseš tašku vodorovně.</text>
		<text x="26" y="1498" font-size="22" font-weight="bold" fill="#2b2a26">W = 0 J → práci nekoná</text>
	</g>
</svg>
