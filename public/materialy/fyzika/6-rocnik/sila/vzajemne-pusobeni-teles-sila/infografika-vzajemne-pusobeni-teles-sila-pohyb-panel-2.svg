<svg viewBox="0 0 460 612" width="460" height="612" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vzájemné působení těles v pohybu, Luk a šíp: lukostřelec drží luk, šíp je nasazený na tětivě. Ruka napíná tětivu a luk se prohne – mění se jeho tvar. Dvě stejně dlouhé červené šipky u ruky: ruka táhne tětivu dozadu a tětiva táhne ruku dopředu. Ruka pustí tětivu, luk se narovná a vymrští šíp – šíp se dá do pohybu a zabodne se do terče." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Vzájemné působení těles v pohybu 2/2: Luk a šíp</title>
	<!-- W103. Předloha: PDF 6/02 Síla/13. Vzájemné působení těles, síla, s. 1 („vystřelím pomocí luku šíp“; „působení těles je vždy vzájemné“) a s. 3 (deformační a pohybové účinky); výklad temata.ts („vystřelím lukem šíp“). PDF k tomu obrázek nemá, scéna kreslena podle textu. Šipky sil červené #e03131 s černou tečkou v působišti jako na webu. Cyklus 10 s: 0,5–2,0 s ruka napíná tětivu (ramena luku se otočí o 10°, tětiva vždy končí v ruce – keyframy spočítané skriptem, 6 kroků); 2,0–4,5 s drží, svítí šipky a legenda; 4,5 s výstřel (tětiva zpět za 0,1 s), 4,6–4,85 s let šípu do terče; 9,0–9,05 s šíp v terči zmizí; 9,1–9,15 s nový šíp se objeví v ruce (zářez 132,302) a 9,15–9,7 s ho ruka nese na tětivu; text „nasadí další šíp“ 9,15–9,7 s jen s viditelným šípem. Klid (reduced motion): plně napnutý luk se šipkami. -->
	<style>
		.c2ar { animation: c2ar 10s linear infinite; }
