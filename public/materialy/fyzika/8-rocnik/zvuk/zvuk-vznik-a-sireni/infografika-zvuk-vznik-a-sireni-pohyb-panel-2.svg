		<!-- řádek 4: vakuum -->
		<text x="40" y="426" font-size="20" font-weight="bold" fill="#2b2a26">vakuum <tspan font-weight="normal" fill="#495057">0 m/s</tspan></text>
		<path d="M428 430V478" stroke="#495057" stroke-width="2" stroke-dasharray="5 4" />
		<rect class="tl" x="40" y="432" width="8" height="44" rx="2" fill="#e8590c" stroke="#2b2a26" stroke-width="2" />
		<text x="66" y="461" font-size="20" fill="#495057">žádné částice – zvuk se nešíří</text>

		<text x="40" y="518" font-size="20" fill="#2b2a26"><tspan font-weight="bold">Ocel:</tspan> částice blízko u sebe</text>
		<text x="40" y="544" font-size="20" fill="#2b2a26">a pevně vázané → reagují rychle.</text>
		<text x="40" y="580" font-size="20" fill="#2b2a26"><tspan font-weight="bold">Vzduch:</tspan> částice daleko od sebe</text>
		<text x="40" y="606" font-size="20" fill="#2b2a26">→ reagují pomalu.</text>
	</g>
</svg>
