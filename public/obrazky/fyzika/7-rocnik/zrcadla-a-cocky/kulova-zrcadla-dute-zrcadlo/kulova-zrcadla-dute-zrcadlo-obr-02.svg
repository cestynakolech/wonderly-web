<rect x="360" y="607" width="18" height="14" rx="3" fill="#868e96"/><circle cx="390" cy="614" r="22" fill="url(#kzzar)"/><circle cx="390" cy="614" r="11" fill="#ffe066" stroke="#e67700" stroke-width="2"/>
