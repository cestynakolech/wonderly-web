<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Odkud se energie vzala. Ze Slunce pochází energie větru (ohřátý vzduch), vody (koloběh vody), biomasy (fotosyntéza) i uhlí a ropy (dávné rostliny). Ze Slunce nepochází jaderná energie (jádra atomů), geotermální (nitro Země) a přílivová (otáčení Země).">
<style>
.d0 { animation: d0 3s linear infinite; animation-delay: -0.0s; }
@keyframes d0 { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(-150px, -80px); opacity: 0; } }
.d1 { animation: d1 3s linear infinite; animation-delay: -0.7s; }
@keyframes d1 { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(150px, -80px); opacity: 0; } }
.d2 { animation: d2 3s linear infinite; animation-delay: -1.4s; }
@keyframes d2 { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(-150px, 78px); opacity: 0; } }
.d3 { animation: d3 3s linear infinite; animation-delay: -2.1s; }
@keyframes d3 { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(150px, 78px); opacity: 0; } }
.paprsky { animation: rot 30s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
/* Žluté kuličky = energie putuje ze Slunce k větru, vodě, biomase a uhlí s ropou.
   Dole tři zdroje, které ze Slunce nepocházejí. Klid: kuličky skryté. */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="3" y="3" width="594" height="654" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300.0" y="42" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Skoro všechno je energie ze Slunce</text>
