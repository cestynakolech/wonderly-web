<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: bosé chodidlo stojí na podlaze. Ke špičce a k patě přijedou dva průhledné pravoúhlé trojúhelníky s ryskou jako kolmé pomůcky, které se dotknou začátku a konce chodidla. Pak se mezi nimi vyznačí délka chodidla l.">
<style>
/* Předloha: PDF Délka — fotografie chodidla mezi dvěma pravoúhlými trojúhelníky s ryskou. Překresleno, ne kopie.
   Cyklus 8 s: 0–15 % trojúhelníky stojí stranou, 15–45 % přijedou těsně ke špičce a k patě, 55–94 % se vyznačí délka.
   Bez animace = koncový stav. */
@keyframes tL { 0%, 15% { transform: translate(-160px, 0); } 45%, 100% { transform: translate(0, 0); } }
@keyframes tP { 0%, 15% { transform: translate(160px, 0); } 45%, 100% { transform: translate(0, 0); } }
@keyframes del { 0%, 50% { opacity: 0; } 58%, 94% { opacity: 1; } 100% { opacity: 0; } }
.tL { animation: tL 8s ease-in-out infinite; }
.tP { animation: tP 8s ease-in-out infinite; }
.del { animation: del 8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .tL, .tP, .del { animation: none; } }
</style>
