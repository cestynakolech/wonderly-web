<svg viewBox="0 120 460 474" width="460" height="474" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Faradayův pokus: Michael Faraday, rok 1831; ruka zasune magnet do cívky připojené k voltmetru; když se magnet pohybuje, ručička se vychýlí a na cívce vzniká napětí; když magnet stojí, ručička je na nule" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
