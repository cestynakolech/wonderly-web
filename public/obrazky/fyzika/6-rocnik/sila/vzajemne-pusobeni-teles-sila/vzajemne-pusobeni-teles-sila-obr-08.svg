<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: dítě jde po sněhu a za provaz táhne sáňky s menším dítětem. Z místa, kde je provaz uvázaný k sáňkám (působiště), vyroste červená šipka ve směru provazu s popisem F = 35 N. Plakety: Působiště – kde je provaz uvázaný k sáňkám. Směr – kam táhne provaz. Velikost – F = 35 N.">
<style>
/* Předloha: PDF Vzájemné působení těles, síla – oddíl Síla jako fyzikální veličina (velikost F = 35 N, směr úsečkou se šipkou, začátek v působišti, např. bod dotyku). V PDF bez obrázku, nakresleno podle textu; šipky stejně jako u sil v 7. ročníku. */
/* cyklus 6 s: 0–25 % jen provaz, 25–50 % šipka vyroste z působiště, drží. Nohy a sníh se hýbou stále (chůze). Bez animace = šipka celá. */
@keyframes sr { 0%, 25% { transform: scaleX(0.05); opacity: 0; } 30% { opacity: 1; } 50%, 100% { transform: scaleX(1); opacity: 1; } }
@keyframes st { 0%, 45% { opacity: 0; } 55%, 100% { opacity: 1; } }
@keyframes n1 { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
@keyframes n2 { 0%, 100% { transform: rotate(16deg); } 50% { transform: rotate(-16deg); } }
@keyframes sn { 0% { transform: translateX(0px); } 100% { transform: translateX(-120px); } }
.sr { transform-origin: 0 0; animation: sr 6s ease-out infinite; } .st { animation: st 6s linear infinite; }
.n1 { transform-origin: 0 0; animation: n1 1.2s ease-in-out infinite; } .n2 { transform-origin: 0 0; animation: n2 1.2s ease-in-out infinite; }
.sn { animation: sn 2.4s linear infinite; }
@media (prefers-reduced-motion: reduce) { .sr, .st, .n1, .n2, .sn { animation: none; } }
</style>
<defs><marker id="b-cer" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e03131"/></marker><marker id="b-mod" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#1971c2"/></marker><marker id="b-ora" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e8590c"/></marker><marker id="b-sed" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#868e96"/></marker><marker id="m-sed" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#868e96"/></marker><linearGradient id="snih" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d0ebff"/></linearGradient><linearGradient id="drevo8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2ad72"/><stop offset="1" stop-color="#9c6431"/></linearGradient><clipPath id="ksn"><rect x="13" y="470" width="574" height="86"/></clipPath></defs>
<rect x="3" y="3" width="594" height="554" rx="14" fill="#f8f9fa"/>
<text x="300" y="40" font-size="27" font-weight="bold" fill="#212529" text-anchor="middle">Síla má velikost, směr a působiště</text><rect x="12" y="470" width="576" height="78" fill="url(#snih)"/><path d="M12 470H588" stroke="#a5d8ff" stroke-width="3"/><g clip-path="url(#ksn)"><g class="sn"><path d="M40 492 q14 -8 28 0 M100 522 q12 -7 24 0" stroke="#a5d8ff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M160 492 q14 -8 28 0 M220 522 q12 -7 24 0" stroke="#a5d8ff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M280 492 q14 -8 28 0 M340 522 q12 -7 24 0" stroke="#a5d8ff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M400 492 q14 -8 28 0 M460 522 q12 -7 24 0" stroke="#a5d8ff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M520 492 q14 -8 28 0 M580 522 q12 -7 24 0" stroke="#a5d8ff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M640 492 q14 -8 28 0 M700 522 q12 -7 24 0" stroke="#a5d8ff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M760 492 q14 -8 28 0 M820 522 q12 -7 24 0" stroke="#a5d8ff" stroke-width="3" fill="none" stroke-linecap="round"/></g></g><path d="M96,464 L262,464 Q290,464 288,436 " fill="none" stroke="#495057" stroke-width="6" stroke-linecap="round"/><path d="M120,464 V434 M240,464 V434" stroke="#495057" stroke-width="5"/><rect x="100" y="420" width="182" height="16" rx="4" fill="url(#drevo8)" stroke="#6b3f17" stroke-width="2"/><path d="M150,418 L232,414" stroke="#495057" stroke-width="20" stroke-linecap="round"/><ellipse cx="240" cy="412" rx="12" ry="8" fill="#343a40"/><rect x="128" y="348" width="44" height="72" rx="16" fill="#f03e3e" stroke="#a61e1e" stroke-width="2"/><path d="M158,362 Q190,374 200,404" stroke="#f03e3e" stroke-width="13" fill="none" stroke-linecap="round"/><circle cx="203" cy="408" r="7" fill="#fab005"/><circle cx="152" cy="328" r="20" fill="#f1c9a5" stroke="#b07a52" stroke-width="2"/><path d="M131,326 C131,298 173,298 173,326 Z" fill="#7048e8"/><circle cx="152" cy="302" r="7" fill="#ffffff" stroke="#adb5bd"/><circle cx="162" cy="330" r="2.2" fill="#212529"/><g transform="translate(476 384)"><g class="n1" transform="rotate(0)"><line x1="0" y1="0" x2="0" y2="76" stroke="#1864ab" stroke-width="15" stroke-linecap="round"/><ellipse cx="6" cy="80" rx="13" ry="7" fill="#343a40"/></g></g><g transform="translate(488 384)"><g class="n2" transform="rotate(0)"><line x1="0" y1="0" x2="0" y2="76" stroke="#1971c2" stroke-width="15" stroke-linecap="round"/><ellipse cx="6" cy="80" rx="13" ry="7" fill="#343a40"/></g></g><path d="M464,386 L476,310 L508,314 L504,386 Z" fill="#2f9e44" stroke="#1b6e30" stroke-width="2" stroke-linejoin="round"/><path d="M478,320 L454,334" stroke="#2f9e44" stroke-width="13" stroke-linecap="round"/><circle cx="448" cy="330" r="9" fill="#f1c9a5" stroke="#b07a52" stroke-width="2"/><path d="M474,310 q14,8 30,4" stroke="#e03131" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="492" cy="290" r="20" fill="#f1c9a5" stroke="#b07a52" stroke-width="2"/><path d="M471,288 C471,260 513,260 513,288 Z" fill="#fab005"/><circle cx="492" cy="264" r="7" fill="#ffffff" stroke="#adb5bd"/><circle cx="503" cy="292" r="2.2" fill="#212529"/><line x1="276" y1="420" x2="448" y2="330" stroke="#8a5a2b" stroke-width="4"/><circle cx="276" cy="420" r="6" fill="#495057"/><g transform="translate(276 420) rotate(-27.62)"><g class="sr"><line x1="0" y1="0" x2="150" y2="0" stroke="#e03131" stroke-width="7" stroke-linecap="round" marker-end="url(#b-cer)"/></g><circle cx="0" cy="0" r="8" fill="#e03131" stroke="#212529" stroke-width="2"/></g><g class="st"><text x="325.3" y="351.6" font-size="26" font-weight="bold" fill="#c92a2a" text-anchor="middle">F = 35 N</text></g><rect x="14" y="60" width="262" height="104.3" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/><path d="M170,160.3 L270,412 L210,160.3 z" fill="#fff3bf"/><path d="M170,164.3 L270,412 L210,164.3" fill="none" stroke="#f08c00" stroke-width="2.5" stroke-linejoin="round"/><text x="145" y="91.9" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Působiště:</text><text x="145" y="120" font-size="22" fill="#212529" text-anchor="middle">kde je provaz</text><text x="145" y="148.2" font-size="22" fill="#212529" text-anchor="middle">uvázaný k sáňkám</text><rect x="300" y="60" width="286" height="76.1" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/><path d="M380,132.1 L382.3,358.4 L420,132.1 z" fill="#fff3bf"/><path d="M380,136.1 L382.3,358.4 L420,136.1" fill="none" stroke="#f08c00" stroke-width="2.5" stroke-linejoin="round"/><text x="443" y="91.9" font-size="22" fill="#212529" text-anchor="middle">Směr: kam táhne provaz</text><text x="443" y="120" font-size="22" fill="#212529" text-anchor="middle">Velikost: F = 35 N</text>
</svg>
