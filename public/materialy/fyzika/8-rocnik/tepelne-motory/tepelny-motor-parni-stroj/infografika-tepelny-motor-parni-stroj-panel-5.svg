<svg viewBox="0 2584 460 760" width="460" height="760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Využití parního stroje: parník — pára pohání lopatkové kolo; v průmyslu pohon strojů v továrnách, čerpání vody z dolů, zvedání těžkých břemen; v dopravě parní lokomotivy, parníky a parní automobily; v zemědělství parní pluh, traktor a válec. Nevýhody: velký a těžký, náročná údržba a časté doplňování vody, riziko výbuchu kotle, znečišťování prostředí, malá účinnost asi 15 %. Josef Božek postavil první český parní automobil (1815) a parník na Vltavě (1817)" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Tepelný motor a parní stroj 5/6: Využití a nevýhody</title>
	<style>
		.p5-vlny { transform-box: view-box; transform-origin: 0px 0px; animation: p5vlny 3s linear infinite; }
		@keyframes p5vlny { 0% { transform: translate(-70px, 0px); } 100% { transform: translate(0px, 0px); } }
		.p5-k0 { transform-box: view-box; transform-origin: 0px 0px; animation: p5k0 3s linear infinite 0s; }
		@keyframes p5k0 { 0% { transform: translate(207px, 2736px) scale(0.6) translate(-207px, -2736px); opacity: 0.9; } 100% { transform: translate(267px, 2696px) scale(1.6) translate(-207px, -2736px); opacity: 0; } }
		.p5-k1 { transform-box: view-box; transform-origin: 0px 0px; animation: p5k1 3s linear infinite -1s; }
		@keyframes p5k1 { 0% { transform: translate(207px, 2736px) scale(0.6) translate(-207px, -2736px); opacity: 0.9; } 100% { transform: translate(267px, 2696px) scale(1.6) translate(-207px, -2736px); opacity: 0; } }
		.p5-k2 { transform-box: view-box; transform-origin: 0px 0px; animation: p5k2 3s linear infinite -2s; }
		@keyframes p5k2 { 0% { transform: translate(207px, 2736px) scale(0.6) translate(-207px, -2736px); opacity: 0.9; } 100% { transform: translate(267px, 2696px) scale(1.6) translate(-207px, -2736px); opacity: 0; } }
		.p5-kolo { transform-box: view-box; transform-origin: 0px 0px; animation: p5kolo 4s linear infinite; }
		@keyframes p5kolo { 0% { transform: translate(320px, 2876px) rotate(0deg) translate(-320px, -2876px); } 100% { transform: translate(320px, 2876px) rotate(-360deg) translate(-320px, -2876px); } }
		@media (prefers-reduced-motion: reduce) { .p5-vlny, .p5-k0, .p5-k1, .p5-k2, .p5-kolo { animation: none; } }
