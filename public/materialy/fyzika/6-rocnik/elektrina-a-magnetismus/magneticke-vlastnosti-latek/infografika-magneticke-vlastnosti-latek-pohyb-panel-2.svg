		<rect x="105.0" y="240" width="30" height="180" rx="3" fill="#ced4da" stroke="#2b2a26" stroke-width="2.5" /><rect x="109.0" y="245" width="6" height="170" rx="3" fill="#ffffff" opacity="0.6" /><path d="M160 304 L212 310 L212 362 L160 370 Z" fill="#f1c9a5" stroke="#a8743c" stroke-width="2.5" stroke-linejoin="round" /><rect x="124" y="298" width="56" height="76" rx="22" fill="#f1c9a5" stroke="#a8743c" stroke-width="2.5" /><rect x="96" y="300" width="58" height="17" rx="8" fill="#f1c9a5" stroke="#a8743c" stroke-width="2" /><ellipse cx="103" cy="308.5" rx="4" ry="5" fill="#f8e1cf" stroke="#a8743c" stroke-width="1.2" /><rect x="96" y="317" width="56" height="17" rx="8" fill="#f1c9a5" stroke="#a8743c" stroke-width="2" /><ellipse cx="103" cy="325.5" rx="4" ry="5" fill="#f8e1cf" stroke="#a8743c" stroke-width="1.2" /><rect x="96" y="334" width="54" height="17" rx="8" fill="#f1c9a5" stroke="#a8743c" stroke-width="2" /><ellipse cx="103" cy="342.5" rx="4" ry="5" fill="#f8e1cf" stroke="#a8743c" stroke-width="1.2" /><rect x="96" y="351" width="52" height="17" rx="8" fill="#f1c9a5" stroke="#a8743c" stroke-width="2" /><ellipse cx="103" cy="359.5" rx="4" ry="5" fill="#f8e1cf" stroke="#a8743c" stroke-width="1.2" />
		<g transform="translate(109,422)"><g class="a2n1" transform="translate(-53,40) rotate(-90)"><line x1="0" y1="0" x2="0" y2="27" stroke="#495057" stroke-width="4.5" /><path d="M-2.25 27 L0 33 L2.25 27 Z" fill="#495057" /><rect x="-7" y="-5" width="14" height="5" rx="1" fill="#495057" /></g></g>
