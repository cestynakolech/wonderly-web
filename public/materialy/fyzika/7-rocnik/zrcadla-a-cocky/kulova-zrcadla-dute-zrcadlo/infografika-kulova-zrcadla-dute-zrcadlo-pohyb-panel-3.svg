		.vy { animation: vy 10s step-end infinite; }
		@keyframes vy { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 1; } }
		.pa { animation: pa 10s linear infinite; }
		@keyframes pa { 0% { opacity: 0; } 90% { opacity: 0; } 91% { opacity: 1; } 100% { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) {
