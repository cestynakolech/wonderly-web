<svg viewBox="0 598 460 402" width="460" height="402" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Indukované napětí a proud: když se u cívky mění magnetické pole, vzniká elektromagnetická indukce; indukované napětí U i se měří ve voltech, indukovaný proud I i v ampérech; proud teče, jen když je obvod uzavřený; pole měníme pohybem magnetu nebo cívky, nebo proudem v elektromagnetu" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Elektromagnetická indukce 2/6: Indukované napětí a proud</title>
	<style>
		
		@media (prefers-reduced-motion: reduce) {  { animation: none; } }
	</style>
	<defs></defs>
	<rect x="0" y="598" width="460" height="402" fill="#f8f9fa"/>
	<g id="panel-2"><rect x="26" y="614" width="420" height="382" rx="12" fill="#dee2e6"/><rect x="20" y="608" width="420" height="382" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="642" r="17" fill="#2b2a26"/><text x="52" y="650" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="80" y="651" font-size="25" font-weight="bold" fill="#2b2a26">Indukované napětí a proud</text><text x="40" y="692" font-size="21" fill="#2b2a26">Když se u cívky <tspan font-weight="bold">mění magnetické pole</tspan>,</text><text x="40" y="718" font-size="21" fill="#2b2a26">vzniká elektromagnetická indukce:</text><rect x="40" y="736" width="380" height="52" rx="10" fill="#ebfbee" stroke="#237a35" stroke-width="2"/><text x="56" y="770" font-size="25" font-weight="bold" fill="#237a35"><tspan font-style="italic">U</tspan><tspan font-size="18" dy="5">i</tspan></text><text x="98" y="769" font-size="21" fill="#2b2a26">indukované napětí · volt (V)</text><rect x="40" y="798" width="380" height="52" rx="10" fill="#ebfbee" stroke="#237a35" stroke-width="2"/><text x="56" y="832" font-size="25" font-weight="bold" fill="#237a35"><tspan font-style="italic">I</tspan><tspan font-size="18" dy="5">i</tspan></text><text x="98" y="831" font-size="21" fill="#2b2a26">indukovaný proud · ampér (A)</text><text x="40" y="882" font-size="21" fill="#2b2a26">Proud teče, jen když je obvod uzavřený.</text><text x="40" y="914" font-size="21" fill="#2b2a26">Pole měníme pohybem magnetu</text><text x="40" y="940" font-size="21" fill="#2b2a26">nebo cívky, nebo proudem</text><text x="40" y="966" font-size="21" fill="#2b2a26">v elektromagnetu.</text></g>
</svg>
