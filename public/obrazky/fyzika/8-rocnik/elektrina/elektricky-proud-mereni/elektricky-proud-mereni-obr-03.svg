<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Skutečný obvod: tužková baterie, žárovka v objímce, páčkový spínač a ručkový ampérmetr spojené vodiči za sebou v jedné cestě. Kladná svorka ampérmetru je spojena přes žárovku s kladnou svorkou baterie. Na stupnici ampérmetru jsou čísla 0 až 500 a jednotka mA. Při otevřeném spínači ručka ukazuje 0 mA. Po zavření spínače se žárovka rozsvítí a ručka se vychýlí na 200 mA.">
<style>
/* Vlastní obrázek navíc (kap. 3: „kreslit i něco navíc“) – skutečné provedení schématu z PDF lekce 23, s. 5:
   zdroj, spínač, žárovka a ručkový ampérmetr v jedné cestě; + svorka ampérmetru míří přes žárovku k + svorce zdroje
   (výklad § 6), jednotka mA na stupnici (výklad § 2), DC = stejnosměrný proud (výklad § 4), hodnota 200 mA (výklad § 6 + popisek obrázku; reálný proud
   školní žárovičky 2,5 V/0,2 A – oprava kontroly 3. 10. 2026, dříve nereálných 20 mA).
   Stupnice 0–500 mA: úhel = −50° + 0,2° · I[mA]; 0 mA → −50°, 200 mA → −10°.
   6 s: 0–30 % spínač otevřený, ručka na 0; 30–36 % páčka dosedne; v 36 % se rozsvítí žárovka a ručka se vychýlí
   (mírný překmit −4° → −12°) a od 46 % stojí na 200 mA; v 85 % se páčka začne zvedat, žárovka zhasne
   a ručka se do 91 % vrátí na 0; popisek „0 mA“ až po dojezdu ručky (91 %).
   Bez animace (reduced-motion) = koncový stav: spínač zavřený, žárovka svítí, ručka na 200 mA. */
.pa { transform-origin: 62px 254px; animation: pa 6s ease-in-out infinite; }
@keyframes pa { 0%, 30% { transform: rotate(-28deg); } 36%, 85% { transform: rotate(0deg); } 91%, 100% { transform: rotate(-28deg); } }
.ruc { transform-origin: 300px 474px; transform: rotate(-10deg); animation: ruc 6s ease-in-out infinite; }
@keyframes ruc { 0%, 36% { transform: rotate(-50deg); } 40% { transform: rotate(-4deg); } 43% { transform: rotate(-12deg); } 46%, 85% { transform: rotate(-10deg); } 91%, 100% { transform: rotate(-50deg); } }
.lit-a { animation: sv 6s step-end infinite; }
.sz { animation: sz 6s step-end infinite; }
.so { opacity: 0; animation: tm 6s step-end infinite; }
@keyframes sv { 0% { opacity: 0; } 36% { opacity: 1; } 85% { opacity: 0; } }
@keyframes sz { 0% { opacity: 0; } 46% { opacity: 1; } 85% { opacity: 0; } }
@keyframes tm { 0% { opacity: 1; } 36% { opacity: 0; } 91% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pa, .ruc, .lit-a, .sz, .so { animation: none; } }
</style>
