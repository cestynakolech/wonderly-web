<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Shrnutí ve třech kruzích. Prvek: jen stejné atomy, například helium He. Sloučenina: různé druhy atomů v jedné látce, například voda H2O. Směs: smíchané různé látky, například vzduch s molekulami dusíku, kyslíku, vody a oxidu uhličitého. Animace: částice se pohybují.">
<style>
@keyframes k1 { 0%,100% { transform: translate(0,0) rotate(0); } 25% { transform: translate(7px,-5px) rotate(8deg); } 50% { transform: translate(-4px,7px) rotate(-6deg); } 75% { transform: translate(-7px,-3px) rotate(4deg); } }
@keyframes k2 { 0%,100% { transform: translate(0,0) rotate(0); } 30% { transform: translate(-6px,6px) rotate(-8deg); } 60% { transform: translate(6px,4px) rotate(6deg); } 80% { transform: translate(3px,-7px) rotate(-3deg); } }
@keyframes k3 { 0%,100% { transform: translate(0,0) rotate(0); } 20% { transform: translate(5px,7px) rotate(6deg); } 55% { transform: translate(-7px,-4px) rotate(-8deg); } 85% { transform: translate(4px,-6px) rotate(3deg); } }
.k1, .k2, .k3 { transform-box: fill-box; transform-origin: center; }
.k1 { animation: k1 3s ease-in-out infinite; } .k2 { animation: k2 4s ease-in-out infinite; } .k3 { animation: k3 5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
/* Shrnutí výkladu: prvek, sloučenina, směs ve zvětšeném pohledu. Animace: částice se pohybují. */
</style>
