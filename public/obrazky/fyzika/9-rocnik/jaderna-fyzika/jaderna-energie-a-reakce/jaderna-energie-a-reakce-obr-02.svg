<radialGradient id="gn" cx=".36" cy=".34" r=".72"><stop offset="0" stop-color="#f8f9fa"/><stop offset=".5" stop-color="#adb5bd"/><stop offset="1" stop-color="#6c757d"/></radialGradient>
