<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Balonek naplněný prvkem helium. Uvnitř je 12 stejných atomů helia se značkou He. Prvek je látka tvořená stejnými atomy. Animace: atomy helia se v balonku neustále pohybují.">
<style>
@keyframes k1 { 0%,100% { transform: translate(0,0); } 25% { transform: translate(8px,-6px); } 50% { transform: translate(-4px,8px); } 75% { transform: translate(-8px,-3px); } }
@keyframes k2 { 0%,100% { transform: translate(0,0); } 30% { transform: translate(-7px,7px); } 60% { transform: translate(7px,5px); } 80% { transform: translate(3px,-8px); } }
@keyframes k3 { 0%,100% { transform: translate(0,0); } 20% { transform: translate(6px,8px); } 55% { transform: translate(-8px,-5px); } 85% { transform: translate(5px,-7px); } }
.k1 { animation: k1 3s ease-in-out infinite; } .k2 { animation: k2 4s ease-in-out infinite; } .k3 { animation: k3 5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
/* Předloha: balonek naplněný prvkem helium, uvnitř jen stejné atomy He.
   Animace: atomy plynu se neustále pohybují (posun do 8 px, nikdy ven z balonku). */
</style>
