<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vlevo bodový zdroj, žárovka: paprsky z ní vycházejí do všech směrů a jsou rozbíhavé, například svíčka, lampa nebo hvězda. Vpravo plošný zdroj, svítící pás: paprsky jsou rovnoběžné, například řada zářivek nebo obrazovka. Animace: paprsky vyletí ze zdrojů.">
<style>
/* Animace (8 s, smyčka): paprsky vyletí ze zdrojů (5–35 %), šipky se objeví při doletu (35 %), drží, zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy níže ukazují vše. */
.pr { stroke-dasharray: 100; animation: pr 8s linear infinite; }
.sp { animation: sp 8s linear infinite; }
.celek { animation: celek 8s linear infinite; }
@keyframes pr { 0%, 5% { stroke-dashoffset: 100; } 35%, 100% { stroke-dashoffset: 0; } }
@keyframes sp { 0%, 34% { opacity: 0; } 35%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pr, .sp, .celek { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="474" rx="14" fill="#fff9db" stroke="#2b2a26" stroke-width="3"/>
<text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Bodový a plošný zdroj</text>
<line x1="300" y1="62" x2="300" y2="456" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6"/>
<text x="155" y="84" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">bodový zdroj</text>
<text x="445" y="84" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">plošný zdroj</text>

<!-- BODOVÝ ZDROJ (předloha str. 13): žárovka, 12 paprsků po 30° do všech směrů, střed (155; 240) -->
<g class="celek">
<g stroke="#e8590c" stroke-width="4" stroke-linecap="round">
<line class="pr" pathLength="100" x1="189" y1="240" x2="269" y2="240"/>
<line class="pr" pathLength="100" x1="184.4" y1="257" x2="253.7" y2="297"/>
<line class="pr" pathLength="100" x1="172" y1="269.4" x2="212" y2="338.7"/>
<line class="pr" pathLength="100" x1="155" y1="280" x2="155" y2="354"/>
<line class="pr" pathLength="100" x1="138" y1="269.4" x2="98" y2="338.7"/>
<line class="pr" pathLength="100" x1="125.6" y1="257" x2="56.3" y2="297"/>
<line class="pr" pathLength="100" x1="121" y1="240" x2="41" y2="240"/>
<line class="pr" pathLength="100" x1="125.6" y1="223" x2="56.3" y2="183"/>
<line class="pr" pathLength="100" x1="138" y1="210.6" x2="98" y2="141.3"/>
<line class="pr" pathLength="100" x1="155" y1="206" x2="155" y2="126"/>
<line class="pr" pathLength="100" x1="172" y1="210.6" x2="212" y2="141.3"/>
<line class="pr" pathLength="100" x1="184.4" y1="223" x2="253.7" y2="183"/>
</g>
<g class="sp" fill="#e8590c">
<polygon points="283,240 265,248 265,232"/>
<polygon points="265.9,304 246.3,301.9 254.3,288.1"/>
<polygon points="219,350.9 203.1,339.3 216.9,331.3"/>
<polygon points="155,368 147,350 163,350"/>
<polygon points="91,350.9 93.1,331.3 106.9,339.3"/>
<polygon points="44.1,304 55.7,288.1 63.7,301.9"/>
<polygon points="27,240 45,232 45,248"/>
<polygon points="44.1,176 63.7,178.1 55.7,191.9"/>
<polygon points="91,129.1 106.9,140.7 93.1,148.7"/>
<polygon points="155,112 163,130 147,130"/>
<polygon points="219,129.1 216.9,148.7 203.1,140.7"/>
<polygon points="265.9,176 254.3,191.9 246.3,178.1"/>
</g>
</g>
<!-- žárovka -->
<circle cx="155" cy="238" r="22" fill="#ffe066" stroke="#2b2a26" stroke-width="3"/>
<rect x="146" y="257" width="18" height="16" rx="2" fill="#adb5bd" stroke="#2b2a26" stroke-width="2"/>
<line x1="146" y1="263" x2="164" y2="263" stroke="#2b2a26" stroke-width="1.5"/>
<line x1="146" y1="268" x2="164" y2="268" stroke="#2b2a26" stroke-width="1.5"/>

<!-- PLOŠNÝ ZDROJ (předloha str. 14): žlutý svítící pás, rovnoběžné paprsky dolů -->
<rect x="335" y="110" width="220" height="20" fill="#ffe066" stroke="#2b2a26" stroke-width="3"/>
<g class="celek">
<g stroke="#e8590c" stroke-width="4" stroke-linecap="round">
<line class="pr" pathLength="100" x1="350" y1="136" x2="350" y2="354"/>
<line class="pr" pathLength="100" x1="377" y1="136" x2="377" y2="354"/>
<line class="pr" pathLength="100" x1="404" y1="136" x2="404" y2="354"/>
<line class="pr" pathLength="100" x1="431" y1="136" x2="431" y2="354"/>
<line class="pr" pathLength="100" x1="459" y1="136" x2="459" y2="354"/>
<line class="pr" pathLength="100" x1="486" y1="136" x2="486" y2="354"/>
<line class="pr" pathLength="100" x1="513" y1="136" x2="513" y2="354"/>
<line class="pr" pathLength="100" x1="540" y1="136" x2="540" y2="354"/>
</g>
<g class="sp" fill="#e8590c">
<polygon points="350,368 342,350 358,350"/>
<polygon points="377,368 369,350 385,350"/>
<polygon points="404,368 396,350 412,350"/>
<polygon points="431,368 423,350 439,350"/>
<polygon points="459,368 451,350 467,350"/>
<polygon points="486,368 478,350 494,350"/>
<polygon points="513,368 505,350 521,350"/>
<polygon points="540,368 532,350 548,350"/>
</g>
</g>

<!-- popisky -->
<g font-size="22" fill="#212529" text-anchor="middle">
<text x="155" y="412">paprsky jsou <tspan font-weight="bold">rozbíhavé</tspan></text>
<text x="155" y="444" fill="#495057">svíčka, lampa, hvězda</text>
<text x="445" y="412">paprsky jsou <tspan font-weight="bold">rovnoběžné</tspan></text>
<text x="445" y="444" fill="#495057">zářivky, obrazovka</text>
</g>
</svg>
