<svg viewBox="0 0 460 600" width="460" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Otáčivý pohyb: všechny body tělesa opisují kružnice kolem osy otáčení. Minutová ručička hodin: konec ručičky opisuje velkou kružnici a pohybuje se větší rychlostí, střed ručičky opisuje malou kružnici a pohybuje se menší rychlostí, bod na ose otáčení je v klidu. Čím dál je bod od osy, tím větší kružnici opisuje a tím rychleji se pohybuje. Příklady: hodinové ručičky, houpačka, krasobruslařka při piruetě" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
