<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Ponorka a vyrovnávací nádrže: nádrže plné vody, ponorka klesá; nádrže plné vzduchu, ponorka stoupá; voda i vzduch ve správném poměru, ponorka se vznáší.">
<defs>
<g id="ponorka">
<path d="M70,0 C70,-34 120,-40 250,-40 C380,-40 430,-30 440,0 C430,30 380,40 250,40 C120,40 70,34 70,0 Z" fill="#868e96" stroke="#212529" stroke-width="3"/>
<rect x="250" y="-70" width="60" height="32" rx="6" fill="#868e96" stroke="#212529" stroke-width="3"/>
<path d="M70,0 L46,-20 L46,20 Z" fill="#495057" stroke="#212529" stroke-width="2"/>
</g>
</defs>
<rect x="3" y="3" width="594" height="614" rx="14" fill="#a5d8ff" stroke="#2b2a26" stroke-width="3"/>
<text x="300" y="38" font-size="24" font-weight="bold" fill="#0b3d6b" text-anchor="middle">Ponorka a vyrovnávací nádrže</text>
<!-- 1: klesá -->
<text x="24" y="80" font-size="20" font-weight="bold" fill="#212529">nádrže plné vody → klesá</text>
<use href="#ponorka" x="0" y="168"/>
<rect x="130" y="144" width="100" height="48" rx="6" fill="#1c7ed6" stroke="#212529" stroke-width="2"/>
<rect x="290" y="144" width="100" height="48" rx="6" fill="#1c7ed6" stroke="#212529" stroke-width="2"/>
<text x="180" y="175" font-size="20" fill="#ffffff" text-anchor="middle">voda</text>
<text x="340" y="175" font-size="20" fill="#ffffff" text-anchor="middle">voda</text>
<line x1="520" y1="128" x2="520" y2="190" stroke="#e03131" stroke-width="6"/>
<path d="M506,184 L520,212 L534,184 Z" fill="#e03131"/>
<!-- 2: stoupá -->
<text x="24" y="270" font-size="20" font-weight="bold" fill="#212529">nádrže plné vzduchu → stoupá</text>
<use href="#ponorka" x="0" y="358"/>
<rect x="130" y="334" width="100" height="48" rx="6" fill="#ffffff" stroke="#212529" stroke-width="2"/>
<rect x="290" y="334" width="100" height="48" rx="6" fill="#ffffff" stroke="#212529" stroke-width="2"/>
<text x="180" y="365" font-size="20" fill="#212529" text-anchor="middle">vzduch</text>
<text x="340" y="365" font-size="20" fill="#212529" text-anchor="middle">vzduch</text>
<line x1="520" y1="400" x2="520" y2="338" stroke="#2f9e44" stroke-width="6"/>
<path d="M506,344 L520,316 L534,344 Z" fill="#2f9e44"/>
<!-- 3: vznáší se -->
<text x="24" y="460" font-size="20" font-weight="bold" fill="#212529">voda i vzduch → vznáší se</text>
<use href="#ponorka" x="0" y="548"/>
<rect x="130" y="524" width="100" height="48" rx="6" fill="#ffffff"/>
<rect x="130" y="548" width="100" height="24" fill="#1c7ed6"/>
<rect x="290" y="524" width="100" height="48" rx="6" fill="#ffffff"/>
<rect x="290" y="548" width="100" height="24" fill="#1c7ed6"/>
<rect x="130" y="524" width="100" height="48" rx="6" fill="none" stroke="#212529" stroke-width="2"/>
<rect x="290" y="524" width="100" height="48" rx="6" fill="none" stroke="#212529" stroke-width="2"/>
<text x="520" y="544" font-size="20" fill="#212529" text-anchor="middle">neklesá</text>
<text x="520" y="568" font-size="20" fill="#212529" text-anchor="middle">nestoupá</text>
</svg>
