<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: ruka drží otevřený kompas. Střelka kompasu, červená a modrá magnetka, se rozkmitá a ustálí červeným koncem, tedy severním pólem magnetky, směrem k severu. Na ciferníku sever, jih, západ, východ. Vpravo šipka k severu a text: Červený konec střelky je severní pól magnetky, ukazuje k severu.">
<style>
/* Animace: střelka se po pootočení kompasu rozkmitá a ustálí severním (červeným) koncem k severu. Perioda 6 s.
   Bez animace střelka stojí rovnou na sever. */
.strelka { transform-origin: 430px 340px; animation: kmit 6s ease-in-out infinite; }
@keyframes kmit { 0% { transform: rotate(80deg); } 14% { transform: rotate(-50deg); } 28% { transform: rotate(30deg); } 42% { transform: rotate(-16deg); } 54% { transform: rotate(8deg); } 64% { transform: rotate(-3deg); } 72%, 100% { transform: rotate(0deg); } }
@media (prefers-reduced-motion: reduce) { .strelka { animation: none; } }
</style>
