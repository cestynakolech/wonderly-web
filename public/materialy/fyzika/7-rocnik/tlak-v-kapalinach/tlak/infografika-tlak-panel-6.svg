<svg xmlns="http://www.w3.org/2000/svg" width="460" height="600" viewBox="0 0 460 600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Větší tlak potřebujeme u nože, sekery, jehly a žihadla: mají malou plochu, ostří a hroty se brousí. Menší tlak chceme u pásů bagru, lyží a sněžnic, širokých pneumatik traktoru, více kol nákladních aut, širokých základů domů a širokých nohou velblouda: mají velkou plochu. Modře je místo dotyku.">
	<title>Tlak 6/6: Tlak v praxi</title>
	<!-- Panel 6/6 infografiky Tlak (W50, 14. 10. 2026); bez animace = koncový stav. -->
	<style>
		.p6-a { animation: p6-a 10s linear infinite; }
		@keyframes p6-a { 0% { opacity: 0 } 2% { opacity: 0 } 8% { opacity: 1 } 92% { opacity: 1 } 98% { opacity: 0 } 100% { opacity: 0 } }
		.p6-b { animation: p6-b 10s linear infinite; }
		@keyframes p6-b { 0% { opacity: 0 } 14% { opacity: 0 } 20% { opacity: 1 } 92% { opacity: 1 } 98% { opacity: 0 } 100% { opacity: 0 } }
		.p6-c { animation: p6-c 10s linear infinite; }
		@keyframes p6-c { 0% { opacity: 0 } 40% { opacity: 0 } 46% { opacity: 1 } 92% { opacity: 1 } 98% { opacity: 0 } 100% { opacity: 0 } }
		.p6-d { animation: p6-d 10s linear infinite; }
		@keyframes p6-d { 0% { opacity: 0 } 52% { opacity: 0 } 58% { opacity: 1 } 92% { opacity: 1 } 98% { opacity: 0 } 100% { opacity: 0 } }
		@media (prefers-reduced-motion: reduce) {
			.p6-a, .p6-b, .p6-c, .p6-d { animation: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="600" fill="#f8f9fa"/>
	<rect x="26" y="16" width="420" height="580" rx="12" fill="#dee2e6"/><rect x="20" y="10" width="420" height="580" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="44" r="17" fill="#2b2a26"/><text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">6</text><text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Tlak v praxi</text>
	<rect x="36" y="78" width="388" height="236" rx="10" fill="#fff5f5" stroke="#ffc9c9" stroke-width="2"/><text x="52" y="110" font-size="21" font-weight="bold" fill="#2b2a26">Větší tlak = <tspan font-weight="bold" fill="#b8460b">malá plocha</tspan></text><g class="p6-a"><rect x="60" y="150" width="56" height="16" rx="6" fill="#5c3d1e" stroke="#2b2a26" stroke-width="1.8"/><path d="M116,148 L210,148 Q206,164 190,170 L116,170 Z" fill="#ced4da" stroke="#2b2a26" stroke-width="1.8"/><line x1="120" y1="169" x2="190" y2="169" stroke="#1c7ed6" stroke-width="3"/><text x="135" y="200" font-size="18" text-anchor="middle" fill="#2b2a26">nůž</text></g><g class="p6-b"><path d="M262,158 L376,158 L392,162 L376,166 L262,166 Z" fill="#ced4da" stroke="#2b2a26" stroke-width="1.6"/><ellipse cx="272" cy="162" rx="6" ry="2" fill="#fff" stroke="#2b2a26" stroke-width="1.2"/><circle cx="392" cy="162" r="2.5" fill="#1c7ed6"/><text x="327" y="200" font-size="18" text-anchor="middle" fill="#2b2a26">jehla</text></g><text x="52" y="246" font-size="18" fill="#2b2a26">Také sekera a vosí žihadlo.</text><text x="52" y="270" font-size="18" fill="#2b2a26">Ostří a hroty se brousí.</text><text x="52" y="298" font-size="15" fill="#1c7ed6">modře: místo dotyku</text><rect x="36" y="330" width="388" height="250" rx="10" fill="#e7f5ff" stroke="#a5d8ff" stroke-width="2"/><text x="52" y="362" font-size="21" font-weight="bold" fill="#2b2a26">Menší tlak = <tspan font-weight="bold" fill="#b8460b">velká plocha</tspan></text><g class="p6-c"><rect x="56" y="388" width="150" height="44" rx="22" fill="#495057" stroke="#2b2a26" stroke-width="2"/><circle cx="78" cy="410" r="12" fill="#ced4da" stroke="#2b2a26" stroke-width="1.5"/><circle cx="113" cy="410" r="12" fill="#ced4da" stroke="#2b2a26" stroke-width="1.5"/><circle cx="148" cy="410" r="12" fill="#ced4da" stroke="#2b2a26" stroke-width="1.5"/><circle cx="183" cy="410" r="12" fill="#ced4da" stroke="#2b2a26" stroke-width="1.5"/><line x1="74" y1="432" x2="188" y2="432" stroke="#1c7ed6" stroke-width="4"/><text x="131" y="460" font-size="18" text-anchor="middle" fill="#2b2a26">pásy bagru</text></g><g class="p6-d"><rect x="268" y="422" width="120" height="8" rx="4" fill="#ced4da" stroke="#2b2a26" stroke-width="2"/><path d="M312,422 L312,396 L332,396 L334,410 Q350,412 352,422 Z" fill="#495057" stroke="#2b2a26" stroke-width="1.8"/><line x1="272" y1="433" x2="384" y2="433" stroke="#1c7ed6" stroke-width="4"/><text x="328" y="460" font-size="18" text-anchor="middle" fill="#2b2a26">sněžnice</text></g><text x="52" y="498" font-size="18" fill="#2b2a26">Také lyže, široké pneumatiky traktoru,</text><text x="52" y="522" font-size="18" fill="#2b2a26">víc kol u nákladních aut,</text><text x="52" y="546" font-size="18" fill="#2b2a26">široké základy domů</text><text x="52" y="570" font-size="18" fill="#2b2a26">a široké nohy velblouda.</text>
</svg>
