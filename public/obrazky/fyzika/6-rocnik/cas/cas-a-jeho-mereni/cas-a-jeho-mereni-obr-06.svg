<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kyvadlové hodiny, pendlovka, zavěšené na stěně: tmavá dřevěná skříňka s ozdobnými věžičkami nahoře, za sklem mosazný ciferník s římskými číslicemi a dvěma ručičkami, po stranách bílé sloupky. Pod skříňkou kmitá kyvadlo s mosaznou čočkou a na řetízcích visí dvě mosazná válcová závaží. Kyvadlo kmitá pravidelně sem a tam, ručičky se posouvají.">
<style>
/* Kyvadlo kmitá sem a tam (jeden kyv 1 s). Ručičky jdou skutečným tempem: minutová oběhne ciferník za 1 h (3 600 s),
   hodinová za 12 h (43 200 s) — poměr rychlostí 12 : 1. Bez animace: kyvadlo svisle, čas 10:10. */
.kyv { transform-box: view-box; transform-origin: 390px 392px; animation: kyv-k 2s ease-in-out infinite; }
@keyframes kyv-k { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
.min6 { transform-box: view-box; transform-origin: 390px 232px; animation: min6-k 3600s linear infinite; }
@keyframes min6-k { from { transform: rotate(60deg); } to { transform: rotate(420deg); } }
.hod6 { transform-box: view-box; transform-origin: 390px 232px; animation: hod6-k 43200s linear infinite; }
@keyframes hod6-k { from { transform: rotate(305deg); } to { transform: rotate(665deg); } }
@media (prefers-reduced-motion: reduce) { .kyv, .min6, .hod6 { animation: none; } }
</style>
