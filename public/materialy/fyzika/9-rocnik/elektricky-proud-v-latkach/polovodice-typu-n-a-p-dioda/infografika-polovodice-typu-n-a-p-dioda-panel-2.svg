<svg viewBox="0 0 460 600" width="460" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Svítivá dioda v propustném směru: typ N na záporné svorce, typ P na kladné, LED svítí. Lupa ukazuje zvětšený krystal u přechodu PN: v typu N je atom příměsi fosforu, který dal volný elektron, v typu P atom příměsi boru, u kterého je díra. Volný elektron z typu N doputuje k díře ve vazbě v typu P a zaplní ji. Díra zanikne a uvolní se energie ve formě světla. LED svítí jen v propustném směru." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
