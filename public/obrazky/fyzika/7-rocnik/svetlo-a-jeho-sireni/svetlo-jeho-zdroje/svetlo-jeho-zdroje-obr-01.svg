<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Barevné spektrum: oko vidí světlo od fialové přes modrou, zelenou, žlutou a oranžovou po červenou. Za fialovou leží ultrafialové záření UV, které vidí ptáci, hmyz a ryby. Za červenou leží infračervené záření IR, které cítíme jako teplo. Obě záření okem nevidíme.">
<defs>
<linearGradient id="spektrum" x1="30" y1="0" x2="570" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#000000"/>
<stop offset="0.148" stop-color="#4b0082"/>
<stop offset="0.207" stop-color="#7b2ff7"/>
<stop offset="0.324" stop-color="#1c5cff"/>
<stop offset="0.441" stop-color="#2fbf3a"/>
<stop offset="0.559" stop-color="#ffe600"/>
<stop offset="0.676" stop-color="#ff8c00"/>
<stop offset="0.793" stop-color="#e80000"/>
<stop offset="0.852" stop-color="#6e0000"/>
<stop offset="1" stop-color="#000000"/>
</linearGradient>
</defs>
<rect x="3" y="3" width="594" height="394" rx="14" fill="#fff9db" stroke="#2b2a26" stroke-width="3"/>
<text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Barevné spektrum</text>

<!-- šipka nad viditelnou částí (předloha str. 1: „Světlo“ nad barvami) -->
<text x="300" y="80" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">světlo — vidíme ho zrakem</text>
<line x1="124" y1="96" x2="476" y2="96" stroke="#1971c2" stroke-width="3"/>
<polygon points="110,96 126,88 126,104" fill="#1971c2"/>
<polygon points="490,96 474,88 474,104" fill="#1971c2"/>

<!-- popisky barev nahoře (fialová, zelená, oranžová) — středy pásů 141,7 / 268,3 / 395 -->
<g font-size="22" fill="#212529" text-anchor="middle">
<text x="142" y="134">fialová</text>
<text x="268" y="134">zelená</text>
<text x="395" y="134">oranžová</text>
</g>
<g stroke="#2b2a26" stroke-width="2">
<line x1="142" y1="142" x2="142" y2="158"/>
<line x1="268" y1="142" x2="268" y2="158"/>
<line x1="395" y1="142" x2="395" y2="158"/>
<line x1="205" y1="232" x2="205" y2="246"/>
<line x1="332" y1="232" x2="332" y2="246"/>
<line x1="458" y1="232" x2="458" y2="246"/>
</g>

<!-- pás spektra: UV (30–110) | viditelné (110–490) | IR (490–570) -->
<rect x="30" y="160" width="540" height="70" fill="url(#spektrum)" stroke="#2b2a26" stroke-width="2"/>
<line x1="110" y1="160" x2="110" y2="230" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="490" y1="160" x2="490" y2="230" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 5"/>
<text x="70" y="204" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">UV</text>
<text x="530" y="204" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">IR</text>

<!-- popisky barev dole (modrá, žlutá, červená) -->
<g font-size="22" fill="#212529" text-anchor="middle">
<text x="205" y="268">modrá</text>
<text x="332" y="268">žlutá</text>
<text x="458" y="268">červená</text>
</g>

<!-- neviditelná záření -->
<g font-size="22" fill="#212529">
<text x="30" y="318"><tspan font-weight="bold">UV</tspan> — za fialovou</text>
<text x="30" y="346">vidí ho ptáci,</text>
<text x="30" y="374">hmyz a ryby</text>
</g>
<g font-size="22" fill="#212529" text-anchor="end">
<text x="570" y="318"><tspan font-weight="bold">IR</tspan> — za červenou</text>
<text x="570" y="346">cítíme ho</text>
<text x="570" y="374">jako teplo</text>
</g>
<text x="300" y="346" font-size="22" font-style="italic" fill="#495057" text-anchor="middle">okem nevidíme</text>
<polygon points="194,339 212,331 212,347" fill="#495057"/>
<polygon points="406,339 388,331 388,347" fill="#495057"/>
</svg>
