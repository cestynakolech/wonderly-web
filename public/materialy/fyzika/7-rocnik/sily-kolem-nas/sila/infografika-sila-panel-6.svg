<svg xmlns="http://www.w3.org/2000/svg" width="460" height="510" viewBox="0 0 460 510" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Síla může těleso posunout (bedna se posune), otočit (kolo na stojanu se otočí) a zdeformovat: míč se zmáčkne jen dočasně a vrátí se do původního tvaru, plech zůstane promáčklý trvale.">
	<title>Síla 6/6: Účinky síly</title>
	<!-- Panel 6/6 k infografika-sila.svg (W47, 14. 10. 2026); bez animace = koncový stav. -->
	<style>
		.p6-pos { animation: p6-pos 8s ease-in-out infinite; }
