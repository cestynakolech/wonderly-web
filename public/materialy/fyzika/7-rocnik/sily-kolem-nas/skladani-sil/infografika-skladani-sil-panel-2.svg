<svg viewBox="0 635 460 431" width="460" height="431" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Síly stejného směru: psi táhnou saně silami F1 = 30 N a F2 = 50 N, výslednice je součet a má stejný směr, F = F1 + F2 = 30 N + 50 N = 80 N." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Skládání sil 2/5: Síly stejného směru</title>
	<!-- Panel 2/5 výřezu z infografika-skladani-sil.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.jede { animation: jede 5s ease-in-out infinite; }
		@keyframes jede { 0% { transform: translateX(-46px); } 70%, 100% { transform: translateX(0); } }
		@media (prefers-reduced-motion: reduce) {
			.jede { animation: none; }
		}
	</style>
	<defs>
		<linearGradient id="srst" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#d9a466" />
			<stop offset="1" stop-color="#a86a32" />
		</linearGradient>
		<g id="pes">
			<path d="M 16 22 C 4 18 0 6 8 1 C 12 -1 14 4 11 7" fill="none" stroke="#5c3a1a" stroke-width="9" stroke-linecap="round" />
			<path d="M 16 22 C 4 18 0 6 8 1 C 12 -1 14 4 11 7" fill="none" stroke="#c48a4f" stroke-width="5" stroke-linecap="round" />
			<rect x="22" y="36" width="7" height="25" rx="3" fill="#7a4a22" />
			<rect x="66" y="36" width="7" height="25" rx="3" fill="#7a4a22" />
			<ellipse cx="26" cy="62" rx="6" ry="3" fill="#3b2412" />
			<ellipse cx="70" cy="62" rx="6" ry="3" fill="#3b2412" />
			<path d="M 12 27 Q 12 12 30 13 L 68 12 Q 84 12 84 28 Q 84 44 68 44 L 28 44 Q 12 44 12 27 Z" fill="url(#srst)" stroke="#5c3a1a" stroke-width="2" />
			<path d="M 26 41 Q 48 47 70 41" fill="none" stroke="#f1d3a8" stroke-width="4" stroke-linecap="round" />
			<path d="M 24 20 Q 30 17 36 20 M 46 18 Q 52 15 58 18" fill="none" stroke="#8a5528" stroke-width="1.5" />
			<rect x="31" y="38" width="8" height="25" rx="3" fill="#b8793e" stroke="#5c3a1a" stroke-width="1.5" />
			<rect x="74" y="38" width="8" height="25" rx="3" fill="#b8793e" stroke="#5c3a1a" stroke-width="1.5" />
			<ellipse cx="36" cy="63" rx="7" ry="3.2" fill="#3b2412" />
			<ellipse cx="79" cy="63" rx="7" ry="3.2" fill="#3b2412" />
			<path d="M 40 12.5 L 68 12.5 M 68 12 L 64 44" fill="none" stroke="#0b7285" stroke-width="5" stroke-linecap="round" />
			<circle cx="44" cy="11" r="3.5" fill="none" stroke="#343a40" stroke-width="2" />
			<path d="M 76 20 Q 74 2 92 2 Q 102 2 105 10 L 112 13 Q 117 17 112 22 L 101 25 Q 90 31 80 27 Z" fill="#c48a4f" stroke="#5c3a1a" stroke-width="2" />
			<ellipse cx="106" cy="18" rx="7" ry="5" fill="#e8c08e" />
			<path d="M 84 6 L 86 -10 L 96 3 Z" fill="#7a4a22" stroke="#5c3a1a" stroke-width="1.5" />
			<circle cx="96" cy="9" r="2.6" fill="#1b1b1b" />
			<circle cx="96.9" cy="8.1" r="0.9" fill="#fff" />
			<ellipse cx="113" cy="16" rx="3.4" ry="2.7" fill="#1b1b1b" />
			<path d="M 103 22 Q 107 24 111 21" fill="none" stroke="#5c3a1a" stroke-width="1.5" />
		</g>
		<g id="dilek">
			<rect x="0" y="-12" width="30" height="12" fill="#ffe8a3" stroke="#2b2a26" stroke-width="2" />
			<text x="40" y="0" font-size="21" fill="#495057">= 10 N (měřítko)</text>
		</g>
		<clipPath id="okno2"><rect x="23" y="96" width="414" height="116" /></clipPath>
	</defs>
	<rect x="0" y="635" width="460" height="431" fill="#f3f1ea" />
	<g id="panel-2" transform="translate(0 645)">
		<rect x="26" y="6" width="420" height="405" rx="10" fill="#2b2a26" />
		<rect x="20" y="0" width="420" height="405" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="34" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="41" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="43" font-size="28" font-weight="bold" fill="#2b2a26">Síly stejného směru</text>
		<text x="40" y="85" font-size="21" fill="#2b2a26">výslednice = <tspan font-weight="bold" fill="#c92a2a">součet</tspan>, stejný směr</text>

		<!-- sníh -->
		<rect x="22" y="200" width="416" height="12" fill="#e7f0f8" />
		<line x1="22" y1="200" x2="438" y2="200" stroke="#868e96" stroke-width="2" />
		<g clip-path="url(#okno2)">
			<g class="jede">
				<!-- saně -->
				<path d="M 26 198 L 146 198 Q 160 198 158 184" fill="none" stroke="#495057" stroke-width="4" stroke-linecap="round" />
				<path d="M 44 180 V 198 M 76 180 V 198 M 108 180 V 198 M 138 180 V 198" stroke="#495057" stroke-width="3" />
				<rect x="34" y="172" width="114" height="9" rx="2" fill="#b07a43" stroke="#5c3a1a" stroke-width="1.5" />
				<path d="M 36 172 V 144 M 36 146 H 48" stroke="#5c3a1a" stroke-width="4" stroke-linecap="round" fill="none" />
				<rect x="52" y="148" width="44" height="24" fill="#d9a066" stroke="#5c3a1a" stroke-width="2" />
				<line x1="52" y1="160" x2="96" y2="160" stroke="#8d5a2b" stroke-width="1.5" />
				<use xlink:href="#pes" href="#pes" transform="translate(240 148.8) scale(0.8)" />
				<use xlink:href="#pes" href="#pes" transform="translate(340 148.8) scale(0.8)" />
				<!-- tažná šňůra: ze saní kolem 1. psa (pod hřbetem) k postroji 2. psa,
				     1. pes je k ní připnutý krátkou šňůrkou ze svého postroje -->
				<path d="M 148 176 L 336 178 L 375.2 157.6" fill="none" stroke="#5c3a1a" stroke-width="2.5" stroke-linejoin="round" />
				<path d="M 275.2 157.6 L 284 177" fill="none" stroke="#5c3a1a" stroke-width="2" />
				<circle cx="284" cy="177.5" r="2.5" fill="#343a40" />
				<circle cx="375.2" cy="157.6" r="2.8" fill="#343a40" />
				<!-- síly z působiště na nákladu: F2 50 N = 150 px pod F1 30 N = 90 px -->
				<line x1="72" y1="160" x2="206" y2="160" stroke="#6741d9" stroke-width="8" />
				<polygon points="222,160 206,151 206,169" fill="#6741d9" />
				<line x1="72" y1="160" x2="150" y2="160" stroke="#1971c2" stroke-width="4" />
				<polygon points="162,160 150,154 150,166" fill="#1971c2" />
				<path d="M 65 153 L 79 167 M 79 153 L 65 167" stroke="#495057" stroke-width="3" stroke-linecap="round" />
			</g>
		</g>
		<text x="34" y="122" font-size="21" font-weight="bold" fill="#1971c2">F<tspan font-size="18" dy="5">1</tspan><tspan dy="-5"> = 30 N</tspan></text>
		<text x="140" y="122" font-size="21" font-weight="bold" fill="#6741d9">F<tspan font-size="18" dy="5">2</tspan><tspan dy="-5"> = 50 N</tspan></text>

		<!-- výslednice ze stejného působiště: 80 N = 240 px -->
		<line x1="72" y1="260" x2="296" y2="260" stroke="#c92a2a" stroke-width="6" />
		<polygon points="312,260 296,251 296,269" fill="#c92a2a" />
		<path d="M 65 253 L 79 267 M 79 253 L 65 267" stroke="#495057" stroke-width="3" stroke-linecap="round" />
		<text x="322" y="268" font-size="22" font-weight="bold" fill="#c92a2a">F = 80 N</text>
		<use xlink:href="#dilek" href="#dilek" x="72" y="305" />
		<text x="230" y="345" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2a26">F = F<tspan font-size="18" dy="5">1</tspan><tspan dy="-5"> + F</tspan><tspan font-size="18" dy="5">2</tspan></text>
		<text x="230" y="382" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2a26">F = 30 N + 50 N = <tspan fill="#c92a2a">80 N</tspan></text>
	</g>
</svg>
