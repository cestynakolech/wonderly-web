<svg xmlns="http://www.w3.org/2000/svg" width="460" height="660" viewBox="0 0 460 660" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kolem nás: kde najdeme přetlak, podtlak a vakuum. Přetlak, tlak uvnitř větší než venku: nafouknutý míč, pneumatika, sprej, ve kterém plyn uvnitř tlačí obsah ven, lahev potápěče. Podtlak, tlak uvnitř menší než venku: pití brčkem, přísavka, kterou ke zdi přitlačí okolní vzduch, vysavač, který nasává vzduch i s prachem, gumový zvon na odpad. Vakuum, skoro žádný vzduch: klasická žárovka s vláknem, vakuově balené potraviny, vakuový vak na oblečení, vesmír. Plíce: při výdechu je v nich přetlak a vzduch jde ven, při nádechu podtlak a vzduch jde dovnitř. Dokonalé vakuum neexistuje.">
	<title>Přetlak, podtlak, vakuum 1/1: Kolem nás</title>
	<!-- Panel W59 (14. 10. 2026, OPRAVA 1). Opora: výklad stránky (odstavce Přetlak/Podtlak/Vakuum: „do místa s podtlakem se nasává okolní vzduch“, „v plicích, když po nádechu vydechujeme“) + PDF Tlak plynu v uzavřené nádobě s. 1, 5, 7. Děj: sprej (obsah jde ven), vysavač (vzduch s prachem jde dovnitř), přísavka (okolní vzduch ji tlačí ke zdi), plíce (nádech/výdech, cyklus 6 s). Brčko a vakuové balení se neanimují — to dělá obr-04 stránky. Bez animace = všechny šipky a obláčky vidět. -->
	<style>
		.sp1, .sp2, .sp3 { animation: ven 1.8s linear infinite; transform-box: view-box; transform-origin: 105px 386px; }
		.sp2 { animation-delay: -0.6s } .sp3 { animation-delay: -1.2s }
		@keyframes ven { 0% { transform: scale(0.15); opacity: 1 } 80% { opacity: 1 } 100% { transform: scale(1.25); opacity: 0 } }
		.vs1, .vs2, .vs3 { animation: dovnitr 1.8s linear infinite; transform-box: view-box; transform-origin: 263px 431px; }
		.vs2 { animation-delay: -0.6s } .vs3 { animation-delay: -1.2s }
		@keyframes dovnitr { 0% { transform: scale(1.25); opacity: 0 } 20% { opacity: 1 } 100% { transform: scale(0.1); opacity: 1 } }
		.tlaci { animation: tlaci 1.5s ease-in-out infinite; }
		@keyframes tlaci { 0%, 100% { transform: translate(0px, 0px) } 50% { transform: translate(-6px, 0px) } }
		.plice { animation: plice 6s ease-in-out infinite; transform-box: view-box; transform-origin: 80px 600px; }
		@keyframes plice { 0%, 100% { transform: scale(1) } 45%, 50% { transform: scale(1.15) } }
		.pin { animation: pin 6s linear infinite; }
		@keyframes pin { 0% { opacity: 1; transform: translate(0px, -5px) } 45% { opacity: 1; transform: translate(0px, 5px) } 50%, 95% { opacity: 0; transform: translate(0px, 5px) } 100% { opacity: 1; transform: translate(0px, -5px) } }
		.pout { animation: pout 6s linear infinite; }
		@keyframes pout { 0%, 45% { opacity: 0; transform: translate(0px, 5px) } 50% { opacity: 1; transform: translate(0px, 5px) } 95% { opacity: 1; transform: translate(0px, -5px) } 100% { opacity: 0; transform: translate(0px, -5px) } }
		.hin { animation: hin 6s linear infinite; }
		@keyframes hin { 0%, 45% { opacity: 1 } 50%, 95% { opacity: 0 } 100% { opacity: 1 } }
		.hout { animation: hout 6s linear infinite; }
		@keyframes hout { 0%, 45% { opacity: 0 } 50%, 95% { opacity: 1 } 100% { opacity: 0 } }
		@media (prefers-reduced-motion: reduce) {
			.sp1, .sp2, .sp3, .vs1, .vs2, .vs3, .tlaci, .plice, .pin, .pout, .hin, .hout { animation: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="660" fill="#f8f9fa"/>
	<rect x="26" y="16" width="420" height="640" rx="12" fill="#dee2e6"/><rect x="20" y="10" width="420" height="640" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/>
	<text x="40" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Kolem nás</text>
	<text x="40" y="86" font-size="18" fill="#2b2a26">Kde najdeme přetlak, podtlak a vakuum?</text>

	<!-- sloupce -->
	<rect x="30" y="102" width="122" height="460" rx="10" fill="#fff4e6"/>
	<rect x="169" y="102" width="122" height="460" rx="10" fill="#e7f5ff"/>
	<rect x="308" y="102" width="122" height="460" rx="10" fill="#f1f3f5"/>
	<rect x="40" y="110" width="102" height="30" rx="15" fill="#e8590c"/><text x="91" y="131" font-size="17" font-weight="bold" text-anchor="middle" fill="#fff">přetlak</text>
	<rect x="179" y="110" width="102" height="30" rx="15" fill="#1864ab"/><text x="230" y="131" font-size="17" font-weight="bold" text-anchor="middle" fill="#fff">podtlak</text>
	<rect x="318" y="110" width="102" height="30" rx="15" fill="#495057"/><text x="369" y="131" font-size="17" font-weight="bold" text-anchor="middle" fill="#fff">vakuum</text>
	<text x="91" y="157" font-size="13" text-anchor="middle" fill="#a63e0a">tlak uvnitř</text>
	<text x="91" y="173" font-size="13" text-anchor="middle" fill="#a63e0a">větší než venku</text>
	<text x="230" y="157" font-size="13" text-anchor="middle" fill="#1864ab">tlak uvnitř</text>
	<text x="230" y="173" font-size="13" text-anchor="middle" fill="#1864ab">menší než venku</text>
	<text x="369" y="157" font-size="13" text-anchor="middle" fill="#495057">skoro žádný</text>
	<text x="369" y="173" font-size="13" text-anchor="middle" fill="#495057">vzduch</text>

	<!-- PŘETLAK, x = 91 -->
	<g>
