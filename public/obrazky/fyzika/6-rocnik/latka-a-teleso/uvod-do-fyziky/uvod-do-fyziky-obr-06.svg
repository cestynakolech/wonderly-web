th="2"/><path d="M772.0 269.2L769.0 274.4" stroke="#212529" stroke-width="2"/><path d="M758.8 256.0L753.6 259.0" stroke="#212529" stroke-width="2"/><path d="M754.0 238.0L748.0 238.0" stroke="#212529" stroke-width="2"/><path d="M758.8 220.0L753.6 217.0" stroke="#212529" stroke-width="2"/><path d="M772.0 206.8L769.0 201.6" stroke="#212529" stroke-width="2"/><path class="ruc" d="M790 242V200" stroke="#e03131" stroke-width="4" stroke-linecap="round"/><circle cx="790" cy="238" r="5" fill="#212529"/>
<path d="M165 406v28h630v-28M480 434v20" fill="none" stroke="#495057" stroke-width="3"/><path d="M472 446l8 12l8-12" fill="none" stroke="#495057" stroke-width="3"/><rect x="250" y="466" width="460" height="62" rx="14" fill="#fff3bf" stroke="#212529" stroke-width="2.5"/><text x="480" y="505" font-size="22" fill="#212529" text-anchor="middle">ověřené poznatky → <tspan font-weight="bold">fyzikální zákon</tspan></text>
</svg>
