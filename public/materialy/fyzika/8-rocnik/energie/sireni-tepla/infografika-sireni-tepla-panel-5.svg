	<text x="26" y="78" font-size="22" fill="#2b2a26">Tmavé povrchy záření pohlcují víc</text>
<text x="26" y="106" font-size="22" fill="#2b2a26">a víc se ohřejí. Světlé víc odrážejí.</text>
