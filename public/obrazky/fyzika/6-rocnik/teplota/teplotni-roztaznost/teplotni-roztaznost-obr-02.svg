<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 670" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: skleněná baňka plná červené kapaliny je zazátkovaná a zátkou prochází tenká skleněná trubice. Na trubici je značka, kde byla hladina na začátku. Baňku ponoříme do horké vody: kapalina se roztáhne a v trubici vystoupá nad značku. Pak ji ponoříme do studené vody: kapalina se zmenší a hladina klesne pod značku. Dole: Na tom stojí kapalinový teploměr.">
<style>
/* Předloha: výklad a PDF Teplotní roztažnost — „Látky všech skupenství při změně teploty mění svůj objem“,
   „ZAHŘÁTÍ ⇨ zvětšení, OCHLAZENÍ ⇨ zmenšení“, využití: kapalinové teploměry. Kreslený pokus, bez čísel.
   Kapalina červená jako líh v teploměrech podtématu Teplota a její měření; kádinky ve stejném stylu.
   Smyčka 14 s: 0–16 % baňka jde do horké vody, 16–40 % hladina stoupá o 60 nad značku, 46–60 % přesun do studené,
   60–80 % hladina klesne 30 pod značku, 90–100 % návrat. Bez animace = baňka v horké vodě, hladina nad značkou. */
@keyframes bn { 0% { transform: translate(300px, 330px); } 10% { transform: translate(440px, 330px); } 16%, 40% { transform: translate(440px, 490px); }
  46% { transform: translate(440px, 330px); } 54% { transform: translate(160px, 330px); } 60%, 84% { transform: translate(160px, 490px); }
  90% { transform: translate(160px, 330px); } 100% { transform: translate(300px, 330px); } }
@keyframes hl { 0%, 16% { transform: translate(0, 0); } 40%, 60% { transform: translate(0, -60px); } 80%, 90% { transform: translate(0, 30px); } 100% { transform: translate(0, 0); } }
@keyframes tH { 0%, 30% { opacity: 0; } 33%, 48% { opacity: 1; } 51%, 100% { opacity: 0; } }
@keyframes tS { 0%, 70% { opacity: 0; } 73%, 88% { opacity: 1; } 91%, 100% { opacity: 0; } }
@keyframes para { 0% { transform: translate(0, 0); opacity: 0; } 40% { opacity: 0.9; } 100% { transform: translate(0, -26px); opacity: 0; } }
.bn { animation: bn 14s ease-in-out infinite; } .hl { animation: hl 14s ease-in-out infinite; }
.tH { animation: tH 14s linear infinite; } .tS { animation: tS 14s linear infinite; }
.p1 { animation: para 2.4s ease-out infinite; } .p2 { animation: para 2.4s ease-out 0.8s infinite; } .p3 { animation: para 2.4s ease-out 1.6s infinite; }
@media (prefers-reduced-motion: reduce) { .bn, .hl, .tH, .tS, .p1, .p2, .p3 { animation: none; } }
</style>
<defs>
<linearGradient id="sklo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dee2e6"/><stop offset="0.3" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ecef"/></linearGradient>
<radialGradient id="banka" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#e9ecef"/><stop offset="1" stop-color="#ced4da"/></radialGradient>
<linearGradient id="guma" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5c636a"/><stop offset="0.4" stop-color="#adb5bd"/><stop offset="1" stop-color="#343a40"/></linearGradient>
<clipPath id="trub"><rect x="-3" y="-250" width="6" height="200"/></clipPath>
</defs>
<rect x="3" y="3" width="594" height="664" rx="14" fill="#f8f9fa"/>
<rect x="90" y="16" width="420" height="54" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="300" y="52" font-size="26" fill="#212529" text-anchor="middle">Kapalina v trubici</text>
<!-- kádinky: voda (zadní vrstva) -->
<path d="M64 430H256V550Q256 556 246 556H74Q64 556 64 550Z" fill="#74c0fc" opacity="0.55"/>
<path d="M344 430H536V550Q536 556 526 556H354Q344 556 344 550Z" fill="#ffc078" opacity="0.55"/>
<g fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round">
<path class="p1" d="M400 414q-6 -8 0 -16q6 -8 0 -16" opacity="0"/><path class="p2" d="M440 414q-6 -8 0 -16q6 -8 0 -16" opacity="0"/><path class="p3" d="M480 414q-6 -8 0 -16q6 -8 0 -16" opacity="0"/>
</g>
<!-- baňka s trubicí -->
<g class="bn" transform="translate(440 490)">
<circle r="55" fill="url(#banka)" stroke="#495057" stroke-width="2.5"/>
<rect x="-18" y="-104" width="36" height="56" fill="url(#banka)" stroke="#495057" stroke-width="2.5"/>
<circle r="50" fill="#c92a2a"/>
<rect x="-14" y="-100" width="28" height="60" fill="#c92a2a"/>
<path d="M-24 -18A30 30 0 0 1 -6 -40" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
<path d="M-22 -122H22L18 -98H-18Z" fill="url(#guma)" stroke="#212529" stroke-width="2"/>
<rect x="-6" y="-252" width="12" height="160" rx="5" fill="url(#sklo)" stroke="#495057" stroke-width="2"/>
<g clip-path="url(#trub)"><rect class="hl" x="-3" y="-150" width="6" height="110" fill="#c92a2a" transform="translate(0 -60)"/></g>
<path d="M-12 -150H12" stroke="#212529" stroke-width="3"/>
<text x="16" y="-143" font-size="20" fill="#212529">značka</text>
</g>
<!-- kádinky: sklo (přední vrstva) -->
<path d="M64 430H256" stroke="#1971c2" stroke-width="2.5"/>
<path d="M52 398Q60 400 60 410V548Q60 560 72 560H248Q260 560 260 548V404" fill="none" stroke="#495057" stroke-width="3" stroke-linejoin="round"/>
<path d="M344 430H536" stroke="#1971c2" stroke-width="2.5"/>
<path d="M332 398Q340 400 340 410V548Q340 560 352 560H528Q540 560 540 548V404" fill="none" stroke="#495057" stroke-width="3" stroke-linejoin="round"/>
<text x="160" y="588" font-size="22" font-weight="bold" fill="#1864ab" text-anchor="middle">studená voda</text>
<text x="440" y="588" font-size="22" font-weight="bold" fill="#c92a2a" text-anchor="middle">horká voda</text>
<text x="300" y="620" font-size="22" font-weight="bold" fill="#c92a2a" text-anchor="middle" class="tH">V horké vodě kapalina vystoupá.</text>
<text x="300" y="620" font-size="22" font-weight="bold" fill="#1864ab" text-anchor="middle" class="tS" opacity="0">Ve studené vodě kapalina klesne.</text>
<text x="300" y="654" font-size="22" fill="#212529" text-anchor="middle">Na tom stojí kapalinový teploměr.</text>
</svg>
