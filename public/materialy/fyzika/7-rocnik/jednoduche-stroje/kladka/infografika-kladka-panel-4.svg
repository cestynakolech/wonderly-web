<svg viewBox="0 2040 460 580" width="460" height="580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Něco za něco: pevná kladka síla 20 N a lano 1 m, volná kladka síla 10 N a lano 2 m; kolikrát menší síla, tolikrát delší dráha lana, práci neušetříš, jen ji rozložíš (zlaté pravidlo mechaniky); příklad: břemeno 10 kg má tíhu 100 N, na volné kladce nese každá část lana 50 N, 50 + 50 = 100 N, táhneš jen silou 50 N" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Kladka 4/5: Něco za něco</title>
	<defs></defs>
	<rect x="0" y="2040" width="460" height="580" fill="#f8f9fa"/>
	<g id="panel-4"><rect x="26" y="2056" width="420" height="560" rx="12" fill="#dee2e6"/><rect x="20" y="2050" width="420" height="560" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="2084" r="17" fill="#2b2a26"/><text x="52" y="2092" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">4</text><text x="80" y="2093" font-size="25" font-weight="bold" fill="#2b2a26">Něco za něco</text><text x="34" y="2136" font-size="21" font-weight="bold" fill="#2b2a26">Pevná kladka</text><text x="34" y="2172" font-size="21" fill="#2b2a26">síla</text><rect x="110" y="2154" width="220" height="24" rx="4" fill="#c92a2a"/><text x="340" y="2174" font-size="21" font-weight="bold" fill="#c92a2a">20 N</text><text x="34" y="2208" font-size="21" fill="#2b2a26">lano</text><rect x="110" y="2190" width="110" height="24" rx="4" fill="#cc6a00"/><text x="230" y="2210" font-size="21" font-weight="bold" fill="#2b2a26">1 m</text><line x1="34" y1="2228" x2="426" y2="2228" stroke="#ced4da" stroke-width="2"/><text x="34" y="2260" font-size="21" font-weight="bold" fill="#2b2a26">Volná kladka</text><text x="34" y="2296" font-size="21" fill="#2b2a26">síla</text><rect x="110" y="2278" width="110" height="24" rx="4" fill="#c92a2a"/><text x="230" y="2298" font-size="21" font-weight="bold" fill="#c92a2a">10 N</text><text x="34" y="2332" font-size="21" fill="#2b2a26">lano</text><rect x="110" y="2314" width="220" height="24" rx="4" fill="#cc6a00"/><text x="340" y="2334" font-size="21" font-weight="bold" fill="#2b2a26">2 m</text><text x="34" y="2374" font-size="21" font-weight="bold" fill="#2b2a26">Kolikrát menší síla,</text><text x="34" y="2402" font-size="21" font-weight="bold" fill="#2b2a26">tolikrát delší dráha lana.</text><text x="34" y="2432" font-size="21" fill="#2b2a26">Práci neušetříš, jen ji rozložíš.</text><rect x="34" y="2452" width="392" height="140" rx="10" fill="#fff" stroke="#2b2a26" stroke-width="2"/><text x="48" y="2484" font-size="21" fill="#2b2a26">Břemeno 10 kg: <tspan font-style="italic">F</tspan><tspan font-size="18" dy="5">G</tspan><tspan dy="-5"> = 100 N</tspan></text><text x="48" y="2514" font-size="21" fill="#2b2a26">Na volné kladce nese každá</text><text x="48" y="2542" font-size="21" fill="#2b2a26">část lana 50 N: 50 + 50 = 100 N.</text><text x="48" y="2574" font-size="21" font-weight="bold" fill="#2b2a26">Táhneš jen <tspan font-style="italic">F</tspan> = 50 N.</text></g>
</svg>
