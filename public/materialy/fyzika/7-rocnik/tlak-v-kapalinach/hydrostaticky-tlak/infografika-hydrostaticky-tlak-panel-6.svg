<svg xmlns="http://www.w3.org/2000/svg" width="460" height="716" viewBox="0 0 460 716" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Spojené nádoby v praxi. Hadicová vodováha: hadice s vodou mezi dvěma sloupky, obě hladiny ukážou stejnou výšku. Sifon pod umyvadlem: voda v ohybu trubky nepustí zápach z odpadu. Plavební komora: loď je v komoře mezi dvojími vraty, voda přiteče z vyšší části řeky, hladina v komoře se vyrovná s horní hladinou, vrata se otevřou a loď popluje dál.">
