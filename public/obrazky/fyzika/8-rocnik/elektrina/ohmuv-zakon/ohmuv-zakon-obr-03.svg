<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pomůcka trojúhelník Ohmova zákona: nahoře napětí U, dole vedle sebe odpor R a proud I. Pod ním tři podoby vztahu: U = R · I vypočítá napětí, I = U : R vypočítá proud, R = U : I vypočítá odpor. Napětí ve voltech, proud v ampérech, odpor v ohmech. Animace: kartička s otazníkem postupně zakryje U, I a R a zvýrazní se vždy řádek, který danou veličinu vypočítá.">
<style>
/* Předloha: PDF Ohmův zákon, s. 3 (vzorce I = U : R, U = R · I, R = U : I; výklad oddíl 4 „Tři podoby stejného vztahu“).
   Pomůcka trojúhelník: nahoře U, dole R a I vedle sebe. 12 s: 0–30 % kartička „?“ zakrývá U → zvýrazněn řádek U = R · I;
   33–63 % zakrývá I → řádek I = U : R; 66–96 % zakrývá R → řádek R = U : I; 96–100 % návrat k U (smyčka).
   Bez animace (reduced-motion) = kartička na U, zvýrazněn řádek U = R · I, ostatní řádky vidět. */
.kr { animation: kr 12s ease-in-out infinite; }
@keyframes kr { 0%, 30% { transform: translate(0px, 0px); } 33%, 63% { transform: translate(60px, 120px); } 66%, 96% { transform: translate(-60px, 120px); } 100% { transform: translate(0px, 0px); } }
.r1, .r2, .r3 { animation: 12s linear infinite; }
.r1 { animation-name: r1; } .r2 { opacity: 0; animation-name: r2; } .r3 { opacity: 0; animation-name: r3; }
@keyframes r1 { 0%, 30% { opacity: 1; } 32%, 98% { opacity: 0; } 100% { opacity: 1; } }
@keyframes r2 { 0%, 31% { opacity: 0; } 33%, 63% { opacity: 1; } 65%, 100% { opacity: 0; } }
@keyframes r3 { 0%, 64% { opacity: 0; } 66%, 96% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .kr, .r1, .r2, .r3 { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="674" rx="14" fill="#f8f9fa"/>
<text x="300" y="42" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Tři podoby Ohmova zákona</text><text x="300" y="78" font-size="20" fill="#212529" text-anchor="middle">Zakryj hledanou veličinu – zbytek ukáže výpočet.</text><path d="M300 100L480 400H120Z" fill="#fff" stroke="#212529" stroke-width="4" stroke-linejoin="round"/><path d="M204 260H396M300 260V400" stroke="#212529" stroke-width="4"/><text x="300" y="240" font-size="60" font-weight="bold" fill="#212529" text-anchor="middle">U</text><text x="240" y="360" font-size="60" font-weight="bold" fill="#212529" text-anchor="middle">R</text><text x="360" y="360" font-size="60" font-weight="bold" fill="#212529" text-anchor="middle">I</text><g class="kr"><rect x="262" y="180" width="76" height="76" rx="10" fill="#495057" stroke="#212529" stroke-width="3"/><text x="300" y="232" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle">?</text></g><rect class="r1" x="60" y="436" width="480" height="46" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/><text x="84" y="470" font-size="28" font-weight="bold" fill="#212529" text-anchor="start">U = R · I</text><text x="270" y="470" font-size="22" fill="#212529" text-anchor="start">→ vypočítá napětí</text><rect class="r2" x="60" y="492" width="480" height="46" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/><text x="84" y="526" font-size="28" font-weight="bold" fill="#212529" text-anchor="start">I = U : R</text><text x="270" y="526" font-size="22" fill="#212529" text-anchor="start">→ vypočítá proud</text><rect class="r3" x="60" y="548" width="480" height="46" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/><text x="84" y="582" font-size="28" font-weight="bold" fill="#212529" text-anchor="start">R = U : I</text><text x="270" y="582" font-size="22" fill="#212529" text-anchor="start">→ vypočítá odpor</text><text x="300" y="652" font-size="20" fill="#212529" text-anchor="middle">U ve voltech (V), I v ampérech (A), R v ohmech (Ω)</text></svg>
