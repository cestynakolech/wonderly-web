<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 705" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Elektroskop. Vlevo se nabitý plastový hřeben dotkne talířku elektroskopu a část elektronů z něj přejde na elektroskop: talířek, tyčka i ručička jsou záporné a ručička se od tyčky odpudí. Vpravo se nabitá skleněná tyč dotkne talířku a elektrony přejdou z elektroskopu na tyč: elektroskop je kladný a ručička se vychýlí stejně. Výchylka tedy neurčí znaménko náboje. Animace: těleso se dotkne talířku, elektrony přejdou a ručička se vychýlí.">
<style>
/* Animace 10 s, smyčka. Předloha: PDF lekce 18, str. 8 (elektroskop: přenesení náboje, ukáže nabití, neurčí znaménko ani velikost — jen text, kresba podle běžného školního elektroskopu), str. 11 (plast −, sklo +), str. 12–14 (přenos náboje dotykem, vodiče).
   Hřeben/tyč sjede o 24 px k talířku 3–18 % (start pod popisky, nepřekrývá je), elektrony přecházejí 25–50 %, ručička se vychýlí 50–65 %, popisky 65–72 %, závěr 72–78 %; zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy ukazují vše. */
.sestup { animation: sestup 10s linear infinite; }
@keyframes sestup { 0%, 3% { transform: translate(0px, -24px); } 18%, 100% { transform: translate(0px, 0px); } }
.m1 { animation: m1 10s linear infinite; }
@keyframes m1 { 0%, 25% { transform: translate(-64px, -41px); } 42%, 100% { transform: translate(0px, 0px); } }
.m2 { animation: m2 10s linear infinite; }
@keyframes m2 { 0%, 28% { transform: translate(0px, -309px); } 48%, 100% { transform: translate(0px, 0px); } }
.m3 { animation: m3 10s linear infinite; }
@keyframes m3 { 0%, 30% { transform: translate(-3.3px, -195.5px); } 50% { transform: translate(-33.3px, -10.5px); } 65%, 100% { transform: translate(0px, 0px); } }
.zP { animation: zP 10s linear infinite; }
@keyframes zP { 0%, 50% { transform: translate(-33.3px, -10.5px); } 65%, 100% { transform: translate(0px, 0px); } }
.n1 { animation: n1 10s linear infinite; }
@keyframes n1 { 0%, 25% { transform: translate(-44px, 23px); } 42%, 100% { transform: translate(0px, 0px); } }
.n2 { animation: n2 10s linear infinite; }
@keyframes n2 { 0%, 28% { transform: translate(56px, 291px); } 48%, 100% { transform: translate(0px, 0px); } }
.n3 { animation: n3 10s linear infinite; }
@keyframes n3 { 0%, 30% { transform: translate(24px, 167px); } 50%, 100% { transform: translate(0px, 0px); } }
.rL { animation: rL 10s linear infinite; }
@keyframes rL { 0%, 50% { transform: rotate(-35deg); } 65%, 100% { transform: rotate(0deg); } }
.rP { animation: rP 10s linear infinite; }
@keyframes rP { 0%, 50% { transform: rotate(-35deg); } 65%, 100% { transform: rotate(0deg); } }
.pt { animation: pt 10s linear infinite; }
@keyframes pt { 0%, 65% { opacity: 0; } 72%, 100% { opacity: 1; } }
.zt { animation: zt 10s linear infinite; }
@keyframes zt { 0%, 72% { opacity: 0; } 78%, 100% { opacity: 1; } }
.celek { animation: celek 10s linear infinite; }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sestup, .m1, .m2, .m3, .zP, .n1, .n2, .n3, .rL, .rP, .pt, .zt, .celek { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="699" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<g class="celek"><text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Elektroskop</text><text x="300" y="68" font-size="22" fill="#495057" text-anchor="middle">ukáže, zda je těleso nabité</text><text x="155" y="100" font-size="22" fill="#212529" text-anchor="middle">nabitý plastový hřeben</text><text x="445" y="100" font-size="22" fill="#212529" text-anchor="middle">nabitá skleněná tyč</text><rect x="60" y="290" width="190" height="230" rx="12" fill="#dee2e6" stroke="#495057" stroke-width="2.5"/><rect x="75" y="305" width="160" height="200" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/><rect x="85" y="520" width="140" height="14" rx="3" fill="#495057"/><rect x="152" y="198" width="6" height="284" fill="#868e96" stroke="#495057" stroke-width="1"/><rect x="137" y="276" width="36" height="28" rx="3" fill="#343a40"/><ellipse cx="155" cy="198" rx="50" ry="8" fill="#adb5bd" stroke="#495057" stroke-width="2"/><g transform="translate(155,400) rotate(35)"><g class="rL"><polygon points="0,-70 5,0 0,70 -5,0" fill="#495057"/></g></g><circle cx="155" cy="400" r="5" fill="#212529"/><g class="sestup"><rect x="75" y="140" width="160" height="34" rx="5" fill="#ffe066" stroke="#495057" stroke-width="2.5"/><line x1="80" y1="174" x2="80" y2="191" stroke="#495057" stroke-width="3"/><line x1="90" y1="174" x2="90" y2="191" stroke="#495057" stroke-width="3"/><line x1="100" y1="174" x2="100" y2="191" stroke="#495057" stroke-width="3"/><line x1="110" y1="174" x2="110" y2="191" stroke="#495057" stroke-width="3"/><line x1="120" y1="174" x2="120" y2="191" stroke="#495057" stroke-width="3"/><line x1="130" y1="174" x2="130" y2="191" stroke="#495057" stroke-width="3"/><line x1="140" y1="174" x2="140" y2="191" stroke="#495057" stroke-width="3"/><line x1="150" y1="174" x2="150" y2="191" stroke="#495057" stroke-width="3"/><line x1="160" y1="174" x2="160" y2="191" stroke="#495057" stroke-width="3"/><line x1="170" y1="174" x2="170" y2="191" stroke="#4950