		.h2s3 { animation: h2s3 6s linear infinite; animation-delay: -4.9s; }
		@media (prefers-reduced-motion: reduce) { .h2t0, .h2t1, .h2t2, .h2t3, .h2s0, .h2s1, .h2s2, .h2s3 { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .h2t0, .h2s0, .h2t1, .h2s1, .h2t2, .h2s2, .h2t3, .h2s3 { animation: none; } }
