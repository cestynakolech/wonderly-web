<svg viewBox="0 0 460 720" width="460" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meteorologie a měření tlaku v pohybu, Barometr cestou k chatě: turista nese barometr od moře k chatě 400 m nad mořem. Jak stoupá, ručička barometru klesá: 0 m 1 020 hPa, 80 m 1 010 hPa, 160 m 1 000 hPa, 240 m 990 hPa, 320 m 980 hPa, 400 m 970 hPa. Každých 8 m výš ubude 1 hPa: 400 : 8 = 50 hPa, 1 020 − 50 = 970 hPa." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Meteorologie a měření tlaku v pohybu 1/3: Barometr cestou k chatě</title>
	<!-- W112. Opora: výklad temata.ts (1 hPa na 8 m u hladiny moře; chata 400 m, u moře 1 020 hPa, 400 : 8 = 50 hPa, 1 020 − 50 = 970 hPa) a PDF 7/3/18 Meteorologická pozorování s. 5–6 (barometr měří tlak, aneroid posouvá ručičkou na stupnici). Ciferník převzat z obr-03 stránky (obruba, krémový ciferník, černá ručička; 1 hPa = 3°, 1 000 hPa nahoře, nižší tlak vlevo). Cyklus 12 s: 0–1 s turista u moře; 1–8,5 s rovnoměrně stoupá k chatě (lineárně spolu s ručičkou 60° → −90° a značkou na pravítku); hodnoty v rámečku se přepnou v 2,5/4/5,5/7/8,5 s, když turista mine značku 80/160/240/320/400 m; od 8,5 s výpočet. 11,6–11,94 s zhasnutí a návrat. Klid: turista u chaty, 400 m, 970 hPa, výpočet. -->
