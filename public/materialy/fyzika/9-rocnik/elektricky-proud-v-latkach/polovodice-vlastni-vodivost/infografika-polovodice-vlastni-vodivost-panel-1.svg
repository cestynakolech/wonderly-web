<svg viewBox="0 120 460 490" width="460" height="490" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tři druhy látek: vodiče, například kovy, vedou proud dobře; izolanty proud nevedou; polovodiče vedou proud jen za určitých podmínek. Polovodiče jsou křemík (Si) a germanium (Ge); nakreslen kus křemíku" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Polovodiče 1/6: Tři druhy látek</title>
	<rect x="0" y="120" width="460" height="490" fill="#f8f9fa"/>
	<g id="panel-1"><rect x="26" y="136" width="420" height="470" rx="12" fill="#dee2e6"/><rect x="20" y="130" width="420" height="470" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="164" r="17" fill="#2b2a26"/><text x="52" y="172" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="80" y="173" font-size="25" font-weight="bold" fill="#2b2a26">Tři druhy látek</text><text x="34" y="218" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Vodiče</tspan> vedou proud dobře,</text><text x="34" y="246" font-size="21" fill="#2b2a26">například kovy.</text><text x="34" y="284" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Izolanty</tspan> proud nevedou.</text><text x="34" y="322" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Polovodiče</tspan> vedou proud jen</text><text x="34" y="350" font-size="21" fill="#2b2a26">za určitých podmínek. Jsou</text><text x="34" y="378" font-size="21" fill="#2b2a26">tak trochu „napůl“.</text><rect x="34" y="404" width="392" height="176" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><path d="M54,510 L70,462 L110,440 L162,446 L200,478 L194,522 L150,542 L88,538 Z" fill="#adb5bd" stroke="#343a40" stroke-width="2" stroke-linejoin="round"/><path d="M70,462 L118,486 L162,446 M118,486 L150,542 M118,486 L54,510" fill="none" stroke="#6c757d" stroke-width="1.5"/><path d="M110,440 L162,446 L118,486 L70,462 Z" fill="#dee2e6" opacity="0.9"/><path d="M162,446 L200,478 L194,522 L150,542 L118,486 Z" fill="#868e96" opacity="0.55"/><text x="128" y="568" font-size="21" text-anchor="middle" fill="#495057">kus křemíku</text><text x="236" y="466" font-size="21" font-weight="bold" fill="#2b2a26">Polovodiče:</text><text x="236" y="500" font-size="21" fill="#2b2a26">křemík (Si)</text><text x="236" y="532" font-size="21" fill="#2b2a26">germanium (Ge)</text></g>
</svg>
