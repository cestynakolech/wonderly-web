<svg xmlns="http://www.w3.org/2000/svg" width="460" height="500" viewBox="0 0 460 500" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Síla 400 N, měřítko 1 cm odpovídá 100 N, šipka bude dlouhá 4 cm. Šipka roste po centimetrech: 100 N, 200 N, 300 N, 400 N. Víc sil v obrázku kreslíme ve stejném měřítku: síla 200 N má šipku 2 cm.">
	<title>Síla 4/6: Měřítko</title>
