<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Světlo v dešťové kapce. Vlevo hlavní duha: bílé světlo vstoupí do kapky, láme se a rozloží na barvy, uvnitř se jednou odrazí a při výstupu se znovu láme, takže se spektrum ještě rozšíří. Vpravo vedlejší duha: světlo se v kapce odrazí dvakrát a barvy vycházejí v opačném pořadí. Animace: bílý paprsek doletí ke kapce a barevné paprsky postupně proběhnou kapkou až ven.">
<style>
/* Animace (10 s, smyčka) podle předlohy (PDF lekce 28, str. 8 nahoře — kapky s čísly 1, 2, 4, 6):
   bílé světlo doletí (5–20 %), lom a rozklad na vstupu (20–32 %), první odraz (32–44 %),
   hlavní duha: výstup (44–60 %); vedlejší duha: druhý odraz (44–56 %) a výstup (56–72 %); zmizí (92–98 %).
   Bez animace (prefers-reduced-motion) = koncový stav: atributy níže ukazují vše. */
.w, .s0, .s1, .s2, .s2v, .s3 { stroke-dasharray: 100; }
.w { animation: w 10s linear infinite; }
.s0 { animation: s0 10s linear infinite; }
.s1 { animation: s1 10s linear infinite; }
.s2 { animation: s2 10s linear infinite; }
.s2v { animation: s2v 10s linear infinite; }
.s3 { animation: s3 10s linear infinite; }
.celek { animation: celek 10s linear infinite; }
@keyframes w { 0%, 5% { stroke-dashoffset: 100; } 20%, 100% { stroke-dashoffset: 0; } }
@keyframes s0 { 0%, 20% { stroke-dashoffset: 100; } 32%, 100% { stroke-dashoffset: 0; } }
@keyframes s1 { 0%, 32% { stroke-dashoffset: 100; } 44%, 100% { stroke-dashoffset: 0; } }
@keyframes s2v { 0%, 44% { stroke-dashoffset: 100; } 60%, 100% { stroke-dashoffset: 0; } }
@keyframes s2 { 0%, 44% { stroke-dashoffset: 100; } 56%, 100% { stroke-dashoffset: 0; } }
@keyframes s3 { 0%, 56% { stroke-dashoffset: 100; } 72%, 100% { stroke-dashoffset: 0; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .w, .s0, .s1, .s2, .s2v, .s3, .celek { animation: none; } }
</style>
<defs>
<radialGradient id="r3voda" cx="0.38" cy="0.32" r="0.75">
<stop offset="0" stop-color="#7395bb"/><stop offset="0.65" stop-color="#3d5a7a"/><stop offset="1" stop-color="#263a56"/>
</radialGradient>
<radialGradient id="r3lesk" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
</defs>
<rect x="3" y="3" width="594" height="464" rx="14" fill="#141a24" stroke="#2b2a26" stroke-width="3"/>
