<svg viewBox="0 0 460 640" width="460" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kmitání v pohybu 2/2, Kmitání se šíří: řada kuliček spojených pružinami. Rozkmitáme první kuličku nahoru a dolů. Pružiny rozkmitají sousední kuličky, každou o kousek později. Kmitání se tak šíří řadou kuliček doprava. Každá kulička kmitá se stejnou frekvencí i amplitudou, jen se zpožděním. Tak vzniká vlnění." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Kmitání v pohybu 2/2: Kmitání se šíří řadou kuliček</title>
	<!-- W85 (14. 10. 2026). Předloha: PDF 33 Kmitání a vlnění, s. 5 („Pokud bychom malé kuličky spojili pružinami a jednu z nich
	     rozkmitali, postupně začnou kmitat i ostatní kuličky. Každá další kulička bude kmitat se stejnou frekvencí i amplitudou, ale
	     s určitým zpožděním. Řadou kuliček se bude šířit vlnění.“) a s. 6 („Vlnění vzniká šířením kmitavého pohybu látkovým prostředím“).
	     Výklad: § Vlnění („Se zpožděním se rozkmitají i molekuly sousední“, „stejnou frekvencí … stejnou amplitudou, jen každá s malým
	     zpožděním“). Pružiny z PDF s. 5 (pružina se závažím) — šedá klikatá čára.
	     Model (bez čísel v textu): 9 kuliček po 44 px, amplituda 30 px, perioda 1 s, zpoždění 0,25 s na kuličku (λ = 4 mezery).
	     Každá kulička udělá 4 kmity a zastaví se v rovnovážné poloze; cyklus 7 s (poslední kulička kmitá 2–6 s, pak 1 s klid).
	     Kulička i pružina sdílí jednu animaci posunutou animation-delay; pružina = posun s levou kuličkou + skewY podle rozdílu výšek
	     sousedů (vzorkováno po 1/16 s, viz /tmp/wonderly-workery/2026-10-14-W85/gen/kf.py). Oranžová = kulička, kterou rozkmitáme
	     (jediný význam), modrá = ostatní. Bez pohybu: snímek v čase 2,5 s (všechny kuličky kmitají). -->
