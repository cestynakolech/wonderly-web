<svg viewBox="0 0 460 470" width="460" height="470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tělesa a látky v pohybu, Vzduch v balónku: ruka třikrát stlačí pumpičku a splasklý balónek na hubičce se nafukuje. Pumpička tlačí do balónku vzduch, vzduch je látka. Vzduch v balónku je těleso – má tvar i hranice, i když ho nevidíme." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Tělesa a látky v pohybu 1/2: Vzduch v balónku</title>
	<!-- W104 (oprava po kontrole 1). Předloha: PDF 6/01 Látka/2. Tělesa a látky, s. 2 (látka: vzduch; těleso: „vzduch v balónku (ze vzduchu)“); výklad temata.ts („vzduch je látka, ale vzduch v balonku těleso“; těleso „nemusí být ani vidět: vzduch v pneumatice nebo v balonku je taky těleso“). Balónek převzat z obr-04 (otočen o 90°, roste od hrdla). Vzduch se nekreslí (není vidět). Cyklus 10 s: 0–0,5 s splasklý balónek (svraštělá gumička bez lesku); tři tahy pumpičkou 0,5–1,6 / 2,0–3,1 / 3,5–4,6 s, v 0,55 s (první tah) se gumička vymění za malý kulatý balónek, ten roste jen při stlačení (měřítko 0,35 → 0,7 → 0,95 → 1,15); věta „Pumpička tlačí…“ a štítek „látka“ jen 0,5–4,6 s; 4,6–9,7 s štítek a věta „těleso“. Klid: nafouknutý balónek, štítek „těleso“. -->
	<style>
		.p1pi { transform: translateX(0px); animation: p1pi 10s ease-in-out infinite; }
		@keyframes p1pi { 0% { transform: translateX(0px); } 5% { transform: translateX(0px); } 11% { transform: translateX(60px); } 16% { transform: translateX(0px); } 20% { transform: translateX(0px); } 26% { transform: translateX(60px); } 31% { transform: translateX(0px); } 35% { transform: translateX(0px); } 41% { transform: translateX(60px); } 46% { transform: translateX(0px); } 100% { transform: translateX(0px); } }
		.p1ba { transform: scale(1.15); animation: p1ba 10s ease-in-out infinite; }
		@keyframes p1ba { 0%, 5% { transform: scale(0.35); } 5% { transform: scale(0.35); } 11%, 20% { transform: scale(0.7); } 20% { transform: scale(0.7); } 26%, 35% { transform: scale(0.95); } 35% { transform: scale(0.95); } 41%, 96.9% { transform: scale(1.15); } 97%, 100% { transform: scale(0.35); } }
		.p1sp { opacity: 0; animation: p1sp 10s step-end infinite; }
		@keyframes p1sp { 0% { opacity: 1; } 5.5% { opacity: 0; } 97% { opacity: 1; } 100% { opacity: 0; } }
		.p1bo { opacity: 1; animation: p1bo 10s step-end infinite; }
		@keyframes p1bo { 0% { opacity: 0; } 5.5% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; } }
		.p1sl { opacity: 0; animation: p1sl 10s step-end infinite; }
		@keyframes p1sl { 0% { opacity: 0; } 5% { opacity: 1; } 46% { opacity: 0; } 100% { opacity: 0; } }
		.p1st { opacity: 1; animation: p1st 10s step-end infinite; }
		@keyframes p1st { 0% { opacity: 0; } 46% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; } }
		.p1c0 { opacity: 0; animation: p1c0 10s step-end infinite; }
		@keyframes p1c0 { 0% { opacity: 1; } 5% { opacity: 0; } 97% { opacity: 1; } 100% { opacity: 0; } }
		.p1c1 { opacity: 0; animation: p1c1 10s step-end infinite; }
		@keyframes p1c1 { 0% { opacity: 0; } 5% { opacity: 1; } 46% { opacity: 0; } 100% { opacity: 0; } }
		.p1c2 { opacity: 1; animation: p1c2 10s step-end infinite; }
		@keyframes p1c2 { 0% { opacity: 0; } 46% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; } }
		.p1sc { opacity: 1; animation: p1sc 10s linear infinite; }
		@keyframes p1sc { 0%, 95.5% { opacity: 1; } 96.5%, 98% { opacity: 0; } 99%, 100% { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) {
			.p1pi, .p1ba, .p1sp, .p1bo, .p1sl, .p1st, .p1c0, .p1c1, .p1c2, .p1sc { animation: none; }
		}
	</style>
	<defs>
		<clipPath id="r1"><rect x="22" y="0" width="416" height="600" /></clipPath>
		<linearGradient id="dr1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2ad72"/><stop offset="1" stop-color="#9c6431"/></linearGradient>
		<linearGradient id="kov1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ecef"/><stop offset="0.5" stop-color="#adb5bd"/><stop offset="1" stop-color="#495057"/></linearGradient>
		<radialGradient id="bal1" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffc078"/><stop offset="0.5" stop-color="#f76707"/><stop offset="1" stop-color="#c2410c"/></radialGradient>
	</defs>
	<rect x="0" y="0" width="460" height="470" fill="#f8f9fa" />
	<g id="panel-1">
		<rect x="26" y="22" width="420" height="436" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="436" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">1</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Vzduch v balónku</text>
		<g class="p1sc">
		<text x="40" y="96" font-size="20" fill="#2b2a26">Pumpičkou nafukujeme balónek.</text>
		<g transform="translate(0 -140)">
		<!-- zem a stůl -->
		<rect x="22" y="452" width="416" height="3" fill="#adb5bd" />
		<rect x="214" y="414" width="12" height="38" fill="url(#dr1)" stroke="#6b3f17" stroke-width="2" />
		<rect x="22" y="400" width="216" height="14" fill="url(#dr1)" stroke="#6b3f17" stroke-width="2" />
		<!-- balónek na hubičce (kresba z obr-04, otočená, roste od hrdla) -->
		<g transform="translate(258 385)">
			<!-- splasklý balónek: prázdná svraštělá gumička visí z hubičky -->
			<g class="p1sp" opacity="0">
				<path d="M0 -4L8 -4C16 -4 20 2 22 12C25 26 26 40 18 50C12 56 4 52 3 44C2 34 8 24 8 14C8 8 6 4 0 4Z" fill="#e8590c" stroke="#a63a07" stroke-width="2" stroke-linejoin="round" />
				<path d="M13 10Q17 18 14 27M19 24Q22 33 17 42M8 32Q10 40 7 47" fill="none" stroke="#a63a07" stroke-width="1.6" stroke-linecap="round" />
			</g>
			<g class="p1bo">
			<g class="p1ba">
				<g transform="rotate(90) translate(0 -50)">
					<ellipse cx="0" cy="-4" rx="40" ry="48" fill="url(#bal1)" stroke="#a63a07" stroke-width="2" />
					<path d="M-6 50L6 50L0 42Z" fill="#c2410c" />
					<ellipse cx="-16" cy="-26" rx="8" ry="14" fill="#fff" opacity="0.55" transform="rotate(25 -16 -26)" />
				</g>
			</g>
			</g>
			<rect x="-6" y="-6" width="12" height="12" rx="2" fill="#c2410c" stroke="#a63a07" stroke-width="1.5" />
		</g>
		<g clip-path="url(#r1)">
			<!-- píst s rukou (paže vychází z levého okraje panelu) -->
			<g class="p1pi">
				<rect x="50" y="382" width="90" height="6" fill="#495057" />
				<rect x="-120" y="364" width="160" height="26" rx="6" fill="#1971c2" stroke="#0b4f8a" stroke-width="2" />
				<rect x="50" y="364" width="10" height="34" rx="3" fill="#343a40" />
				<rect x="34" y="358" width="30" height="34" rx="11" fill="#f1c9a5" stroke="#8a5a2b" stroke-width="2" />
				<path d="M40 366H58M40 374H58M40 382H58" stroke="#8a5a2b" stroke-width="1.5" />
			</g>
			<!-- válec pumpičky a hubička -->
			<rect x="120" y="370" width="116" height="30" rx="5" fill="#74c0fc" stroke="#1864ab" stroke-width="2.5" />
			<rect x="116" y="366" width="8" height="38" rx="2" fill="#1864ab" />
			<rect x="236" y="381" width="22" height="8" fill="#1864ab" />
		</g>
		<!-- štítky -->
		<g class="p1sl" opacity="0">
			<line x1="200" y1="300" x2="246" y2="380" stroke="#2b2a26" stroke-width="2" /><circle cx="246" cy="380" r="4" fill="#2b2a26" />
			<rect x="110" y="266" width="150" height="34" rx="8" fill="#fff" stroke="#6c757d" stroke-width="2" /><text x="122" y="290" font-size="20" fill="#2b2a26"><tspan font-weight="bold">látka:</tspan> vzduch</text>
		</g>
		<g class="p1st">
			<line x1="240" y1="296" x2="330" y2="360" stroke="#2b2a26" stroke-width="2" /><circle cx="330" cy="360" r="4" fill="#2b2a26" />
			<rect x="40" y="262" width="252" height="34" rx="8" fill="#fff" stroke="#6c757d" stroke-width="2" /><text x="52" y="286" font-size="20" fill="#2b2a26"><tspan font-weight="bold">těleso:</tspan> vzduch v balónku</text>
		</g>
		</g>
		<g font-size="22" font-weight="bold" fill="#2b2a26">
			<g class="p1c0" opacity="0"><text x="40" y="356">Balónek je splasklý.</text></g>
			<g class="p1c1" opacity="0"><text x="40" y="356">Pumpička tlačí do balónku vzduch.</text><text x="40" y="386">Vzduch je látka.</text></g>
			<g class="p1c2"><text x="40" y="356" fill="#237032">Vzduch v balónku je těleso.</text><text x="40" y="386">Má tvar i hranice,</text><text x="40" y="416">i když ho nevidíme.</text></g>
		</g>
		</g>
	</g>
</svg>
