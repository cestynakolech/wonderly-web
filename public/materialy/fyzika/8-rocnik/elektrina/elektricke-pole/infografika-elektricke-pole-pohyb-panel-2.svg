<svg viewBox="0 0 460 556" width="460" height="556" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Elektrické pole v pohybu 2 ze 4, Plechovka za pravítkem. Záporně nabité pravítko se přiblíží k plechovce. Elektrony v plechovce se přesunou na vzdálenější stranu, bližší strana je kladná a plechovka se kutálí za pravítkem." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Elektrické pole v pohybu 2/4: Plechovka za pravítkem</title>
  <style>
    .ruler { transform: translate(0,0); animation: ruler 8s ease-in-out infinite; }
    .can { transform: translate(64px,0); animation: can 8s ease-in-out infinite; }
    .shell { transform: rotate(72deg); transform-origin: 158px 299px; transform-box: view-box; animation: shell 8s ease-in-out infinite; }
    .split { opacity: 1; animation: split 8s step-end infinite; }
    .even { opacity: 0; animation: even 8s step-end infinite; }
    .caption-a { opacity: 0; animation: caption-a 8s step-end infinite; }
    .caption-b { opacity: 1; animation: caption-b 8s step-end infinite; }
    .loop-fade { opacity: 0; animation: loop-fade 8s linear infinite; }
    @keyframes ruler { 0%,10% { transform: translate(14px,0); } 28%,40% { transform: translate(-45px,0); } 68%,100% { transform: translate(0,0); } }
    @keyframes can { 0%,34% { transform: translate(0,0); } 68%,100% { transform: translate(64px,0); } }
    @keyframes shell { 0%,34% { transform: rotate(0deg); } 68%,100% { transform: rotate(72deg); } }
    @keyframes split { 0%,24% { opacity: 0; } 31%,89% { opacity: 1; } 94%,100% { opacity: 0; } }
    @keyframes even { 0%,24% { opacity: 1; } 31%,93% { opacity: 0; } 94%,100% { opacity: 1; } }
    @keyframes caption-a { 0%,30% { opacity: 0; } 31%,45% { opacity: 1; } 46%,100% { opacity: 0; } }
    @keyframes caption-b { 0%,45% { opacity: 0; } 46%,90% { opacity: 1; } 91%,100% { opacity: 0; } }
    @keyframes loop-fade { 0%,90% { opacity: 0; } 96%,100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .ruler, .can, .shell, .split, .even, .caption-a, .caption-b, .loop-fade { animation: none; }
      .split, .caption-b { opacity: 1; }
      .even, .caption-a { opacity: 0; }
      .loop-fade { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="metal2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.48" stop-color="#dee2e6"/><stop offset="1" stop-color="#adb5bd"/></linearGradient>
    <linearGradient id="rulerFill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf2ff"/><stop offset="1" stop-color="#dbe4ff"/></linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#2b2a26"/></filter>
  </defs>
  <rect width="460" height="556" fill="#f8f9fa"/>
  <rect x="20" y="16" width="420" height="524" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" filter="url(#shadow2)"/>
  <circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2"/>
  <text x="52" y="57" text-anchor="middle" font-size="20" font-weight="bold" fill="#b8460b">2</text>
  <text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Plechovka za pravítkem</text>
  <g class="ruler"><rect x="310" y="122" width="105" height="48" rx="12" fill="url(#rulerFill2)" stroke="#2b2a26" stroke-width="2.5"/><g fill="#0b4f91" font-size="25" font-weight="bold" text-anchor="middle" aria-label="záporný náboj"><text x="330" y="154">−</text><text x="363" y="154">−</text><text x="396" y="154">−</text></g></g>
  <path d="M52 350H408" stroke="#868e96" stroke-width="3" stroke-linecap="round"/>
  <g class="can">
    <g class="shell"><circle cx="158" cy="299" r="51" fill="url(#metal2)" stroke="#2b2a26" stroke-width="2.5"/><circle cx="158" cy="299" r="43" fill="none" stroke="#495057" stroke-width="2"/><path d="M158 256V342M115 299H201" stroke="#495057" stroke-width="3" stroke-linecap="round"/></g>
    <g class="even"><text x="132" y="291" font-size="26" font-weight="bold" fill="#9c1c1c">+</text><text x="166" y="291" font-size="28" font-weight="bold" fill="#0b4f91">−</text><text x="132" y="326" font-size="26" font-weight="bold" fill="#9c1c1c">+</text><text x="166" y="326" font-size="28" font-weight="bold" fill="#0b4f91">−</text></g>
    <g class="split"><text x="119" y="292" font-size="28" font-weight="bold" fill="#0b4f91">−</text><text x="119" y="326" font-size="28" font-weight="bold" fill="#0b4f91">−</text><text x="171" y="280" text-anchor="middle" font-size="27" font-weight="bold" fill="#9c1c1c">+</text><text x="183" y="320" text-anchor="middle" font-size="27" font-weight="bold" fill="#9c1c1c">+</text></g>
  </g>
  <rect x="36" y="396" width="388" height="122" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
  <g class="caption-a"><text x="52" y="426" font-size="18" font-weight="bold" fill="#2b2a26">Bližší strana plechovky se nabije</text><text x="52" y="454" font-size="18" fill="#2b2a26">opačně, a proto se plechovka</text><text x="52" y="482" font-size="18" fill="#2b2a26">kutálí k pravítku.</text></g>
  <g class="caption-b"><text x="52" y="454" font-size="20" font-weight="bold" fill="#2b2a26">Plechovka se kutálí</text><text x="52" y="483" font-size="20" fill="#2b2a26">za pravítkem.</text></g>
  <rect class="loop-fade" x="20" y="16" width="420" height="524" rx="10" fill="#fbfaf6"/>
</svg>
