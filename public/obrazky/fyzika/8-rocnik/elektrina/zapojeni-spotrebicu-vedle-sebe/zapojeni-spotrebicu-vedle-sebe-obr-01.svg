<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 664" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Schéma: dva rezistory R₁ a R₂ zapojené vedle sebe mezi stejné dva uzly, článek s kladným pólem vlevo a spínač. Tyrkysová šipka U pod článkem ukazuje napětí zdroje. Po zavření spínače má každá větev stejné napětí jako zdroj: šipky U₁ a U₂ vedou mezi oběma uzly a platí U = U₁ = U₂, napětí se mezi větve nedělí. Animace: spínač se zavře, objeví se šipky U₁ a U₂ a rovnost napětí, pak se spínač zase otevře.">
<style>
/* Předloha: PDF lekce 29, s. 2 (schéma: dva rezistory vedle sebe, dva uzly – černé tečky, článek s + vlevo dole,
   spínač vpravo dole) a s. 4 (tyrkysové šipky napětí U₁, U₂ mezi uzly, U u zdroje). Opora: výklad § 1 (uzel, větve,
   rezistory mezi stejnými dvěma uzly) a § 2 (U = U₁ = U₂, napětí se mezi větve nedělí).
   Odchylka od předlohy: šipka U nakreslena přímo pod článkem (napětí zdroje), ne přes celou spodní stranu – při
   otevřeném spínači by tam napětí U nebylo.
   8 s: 0–30 % spínač otevřený, obvod přerušený, šipky U₁ a U₂ skryté; 30–36 % spínač se zavře; 36–85 % zobrazeny
   šipky U₁, U₂ a rovnost U = U₁ = U₂; 85–91 % se spínač otevře.
   Bez animace (reduced-motion) = koncový stav: spínač zavřený, šipky U₁, U₂ a rovnost zobrazeny. */
.ps { animation: ps 8s ease-in-out infinite; }
@keyframes ps { 0%, 30% { transform: rotate(-24deg); } 36%, 85% { transform: rotate(0deg); } 91%, 100% { transform: rotate(-24deg); } }
.sz { animation: sv 8s step-end infinite; }
.so { opacity: 0; animation: tm 8s step-end infinite; }
@keyframes sv { 0% { opacity: 0; } 36% { opacity: 1; } 86% { opacity: 0; } }
@keyframes tm { 0% { opacity: 1; } 36% { opacity: 0; } 86% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ps, .sz, .so { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="658" rx="14" fill="#f8f9fa"/>
<text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Rezistory vedle sebe – napětí</text>
<path d="M100 430V130H500V430H410M330 430H208M192 430H100M100 260H500" fill="none" stroke="#212529" stroke-width="4" stroke-linecap="square"/><rect x="240" y="110" width="120" height="40" fill="#fff" stroke="#212529" stroke-width="4"/><text x="300" y="137" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">R₁</text><rect x="240" y="240" width="120" height="40" fill="#fff" stroke="#212529" stroke-width="4"/><text x="300" y="267" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">R₂</text><circle cx="100" cy="260" r="8" fill="#212529"/><circle cx="500" cy="260" r="8" fill="#212529"/><text x="86" y="268" font-size="22" fill="#212529" text-anchor="end">uzel</text><text x="514" y="268" font-size="22" fill="#212529" text-anchor="start">uzel</text><path d="M192 396V464" stroke="#212529" stroke-width="4"/><path d="M208 412V448" stroke="#212529" stroke-width="9"/><path d="M166 392H184M175 383V401" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><path d="M218 392H236" stroke="#1864ab" stroke-width="4" stroke-linecap="round"/><circle cx="336" cy="430" r="6" fill="#fff" stroke="#212529" stroke-width="3"/><circle cx="404" cy="430" r="6" fill="#fff" stroke="#212529" stroke-width="3"/><path class="ps" style="transform-origin:336px 430px" d="M342 428L406 424" stroke="#212529" stroke-width="4" stroke-linecap="round"/><text x="370" y="470" font-size="22" fill="#212529" text-anchor="middle">spínač</text><path class="sz" d="M108 172L126 162V169.5H474V162L492 172L474 182V174.5H126V182Z" fill="#0b7285"/><text class="sz" x="300" y="206" font-size="24" font-weight="bold" fill="#0b7285" text-anchor="middle">U₁</text><path class="sz" d="M108 302L126 292V299.5H474V292L492 302L474 312V304.5H126V312Z" fill="#0b7285"/><text class="sz" x="300" y="336" font-size="24" font-weight="bold" fill="#0b7285" text-anchor="middle">U₂</text><path d="M150 486L168 476V483.5H232V476L250 486L232 496V488.5H168V496Z" fill="#0b7285"/><text x="200" y="522" font-size="24" font-weight="bold" fill="#0b7285" text-anchor="middle">U</text><rect x="40" y="548" width="520" height="92" rx="12" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/><text class="sz" x="300" y="584" font-size="26" font-weight="bold" fill="#0b7285" text-anchor="middle">U = U₁ = U₂</text><text class="sz" x="300" y="620" font-size="22" fill="#212529" text-anchor="middle">Napětí se mezi větve nedělí.</text><text class="so" x="300" y="584" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Spínač otevřený –</text><text class="so" x="300" y="620" font-size="22" fill="#212529" text-anchor="middle">obvod je přerušený.</text>
</svg>
