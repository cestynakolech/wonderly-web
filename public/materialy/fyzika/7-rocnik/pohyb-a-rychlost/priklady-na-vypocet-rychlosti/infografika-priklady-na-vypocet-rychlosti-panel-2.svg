<svg viewBox="0 704 460 582" width="460" height="582" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Postup řešení příkladu: auto ujelo 200 km za 4 h, jakou mělo průměrnou rychlost? 1. Zapiš, co znáš: s = 200 km, t = 4 h, v = ?. 2. Hlídej jednotky: km a h patří k sobě, výsledek bude v km/h. 3. Vzorec a dosazení: v = s : t = 200 km : 4 h. 4. Výsledek s jednotkou: v = 50 km/h. Kroky se postupně objevují" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Příklady na výpočet rychlosti 2/6: Postup řešení příkladu</title>
	<style>
		.p2-k0 { opacity: 1; animation: p2-k0 14s linear infinite; } @keyframes p2-k0 { 0%, 8% { opacity: 0; } 10.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p2-k1 { opacity: 1; animation: p2-k1 14s linear infinite; } @keyframes p2-k1 { 0%, 22% { opacity: 0; } 24.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p2-k2 { opacity: 1; animation: p2-k2 14s linear infinite; } @keyframes p2-k2 { 0%, 36% { opacity: 0; } 38.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p2-k3 { opacity: 1; animation: p2-k3 14s linear infinite; } @keyframes p2-k3 { 0%, 50% { opacity: 0; } 52.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p2-o { opacity: 1; animation: p2-o 14s linear infinite; } @keyframes p2-o { 0%, 70% { opacity: 0; } 72.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .p2-k0, .p2-k1, .p2-k2, .p2-k3, .p2-o { animation: none; } }
	</style>
	<rect x="0" y="704" width="460" height="582" fill="#f8f9fa"/>
	<g id="panel-2"><rect x="26" y="720" width="420" height="562" rx="12" fill="#dee2e6"/><rect x="20" y="714" width="420" height="562" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="748" r="17" fill="#2b2a26"/><text x="52" y="756" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="80" y="757" font-size="25" font-weight="bold" fill="#2b2a26">Postup řešení příkladu</text><text x="34" y="796" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Auto</tspan> ujelo <tspan font-weight="bold">200 km</tspan> za <tspan font-weight="bold">4 h</tspan>.</text><text x="34" y="824" font-size="21" fill="#495057">Jakou mělo průměrnou rychlost?</text><g class="p2-k0"><rect x="30" y="842" width="400" height="84" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><circle cx="56" cy="868" r="15" fill="#1864ab"/><text x="56" y="875" font-size="19" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="82" y="875" font-size="21" font-weight="bold" fill="#2b2a26">Zapiš, co znáš</text><text x="82" y="908" font-size="21" fill="#495057" xml:space="preserve">s = 200 km,  t = 4 h,  v = ?</text></g><g class="p2-k1"><rect x="30" y="938" width="400" height="84" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><circle cx="56" cy="964" r="15" fill="#1864ab"/><text x="56" y="971" font-size="19" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="82" y="971" font-size="21" font-weight="bold" fill="#2b2a26">Hlídej jednotky</text><text x="82" y="1004" font-size="21" fill="#495057" xml:space="preserve">km a h patří k sobě → km/h</text></g><g class="p2-k2"><rect x="30" y="1034" width="400" height="84" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><circle cx="56" cy="1060" r="15" fill="#1864ab"/><text x="56" y="1067" font-size="19" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="82" y="1067" font-size="21" font-weight="bold" fill="#2b2a26">Vzorec a dosazení</text><text x="82" y="1100" font-size="21" fill="#495057" xml:space="preserve">v = s : t = 200 km : 4 h</text></g><g class="p2-k3"><rect x="30" y="1130" width="400" height="84" rx="8" fill="#e7f5ff" stroke="#1864ab" stroke-width="2"/><circle cx="56" cy="1156" r="15" fill="#1864ab"/><text x="56" y="1163" font-size="19" font-weight="bold" text-anchor="middle" fill="#fff">4</text><text x="82" y="1163" font-size="21" font-weight="bold" fill="#2b2a26">Výsledek s jednotkou</text><text x="82" y="1198" font-size="26" fill="#2b2a26">v = <tspan font-weight="bold" fill="#1864ab">50 km/h</tspan></text></g><g class="p2-o"><text x="34" y="1248" font-size="21" fill="#2b2a26">Auto jelo průměrně <tspan font-weight="bold">50 km/h</tspan>.</text></g></g>
</svg>
