<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 750" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Přehled schematických značek: vodič (rovná čára), spínač otevřený (páčka zvednutá), spínač zavřený (páčka položená), tlačítkový spínač (páčka s tlačítkem), žárovka (kroužek s křížkem), zdroj napětí (dvě svorky plus a minus), zdroj – monočlánek (dlouhá tenká a krátká tlustá deska), zdroj – plochá baterie (tři dvojice desek), zvonek (polokulička na podstavci), pojistka (obdélník s čarou), cívka (obloučky) a uzel – vodivé spojení vodičů (tečka v místě, kde se vodiče kříží).">
