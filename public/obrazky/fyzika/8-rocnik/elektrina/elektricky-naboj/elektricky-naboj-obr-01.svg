<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 785" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Atom a ionty. Neutrální atom má v jádře 7 protonů a 7 neutronů a v obalu 7 elektronů, náboje se vyrovnají. Když atom elektron ztratí, má 7 protonů a 6 elektronů a je to kladný iont, kationt. Když elektron přijme, má 7 protonů a 8 elektronů a je to záporný iont, aniont. Počet protonů se nemění. Animace: elektron odletí z obalu, jiný elektron do obalu přiletí.">
<style>
/* Animace 10 s, smyčka. Předloha: PDF lekce 18, str. 3 (atom: jádro, obal, proton, neutron, elektron), str. 6 (kladný iont 7 p, 6 e), str. 7 (záporný iont 7 p, 8 e).
   Elektron opustí obal 10–35 %, popisek kationtu 35–42 %; elektron přiletí 45–70 %, popisek aniontu 70–77 %; ionty zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy ukazují vše. */
.e1 { animation: e1 10s linear infinite; }
@keyframes e1 { 0%, 10% { transform: translate(39.1px, 31.2px); } 35%, 100% { transform: translate(0px, 0px); } }
.sip1 { animation: sip1 10s linear infinite; }
@keyframes sip1 { 0%, 10% { opacity: 0; } 14%, 100% { opacity: 1; } }
.t1 { animation: t1 10s linear infinite; }
@keyframes t1 { 0%, 35% { opacity: 0; } 42%, 100% { opacity: 1; } }
.e2 { animation: e2 10s linear infinite; }
@keyframes e2 { 0%, 45% { transform: translate(36.8px, -36.8px); } 70%, 100% { transform: translate(0px, 0px); } }
.sip2 { animation: sip2 10s linear infinite; }
@keyframes sip2 { 0%, 45% { opacity: 0; } 49%, 100% { opacity: 1; } }
.t2 { animation: t2 10s linear infinite; }
@keyframes t2 { 0%, 70% { opacity: 0; } 77%, 100% { opacity: 1; } }
.celek { animation: celek 10s linear infinite; }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .e1, .sip1, .t1, .e2, .sip2, .t2, .celek { animation: none; } }
</style>
