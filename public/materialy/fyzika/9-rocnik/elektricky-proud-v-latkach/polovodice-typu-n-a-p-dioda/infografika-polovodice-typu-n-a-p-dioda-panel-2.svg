		@keyframes p2-z { 0.00% { opacity: 0; transform: scale(0.3) } 67.00% { opacity: 0; transform: scale(0.3) } 70.00% { opacity: 1; transform: scale(1) } 76.00% { opacity: 1; transform: scale(1.1) } 80.00% { opacity: 0; transform: scale(1.2) } 100.00% { opacity: 0; transform: scale(0.3) } }
		.p2-z { animation: p2-z 5s linear infinite; transform-box: view-box; transform-origin: 310px 312px; }
