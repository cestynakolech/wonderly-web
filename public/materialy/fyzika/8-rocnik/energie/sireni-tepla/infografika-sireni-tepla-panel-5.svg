<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 490" width="460" height="490" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tmavé a světlé povrchy: záření ze Slunce dopadá na černé a bílé tričko. Černé tričko záření pohltí a teploměr na něm stoupá víc, bílé tričko záření víc odrazí a teploměr stoupne méně. Proto je v létě na slunci v černém tričku větší horko než v bílém.">
	<title>Šíření tepla 5/6: Tmavé a světlé povrchy</title>
	<!-- Panel 5/6, nová kresba (wonderly, 14. 11. 2026). Opora: výklad podtématu na webu (temata.ts) a ŠVP 8. r. Základní stav = konečný stav děje. -->
	<style>
		.vlna { stroke-dasharray: 12 8; animation: vlna 1s linear infinite; }
		@keyframes vlna { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
		.s5-t1 { transform-origin: 120px 352px; transform-box: view-box; animation: s5-t1 8s ease-in-out infinite; }
		@keyframes s5-t1 { 0%, 6% { transform: scaleY(0.2); } 60%, 90% { transform: scaleY(1); } 97%, 100% { transform: scaleY(0.2); } }
		.s5-t2 { transform-origin: 320px 352px; transform-box: view-box; animation: s5-t2 8s ease-in-out infinite; }
		@keyframes s5-t2 { 0%, 6% { transform: scaleY(0.5); } 60%, 90% { transform: scaleY(1); } 97%, 100% { transform: scaleY(0.5); } }
		@media (prefers-reduced-motion: reduce) { .vlna, .s5-t1, .s5-t2 { animation: none; } }
	</style>
	<defs><marker id="s5-sip" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f" /></marker></defs>
