<svg viewBox="0 1298 460 660" width="460" height="660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Katoda a anoda. Kádinka s roztokem soli, dvě elektrody: vlevo katoda připojená na záporný pól zdroje, vpravo anoda připojená přes svítící žárovku na kladný pól. Pět kationtů Na⁺ se pohybuje ke katodě, pět aniontů Cl⁻ k anodě. Proud v kapalině je usměrněný pohyb kationtů a aniontů. Elektrody se jmenují podle iontů, které přitahují, ne podle náboje. Kapaliny, které vedou proud, jsou elektrolyty." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
