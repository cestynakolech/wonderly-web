<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vzájemné působení dvou koulí. Modrá a šedá koule se k sobě přiblíží a narazí na sebe. V okamžiku dotyku působí modrá koule na šedou silou doprava a šedá koule působí na modrou silou doleva; obě síly jsou znázorněné oranžovými šipkami stejné délky. Potom se obě koule od sebe odrazí. Každé těleso působí na to druhé, nikdy to nejde jen jedním směrem.">
<style>
/* Předloha: PDF „Působení těles, deformace“ str. 2 (modrá a šedá koule, oranžové šipky) + infografika.
   Animace 7 s, smyčka: 0–8 % klid, 8–35 % koule se přibližují, 35–60 % dotyk a síly, 60–87 % koule se odrážejí, 87–100 % klid.
   Dotyk je kvůli čitelnosti protažený (ve skutečnosti trvá zlomek sekundy).
   Bez animace (prefers-reduced-motion) = stav dotyku: atributy ukazují koule v dotyku a obě síly. */
.mo, .se, .si { transform-box: view-box; }
.mo { animation: mo 7s linear infinite; }
.se { animation: se 7s linear infinite; }
.si { animation: si 7s linear infinite; }
@keyframes mo { 0%, 8% { transform: translateX(-150px); } 35%, 60% { transform: translateX(0); } 87%, 100% { transform: translateX(-150px); } }
@keyframes se { 0%, 8% { transform: translateX(150px); } 35%, 60% { transform: translateX(0); } 87%, 100% { transform: translateX(150px); } }
@keyframes si { 0%, 35% { opacity: 0; } 38%, 57% { opacity: 1; } 60%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mo, .se, .si { animation: none; } }
</style>
<defs>
<radialGradient id="ptd1m" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#4f7fb8"/><stop offset="1" stop-color="#0b2e59"/></radialGradient>
<radialGradient id="ptd1s" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#868e96"/></radialGradient>
<marker id="ptd1h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e8590c"/></marker>
</defs>
<rect x="3" y="3" width="594" height="444" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="38" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Vzájemné působení</text>
<text x="300" y="66" font-size="22" fill="#212529" text-anchor="middle">nikdy nejde jen jedním směrem</text>
<line x1="20" y1="282" x2="580" y2="282" stroke="#adb5bd" stroke-width="3"/>
<g class="mo"><ellipse cx="250" cy="282" rx="42" ry="6" fill="#dee2e6"/><circle cx="250" cy="222" r="50" fill="url(#ptd1m)" stroke="#0b2e59" stroke-width="2"/></g>
<g class="se"><ellipse cx="350" cy="282" rx="42" ry="6" fill="#dee2e6"/><circle cx="350" cy="222" r="50" fill="url(#ptd1s)" stroke="#495057" stroke-width="2"/></g>
<g class="si">
<line x1="302" y1="222" x2="392" y2="222" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
<line x1="298" y1="222" x2="208" y2="222" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
<line x1="302" y1="222" x2="388" y2="222" stroke="#e8590c" stroke-width="6" marker-end="url(#ptd1h)"/>
<line x1="298" y1="222" x2="212" y2="222" stroke="#e8590c" stroke-width="6" marker-end="url(#ptd1h)"/>
<line x1="380" y1="214" x2="420" y2="152" stroke="#495057" stroke-width="2"/>
<text x="420" y="122" font-size="22" fill="#212529" text-anchor="middle">modrá koule působí</text>
<text x="420" y="146" font-size="22" fill="#212529" text-anchor="middle">na šedou</text>
<line x1="220" y1="230" x2="180" y2="300" stroke="#495057" stroke-width="2"/>
<text x="180" y="322" font-size="22" fill="#212529" text-anchor="middle">šedá koule působí</text>
<text x="180" y="346" font-size="22" fill="#212529" text-anchor="middle">na modrou</text>
</g>
<text x="300" y="396" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Každé těleso působí na to druhé.</text>
<text x="300" y="426" font-size="22" fill="#495057" text-anchor="middle">A to druhé působí zpátky na něj.</text>
</svg>
