<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Řešený příklad: práce elektromotoru v kilowatthodinách, 9 kW · 16 h = 144 kWh">
  <rect x="3" y="3" width="894" height="554" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>

  <text x="24" y="42" font-size="24" font-weight="bold" fill="#e03131">Příklad: práce elektromotoru v kilowatthodinách</text>
  <text x="24" y="76" font-size="19" fill="#2b2a26">Elektromotor o výkonu 9 kW běží 16 hodin. Jakou práci v kWh vykoná?</text>

  <!-- kresba: motor a hodiny -->
  <g id="motor">
    <rect x="30" y="120" width="130" height="80" rx="14" fill="#a5d8ff" stroke="#1971c2" stroke-width="3"/>
    <line x1="50" y1="130" x2="50" y2="190" stroke="#1971c2" stroke-width="2"/>
    <line x1="65" y1="130" x2="65" y2="190" stroke="#1971c2" stroke-width="2"/>
    <line x1="80" y1="130" x2="80" y2="190" stroke="#1971c2" stroke-width="2"/>
    <rect x="160" y="152" width="34" height="16" fill="#868e96"/>
    <rect x="50" y="200" width="90" height="14" fill="#495057"/>
    <circle cx="128" cy="160" r="22" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
    <text x="128" y="168" text-anchor="middle" font-size="20" font-weight="bold" fill="#1971c2">M</text>
    <rect x="34" y="228" width="124" height="36" rx="8" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
    <text x="96" y="253" text-anchor="middle" font-size="20" font-weight="bold" fill="#1971c2">P = 9 kW</text>
    <circle cx="282" cy="165" r="44" fill="#ffffff" stroke="#e8590c" stroke-width="4"/>
    <line x1="282" y1="165" x2="282" y2="133" stroke="#2b2a26" stroke-width="4" stroke-linecap="round"/>
    <line x1="282" y1="165" x2="304" y2="176" stroke="#2b2a26" stroke-width="4" stroke-linecap="round"/>
    <circle cx="282" cy="165" r="4" fill="#2b2a26"/>
    <rect x="224" y="228" width="116" height="36" rx="8" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
    <text x="282" y="253" text-anchor="middle" font-size="20" font-weight="bold" fill="#e8590c">t = 16 h</text>
  </g>

  <!-- zápis -->
  <g font-size="20" fill="#2b2a26">
    <text x="380" y="146">P = 9 kW</text>
    <text x="380" y="180">t = 16 h</text>
    <text x="380" y="214">W = ? kWh</text>
  </g>
  <rect x="540" y="112" width="336" height="112" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
  <path d="M540,150 L486,138 L540,172 z" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
  <rect x="541" y="148" width="4" height="26" fill="#fff3bf"/>
  <text x="708" y="144" text-anchor="middle" font-size="18" fill="#2b2a26">Výkon necháme v kilowattech</text>
  <text x="708" y="172" text-anchor="middle" font-size="18" fill="#2b2a26">a čas v hodinách, protože</text>
  <text x="708" y="200" text-anchor="middle" font-size="18" fill="#2b2a26">práci chceme v kWh.</text>

  <!-- výpočet -->
  <line x1="24" y1="286" x2="876" y2="286" stroke="#868e96" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="24" y="302" width="852" height="170" rx="14" fill="#ffffff" stroke="#1971c2" stroke-width="2.5"/>
  <text x="44" y="344" font-size="24" font-weight="bold" fill="#e03131">W = P · t</text>
  <text x="44" y="390" font-size="24" fill="#2b2a26">W = 9 kW · 16 h</text>
  <text x="44" y="446" font-size="30" font-weight="bold" fill="#1971c2">W = 144 kWh</text>
  <rect x="420" y="330" width="436" height="112" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="638" y="366" text-anchor="middle" font-size="18" fill="#1864ab">kilowatty · hodiny = kilowatthodiny</text>
  <text x="638" y="396" text-anchor="middle" font-size="18" fill="#1864ab">9 · 16 = 144</text>
  <text x="638" y="426" text-anchor="middle" font-size="18" fill="#1864ab">(1 kWh = 3 600 000 J)</text>

  <text x="24" y="512" font-size="20" font-weight="bold" fill="#2b2a26">Odpověď: Elektromotor vykoná práci 144 kWh</text>
  <text x="24" y="540" font-size="18" fill="#2b2a26">(a spotřebuje elektrickou energii 144 kWh).</text>
</svg>
