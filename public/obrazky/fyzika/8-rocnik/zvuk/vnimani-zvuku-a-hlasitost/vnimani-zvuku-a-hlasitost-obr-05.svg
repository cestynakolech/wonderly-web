<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Jak chránit sluch. První obrázek: chlapec s protihlukovými sluchátky, zvukové vlny se o mušle sluchátek zastaví; pod ním dva pěnové špunty do uší na šňůrce. Druhý obrázek: tryskové letadlo na přehlídce a divák stojící v bezpečné vzdálenosti, vlny od letadla se šíří k divákovi. Třetí obrázek: auto s tlumičem výfuku jede po silnici, protihluková stěna zastaví vlny a dům za ní je v klidu. Plaketa dole: dále pomáhají hygienické normy, odhlučnění strojů, rozumná hlasitost hudby ve sluchátkách a ohleduplnost, například vypnout motor stojícího auta a v neděli nepracovat se sekačkou. Animace: vlny putují ke sluchátkům a ke stěně a zastaví se, od letadla se šíří kruhy.">
<title>Jak chránit sluch</title>
<style>
/* Předloha: PDF lekce 35 (Škola/8/6 Zvuk/35 …/35. Vnímání zvuku, hlasitost zvuku .pdf), s. 6 „Ochrana před
   hlukem“ (hygienické normy; protihluková sluchátka, špunty; tlumiče výfuku, protihlukové stěny, odhlučnění strojů,
   ohleduplnost – vypnout motor stojícího auta, zákaz sekaček a pil o nedělích; bezpečná vzdálenost na přehlídce
   tryskových letadel; bezpečná hlasitost hudby ve sluchátkách). Strana PDF je bez obrázku, uspořádání podle
   infografik ve složce lekce (špunty a sluchátka, stěna a stroj, člověk a letadlo).
   Animace: vlny (modré oblouky, stejný význam jako v obr. 01–02) putují ke sluchátkům a ke stěně a zaniknou,
   od letadla se šíří kruhy (2 s). Bez animace (reduced-motion) = vlny zastavené před překážkou. */
.v1 { animation: v1 2s linear infinite; }
@keyframes v1 { 0% { transform: translateX(-24px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(6px); opacity: 0; } }
.v3 { animation: v3 2s linear infinite; }
@keyframes v3 { 0% { transform: translateX(-4px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(8px); opacity: 0; } }
.kr { transform-box: fill-box; transform-origin: center; animation: kr 2s linear infinite; }
@keyframes kr { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .v1, .v3, .kr { animation: none; } }
</style>
<defs>
<clipPath id="p2"><rect x="330" y="80" width="300" height="370" rx="12"/></clipPath>
<linearGradient id="nebe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0ebff"/><stop offset="1" stop-color="#f1f8ff"/></linearGradient>
<radialGradient id="tvar" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe8d6"/><stop offset="1" stop-color="#f4b98f"/></radialGradient>
<linearGradient id="beton" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#adb5bd"/><stop offset=".5" stop-color="#dee2e6"/><stop offset="1" stop-color="#868e96"/></linearGradient>
<linearGradient id="pena" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffc078"/><stop offset="1" stop-color="#f76707"/></linearGradient>
<marker id="dv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#212529"/></marker>
<marker id="sip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#495057"/></marker>
</defs>
<rect x="3" y="3" width="954" height="604" rx="14" fill="#f8f9fa"/>
<text x="480" y="44" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Jak chránit sluch</text>

<!-- PANEL 1: ochranné pomůcky -->
<rect x="20" y="80" width="290" height="370" rx="12" fill="#fff" stroke="#ced4da" stroke-width="2"/>
<text x="165" y="112" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Ochranné pomůcky</text>
<!-- hlava chlapce -->
<path d="M124 334Q165 348 206 334L214 356H116Z" fill="#1971c2"/>
<rect x="152" y="312" width="26" height="30" fill="#f4b98f"/>
<circle cx="165" cy="262" r="62" fill="url(#tvar)" stroke="#d08a5c" stroke-width="2.5"/>
<path d="M104 250C106 206 134 196 165 196C198 196 226 210 226 250C214 228 196 222 168 226C140 222 118 232 104 250Z" fill="#6b4423"/>
<circle cx="145" cy="262" r="6" fill="#343a40"/><circle cx="185" cy="262" r="6" fill="#343a40"/>
<path d="M148 292Q165 304 182 292" fill="none" stroke="#a5502a" stroke-width="3" stroke-linecap="round"/>
<!-- protihluková sluchátka -->
<path d="M96 254C92 170 238 170 234 254" fill="none" stroke="#343a40" stroke-width="10" stroke-linecap="round"/>
<rect x="80" y="228" width="30" height="72" rx="14" fill="#495057" stroke="#212529" stroke-width="2.5"/>
<rect x="220" y="228" width="30" height="72" rx="14" fill="#495057" stroke="#212529" stroke-width="2.5"/>
<rect x="104" y="236" width="8" height="56" rx="4" fill="#868e96"/><rect x="218" y="236" width="8" height="56" rx="4" fill="#868e96"/>
<!-- vlny zleva ke sluchátku -->
<g class="v1" fill="none" stroke="#1864ab" stroke-width="4" stroke-linecap="round"><path d="M56 238Q68 264 56 290"/><path d="M70 238Q82 264 70 290"/></g>
<!-- špunty -->
<path d="M126 400C146 414 184 414 204 400" fill="none" stroke="#1971c2" stroke-width="3"/>
<g fill="url(#pena)" stroke="#c2410c" stroke-width="2.5"><rect x="96" y="380" width="34" height="26" rx="12" transform="rotate(-15 113 393)"/><rect x="200" y="380" width="34" height="26" rx="12" transform="rotate(15 217 393)"/></g>
<g font-size="20" fill="#212529" text-anchor="middle">
<text x="165" y="168" font-size="18">protihluková sluchátka</text>
<text x="165" y="440">špunty do uší</text>
</g>

<!-- PANEL 2: bezpečná vzdálenost -->
<rect x="330" y="80" width="300" height="370" rx="12" fill="url(#nebe)" stroke="#ced4da" stroke-width="2"/>
<g clip-path="url(#p2)">
<path d="M330 396H630V450H330Z" fill="#b2f2bb"/>
<path d="M330 396H630" stroke="#2b8a3e" stroke-width="3"/>
<g fill="none" stroke="#1864ab" stroke-width="4">
<circle class="kr" cx="410" cy="190" r="70" stroke-opacity=".9"/>
<circle class="kr" cx="410" cy="190" r="125" stroke-opacity=".65"/>
<circle class="kr" cx="410" cy="190" r="180" stroke-opacity=".4"/>
</g>
</g>
<text x="480" y="112" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Bezpečná vzdálenost</text>
<!-- tryskové letadlo -->
<g stroke="#343a40" stroke-width="2.5" stroke-linejoin="round">
<path d="M352 196L370 192L380 160L392 160L394 190L446 186Q470 188 474 192Q470 196 446 198L394 196L392 222L380 222L370 200L352 198Z" fill="#adb5bd"/>
<path d="M404 186L430 160L442 160L428 187Z" fill="#868e96"/>
<path d="M404 197L430 222L442 222L428 196Z" fill="#868e96"/>
<path d="M448 188Q458 186 462 191Q456 193 448 193Z" fill="#74c0fc"/>
</g>
<path d="M352 192L336 194L336 198L352 200Z" fill="#ff922b"/>
<!-- divák -->
<g transform="translate(588 396)">
<circle cx="0" cy="-104" r="14" fill="#f4b98f" stroke="#d08a5c" stroke-width="2"/>
<path d="M-14 -90H14L18 -44H-18Z" fill="#e8590c"/>
<path d="M-12 -44L-12 0M12 -44L12 0" stroke="#1864ab" stroke-width="10" stroke-linecap="round"/>
<path d="M-16 -86L-24 -54M16 -86L24 -54" stroke="#f4b98f" stroke-width="8" stroke-linecap="round"/>
</g>
<path d="M352 418H576" stroke="#212529" stroke-width="2.5" marker-start="url(#dv)" marker-end="url(#dv)"/>
<text x="464" y="442" font-size="18" fill="#212529" text-anchor="middle">daleko od zdroje hluku</text>

<!-- PANEL 3: omezení hluku -->
<rect x="650" y="80" width="290" height="370" rx="12" fill="#fff" stroke="#ced4da" stroke-width="2"/>
<text x="795" y="112" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Omezení hluku</text>
<path d="M650 366H940V420H650Z" fill="#868e96"/>
<path d="M660 393H700M720 393H760M780 393H812" stroke="#fff" stroke-width="3"/>
<!-- auto -->
<g stroke="#212529" stroke-width="2.5" stroke-linejoin="round">
<path d="M668 356V330Q670 320 682 318L700 300H744L764 318Q778 320 780 332V356Z" fill="#e03131"/>
<path d="M704 306H722V318H690Z" fill="#a5d8ff"/><path d="M728 306H742L756 318H728Z" fill="#a5d8ff"/>
<circle cx="692" cy="358" r="11" fill="#343a40"/><circle cx="758" cy="358" r="11" fill="#343a40"/>
<ellipse cx="676" cy="362" rx="12" ry="6" fill="#adb5bd"/>
</g>
<!-- vlny od auta ke stěně -->
<g class="v3" fill="none" stroke="#1864ab" stroke-width="4" stroke-linecap="round"><path d="M790 300Q802 326 790 352"/><path d="M804 300Q816 326 804 352"/></g>
<!-- protihluková stěna -->
<rect x="820" y="230" width="20" height="136" fill="url(#beton)" stroke="#495057" stroke-width="2.5"/>
<path d="M820 264H840M820 298H840M820 332H840" stroke="#495057" stroke-width="2"/>
<!-- dům za stěnou -->
<path d="M866 366V306H930V366Z" fill="#fff3bf" stroke="#495057" stroke-width="2.5"/>
<path d="M858 308L898 274L938 308Z" fill="#c92a2a" stroke="#495057" stroke-width="2.5"/>
<rect x="878" y="322" width="18" height="18" fill="#a5d8ff" stroke="#495057" stroke-width="2"/>
<g font-size="18" fill="#212529" text-anchor="middle">
<text x="830" y="160">protihluková</text>
<text x="830" y="182">stěna</text>
<text x="728" y="442">tlumič výfuku</text>
</g>
<g stroke="#495057" stroke-width="2" fill="none" marker-end="url(#sip)"><path d="M830 190L830 224"/><path d="M688 424L678 372"/></g>

<!-- plaketa: další opatření -->
<rect x="20" y="470" width="920" height="122" rx="12" fill="#fff" stroke="#1864ab" stroke-width="2.5"/>
<g font-size="20" fill="#212529" text-anchor="middle">
<text x="480" y="502"><tspan font-weight="bold">Dále pomáhá:</tspan> hygienické normy, odhlučnění strojů,</text>
<text x="480" y="532">rozumná hlasitost hudby ve sluchátkách a ohleduplnost —</text>
<text x="480" y="562">vypnout motor stojícího auta, v neděli nepracovat se sekačkou.</text>
</g>
</svg>
