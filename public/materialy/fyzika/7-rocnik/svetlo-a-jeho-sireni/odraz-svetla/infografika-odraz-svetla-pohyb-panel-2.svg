		</g>

		<g class="klidova-konstrukce">
			<path d="M45 292.97H168.99" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" />
			<path d="M86.99 292.97H106.99" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#sipka)" />
