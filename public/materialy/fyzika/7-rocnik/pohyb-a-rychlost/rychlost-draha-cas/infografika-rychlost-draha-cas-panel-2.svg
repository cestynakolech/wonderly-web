<svg viewBox="0 574 460 576" width="460" height="576" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vzorec pro rychlost: rychlost je dráha děleno časem, v = s : t. Rychlost v v m/s nebo km/h, dráha s v m nebo km, čas t v s nebo h. Jednotky, které patří k sobě: metry a sekundy dají m/s, kilometry a hodiny dají km/h. Příklad: 30 m za 3 s, v = 30 : 3 = 10 m/s. Také s = v · t a t = s : v" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Rychlost, dráha, čas 2/6: Vzorec pro rychlost</title>
