<text x="476" y="230" font-size="20" fill="#2b2a26" text-anchor="start">Počítáme logicky:</text>
<text x="476" y="262" font-size="20" fill="#2b2a26" text-anchor="start">2 m/s = 2 metry za 1 sekundu</text>
<text x="476" y="294" font-size="20" fill="#2b2a26" text-anchor="start">minuta má 60 sekund</text>
<text x="476" y="326" font-size="20" fill="#2b2a26" text-anchor="start">za minutu: 60 · 2 m = 120 m</text>
<rect x="476" y="344" width="400" height="56" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="676" y="381" font-size="24" font-weight="bold" fill="#2b2a26" text-anchor="middle">2 m/s = 120 m/min</text>
<rect x="24" y="420" width="852" height="50" rx="12" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text x="450" y="452" font-size="19" font-weight="bold" fill="#e03131" text-anchor="middle">Mezi m/s a km/h se mění obě jednotky, tam násobíme nebo dělíme 3,6.</text>
</svg>
