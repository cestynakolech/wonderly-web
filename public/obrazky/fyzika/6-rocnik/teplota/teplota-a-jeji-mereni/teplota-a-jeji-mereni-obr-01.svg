<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: Celsiova teplotní stupnice. Dva stejné kapalinové teploměry se stupnicí od 0 do 100 stupňů Celsia. Levý je v kádince s vodou a kousky ledu, jeho červený sloupec klesne k 0 °C: při 0 °C taje led. Pravý je v kádince s vroucí vodou na vařiči, sloupec vystoupá ke 100 °C: při 100 °C voda vře.">
<style>
/* Předloha: PDF Teplota — kresba tří teploměrů s teplotou varu vody a tání ledu. Pro šesťáky jen Celsiova stupnice:
   teploměr v kádince s ledem a teploměr v kádince s vroucí vodou. Překresleno, ne kopie.
   Cyklus 10 s: oba sloupce začínají stejně vysoko (bez čísla), 10–40 % levý klesne na 0 °C a pravý vystoupá na 100 °C,
   45 % se objeví popisky „0 °C led taje“ a „100 °C voda vře“. Bubliny ve vroucí vodě stoupají. Bez animace = koncový stav. */
@keyframes sl0 { 0%, 10% { transform: translate(0, -75px); } 40%, 100% { transform: translate(0, 0); } }
@keyframes sl100 { 0%, 10% { transform: translate(0, 225px); } 40%, 100% { transform: translate(0, 0); } }
@keyframes pop { 0%, 42% { opacity: 0; } 48%, 100% { opacity: 1; } }
@keyframes bub { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(0, -95px); opacity: 0; } }
@keyframes para { 0%, 100% { transform: translate(0, 0); opacity: 0.4; } 50% { transform: translate(0, -14px); opacity: 1; } }
.sl0 { animation: sl0 10s ease-in-out infinite; } .sl100 { animation: sl100 10s ease-in-out infinite; }
.pop { animation: pop 10s linear infinite; }
.b1 { animation: bub 1.6s linear infinite; } .b2 { animation: bub 1.6s linear 0.5s infinite; } .b3 { animation: bub 1.6s linear 1s infinite; }
.para { animation: para 3s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .sl0, .sl100, .pop, .b1, .b2, .b3, .para { animation: none; } }
</style>
