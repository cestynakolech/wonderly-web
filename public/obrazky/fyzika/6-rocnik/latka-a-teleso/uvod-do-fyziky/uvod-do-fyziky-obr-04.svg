<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Astronaut v bílém skafandru se zlatým hledím stojí na šedém povrchu Měsíce, na černé obloze jsou hvězdy a modrá Země. V ruce na pravé straně obrázku drží kladivo, v ruce na levé straně ptačí pero. Animace: pustí obojí naráz, kladivo i pero padají stejně rychle a dopadnou na povrch ve stejný okamžik; pero pak zůstane ležet. Dole: Na Měsíci není vzduch – kladivo i pero dopadnou zároveň.">
<style>
/* Podle výkladu (pokus Apolla 15). Detail podle Omega/skripty/animace_podkastu.py (astronaut, kladivo, pero).
   Smyčka 4 s: 0–20 % drží v rukou, 20–55 % (1,4 s) volný pád 124 px – rovnoměrně zrychlený
   (cubic-bezier(0.33,0,0.67,0.33) = y ~ t²), 55–100 % leží. Kladivo i pero mají STEJNÉ keyframes.
   Bez animace (reduced-motion) = koncový stav: obojí leží na povrchu. */
@keyframes pad { 0%, 20% { transform: translateY(-124px); animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0.33); } 55%, 100% { transform: translateY(0); } }
.pada { animation: pad 4s infinite; }
/* Pero po dopadu (55 %) se překlopí a leží na povrchu (střed 308,450; po otočení o 90° je 33 px níž). */
@keyframes pero { 0%, 20% { transform: translateY(-124px) rotate(0deg); animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0.33); } 55% { transform: translateY(0) rotate(0deg); animation-timing-function: ease-out; } 63%, 100% { transform: translateY(33px) rotate(90deg); } }
.pero { transform-origin: 308px 450px; animation: pero 4s infinite; }
@media (prefers-reduced-motion: reduce) { .pada { animation: none; } .pero { animation: none; transform: translateY(33px) rotate(90deg); } }
</style>
