  <circle cx="205" cy="302" r="9" fill="#495057"/>
  <g class="needle"><path d="M205 302L205 350" stroke="#2b2a26" stroke-width="8" stroke-linecap="round"/><g class="polarized"><circle cx="205" cy="335" r="10" fill="#1864ab" stroke="#2b2a26" stroke-width="1.5"/><path d="M200 335H210" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><g class="positive"><g class="needle-positive"><circle cx="205" cy="335" r="10" fill="#9c1c1c" stroke="#2b2a26" stroke-width="1.5"/><path d="M200 335H210M205 330V340" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g></g><circle cx="205" cy="302" r="4.5" fill="#fbfaf6"/></g>
