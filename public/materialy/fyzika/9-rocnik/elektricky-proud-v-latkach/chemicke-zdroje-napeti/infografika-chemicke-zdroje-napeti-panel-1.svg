h="1.5"/><circle cx="130" cy="1020" r="3" fill="#495057"/><text x="192" y="1017" font-size="21" fill="#2b2a26">oxid manganičitý</text><line x1="186" y1="1065" x2="150" y2="1075" stroke="#495057" stroke-width="1.5"/><circle cx="150" cy="1075" r="3" fill="#495057"/><text x="192" y="1072" font-size="21" fill="#2b2a26">salmiaková pasta</text><line x1="186" y1="1110" x2="166" y2="1110" stroke="#495057" stroke-width="1.5"/><circle cx="166" cy="1110" r="3" fill="#495057"/><text x="192" y="1117" font-size="21" fill="#2b2a26">zinková nádoba</text><text x="192" y="1144" font-size="21" fill="#495057">= záporná elektroda</text><text x="192" y="989" font-size="21" fill="#495057">= kladná elektroda</text><text x="34" y="1188" font-size="21" fill="#2b2a26">Vybitý článek může vytéct</text><text x="34" y="1216" font-size="21" fill="#2b2a26">a poškodit přístroj.</text></g>
