<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3374 460 764" width="460" height="764" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Měrná tepelná kapacita c: kolik tepla musíme dodat 1 kg látky, aby se ohřála o 1 °C, jednotka J/(kg · °C); voda 4 200 J na 1 kg a 1 °C. Vysoká c, voda: ohřívá se i chladne pomalu, udrží hodně energie, nese teplo z teplárny do topení a je náplní chladičů. Nízká c, kovy: snadno se ohřejí i ochladí, kovová topná tělesa; kovová žebra chladiče odvádějí teplo z horké vody.">
	<title>Tepelná výměna a teplo 6/6: Měrná tepelná kapacita c</title>
