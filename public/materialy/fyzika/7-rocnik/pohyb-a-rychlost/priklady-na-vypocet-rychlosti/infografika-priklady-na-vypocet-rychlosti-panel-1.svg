<svg viewBox="0 120 460 580" width="460" height="580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tři tvary vzorce: co hledám, to je vlevo, vzorec zvolím podle otázky. Jak rychle? v = s : t, dráha děleno čas. Jak daleko? s = v · t, rychlost krát čas. Za jak dlouho? t = s : v, dráha děleno rychlost. Jednotky musí k sobě patřit: km/h s kilometry a hodinami, m/s s metry a sekundami" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Příklady na výpočet rychlosti 1/6: Tři tvary vzorce</title>
	<style>
		.p1-h0 { opacity: 0; animation: p1-h0 12s linear infinite; } @keyframes p1-h0 { 0%, 8% { opacity: 0; } 10%, 30% { opacity: 1; } 32%, 100% { opacity: 0; } }
		.p1-h1 { opacity: 0; animation: p1-h1 12s linear infinite; } @keyframes p1-h1 { 0%, 33% { opacity: 0; } 35%, 55% { opacity: 1; } 57%, 100% { opacity: 0; } }
		.p1-h2 { opacity: 0; animation: p1-h2 12s linear infinite; } @keyframes p1-h2 { 0%, 58% { opacity: 0; } 60%, 80% { opacity: 1; } 82%, 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .p1-h0, .p1-h1, .p1-h2 { animation: none; } }
	</style>
	<rect x="0" y="120" width="460" height="580" fill="#f8f9fa"/>
	<g id="panel-1"><rect x="26" y="136" width="420" height="560" rx="12" fill="#dee2e6"/><rect x="20" y="130" width="420" height="560" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="164" r="17" fill="#2b2a26"/><text x="52" y="172" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="80" y="173" font-size="25" font-weight="bold" fill="#2b2a26">Tři tvary vzorce</text><text x="34" y="212" font-size="21" fill="#2b2a26">Co hledám, to je vlevo.</text><text x="34" y="240" font-size="21" fill="#495057">Vzorec zvolím podle otázky.</text><rect x="30" y="258" width="400" height="104" rx="10" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><rect class="p1-h0" x="30" y="258" width="400" height="104" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/><text x="46" y="290" font-size="21" font-weight="bold" fill="#495057">Jak rychle?</text><text x="46" y="338" font-size="40" font-weight="bold" fill="#2b2a26">v = s : t</text><text x="250" y="324" font-size="19" fill="#495057">dráha</text><text x="250" y="348" font-size="19" fill="#495057">děleno čas</text><rect x="30" y="374" width="400" height="104" rx="10" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><rect class="p1-h1" x="30" y="374" width="400" height="104" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/><text x="46" y="406" font-size="21" font-weight="bold" fill="#495057">Jak daleko?</text><text x="46" y="454" font-size="40" font-weight="bold" fill="#2b2a26">s = v · t</text><text x="250" y="440" font-size="19" fill="#495057">rychlost</text><text x="250" y="464" font-size="19" fill="#495057">krát čas</text><rect x="30" y="490" width="400" height="104" rx="10" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><rect class="p1-h2" x="30" y="490" width="400" height="104" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/><text x="46" y="522" font-size="21" font-weight="bold" fill="#495057">Za jak dlouho?</text><text x="46" y="570" font-size="40" font-weight="bold" fill="#2b2a26">t = s : v</text><text x="250" y="556" font-size="19" fill="#495057">dráha děleno</text><text x="250" y="580" font-size="19" fill="#495057">rychlost</text><text x="34" y="634" font-size="21" fill="#2b2a26">Jednotky musí k sobě patřit:</text><text x="34" y="664" font-size="21" fill="#2b2a26" xml:space="preserve"><tspan font-weight="bold">km/h</tspan> ← km a h     <tspan font-weight="bold">m/s</tspan> ← m a s</text></g>
</svg>
