<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pružinové váhy. Vlevo kuchyňská váha s miskou a kulatou stupnicí od 0 do 2 000 g. Do misky dopadne balíček mouky, miska klesne, pružina uvnitř váhy se natáhne a ručička se otočí na 1 000 g: m = 1 000 g = 1 kg. Vpravo závěsná váha mincíř: ruka ji drží za oko, na háčku visí ryba a ručička ukazuje 2 kg.">
<style>
/* Vážení mouky (10 s, smyčka). Bez animace (prefers-reduced-motion) zůstává koncový stav z atributů: mouka v misce, ručička na 1 000 g, pružina natažená. */
.miska5 { animation: miska5 10s infinite; }
.mouka { animation: mouka 10s infinite; }
.rucicka { transform-box: view-box; transform-origin: 200px 410px; animation: rucicka 10s infinite; }
.pruzina { transform-box: view-box; transform-origin: 430px 236px; animation: pruzina 10s infinite; }
.tahlo { animation: tahlo 10s infinite; }
.vysl5 { animation: vysl5 10s infinite; }
@keyframes miska5 { 0%, 18% { transform: translateY(0px); } 30%, 88% { transform: translateY(10px); } 96%, 100% { transform: translateY(0px); } }
@keyframes mouka { 0%, 9% { transform: translateY(-12px); opacity: 0; } 12% { transform: translateY(-10px); opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); } 18%, 88% { transform: translateY(0px); opacity: 1; } 91%, 100% { transform: translateY(0px); opacity: 0; } }
@keyframes rucicka { 0%, 18% { transform: rotate(-180deg); } 30%, 88% { transform: rotate(0deg); } 96%, 100% { transform: rotate(-180deg); } }
@keyframes pruzina { 0%, 18% { transform: scaleY(0.7); } 30%, 88% { transform: scaleY(1); } 96%, 100% { transform: scaleY(0.7); } }
@keyframes tahlo { 0%, 18% { transform: translateY(-42px); } 30%, 88% { transform: translateY(0px); } 96%, 100% { transform: translateY(-42px); } }
@keyframes vysl5 { 0%, 30% { opacity: 0; } 33%, 88% { opacity: 1; } 90%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .miska5, .mouka, .rucicka, .pruzina, .tahlo, .vysl5 { animation: none; } }
</style>
<defs>
<linearGradient id="chrom05" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#868e96"/><stop offset="0.3" stop-color="#f8f9fa"/><stop offset="0.55" stop-color="#ced4da"/><stop offset="1" stop-color="#495057"/></linearGradient>
<linearGradient id="miskaG05" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#868e96"/></linearGradient>
<radialGradient id="cifernik05" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ecef"/></radialGradient>
<linearGradient id="zluta05" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffec99"/><stop offset="0.5" stop-color="#fcc419"/><stop offset="1" stop-color="#e8b100"/></linearGradient>
<linearGradient id="ryba05" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5c7a3a"/><stop offset="0.5" stop-color="#c0d8a8"/><stop offset="1" stop-color="#4a6630"/></linearGradient>
</defs>
<rect x="3" y="3" width="954" height="654" rx="14" fill="#f8f9fa"/>
<rect x="180" y="10" width="600" height="48" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="480" y="43" font-size="28" fill="#212529" text-anchor="middle">Pružinové váhy: těleso natahuje pružinu</text>
<line x1="560" y1="70" x2="560" y2="640" stroke="#adb5bd" stroke-width="2" stroke-dasharray="8 6"/>
<text x="270" y="86" font-size="24" font-weight="bold" fill="#1864ab" text-anchor="middle">kuchyňská váha</text>
<text x="760" y="86" font-size="24" font-weight="bold" fill="#1864ab" text-anchor="middle">závěsná váha – mincíř</text>

<!-- ===== KUCHYŇSKÁ VÁHA ===== -->
<!-- spodek a nožky -->
<path d="M90,560 L310,560 L330,592 L70,592 Z" fill="url(#chrom05)" stroke="#495057" stroke-width="2"/>
<rect x="76" y="592" width="248" height="10" rx="3" fill="#343a40"/>
<!-- miska s držákem (klesá s náloží) -->
<g class="miska5">
<rect x="186" y="234" width="28" height="44" fill="url(#chrom05)" stroke="#495057" stroke-width="2"/>
<path d="M140,262 L260,262 L250,278 L150,278 Z" fill="url(#chrom05)" stroke="#495057" stroke-width="2"/>
<g class="mouka">
<path d="M150,212 L150,126 L160,116 L240,116 L250,126 L250,212 Z" fill="#fff9db" stroke="#a47a52" stroke-width="3"/>
<path d="M150,126 L250,126" stroke="#a47a52" stroke-width="3"/>
<path d="M160,116 L168,106 L232,106 L240,116" fill="#fff3bf" stroke="#a47a52" stroke-width="3"/>
<text x="200" y="152" font-size="20" font-weight="bold" fill="#2b2a26" text-anchor="middle">MOUKA</text>
<text x="200" y="180" font-size="22" font-weight="bold" fill="#c92a2a" text-anchor="middle">1 kg</text>
</g>
<path d="M66,200 C80,244 320,244 334,200 Z" fill="url(#miskaG05)" stroke="#495057" stroke-width="3"/>
<ellipse cx="200" cy="200" rx="134" ry="14" fill="none" stroke="#495057" stroke-width="3"/>
</g>
<!-- tělo s ciferníkem -->
<path d="M84,560 L104,470 L296,470 L316,560 Z" fill="url(#chrom05)" stroke="#495057" stroke-width="2"/>
<circle cx="200" cy="410" r="146" fill="url(#chrom05)" stroke="#495057" stroke-width="3"/>
<circle cx="200" cy="410" r="128" fill="url(#cifernik05)" stroke="#343a40" stroke-width="3"/>
<!-- dílky po 50 g (40 dílků na celý kruh) -->
<circle cx="200" cy="410" r="116" fill="none" stroke="#2b2a26" stroke-width="12" stroke-dasharray="2 16.22"/>
<g stroke="#2b2a26" stroke-width="5">
<line x1="200" y1="286" x2="200" y2="310"/><line x1="324" y1="410" x2="300" y2="410"/><line x1="200" y1="534" x2="200" y2="510"/><line x1="76" y1="410" x2="100" y2="410"/>
</g>
<!-- ručička: v klidu svisle dolů = 1 000 g -->
<g class="rucicka">
<path d="M200,410 L194,416 L200,506 L206,416 Z" fill="#e03131" stroke="#a61e1e" stroke-width="1.5"/>
<path d="M200,410 L196,404 L200,380 L204,404 Z" fill="#e03131"/>
</g>
<!-- čísla nad ručičkou s bílým lemem, aby je ručička nezakryla -->
<g font-size="22" font-weight="bold" fill="#2b2a26" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
<text x="200" y="334">0</text>
<text x="270" y="418">500</text>
<text x="200" y="476">1 000</text>
<text x="130" y="418">1 500</text>
<text x="200" y="364" font-size="20" font-weight="normal">g</text>
</g>
<circle cx="200" cy="410" r="11" fill="#c92a2a" stroke="#7a1515" stroke-width="2"/>
<ellipse cx="160" cy="350" rx="40" ry="16" fill="#ffffff" opacity="0.35"/>
<!-- průhled dovnitř: pružina -->
<rect x="370" y="210" width="130" height="290" rx="14" fill="#ffffff" stroke="#495057" stroke-width="3"/>
<text x="435" y="234" font-size="20" font-weight="bold" fill="#2b2a26" text-anchor="middle">uvnitř</text>
<rect x="390" y="240" width="90" height="10" rx="3" fill="#495057"/>
<g class="pruzina">
<path d="M430,250 L430,258 L456,268 L404,282 L456,296 L404,310 L456,324 L404,338 L456,352 L404,366 L456,380 L430,388 L430,394" fill="none" stroke="#1864ab" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<g class="tahlo">
<rect x="426" y="392" width="8" height="54" fill="#495057"/>
<path d="M430,446 L410,446 L430,464 L450,446 Z" fill="#e03131"/>
</g>
<text x="435" y="486" font-size="20" fill="#2b2a26" text-anchor="middle">pružina</text>
<g class="vysl5">
<rect x="60" y="616" width="440" height="36" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
<text x="280" y="641" font-size="22" font-weight="bold" fill="#2b2a26" text-anchor="middle">ručička ukazuje: m = 1 000 g = 1 kg</text>
</g>

<!-- ===== MINCÍŘ ===== -->
<g transform="translate(-30,28)">
<!-- ruka -->
<path d="M700,108 C700,96 712,92 724,94 L800,94 C812,96 816,112 806,120 L806,150 C806,164 792,170 780,166 L716,166 C702,164 698,150 700,140 Z" fill="#f1c7a3" stroke="#b07d58" stroke-width="2.5"/>
<g stroke="#b07d58" stroke-width="2.5" fill="none"><path d="M726,128 L726,164"/><path d="M748,128 L748,166"/><path d="M770,128 L770,166"/><path d="M710,128 L796,128"/></g>
<path d="M806,110 C840,100 870,96 900,100" fill="none" stroke="#f1c7a3" stroke-width="30" stroke-linecap="round"/>
<!-- žluté oko a tělo váhy -->
<path d="M716,134 C704,170 708,198 726,206 L794,206 C812,198 816,170 804,134" fill="none" stroke="url(#zluta05)" stroke-width="22"/>
<rect x="680" y="196" width="160" height="186" rx="40" fill="url(#zluta05)" stroke="#a37b00" stroke-width="3"/>
<circle cx="760" cy="290" r="66" fill="url(#cifernik05)" stroke="#5c4a00" stroke-width="3"/>
<circle cx="760" cy="290" r="58" fill="none" stroke="#2b2a26" stroke-width="8" stroke-dasharray="1.5 5.79" stroke-dashoffset="4.394"/>
<!-- ručička na 2 kg (72° od nuly; celý kruh = 10 kg) -->
<path d="M760,287 L806,275 L761,293 Z" fill="#e03131" stroke="#a61e1e" stroke-width="1.5"/>
<g font-size="18" font-weight="bold" fill="#2b2a26" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
<text x="760" y="258">0</text>
<text x="796" y="284">2</text>
<text x="782" y="327">4</text>
<text x="738" y="327">6</text>
<text x="724" y="284">8</text>
</g>
<text x="760" y="318" font-size="18" fill="#2b2a26" text-anchor="middle">kg</text>
<circle cx="760" cy="290" r="7" fill="#2b2a26"/>
<!-- háček a ryba -->
<rect x="754" y="382" width="12" height="40" fill="url(#chrom05)" stroke="#495057" stroke-width="2"/>
<path d="M760,422 C760,452 740,456 740,440" fill="none" stroke="#495057" stroke-width="6" stroke-linecap="round"/>
<path d="M740,444 C708,470 704,540 724,584 C730,598 752,600 758,584 C778,540 772,470 740,444 Z" fill="url(#ryba05)" stroke="#33501f" stroke-width="3"/>
<path d="M740,580 L718,612 L741,603 L764,612 Z" fill="#6f8f4f" stroke="#33501f" stroke-width="3" stroke-linejoin="round"/>
<path d="M716,520 L698,536 L718,540 Z M762,520 L780,536 L760,540 Z" fill="#6f8f4f" stroke="#33501f" stroke-width="2"/>
<circle cx="730" cy="470" r="5" fill="#2b2a26"/><circle cx="752" cy="470" r="5" fill="#2b2a26"/>
<path d="M722,490 Q740,500 758,490" fill="none" stroke="#33501f" stroke-width="2"/>
<g fill="#33501f" opacity="0.5"><circle cx="734" cy="520" r="3"/><circle cx="746" cy="530" r="3"/><circle cx="734" cy="544" r="3"/><circle cx="746" cy="556" r="3"/></g>
</g>
<rect x="780" y="470" width="160" height="96" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
<g font-size="20" font-weight="bold" fill="#2b2a26" text-anchor="middle">
<text x="860" y="498">rybářská</text>
<text x="860" y="524">váha:</text>
<text x="860" y="552">ryba 2 kg</text>
</g>
</svg>
