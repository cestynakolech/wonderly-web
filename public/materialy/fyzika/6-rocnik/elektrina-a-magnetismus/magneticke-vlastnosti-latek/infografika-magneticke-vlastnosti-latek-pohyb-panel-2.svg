		<g transform="translate(320,422)"><line x1="0" y1="0" x2="0" y2="27" stroke="#495057" stroke-width="4.5" /><path d="M-2.25 27 L0 33 L2.25 27 Z" fill="#495057" /><rect x="-7" y="-5" width="14" height="5" rx="1" fill="#495057" /></g>
		<g transform="translate(331,422)"><line x1="0" y1="0" x2="0" y2="27" stroke="#495057" stroke-width="4.5" /><path d="M-2.25 27 L0 33 L2.25 27 Z" fill="#495057" /><rect x="-7" y="-5" width="14" height="5" rx="1" fill="#495057" /></g>
		<text x="320" y="505" text-anchor="middle" font-size="20" fill="#2b2a26">tvrdá ocel</text>
		<g class="a2lb">
			<text x="320" y="533" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a26">trvalý magnet</text>
			<text x="320" y="559" text-anchor="middle" font-size="20" fill="#2b2a26">hřebíky drží</text>
		</g>
		<rect x="40" y="580" width="380" height="118" rx="8" fill="#ffffff" stroke="#2b2a26" stroke-width="2" />
		<text x="56" y="608" font-size="21" font-weight="bold" fill="#2b2a26">Odmagnetování:</text>
		<text x="56" y="634" font-size="20" fill="#2b2a26">třením opačným pólem magnetu,</text>
		<text x="56" y="660" font-size="20" fill="#2b2a26">cívkou se střídavým proudem</text>
		<text x="56" y="686" font-size="20" fill="#2b2a26">nebo zahřátím.</text>
	</g>
</svg>
