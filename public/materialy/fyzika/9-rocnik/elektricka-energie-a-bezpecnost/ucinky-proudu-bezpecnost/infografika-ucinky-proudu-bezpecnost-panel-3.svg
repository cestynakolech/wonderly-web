<clipPath id="orez2"><rect x="236" y="176" width="188" height="150"/></clipPath><g clip-path="url(#orez2)"><g class="kb"><path d="M190,240 Q300,250 352,284.7" fill="none" stroke="#343a40" stroke-width="5" stroke-linecap="round"/></g><g class="kd"><path d="M190,240 Q238,240 240,285 Q242,317.5 255,317.5" fill="none" stroke="#343a40" stroke-width="5" stroke-linecap="round"/></g></g></g>
