	<text x="40" y="95" font-size="21" fill="#2b2a26">Síla <tspan font-weight="bold" fill="#b8460b">400 N</tspan>, měřítko <tspan font-weight="bold" fill="#b8460b">1 cm ~ 100 N</tspan></text><text x="40" y="125" font-size="21" fill="#2b2a26">Šipka bude dlouhá <tspan font-weight="bold" fill="#b8460b">4 cm</tspan>.</text><rect x="50" y="190" width="60" height="60" fill="#d9a066" stroke="#2b2a26" stroke-width="2.5"/><line x1="50" y1="220" x2="110" y2="220" stroke="#8d5a2b" stroke-width="2"/><g transform="translate(110,220) rotate(0)"><line x1="0" y1="0" x2="211" y2="0" stroke="#e03131" stroke-width="5" pathLength="100" stroke-dasharray="100 100" class="p4-a-l"/><polygon points="224,0 210,-7 210,7" fill="#e03131" class="p4-a-h"/><circle cx="0" cy="0" r="5" fill="#2b2a26" class="p4-a-t"/></g><g class="p4-n1"><text x="166" y="200" font-size="18" text-anchor="middle" fill="#495057">100 N</text></g><g class="p4-n2"><text x="222" y="200" font-size="18" text-anchor="middle" fill="#495057">200 N</text></g><g class="p4-n3"><text x="278" y="200" font-size="18" text-anchor="middle" fill="#495057">300 N</text></g><g class="p4-n4"><text x="334" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#b02525">400 N</text></g><rect x="98" y="262" width="248" height="34" fill="#ffe066" stroke="#2b2a26" stroke-width="2"/><line x1="110" y1="262" x2="110" y2="276" stroke="#2b2a26" stroke-width="2"/><text x="110" y="293" font-size="18" text-anchor="middle" fill="#2b2a26">0</text><line x1="138.0" y1="262" x2="138.0" y2="270" stroke="#2b2a26" stroke-width="1.5"/><line x1="166" y1="262" x2="166" y2="276" stroke="#2b2a26" stroke-width="2"/><text x="166" y="293" font-size="18" text-anchor="middle" fill="#2b2a26">1</text><line x1="194.0" y1="262" x2="194.0" y2="270" stroke="#2b2a26" stroke-width="1.5"/><line x1="222" y1="262" x2="222" y2="276" stroke="#2b2a26" stroke-width="2"/><text x="222" y="293" font-size="18" text-anchor="middle" fill="#2b2a26">2</text><line x1="250.0" y1="262" x2="250.0" y2="270" stroke="#2b2a26" stroke-width="1.5"/><line x1="278" y1="262" x2="278" y2="276" stroke="#2b2a26" stroke-width="2"/><text x="278" y="293" font-size="18" text-anchor="middle" fill="#2b2a26">3</text><line x1="306.0" y1="262" x2="306.0" y2="270" stroke="#2b2a26" stroke-width="1.5"/><line x1="334" y1="262" x2="334" y2="276" stroke="#2b2a26" stroke-width="2"/><text x="334" y="293" font-size="18" text-anchor="middle" fill="#2b2a26">4</text><text x="354" y="290" font-size="18" fill="#2b2a26">cm</text><text x="230" y="330" font-size="18" text-anchor="middle" fill="#495057">každý 1 cm šipky = 100 N</text><text x="40" y="372" font-size="21" font-weight="bold" fill="#b8460b">Víc sil v obrázku: všechny</text><text x="40" y="398" font-size="21" font-weight="bold" fill="#b8460b">ve stejném měřítku.</text><rect x="50" y="418" width="60" height="60" fill="#d9a066" stroke="#2b2a26" stroke-width="2.5"/><line x1="50" y1="448" x2="110" y2="448" stroke="#8d5a2b" stroke-width="2"/><g transform="translate(110,448) rotate(0)"><line x1="0" y1="0" x2="99" y2="0" stroke="#e03131" stroke-width="5" pathLength="100" stroke-dasharray="100 100" class="p4-b-l"/><polygon points="112,0 98,-7 98,7" fill="#e03131" class="p4-b-h"/><circle cx="0" cy="0" r="5" fill="#2b2a26" class="p4-b-t"/></g><g class="p4-bp"><text x="236" y="455" font-size="21" font-weight="bold" fill="#b02525">200 N</text><text x="304" y="455" font-size="21" fill="#2b2a26">→ 2 cm</text></g>
