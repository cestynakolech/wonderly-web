<svg viewBox="0 0 460 610" width="460" height="610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Postava stojí čelem k nám a svou levou rukou (na obrázku vpravo) se dotkne drátu, proud teče přes levou ruku a srdce do nohou a do země: to je nejnebezpečnější cesta. Pak se drát dotkne hlavy a proud teče přes mozek: i to je nebezpečná cesta" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Účinky proudu 2/3: Kudy proud prochází</title>
	<style>
		.fa { animation: fa 10s linear infinite; } .fb { animation: fb 10s linear infinite; }
		.tk { animation-name: fa, tk; animation-duration: 10s, 0.6s; animation-timing-function: linear; animation-iteration-count: infinite; }
		.fb.tk { animation-name: fb, tk; }
		.sr { transform-box: view-box; transform-origin: 246px 250px; animation: sr 10s linear infinite; }
		.mz { animation: mz 10s linear infinite; }
		@keyframes fa { 0% { opacity: 1; } 46% { opacity: 1; } 50% { opacity: 0; } 96% { opacity: 0; } 100% { opacity: 1; } }
		@keyframes fb { 0% { opacity: 0; } 50% { opacity: 0; } 54% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; } }
		@keyframes tk { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -18; } }
		@keyframes sr { 0% { transform: scale(1); } 5% { transform: scale(1.35); } 10% { transform: scale(1); } 15% { transform: scale(1.35); } 20% { transform: scale(1); } 25% { transform: scale(1.35); } 30% { transform: scale(1); } 35% { transform: scale(1.35); } 40% { transform: scale(1); } 100% { transform: scale(1); } }
		@keyframes mz { 0% { opacity: 0; } 50% { opacity: 0; } 56% { opacity: 1; } 94% { opacity: 1; } 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .fa, .fb, .tk, .sr, .mz { animation: none; } .fb, .mz, .rm { opacity: 1; } .fbr, .fat, .fbt { opacity: 0; } }
	</style>
	<rect x="0" y="0" width="460" height="610" fill="#f8f9fa"/>
