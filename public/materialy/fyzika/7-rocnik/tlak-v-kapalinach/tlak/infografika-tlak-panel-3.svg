<svg xmlns="http://www.w3.org/2000/svg" width="460" height="640" viewBox="0 0 460 640" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dvě stejně těžké děti ve sněhu tlačí na sníh stejně velkou silou. Dítě v botách se zaboří, dítě na lyžích ne. Dotyková plocha shora: boty mají malou plochu, tedy velký tlak; lyže velkou plochu, tedy malý tlak.">
