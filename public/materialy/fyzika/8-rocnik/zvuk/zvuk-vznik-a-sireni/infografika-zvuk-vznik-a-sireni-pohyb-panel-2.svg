			<circle class="tl" style="animation-delay:0.158s" cx="190" cy="368" r="6" fill="#868e96" stroke="#343a40" stroke-width="2" />
			<circle class="tl" style="animation-delay:0.174s" cx="205" cy="368" r="6" fill="#868e96" stroke="#343a40" stroke-width="2" />
			<circle class="tl" style="animation-delay:0.191s" cx="220" cy="368" r="6" fill="#868e96" stroke="#343a40" stroke-width="2" />
