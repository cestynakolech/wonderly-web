	<g class="h2s0"><circle cx="0" cy="0" r="8" fill="#1c7ed6" stroke="#ffffff" stroke-width="1.5" /></g>
	<g class="h2t1"><circle cx="0" cy="0" r="8" fill="#e03131" stroke="#ffffff" stroke-width="1.5" /></g>
