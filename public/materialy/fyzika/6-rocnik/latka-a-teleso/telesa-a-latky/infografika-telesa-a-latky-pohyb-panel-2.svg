		.p2h1 { transform: translate(230.0px, 282.7px); animation: p2h1 10s ease-in-out infinite; }
		@keyframes p2h1 { 0%, 18% { transform: translate(520.0px, 242.7px); } 22.5% { transform: translate(230.0px, 242.7px); } 24.5%, 96.9% { transform: translate(230.0px, 282.7px); } 97%, 100% { transform: translate(520.0px, 242.7px); } }
		.p2n1 { opacity: 1; animation: p2n1 10s step-end infinite; }
		@keyframes p2n1 { 0% { opacity: 0; } 30% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; } }
		.p2h2 { transform: translate(360.0px, 282.7px); animation: p2h2 10s ease-in-out infinite; }
		@keyframes p2h2 { 0%, 33% { transform: translate(520.0px, 242.7px); } 37.5% { transform: translate(360.0px, 242.7px); } 39.5%, 96.9% { transform: translate(360.0px, 282.7px); } 97%, 100% { transform: translate(520.0px, 242.7px); } }
		.p2n2 { opacity: 1; animation: p2n2 10s step-end infinite; }
		@keyframes p2n2 { 0% { opacity: 0; } 45% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; } }
		.p2sl { opacity: 1; animation: p2sl 10s step-end infinite; }
		@keyframes p2sl { 0% { opacity: 0; } 65% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; } }
		.p2c0 { opacity: 0; animation: p2c0 10s step-end infinite; }
		@keyframes p2c0 { 0% { opacity: 1; } 47% { opacity: 0; } 97% { opacity: 1; } 100% { opacity: 0; } }
		.p2c1 { opacity: 1; animation: p2c1 10s step-end infinite; }
		@keyframes p2c1 { 0% { opacity: 0; } 47% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; } }
		.p2c2 { opacity: 1; animation: p2c2 10s step-end infinite; }
		@keyframes p2c2 { 0% { opacity: 0; } 65% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; } }
		.p2sc { opacity: 1; animation: p2sc 10s linear infinite; }
		@keyframes p2sc { 0%, 95.5% { opacity: 1; } 96.5%, 98% { opacity: 0; } 99%, 100% { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) {
			.p2ru, .p2h0, .p2n0, .p2h1, .p2n1, .p2h2, .p2n2, .p2sl, .p2c0, .p2c1, .p2c2, .p2sc { animation: none; }
