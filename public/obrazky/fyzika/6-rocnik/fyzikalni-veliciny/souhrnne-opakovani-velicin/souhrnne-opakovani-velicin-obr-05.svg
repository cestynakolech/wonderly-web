<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: převod jednotek hustoty. Vlevo kg lomeno m³, vpravo g lomeno cm³. Horní oblouková šipka zleva doprava: z kg/m³ na g/cm³ dělíme 1 000. Dolní šipka zprava doleva: z g/cm³ na kg/m³ násobíme 1 000. Příklad ocel: 8 000 kg/m³ : 1 000 = 8 g/cm³ a 8 g/cm³ · 1 000 = 8 000 kg/m³. Platí 1 g/cm³ = 1 000 kg/m³. Při výpočtu dosazujeme jednotky, které spolu souvisí: kg a m³, nebo g a cm³.">
<style>
/* Předloha: PDF Souhrnné opakování fyzikálních veličin — ručně psané kg/m³ vlevo, g/cm³ vpravo, horní a dolní oblouková šipka
   s „1000“. Překresleno, ne kopie; uspořádání podle PDF, směr operací SPRÁVNĚ (v předloze jsou · a : prohozené — zapsáno
   v protokolu): kg/m³ → g/cm³ dělíme 1 000, g/cm³ → kg/m³ násobíme 1 000 (shodně s hustota-obr-04).
   Příklad 8 g/cm³ = 8 000 kg/m³ (ocel) z výkladu podtématu. Legenda: modrá = násobíme, zelená = dělíme.
   Cyklus 8 s: 0–45 % zvýrazněno dělení a jeho příklad, 50–95 % násobení. Bez animace = obojí plně viditelné. */
@keyframes nah { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0.35; } 100% { opacity: 1; } }
@keyframes dol { 0%, 45% { opacity: 0.35; } 50%, 95% { opacity: 1; } 100% { opacity: 0.35; } }
.nah { animation: nah 8s linear infinite; } .dol { animation: dol 8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .nah, .dol { animation: none; } }
</style>
<rect x="3" y="3" width="954" height="614" rx="14" fill="#f8f9fa"/>
<rect x="280" y="20" width="400" height="56" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="480" y="58" font-size="28" fill="#212529" text-anchor="middle">Převod jednotek hustoty</text>
<!-- kg/m³ vlevo -->
<g font-size="60" font-weight="bold" fill="#a85a12" text-anchor="middle">
<text x="200" y="222">kg</text>
<text x="200" y="306">m³</text>
<text x="700" y="222">g</text>
<text x="700" y="306">cm³</text>
</g>
<path d="M130 244H270" stroke="#a85a12" stroke-width="6" stroke-linecap="round"/>
<path d="M620 244H780" stroke="#a85a12" stroke-width="6" stroke-linecap="round"/>
<!-- horní šipka: kg/m³ → g/cm³ dělíme -->
<g class="nah">
<path d="M300,200 Q450,90 588,191" fill="none" stroke="#237032" stroke-width="6" stroke-linecap="round"/>
<path d="M600,200 L575.8,195.9 L588.8,178.1 Z" fill="#237032" stroke="#237032" stroke-width="3" stroke-linejoin="round"/>
<text x="450" y="124" font-size="34" font-weight="bold" fill="#237032" text-anchor="middle">: 1 000</text>
</g>
<!-- dolní šipka: g/cm³ → kg/m³ násobíme -->
<g class="dol">
<path d="M600,300 Q450,410 312,309" fill="none" stroke="#1864ab" stroke-width="6" stroke-linecap="round"/>
<path d="M300,300 L324.2,304.1 L311.2,321.9 Z" fill="#1864ab" stroke="#1864ab" stroke-width="3" stroke-linejoin="round"/>
<text x="450" y="404" font-size="34" font-weight="bold" fill="#1864ab" text-anchor="middle">· 1 000</text>
</g>
<!-- příklad: ocel -->
<rect x="40" y="432" width="880" height="164" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
<text x="66" y="474" font-size="26" font-weight="bold" fill="#212529">Ocel:</text>
<text x="160" y="474" font-size="26" font-weight="bold" fill="#237032" class="nah">8 000 kg/m³ : 1 000 = 8 g/cm³</text>
<text x="160" y="514" font-size="26" font-weight="bold" fill="#1864ab" class="dol">8 g/cm³ · 1 000 = 8 000 kg/m³</text>
<text x="66" y="566" font-size="22" fill="#212529">Do vzorce dosazuj jednotky, které spolu souvisí: kg a m³, nebo g a cm³.</text>
<rect x="612" y="452" width="288" height="52" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text x="756" y="486" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">1 g/cm³ = 1 000 kg/m³</text>
</svg>
