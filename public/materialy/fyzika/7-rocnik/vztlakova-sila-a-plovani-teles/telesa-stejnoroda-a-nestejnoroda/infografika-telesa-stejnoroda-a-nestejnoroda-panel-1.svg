<svg xmlns="http://www.w3.org/2000/svg" width="460" height="454" viewBox="0 0 460 454" role="img" aria-label="Před a po napuštění vzduchu z lahve do vesty. Větší objem vesty při téměř stejné hmotnosti celého potápěče s výstrojí snižuje průměrnou hustotu. Klesne-li pod hustotu vody, potápěč stoupá. Oranžová část je vesta, šedá lahev, černá neopren." font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Tělesa stejnorodá a nestejnorodá 1/1: Vzduch ve vestě potápěče</title>
<!-- Opora: src/data/temata.ts, podtéma telesa-stejnoroda-a-nestejnoroda, odstavec Proč potápěče nadnáší vesta. Při omezeném pohybu je vesta napuštěná a potápěč ve vyšší poloze. Zmenšení řeší viewBox (bez obalu g scale); vesta se zvětšuje kolem svého středu translate–scaleX–translate s transform-origin 0 0 (Safari/WebKit). -->

<style>
.vystup { transform: translateY(-8px); animation: vystup 8s ease-in-out infinite; }
.vesta { transform-box: view-box; transform-origin: 0 0; animation: vesta 8s linear infinite; }
.vzduch { opacity: 0; stroke-dasharray: 6 6; animation: tok 8s linear infinite; }
@keyframes vystup {
  0%, 45% { transform: translateY(8px); }
  75%, 100% { transform: translateY(-8px); }
}
@keyframes vesta {
  0%, 10% { transform: translate(338.43px, 0px) scaleX(0.642857) translate(-338.43px, 0px); }
  45%, 100% { transform: translate(338.43px, 0px) scaleX(1) translate(-338.43px, 0px); }
}
@keyframes tok {
  0%, 10% { opacity: 0; stroke-dashoffset: 0; }
  11% { opacity: 1; }
  44% { opacity: 1; }
  45%, 100% { opacity: 0; stroke-dashoffset: -96; }
}
@media (prefers-reduced-motion: reduce) {
  .vystup, .vesta, .vzduch { animation: none; }
}
</style>
