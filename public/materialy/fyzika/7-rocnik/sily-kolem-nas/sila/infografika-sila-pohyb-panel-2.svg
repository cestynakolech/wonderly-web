<svg xmlns="http://www.w3.org/2000/svg" width="460" height="520" viewBox="0 0 460 520" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pohled shora: tři stejné tyče leží na stole a na každou působí stejná síla F vodorovně vpravo, jen v jiném místě. Síla nahoře tyč otočí po směru hodin, síla uprostřed tyč posune, síla dole tyč otočí proti směru hodin. Uprostřed síla tyč posune, mimo střed ji otočí.">
	<title>Síla v pohybu 2/4: Kde síla působí?</title>
	<!-- Infografika „Síla v pohybu“, panel 2 (W70, oprava 1, 14. 10. 2026); animovaná verze obr. sila-obr-15, předloha PDF „Ipůsobení těles deformace“ str. 6
	     („Působení v těžišti vede k posunutí, zatímco působení mimo těžiště způsobí otáčení.“), výklad „posuvný (těleso se posune), nebo otáčivý účinek (těleso se otočí)“.
	     Děj navíc proti obrázku: tyče se skutečně pohnou. Stejně jako obr-15: nahoře a dole jen otočení kolem středu (45°), uprostřed jen posun (20 px).
	     Bez animace = výchozí stav se šipkami sil a popisky účinků. -->
	<style>
		.p8-f { animation: p8-f 8s linear infinite; }
		@keyframes p8-f { 0% { opacity: 0 } 6% { opacity: 0 } 12% { opacity: 1 } 24% { opacity: 1 } 30% { opacity: 0 } 100% { opacity: 0 } }
		.p8-t { transform-box: view-box; transform-origin: 95px 245px; animation: p8-t 8s linear infinite; }
		@keyframes p8-t { 0% { transform: rotate(0deg); opacity: 1 } 24% { transform: rotate(0deg); opacity: 1; animation-timing-function: ease-out } 60% { transform: rotate(45deg); opacity: 1 } 88% { transform: rotate(45deg); opacity: 1 } 92% { transform: rotate(45deg); opacity: 0 } 93% { transform: rotate(0deg); opacity: 0 } 98% { transform: rotate(0deg); opacity: 1 } 100% { transform: rotate(0deg); opacity: 1 } }
		.p8-s { animation: p8-s 8s linear infinite; }
		@keyframes p8-s { 0% { transform: translateX(0px); opacity: 1 } 24% { transform: translateX(0px); opacity: 1; animation-timing-function: ease-out } 60% { transform: translateX(20px); opacity: 1 } 88% { transform: translateX(20px); opacity: 1 } 92% { transform: translateX(20px); opacity: 0 } 93% { transform: translateX(0px); opacity: 0 } 98% { transform: translateX(0px); opacity: 1 } 100% { transform: translateX(0px); opacity: 1 } }
		.p8-d { transform-box: view-box; transform-origin: 345px 245px; animation: p8-d 8s linear infinite; }
		@keyframes p8-d { 0% { transform: rotate(0deg); opacity: 1 } 24% { transform: rotate(0deg); opacity: 1; animation-timing-function: ease-out } 60% { transform: rotate(-45deg); opacity: 1 } 88% { transform: rotate(-45deg); opacity: 1 } 92% { transform: rotate(-45deg); opacity: 0 } 93% { transform: rotate(0deg); opacity: 0 } 98% { transform: rotate(0deg); opacity: 1 } 100% { transform: rotate(0deg); opacity: 1 } }
		.p8-u { animation: p8-u 8s linear infinite; }
		@keyframes p8-u { 0% { opacity: 0 } 40% { opacity: 0 } 46% { opacity: 1 } 88% { opacity: 1 } 92% { opacity: 0 } 100% { opacity: 0 } }
		@media (prefers-reduced-motion: reduce) {
			.p8-f, .p8-t, .p8-s, .p8-d, .p8-u { animation: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="520" fill="#f8f9fa"/>
	<rect x="26" y="16" width="420" height="500" rx="12" fill="#dee2e6"/><rect x="20" y="10" width="420" height="500" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="44" r="17" fill="#2b2a26"/><text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Kde síla působí?</text>
	<rect x="30" y="72" width="400" height="426" rx="8" fill="#fff" stroke="#ced4da" stroke-width="2"/>
	<text x="230" y="98" font-size="18" text-anchor="middle" fill="#495057">Pohled shora: tyč leží na stole.</text>
	<text x="95" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">nahoře</text>
	<text x="225" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">uprostřed</text>
	<text x="345" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">dole</text>
	<!-- deska stolu -->
	<rect x="36" y="142" width="388" height="206" rx="6" fill="#f3e3c8" stroke="#c9a37a" stroke-width="2"/>
	<!-- výchozí polohy tyčí -->
	<rect x="87" y="187" width="16" height="116" rx="3" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="5 4"/>
	<rect x="217" y="187" width="16" height="116" rx="3" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="5 4"/>
	<rect x="337" y="187" width="16" height="116" rx="3" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="5 4"/>
	<!-- tyče -->
	<g class="p8-t"><rect x="87" y="187" width="16" height="116" rx="3" fill="#4dabf7" stroke="#1971c2" stroke-width="2"/><circle cx="95" cy="245" r="3.5" fill="#2b2a26"/></g>
	<g class="p8-s"><rect x="217" y="187" width="16" height="116" rx="3" fill="#4dabf7" stroke="#1971c2" stroke-width="2"/><circle cx="225" cy="245" r="3.5" fill="#2b2a26"/></g>
	<g class="p8-d"><rect x="337" y="187" width="16" height="116" rx="3" fill="#4dabf7" stroke="#1971c2" stroke-width="2"/><circle cx="345" cy="245" r="3.5" fill="#2b2a26"/></g>
	<!-- stejné síly F, jiné působiště -->
	<g class="p8-f">
		<g transform="translate(103,191) rotate(0)"><line x1="0" y1="0" x2="36" y2="0" stroke="#e03131" stroke-width="5"/><polygon points="50,0 36,-7 36,7" fill="#e03131"/><circle cx="0" cy="0" r="5" fill="#2b2a26"/></g><text x="124" y="180" font-size="21" font-weight="bold" fill="#e03131">F</text>
		<g transform="translate(233,245) rotate(0)"><line x1="0" y1="0" x2="36" y2="0" stroke="#e03131" stroke-width="5"/><polygon points="50,0 36,-7 36,7" fill="#e03131"/><circle cx="0" cy="0" r="5" fill="#2b2a26"/></g><text x="254" y="234" font-size="21" font-weight="bold" fill="#e03131">F</text>
		<g transform="translate(353,299) rotate(0)"><line x1="0" y1="0" x2="36" y2="0" stroke="#e03131" stroke-width="5"/><polygon points="50,0 36,-7 36,7" fill="#e03131"/><circle cx="0" cy="0" r="5" fill="#2b2a26"/></g><text x="374" y="288" font-size="21" font-weight="bold" fill="#e03131">F</text>
	</g>
	<g class="p8-u">
		<text x="95" y="378" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">otočí se</text>
		<text x="225" y="378" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">posune se</text>
		<text x="345" y="378" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">otočí se</text>
	</g>
	<text x="230" y="420" font-size="18" text-anchor="middle" fill="#2b2a26">Všechny šipky jsou stejně dlouhé:</text>
	<text x="230" y="444" font-size="18" text-anchor="middle" fill="#2b2a26">je to stejná síla. Uprostřed tyč posune,</text>
	<text x="230" y="468" font-size="18" text-anchor="middle" fill="#2b2a26">mimo střed ji otočí.</text>
</svg>
