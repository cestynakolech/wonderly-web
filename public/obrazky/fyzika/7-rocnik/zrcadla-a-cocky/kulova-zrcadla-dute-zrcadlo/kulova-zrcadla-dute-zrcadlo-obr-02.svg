<g class="po"><circle cx="390" cy="232" r="28" fill="url(#kzzar)"/></g>
</g>
<line x1="240" y1="222" x2="240" y2="242" stroke="#212529" stroke-width="3"/><text x="240" y="266" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">S</text><line x1="390" y1="222" x2="390" y2="242" stroke="#212529" stroke-width="3"/><text x="390" y="266" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">F</text><text x="566" y="266" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">V</text>
