<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Uprostřed zásuvka, z ní vedou kabely ke čtyřem spotřebičům. Mixér: elektrická energie se mění na mechanickou práci, nůž se točí. Varná konvice: ohřev, z hubičky stoupá pára. Žárovka: světlo, žárovka svítí. Akumulátor: nabíjení, energie se ukládá jako chemická energie, dílky ukazatele přibývají. Žluté čárky na kabelech ukazují přenos elektrické energie ze zásuvky ke spotřebičům.">
<style>
/* Předloha: PDF lekce 31, s. 2 – „Přeměny elektrické energie“: mechanická práce (mixér, vrtačka,
   výtah, elektroautomobil), teplo (vařič, topení, varná konvice), světlo (televize, žárovka),
   chemická energie (elektrolýza vody, nabíjení akumulátorů). PDF má jen výčet bez obrázku,
   předměty nakresleny podle něj. Bez animace = koncový stav (svítí, plně nabito). */
@keyframes tok { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
.tok { animation: tok 0.8s linear infinite; }
@keyframes nuz { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }
.nuz { animation: nuz 0.4s linear infinite; }
@keyframes para { 0% { transform: translateY(0); opacity: 0.9; } 100% { transform: translateY(-26px); opacity: 0; } }
.para { animation: para 2s ease-out infinite; }
@keyframes zar { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
.zar { animation: zar 1.6s ease-in-out infinite; }
@keyframes d1 { 0%, 100% { opacity: 1; } }
@keyframes d2 { 0%, 24% { opacity: 0.12; } 25%, 100% { opacity: 1; } }
@keyframes d3 { 0%, 49% { opacity: 0.12; } 50%, 100% { opacity: 1; } }
@keyframes d4 { 0%, 74% { opacity: 0.12; } 75%, 100% { opacity: 1; } }
.d2 { animation: d2 4s step-end infinite; } .d3 { animation: d3 4s step-end infinite; } .d4 { animation: d4 4s step-end infinite; }
@media (prefers-reduced-motion: reduce) { .tok, .nuz, .para, .zar, .d2, .d3, .d4 { animation: none; } }
</style>
<defs>
<linearGradient id="podstavec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#212529"/><stop offset="0.4" stop-color="#6c757d"/><stop offset="1" stop-color="#212529"/></linearGradient>
<linearGradient id="nerez" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#868e96"/><stop offset="0.3" stop-color="#f8f9fa"/><stop offset="0.65" stop-color="#ced4da"/><stop offset="1" stop-color="#6c757d"/></linearGradient>
<linearGradient id="kov" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#868e96"/><stop offset="0.45" stop-color="#f1f3f5"/><stop offset="1" stop-color="#868e96"/></linearGradient>
<linearGradient id="zasuvka" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dee2e6"/></linearGradient>
<linearGradient id="aku" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#343a40"/><stop offset="0.35" stop-color="#6c757d"/><stop offset="1" stop-color="#212529"/></linearGradient>
<radialGradient id="sklo" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe066"/></radialGradient>
<radialGradient id="zare" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffe066" stop-opacity="0"/></radialGradient>
</defs>
<rect x="3" y="3" width="914" height="694" rx="14" fill="#f8f9fa"/>
<text x="460" y="44" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Přeměny elektrické energie</text>

<!-- karty -->
<rect x="20" y="76" width="380" height="214" rx="12" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
<rect x="520" y="76" width="380" height="214" rx="12" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
<rect x="20" y="420" width="380" height="214" rx="12" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
<rect x="520" y="420" width="380" height="214" rx="12" fill="#fff" stroke="#dee2e6" stroke-width="2"/>

<text x="40" y="114" font-size="22" font-weight="bold" fill="#212529">mechanická práce</text>
<text x="40" y="150" font-size="20" fill="#212529">mixér, vrtačka,</text>
<text x="40" y="178" font-size="20" fill="#212529">výtah, elektromobil</text>
<text x="880" y="114" font-size="22" font-weight="bold" fill="#212529" text-anchor="end">ohřev</text>
<text x="880" y="144" font-size="20" fill="#212529" text-anchor="end">(vnitřní energie)</text>
<text x="880" y="180" font-size="20" fill="#212529" text-anchor="end">vařič, topení,</text>
<text x="880" y="208" font-size="20" fill="#212529" text-anchor="end">varná konvice</text>
<text x="40" y="458" font-size="22" font-weight="bold" fill="#212529">světlo</text>
<text x="40" y="494" font-size="20" fill="#212529">žárovka,</text>
<text x="40" y="522" font-size="20" fill="#212529">televize</text>
<text x="880" y="458" font-size="22" font-weight="bold" fill="#212529" text-anchor="end">chemická energie</text>
<text x="880" y="494" font-size="20" fill="#212529" text-anchor="end">nabíjení akumulátoru,</text>
<text x="880" y="522" font-size="20" fill="#212529" text-anchor="end">elektrolýza vody</text>

<!-- kabely se žlutými čárkami = přenos elektrické energie -->
