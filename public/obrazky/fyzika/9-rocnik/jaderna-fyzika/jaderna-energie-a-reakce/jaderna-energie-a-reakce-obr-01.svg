<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="První jaderná reakce, kterou pozoroval Rutherford. Částice alfa ze 2 protonů a 2 neutronů narazí do jádra dusíku se 7 protony a 7 neutrony. Vznikne jádro kyslíku s 8 protony a 9 neutrony a vyletí jeden proton. Tabulka: před reakcí nukleony 14 + 4 = 18, protony 7 + 2 = 9; po reakci nukleony 17 + 1 = 18, protony 8 + 1 = 9. Červená kulička je proton, šedá neutron.">
<style>
/* Předloha: PDF 19 Jaderná energie, s. 1 (Rutherford: dusík ostřelovaný částicemi alfa → kyslík) a s. 3 (prostá přeměna, zápis reakce).
   Výklad: § Co je jaderná reakce + § Pro zvídavé: počítáme (14 + 4 = 17 + 1, 7 + 2 = 8 + 1). Kuličky odpovídají přesným počtům.
   Smyčka 6 s: alfa letí k jádru dusíku, místo dusíku zůstane kyslík a odletí proton. Bez animace (reduced-motion) = stav po reakci. */
.a1 { animation: a1 6s linear infinite; } .a1n { animation: a1n 6s linear infinite; }
.a1o { animation: a1o 6s linear infinite; } .a1p { animation: a1p 6s ease-out infinite; }
@keyframes a1 { 0% { transform: translate(0px, 0px); opacity: 1; } 32% { transform: translate(158px, 0px); opacity: 1; } 34%, 100% { transform: translate(158px, 0px); opacity: 0; } }
@keyframes a1n { 0%, 32% { opacity: 1; } 35%, 96% { opacity: 0; } 100% { opacity: 1; } }
@keyframes a1o { 0%, 32% { opacity: 0; } 36%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
.a1pl { animation: a1pl 6s linear infinite; }
@keyframes a1pl { 0%, 58% { opacity: 0; } 63%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
@keyframes a1p { 0%, 34% { transform: translate(-240px, 0px); opacity: 0; } 36% { opacity: 1; } 60% { transform: translate(0px, 0px); } 94% { transform: translate(0px, 0px); opacity: 1; } 98%, 100% { transform: translate(0px, 0px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .a1, .a1n, .a1o, .a1p, .a1pl { animation: none; } }
</style>
<defs>
<radialGradient id="gz" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3bf"/><stop offset=".55" stop-color="#ffd43b"/><stop offset="1" stop-color="#fab005"/></radialGradient>
<marker id="sip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#495057"/></marker>
</defs>
<rect x="3" y="3" width="634" height="634" rx="14" fill="#f8f9fa"/>

<text x="320" y="42" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">První jaderná reakce (Rutherford)</text>
<g class="a1n" opacity="0"><path d="M104 205L256 205" stroke="#495057" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#sip)" /></g>
<path d="M396 205L538 205" stroke="#495057" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#sip)" />
<!-- dusík 14 nukleonů (7 p + 7 n) – před reakcí -->
<g class="a1n" opacity="0"><circle cx="358.8" cy="196.5" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M352.2 196.5H365.4M358.8 189.9V203.1" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="287" cy="185.9" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M280.4 185.9H293.6M287 179.3V192.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="331" cy="239.9" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="334.8" cy="173.3" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M328.2 173.3H341.4M334.8 166.7V179.9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="289.2" cy="217.7" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M282.6 217.7H295.8M289.2 211.1V224.3" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="349.6" cy="215.8" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="306.4" cy="178.8" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="312.9" cy="231.6" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M306.3 231.6H319.5M312.9 225V238.2" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="341.4" cy="191.4" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="297.4" cy="201" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="332.3" cy="221" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M325.7 221H338.9M332.3 214.4V227.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="321.5" cy="188" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="310.2" cy="213.9" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M303.6 213.9H316.8M310.2 207.3V220.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="327.6" cy="205" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><text x="320" y="303" font-size="20" fill="#212529" text-anchor="middle" font-weight="bold">jádro dusíku</text></g>
<!-- kyslík 17 nukleonů (8 p + 9 n) – po reakci -->
<g class="a1o"><circle cx="353.5" cy="233.3" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M346.9 233.3H360.1M353.5 226.7V239.9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="314.5" cy="162.8" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="296.3" cy="238.6" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="358.8" cy="196.5" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M352.2 196.5H365.4M358.8 189.9V203.1" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="287" cy="185.9" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M280.4 185.9H293.6M287 179.3V192.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="331" cy="239.9" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="334.8" cy="173.3" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M328.2 173.3H341.4M334.8 166.7V179.9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="289.2" cy="217.7" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M282.6 217.7H295.8M289.2 211.1V224.3" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="349.6" cy="215.8" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="306.4" cy="178.8" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="312.9" cy="231.6" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M306.3 231.6H319.5M312.9 225V238.2" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="341.4" cy="191.4" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="297.4" cy="201" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="332.3" cy="221" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M325.7 221H338.9M332.3 214.4V227.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="321.5" cy="188" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="310.2" cy="213.9" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M303.6 213.9H316.8M310.2 207.3V220.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="327.6" cy="205" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><text x="320" y="303" font-size="20" fill="#212529" text-anchor="middle" font-weight="bold">jádro kyslíku</text></g>
<!-- částice alfa (2 p + 2 n) -->
<g class="a1" opacity="0"><circle cx="58.6" cy="193.6" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M52 193.6H65.2M58.6 187V200.2" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="81.4" cy="216.4" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M74.8 216.4H88M81.4 209.8V223" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="81.4" cy="193.6" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="58.6" cy="216.4" r="12" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><text x="70" y="263" font-size="20" fill="#212529" text-anchor="middle">částice α</text></g>
<!-- vyletující proton -->
<g class="a1p"><circle cx="560" cy="205" r="12" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M553.4 205H566.6M560 198.4V211.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
<g class="a1pl"><text x="560" y="251" font-size="20" fill="#212529" text-anchor="middle">proton</text></g>
<!-- bilance -->
<rect x="30" y="345" width="280" height="150" rx="12" fill="#fff4e6" stroke="#d9480f" stroke-width="2.5"/>
<text x="170" y="378" font-size="20" fill="#212529" text-anchor="middle" font-weight="bold">PŘED reakcí</text>
<text x="170" y="410" font-size="20" fill="#212529" text-anchor="middle" >dusík + částice α</text>
<text x="170" y="442" font-size="20" fill="#212529" text-anchor="middle" >nukleony: 14 + 4 = 18</text>
<text x="170" y="474" font-size="20" fill="#212529" text-anchor="middle" >protony: 7 + 2 = 9</text>
<rect x="330" y="345" width="280" height="150" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="470" y="378" font-size="20" fill="#212529" text-anchor="middle" font-weight="bold">PO reakci</text>
<text x="470" y="410" font-size="20" fill="#212529" text-anchor="middle" >kyslík + proton</text>
<text x="470" y="442" font-size="20" fill="#212529" text-anchor="middle" >nukleony: 17 + 1 = 18</text>
<text x="470" y="474" font-size="20" fill="#212529" text-anchor="middle" >protony: 8 + 1 = 9</text>
<rect x="30" y="512" width="580" height="54" rx="12" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/><text x="320" y="546" font-size="20" fill="#212529" text-anchor="middle" >Počet nukleonů i protonů zůstal stejný.</text>
<g><circle cx="200" cy="610" r="11" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M193.95 610H206.05M200 603.95V616.05" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="218" y="616" font-size="21" fill="#212529">proton</text><circle cx="310" cy="610" r="11" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><text x="328" y="616" font-size="21" fill="#212529">neutron</text></g>
</svg>
