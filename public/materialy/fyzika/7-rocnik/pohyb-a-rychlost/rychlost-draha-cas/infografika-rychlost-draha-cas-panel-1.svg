<svg viewBox="0 120 460 450" width="460" height="450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Co je rychlost: rychlost v říká, jakou dráhu těleso urazí za jednotku času. Modré auto jede po silnici stálou rychlostí 20 m/s: v časech 0, 1, 2 a 3 s je u značek 0, 20, 40 a 60 m, za každou sekundu přibude šipka plus 20 m. Jednotky m/s, v životě km/h" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Rychlost, dráha, čas 1/6: Co je rychlost</title>
	<style>
		.p1-s1 { opacity: 1; animation: p1-s1 6s linear infinite; } @keyframes p1-s1 { 0%, 25.83% { opacity: 0; } 29.17%, 80% { opacity: 1; } 86.67%, 100% { opacity: 0; } }
		.p1-s2 { opacity: 1; animation: p1-s2 6s linear infinite; } @keyframes p1-s2 { 0%, 42.5% { opacity: 0; } 45.83%, 80% { opacity: 1; } 86.67%, 100% { opacity: 0; } }
		.p1-s3 { opacity: 1; animation: p1-s3 6s linear infinite; } @keyframes p1-s3 { 0%, 59.17% { opacity: 0; } 62.5%, 80% { opacity: 1; } 86.67%, 100% { opacity: 0; } }
		.p1-a { transform: translate(312px, 0px); animation: p1-a 6s linear infinite; } @keyframes p1-a { 0% { transform: translate(0px, 0px); opacity: 1; } 10% { transform: translate(0px, 0px); opacity: 1; } 60% { transform: translate(312px, 0px); opacity: 1; } 80% { transform: translate(312px, 0px); opacity: 1; } 86.67% { transform: translate(312px, 0px); opacity: 0; } 90% { transform: translate(0px, 0px); opacity: 0; } 96.67%, 100% { transform: translate(0px, 0px); opacity: 1; } }
		@media (prefers-reduced-motion: reduce) { .p1-s1, .p1-s2, .p1-s3, .p1-a { animation: none; } }
	</style>
