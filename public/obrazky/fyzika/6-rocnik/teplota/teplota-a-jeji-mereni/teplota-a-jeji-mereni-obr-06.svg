<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace. Vlevo digitální teploměr s elektronickým čidlem: kovový hrot je ponořený ve vlažné vodě a displej po chvíli ukáže 25 °C. Vpravo bezkontaktní teploměr míří na čelo dítěte, snímá tepelné záření a displej ukáže 37 °C.">
<style>
/* Předloha: PDF Teplota — text o digitálním teploměru s elektronickým čidlem (displej) a bezkontaktním teploměru
   (snímá tepelné záření, měří na čele). V PDF k nim fotografie není; kresba podle skutečných přístrojů.
   Čísla: 25 °C = vlažná voda z pokusu ve výkladu; 37 °C = teplota těla (běžný fakt; foto lékařského teploměru PDF s. 7, 98 °F s. 3).
   Cyklus 8 s: displeje nejdřív ukazují čárky, pak naměřenou teplotu; vlnky záření běží od čela k teploměru.
   Bez animace = koncový stav (displeje ukazují teplotu). */
@keyframes car { 0%, 35% { opacity: 1; } 38%, 100% { opacity: 0; } }
@keyframes hod { 0%, 35% { opacity: 0; } 38%, 100% { opacity: 1; } }
@keyframes vln { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(120px, 0); opacity: 0; } }
.car { animation: car 8s linear infinite; } .hod { animation: hod 8s linear infinite; }
.v1 { animation: vln 2.4s linear infinite; } .v2 { animation: vln 2.4s linear 0.8s infinite; } .v3 { animation: vln 2.4s linear 1.6s infinite; }
@media (prefers-reduced-motion: reduce) { .car, .hod, .v1, .v2, .v3 { animation: none; } }
</style>
