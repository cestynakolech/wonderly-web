<svg viewBox="0 1290 460 600" width="460" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Příklad na dráhu: Tomáš jede na kole stálou rychlostí 5 m/s. Jak daleko dojede za 6 minut? Zápis: v = 5 m/s, t = 6 min = 6 · 60 s = 360 s, s = ?. Rychlost je v m/s, proto čas převedeme na sekundy. Řešení: s = v · t = 5 m/s · 360 s = 1 800 m. Metry za sekundu krát sekundy dají metry. Cyklista jede po silnici od 0 m do 1 800 m. Tomáš ujede za 6 minut 1 800 m" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Příklady na výpočet rychlosti 3/6: Příklad na dráhu</title>
	<style>
		.p3-c { transform: translate(162px, 0px); animation: p3-c 14s linear infinite; } @keyframes p3-c { 0% { transform: translate(0px, 0px); opacity: 1; } 8% { transform: translate(0px, 0px); opacity: 1; } 38% { transform: translate(162px, 0px); opacity: 1; } 90% { transform: translate(162px, 0px); opacity: 1; } 95% { transform: translate(162px, 0px); opacity: 0; } 96% { transform: translate(0px, 0px); opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 1; } }
		.p3-r0 { opacity: 1; animation: p3-r0 14s linear infinite; } @keyframes p3-r0 { 0%, 14% { opacity: 0; } 16.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p3-r1 { opacity: 1; animation: p3-r1 14s linear infinite; } @keyframes p3-r1 { 0%, 26% { opacity: 0; } 28.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p3-r2 { opacity: 1; animation: p3-r2 14s linear infinite; } @keyframes p3-r2 { 0%, 38% { opacity: 0; } 40.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p3-b { opacity: 1; animation: p3-b 14s linear infinite; } @keyframes p3-b { 0%, 38% { opacity: 0; } 40.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p3-o { opacity: 1; animation: p3-o 14s linear infinite; } @keyframes p3-o { 0%, 50% { opacity: 0; } 52.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .p3-c, .p3-r0, .p3-r1, .p3-r2, .p3-b, .p3-o { animation: none; } }
	</style>
