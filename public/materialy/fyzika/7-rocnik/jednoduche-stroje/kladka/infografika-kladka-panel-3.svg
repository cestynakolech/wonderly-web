<svg viewBox="0 1276 460 760" width="460" height="760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Volná kladka jede nahoru spolu se závažím, závaží 2 kg s tíhou FG = 20 N visí na její ose; závaží drží dvě části lana: pravá je upevněná ke stropu, levou táhne ruka nahoru; každá část nese 10 N, 10 N + 10 N = 20 N; F = FG : 2 = 20 : 2 = 10 N, poloviční síla; ruka vytáhne 2 m lana a závaží vyjede jen o 1 m" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
