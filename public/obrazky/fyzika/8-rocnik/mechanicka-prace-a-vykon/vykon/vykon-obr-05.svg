<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 630" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Definice výkonu: P = W : t, veličiny a jednotky">
<defs>
<marker id="s-cer" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#e03131"/></marker>
<marker id="s-mod" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 z" fill="#1971c2"/></marker>
<marker id="s-ora" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#e8590c"/></marker>
<marker id="s-fia" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#7048e8"/></marker>
<marker id="s-zel" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#2f9e44"/></marker>
</defs>
<rect x="3" y="3" width="894" height="624" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="24" y="44" font-size="26" font-weight="bold" fill="#e03131" text-anchor="start">Výkon</text>
<text x="24" y="80" font-size="21" fill="#2b2a26" text-anchor="start">Výkon <tspan font-weight="bold">P</tspan> je práce <tspan font-weight="bold">W</tspan> vykonaná za čas <tspan font-weight="bold">t</tspan>.</text>
<rect x="24" y="104" width="456" height="40" rx="8" fill="#1971c2"/>
<text x="40" y="131" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start">veličina</text>
<text x="200" y="131" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start">značka</text>
<text x="300" y="131" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="start">jednotka</text>
<rect x="24" y="150" width="456" height="50" rx="8" fill="#e7f5ff" stroke="#a5d8ff" stroke-width="1.5"/>
<text x="40" y="183" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">Práce</text>
<text x="212" y="183" font-size="22" font-weight="bold" fill="#e03131" text-anchor="start">W</text>
<text x="300" y="183" font-size="22" font-weight="bold" fill="#1971c2" text-anchor="start">J <tspan font-size="18" font-weight="normal" fill="#495057">(joule)</tspan></text>
<rect x="24" y="206" width="456" height="50" rx="8" fill="#e7f5ff" stroke="#a5d8ff" stroke-width="1.5"/>
<text x="40" y="239" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">Čas</text>
<text x="212" y="239" font-size="22" font-weight="bold" fill="#e03131" text-anchor="start">t</text>
<text x="300" y="239" font-size="22" font-weight="bold" fill="#1971c2" text-anchor="start">s <tspan font-size="18" font-weight="normal" fill="#495057">(sekunda)</tspan></text>
<rect x="24" y="262" width="456" height="50" rx="8" fill="#fff3bf" stroke="#a5d8ff" stroke-width="1.5"/>
<text x="40" y="295" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">Výkon</text>
<text x="212" y="295" font-size="22" font-weight="bold" fill="#e03131" text-anchor="start">P</text>
<text x="300" y="295" font-size="22" font-weight="bold" fill="#1971c2" text-anchor="start">W <tspan font-size="18" font-weight="normal" fill="#495057">(watt)</tspan></text>
<rect x="24" y="336" width="456" height="112" rx="14" fill="#ffffff" stroke="#e03131" stroke-width="3"/>
<text x="150" y="404" font-size="40" font-weight="bold" fill="#e03131" text-anchor="start">P =</text>
<text x="262" y="382" font-size="36" font-weight="bold" fill="#e03131" text-anchor="middle">W</text>
<line x1="232" y1="394" x2="292" y2="394" stroke="#e03131" stroke-width="4"/>
<text x="262" y="432" font-size="36" font-weight="bold" fill="#e03131" text-anchor="middle">t</text>
<text x="330" y="404" font-size="26" font-weight="bold" fill="#495057" text-anchor="start">= W : t</text>
<line x1="510" y1="470" x2="880" y2="470" stroke="#868e96" stroke-width="3"/>
<rect x="565" y="400" width="70" height="70" rx="4" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="565" y="190" width="70" height="70" rx="4" fill="#ffd43b" stroke="#f08c00" stroke-width="3"/>
<path d="M588,190 L588,150 L576,150 L600,118 L624,150 L612,150 L612,190 z" fill="#e03131"/>
<text x="634" y="146" font-size="24" font-weight="bold" fill="#e03131" text-anchor="start">F</text>
<line x1="542" y1="462" x2="542" y2="268" stroke="#1971c2" stroke-width="3" marker-start="url(#s-mod)" marker-end="url(#s-mod)"/>
<text x="528" y="372" font-size="24" font-weight="bold" fill="#1971c2" text-anchor="end">s</text>
<text x="600" y="504" font-size="20" font-weight="bold" fill="#2b2a26" text-anchor="middle">rychleji</text>
<rect x="755" y="400" width="70" height="70" rx="4" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="755" y="190" width="70" height="70" rx="4" fill="#ffd43b" stroke="#f08c00" stroke-width="3"/>
<path d="M778,190 L778,150 L766,150 L790,118 L814,150 L802,150 L802,190 z" fill="#e03131"/>
<text x="824" y="146" font-size="24" font-weight="bold" fill="#e03131" text-anchor="start">F</text>
<line x1="732" y1="462" x2="732" y2="268" stroke="#1971c2" stroke-width="3" marker-start="url(#s-mod)" marker-end="url(#s-mod)"/>
<text x="718" y="372" font-size="24" font-weight="bold" fill="#1971c2" text-anchor="end">s</text>
<text x="790" y="504" font-size="20" font-weight="bold" fill="#2b2a26" text-anchor="middle">pomaleji</text>
<rect x="500" y="524" width="376" height="84" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text x="688.0" y="552" font-size="18" fill="#2b2a26" text-anchor="middle">Stejná síla F, stejná dráha s = stejná práce W.</text>
<text x="688.0" y="578" font-size="18" fill="#2b2a26" text-anchor="middle">Kdo ji vykoná rychleji, má větší výkon.</text>
<text x="24" y="500" font-size="20" fill="#2b2a26" text-anchor="start">Jednotka výkonu watt (W): 1 W = 1 J : 1 s</text>
<text x="24" y="536" font-size="20" fill="#495057" text-anchor="start">Za 1 sekundu se vykoná práce 1 joule.</text>
</svg>
