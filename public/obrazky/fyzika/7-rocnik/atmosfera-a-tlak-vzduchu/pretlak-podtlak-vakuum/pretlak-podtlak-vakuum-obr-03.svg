<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pohled dovnitř manometru: kovová trubička ohnutá do oblouku a částečně naplněná kapalinou je jedním koncem připojená k nádobě, uzavřený konec je táhlem spojený s ručičkou. Když tlak vzroste, trubička se mírně narovná a ručička se posune z 0 na 1 bar. Dole frkačka: stočená papírová trubička se po fouknutí narovná.">
<style>
/* Předloha: PDF lekce 17 str. 1–2 (manometr: kovová trubička částečně naplněná kapalinou, ohnutá do oblouku, uzavřený konec spojený s ručičkou,
   při zvětšení tlaku se mírně narovná; frkačka), str. 4 (ciferník v barech). Animace 8 s: klid 0–15 %, tlak roste 15–45 %
   (prolnutí stočené → narovnané trubičky, ručička 0 → 1 bar), drží 45–80 %, návrat 80–95 %.
   Geometrie: oblouk R=80, 300°, pevný konec u přípojky; narovnaná trubička R=84.8 (×1.06), stejná délka (283°).
   Táhlo: rameno ručičky 28 px pod úhlem 128.5°, délka táhla 70.8 / 70.8 px.
   Barvy: červená jen tlak (šipka z nádoby, foukání do frkačky), modrá jen kapalina, ručička tmavá, frkačka zelená.
   Popisek „ručička“ míří na osu ručičky — platí pro výchozí (0) i koncovou (1 bar) polohu.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy prvků ukazují výsledek děje. */
.stav0{animation:stav0 8s ease-in-out infinite}
@keyframes stav0{0%{opacity:1}15%{opacity:1}45%{opacity:0}80%{opacity:0}95%{opacity:1}100%{opacity:1}}
.stav1{animation:stav1 8s ease-in-out infinite}
@keyframes stav1{0%{opacity:0}15%{opacity:0}45%{opacity:1}80%{opacity:1}95%{opacity:0}100%{opacity:0}}
.rucicka{transform-origin:230px 270px;animation:rucicka 8s ease-in-out infinite}
@keyframes rucicka{0%{transform:rotate(-60deg)}15%{transform:rotate(-60deg)}45%{transform:rotate(0deg)}80%{transform:rotate(0deg)}95%{transform:rotate(-60deg)}100%{transform:rotate(-60deg)}}
.tlak{animation:tlak 8s ease-in-out infinite}
@keyframes tlak{0%{opacity:0}12%{opacity:0}18%{opacity:1}80%{opacity:1}88%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
