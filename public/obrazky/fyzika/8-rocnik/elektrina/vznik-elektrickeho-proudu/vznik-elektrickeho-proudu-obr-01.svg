<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 565" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kovový drát s atomy kovu, které zůstávají na místě, a s volnými elektrony. Nahoře bez baterie: každý volný elektron se pohybuje jiným směrem. Dole je drát připojený ke svorkám baterie: volné elektrony se pohybují společně ke kladné svorce +.">
<style>
/* Předloha: PDF lekce 20 Vznik elektrického proudu ve vodiči, str. 3 (kovový drát jako válec, atomy kovu stojí,
   volné elektrony − s šipkami míří od − ke +). Nahoře bez baterie: každý elektron se kmitavě pohybuje jinam
   (4 různé dráhy 2,3–3,5 s). Dole s baterií: elektrony s šipkami plynou společně ke + (100 px za 2,5 s, pás bez švu).
   Bez animace = koncový stav: nahoře elektrony s krátkými šipkami do různých stran, dole elektrony s šipkami ke +. */
.j1 { animation: j1 2.6s ease-in-out infinite; }
.j2 { animation: j2 3.1s ease-in-out infinite; }
.j3 { animation: j3 2.3s ease-in-out infinite; }
.j4 { animation: j4 3.5s ease-in-out infinite; }
.dr { animation: dr 2.5s linear infinite; }
.rm { opacity: 0; }
@keyframes j1 { 0%, 100% { transform: translate(0px, 0px); } 25% { transform: translate(16px, -10px); } 50% { transform: translate(-6px, 14px); } 75% { transform: translate(-16px, -6px); } }
@keyframes j2 { 0%, 100% { transform: translate(0px, 0px); } 25% { transform: translate(-14px, 12px); } 50% { transform: translate(12px, 8px); } 75% { transform: translate(6px, -14px); } }
@keyframes j3 { 0%, 100% { transform: translate(0px, 0px); } 25% { transform: translate(10px, 14px); } 50% { transform: translate(-15px, -4px); } 75% { transform: translate(8px, -12px); } }
@keyframes j4 { 0%, 100% { transform: translate(0px, 0px); } 25% { transform: translate(-12px, -12px); } 50% { transform: translate(14px, -2px); } 75% { transform: translate(-4px, 14px); } }
@keyframes dr { from { transform: translateX(0px); } to { transform: translateX(100px); } }
@media (prefers-reduced-motion: reduce) { .j1, .j2, .j3, .j4, .dr { animation: none; } .rm { opacity: 1; } }
</style>
