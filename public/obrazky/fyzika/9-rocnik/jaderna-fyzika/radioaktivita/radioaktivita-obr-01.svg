<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Becquerelův objev roku 1896: na fotografické desce zabalené v černém papíru leží smolinec (uranová ruda). Z horniny vychází neviditelné záření, které projde černým papírem až na desku. Po vyvolání je na desce tmavá stopa. Animace: pod horninou se na desce postupně objeví tmavá stopa.">
