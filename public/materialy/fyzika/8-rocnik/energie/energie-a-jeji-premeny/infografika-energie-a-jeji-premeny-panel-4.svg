		<polygon points="84,2202 96,2202 90,2208" /><polygon points="84,2290 96,2290 90,2296" />
		<polygon points="84,2378 96,2378 90,2384" /><polygon points="84,2466 96,2466 90,2472" />
		<polygon points="84,2554 96,2554 90,2560" />
	</g>

	<!-- 0 Slunce: jaderná energie v jádru -->
	<g stroke="#f59f00" stroke-width="3" stroke-linecap="round">
		<line x1="112" y1="1982" x2="120" y2="1982" /><line x1="105.6" y1="1997.6" x2="111.2" y2="2003.2" />
		<line x1="90" y1="2004" x2="90" y2="2012" /><line x1="74.4" y1="1997.6" x2="68.8" y2="2003.2" />
