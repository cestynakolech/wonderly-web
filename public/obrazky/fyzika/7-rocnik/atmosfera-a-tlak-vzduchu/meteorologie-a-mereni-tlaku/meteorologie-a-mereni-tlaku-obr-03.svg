<line x1="170" y1="138" x2="170" y2="126" transform="rotate(30 170 250)"/><line x1="170" y1="138" x2="170" y2="122" stroke-width="5" transform="rotate(40 170 250)"/>
<line x1="170" y1="138" x2="170" y2="126" transform="rotate(50 170 250)"/><line x1="170" y1="138" x2="170" y2="126" transform="rotate(60 170 250)"/>
</g>
<text x="64" y="132" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">déšť</text>
