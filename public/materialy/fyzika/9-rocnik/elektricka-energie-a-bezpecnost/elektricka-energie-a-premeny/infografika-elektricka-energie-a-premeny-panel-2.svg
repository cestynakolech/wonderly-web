<text class="fa" opacity="0" x="50" y="438" font-size="19" font-weight="bold" fill="#2b2a26">Vypnuto: proud neteče.</text>
<text class="fb" opacity="0" x="50" y="438" font-size="19" font-weight="bold" fill="#c92a2a">Menší proud: drát se ohřeje.</text>
<text class="fc" x="50" y="438" font-size="19" font-weight="bold" fill="#c92a2a">Větší proud: drát se rozžhaví.</text>
<text x="34" y="488" font-size="21" font-weight="bold" fill="#2b2a26">Víc hřeje drát s větším odporem.</text>
<text x="34" y="516" font-size="21" fill="#2b2a26">Čím větší proud, tím víc tepla.</text>
<text x="34" y="552" font-size="21" fill="#2b2a26">Využití: topná spirála, vařič,</text>
