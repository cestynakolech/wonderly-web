<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 494" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Když se mění jen délka, posouváme čárku (8 km/s = 8 000 m/s); jen čas: 2 m/s = 120 m/min">
<defs>
<marker id="s-mod" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#1971c2"/></marker>
