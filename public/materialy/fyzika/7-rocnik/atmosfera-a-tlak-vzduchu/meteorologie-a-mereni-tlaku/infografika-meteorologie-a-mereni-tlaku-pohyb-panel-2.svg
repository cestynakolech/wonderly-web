		.q2d1 { transform: translateY(0px); animation: q2d1 12s linear infinite; }
		@keyframes q2d1 { 0% { transform: translateY(0px); } 8.333% { transform: translateY(0px); } 16.667% { transform: translateY(118px); } 97.917% { transform: translateY(118px); } 98% { transform: translateY(0px); } 100% { transform: translateY(0px); } }
