		<rect x="20" y="16" width="420" height="628" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Kolmice u kulové plochy</text>
		<text x="40" y="99" font-size="20" fill="#2b2a26">U koule je kolmice spojnice středu</text>
		<text x="40" y="125" font-size="20" fill="#2b2a26">s bodem dopadu.</text>
		<text x="40" y="158" font-size="20" fill="#2b2a26">Úhel odrazu je roven úhlu dopadu.</text>

		<!-- Kulová plocha, odraz z vnější strany. -->
		<circle cx="230" cy="430" r="150" fill="#e9ecef" stroke="#343a40" stroke-width="5" />
		<circle cx="230" cy="430" r="7" fill="#343a40" />

