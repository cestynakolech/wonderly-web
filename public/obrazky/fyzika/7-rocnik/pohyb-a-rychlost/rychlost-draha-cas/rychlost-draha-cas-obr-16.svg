<rect x="3" y="3" width="894" height="488" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="24" y="44" font-size="26" font-weight="bold" fill="#e03131" text-anchor="start">Převody, kde se mění jen jedna jednotka</text>
