<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Hydraulický zvedák v autodílně, v řezu. Vlevo malý válec s pístem, vpravo pod autem velký válec s pístem. Válce spojuje hadice s olejem pod podlahou. Když zatlačíme na malý píst, olej přenese sílu na velký píst a ten zvedne auto. Animace: malý píst jde dolů a auto se zvedá.">
<style>
.mp { animation: mp 8s ease-in-out infinite; } @keyframes mp { 0%, 10% { transform: translateY(0); } 50%, 60% { transform: translateY(90px); } 95%, 100% { transform: translateY(0); } } .vp { animation: vp 8s ease-in-out infinite; } @keyframes vp { 0%, 10% { transform: translateY(0); } 50%, 60% { transform: translateY(-30px); } 95%, 100% { transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .mp, .vp { animation: none; } }
/* Předloha: PDF Skupenství látek, foto auta na zvedáku v autodílně u Nestlačitelnosti kapalin; text PDF: 2 spojené nádoby s pohyblivými písty spojené hadicí, naplněné olejem. Překresleno jako řez. Objem oleje: malý píst 40 px dolů 90 px, velký 70 px nahoru 30 px (poměr ploch v řezu 40×90 ≈ 70×30·1,7, kreslené přibližně). Bez animace = klidová poloha. */
</style>
