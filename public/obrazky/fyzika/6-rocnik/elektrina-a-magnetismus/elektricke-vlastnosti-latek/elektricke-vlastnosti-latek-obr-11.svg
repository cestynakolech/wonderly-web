<g class="ru"><rect x="297" y="324" width="6" height="192" rx="3" fill="#343a40"/><g class="nb"><g><circle cx="300" cy="348" r="9" fill="url(#gE)" stroke="#212529" stroke-width="1.5"/><path d="M295.3 348H304.7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><g><circle cx="300" cy="492" r="9" fill="url(#gE)" stroke="#212529" stroke-width="1.5"/><path d="M295.3 492H304.7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g></g></g>
<circle cx="300" cy="420" r="8" fill="url(#gKovV)" stroke="#343a40" stroke-width="2"/>
<g class="tyc"><path d="M96 104L250 166" stroke="#c2410c" stroke-width="26" stroke-linecap="round"/><path d="M96 104L250 166" stroke="url(#gPlast)" stroke-width="22" stroke-linecap="round"/><g><circle cx="130" cy="118" r="9" fill="url(#gE)" stroke="#212529" stroke-width="1.5"/><path d="M125.3 118H134.7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><g><circle cx="170" cy="134" r="9" fill="url(#gE)" stroke="#212529" stroke-width="1.5"/><path d="M165.3 134H174.7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><g><circle cx="210" cy="150" r="9" fill="url(#gE)" stroke="#212529" stroke-width="1.5"/><path d="M205.3 150H214.7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g></g>
<g class="ruka"><path d="M600 120L520 126C500 118 470 120 456 136L378 160C366 164 366 178 378 180L452 172C470 190 504 194 524 184L600 182Z" fill="url(#gKuze)" stroke="#c98a5e" stroke-width="2"/><path d="M462 150C480 146 494 150 500 160" stroke="#c98a5e" stroke-width="2" fill="none"/><path d="M560 112L600 112L600 196L560 196Z" fill="#adb5bd" stroke="#495057" stroke-width="2"/></g>
<text class="tyl" x="30" y="226" font-size="20" font-weight="bold" fill="#212529" text-anchor="start">plastová tyč (−)</text>
<text x="520" y="250" font-size="20" fill="#212529" text-anchor="middle" font-weight="bold">destička</text>
<path d="M488 248L378 190" stroke="#212529" stroke-width="2"/>
<text x="520" y="470" font-size="20" fill="#212529" text-anchor="middle" font-weight="bold">ručička</text>
