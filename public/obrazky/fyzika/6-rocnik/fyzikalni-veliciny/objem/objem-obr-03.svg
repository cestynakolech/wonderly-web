<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: převody jednotek objemu. Nahoře řada m³, dm³, cm³, mm³ a mezi sousedními jednotkami vždy tři obloučky. Pod ní řada hl, l, dl, cl, ml; litr je pod dm³ a mililitr pod cm³, spojuje je most. Příklad: s každým obloučkem přibude nula, 1 m³ = 1 000 dm³ = 1 000 l.">
<style>
/* Předloha: PDF Objem — ručně psané „Převody jednotek objemu“: krychle + m³ dm³ cm³ mm³ s obloučky (po třech),
   hrnec + hl l dl cl ml s obloučky, žebříček (most) mezi dm³–l a cm³–ml. Překresleno, ne kopie.
   Cyklus 10 s: rozsvítí se 3 obloučky m³→dm³ a s každým přibude jedna nula (1 → 1 000), pak most dm³ = l a „= 1 000 l“.
   Bez animace = koncový stav. */
@keyframes o1 { 0%, 10% { stroke: #ced4da; } 14%, 100% { stroke: #c92a2a; } }
@keyframes o2 { 0%, 24% { stroke: #ced4da; } 28%, 100% { stroke: #c92a2a; } }
@keyframes o3 { 0%, 38% { stroke: #ced4da; } 42%, 100% { stroke: #c92a2a; } }
@keyframes n1 { 0%, 10% { opacity: 0; } 14%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes n2 { 0%, 24% { opacity: 0; } 28%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes n3 { 0%, 38% { opacity: 0; } 42%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes most { 0%, 52% { opacity: 0.3; } 58%, 100% { opacity: 1; } }
@keyframes lit { 0%, 60% { opacity: 0; } 66%, 94% { opacity: 1; } 100% { opacity: 0; } }
.o1 { animation: o1 10s linear infinite; } .o2 { animation: o2 10s linear infinite; } .o3 { animation: o3 10s linear infinite; }
.n1 { animation: n1 10s linear infinite; } .n2 { animation: n2 10s linear infinite; } .n3 { animation: n3 10s linear infinite; }
.most { animation: most 10s linear infinite; } .lit { animation: lit 10s linear infinite; }
@media (prefers-reduced-motion: reduce) { .o1, .o2, .o3, .n1, .n2, .n3, .most, .lit { animation: none; } }
</style>
<rect x="3" y="3" width="954" height="634" rx="14" fill="#f8f9fa"/>
<rect x="290" y="20" width="380" height="58" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
