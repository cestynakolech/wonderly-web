<svg viewBox="0 682 460 612" width="460" height="612" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Proč roztok soli vede proud. Pod lupou: krystal kuchyňské soli ve vodě, mřížka z 6 kladných iontů sodíku a 6 záporných iontů chloru. Voda mřížku naruší a ionty se rozptýlí po vodě. NaCl → Na⁺ + Cl⁻. Kationty Na⁺ jsou kladné ionty, anionty Cl⁻ záporné ionty. Uvolněné ionty se mohou volně pohybovat. Z 6 částic NaCl je 12 iontů." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
