		<rect x="234" y="146" width="192" height="444" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="2"/>
		<text x="330" y="176" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">křemík</text>
