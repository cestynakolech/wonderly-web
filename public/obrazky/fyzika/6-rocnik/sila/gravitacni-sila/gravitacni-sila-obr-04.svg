<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tři obrázky vedle sebe: ruka pouští modrý míček, z větvičky padá jablko a parašutista padá pod letadlem. Vedle každého tělesa jsou svislé modré šipky dolů. Všechny šipky jsou rovnoběžné.">
<style>
/* Pád těles (6 s, smyčka). Bez animace (prefers-reduced-motion) zůstává stav z atributů: tělesa uprostřed pádu. */
.mic { animation: mic 6s infinite; }
.jab { animation: jab 6s infinite; }
.para { animation: para 6s linear infinite; }
@keyframes mic { 0%, 10% { transform: translateY(-148px); opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); } 40% { transform: translateY(176px); opacity: 1; } 82% { transform: translateY(176px); opacity: 1; } 88% { transform: translateY(176px); opacity: 0; } 90% { transform: translateY(-148px); opacity: 0; } 100% { transform: translateY(-148px); opacity: 1; } }
@keyframes jab { 0%, 16% { transform: translateY(-150px); opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); } 46% { transform: translateY(176px); opacity: 1; } 82% { transform: translateY(176px); opacity: 1; } 88% { transform: translateY(176px); opacity: 0; } 90% { transform: translateY(-150px); opacity: 0; } 100% { transform: translateY(-150px); opacity: 1; } }
@keyframes para { 0% { transform: translateY(-50px); opacity: 0; } 8% { opacity: 1; } 86% { opacity: 1; } 94%, 100% { transform: translateY(60px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mic, .jab, .para { animation: none; } }
</style>
