		@media (prefers-reduced-motion: reduce) { .w-o, .w-r, .w-jiskra, .w-komora { animation: none; } .w-o { transform: rotate(270deg); } .w-r { transform: rotate(-180deg); } .w-jiskra { opacity: 1; } }
