<rect x="22" y="336" width="240" height="96" rx="12" fill="#fff9db" stroke="#e67700" stroke-width="2.5"/><rect x="62" y="382" width="8" height="26" fill="#8d5524" stroke="#5c3317" stroke-width="1.5"/><g fill="#51cf66" stroke="#2b8a3e" stroke-width="2"><circle cx="55" cy="380" r="11"/><circle cx="77" cy="380" r="11"/><circle cx="66" cy="369" r="13"/></g><text x="110" y="378" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">biomasa</text><text x="110" y="408" font-size="18" fill="#212529" text-anchor="start">fotosyntéza</text>
