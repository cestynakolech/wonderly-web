<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Chemický prvek a nuklid. Vlevo chemický prvek uhlík: atomy uhlíku 12, 13 a 14 pohromadě, všechny mají protonové číslo 6. Vpravo nuklid uhlík 12: všechny atomy mají protonové číslo 6 i nukleonové číslo 12. Animace: kroužek postupně označí atomy uhlíku 14 a 13, které mají jiné nukleonové číslo.">
<style>
.z1 { animation: z1 6s linear infinite; } @keyframes z1 { 0%, 10% { opacity: 0; } 16%, 44% { opacity: 1; } 50%, 100% { opacity: 0; } }
.z2 { animation: z2 6s linear infinite; } @keyframes z2 { 0%, 50% { opacity: 0; } 56%, 84% { opacity: 1; } 90%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .z1, .z2 { animation: none; } }
/* Předloha: PDF lekce 17, s. 10 – „Chemický prvek: uhlík C“ (zelené kuličky 6C14, 6C12, 6C12, 6C13, 6C12)
   a „Nuklid uhlíku C 12“ (5× 6C12). Zápis převeden na tvar z výkladu (A vlevo nahoře, Z vlevo dole).
   Ar = 12 u nuklidu ¹²C z výkladu. Smyčka 6 s: oranžový kroužek postupně označí atomy s jiným nukleonovým
   číslem (14 a 13). Bez animace = kroužky viditelné oba. */
</style>
<rect x="3" y="3" width="594" height="574" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="42" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Prvek, nebo nuklid?</text>
<text x="150" y="92" font-size="23" font-weight="bold" fill="#212529" text-anchor="middle">Chemický prvek</text><text x="150" y="122" font-size="22" fill="#212529" text-anchor="middle">uhlík C</text><text x="455" y="92" font-size="23" font-weight="bold" fill="#212529" text-anchor="middle">Nuklid</text><text x="455" y="122" font-size="22" fill="#212529" text-anchor="middle">uhlík 12</text><path d="M302 80V340" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 6"/><circle cx="80" cy="200" r="44" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="70" y="193.3" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">14</text><text x="70" y="214.9" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="74" y="212" font-size="36" font-weight="bold" fill="#212529">C</text><circle cx="170" cy="180" r="44" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="160" y="173.3" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">12</text><text x="160" y="194.9" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="164" y="192" font-size="36" font-weight="bold" fill="#212529">C</text><circle cx="62" cy="290" r="44" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="52" y="283.3" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">12</text><text x="52" y="304.9" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="56" y="302" font-size="36" font-weight="bold" fill="#212529">C</text><circle cx="152" cy="278" r="44" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="142" y="271.3" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">13</text><text x="142" y="292.9" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="146" y="290" font-size="36" font-weight="bold" fill="#212529">C</text><circle cx="240" cy="262" r="44" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="230" y="255.3" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">12</text><text x="230" y="276.9" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="234" y="274" font-size="36" font-weight="bold" fill="#212529">C</text><circle class="z1" cx="80" cy="200" r="50" fill="none" stroke="#e8590c" stroke-width="5"/><circle class="z2" cx="152" cy="278" r="50" fill="none" stroke="#e8590c" stroke-width="5"/><circle cx="370" cy="196" r="44" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="360" y="189.3" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">12</text><text x="360" y="210.9" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="364" y="208" font-size="36" font-weight="bold" fill="#212529">C</text><circle cx="460" cy="180" r="44" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="450" y="173.3" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">12</text><text x="450" y="194.9" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="454" y="192" font-size="36" font-weight="bold" fill="#212529">C</text><circle cx="548" cy="220" r="44" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="538" y="213.3" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">12</text><text x="538" y="234.9" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="542" y="232" font-size="36" font-weight="bold" fill="#212529">C</text><circle cx="400" cy="286" r="44" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="390" y="279.3" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">12</text><text x="390" y="300.9" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="394" y="298" font-size="36" font-weight="bold" fill="#212529">C</text><circle cx="490" cy="276" r="44" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="480" y="269.3" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">12</text><text x="480" y="290.9" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="484" y="288" font-size="36" font-weight="bold" fill="#212529">C</text><rect x="22" y="362" width="556" height="92" rx="12" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/><text x="300" y="400" font-size="20" fill="#212529" text-anchor="middle"><tspan font-weight="bold">Prvek:</tspan> všechny atomy mají protonové číslo 6,</text><text x="300" y="430" font-size="20" fill="#212529" text-anchor="middle">nukleonové číslo může být 12, 13 nebo 14.</text><rect x="22" y="468" width="556" height="92" rx="12" fill="#fff9db" stroke="#e67700" stroke-width="2.5"/><text x="300" y="506" font-size="20" fill="#212529" text-anchor="middle"><tspan font-weight="bold">Nuklid:</tspan> stejné protonové i nukleonové číslo.</text><text x="300" y="536" font-size="20" fill="#212529" text-anchor="middle">Nuklid <tspan font-size="15" dy="-9">12</tspan><tspan dy="9">C má relativní atomovou hmotnost 12.</tspan></text>
</svg>
