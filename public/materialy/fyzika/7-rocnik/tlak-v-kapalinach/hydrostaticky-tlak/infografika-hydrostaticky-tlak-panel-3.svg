<svg xmlns="http://www.w3.org/2000/svg" width="460" height="610" viewBox="0 0 460 610" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Hydrostatický paradox. Tři nádoby různého tvaru – úzká s širokým spodkem, rovná a nálevka – mají stejné dno a hladinu ve stejné výšce h. Tlak u dna je ve všech stejný. Nezáleží na tvaru nádoby ani na množství vody, jen na hloubce a hustotě. Stejné dno, stejná síla na dno.">
	<title>Hydrostatický tlak 3/6: Tvar nádoby nerozhoduje</title>
	<!-- Panel 3/6 infografiky Hydrostatický tlak (W53, 14. 10. 2026); bez animace = koncový stav. -->
	<style>
