<svg viewBox="0 0 460 670" width="460" height="670" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kdo je rychlejší: závod dvou běžců, červeného a modrého. Stejná dráha: oba běží od startu do cíle, stopky měří čas, červený doběhne do cíle za kratší čas, proto je rychlejší. Stejný čas: oba vyběhnou zároveň a běží stejně dlouho, červený za ten čas doběhne dál, proto je rychlejší" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
