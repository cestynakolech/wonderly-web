<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: tři nádrže. Do vody spadne cihla — má větší hustotu než voda, klesne ke dnu. Do mořské vody medúza — má stejnou hustotu jako mořská voda, zastaví se a vznáší se uprostřed. Do vody kus dřeva — má menší hustotu než voda, zhoupne se a plave na hladině, většina dřeva je pod hladinou.">
<style>
/* Předloha: PDF Hustota — „Chování látek s různými hustotami — pro všechna tělesa v tekutinách platí“: cihla klesne ke dnu,
   medúza se vznáší (stejná hustota jako mořská voda), dřevo plave na hladině. Strana nemá obrázek, kresba podle textu.
   Dřevo je ponořené 70 % své výšky (42 z 60 px) = poměr hustot 700 : 1 000 (dřevo z řešeného příkladu, voda z výkladu).
   Cyklus 9 s: tělesa spadnou do nádrží; ve vodě zpomalí; cihla dosedne na dno, medúza se zastaví uprostřed, dřevo se zhoupne a ustálí.
   Bez animace = koncový stav. */
@keyframes cihla { 0% { transform: translate(0, -384px); opacity: 0; } 4%, 8% { transform: translate(0, -384px); opacity: 1; } 14% { transform: translate(0, -282px); } 50%, 92% { transform: translate(0, 0); opacity: 1; } 97%, 100% { transform: translate(0, 0); opacity: 0; } }
@keyframes meduza { 0% { transform: translate(0, -250px); opacity: 0; } 4%, 8% { transform: translate(0, -250px); opacity: 1; } 14% { transform: translate(0, -160px); } 40% { transform: translate(0, 10px); } 52% { transform: translate(0, -6px); } 62%, 92% { transform: translate(0, 0); opacity: 1; } 97%, 100% { transform: translate(0, 0); opacity: 0; } }
@keyframes drevo { 0% { transform: translate(0, -110px); opacity: 0; } 4%, 8% { transform: translate(0, -110px); opacity: 1; } 14% { transform: translate(0, -18px); } 22% { transform: translate(0, 8px); } 32% { transform: translate(0, -4px); } 42% { transform: translate(0, 2px); } 52%, 92% { transform: translate(0, 0); opacity: 1; } 97%, 100% { transform: translate(0, 0); opacity: 0; } }
.cihla { animation: cihla 9s ease-in-out infinite; } .meduza { animation: meduza 9s ease-in-out infinite; } .drevo { animation: drevo 9s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .cihla, .meduza, .drevo { animation: none; } }
</style>
<rect x="3" y="3" width="954" height="714" rx="14" fill="#f8f9fa"/>
<rect x="260" y="20" width="440" height="58" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="480" y="59" font-size="28" fill="#212529" text-anchor="middle">Klesne, vznáší se, nebo plave?</text>
<g class="cihla"><rect x="100" y="482" width="120" height="52" rx="3" fill="#c92a2a" stroke="#7a2412" stroke-width="2.5"/><path d="M100 508H220M140 482V508M180 482V508M120 508V534M160 508V534M200 508V534" stroke="#e8a38f" stroke-width="3"/></g>
<g class="meduza"><path d="M430 370Q428 322 480 320Q532 322 530 370Q518 364 505 372Q492 364 480 372Q468 364 455 372Q442 364 430 370Z" fill="#e599f7" stroke="#862e9c" stroke-width="2.5"/><path d="M450 370q-10 25 0 45t0 45M470 372q10 25 0 45t0 50M490 372q-10 25 0 45t0 50M510 370q10 25 0 45t0 45" fill="none" stroke="#862e9c" stroke-width="3" stroke-linecap="round"/><ellipse cx="462" cy="336" rx="14" ry="8" fill="#fff" opacity="0.5"/></g>
<g class="drevo"><rect x="725" y="232" width="150" height="60" rx="4" fill="#d9a066" stroke="#7f4d1c" stroke-width="2.5"/><path d="M731 250q40 -8 70 0t68 0M731 268q40 8 70 0t68 0M731 282q50 -6 90 0" fill="none" stroke="#8a5420" stroke-width="2" opacity="0.8"/><ellipse cx="833" cy="259" rx="10" ry="6" fill="none" stroke="#8a5420" stroke-width="2"/></g>
<rect x="30" y="250" width="260" height="284" fill="#a5d8ff" opacity="0.45"/><path d="M30 250H290" stroke="#1971c2" stroke-width="3"/><text x="278" y="520" font-size="20" fill="#0b3d6e" font-weight="bold" text-anchor="end">voda</text>
<rect x="350" y="250" width="260" height="284" fill="#74c0fc" opacity="0.45"/><path d="M350 250H610" stroke="#1971c2" stroke-width="3"/><text x="598" y="520" font-size="20" fill="#0b3d6e" font-weight="bold" text-anchor="end">mořská voda</text>
<rect x="670" y="250" width="260" height="284" fill="#a5d8ff" opacity="0.45"/><path d="M670 250H930" stroke="#1971c2" stroke-width="3"/><text x="918" y="520" font-size="20" fill="#0b3d6e" font-weight="bold" text-anchor="end">voda</text>
<path d="M26 170V538Q26 542 30 542H290Q294 542 294 538V170" fill="none" stroke="#495057" stroke-width="6" stroke-linejoin="round"/><path d="M42 190V514" stroke="#fff" stroke-width="5" opacity="0.7" stroke-linecap="round"/>
<path d="M346 170V538Q346 542 350 542H610Q614 542 614 538V170" fill="none" stroke="#495057" stroke-width="6" stroke-linejoin="round"/><path d="M362 190V514" stroke="#fff" stroke-width="5" opacity="0.7" stroke-linecap="round"/>
<path d="M666 170V538Q666 542 670 542H930Q934 542 934 538V170" fill="none" stroke="#495057" stroke-width="6" stroke-linejoin="round"/><path d="M682 190V514" stroke="#fff" stroke-width="5" opacity="0.7" stroke-linecap="round"/>
<text x="160" y="584" font-size="26" fill="#c92a2a" text-anchor="middle" font-weight="bold">cihla</text>
<text x="160" y="616" font-size="21" fill="#212529" text-anchor="middle" >větší hustota než voda</text>
<text x="160" y="650" font-size="23" fill="#c92a2a" text-anchor="middle" font-weight="bold">⇨ klesá ke dnu</text>
<text x="480" y="584" font-size="26" fill="#862e9c" text-anchor="middle" font-weight="bold">medúza</text>
<text x="480" y="616" font-size="21" fill="#212529" text-anchor="middle" >stejná hustota jako moře</text>
<text x="480" y="650" font-size="23" fill="#862e9c" text-anchor="middle" font-weight="bold">⇨ vznáší se</text>
<text x="800" y="584" font-size="26" fill="#237032" text-anchor="middle" font-weight="bold">dřevo</text>
<text x="800" y="616" font-size="21" fill="#212529" text-anchor="middle" >menší hustota než voda</text>
<text x="800" y="650" font-size="23" fill="#237032" text-anchor="middle" font-weight="bold">⇨ plave na hladině</text>

</svg>
