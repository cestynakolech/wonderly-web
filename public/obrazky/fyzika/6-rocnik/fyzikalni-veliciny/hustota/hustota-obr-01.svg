<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: čtyři stejně velké krychle o objemu 1 m³ — zlato, železo, hliník a měď — dosednou postupně na váhy. Váhy ukážou 19 300 kg, 7 800 kg, 2 700 kg a 8 900 kg. Nad zlatem se objeví nápis nejtěžší: při stejném objemu je nejtěžší těleso s největší hustotou.">
<style>
/* Předloha: PDF Hustota — „Kolik váží krychle o velikosti 1 m³ vyrobené z různých kovů?“: krychle Zlato, Železo, Hliník, Měď
   a pod nimi oranžové štítky 19 300 kg, 7 800 kg, 2 700 kg, 8 900 kg. Překresleno, ne kopie; štítky nahrazeny displeji vah.
   Cyklus 10 s: krychle postupně dosednou na váhy (6–14 %, 21–29 %, 36–44 %, 51–59 %), displej přepne z 0 kg na hmotnost; 75 % „nejtěžší“.
   Bez animace = koncový stav (krychle na vahách, hmotnosti, popisek). */
@keyframes k0 { 0% { transform: translate(0, -190px); opacity: 0; } 2% { transform: translate(0, -190px); opacity: 1; } 6% { transform: translate(0, -190px); opacity: 1; } 14% { transform: translate(0, 0); opacity: 1; } 95% { transform: translate(0, 0); opacity: 1; } 99%, 100% { transform: translate(0, 0); opacity: 0; } }
@keyframes m0 { 0%, 15% { opacity: 0; } 16%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
@keyframes n0 { 0%, 15% { opacity: 1; } 16%, 95% { opacity: 0; } 99%, 100% { opacity: 1; } }
.k0 { animation: k0 10s ease-in infinite; } .m0 { animation: m0 10s linear infinite; } .n0 { animation: n0 10s linear infinite; }
@keyframes k1 { 0% { transform: translate(0, -190px); opacity: 0; } 17% { transform: translate(0, -190px); opacity: 1; } 21% { transform: translate(0, -190px); opacity: 1; } 29% { transform: translate(0, 0); opacity: 1; } 95% { transform: translate(0, 0); opacity: 1; } 99%, 100% { transform: translate(0, 0); opacity: 0; } }
@keyframes m1 { 0%, 30% { opacity: 0; } 31%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
@keyframes n1 { 0%, 30% { opacity: 1; } 31%, 95% { opacity: 0; } 99%, 100% { opacity: 1; } }
.k1 { animation: k1 10s ease-in infinite; } .m1 { animation: m1 10s linear infinite; } .n1 { animation: n1 10s linear infinite; }
@keyframes k2 { 0% { transform: translate(0, -190px); opacity: 0; } 32% { transform: translate(0, -190px); opacity: 1; } 36% { transform: translate(0, -190px); opacity: 1; } 44% { transform: translate(0, 0); opacity: 1; } 95% { transform: translate(0, 0); opacity: 1; } 99%, 100% { transform: translate(0, 0); opacity: 0; } }
@keyframes m2 { 0%, 45% { opacity: 0; } 46%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
@keyframes n2 { 0%, 45% { opacity: 1; } 46%, 95% { opacity: 0; } 99%, 100% { opacity: 1; } }
.k2 { animation: k2 10s ease-in infinite; } .m2 { animation: m2 10s linear infinite; } .n2 { animation: n2 10s linear infinite; }
@keyframes k3 { 0% { transform: translate(0, -190px); opacity: 0; } 47% { transform: translate(0, -190px); opacity: 1; } 51% { transform: translate(0, -190px); opacity: 1; } 59% { transform: translate(0, 0); opacity: 1; } 95% { transform: translate(0, 0); opacity: 1; } 99%, 100% { transform: translate(0, 0); opacity: 0; } }
@keyframes m3 { 0%, 60% { opacity: 0; } 61%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
@keyframes n3 { 0%, 60% { opacity: 1; } 61%, 95% { opacity: 0; } 99%, 100% { opacity: 1; } }
.k3 { animation: k3 10s ease-in infinite; } .m3 { animation: m3 10s linear infinite; } .n3 { animation: n3 10s linear infinite; }
@keyframes zaver { 0%, 70% { opacity: 0; } 75%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
.zaver { animation: zaver 10s linear infinite; }
.n0, .n1, .n2, .n3 { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .k0, .m0, .n0, .k1, .m1, .n1, .k2, .m2, .n2, .k3, .m3, .n3, .zaver { animation: none; } }
</style>
