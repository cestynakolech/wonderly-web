<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Oko vytvoří obraz těles. Dvě oka v řezu. Nahoře Slunce, které samo svítí: jeho paprsky přicházejí do oka, na přední části oka se lomí a sejdou se v jednom bodě na zadní stěně oka. Dole kniha, která odráží světlo: paprsky z jednoho bodu knihy se rozbíhají, v oku se lomí a také se sejdou v jednom bodě na zadní stěně oka. Animace: paprsky postupně doběhnou od tělesa do oka.">
<style>
/* Překresleno podle předlohy: PDF lekce 22 Rovinné zrcadlo, str. 1 „Vznik obrazu“ — dvě oka v řezu s paprsky
   (vlevo rovnoběžné paprsky, vpravo paprsky z jednoho blízkého bodu; čočka oka je u blízkého bodu silnější).
   Tělesa doplněna podle výkladu: Slunce samo svítí, kniha odráží světlo do očí.
   Lom: rovnoběžné paprsky se lomí na přední části oka (rohovce), paprsky z blízkého bodu navíc na čočce oka;
   obě dvojice se sejdou v bodě na zadní stěně oka (x = 490).
   Animace 7 s, smyčka: paprsky se kreslí 5–45 %, šipky od 16 %, bod na zadní stěně 45–55 %, vše zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy níže ukazují vše. */
.pr { stroke-dasharray: 100 100; animation: pr 7s linear infinite; }
.si { animation: si 7s linear infinite; }
.bod { animation: bod 7s linear infinite; }
.celek { animation: celek 7s linear infinite; }
@keyframes pr { 0%, 5% { stroke-dashoffset: 100; } 45%, 100% { stroke-dashoffset: 0; } }
@keyframes si { 0%, 15% { opacity: 0; } 16%, 100% { opacity: 1; } }
@keyframes bod { 0%, 45% { opacity: 0; } 55%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pr, .si, .bod, .celek { animation: none; } }
</style>
<defs>
<radialGradient id="o5cocka" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#adb5bd"/></radialGradient>
<clipPath id="o5koule"><circle cx="380" cy="200" r="108.5"/></clipPath>
<!-- oko v řezu (bez čočky): koule + vyklenutá přední část, obrys jen po vnějším okraji -->
<g id="o5oko">
<circle cx="380" cy="200" r="110" fill="#ced4da" stroke="#212529" stroke-width="3"/>
<circle cx="300" cy="200" r="60" fill="#ced4da" stroke="#212529" stroke-width="3"/>
<circle cx="380" cy="200" r="108.5" fill="#ced4da"/>
<g clip-path="url(#o5koule)" fill="#c92a2a">
<path d="M300,80 L320,80 L310,152 Z"/>
<path d="M300,320 L320,320 L310,248 Z"/>
</g>
</g>
</defs>
<rect x="3" y="3" width="594" height="734" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="42" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Oko vytvoří obraz těles</text>

<!-- 1) Slunce samo svítí — rovnoběžné paprsky -->
<g transform="translate(0 30)">
<text x="300" y="56" font-size="22" fill="#212529" text-anchor="middle">Slunce samo svítí</text>
<circle cx="34" cy="200" r="26" fill="#ffd43b" stroke="#f08c00" stroke-width="3"/>
<use href="#o5oko"/>
<ellipse cx="310" cy="200" rx="8" ry="50" fill="url(#o5cocka)" stroke="#212529" stroke-width="2"/>
<g class="celek">
<path class="pr" d="M50,180 L248,180 L490,200" pathLength="100" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path class="pr" d="M50,220 L248,220 L490,200" pathLength="100" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g class="si" fill="#e8590c"><path d="M160,180 L146,173 L146,187 Z"/><path d="M160,220 L146,213 L146,227 Z"/></g>
<circle class="bod" cx="490" cy="200" r="6" fill="#e8590c"/>
</g>
<text x="380" y="345" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">oko</text>
</g>

<line x1="20" y1="388" x2="580" y2="388" stroke="#ced4da" stroke-width="2"/>

<!-- 2) kniha odráží světlo — paprsky z jednoho bodu se rozbíhají -->
<g transform="translate(0 360)">
<text x="300" y="66" font-size="22" fill="#212529" text-anchor="middle">Kniha odráží světlo do oka</text>
<rect x="30" y="160" width="38" height="80" rx="3" fill="#4dabf7" stroke="#1864ab" stroke-width="2.5"/>
<line x1="38" y1="172" x2="38" y2="228" stroke="#1864ab" stroke-width="2"/>
<use href="#o5oko"/>
<ellipse cx="310" cy="200" rx="20" ry="48" fill="url(#o5cocka)" stroke="#212529" stroke-width="2"/>
<g class="celek">
<path class="pr" d="M70,200 L248,170 L294,170 L490,200" pathLength="100" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path class="pr" d="M70,200 L248,230 L294,230 L490,200" pathLength="100" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g class="si" fill="#e8590c"><path d="M170,183.3 L157.4,192.6 L155,178.8 Z"/><path d="M170,216.7 L155,221.3 L157.4,207.5 Z"/></g>
<circle class="bod" cx="490" cy="200" r="6" fill="#e8590c"/>
</g>
<circle cx="70" cy="200" r="5" fill="#e8590c"/>
<text x="380" y="345" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">oko</text>
</g>
</svg>
