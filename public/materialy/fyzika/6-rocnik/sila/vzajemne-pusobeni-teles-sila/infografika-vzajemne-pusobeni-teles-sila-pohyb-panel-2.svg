		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Luk a šíp</text>
		<text x="40" y="96" font-size="20" fill="#2b2a26">Tětiva je napnutá mezi konci luku.</text>
		<!-- scéna posunutá o 40 px nahoru -->
