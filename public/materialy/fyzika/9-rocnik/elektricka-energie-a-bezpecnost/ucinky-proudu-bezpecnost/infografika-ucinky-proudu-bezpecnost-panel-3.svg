<svg viewBox="0 0 460 890" width="460" height="890" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Postup první pomoci při úrazu proudem: 1. vypni proud jističem; 2. když to nejde, odděl zraněného od kabelu suchou dřevěnou nebo plastovou tyčí; dokud je pod proudem, nesahej na něj ani na jeho oděv holou rukou; hned a souběžně volej 155, zapni si hlasitý odposlech; 3. když zraněný nedýchá normálně, stlačuj mu hrudník. U vysokého napětí se nepřibližuj a volej 112" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Účinky proudu 3/3: První pomoc při úrazu</title>
	<style>
		.k0 { animation: k0 16s linear infinite; } @keyframes k0 { 0% { opacity: 1; } 32% { opacity: 1; } 33% { opacity: 0.35; } 99% { opacity: 0.35; } 100% { opacity: 1; } }
		.k1 { animation: k1 16s linear infinite; } @keyframes k1 { 0% { opacity: 0.35; } 33% { opacity: 0.35; } 34% { opacity: 1; } 65% { opacity: 1; } 66% { opacity: 0.35; } 100% { opacity: 0.35; } }
		.k3 { animation: k3 16s linear infinite; } @keyframes k3 { 0% { opacity: 0.35; } 66% { opacity: 0.35; } 67% { opacity: 1; } 99% { opacity: 1; } 100% { opacity: 0.35; } }
		.pa { transform-box: view-box; animation: pa 16s ease-in-out infinite; } @keyframes pa { 0% { transform: translateY(0px); } 8% { transform: translateY(0px); } 12% { transform: translateY(30px); } 98% { transform: translateY(30px); } 100% { transform: translateY(0px); } }
		.bl { animation: bl 16s linear infinite; } @keyframes bl { 0% { opacity: 1; } 12% { opacity: 1; } 14% { opacity: 0; } 98% { opacity: 0; } 100% { opacity: 1; } }
		.ty { transform-box: view-box; transform-origin: 378.6px 200.6px; animation: ty 16s ease-in-out infinite; } @keyframes ty { 0% { transform: rotate(-6deg); } 38% { transform: rotate(-6deg); } 43% { transform: rotate(0deg); } 52% { transform: rotate(30deg); } 98% { transform: rotate(30deg); } 100% { transform: rotate(-6deg); } }
		.kb { transform-box: view-box; animation: kb 16s ease-in-out infinite; } @keyframes kb { 0% { transform: translate(0px, 0px); opacity: 1; } 43% { transform: translate(0px, 0px); opacity: 1; } 52% { transform: translate(-27.9px, -22.1px); opacity: 1; } 55% { transform: translate(-27.9px, -22.1px); opacity: 0; } 98% { transform: translate(-27.9px, -22.1px); opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 1; } }
		.kd { transform-box: view-box; animation: kd 16s ease-in-out infinite; } @keyframes kd { 0% { transform: translateY(-18px); opacity: 0; } 52% { transform: translateY(-18px); opacity: 0; } 56% { transform: translateY(0px); opacity: 1; } 98% { transform: translateY(0px); opacity: 1; } 100% { transform: translateY(-18px); opacity: 0; } }
		.vl { animation: vl 1s linear infinite; } @keyframes vl { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
		.ru { transform-box: view-box; animation: ru 0.55s ease-in-out infinite; } @keyframes ru { 0% { transform: translateY(0px); } 50% { transform: translateY(7px); } 100% { transform: translateY(0px); } }
		@media (prefers-reduced-motion: reduce) {
			.k0, .k1, .k3, .pa, .bl, .ty, .kb, .kd, .vl, .ru { animation: none; }
			.pa { transform: translateY(30px); }
			.bl { opacity: 0; }
			.ty { transform: rotate(30deg); } .kb { opacity: 0; } .kd { opacity: 1; transform: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="890" fill="#f8f9fa"/>
