<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Zeměkoule s magnetickými indukčními čarami jako u tyčového magnetu. Uvnitř Země je nakreslený mírně nakloněný tyčový magnet: jeho jižní pól S je u severního zeměpisného pólu, severní pól N u jižního zeměpisného pólu. Čáry vycházejí u jižního zeměpisného pólu a vstupují u severního. Magnetka vedle Země ukazuje červeným koncem k severu.">
