<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vážení velmi malých těles. Vlevo jedna malá kulička z ložiska na digitální váze s nejmenším dílkem 10 g, displej ukazuje 0 g: kulička je tak lehká, že ji váha nepozná. Vpravo miska se 100 kuličkami (nakresleno jich je jen část) na stejné váze s vynulovanou miskou (tára), displej ukazuje 300 g, tedy jen kuličky. Dole výpočet: 1 kulička = 300 g : 100 = 3 g.">
<defs>
<linearGradient id="telo09" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#495057"/><stop offset="1" stop-color="#212529"/></linearGradient>
<linearGradient id="deska09" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#adb5bd"/></linearGradient>
<radialGradient id="ocel09" cx="0.35" cy="0.3" r="0.7"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#ced4da"/><stop offset="1" stop-color="#495057"/></radialGradient>
<linearGradient id="miska09" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d0ebff"/><stop offset="0.5" stop-color="#f1f8ff"/><stop offset="1" stop-color="#a5d8ff"/></linearGradient>
<symbol id="k09" viewBox="-10 -10 20 20" overflow="visible"><circle r="9" fill="url(#ocel09)" stroke="#343a40" stroke-width="1"/></symbol>
</defs>
<rect x="3" y="3" width="954" height="594" rx="14" fill="#f8f9fa"/>
<rect x="120" y="10" width="720" height="48" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="480" y="43" font-size="28" fill="#212529" text-anchor="middle">Jak zvážit velmi malé těleso: zvážíme jich hodně</text>
<rect x="30" y="456" width="900" height="14" rx="6" fill="#ced4da"/>

<!-- ===== 1 kulička ===== -->
<path d="M90,416 L390,416 L390,448 C390,453 386,456 381,456 L99,456 C94,456 90,453 90,448 Z" fill="url(#telo09)"/>
<path d="M90,416 L390,416 L410,384 L110,384 Z" fill="url(#deska09)" stroke="#495057" stroke-width="2"/>
<rect x="196" y="422" width="108" height="28" rx="4" fill="#d3f9d8" stroke="#212529" stroke-width="1.5"/>
<text x="250" y="444" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">0 g</text>
<rect x="104" y="424" width="80" height="24" rx="4" fill="#f8f9fa"/>
<text x="144" y="442" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">d = 10 g</text>
<use href="#k09" x="240" y="388" width="20" height="20"/>
<!-- lupa na kuličku -->
<circle cx="250" cy="250" r="64" fill="#ffffff" stroke="#495057" stroke-width="6"/>
<circle cx="250" cy="250" r="40" fill="url(#ocel09)" stroke="#343a40" stroke-width="2"/>
<line x1="250" y1="314" x2="250" y2="384" stroke="#495057" stroke-width="2" stroke-dasharray="6 5"/>
<g font-size="22" font-weight="bold" fill="#2b2a26" text-anchor="middle">
<text x="250" y="110">1 kulička z ložiska</text>
<text x="250" y="146" font-weight="normal" font-size="20">je moc lehká,</text>
<text x="250" y="170" font-weight="normal" font-size="20">váha ji nepozná</text>
</g>

<!-- ===== 100 kuliček v misce ===== -->
<path d="M570,416 L870,416 L870,448 C870,453 866,456 861,456 L579,456 C574,456 570,453 570,448 Z" fill="url(#telo09)"/>
<path d="M570,416 L870,416 L890,384 L590,384 Z" fill="url(#deska09)" stroke="#495057" stroke-width="2"/>
<rect x="676" y="422" width="108" height="28" rx="4" fill="#d3f9d8" stroke="#212529" stroke-width="1.5"/>
<text x="730" y="444" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">300 g</text>
<rect x="584" y="424" width="80" height="24" rx="4" fill="#f8f9fa"/>
<text x="624" y="442" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">d = 10 g</text>
<!-- miska s kuličkami -->
<path d="M626,318 C632,372 672,398 730,398 C788,398 828,372 834,318 Z" fill="url(#miska09)" stroke="#4dabf7" stroke-width="3"/>
<g>
<use href="#k09" x="650" y="314" width="20" height="20"/><use href="#k09" x="668" y="314" width="20" height="20"/><use href="#k09" x="686" y="314" width="20" height="20"/><use href="#k09" x="704" y="314" width="20" height="20"/><use href="#k09" x="722" y="314" width="20" height="20"/><use href="#k09" x="740" y="314" width="20" height="20"/><use href="#k09" x="758" y="314" width="20" height="20"/><use href="#k09" x="776" y="314" width="20" height="20"/><use href="#k09" x="794" y="314" width="20" height="20"/>
<use href="#k09" x="659" y="300" width="20" height="20"/><use href="#k09" x="677" y="300" width="20" height="20"/><use href="#k09" x="695" y="300" width="20" height="20"/><use href="#k09" x="713" y="300" width="20" height="20"/><use href="#k09" x="731" y="300" width="20" height="20"/><use href="#k09" x="749" y="300" width="20" height="20"/><use href="#k09" x="767" y="300" width="20" height="20"/><use href="#k09" x="785" y="300" width="20" height="20"/>
<use href="#k09" x="668" y="286" width="20" height="20"/><use href="#k09" x="686" y="286" width="20" height="20"/><use href="#k09" x="704" y="286" width="20" height="20"/><use href="#k09" x="722" y="286" width="20" height="20"/><use href="#k09" x="740" y="286" width="20" height="20"/><use href="#k09" x="758" y="286" width="20" height="20"/><use href="#k09" x="776" y="286" width="20" height="20"/>
<use href="#k09" x="686" y="272" width="20" height="20"/><use href="#k09" x="704" y="272" width="20" height="20"/><use href="#k09" x="722" y="272" width="20" height="20"/><use href="#k09" x="740" y="272" width="20" height="20"/><use href="#k09" x="758" y="272" width="20" height="20"/>
<use href="#k09" x="713" y="258" width="20" height="20"/><use href="#k09" x="731" y="258" width="20" height="20"/>
</g>
<path d="M626,318 C632,372 672,398 730,398 C788,398 828,372 834,318" fill="none" stroke="#4dabf7" stroke-width="3"/>
<ellipse cx="730" cy="318" rx="104" ry="10" fill="none" stroke="#4dabf7" stroke-width="3"/>
<g font-size="22" font-weight="bold" fill="#2b2a26" text-anchor="middle">
<text x="730" y="110">100 kuliček</text>
<text x="730" y="146" font-weight="normal" font-size="20">dobře změřitelné</text>
<text x="730" y="170" font-weight="normal" font-size="20">množství</text>
<text x="730" y="200" font-weight="normal" font-size="18" fill="#1864ab">(nakresleno jen část)</text>
<text x="730" y="224" font-weight="normal" font-size="18" fill="#1864ab">miska je vynulovaná (tára)</text>
</g>
<!-- výpočet -->
<rect x="200" y="500" width="560" height="74" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2.5"/>
<text x="480" y="530" font-size="20" fill="#2b2a26" text-anchor="middle">hmotnost 1 kuličky určíme výpočtem:</text>
<text x="480" y="562" font-size="24" font-weight="bold" fill="#2b2a26" text-anchor="middle">300 g : 100 = 3 g</text>
</svg>
