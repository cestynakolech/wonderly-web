<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 680" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Rovnoramenné váhy. Na levé misce leží mandarinka, levá miska je dole. Na pravou misku postupně dopadají závaží 50 g, 20 g a 2 g a vahadlo se pomalu narovnává. Když je na pravé misce 72 g, vahadlo je vodorovné a jazýček ukazuje doprostřed: nastala rovnováha, mandarinka má hmotnost 72 g.">
<style>
/* Vážení (14 s, smyčka). Bez animace (prefers-reduced-motion) zůstává koncový stav z atributů: rovnováha, všechna závaží na misce, m = 72 g. */
.vahadlo { transform-box: view-box; transform-origin: 480px 170px; animation: vahadlo 14s infinite; }
.miskaL { animation: miskaL 14s infinite; }
.miskaR { animation: miskaR 14s infinite; }
.z50 { animation: z50 14s infinite; }
.z20 { animation: z20 14s infinite; }
.z2 { animation: z2 14s infinite; }
.s0 { animation: s0 14s infinite; }
.s1 { animation: s1 14s infinite; }
.s2 { animation: s2 14s infinite; }
.s3 { animation: s3 14s infinite; }
.vysl { animation: vysl 14s infinite; }
@keyframes vahadlo { 0%, 13% { transform: rotate(-12deg); } 19%, 39% { transform: rotate(-6deg); } 45%, 63% { transform: rotate(-2deg); } 69%, 93% { transform: rotate(0deg); } 98%, 100% { transform: rotate(-12deg); } }
@keyframes miskaL { 0%, 13% { transform: translateY(48px); } 19%, 39% { transform: translateY(24px); } 45%, 63% { transform: translateY(8px); } 69%, 93% { transform: translateY(0px); } 98%, 100% { transform: translateY(48px); } }
@keyframes miskaR { 0%, 13% { transform: translateY(-48px); } 19%, 39% { transform: translateY(-24px); } 45%, 63% { transform: translateY(-8px); } 69%, 93% { transform: translateY(0px); } 98%, 100% { transform: translateY(-48px); } }
@keyframes z50 { 0%, 7% { transform: translateY(-100px); opacity: 0; } 8% { transform: translateY(-100px); opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); } 13%, 90% { transform: translateY(0px); opacity: 1; } 93%, 100% { transform: translateY(0px); opacity: 0; } }
@keyframes z20 { 0%, 33% { transform: translateY(-100px); opacity: 0; } 34% { transform: translateY(-100px); opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); } 39%, 90% { transform: translateY(0px); opacity: 1; } 93%, 100% { transform: translateY(0px); opacity: 0; } }
@keyframes z2 { 0%, 57% { transform: translateY(-100px); opacity: 0; } 58% { transform: translateY(-100px); opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); } 63%, 90% { transform: translateY(0px); opacity: 1; } 93%, 100% { transform: translateY(0px); opacity: 0; } }
@keyframes s0 { 0%, 12% { opacity: 1; } 13%, 97% { opacity: 0; } 98%, 100% { opacity: 1; } }
@keyframes s1 { 0%, 12% { opacity: 0; } 13%, 38% { opacity: 1; } 39%, 100% { opacity: 0; } }
@keyframes s2 { 0%, 38% { opacity: 0; } 39%, 62% { opacity: 1; } 63%, 100% { opacity: 0; } }
@keyframes s3 { 0%, 62% { opacity: 0; } 63%, 92% { opacity: 1; } 93%, 100% { opacity: 0; } }
@keyframes vysl { 0%, 69% { opacity: 0; } 71%, 92% { opacity: 1; } 93%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .vahadlo, .miskaL, .miskaR, .z50, .z20, .z2, .s0, .s1, .s2, .s3, .vysl { animation: none; } }
</style>
<defs>
<linearGradient id="mosaz03" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6a24"/><stop offset="0.35" stop-color="#e9c46a"/><stop offset="0.6" stop-color="#c9a227"/><stop offset="1" stop-color="#7a5a18"/></linearGradient>
<linearGradient id="mosazV03" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d58a"/><stop offset="0.5" stop-color="#c9a227"/><stop offset="1" stop-color="#7a5a18"/></linearGradient>
<radialGradient id="mand03" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#ffc078"/><stop offset="0.5" stop-color="#fd7e14"/><stop offset="1" stop-color="#d9480f"/></radialGradient>
<radialGradient id="stin03" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#495057" stop-opacity="0.4"/><stop offset="1" stop-color="#495057" stop-opacity="0"/></radialGradient>
</defs>
<rect x="3" y="3" width="954" height="674" rx="14" fill="#f8f9fa"/>
<rect x="130" y="8" width="700" height="46" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="480" y="40" font-size="28" fill="#212529" text-anchor="middle">Rovnoramenné váhy: těleso porovnáme se závažím</text>
<!-- stůl -->
<rect x="20" y="586" width="920" height="14" rx="6" fill="#ced4da"/>
<ellipse cx="480" cy="584" rx="120" ry="10" fill="url(#stin03)"/>
<!-- podstavec a sloup -->
<path d="M392,584 L410,548 L550,548 L568,584 Z" fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2"/>
<rect x="420" y="536" width="120" height="14" rx="4" fill="url(#mosazV03)" stroke="#5c3d0c" stroke-width="2"/>
<path d="M468,536 L470,200 L490,200 L492,536 Z" fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2"/>
<g fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2">
<ellipse cx="480" cy="500" rx="18" ry="10"/><ellipse cx="480" cy="420" rx="15" ry="8"/><ellipse cx="480" cy="250" rx="15" ry="8"/>
</g>
<!-- stupnice pro jazýček (pevná na sloupu) -->
<path d="M440,318 A140,140 0 0 0 520,318" fill="#fff9db" stroke="#5c3d0c" stroke-width="3"/>
<line x1="480" y1="312" x2="480" y2="330" stroke="#c92a2a" stroke-width="4"/>
<g stroke="#5c3d0c" stroke-width="2"><line x1="452" y1="314" x2="454" y2="326"/><line x1="466" y1="316" x2="467" y2="328"/><line x1="494" y1="316" x2="493" y2="328"/><line x1="508" y1="314" x2="506" y2="326"/></g>
<!-- levá miska s mandarinkou (těleso) -->
<g class="miskaL">
<g stroke="#6b4f12" stroke-width="3" stroke-dasharray="7 3"><line x1="250" y1="180" x2="178" y2="418"/><line x1="250" y1="180" x2="322" y2="418"/><line x1="250" y1="180" x2="250" y2="412"/></g>
<circle cx="250" cy="180" r="7" fill="none" stroke="#6b4f12" stroke-width="4"/>
<circle cx="236" cy="372" r="44" fill="url(#mand03)" stroke="#c2410c" stroke-width="2"/>
<g fill="#e8590c" opacity="0.6"><circle cx="220" cy="356" r="2"/><circle cx="246" cy="350" r="2"/><circle cx="256" cy="378" r="2"/><circle cx="226" cy="392" r="2"/><circle cx="210" cy="376" r="2"/></g>
<ellipse cx="222" cy="354" rx="12" ry="7" fill="#ffffff" opacity="0.45"/>
<path d="M238,330 C246,314 266,312 274,318 C264,326 250,330 238,330 Z" fill="#40c057" stroke="#2b8a3e" stroke-width="2"/>
<path d="M164,414 C176,452 324,452 336,414 Z" fill="url(#mosazV03)" stroke="#5c3d0c" stroke-width="3"/>
<ellipse cx="250" cy="414" rx="86" ry="10" fill="#e9c46a" stroke="#5c3d0c" stroke-width="3"/>
</g>
<!-- pravá miska se závažím -->
<g class="miskaR">
<g stroke="#6b4f12" stroke-width="3" stroke-dasharray="7 3"><line x1="710" y1="180" x2="638" y2="418"/><line x1="710" y1="180" x2="782" y2="418"/><line x1="710" y1="180" x2="710" y2="412"/></g>
<circle cx="710" cy="180" r="7" fill="none" stroke="#6b4f12" stroke-width="4"/>
<g class="z50">
<rect x="650" y="364" width="52" height="46" rx="5" fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2"/>
<rect x="664" y="350" width="24" height="16" rx="5" fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2"/>
<rect x="652" y="320" width="48" height="26" rx="6" fill="#ffffff" stroke="#5c3d0c" stroke-width="2"/>
<text x="676" y="340" font-size="18" font-weight="bold" fill="#2b2a26" text-anchor="middle">50 g</text>
</g>
<g class="z20">
<rect x="704" y="378" width="34" height="32" rx="4" fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2"/>
<rect x="712" y="368" width="18" height="12" rx="4" fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2"/>
<rect x="697" y="338" width="48" height="26" rx="6" fill="#ffffff" stroke="#5c3d0c" stroke-width="2"/>
<text x="721" y="358" font-size="18" font-weight="bold" fill="#2b2a26" text-anchor="middle">20 g</text>
</g>
<g class="z2">
<rect x="744" y="394" width="20" height="16" rx="3" fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2"/>
<rect x="749" y="388" width="10" height="7" rx="3" fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2"/>
<line x1="754" y1="336" x2="754" y2="388" stroke="#5c3d0c" stroke-width="2"/>
<rect x="732" y="310" width="44" height="26" rx="6" fill="#ffffff" stroke="#5c3d0c" stroke-width="2"/>
<text x="754" y="330" font-size="18" font-weight="bold" fill="#2b2a26" text-anchor="middle">2 g</text>
</g>
<path d="M624,414 C636,452 784,452 796,414 Z" fill="url(#mosazV03)" stroke="#5c3d0c" stroke-width="3"/>
<ellipse cx="710" cy="414" rx="86" ry="10" fill="#e9c46a" stroke="#5c3d0c" stroke-width="3"/>
</g>
<!-- vahadlo s jazýčkem (otáčí se kolem osy) -->
<g class="vahadlo">
<line x1="480" y1="176" x2="480" y2="318" stroke="#2b2a26" stroke-width="4" stroke-linecap="round"/>
<path d="M480,318 L474,300 L486,300 Z" fill="#2b2a26"/>
<path d="M244,172 C300,160 340,180 400,166 C440,156 460,160 480,158 C500,160 520,156 560,166 C620,180 660,160 716,172 L716,182 C660,172 620,192 560,178 C520,170 500,176 480,176 C460,176 440,170 400,178 C340,192 300,172 244,182 Z" fill="url(#mosazV03)" stroke="#5c3d0c" stroke-width="2"/>
<circle cx="244" cy="177" r="9" fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2"/>
<circle cx="716" cy="177" r="9" fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2"/>
<path d="M466,170 C466,142 494,142 494,170 Z" fill="url(#mosaz03)" stroke="#5c3d0c" stroke-width="2"/>
</g>
<circle cx="480" cy="170" r="8" fill="#5c3d0c"/>
<!-- popisky misek -->
<g font-size="22" font-weight="bold" text-anchor="middle">
<text x="250" y="532" fill="#2b2a26">těleso</text>
<text x="710" y="532" fill="#2b2a26">závaží</text>
</g>
<!-- průběžný součet závaží -->
<g font-size="24" font-weight="bold" fill="#1864ab" text-anchor="middle">
<text class="s0" x="480" y="636" opacity="0">na misce se závažím: 0 g → těleso je těžší, miska klesá</text>
<text class="s1" x="480" y="636" opacity="0">na misce: 50 g → ještě nestačí</text>
<text class="s2" x="480" y="636" opacity="0">na misce: 50 g + 20 g = 70 g → ještě nestačí</text>
<text class="s3" x="480" y="636">na misce: 50 g + 20 g + 2 g = 72 g</text>
</g>
<g class="vysl">
<rect x="200" y="60" width="560" height="68" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="3"/>
<text x="480" y="88" font-size="22" font-weight="bold" fill="#2b2a26" text-anchor="middle">Rovnováha: hmotnost závaží = hmotnost tělesa</text>
<text x="480" y="118" font-size="24" font-weight="bold" fill="#237032" text-anchor="middle">mandarinka: m = 72 g</text>
</g>
</svg>
