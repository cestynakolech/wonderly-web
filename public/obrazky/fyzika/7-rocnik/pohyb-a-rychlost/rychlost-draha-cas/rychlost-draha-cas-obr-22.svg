<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 556" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Okamžitá rychlost (tachometr) a průměrná rychlost (celá dráha po trase : celý čas)">
<defs>
<marker id="s-mod" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#1971c2"/></marker>
<marker id="s-cer" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#e03131"/></marker>
<marker id="s-zel" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#2f9e44"/></marker>
<marker id="s-ora" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#e8590c"/></marker>
<marker id="s-sed" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#495057"/></marker>
</defs>
<rect x="3" y="3" width="894" height="550" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="24" y="44" font-size="26" font-weight="bold" fill="#e03131" text-anchor="start">Okamžitá a průměrná rychlost</text>
<rect x="24" y="66" width="414" height="400" rx="14" fill="#ffffff" stroke="#1971c2" stroke-width="2.5"/>
<text x="44" y="104" font-size="24" font-weight="bold" fill="#1971c2" text-anchor="start">Okamžitá rychlost</text>
<path d="M153,220 A78,78 0 0 1 309,220" fill="#ffffff" stroke="#495057" stroke-width="5"/><line x1="157.0" y1="220.0" x2="167.0" y2="220.0" stroke="#495057" stroke-width="2.5"/><line x1="162.6" y1="191.7" x2="171.9" y2="195.5" stroke="#495057" stroke-width="2.5"/><line x1="178.7" y1="167.7" x2="185.7" y2="174.7" stroke="#495057" stroke-width="2.5"/><line x1="202.7" y1="151.6" x2="206.5" y2="160.9" stroke="#495057" stroke-width="2.5"/><line x1="231.0" y1="146.0" x2="231.0" y2="156.0" stroke="#495057" stroke-width="2.5"/><line x1="259.3" y1="151.6" x2="255.5" y2="160.9" stroke="#495057" stroke-width="2.5"/><line x1="283.3" y1="167.7" x2="276.3" y2="174.7" stroke="#495057" stroke-width="2.5"/><line x1="299.4" y1="191.7" x2="290.1" y2="195.5" stroke="#495057" stroke-width="2.5"/><line x1="305.0" y1="220.0" x2="295.0" y2="220.0" stroke="#495057" stroke-width="2.5"/><line x1="231" y1="220" x2="203.8" y2="166.5" stroke="#e03131" stroke-width="5" stroke-linecap="round"/><circle cx="231" cy="220" r="7" fill="#2b2a26"/>
<text x="231" y="252" font-size="20" font-weight="bold" fill="#495057" text-anchor="middle">km/h</text>
<text x="44" y="300" font-size="20" fill="#2b2a26" text-anchor="start">Jak rychle se těleso pohybuje</text>
<text x="44" y="328" font-size="20" fill="#2b2a26" text-anchor="start">právě v tomto okamžiku.</text>
<text x="44" y="372" font-size="20" fill="#2b2a26" text-anchor="start">Měříme ji tachometrem</text>
<text x="44" y="400" font-size="20" fill="#2b2a26" text-anchor="start">v autě nebo na kole</text>
<text x="44" y="428" font-size="20" fill="#2b2a26" text-anchor="start">a policejním radarem.</text>
<rect x="462" y="66" width="414" height="400" rx="14" fill="#ffffff" stroke="#e8590c" stroke-width="2.5"/>
<text x="482" y="104" font-size="24" font-weight="bold" fill="#e8590c" text-anchor="start">Průměrná rychlost</text>
<path d="M500,236 C540,236 540,150 590,150 S630,226 672,214 S700,140 740,140 S790,200 836,168" fill="none" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/>
<circle cx="500" cy="236" r="9" fill="#2f9e44"/><circle cx="836" cy="168" r="9" fill="#e03131"/><text x="500" y="268" font-size="18" font-weight="bold" fill="#2f9e44" text-anchor="middle">start</text>
<text x="836" y="200" font-size="18" font-weight="bold" fill="#e03131" text-anchor="middle">cíl</text>
<text x="482" y="300" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">celá dráha : celý čas</text>
<text x="482" y="332" font-size="22" font-weight="bold" fill="#e03131" text-anchor="start">v = s : t</text>
<text x="482" y="372" font-size="19" fill="#2b2a26" text-anchor="start">Počítáme celou dráhu po trase,</text>
<text x="482" y="400" font-size="19" fill="#2b2a26" text-anchor="start">i když se rychlost po cestě měnila.</text>
<rect x="24" y="480" width="852" height="52" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text x="450" y="513" font-size="20" font-weight="bold" fill="#2b2a26" text-anchor="middle">U rovnoměrného pohybu je průměrná rychlost stejná jako okamžitá.</text>
</svg>
