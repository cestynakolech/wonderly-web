			</g>
		</g>
		<g class="p2n0"><circle cx="100" cy="244" r="18" fill="#fff" stroke="#b8460b" stroke-width="2.5" /><text x="100" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#b8460b">1</text></g>
		<g class="p2n1"><circle cx="230" cy="244" r="18" fill="#fff" stroke="#b8460b" stroke-width="2.5" /><text x="230" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#b8460b">2</text></g>
		<g class="p2n2"><circle cx="360" cy="244" r="18" fill="#fff" stroke="#b8460b" stroke-width="2.5" /><text x="360" y="252" text-anchor="middle" font-size="22" font-weight="bold" fill="#b8460b">3</text></g>
		<g class="p2sl">
			<line x1="330" y1="184" x2="322" y2="278" stroke="#2b2a26" stroke-width="2" /><circle cx="322" cy="278" r="4" fill="#2b2a26" />
			<rect x="270" y="150" width="150" height="34" rx="8" fill="#fff" stroke="#6c757d" stroke-width="2" /><text x="282" y="174" font-size="20" fill="#2b2a26"><tspan font-weight="bold">látka:</tspan> železo</text>
		</g>
		<g font-size="22" font-weight="bold" fill="#2b2a26">
			<g class="p2c0" opacity="0"><text x="40" y="352">Kolik je tu hřebíků?</text></g>
			<g class="p2c1"><text x="40" y="352">Tři hřebíky.</text><text x="40" y="382" fill="#237032">Hřebík je těleso.</text></g>
			<g class="p2c2"><text x="40" y="422">Z čeho je hřebík? Ze železa.</text><text x="40" y="452" fill="#237032">Železo spočítat nejde –</text><text x="40" y="482" fill="#237032">je to látka.</text></g>
		</g>
		</g>
	</g>
