		.h1u2 { animation: h1u2 6s linear infinite; animation-delay: -3s; }
		@keyframes h1u3 { 0% { transform: translate(62px, 251px); opacity: 1; } 20% { transform: translate(100px, 251px); opacity: 1; } 55% { transform: translate(100px, 352px); opacity: 1; } 68% { transform: translate(200px, 352px); opacity: 1; } 100% { transform: translate(240px, 290px); opacity: 0; } }
