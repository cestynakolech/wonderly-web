<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 770" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Nahoře spojka: rovnoběžný svazek paprsků se po průchodu čočkou sbíhá do ohniska F´ za čočkou a dál pokračuje. Dole rozptylka: rovnoběžné paprsky se po průchodu rozbíhají, jako by vycházely ze zdánlivého ohniska F´ před čočkou. Animace: paprsky postupně proletí čočkou, u spojky se rozsvítí ohnisko, u rozptylky se dokreslí čárkované prodloužení paprsků do zdánlivého ohniska.">
<style>
/* Animace 8 s, smyčka. Předloha: PDF lekce 25, str. 3 a 8 (spojka, svazek do ohniska), str. 9 (popis F, S, F´),
   str. 4 a 15 (rozptylka, zdánlivé ohnisko F´ před čočkou).
   paprsky 5–45 %, ohnisko spojky / čárkovaná prodloužení rozptylky 45–60 %, šipky 45–50 %, vše zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy níže ukazují vše. */
.pr { stroke-dasharray: 100 100; animation: pr 8s linear infinite; }
.po { animation: po 8s linear infinite; }
.si { animation: si 8s linear infinite; }
.celek { animation: celek 8s linear infinite; }
@keyframes pr { 0%, 5% { stroke-dashoffset: 100; } 45%, 100% { stroke-dashoffset: 0; } }
@keyframes po { 0%, 45% { opacity: 0; } 60%, 100% { opacity: 1; } }
@keyframes si { 0%, 45% { opacity: 0; } 50%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pr, .po, .si, .celek { animation: none; } }
</style>
<defs><linearGradient id="c2s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#66d9e8" stop-opacity="0.75"/><stop offset="0.45" stop-color="#e3fafc" stop-opacity="0.8"/><stop offset="1" stop-color="#3bc9db" stop-opacity="0.7"/></linearGradient><radialGradient id="c2zar"><stop offset="0" stop-color="#fff3bf"/><stop offset="0.4" stop-color="#ffd43b" stop-opacity="0.9"/><stop offset="1" stop-color="#ff922b" stop-opacity="0"/></radialGradient></defs>
