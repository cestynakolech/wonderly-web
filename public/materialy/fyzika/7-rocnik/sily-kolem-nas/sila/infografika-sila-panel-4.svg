		@keyframes p4-b-t { 0% { opacity: 0 } 60% { opacity: 0 } 64% { opacity: 1 } 90% { opacity: 1 } 96% { opacity: 0 } 100% { opacity: 0 } }
		.p4-bp { animation: p4-bp 10s linear infinite; }
