<svg xmlns="http://www.w3.org/2000/svg" width="460" height="560" viewBox="0 0 460 560" role="img" aria-labelledby="title desc"><title id="title">Účinnost v pohybu 2/3: Co znamená 75 %?</title><desc id="desc">Čtyři stejně velké oranžové díly se rozdělí na tři zelené užitečné a jeden červený ztrátový. Tři čtvrtiny jsou 75 procent, ztráty 25 procent. Při omezeném pohybu je vidět výsledek rozdělení.</desc><style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;fill:#2b2a26} .nadpis{font-size:25px;font-weight:bold}.mensi{font-size:20px}.zelena{fill:#1e7031}.oranzova{fill:#b5400a}.cervena{fill:#c92a2a} .anim{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:linear} @media(prefers-reduced-motion:reduce){.anim{animation:none!important}}@keyframes dil0{0%,15%,100%{transform:translateY(0)}55%,85%{transform:translateY(80px)}}.dil0{animation-name:dil0;transform:translateY(80px)}@keyframes barva0{0%,15%,100%{opacity:0}55%,85%{opacity:1}}.barva0{animation-name:barva0;opacity:1}@keyframes dil1{0%,15%,100%{transform:translateY(0)}55%,85%{transform:translateY(80px)}}.dil1{animation-name:dil1;transform:translateY(80px)}@keyframes barva1{0%,15%,100%{opacity:0}55%,85%{opacity:1}}.barva1{animation-name:barva1;opacity:1}@keyframes dil2{0%,15%,100%{transform:translateY(0)}55%,85%{transform:translateY(80px)}}.dil2{animation-name:dil2;transform:translateY(80px)}@keyframes barva2{0%,15%,100%{opacity:0}55%,85%{opacity:1}}.barva2{animation-name:barva2;opacity:1}@keyframes dil3{0%,15%,100%{transform:translateY(0)}55%,85%{transform:translateY(190px)}}.dil3{animation-name:dil3;transform:translateY(190px)}@keyframes barva3{0%,15%,100%{opacity:0}55%,85%{opacity:1}}.barva3{animation-name:barva3;opacity:1}</style><rect width="460" height="560" rx="18" fill="#f8f9fa"/><rect x="12" y="12" width="436" height="536" rx="12" fill="white" stroke="#ced4da"/><text x="28" y="50" class="nadpis" text-anchor="start">Co znamená 75 %?</text><text x="28" y="88" class="oranzova" text-anchor="start">Dodané: 4 stejné díly</text><rect x="48" y="119" width="70" height="62" rx="8" fill="none" stroke="#ced4da" stroke-width="2" stroke-dasharray="5 5"/><g id="dil-0" class="anim dil0"><rect x="48" y="119" width="70" height="62" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="3"/><g class="anim barva0"><rect x="48" y="119" width="70" height="62" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="3"/></g><text x="83" y="158" class="" text-anchor="middle">1</text></g><rect x="140" y="119" width="70" height="62" rx="8" fill="none" stroke="#ced4da" stroke-width="2" stroke-dasharray="5 5"/><g id="dil-1" class="anim dil1"><rect x="140" y="119" width="70" height="62" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="3"/><g class="anim barva1"><rect x="140" y="119" width="70" height="62" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="3"/></g><text x="175" y="158" class="" text-anchor="middle">1</text></g><rect x="232" y="119" width="70" height="62" rx="8" fill="none" stroke="#ced4da" stroke-width="2" stroke-dasharray="5 5"/><g id="dil-2" class="anim dil2"><rect x="232" y="119" width="70" height="62" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="3"/><g class="anim barva2"><rect x="232" y="119" width="70" height="62" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="3"/></g><text x="267" y="158" class="" text-anchor="middle">1</text></g><rect x="324" y="119" width="70" height="62" rx="8" fill="none" stroke="#ced4da" stroke-width="2" stroke-dasharray="5 5"/><g id="dil-3" class="anim dil3"><rect x="324" y="119" width="70" height="62" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="3"/><g class="anim barva3"><rect x="324" y="119" width="70" height="62" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="3"/></g><text x="359" y="158" class="" text-anchor="middle">1</text></g><text x="28" y="290" class="zelena" text-anchor="start">3 díly využijeme → 75 %</text><text x="28" y="402" class="cervena" text-anchor="start">1 díl jsou ztráty → 25 %</text><text x="28" y="457" class="" text-anchor="start">Účinnost: (3 : 4) · 100 % = 75 %</text><text x="28" y="495" class="cervena" text-anchor="start">Ztráty: 100 % − 75 % = 25 %</text><text x="28" y="532" class="mensi" text-anchor="start">Čtyři díly zůstávají čtyřmi díly.</text></svg>