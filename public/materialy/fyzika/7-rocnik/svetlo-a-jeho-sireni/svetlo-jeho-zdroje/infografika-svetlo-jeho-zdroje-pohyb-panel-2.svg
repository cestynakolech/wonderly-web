<svg viewBox="0 0 460 660" width="460" height="660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Světlo a jeho zdroje v pohybu 2/3, Přirozené, nebo umělé: zdroje světla se jeden po druhém zařazují do dvou skupin. Mezi přirozené zdroje se zařadí Slunce, blesk a světluška. Mezi umělé zdroje se zařadí žárovka, svíčka, zářivka a displej." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Světlo a jeho zdroje v pohybu 2/3: Přirozené, nebo umělé?</title>
	<!-- W92 (15. 10. 2026), OPRAVA 1 (15. 10. 2026). Předloha: PDF 19, s. 3 („Může být přírodní nebo umělý (technický)“).
	     Výklad § Zdroje světla: „přirozené zdroje: Slunce, oheň, blesk, světluška“, „umělé zdroje: žárovka, zářivka, LED, svíčka,
	     displej“. OPRAVA 1: oheň vynechán (táborák postaví člověk → zařazení by bylo nejednoznačné), LED vynechána (kresbou splyne
	     s žárovkou); jiné příklady nepřidány. Odlišení od obr-01..04 (žádný nedělí zdroje podle původu).
	     Geometrie: start (190; 190) v čárkovaném rámečku; cíle — přirozené x = 62, umělé x = 266, řádky y = 320, 400, 480, 560.
	     Časování 12 s, zdroj i (i = 0…6) startuje v i s: objeví se do i+0,1 s, stojí do i+0,3 s, jede do sloupce do i+0,8 s.
	     Pořadí: Slunce, žárovka, blesk, svíčka, světluška, zářivka, displej. Vše stojí do 11 s, 11–11,6 s zmizí. První pohyb 0,3–0,8 s.
	     Čárkovaný startovní rámeček je vidět jen během řazení (0–6,8 s, zmizí do 7,3 s); v klidu (atribut opacity 0) není prázdný rámeček.
	     Barvy: zelená #1d6b2e = přirozené, modrá #1864ab = umělé (jen rámeček a nadpis sloupce). Plamen svíčky má tmavý obrys
	     (oranžová #c2410c patří jen paprsku). Bez pohybu: všech 7 zdrojů zařazeno (atribut transform = cíl). -->
	<style>
		.sl { animation: sl 12s linear infinite; }
		@keyframes sl { 0% { opacity: 0; transform: translate(190px,190px); } 0.833%, 2.5% { opacity: 1; transform: translate(190px,190px); } 6.667%, 91.667% { opacity: 1; transform: translate(62px,320px); } 96.667%, 100% { opacity: 0; transform: translate(62px,320px); } }
		.za { animation: za 12s linear infinite; }
		@keyframes za { 0%, 8.333% { opacity: 0; transform: translate(190px,190px); } 9.167%, 10.833% { opacity: 1; transform: translate(190px,190px); } 15%, 91.667% { opacity: 1; transform: translate(266px,320px); } 96.667%, 100% { opacity: 0; transform: translate(266px,320px); } }
		.bl { animation: bl 12s linear infinite; }
		@keyframes bl { 0%, 16.667% { opacity: 0; transform: translate(190px,190px); } 17.5%, 19.167% { opacity: 1; transform: translate(190px,190px); } 23.333%, 91.667% { opacity: 1; transform: translate(62px,400px); } 96.667%, 100% { opacity: 0; transform: translate(62px,400px); } }
		.sv { animation: sv 12s linear infinite; }
		@keyframes sv { 0%, 25% { opacity: 0; transform: translate(190px,190px); } 25.833%, 27.5% { opacity: 1; transform: translate(190px,190px); } 31.667%, 91.667% { opacity: 1; transform: translate(266px,400px); } 96.667%, 100% { opacity: 0; transform: translate(266px,400px); } }
		.sw { animation: sw 12s linear infinite; }
		@keyframes sw { 0%, 33.333% { opacity: 0; transform: translate(190px,190px); } 34.167%, 35.833% { opacity: 1; transform: translate(190px,190px); } 40%, 91.667% { opacity: 1; transform: translate(62px,480px); } 96.667%, 100% { opacity: 0; transform: translate(62px,480px); } }
		.zr { animation: zr 12s linear infinite; }
		@keyframes zr { 0%, 41.667% { opacity: 0; transform: translate(190px,190px); } 42.5%, 44.167% { opacity: 1; transform: translate(190px,190px); } 48.333%, 91.667% { opacity: 1; transform: translate(266px,480px); } 96.667%, 100% { opacity: 0; transform: translate(266px,480px); } }
		.di { animation: di 12s linear infinite; }
		@keyframes di { 0%, 50% { opacity: 0; transform: translate(190px,190px); } 50.833%, 52.5% { opacity: 1; transform: translate(190px,190px); } 56.667%, 91.667% { opacity: 1; transform: translate(266px,560px); } 96.667%, 100% { opacity: 0; transform: translate(266px,560px); } }
		.ra { animation: ra 12s linear infinite; }
		@keyframes ra { 0%, 56.667% { opacity: 1; } 60.833%, 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.sl, .za, .sv, .bl, .zr, .sw, .di, .ra { animation: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="660" fill="#f8f9fa" />
	<g id="panel-2">
		<rect x="26" y="22" width="420" height="628" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="628" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Přirozené, nebo umělé?</text>
		<text x="40" y="96" font-size="20" fill="#2b2a26">Zdroje světla dělíme podle</text>
		<text x="40" y="120" font-size="20" fill="#2b2a26">původu na přirozené a umělé.</text>

		<!-- odkud zdroje vyjíždějí -->
		<rect class="ra" x="110" y="150" width="240" height="80" rx="10" opacity="0" fill="none" stroke="#868e96" stroke-width="2.5" stroke-dasharray="8 6" />

		<!-- dva sloupce -->
		<rect x="30" y="246" width="196" height="368" rx="10" fill="#ebfbee" stroke="#1d6b2e" stroke-width="2.5" />
		<rect x="234" y="246" width="196" height="368" rx="10" fill="#e7f5ff" stroke="#1864ab" stroke-width="2.5" />
		<text x="128" y="280" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d6b2e">přirozené</text>
		<text x="332" y="280" text-anchor="middle" font-size="22" font-weight="bold" fill="#1864ab">umělé</text>

		<g font-size="20" fill="#2b2a26">
			<!-- Slunce -->
			<g class="sl" transform="translate(62,320)">
				<path d="M0 -25V-20M0 20V25M-25 0H-20M20 0H25M-17.7 -17.7L-14.1 -14.1M14.1 14.1L17.7 17.7M-17.7 17.7L-14.1 14.1M14.1 -14.1L17.7 -17.7" stroke="#2b2a26" stroke-width="2.5" stroke-linecap="round" />
				<circle cx="0" cy="0" r="15" fill="#ffd43b" stroke="#2b2a26" stroke-width="2" />
				<text x="34" y="7">Slunce</text>
			</g>
			<!-- žárovka -->
			<g class="za" transform="translate(266,320)">
				<path d="M-7 8Q-7 2 -11 -4A13 13 0 1 1 11 -4Q7 2 7 8Z" fill="#ffec99" stroke="#2b2a26" stroke-width="2" stroke-linejoin="round" />
				<path d="M-4 6L-3 -8L0 -4L3 -8L4 6" fill="none" stroke="#495057" stroke-width="1.5" />
				<rect x="-8" y="8" width="16" height="13" rx="2" fill="#adb5bd" stroke="#2b2a26" stroke-width="1.5" />
				<path d="M-8 12.5H8M-8 16.5H8" stroke="#495057" stroke-width="1.5" />
				<text x="34" y="7">žárovka</text>
			</g>
			<!-- svíčka -->
			<g class="sv" transform="translate(266,400)">
				<rect x="-7" y="-4" width="14" height="28" fill="#fff3bf" stroke="#2b2a26" stroke-width="2" />
				<path d="M0 -4V-9" stroke="#2b2a26" stroke-width="2" />
				<path d="M0 -27Q9 -16 0 -8Q-9 -16 0 -27Z" fill="#ffd43b" stroke="#2b2a26" stroke-width="1.5" />
				<text x="34" y="7">svíčka</text>
			</g>
			<!-- blesk -->
			<g class="bl" transform="translate(62,400)">
				<path d="M-21 -6Q-24 -18 -11 -18Q-7 -28 6 -24Q19 -26 19 -14Q27 -12 23 -4Q22 0 18 0H-17Q-22 -1 -21 -6Z" fill="#ced4da" stroke="#2b2a26" stroke-width="2" />
				<path d="M3 -1L-8 12H0L-6 26L11 7H3L9 -1Z" fill="#ffd43b" stroke="#2b2a26" stroke-width="1.5" stroke-linejoin="round" />
				<text x="34" y="7">blesk</text>
			</g>
			<!-- zářivka -->
			<g class="zr" transform="translate(266,480)">
				<rect x="-22" y="-6" width="44" height="12" rx="6" fill="#fff9db" stroke="#2b2a26" stroke-width="2" />
				<rect x="-26" y="-8" width="6" height="16" rx="1" fill="#868e96" stroke="#2b2a26" stroke-width="1.5" />
				<rect x="20" y="-8" width="6" height="16" rx="1" fill="#868e96" stroke="#2b2a26" stroke-width="1.5" />
				<text x="34" y="7">zářivka</text>
			</g>
			<!-- světluška -->
			<g class="sw" transform="translate(62,480)">
				<circle cx="10" cy="2" r="14" fill="#fff3bf" />
				<ellipse cx="-4" cy="-9" rx="10" ry="5" fill="#e7f5ff" stroke="#495057" stroke-width="1.5" />
				<ellipse cx="-6" cy="2" rx="11" ry="7" fill="#495057" stroke="#2b2a26" stroke-width="1.5" />
				<circle cx="-19" cy="2" r="5" fill="#2b2a26" />
				<path d="M-22 -2Q-26 -10 -30 -12M-20 -3Q-22 -12 -24 -15" fill="none" stroke="#2b2a26" stroke-width="1.5" stroke-linecap="round" />
				<circle cx="10" cy="2" r="8" fill="#ffd43b" stroke="#2b2a26" stroke-width="1.5" />
				<text x="34" y="7">světluška</text>
			</g>
			<!-- displej telefonu -->
			<g class="di" transform="translate(266,560)">
				<rect x="-12" y="-22" width="24" height="44" rx="4" fill="#343a40" stroke="#2b2a26" stroke-width="2" />
				<rect x="-9" y="-17" width="18" height="31" fill="#d0ebff" />
				<circle cx="0" cy="18" r="2" fill="#adb5bd" />
				<text x="34" y="7">displej</text>
			</g>
		</g>
	</g>
</svg>
