<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Trvalá deformace modelíny. Kulička modelíny leží na stole. Prst na ni zatlačí silou, znázorněnou oranžovou šipkou, a modelína se zmáčkne na placku. Když prst odejde a síla přestane působit, modelína zůstane zmáčknutá; čárkovaně je vidět její původní kulatý tvar. Trvalá deformace je nezvratná, tvar zůstane změněný i bez síly.">
<style>
/* Předloha: PDF „Působení těles, deformace“ str. 9 (trvalá deformace, příklady modelína, plech) + infografika (zmáčknutá modelína).
   Animace 8 s, smyčka: 0–4 % scéna se objeví, 4–10 % klid, 10–35 % prst tlačí a modelína se zplošťuje (šířka 1,7×, výška 0,4×),
   35–50 % držení, 50–70 % prst odchází, modelína zůstává zmáčknutá, 90–97 % scéna zmizí (návrat na začátek).
   Bez animace (prefers-reduced-motion) = koncový stav: placka modelíny, prst nahoře, čárkovaný původní tvar. */
.mo, .pr { transform-box: view-box; }
.mo { transform-origin: 300px 330px; transform: scale(1.7, 0.4); animation: mo 8s ease-in-out infinite; }
.pr { animation: pr 8s ease-in-out infinite; }
.si { animation: si 8s linear infinite; }
.du { animation: du 8s linear infinite; }
.n1 { animation: n1 8s linear infinite; }
.n2 { animation: n2 8s linear infinite; }
.ce { animation: ce 8s linear infinite; }
@keyframes mo { 0%, 10% { transform: scale(1, 1); } 35%, 100% { transform: scale(1.7, 0.4); } }
@keyframes pr { 0%, 10% { transform: translateY(0); } 35%, 50% { transform: translateY(90px); } 70%, 100% { transform: translateY(0); } }
@keyframes si { 0%, 10% { opacity: 0; } 13%, 50% { opacity: 1; } 52%, 100% { opacity: 0; } }
@keyframes du { 0%, 55% { opacity: 0; } 62%, 100% { opacity: 1; } }
@keyframes n1 { 0%, 10% { opacity: 0; } 13%, 50% { opacity: 1; } 52%, 100% { opacity: 0; } }
@keyframes n2 { 0%, 55% { opacity: 0; } 60%, 100% { opacity: 1; } }
@keyframes ce { 0% { opacity: 0; } 4%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mo, .pr, .si, .du, .n1, .n2, .ce { animation: none; } }
</style>
<defs>
<radialGradient id="ptd3m" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#8ce99a"/><stop offset="1" stop-color="#2b8a3e"/></radialGradient>
<marker id="ptd3h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e8590c"/></marker>
</defs>
<rect x="3" y="3" width="594" height="464" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="38" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Trvalá deformace</text>
<text x="300" y="66" font-size="22" fill="#212529" text-anchor="middle">zmáčknutá modelína se nevrátí</text>
<rect x="60" y="330" width="480" height="18" fill="#ced4da" stroke="#868e96" stroke-width="2"/>
<g class="ce">
<g class="du"><circle cx="300" cy="280" r="50" fill="none" stroke="#495057" stroke-width="2.5" stroke-dasharray="8 6"/><text x="362" y="240" font-size="22" fill="#495057">původní tvar</text></g>
<g class="mo"><circle cx="300" cy="280" r="50" fill="url(#ptd3m)" stroke="#2b8a3e" stroke-width="3" vector-effect="non-scaling-stroke"/></g>
<g class="pr">
<rect x="272" y="94" width="56" height="106" rx="28" fill="#f4c7a1" stroke="#8d5b3a" stroke-width="3"/>
<path d="M282,170 Q300,180 318,170 L318,190 Q300,198 282,190 Z" fill="#fde9dc" stroke="#8d5b3a" stroke-width="2"/>
<g class="si" opacity="0"><line x1="360" y1="128" x2="360" y2="198" stroke="#e8590c" stroke-width="6" marker-end="url(#ptd3h)"/><text x="378" y="170" font-size="24" font-weight="bold" fill="#212529">F</text></g>
</g>
<text class="n1" opacity="0" x="300" y="384" font-size="22" fill="#212529" text-anchor="middle">prst tlačí → modelína se zmáčkne</text>
<text class="n2" x="300" y="384" font-size="22" fill="#212529" text-anchor="middle">síla přestala působit → tvar zůstane</text>
</g>
<text x="300" y="422" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Trvalá deformace je nezvratná:</text>
<text x="300" y="450" font-size="22" fill="#495057" text-anchor="middle">tvar zůstane změněný i bez síly.</text>
</svg>
