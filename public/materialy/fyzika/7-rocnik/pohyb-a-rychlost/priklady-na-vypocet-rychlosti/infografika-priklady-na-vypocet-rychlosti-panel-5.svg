<svg viewBox="0 2498 460 726" width="460" height="726" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Graf dráhy na čase: Tomáš jede 5 m/s, to je 300 m za minutu. Tabulka: 0 min 0 m, 2 min 600 m, 4 min 1 200 m, 6 min 1 800 m, 10 min 3 000 m. Na vodorovné ose čas t v minutách od 0 do 10, na svislé dráha s v metrech od 0 do 3 000. Čára se postupně kreslí, každou minutu přibude bod o 300 m výš. Oranžově vyznačeno 6 min → 1 800 m z příkladu 3 a 10 min → 3 000 m z příkladu 4. Graf dráhy je rostoucí přímka, graf a výpočet se musí shodovat" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
