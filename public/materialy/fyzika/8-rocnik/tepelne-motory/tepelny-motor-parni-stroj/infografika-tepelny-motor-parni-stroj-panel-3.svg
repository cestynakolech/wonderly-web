<svg viewBox="0 1198 460 698" width="460" height="698" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Denis Papin (17. století), tlaková nádoba zvaná Papinův hrnec: ve válci nad ohněm je voda, pára vznikající při varu zvedá píst a s ním břemeno, hladina vody přitom trochu klesne; po ochlazení (oheň zeslábne) se píst vrací dolů; Thomas Newcomen (18. století) Papinův stroj zdokonalil a jeho stroj čerpal spodní vodu v dolech" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
