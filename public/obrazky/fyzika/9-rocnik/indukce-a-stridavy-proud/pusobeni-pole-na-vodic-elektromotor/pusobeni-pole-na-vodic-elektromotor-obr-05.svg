<text x="480.0" y="470.0" font-size="20" fill="#2b2a26" text-anchor="middle">Rotor se otáčí proti směru hodin. V další půlotáčce si poloviny komutátoru vymění kontakt s kartáčky</text>
<text x="480.0" y="498.0" font-size="20" fill="#2b2a26" text-anchor="middle">a cívka změní polaritu.</text>
