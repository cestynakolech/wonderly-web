<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Nahoře dva rezistory za sebou: R₁ = 4 Ω s kratším odporovým drátem a R₂ = 6 Ω s delším drátem. Prochází jimi stejný proud I = 2 A; na R₁ je napětí 8 V, na R₂ 12 V. Šipka dolů: chovají se jako jeden rezistor. Dole jeden rezistor s drátem tak dlouhým jako oba dohromady: R = 4 Ω + 6 Ω = 10 Ω, napětí U = 8 V + 12 V = 20 V, proud I = 2 A.">
<style>
/* Předloha: PDF lekce 28, s. 5 (rezistory za sebou se chovají jako jeden rezistor s větším odporem – sčítá se délka
   odporového drátu; R = R₁ + R₂). Obrázek v PDF chybí, nakresleno podle textu PDF a výkladu § 4.
   Čísla z výkladu (zvídavé): R₁ = 4 Ω, R₂ = 6 Ω, I = 2 A → U₁ = 8 V, U₂ = 12 V, R = 10 Ω, U = 20 V.
   Odporový drát: 1 závit navinutého drátu (šikmá čárka) na 1 Ω, takže 4 + 6 = 10 závitů; drát je kreslen jako vinutí na válečku
   (stejně jako v lekci Závislost odporu na vodiči), ne jako klikatka (ta je v lekcích značka rezistoru). Statický obrázek. */
</style>
<defs>
<marker id="v-ora" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e8590c"/></marker>
<marker id="v-nap" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0b7285"/></marker>
</defs>
<rect x="3" y="3" width="594" height="514" rx="14" fill="#f8f9fa"/>
<text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Odpory za sebou se sčítají</text>
<path d="M30 150H120M240 150H300M480 150H570" fill="none" stroke="#212529" stroke-width="4"/><rect x="120" y="124" width="120" height="52" fill="#fff" stroke="#212529" stroke-width="4"/><path d="M131 127L139 173M161 127L169 173M191 127L199 173M221 127L229 173" fill="none" stroke="#9c4a17" stroke-width="3" stroke-linecap="round"/><rect x="300" y="124" width="180" height="52" fill="#fff" stroke="#212529" stroke-width="4"/><path d="M311 127L319 173M341 127L349 173M371 127L379 173M401 127L409 173M431 127L439 173M461 127L469 173" fill="none" stroke="#9c4a17" stroke-width="3" stroke-linecap="round"/>
<text x="180" y="108" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">R₁ = 4 Ω</text><text x="390" y="108" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">R₂ = 6 Ω</text><line x1="36" y1="124" x2="100" y2="124" stroke="#e8590c" stroke-width="7" stroke-linecap="round" marker-end="url(#v-ora)"/><text x="60" y="104" font-size="20" font-weight="bold" fill="#c2410c" text-anchor="middle">I = 2 A</text><line x1="128" y1="196" x2="232" y2="196" stroke="#0b7285" stroke-width="5" marker-start="url(#v-nap)" marker-end="url(#v-nap)"/><text x="180" y="230" font-size="22" font-weight="bold" fill="#0b7285" text-anchor="middle">U₁ = 8 V</text><line x1="308" y1="196" x2="472" y2="196" stroke="#0b7285" stroke-width="5" marker-start="url(#v-nap)" marker-end="url(#v-nap)"/><text x="390" y="230" font-size="22" font-weight="bold" fill="#0b7285" text-anchor="middle">U₂ = 12 V</text>
<path d="M180 256V300" stroke="#495057" stroke-width="6"/><path d="M166 296L180 318L194 296Z" fill="#495057"/><text x="210" y="292" font-size="20" fill="#495057" text-anchor="start">chovají se jako jeden rezistor</text>
<path d="M30 400H150M450 400H570" fill="none" stroke="#212529" stroke-width="4"/><rect x="150" y="374" width="300" height="52" fill="#fff" stroke="#212529" stroke-width="4"/><path d="M161 377L169 423M191 377L199 423M221 377L229 423M251 377L259 423M281 377L289 423M311 377L319 423M341 377L349 423M371 377L379 423M401 377L409 423M431 377L439 423" fill="none" stroke="#9c4a17" stroke-width="3" stroke-linecap="round"/>
<text x="300" y="358" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">R = 4 Ω + 6 Ω = 10 Ω</text><line x1="36" y1="374" x2="100" y2="374" stroke="#e8590c" stroke-width="7" stroke-linecap="round" marker-end="url(#v-ora)"/><text x="60" y="354" font-size="20" font-weight="bold" fill="#c2410c" text-anchor="middle">I = 2 A</text><line x1="158" y1="446" x2="442" y2="446" stroke="#0b7285" stroke-width="5" marker-start="url(#v-nap)" marker-end="url(#v-nap)"/><text x="300" y="480" font-size="22" font-weight="bold" fill="#0b7285" text-anchor="middle">U = 8 V + 12 V = 20 V</text>
<text x="300" y="506" font-size="20" fill="#495057" text-anchor="middle">delší odporový drát = větší odpor</text>
</svg>
