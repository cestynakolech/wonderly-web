<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: radiátor, do kterého vede trubka s horkou vodou přes ventil. Na ventilu je bílá žebrovaná hlavice; v jejím průřezu je pružné pouzdro s kapalinou a kolík s uzávěrem. Vedle je teploměr se značkou požadované teploty v místnosti. Horká voda teče do radiátoru, radiátor hřeje a teplota v místnosti stoupá. Při požadované teplotě se kapalina v hlavici roztáhne, zatlačí kolík a uzávěr zaškrtí přívod horké vody. Když se v místnosti ochladí, kapalina se zmenší a voda zase teče.">
<style>
/* Předloha: PDF Teplotní roztažnost, termostatický ventil u topení (kapalinový) — fotografie bílé žebrované hlavice na radiátoru;
   text: nastavuje průtok topné vody, při požadované teplotě v místnosti se zvětší objem kapaliny uvnitř a zaškrtí vstup horké vody.
   Fotografie překreslena kresbou; průřez hlavicí zjednodušený. Čísla z ciferníku hlavice vynechána (výklad je nevysvětluje).
   Teploměr ve stylu podtématu Teplota a její měření, bez čísel. Kapalina v hlavici fialová (odlišení od horké vody).
   Smyčka 12 s: 0–40 % voda teče, teplota stoupá ke značce, 40–48 % kapalina se roztáhne (scaleY 1,29), kolík a uzávěr o 18 dolů,
   voda přestane téct; 48–85 % místnost chladne; 85–93 % kapalina se zmenší, voda teče. Bez animace = přívod zaškrcený. */
@keyframes vln { 0%, 40% { transform: scale(1, 1); } 48%, 85% { transform: scale(1, 1.29); } 93%, 100% { transform: scale(1, 1); } }
@keyframes kol { 0%, 40% { transform: translate(0, 0); } 48%, 85% { transform: translate(0, 18px); } 93%, 100% { transform: translate(0, 0); } }
@keyframes tok { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
@keyframes tece { 0%, 45% { opacity: 1; } 48%, 90% { opacity: 0; } 93%, 100% { opacity: 1; } }
@keyframes tepl { 0%, 45% { opacity: 0.55; } 70%, 88% { opacity: 0; } 100% { opacity: 0.55; } }
@keyframes sl { 0% { transform: translate(0, 30px); } 40%, 48% { transform: translate(0, 0); } 85% { transform: translate(0, 30px); } 100% { transform: translate(0, 30px); } }
@keyframes tO { 0%, 44% { opacity: 1; } 46%, 92% { opacity: 0; } 94%, 100% { opacity: 1; } }
@keyframes tZ { 0%, 46% { opacity: 0; } 48%, 90% { opacity: 1; } 92%, 100% { opacity: 0; } }
.vln { animation: vln 12s ease-in-out infinite; } .kol { animation: kol 12s ease-in-out infinite; }
.tok { animation: tok 0.6s linear infinite; } .tece { animation: tece 12s linear infinite; } .tepl { animation: tepl 12s ease-in-out infinite; }
.sl { animation: sl 12s ease-in-out infinite; } .tO { animation: tO 12s linear infinite; } .tZ { animation: tZ 12s linear infinite; }
@media (prefers-reduced-motion: reduce) { .vln, .kol, .tok, .tece, .tepl, .sl, .tO, .tZ { animation: none; } }
</style>
<defs>
<linearGradient id="hlav" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ced4da"/><stop offset="0.35" stop-color="#ffffff"/><stop offset="1" stop-color="#adb5bd"/></linearGradient>
<linearGradient id="mosaz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe8a3"/><stop offset="0.5" stop-color="#d4a72c"/><stop offset="1" stop-color="#8f6512"/></linearGradient>
<linearGradient id="trubka" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ecef"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#adb5bd"/></linearGradient>
<linearGradient id="radiator" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dee2e6"/><stop offset="0.4" stop-color="#ffffff"/><stop offset="1" stop-color="#ced4da"/></linearGradient>
<linearGradient id="skloc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dee2e6"/><stop offset="0.3" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ecef"/></linearGradient>
<clipPath id="kap"><rect x="436" y="318" width="8" height="174" rx="4"/><circle cx="440" cy="494" r="11"/></clipPath>
</defs>
<rect x="3" y="3" width="594" height="634" rx="14" fill="#f8f9fa"/>
<rect x="40" y="16" width="520" height="54" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="300" y="52" font-size="26" fill="#212529" text-anchor="middle">Termostatický ventil u topení</text>
<!-- radiátor -->
<rect x="40" y="200" width="212" height="320" rx="8" fill="#adb5bd"/>
<g fill="url(#radiator)" stroke="#868e96" stroke-width="1.5">
<rect x="44" y="204" width="22" height="312" rx="10"/><rect x="70" y="204" width="22" height="312" rx="10"/><rect x="96" y="204" width="22" height="312" rx="10"/><rect x="122" y="204" width="22" height="312" rx="10"/><rect x="148" y="204" width="22" height="312" rx="10"/><rect x="174" y="204" width="22" height="312" rx="10"/><rect x="200" y="204" width="22" height="312" rx="10"/><rect x="226" y="204" width="22" height="312" rx="10"/>
</g>
<rect class="tepl" x="40" y="200" width="212" height="320" rx="8" fill="#ff8787" opacity="0"/>
<path d="M60 520V548M232 520V548" stroke="#495057" stroke-width="6"/>
<!-- trubka s horkou vodou a ventil -->
<rect x="250" y="212" width="310" height="26" fill="url(#trubka)" stroke="#868e96" stroke-width="1.5"/>
<rect x="250" y="218" width="306" height="14" fill="#ffd8a8"/>
<g class="tece" opacity="0"><path class="tok" d="M556 225H254" stroke="#e8590c" stroke-width="6" stroke-dasharray="14 10"/></g>
<rect x="290" y="196" width="80" height="54" rx="6" fill="url(#mosaz)" stroke="#8f6512" stroke-width="2"/>
<rect x="296" y="218" width="68" height="14" fill="#ffd8a8"/>
<g class="tece" opacity="0"><path class="tok" d="M364 225H296" stroke="#e8590c" stroke-width="6" stroke-dasharray="14 10"/></g>
<rect x="296" y="236" width="68" height="8" fill="#8f6512" opacity="0.4"/>
<!-- hlavice s průřezem -->
<path d="M276 200V108Q276 88 300 88H360Q384 88 384 108V200Z" fill="url(#hlav)" stroke="#495057" stroke-width="2"/>
<path d="M282 112V194M290 104V194M370 104V194M378 112V194" stroke="#adb5bd" stroke-width="3"/>
<rect x="298" y="102" width="64" height="96" rx="4" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
<g transform="translate(330 112)"><path class="vln" transform="scale(1 1.29)" d="M-18 0H18L22 8L14 16L22 24L14 32L22 40L14 48L22 56L18 62H-18L-22 56L-14 48L-22 40L-14 32L-22 24L-14 16L-22 8Z" fill="#7048e8" stroke="#5f3dc4" stroke-width="1.5"/></g>
<g class="kol" transform="translate(0 18)"><rect x="327" y="172" width="6" height="28" fill="#495057"/><rect x="318" y="196" width="24" height="20" rx="3" fill="#495057" stroke="#212529" stroke-width="1.5"/></g>
<!-- teploměr v místnosti -->
<path d="M426 318Q426 306 440 306Q454 306 454 318V480Q462 490 458 500Q452 510 440 510Q428 510 422 500Q418 490 426 480Z" fill="url(#skloc)" stroke="#495057" stroke-width="2.5"/>
<rect x="436" y="318" width="8" height="174" rx="4" fill="#fff" stroke="#adb5bd" stroke-width="1"/>
<path d="M444 470h8M444 450h8M444 430h8M444 410h8M444 390h8M444 370h8M444 350h8M444 330h8" stroke="#212529" stroke-width="2"/>
<g clip-path="url(#kap)"><circle cx="440" cy="494" r="11" fill="#c92a2a"/><rect class="sl" x="436" y="370" width="8" height="130" fill="#c92a2a"/></g>
