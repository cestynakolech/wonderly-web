<text x="26" y="34" font-size="25" font-weight="bold" fill="#2b2a26">Tepelná výměna</text>
		<text x="26" y="66" font-size="22" fill="#2b2a26">Dotknou se dvě tělesa s různou</text>
		<text x="26" y="94" font-size="22" fill="#2b2a26">teplotou → nastane tepelná výměna.</text>
		<rect x="104.0" y="118" width="12" height="160" rx="6.0" fill="#ffffff" stroke="#495057" stroke-width="2" /><circle cx="110" cy="278" r="10" fill="#5f3dc4" stroke="#495057" stroke-width="2" />
