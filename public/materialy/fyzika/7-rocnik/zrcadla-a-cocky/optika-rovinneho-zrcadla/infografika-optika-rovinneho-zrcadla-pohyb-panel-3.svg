<svg viewBox="0 0 460 716" width="460" height="716" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rovinné zrcadlo v pohybu 3/3, Kde oko vidí svíčku: na stole stojí svíčka a zrcadlo. Oko se dívá do zrcadla postupně ze tří výšek. Pokaždé jde světlo od plamene svíčky k zrcadlu, odrazí se a přijde do oka. Oko vidí svíčku ve směru, odkud světlo přichází, tedy za zrcadlem; tam vedou čárkovaná prodloužení paprsků. Všechna tři prodloužení se sejdou ve stejném místě, kde je obraz svíčky. Obraz je stejně daleko za zrcadlem jako svíčka před ním. Za zrcadlo světlo nejde, obraz je zdánlivý." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Rovinné zrcadlo v pohybu 3/3: Kde oko vidí svíčku</title>
	<!-- W91 (15. 10. 2026). Předloha: PDF 22 Rovinné zrcadlo, s. 3 a 5 (K před zrcadlem, oranžové paprsky do oka, čárkovaná
	     prodloužení za zrcadlo k obrazu K′), s. 4 („obraz předmětu vidíme ve směru přicházejících paprsků“), s. 5 (1. zdánlivý –
	     není vytvořen skutečnými paprsky, vzniká za zrcadlem), s. 6 (3. stejně vzdálený); infografika učitele unnamed.png
	     u PDF 22 (svíčka před zrcadlem, oko, paprsky, „zdánlivý obraz“ svíčky za zrcadlem). Výklad § Jaký obraz vidí naše oko
	     + § Vlastnosti obrazu. Odlišení od obr-01 (statické K a jedno oko): tady se oko POHYBUJE a čárkovaná prodloužení
	     ze tří poloh oka se sejdou v témže bodě.
	     Geometrie: zrcadlo x = 300, plamen F = (230; 398), obraz plamene I = (370; 398) (osová souměrnost x′ = 600 − x,
	     obal matrix(-1 0 0 1 600 0)), oko x = 70, výšky y_o = 220, 280, 340.
	     Bod odrazu P leží na přímce I–oko: P_y = 398 + (y_o − 398)·70/300 → 356,47; 370,47; 384,47.
	     Kontrola zákona odrazu (počítáno): úhel dopadu = úhel odrazu od kolmice 59,32°; 68,53°; 79,06° (čísla se NEuvádějí).
	     Odražený paprsek končí před okem v x = 92 (y = 233,05; 288,65; 344,25). Nejnižší paprsek míjí plamen (u x = 230 je y ≈ 371).
	     Časování 10 s: paprsky 1 v 0,3–0,9 s, oko se zvedá/klesá 1,4–2,2 s, paprsky 2 v 2,5–3,1 s, oko 3,8–4,6 s,
	     paprsky 3 v 4,9–5,5 s, drží do 9,2 s, pak vše zmizí a oko se vrátí. Plné paprsky jen pro aktuální polohu oka,
	     čárkovaná prodloužení zůstávají. Bez pohybu: oko dole, všechna tři prodloužení a obraz. Barvy: paprsek #c2410c
	     (jako W87–W89), zrcadlo černé s šedým rubem, obraz světlý čárkovaný = zdánlivý, růžová kóta = stejně daleko (obr-02). -->
	<defs>
		<marker id="rz3-sip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
			<path d="M0 1L11 6L0 11Z" fill="#c2410c" />
		</marker>
	</defs>
	<style>
		.pl { transform-box: view-box; transform-origin: 230px 408px; animation: pl 0.6s ease-in-out infinite alternate; }
		@keyframes pl { 0% { transform: scale(1, 1); } 100% { transform: scale(0.9, 0.84); } }
		.ok { animation: ok 10s ease-in-out infinite; }
		@keyframes ok { 0%, 14% { transform: translate(70px,220px); } 22%, 38% { transform: translate(70px,280px); } 46%, 92% { transform: translate(70px,340px); } 100% { transform: translate(70px,220px); } }
		.a1 { animation: a1 10s step-end infinite; }
		@keyframes a1 { 0% { opacity: 0; } 3% { opacity: 1; } 14% { opacity: 0; } 100% { opacity: 0; } }
		.b1 { animation: b1 10s step-end infinite; }
		@keyframes b1 { 0% { opacity: 0; } 6% { opacity: 1; } 14% { opacity: 0; } 100% { opacity: 0; } }
		.c1 { animation: c1 10s step-end infinite; }
		@keyframes c1 { 0% { opacity: 0; } 9% { opacity: 1; } 92% { opacity: 0; } 100% { opacity: 0; } }
		.a2 { animation: a2 10s step-end infinite; }
		@keyframes a2 { 0% { opacity: 0; } 25% { opacity: 1; } 38% { opacity: 0; } 100% { opacity: 0; } }
		.b2 { animation: b2 10s step-end infinite; }
		@keyframes b2 { 0% { opacity: 0; } 28% { opacity: 1; } 38% { opacity: 0; } 100% { opacity: 0; } }
		.c2 { animation: c2 10s step-end infinite; }
		@keyframes c2 { 0% { opacity: 0; } 31% { opacity: 1; } 92% { opacity: 0; } 100% { opacity: 0; } }
		.a3 { animation: a3 10s step-end infinite; }
		@keyframes a3 { 0% { opacity: 0; } 49% { opacity: 1; } 92% { opacity: 0; } 100% { opacity: 0; } }
		.b3 { animation: b3 10s step-end infinite; }
		@keyframes b3 { 0% { opacity: 0; } 52% { opacity: 1; } 92% { opacity: 0; } 100% { opacity: 0; } }
		.c3 { animation: c3 10s step-end infinite; }
		@keyframes c3 { 0% { opacity: 0; } 55% { opacity: 1; } 92% { opacity: 0; } 100% { opacity: 0; } }
		.ob { animation: ob 10s step-end infinite; }
		@keyframes ob { 0% { opacity: 0; } 9% { opacity: 1; } 92% { opacity: 0; } 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.pl, .ok, .a1, .b1, .c1, .a2, .b2, .c2, .a3, .b3, .c3, .ob { animation: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="716" fill="#f8f9fa" />
	<g id="panel-3">
		<rect x="26" y="22" width="420" height="684" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="684" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">3</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Kde oko vidí svíčku</text>
		<text x="40" y="96" font-size="20" fill="#2b2a26">Oko se dívá do zrcadla na svíčku,</text>
		<text x="40" y="120" font-size="20" fill="#2b2a26">pokaždé z jiné výšky.</text>
		<text x="300" y="186" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2a26">zrcadlo</text>

		<!-- stůl -->
		<rect x="30" y="470" width="400" height="12" fill="#e9d8c4" stroke="#7a4a1f" stroke-width="2" />
		<rect x="38" y="482" width="9" height="44" fill="#e9d8c4" stroke="#7a4a1f" stroke-width="2" />
		<rect x="419" y="482" width="8" height="44" fill="#e9d8c4" stroke="#7a4a1f" stroke-width="2" />

		<!-- zrcadlo stojí na stole: černá odrazná plocha (ke svíčce), šedý rub -->
		<path d="M304.5 200V466" stroke="#adb5bd" stroke-width="9" />
		<path d="M300 200V466" stroke="#2b2a26" stroke-width="3.5" />
		<path d="M284 469H320M302 462V469" stroke="#495057" stroke-width="5" stroke-linecap="round" />

		<!-- obraz svíčky: zrcadlová kopie podle x = 300, světlý a čárkovaný = zdánlivý -->
		<g class="ob">
			<g transform="matrix(-1 0 0 1 600 0)" stroke-dasharray="5 3">
				<rect x="220" y="412" width="20" height="58" fill="#fffbea" stroke="#495057" stroke-width="2" />
				<path d="M230 412V404" stroke="#495057" stroke-width="2" />
				<path d="M230 380Q242 396 230 408Q218 396 230 380Z" fill="#fff3bf" stroke="#495057" stroke-width="2" />
			</g>
			<text x="350" y="508" text-anchor="middle" font-size="20" fill="#2b2a26">obraz svíčky</text>
		</g>

		<!-- svíčka -->
		<rect x="220" y="412" width="20" height="58" fill="#fff3bf" stroke="#2b2a26" stroke-width="2" />
		<path d="M230 412V404" stroke="#2b2a26" stroke-width="2" />
		<g class="pl">
			<path d="M230 380Q242 396 230 408Q218 396 230 380Z" fill="#ffd43b" stroke="#2b2a26" stroke-width="1.5" />
			<path d="M230 392Q235 400 230 405Q225 400 230 392Z" fill="#fff9db" />
		</g>
		<text x="230" y="508" text-anchor="middle" font-size="20" fill="#2b2a26">svíčka</text>

		<!-- paprsky: plně skutečné světlo (svíčka → zrcadlo → oko), čárkovaně prodloužení za zrcadlo -->
		<g fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round">
			<path class="a1" opacity="0" d="M230 398L300 356.47" marker-end="url(#rz3-sip)" />
			<path class="b1" opacity="0" d="M300 356.47L92 233.05" marker-end="url(#rz3-sip)" />
			<path class="c1" d="M300 356.47L370 398" stroke-width="2.5" stroke-dasharray="7 5" />
			<path class="a2" opacity="0" d="M230 398L300 370.47" marker-end="url(#rz3-sip)" />
			<path class="b2" opacity="0" d="M300 370.47L92 288.65" marker-end="url(#rz3-sip)" />
			<path class="c2" d="M300 370.47L370 398" stroke-width="2.5" stroke-dasharray="7 5" />
			<path class="a3" d="M230 398L300 384.47" marker-end="url(#rz3-sip)" />
			<path class="b3" d="M300 384.47L92 344.25" marker-end="url(#rz3-sip)" />
			<path class="c3" d="M300 384.47L370 398" stroke-width="2.5" stroke-dasharray="7 5" />
		</g>

		<!-- oko (dívá se doprava k zrcadlu) -->
		<g class="ok" transform="translate(70,340)">
			<path d="M-18 0Q0 -15 18 0Q0 15 -18 0Z" fill="#ffffff" stroke="#2b2a26" stroke-width="2.5" stroke-linejoin="round" />
			<circle cx="6" cy="0" r="6.5" fill="#1864ab" />
			<circle cx="7" cy="0" r="3" fill="#2b2a26" />
			<text x="0" y="-20" text-anchor="middle" font-size="20" fill="#2b2a26">oko</text>
		</g>

		<!-- stejně daleko: kóta svíčka–zrcadlo a zrcadlo–obraz, stejné značky (jako obr-02) -->
		<g stroke="#c2255c" stroke-width="2.5" fill="none">
			<path d="M230 530H297M303 530H370M230 520V540M370 520V540M300 522V538" />
			<path d="M261 524V536M267 524V536M333 524V536M339 524V536" />
		</g>
		<text x="300" y="562" text-anchor="middle" font-size="20" font-weight="bold" fill="#c2255c">stejně daleko</text>

		<text x="40" y="600" font-size="20" fill="#2b2a26">Oko vidí svíčku tam, odkud k němu</text>
		<text x="40" y="624" font-size="20" fill="#2b2a26">přichází světlo: za zrcadlem.</text>
		<text x="40" y="658" font-size="22" font-weight="bold" fill="#2b2a26">Za zrcadlo světlo nejde (čárkovaně),</text>
		<text x="40" y="684" font-size="22" font-weight="bold" fill="#2b2a26">obraz je zdánlivý.</text>
	</g>
</svg>
