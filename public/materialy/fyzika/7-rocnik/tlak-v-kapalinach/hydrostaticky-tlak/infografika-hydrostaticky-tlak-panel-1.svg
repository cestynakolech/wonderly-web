	<text x="40" y="92" font-size="19" fill="#2b2a26">Čím hlouběji pod hladinou,</text><text x="40" y="116" font-size="19" fill="#2b2a26">tím větší tlak a silnější výtrysk.</text><rect x="40" y="432" width="390" height="6" fill="#ced4da"/><rect x="120" y="299" width="8" height="133" fill="#868e96"/><rect x="166" y="299" width="8" height="133" fill="#868e96"/><rect x="106" y="295" width="82" height="6" fill="#868e96"/><path d="M296 404 L304 430 L424 430 L432 404" fill="none" stroke="#495057" stroke-width="4" stroke-linejoin="round"/><polygon points="299,418 302,428 426,428 429,418" fill="#74c0fc"/><rect x="112" y="190" width="70" height="105" fill="#74c0fc"/><path d="M112 176 L112 295 L182 295 L182 176" fill="none" stroke="#495057" stroke-width="4"/><line x1="112" y1="190" x2="182" y2="190" stroke="#1c7ed6" stroke-width="2"/><path d="M150 146 q14 -6 22 4 l-8 8 z" fill="#adb5bd"/><rect x="148" y="140" width="30" height="20" rx="4" fill="#ced4da" stroke="#868e96" stroke-width="2"/><line x1="150" y1="154" x2="150" y2="190" stroke="#74c0fc" stroke-width="4"/><text x="196" y="158" font-size="15" fill="#6b6a60">vodu doléváme,</text><text x="196" y="176" font-size="15" fill="#6b6a60">hladina se nemění</text><line x1="98" y1="192" x2="98" y2="288" stroke="#2b2a26" stroke-width="2" marker-end="url(#sip)"/><text x="88" y="239" font-size="16" text-anchor="middle" fill="#2b2a26" transform="rotate(-90 88 239)">hloubka</text><path class="p1-j0" d="M184 220 Q263.4 220 342.7 430" fill="none" stroke="#74c0fc" stroke-width="5" stroke-linecap="round"/><path class="p1-t0" d="M184 220 Q263.4 220 342.7 430" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="6 14"/><circle cx="182" cy="220" r="3.5" fill="#2b2a26"/><path class="p1-j1" d="M184 250 Q287.9 250 391.8 430" fill="none" stroke="#74c0fc" stroke-width="6" stroke-linecap="round"/><path class="p1-t1" d="M184 250 Q287.9 250 391.8 430" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="6 14"/><circle cx="182" cy="250" r="3.5" fill="#2b2a26"/><path class="p1-j2" d="M184 280 Q300.2 280 416.4 430" fill="none" stroke="#74c0fc" stroke-width="7" stroke-linecap="round"/><path class="p1-t2" d="M184 280 Q300.2 280 416.4 430" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="6 14"/><circle cx="182" cy="280" r="3.5" fill="#2b2a26"/><rect x="40" y="452" width="380" height="126" rx="10" fill="#fff4e6" stroke="#b8460b" stroke-width="2"/><text x="56" y="480" font-size="17" fill="#6b6a60">Tlak vody v otvoru:</text><text x="56" y="510" font-size="20" fill="#2b2a26">horní otvor → <tspan font-weight="bold" fill="#b8460b">malý tlak</tspan></text><text x="56" y="538" font-size="20" fill="#2b2a26">prostřední otvor → <tspan font-weight="bold" fill="#b8460b">větší tlak</tspan></text><text x="56" y="566" font-size="20" fill="#2b2a26">dolní otvor → <tspan font-weight="bold" fill="#b8460b">největší tlak</tspan></text><text x="230" y="612" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">Dolní otvor stříká nejsilněji.</text>
