<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pronikavost záření: záření alfa zastaví už list papíru. Záření beta projde papírem, ale v ruce (tkáni) dolétne jen několik milimetrů; spolehlivě ho zastaví hliníkový plech tlustý asi 5 mm. Záření gama projde papírem, rukou, hliníkem, vodou, betonem i olovem; silný beton a olovo ho zeslabí. Animace: částice alfa se zastaví o papír, elektron beta už v ruce, vlna gama běží dál a slábne.">
