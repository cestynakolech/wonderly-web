<text x="50.0" y="534.0" font-size="21" fill="#2b2a26" text-anchor="start">1  Stiskneme K: proud jde přes přerušovač T, kotvu A a cívku E.</text>
<text x="50.0" y="570.0" font-size="21" fill="#2b2a26" text-anchor="start">2  Elektromagnet E přitáhne kotvu, kladívko udeří na zvonek B.</text>
<text x="50.0" y="606.0" font-size="21" fill="#2b2a26" text-anchor="start">3  Kotva se odtrhne od T, obvod se přeruší, magnet zeslábne.</text>
<text x="50.0" y="642.0" font-size="21" fill="#2b2a26" text-anchor="start">4  Kotva se vrátí, T sepne a všechno se opakuje, dokud držíme K.</text>
