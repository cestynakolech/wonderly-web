<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: zvětšená stupnice odměrného válce od 20 do 50 mililitrů, nejmenší dílek 1 ml. Hladina je u stěn zaoblená nahoru. Oko sjede do úrovně hladiny a dívá se kolmo na nejnižší místo hladiny, které je u značky 28. Zápis: V = 28 ml.">
<style>
/* Předloha: PDF Objem — zvětšená stupnice 20–50 ml, hladina u stěn zaoblená vzhůru, šipka k nejnižšímu místu, rámeček se zápisem V = 28 ml.
   Překresleno, ne kopie. Dílek je 1 ml (mezi čísly 20 a 30 je 10 dílků).
   Cyklus 8 s: 0–10 % oko je vysoko, 10–42 % sjede do úrovně hladiny, 48 % pohled kolmo k nejnižšímu místu, 60 % popisek, 68 % zápis V = 28 ml.
   Bez animace = koncový stav. */
@keyframes oko { 0%, 10% { transform: translate(0, -230px); } 42%, 96% { transform: translate(0, 0); } 100% { transform: translate(0, -230px); } }
@keyframes popisoko { 0%, 42% { opacity: 0; } 46%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes pohled { 0%, 44% { opacity: 0; } 50%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes cist { 0%, 56% { opacity: 0; } 62%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes zapis { 0%, 66% { opacity: 0; } 72%, 94% { opacity: 1; } 100% { opacity: 0; } }
.oko { animation: oko 8s ease-in-out infinite; } .popisoko { animation: popisoko 8s linear infinite; } .pohled { animation: pohled 8s linear infinite; }
.cist { animation: cist 8s linear infinite; } .zapis { animation: zapis 8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .oko, .popisoko, .pohled, .cist, .zapis { animation: none; } }
</style>
<rect x="3" y="3" width="794" height="654" rx="14" fill="#f8f9fa"/>
<rect x="210" y="16" width="380" height="58" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="400" y="55" font-size="28" fill="#212529" text-anchor="middle">Jak správně odečíst objem</text>
