<svg viewBox="0 0 460 556" width="460" height="556" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Elektrické pole v pohybu 4 ze 4, Nabití elektroskopu indukcí. Záporně nabitá tyč se přiblíží k desce elektroskopu. Ruka se dotkne desky a část elektronů odejde do Země. Nejdřív se odtáhne ruka a teprve potom tyč. Elektroskop zůstane kladně nabitý a ručička vychýlená." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Elektrické pole v pohybu 4/4: Nabití elektroskopu indukcí</title>
  <style>
    .rod { transform: translate(-10px,0); animation: rod 8s ease-in-out infinite; }
    .hand { transform: translate(10px,0); animation: hand 8s ease-in-out infinite; }
    .needle { transform: rotate(34deg); transform-origin: 205px 302px; transform-box: view-box; animation: needle 8s ease-in-out infinite; }
    .needle-positive { transform: rotate(-34deg); transform-origin: 205px 335px; transform-box: view-box; animation: needle-positive 8s ease-in-out infinite; }
    .neutral { opacity: 0; animation: neutral 8s step-end infinite; }
    .polarized { opacity: 0; animation: polarized 8s step-end infinite; }
    .grounded { opacity: 0; animation: grounded 8s step-end infinite; }
    .positive { opacity: 1; animation: positive 8s step-end infinite; }
    .electron-a, .electron-b { opacity: 0; animation: electron-a 8s linear infinite; }
    .electron-b { animation-name: electron-b; }
    .caption-a { opacity: 0; animation: caption-a 8s step-end infinite; }
    .caption-b { opacity: 1; animation: caption-b 8s step-end infinite; }
    .caption-c { opacity: 1; animation: caption-c 8s step-end infinite; }
    .loop-fade { opacity: 0; animation: loop-fade 8s linear infinite; }
    .step1 { fill: #fbfaf6; animation: step1 8s step-end infinite; }
    .step2 { fill: #fbfaf6; animation: step2 8s step-end infinite; }
    .step3 { fill: #fbfaf6; animation: step3 8s step-end infinite; }
    .step4 { fill: #ffd8a8; animation: step4 8s step-end infinite; }
    @keyframes rod { 0%,5% { transform: translate(-10px,0); } 18%,72% { transform: translate(28px,0); } 80%,100% { transform: translate(-10px,0); } }
    @keyframes hand { 0%,24% { transform: translate(10px,0); } 32%,56% { transform: translate(0,0); } 64%,100% { transform: translate(10px,0); } }
    @keyframes needle { 0%,18% { transform: rotate(0deg); } 29%,40% { transform: rotate(34deg); } 54%,82% { transform: rotate(0deg); } 90%,100% { transform: rotate(34deg); } }
    @keyframes needle-positive { 0%,18% { transform: rotate(0deg); } 29%,40% { transform: rotate(-34deg); } 54%,82% { transform: rotate(0deg); } 90%,100% { transform: rotate(-34deg); } }
    @keyframes neutral { 0%,13% { opacity: 1; } 18%,100% { opacity: 0; } }
    @keyframes polarized { 0%,17% { opacity: 0; } 18%,33% { opacity: 1; } 34%,100% { opacity: 0; } }
    @keyframes grounded { 0%,33% { opacity: 0; } 34%,80% { opacity: 1; } 81%,100% { opacity: 0; } }
    @keyframes positive { 0%,80% { opacity: 0; } 81%,100% { opacity: 1; } }
    @keyframes electron-a { 0%,33% { transform: translate(0,0); opacity: 0; } 34% { transform: translate(0,0); opacity: 1; } 36% { transform: translate(0,-64px); opacity: 1; } 38% { transform: translate(0,-70px); opacity: 1; } 40% { transform: translate(42px,-70px); opacity: 1; } 43% { transform: translate(95px,-25px); opacity: 1; } 46% { transform: translate(145px,25px); opacity: 1; } 48% { transform: translate(177px,56px); opacity: 1; } 49% { transform: translate(177px,84px); opacity: 1; } 50%,100% { transform: translate(177px,84px); opacity: 0; } }
    @keyframes electron-b { 0%,33% { transform: translate(0,0); opacity: 0; } 34%,37% { transform: translate(0,0); opacity: 1; } 39% { transform: translate(18px,-27px); opacity: 1; } 42% { transform: translate(18px,-136px); opacity: 1; } 44% { transform: translate(40px,-136px); opacity: 1; } 46% { transform: translate(66px,-136px); opacity: 1; } 49% { transform: translate(113px,-89px); opacity: 1; } 52% { transform: translate(163px,-39px); opacity: 1; } 54% { transform: translate(195px,20px); opacity: 1; } 55%,100% { transform: translate(195px,20px); opacity: 0; } }
    @keyframes caption-a { 0%,33% { opacity: 0; } 34%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
    @keyframes caption-b { 0%,55% { opacity: 0; } 56%,82% { opacity: 1; } 83%,100% { opacity: 0; } }
    @keyframes caption-c { 0%,82% { opacity: 0; } 83%,100% { opacity: 1; } }
    @keyframes loop-fade { 0%,96% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes step1 { 0%,23% { fill: #ffd8a8; } 24%,100% { fill: #fbfaf6; } }
    @keyframes step2 { 0%,23% { fill: #fbfaf6; } 24%,55% { fill: #ffd8a8; } 56%,100% { fill: #fbfaf6; } }
    @keyframes step3 { 0%,55% { fill: #fbfaf6; } 56%,71% { fill: #ffd8a8; } 72%,100% { fill: #fbfaf6; } }
    @keyframes step4 { 0%,71% { fill: #fbfaf6; } 72%,94% { fill: #ffd8a8; } 95%,100% { fill: #fbfaf6; } }
    @media (prefers-reduced-motion: reduce) {
      .rod, .hand, .needle, .needle-positive, .neutral, .polarized, .grounded, .positive, .electron-a, .electron-b, .caption-a, .caption-b, .caption-c, .loop-fade, .step1, .step2, .step3, .step4 { animation: none; }
      .rod { transform: translate(-10px,0); }
      .hand { transform: translate(10px,0); }
      .neutral, .polarized, .grounded, .electron-a, .electron-b, .caption-a, .caption-b, .loop-fade { opacity: 0; }
      .positive, .caption-c { opacity: 1; }
    }
  </style>
