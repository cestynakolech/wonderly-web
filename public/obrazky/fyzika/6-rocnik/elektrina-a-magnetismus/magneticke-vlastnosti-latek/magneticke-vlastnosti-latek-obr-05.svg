<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: dvě ruce drží po tyčovém magnetu. Nahoře jsou k sobě otočeny opačné póly, severní N a jižní S, magnety se přitahují a přiblíží se, až se spojí. Dole jsou k sobě otočeny dva severní póly N, magnety se odpuzují a vzdálí se od sebe. Šipky ukazují směr pohybu. Červeně severní pól N, modře jižní pól S.">
<style>
/* Animace: horní pár (opačné póly k sobě) se přibližuje a spojí, dolní pár (stejné póly) se oddálí. Perioda 5 s.
   Bez animace (prefers-reduced-motion) zůstane výchozí stav + šipky směru síly. */
@keyframes pL { 0%, 12% { transform: translate(0px, 0px); opacity: 1; } 48% { transform: translate(80px, 0px); } 86% { transform: translate(80px, 0px); opacity: 1; } 94% { transform: translate(80px, 0px); opacity: 0; } 95% { transform: translate(0px, 0px); opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 1; } }
@keyframes pR { 0%, 12% { transform: translate(0px, 0px); opacity: 1; } 48% { transform: translate(-80px, 0px); } 86% { transform: translate(-80px, 0px); opacity: 1; } 94% { transform: translate(-80px, 0px); opacity: 0; } 95% { transform: translate(0px, 0px); opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 1; } }
@keyframes oL { 0%, 12% { transform: translate(0px, 0px); opacity: 1; } 48% { transform: translate(-80px, 0px); } 86% { transform: translate(-80px, 0px); opacity: 1; } 94% { transform: translate(-80px, 0px); opacity: 0; } 95% { transform: translate(0px, 0px); opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 1; } }
@keyframes oR { 0%, 12% { transform: translate(0px, 0px); opacity: 1; } 48% { transform: translate(80px, 0px); } 86% { transform: translate(80px, 0px); opacity: 1; } 94% { transform: translate(80px, 0px); opacity: 0; } 95% { transform: translate(0px, 0px); opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 1; } }
.pL { animation: pL 5s ease-in infinite; } .pR { animation: pR 5s ease-in infinite; }
.oL { animation: oL 5s ease-out infinite; } .oR { animation: oR 5s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .pL, .pR, .oL, .oR { animation: none; } }
</style>
