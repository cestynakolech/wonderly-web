<svg xmlns="http://www.w3.org/2000/svg" width="460" height="660" viewBox="0 0 460 660" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Baňka s vodou a otvory po celém obvodu, do baňky vede píst. Když na píst zatlačíme silou F, voda vystříkne všemi sedmi otvory stejně, ne jen ve směru síly. Červené šipky stejné délky ukazují stejný tlak u všech otvorů. Pascalův zákon: tlak vyvolaný vnější silou se v kapalině v uzavřené nádobě šíří všemi směry stejně.">
