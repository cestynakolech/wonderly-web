		@keyframes zd { 0% { transform: scaleX(1); } 90% { transform: scaleX(0); } 97% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
		@keyframes ga { 0% { opacity: 0.45; } 38% { opacity: 0.45; } 40% { opacity: 0; } 97% { opacity: 0; } 100% { opacity: 0.45; } }
		@keyframes gd { 0% { opacity: 0.45; } 88% { opacity: 0.45; } 90% { opacity: 0; } 97% { opacity: 0; } 100% { opacity: 0.45; } }
		@keyframes ba { 0% { fill: #fff9db; } 38% { fill: #fff9db; } 40% { fill: #e9ecef; } 97% { fill: #e9ecef; } 100% { fill: #fff9db; } }
		@keyframes bd { 0% { fill: #fff9db; } 88% { fill: #fff9db; } 90% { fill: #e9ecef; } 97% { fill: #e9ecef; } 100% { fill: #fff9db; } }
		@media (prefers-reduced-motion: reduce) { .za, .zd, .ga, .gd, .ba, .bd, .stejne { animation: none; } }
