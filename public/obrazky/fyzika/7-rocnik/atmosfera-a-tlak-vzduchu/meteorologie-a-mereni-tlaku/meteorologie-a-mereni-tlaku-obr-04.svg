<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Meteorologické přístroje na volném prostranství: bílá meteorologická budka na nohách, teploměr v ní je 2 m nad zemí; na stožáru anemometr s miskami a korouhev; heliograf se skleněnou koulí, která soustředí sluneční paprsky na proužek papíru; srážkoměr s nálevkou a odměrnou nádobou se stupnicí. Animace: misky anemometru se točí ve větru, z mraku prší do srážkoměru a voda v odměrné nádobě stoupá, na papíru heliografu přibývá propálená stopa.">
<style>
/* Předloha: PDF lekce 18, str. 3–4 (meteorologická budka – foto: bílá skříňka se žaluziemi na nohách, na volném prostranství),
   str. 4–5 (srážkoměr: nálevka → odměrná nádoba se stupnicí, mm vodního sloupce), str. 5 (foto stožáru: anemometr s miskami
   vlevo, korouhev vpravo na příčce), str. 6 (heliograf: skleněná koule zaznamenává dobu slunečního svitu).
   Misky: otáčka 1,2 s (pohled z boku, 3 misky po 120°), proužky větru 0,8 s, déšť 1 s, voda a stopa heliografu 8 s.
   Korouhev podle fota str. 5: tyčka se závažím vpředu a ploutví vzadu, bez šipky (ploutev se natočí po větru).
   Barvy jako na celé stránce: vítr šedě, déšť a voda tyrkysově, propálená stopa tmavě hnědě (spálený papír).
   Bez animace = koncový stav: misky rozestavené po 120°, voda v nádobě do poloviny, stopa na papíru zčásti propálená. */
.mi { animation: mi 1.2s linear infinite; }
.m1 { transform: translate(0px, 6px); }
.m2 { transform: translate(29px, -3px); }
.m3 { transform: translate(-29px, -3px); }
.vi { animation: vi 0.8s linear infinite; }
.ka { animation: ka 1s linear infinite; }
.vo { transform-origin: 530px 430px; animation: vo 8s linear infinite; }
.he { animation: he 8s linear infinite; }
@keyframes mi {
  0% { transform: translate(0px, 6px); opacity: 1; } 12.5% { transform: translate(24px, 4px); opacity: 1; }
  25% { transform: translate(34px, 0px); opacity: 0.8; } 37.5% { transform: translate(24px, -4px); opacity: 0.55; }
  50% { transform: translate(0px, -6px); opacity: 0.55; } 62.5% { transform: translate(-24px, -4px); opacity: 0.55; }
  75% { transform: translate(-34px, 0px); opacity: 0.8; } 87.5% { transform: translate(-24px, 4px); opacity: 1; }
  100% { transform: translate(0px, 6px); opacity: 1; } }
@keyframes vi { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -20; } }
@keyframes ka { 0% { transform: translateY(0px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(105px); opacity: 0; } }
@keyframes vo { 0% { transform: scaleY(0.1); } 90% { transform: scaleY(2); } 100% { transform: scaleY(2); } }
@keyframes he { 0% { stroke-dashoffset: 95; } 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .mi, .vi, .ka, .vo, .he { animation: none; } }
</style>
