<svg viewBox="0 2318 460 622" width="460" height="622" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Graf rychlosti a času: na svislé ose rychlost v v m/s od 0 do 9, na vodorovné čas t v s od 0 do 6. Čára prochází body 0 s 0 m/s, 1 s 0 m/s, 2 s 3 m/s, 3 s 8 m/s, 4 s 1 m/s, 5 s 5 m/s a 6 s 5 m/s. Šedá čára na nule znamená klid, zelená stoupá = zrychlený pohyb, červená klesá = zpomalený, modrá vodorovná = rovnoměrný. Tečka jede po grafu a žlutá šipka u osy v ukazuje okamžitou rychlost" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
