<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 732" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: lihový laboratorní teploměr se stupnicí od 0 do 50 stupňů Celsia, nejmenší dílek 1 °C. Teploměr se postupně ponoří do tří kádinek: ve studené vodě ukáže 5 °C, ve vlažné 25 °C a v horké 45 °C. Teplotu odečteme na stupnici u konce červeného sloupce.">
<style>
/* Předloha: PDF Teplota — kapalinový laboratorní teploměr (lihový, červený), odečet na stupnici. Překresleno, ne kopie.
   Čísla z pokusu ve výkladu: studená asi 5 °C, vlažná asi 25 °C, horká asi 45 °C. Stupnice 0–50 °C, nejmenší dílek 1 °C.
   Cyklus 15 s: teploměr se ponoří do studené (sloupec 5 °C), přejede do vlažné (25 °C) a do horké (45 °C);
   vpravo nahoře se ukáže odečtená teplota. Bez animace = koncový stav (horká voda, 45 °C). */
@keyframes jed { 0% { transform: translate(-560px, -130px); } 5%, 30% { transform: translate(-560px, 0); }
  34% { transform: translate(-560px, -130px); } 39% { transform: translate(-280px, -130px); } 43%, 63% { transform: translate(-280px, 0); }
  67% { transform: translate(-280px, -130px); } 72% { transform: translate(0, -130px); } 76%, 94% { transform: translate(0, 0); }
  97% { transform: translate(0, -130px); } 100% { transform: translate(-560px, -130px); } }
@keyframes sl { 0%, 5% { transform: translate(0, 120px); } 15%, 43% { transform: translate(0, 240px); } 53%, 76% { transform: translate(0, 120px); }
  86%, 97% { transform: translate(0, 0); } 100% { transform: translate(0, 120px); } }
@keyframes c5 { 0%, 15% { opacity: 0; } 17%, 31% { opacity: 1; } 33%, 100% { opacity: 0; } }
@keyframes c25 { 0%, 53% { opacity: 0; } 55%, 64% { opacity: 1; } 66%, 100% { opacity: 0; } }
@keyframes c45 { 0%, 86% { opacity: 0; } 88%, 95% { opacity: 1; } 97%, 100% { opacity: 0; } }
.jed { animation: jed 15s ease-in-out infinite; } .sl { animation: sl 15s ease-in-out infinite; }
.c5 { animation: c5 15s linear infinite; } .c25 { animation: c25 15s linear infinite; } .c45 { animation: c45 15s linear infinite; }
@media (prefers-reduced-motion: reduce) { .jed, .sl, .c5, .c25, .c45 { animation: none; } }
</style>
