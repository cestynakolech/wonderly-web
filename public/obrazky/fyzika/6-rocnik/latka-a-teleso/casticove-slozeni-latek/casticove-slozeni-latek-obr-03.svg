<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 505" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: na tmavém snímku ze speciálního mikroskopu je z jednotlivých atomů poskládaný panáček se zdviženou rukou. Vlevo leží jeden samotný atom. Hrot mikroskopu sjede k atomu, přesune ho na konec panáčkovy ruky a zase odjede. Dole: Hrot speciálního mikroskopu posune atom. Z atomů tak vznikl obrázek panáčka.">
<style>
/* Předloha: PDF Částicové složení látek, pro zajímavost (atomy umíme vidět i posunovat, film z atomů; snímek panáčka z atomů). Fotografie překreslena kresbou. Smyčka 9 s: 0–12 % hrot sjede k atomu, 12–55 % přesun atomu, 55–66 % hrot odjede nahoru, 66–85 % hrot se vrací, 90–97 % přesunutý atom zmizí a objeví se na začátku. Bez animace = atom už v ruce panáčka. */
@keyframes atom { 0% { transform: translate(140px, 230px) } 12% { transform: translate(140px, 230px) } 55% { transform: translate(470.9px, 147.1px) } 94% { transform: translate(470.9px, 147.1px) } 95% { transform: translate(140px, 230px) } 100% { transform: translate(140px, 230px) } }
@keyframes atomv { 0% { opacity: 1 } 90% { opacity: 1 } 93% { opacity: 0 } 97% { opacity: 0 } 100% { opacity: 1 } }
@keyframes hrot { 0% { transform: translate(140px, 190px) } 12% { transform: translate(140px, 220px) } 55% { transform: translate(470.9px, 137.1px) } 66% { transform: translate(470.9px, 107.1px) } 85% { transform: translate(140px, 190px) } 100% { transform: translate(140px, 190px) } }
.at { animation: atom 9s ease-in-out infinite; }
.av { animation: atomv 9s linear infinite; }
.hr { animation: hrot 9s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .dr { stroke-dasharray: none !important; } }
</style>
