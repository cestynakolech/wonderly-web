<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: lékařský teploměr, skleněná tyčinka se stupnicí od 35 do 42 stupňů Celsia, dílky po jedné desetině, číslo 37 je červené. Krok 1: teploměr měří a stříbrná rtuť vystoupá ke 37 °C. Krok 2: po sundání z těla ukazuje teplotu dál. Krok 3: pro nové měření se teploměr střepe a rtuť klesne. Měří od 35 °C do 42 °C. Rtuť je jedovatá, při rozbití hrozí otrava.">
<style>
/* Předloha: PDF Teplota — fotografie lékařského teploměru: hranolová skleněná tyčinka, stupnice 35–42 °C
   s dílky po desetinách, číslo 37 červeně, stříbrný sloupec rtuti, zúžení nad baňkou. Překresleno, ne kopie.
   Cyklus 12 s: 5–30 % rtuť vystoupá k 37 °C (měření), 35–60 % po sundání zůstává (ukazuje dál),
   60–75 % teploměr se třepe a rtuť klesne zpět. Šipka vlevo dole ukazuje krok 1, 2, 3.
   Bez animace = stav po sundání (rtuť u 37 °C, šipka u kroku 2). */
@keyframes rt { 0%, 5% { transform: translate(-236px, 0); } 30%, 62% { transform: translate(0, 0); } 75%, 100% { transform: translate(-236px, 0); } }
@keyframes trep { 0%, 60% { transform: translate(0, 0); } 62% { transform: translate(0, -18px); } 64% { transform: translate(0, 18px); }
  66% { transform: translate(0, -18px); } 68% { transform: translate(0, 18px); } 70% { transform: translate(0, -18px); } 72% { transform: translate(0, 18px); } 75%, 100% { transform: translate(0, 0); } }
@keyframes krok { 0%, 33% { transform: translate(0, -48px); } 35%, 58% { transform: translate(0, 0); } 60%, 100% { transform: translate(0, 48px); } }
.rt { animation: rt 12s ease-in-out infinite; } .trep { animation: trep 12s linear infinite; } .krok { animation: krok 12s steps(1, end) infinite; }
@media (prefers-reduced-motion: reduce) { .rt, .trep, .krok { animation: none; } }
</style>
<rect x="3" y="3" width="954" height="554" rx="14" fill="#f8f9fa"/>
<rect x="310" y="16" width="340" height="58" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="480" y="55" font-size="28" fill="#212529" text-anchor="middle">Lékařský teploměr</text>
<defs><linearGradient id="hranol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#e7f5ff"/><stop offset="0.75" stop-color="#f1f3f5"/><stop offset="1" stop-color="#ced4da"/></linearGradient><linearGradient id="rtut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="0.5" stop-color="#868e96"/><stop offset="1" stop-color="#495057"/></linearGradient><clipPath id="kapl"><rect x="100" y="203" width="770" height="6" rx="3"/><rect x="40" y="198" width="70" height="16" rx="8"/></clipPath></defs>
<g class="trep"><path d="M60 160H900Q926 160 926 186V226Q926 252 900 252H60Q32 252 32 226V186Q32 160 60 160Z" fill="url(#hranol)" stroke="#495057" stroke-width="2.5"/>
