<svg viewBox="0 0 460 700" width="460" height="700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zředěný vzduch svítí: skleněná trubice se vzduchem má na obou koncích elektrody, leží na stojanech na stole a je připojená ke zdroji, který stojí na stole. Dokud je v ní hodně vzduchu, nesvítí. Z trubice vyčerpáme část vzduchu (snížíme tlak), zbylé částice získají dost energie k ionizaci, zředěný vzduch vede proud a trubice svítí. Barva světla závisí na druhu plynu. Užití: neonové nápisy, zářivky, výbojky" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Vedení proudu v plynech v pohybu 1/1: Zředěný vzduch svítí</title>
	<style>
		.v1-mA { animation: v1mA 10s linear infinite; }
		.v1-mB { animation: v1mB 10s linear infinite; }
		.v1-mC { animation: v1mC 10s linear infinite; }
		.v1-mD { animation: v1mD 10s linear infinite; }
		@keyframes v1mA { 0%, 15% { opacity: 1; } 18%, 97% { opacity: 0; } 100% { opacity: 1; } }
		@keyframes v1mB { 0%, 23% { opacity: 1; } 26%, 97% { opacity: 0; } 100% { opacity: 1; } }
		@keyframes v1mC { 0%, 31% { opacity: 1; } 34%, 97% { opacity: 0; } 100% { opacity: 1; } }
		@keyframes v1mD { 0%, 39% { opacity: 1; } 42%, 97% { opacity: 0; } 100% { opacity: 1; } }
		.v1-cerp { animation: v1cerp 10s linear infinite; }
		@keyframes v1cerp { 0%, 10% { opacity: 0; } 12%, 46% { opacity: 1; } 48%, 100% { opacity: 0; } }
		.v1-s { animation: v1s 1s linear infinite; }
		.v1-s.d1 { animation-delay: -0.33s; }
		.v1-s.d2 { animation-delay: -0.67s; }
		@keyframes v1s { 0% { transform: translate(0px, 0px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(0px, 40px); opacity: 0; } }
		.v1-zare { animation: v1zare 10s linear infinite; }
		@keyframes v1zare { 0%, 48% { opacity: 0; } 53% { opacity: 1; } 62% { opacity: 0.85; } 70% { opacity: 1; } 80% { opacity: 0.9; } 90%, 95% { opacity: 1; } 97%, 100% { opacity: 0; } }
		.v1-k1 { animation: v1k1 10s linear infinite; }
		.v1-k2 { animation: v1k2 10s linear infinite; }
		.v1-k3 { animation: v1k3 10s linear infinite; }
		@keyframes v1k1 { 0%, 10% { opacity: 1; } 12%, 96% { opacity: 0; } 98%, 100% { opacity: 1; } }
		@keyframes v1k2 { 0%, 10% { opacity: 0; } 12%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
		@keyframes v1k3 { 0%, 48% { opacity: 0; } 50%, 95% { opacity: 1; } 97%, 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .v1-mA, .v1-mB, .v1-mC, .v1-mD, .v1-cerp, .v1-s, .v1-zare, .v1-k1, .v1-k2, .v1-k3 { animation: none; } }
	</style>
	<rect x="0" y="0" width="460" height="700" fill="#f8f9fa"/>
	<g id="pohyb-panel-1">
		<rect x="26" y="16" width="420" height="676" rx="12" fill="#dee2e6"/>
		<rect x="20" y="10" width="420" height="676" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/>
		<circle cx="52" cy="44" r="17" fill="#2b2a26"/>
		<text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
		<text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Zředěný vzduch svítí</text>
		<text x="34" y="92" font-size="21" fill="#2b2a26">Vyčerpáme část vzduchu (snížíme tlak).</text>
		<text x="34" y="120" font-size="21" fill="#2b2a26">Zbylé částice se ionizují a trubice svítí.</text>

		<!-- scéna -->
		<rect x="34" y="136" width="392" height="300" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="2"/>

		<!-- stůl v šikmém pohledu -->
		<polygon points="46,362 392,362 422,318 76,318" fill="#e9d8b4" stroke="#b08d57" stroke-width="2" stroke-linejoin="round"/>
		<polygon points="46,362 392,362 392,374 46,374" fill="#c9a66b" stroke="#b08d57" stroke-width="2" stroke-linejoin="round"/>
		<polygon points="392,362 422,318 422,330 392,374" fill="#b08d57"/>

		<!-- zdroj (kvádr stojící na stole) a vodiče -->
		<path d="M61,230 L52,230 L52,357 L254,357 L254,338 L262,338" fill="none" stroke="#343a40" stroke-width="3" stroke-linejoin="round"/>
		<path d="M399,230 L406,230 L406,334 L396,348 L336,348" fill="none" stroke="#343a40" stroke-width="3" stroke-linejoin="round"/>
		<polygon points="262,322 330,322 342,314 274,314" fill="#868e96" stroke="#495057" stroke-width="1.5" stroke-linejoin="round"/>
		<polygon points="330,322 342,314 342,342 330,350" fill="#343a40"/>
		<rect x="262" y="322" width="68" height="28" fill="#495057"/>
		<text x="296" y="342" font-size="18" text-anchor="middle" fill="#fff">zdroj</text>
		<circle cx="52" cy="286" r="11" fill="#fff" stroke="#343a40" stroke-width="2"/>
		<text x="52" y="293" font-size="20" font-weight="bold" text-anchor="middle" fill="#2b2a26">−</text>
		<circle cx="406" cy="286" r="11" fill="#fff" stroke="#343a40" stroke-width="2"/>
		<text x="406" y="293" font-size="20" font-weight="bold" text-anchor="middle" fill="#2b2a26">+</text>
		<text x="64" y="195" font-size="18" fill="#495057">trubice se vzduchem</text>

		<!-- stojany trubice -->
		<path d="M100,256 L100,336 M374,256 L374,336" stroke="#868e96" stroke-width="5" stroke-linecap="round"/>
		<ellipse cx="100" cy="338" rx="16" ry="5" fill="#495057"/>
		<ellipse cx="374" cy="338" rx="16" ry="5" fill="#495057"/>

		<!-- přístroj na vyčerpání vzduchu (kvádr na stole, bez názvu) a hadice -->
		<polygon points="120,312 216,312 230,302 134,302" fill="#adb5bd" stroke="#495057" stroke-width="1.5" stroke-linejoin="round"/>
		<polygon points="216,312 230,302 230,342 216,352" fill="#495057"/>
		<rect x="120" y="312" width="96" height="40" fill="#868e96" stroke="#495057" stroke-width="1.5"/>
		<rect x="159" y="254" width="18" height="16" fill="#e7f5ff" stroke="#adb5bd" stroke-width="2"/>
		<path d="M168,270 L168,306" stroke="#343a40" stroke-width="8"/>
		<g class="v1-cerp" opacity="0">
			<circle class="v1-s" cx="168" cy="260" r="5" fill="#868e96"/>
			<circle class="v1-s d1" cx="168" cy="260" r="5" fill="#868e96"/>
			<circle class="v1-s d2" cx="168" cy="260" r="5" fill="#868e96"/>
			<path d="M196,262 L196,296 M188,286 L196,298 L204,286" fill="none" stroke="#1971c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
			<text x="210" y="290" font-size="18" fill="#1971c2">vyčerpání</text>
		</g>

		<!-- trubice: záře -->
		<g class="v1-zare">
			<rect x="62" y="200" width="336" height="60" rx="30" fill="#e5dbff" opacity="0.7"/>
			<rect x="70" y="204" width="320" height="52" fill="#b197fc"/>
			<ellipse cx="390" cy="230" rx="9" ry="26" fill="#b197fc"/>
			<rect x="86" y="220" width="290" height="16" rx="8" fill="#f3f0ff"/>
		</g>
		<!-- skleněná trubice (válec v šikmém pohledu) -->
		<path d="M70,204 L390,204 A9,26 0 0 1 390,256 L70,256" fill="#e7f5ff" fill-opacity="0.35" stroke="#868e96" stroke-width="2.5"/>
		<ellipse cx="70" cy="230" rx="9" ry="26" fill="#e7f5ff" fill-opacity="0.5" stroke="#868e96" stroke-width="2.5"/>
		<path d="M88,212 L378,212" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
		<!-- elektrody -->
		<rect x="78" y="216" width="10" height="28" rx="2" fill="#495057"/>
		<rect x="372" y="216" width="10" height="28" rx="2" fill="#495057"/>
		<line x1="61" y1="230" x2="78" y2="230" stroke="#343a40" stroke-width="3"/>
		<line x1="382" y1="230" x2="399" y2="230" stroke="#343a40" stroke-width="3"/>

		<!-- částice plynu -->
		<g fill="#868e96">
			<circle cx="130" cy="216" r="6"/>
			<circle cx="256" cy="236" r="6"/>
			<circle cx="312" cy="218" r="6"/>
			<circle cx="196" cy="238" r="6"/>
			<g class="v1-mA" opacity="0"><circle cx="108" cy="238" r="6"/><circle cx="282" cy="226" r="6"/></g>
			<g class="v1-mB" opacity="0"><circle cx="160" cy="218" r="6"/><circle cx="344" cy="240" r="6"/></g>
			<g class="v1-mC" opacity="0"><circle cx="224" cy="220" r="6"/><circle cx="354" cy="216" r="6"/></g>
			<g class="v1-mD" opacity="0"><circle cx="170" cy="240" r="6"/><circle cx="292" cy="244" r="6"/></g>
		</g>
		<text x="230" y="414" font-size="18" text-anchor="middle" fill="#495057">šedé tečky = částice plynu</text>

		<!-- kroky děje -->
		<rect class="v1-k1" x="34" y="450" width="392" height="32" rx="6" fill="#fff3bf" opacity="0"/>
		<rect class="v1-k2" x="34" y="486" width="392" height="32" rx="6" fill="#fff3bf" opacity="0"/>
		<rect class="v1-k3" x="34" y="522" width="392" height="32" rx="6" fill="#fff3bf"/>
		<text x="44" y="473" font-size="20" fill="#2b2a26"><tspan font-weight="bold">1.</tspan> Vzduchu je hodně: trubice nesvítí.</text>
		<text x="44" y="509" font-size="20" fill="#2b2a26"><tspan font-weight="bold">2.</tspan> Z trubice vyčerpáme část vzduchu.</text>
		<text x="44" y="545" font-size="20" fill="#2b2a26"><tspan font-weight="bold">3.</tspan> Zředěný vzduch vede proud a svítí.</text>
		<text x="34" y="604" font-size="19" fill="#2b2a26"><tspan font-weight="bold">Barva</tspan> světla závisí na druhu plynu.</text>
		<text x="34" y="644" font-size="19" fill="#2b2a26"><tspan font-weight="bold">Užití:</tspan> neonové nápisy, zářivky, výbojky.</text>
	</g>
</svg>
