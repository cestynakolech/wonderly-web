<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: vlevo hustoměr s popisky stupnice, baňka a zátěž. Vpravo dva válce: ve vodě se hustoměr ponoří víc, ve slané vodě, která je hustší, se ponoří méně. Oko čte údaj u hladiny. Čím hustší kapalina, tím méně se hustoměr ponoří.">
<style>
/* Předloha: PDF Hustota — fotky hustoměru (skleněná trubička se stupnicí, baňka, tmavá zátěž; hustoměr v kapalině v odměrce)
   a nákres: hustoměr ve válci s kapalinou na podstavci, oko s čárkovanou čarou k hladině. Překresleno, ne kopie.
   Doplněno srovnání dvou kapalin podle textu „čím má kapalina větší hustotu, tím méně se hustoměr ponoří (v moři se ponoříme méně
   než v bazénu)“ — vlevo voda, vpravo slaná voda; čísla hustot se neuvádějí. Cyklus 8 s: hustoměry se spustí do kapalin,
   zhoupnou a ustálí (ve slané vodě o 40 px výš). Bez animace = koncový stav. */
@keyframes h { 0% { transform: translate(0, -150px); opacity: 0; } 5%, 10% { transform: translate(0, -150px); opacity: 1; } 34% { transform: translate(0, 18px); } 46% { transform: translate(0, -8px); } 56%, 94% { transform: translate(0, 0); opacity: 1; } 99%, 100% { transform: translate(0, 0); opacity: 0; } }
.h1, .h2 { animation: h 8s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .h1, .h2 { animation: none; } }
</style>
