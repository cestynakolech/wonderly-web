<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 650" width="460" height="650" role="img" aria-label="Sluneční vítr a polární záře. Oranžové tečky jsou částice ze Slunce. Většinu pole Země odkloní. Část částic se u Země stočí podél šedých čar pole k pólům a tam vznikne fialová polární záře. Schéma není v měřítku.">
<title>Magnety 2/3: Sluneční vítr a polární záře</title><desc>Oranžové tečky jsou částice ze Slunce. Většinu pole Země odkloní. Část částic se u Země stočí podél šedých čar pole k pólům a tam vznikne fialová polární záře. Schéma není v měřítku.</desc>
<defs><radialGradient id="earth" cx="30%" cy="25%"><stop stop-color="#e0f5ff"/><stop offset=".7" stop-color="#66add9"/><stop offset="1" stop-color="#276b9a"/></radialGradient><radialGradient id="sun"><stop stop-color="#fff3a5"/><stop offset="1" stop-color="#f6ab28"/></radialGradient>
