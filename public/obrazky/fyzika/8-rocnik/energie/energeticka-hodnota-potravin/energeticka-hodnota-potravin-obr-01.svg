<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dva talíře na dřevěném stole. Na levém talíři jsou potraviny z rostlin: červené jablko, bochník chleba a mrkev. Na pravém talíři jsou potraviny ze živočichů: vejce, kousek sýra a sklenice mléka. Pod nadpisem věta: Z potravy získává člověk energii.">
<!-- Předloha: PDF „Energetická hodnota potravin“ (8/2 Energie/6), s. 1, odrážky „Člověk získává energii hlavně z potravy“ a „Potravu tvoří rostliny a živočichové“. PDF na straně nemá obrázek, kresba ilustruje text strany. -->
<defs>
<radialGradient id="jab" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ff8787"/><stop offset="1" stop-color="#c92a2a"/></radialGradient>
<linearGradient id="chl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8a25c"/><stop offset="1" stop-color="#a0612b"/></linearGradient>
<linearGradient id="syr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#f2b705"/></linearGradient>
<linearGradient id="stul" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a066"/><stop offset="1" stop-color="#b07a43"/></linearGradient>
</defs>
<rect x="3" y="3" width="714" height="474" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="360" y="46" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Potrava pochází z rostlin a ze živočichů</text>
<!-- stůl -->
<rect x="20" y="250" width="680" height="120" rx="10" fill="url(#stul)"/>
<path d="M40 280 H680 M40 312 H680 M40 344 H680" stroke="#8a5a2b" stroke-width="2" opacity="0.45"/>
<!-- talíře -->
<ellipse cx="190" cy="282" rx="160" ry="46" fill="#dee2e6"/>
<ellipse cx="190" cy="276" rx="160" ry="46" fill="#ffffff" stroke="#adb5bd" stroke-width="3"/>
<ellipse cx="190" cy="276" rx="112" ry="30" fill="none" stroke="#e9ecef" stroke-width="3"/>
<ellipse cx="530" cy="282" rx="160" ry="46" fill="#dee2e6"/>
<ellipse cx="530" cy="276" rx="160" ry="46" fill="#ffffff" stroke="#adb5bd" stroke-width="3"/>
<ellipse cx="530" cy="276" rx="112" ry="30" fill="none" stroke="#e9ecef" stroke-width="3"/>
<!-- LEVÝ TALÍŘ: z rostlin -->
<!-- chléb -->
<g transform="translate(205,250)">
<ellipse cx="0" cy="26" rx="62" ry="10" fill="#000" opacity="0.12"/>
<path d="M-60,24 C-66,-22 -32,-46 0,-46 C32,-46 66,-22 60,24 Z" fill="url(#chl)" stroke="#7a4a1f" stroke-width="3"/>
<path d="M-30,-30 q10,14 4,30 M-6,-38 q10,14 4,30 M18,-34 q10,14 4,30" fill="none" stroke="#fff3e0" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
</g>
<!-- jablko -->
<g transform="translate(110,250)">
<ellipse cx="0" cy="30" rx="36" ry="8" fill="#000" opacity="0.12"/>
<path d="M0,-24 C18,-40 46,-26 42,4 C40,32 18,40 0,32 C-18,40 -40,32 -42,4 C-46,-26 -18,-40 0,-24 Z" fill="url(#jab)" stroke="#8b1a1a" stroke-width="3"/>
<path d="M0,-24 q2,-14 8,-22" fill="none" stroke="#5c3d1e" stroke-width="4" stroke-linecap="round"/>
<path d="M6,-40 q18,-14 30,-4 q-14,14 -30,4 Z" fill="#40c057" stroke="#2b8a3e" stroke-width="2"/>
<ellipse cx="-18" cy="-8" rx="8" ry="12" fill="#ffffff" opacity="0.45"/>
</g>
<!-- mrkev -->
<g transform="translate(236,298) rotate(-80)">
<path d="M-8,-58 L8,-58 L2,48 Q0,54 -2,48 Z" fill="#ff922b" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/>
<path d="M-4,-36 h7 M-3,-14 h6 M-2,8 h5 M-1,28 h3" stroke="#c2410c" stroke-width="2"/>
<path d="M0,-58 q-14,-22 -6,-34 M0,-58 q2,-24 10,-32 M0,-58 q12,-16 22,-18" fill="none" stroke="#2b8a3e" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- PRAVÝ TALÍŘ: ze živočichů -->
<!-- sklenice mléka -->
<g transform="translate(615,218)">
<ellipse cx="0" cy="62" rx="30" ry="7" fill="#000" opacity="0.12"/>
<path d="M-30,-56 L-24,60 L24,60 L30,-56 Z" fill="#e7f5ff" stroke="#74c0fc" stroke-width="3"/>
<path d="M-28,-30 L-23,56 L23,56 L28,-30 Z" fill="#ffffff" stroke="#ced4da" stroke-width="2"/>
<ellipse cx="0" cy="-30" rx="28" ry="5" fill="#f1f3f5" stroke="#ced4da" stroke-width="2"/>
<path d="M-18,-48 L-14,48" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
</g>
<!-- sýr -->
<g transform="translate(535,258)">
<ellipse cx="0" cy="24" rx="58" ry="8" fill="#000" opacity="0.12"/>
<path d="M-54,20 L-54,-10 L44,-30 L54,-6 L54,20 Z" fill="url(#syr)" stroke="#b08900" stroke-width="3" stroke-linejoin="round"/>
<path d="M-54,-10 L44,-30 L54,-6 L-44,10 Z" fill="#fff3bf" stroke="#b08900" stroke-width="3" stroke-linejoin="round"/>
<circle cx="-26" cy="4" r="7" fill="#e0a800"/><circle cx="8" cy="12" r="5" fill="#e0a800"/><circle cx="30" cy="-2" r="6" fill="#e0a800"/>
</g>
<!-- vejce -->
<g transform="translate(450,248)">
<ellipse cx="0" cy="34" rx="26" ry="7" fill="#000" opacity="0.12"/>
<ellipse cx="0" cy="0" rx="27" ry="35" fill="#fff8f0" stroke="#c9a27e" stroke-width="3"/>
<ellipse cx="-9" cy="-12" rx="7" ry="11" fill="#ffffff"/>
</g>
<!-- popisky -->
<rect x="75" y="384" width="230" height="40" rx="12" fill="#ffffff" stroke="#2b8a3e" stroke-width="3"/>
<text x="190" y="412" font-size="24" font-weight="bold" fill="#1e6b30" text-anchor="middle">z rostlin</text>
<rect x="400" y="384" width="260" height="40" rx="12" fill="#ffffff" stroke="#1864ab" stroke-width="3"/>
<text x="530" y="412" font-size="24" font-weight="bold" fill="#1864ab" text-anchor="middle">ze živočichů</text>
<text x="190" y="456" font-size="20" fill="#212529" text-anchor="middle">jablko, chléb, mrkev</text>
<text x="530" y="456" font-size="20" fill="#212529" text-anchor="middle">vejce, sýr, mléko</text>
<text x="360" y="90" font-size="22" fill="#212529" text-anchor="middle">Z potravy získává člověk energii.</text>
</svg>
