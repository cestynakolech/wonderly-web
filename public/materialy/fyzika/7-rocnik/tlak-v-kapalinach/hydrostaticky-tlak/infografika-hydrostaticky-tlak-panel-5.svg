	<text x="40" y="92" font-size="19" fill="#2b2a26">Hráz přehrady je dole širší.</text><polygon points="40,110 286.9,110 232,290 40,290" fill="#74c0fc" opacity="0.8"/><line x1="40" y1="110" x2="286.9" y2="110" stroke="#1c7ed6" stroke-width="2.5"/><polygon points="232,290 290,100 312,100 420,290" fill="#adb5bd" stroke="#2b2a26" stroke-width="2.5" stroke-linejoin="round"/><rect x="36" y="290" width="388" height="10" fill="#8d6e4a"/><line class="p5-s0" x1="240" y1="155" x2="271" y2="155" stroke="#e03131" stroke-width="5" marker-end="url(#p5r)"/><line class="p5-s1" x1="195" y1="200" x2="257" y2="200" stroke="#e03131" stroke-width="5" marker-end="url(#p5r)"/><line class="p5-s2" x1="150" y1="245" x2="244" y2="245" stroke="#e03131" stroke-width="5" marker-end="url(#p5r)"/><line class="p5-s3" x1="119" y1="276" x2="234" y2="276" stroke="#e03131" stroke-width="5" marker-end="url(#p5r)"/><line x1="56" y1="114" x2="56" y2="286" stroke="#2b2a26" stroke-width="1.5" marker-start="url(#sip)" marker-end="url(#sip)"/><text x="64" y="206.0" font-size="17" font-weight="bold" fill="#2b2a26">60 m</text><text x="40" y="330" font-size="18" fill="#2b2a26">Na dně: 60 · 1 000 · 10 = <tspan font-weight="bold" fill="#b8460b">600 000 Pa</tspan></text><text x="40" y="356" font-size="18" font-weight="bold" fill="#2b2a26">U dna tlačí voda nejvíc.</text><line x1="40" y1="380" x2="420" y2="380" stroke="#dee2e6" stroke-width="2"/><text x="40" y="412" font-size="19" fill="#2b2a26">Vodojem stojí výš než domy.</text><path d="M40 600 L40 540 Q90 518 140 540 Q190 580 240 600 Z" fill="#8ce99a" stroke="#2f9e44" stroke-width="2"/><rect x="36" y="600" width="388" height="14" fill="#8d6e4a"/><rect x="84" y="486" width="12" height="52" fill="#868e96"/><rect x="56" y="432" width="68" height="54" rx="6" fill="#f1f3f5" stroke="#2b2a26" stroke-width="2.5"/><rect x="59" y="446" width="62" height="37" fill="#74c0fc"/><line x1="59" y1="446" x2="420" y2="446" stroke="#1c7ed6" stroke-width="1.5" stroke-dasharray="6 6"/><t