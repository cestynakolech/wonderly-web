<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 530" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Železo v přírodě je směs izotopů: nejvíc je železa 56, méně železa 54, 57 a 58. Relativní atomová hmotnost jednoho nuklidu je celé číslo, železo 56 má 56. Železa jako prvku je to průměr všech izotopů, 55,85, proto je v tabulkách desetinné číslo. Animace: atomy železa se postupně objevují.">
<style>
.k0 { animation: k0 9s linear infinite; } @keyframes k0 { 0%, 4% { opacity: 0; } 8%, 100% { opacity: 1; } }
.k1 { animation: k1 9s linear infinite; } @keyframes k1 { 0%, 10% { opacity: 0; } 14%, 100% { opacity: 1; } }
.k2 { animation: k2 9s linear infinite; } @keyframes k2 { 0%, 16% { opacity: 0; } 20%, 100% { opacity: 1; } }
.k3 { animation: k3 9s linear infinite; } @keyframes k3 { 0%, 22% { opacity: 0; } 26%, 100% { opacity: 1; } }
.k4 { animation: k4 9s linear infinite; } @keyframes k4 { 0%, 28% { opacity: 0; } 32%, 100% { opacity: 1; } }
.k5 { animation: k5 9s linear infinite; } @keyframes k5 { 0%, 34% { opacity: 0; } 38%, 100% { opacity: 1; } }
.k6 { animation: k6 9s linear infinite; } @keyframes k6 { 0%, 40% { opacity: 0; } 44%, 100% { opacity: 1; } }
.k7 { animation: k7 9s linear infinite; } @keyframes k7 { 0%, 46% { opacity: 0; } 50%, 100% { opacity: 1; } }
.k8 { animation: k8 9s linear infinite; } @keyframes k8 { 0%, 52% { opacity: 0; } 56%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .k0, .k1, .k2, .k3, .k4, .k5, .k6, .k7, .k8 { animation: none; } }
/* Předloha: PDF lekce 17, s. 11 – „Chemický prvek: Železo Fe, Relativní atomová hmotnost železa: 55,85“
   a hromádka oranžových kuliček s izotopy. PDF tam má jen ⁵⁸Fe a ⁵⁹Fe (⁵⁹Fe v přírodě není, průměr 55,85
   z nich vyjít nemůže) – kresleno podle výkladu: nejvíc ⁵⁶Fe, dál ⁵⁴Fe, ⁵⁷Fe, ⁵⁸Fe. Poměr kuliček je jen
   naznačený. Smyčka 9 s: kuličky se postupně objeví. Bez animace = vše vidět. */
</style>
<rect x="3" y="3" width="594" height="524" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="42" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Proč není A<tspan font-size="19" dy="7">r</tspan><tspan dy="-7"> celé číslo</tspan></text>
<g class="k0"><circle cx="110" cy="210" r="44" fill="#ffe8cc" stroke="#d9480f" stroke-width="2.5"/><text x="100" y="202" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">56</text><text x="102" y="223" font-size="34" font-weight="bold" fill="#212529">Fe</text></g><g class="k1"><circle cx="200" cy="190" r="44" fill="#ffe8cc" stroke="#d9480f" stroke-width="2.5"/><text x="190" y="182" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">54</text><text x="192" y="203" font-size="34" font-weight="bold" fill="#212529">Fe</text></g><g class="k2"><circle cx="290" cy="206" r="44" fill="#ffe8cc" stroke="#d9480f" stroke-width="2.5"/><text x="280" y="198" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">56</text><text x="282" y="219" font-size="34" font-weight="bold" fill="#212529">Fe</text></g><g class="k3"><circle cx="380" cy="188" r="44" fill="#ffe8cc" stroke="#d9480f" stroke-width="2.5"/><text x="370" y="180" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">56</text><text x="372" y="201" font-size="34" font-weight="bold" fill="#212529">Fe</text></g><g class="k4"><circle cx="470" cy="210" r="44" fill="#ffe8cc" stroke="#d9480f" stroke-width="2.5"/><text x="460" y="202" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">57</text><text x="462" y="223" font-size="34" font-weight="bold" fill="#212529">Fe</text></g><g class="k5"><circle cx="150" cy="290" r="44" fill="#ffe8cc" stroke="#d9480f" stroke-width="2.5"/><text x="140" y="282" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">56</text><text x="142" y="303" font-size="34" font-weight="bold" fill="#212529">Fe</text></g><g class="k6"><circle cx="240" cy="284" r="44" fill="#ffe8cc" stroke="#d9480f" stroke-width="2.5"/><text x="230" y="276" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">56</text><text x="232" y="297" font-size="34" font-weight="bold" fill="#212529">Fe</text></g><g class="k7"><circle cx="330" cy="290" r="44" fill="#ffe8cc" stroke="#d9480f" stroke-width="2.5"/><text x="320" y="282" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">58</text><text x="322" y="303" font-size="34" font-weight="bold" fill="#212529">Fe</text></g><g class="k8"><circle cx="420" cy="284" r="44" fill="#ffe8cc" stroke="#d9480f" stroke-width="2.5"/><text x="410" y="276" font-size="18" font-weight="bold" fill="#212529" text-anchor="end">56</text><text x="412" y="297" font-size="34" font-weight="bold" fill="#212529">Fe</text></g><text x="300" y="92" font-size="22" fill="#212529" text-anchor="middle">Železo Fe v přírodě je směs izotopů.</text><text x="300" y="122" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Nejvíc je <tspan font-size="15" dy="-9">56</tspan><tspan dy="9">Fe.</tspan></text><rect x="22" y="356" width="556" height="150" rx="12" fill="#fff9db" stroke="#e67700" stroke-width="2.5"/><text x="300" y="393" font-size="20" fill="#212529" text-anchor="middle">Relativní atomová hmotnost jednoho nuklidu</text><text x="300" y="423" font-size="20" fill="#212529" text-anchor="middle">je celé číslo: <tspan font-size="15" dy="-9">56</tspan><tspan dy="9">Fe má 56.</tspan></text><text x="300" y="453" font-size="20" fill="#212529" text-anchor="middle">Železa jako prvku je to průměr všech izotopů:</text><text x="300" y="483" font-size="20" fill="#212529" text-anchor="middle"><tspan font-weight="bold">55,85</tspan> – proto desetinné číslo.</text>
</svg>
