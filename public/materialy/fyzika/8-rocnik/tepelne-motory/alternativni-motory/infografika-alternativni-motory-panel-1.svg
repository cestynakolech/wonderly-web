<svg viewBox="0 120 460 670" width="460" height="670" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wankelův motor: v oválné komoře se místo pístu otáčí trojúhelníkový rotor; nahoře vlevo sací kanál a sání, nahoře vpravo stlačení, vpravo dvě zapalovací svíčky a dole vpravo výbuch, dole vlevo výfuk a výfukový kanál; ve třech komorách mezi rotorem a skříní běží současně různé doby, každá komora jinou; výhoda hladký a klidný chod, nevýhoda těžké těsnění a vyšší spotřeba" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Alternativní motory a pohony 1/5: Wankelův motor</title>
