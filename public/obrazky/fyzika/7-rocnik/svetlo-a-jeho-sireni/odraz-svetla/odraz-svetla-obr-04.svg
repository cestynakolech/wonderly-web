<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Zrcadlo leží na kruhovém úhloměru, svislá čára přes nulu je kolmice dopadu. Svítilna posílá paprsek na zrcadlo pod úhlem 30 stupňů od kolmice a paprsek se odrazí také pod úhlem 30 stupňů. Animace: nejdřív paprsek dopadá kolmo, pod úhlem 0 stupňů, a vrací se zpátky stejnou cestou; pak se svítilna natočí na 30 stupňů.">
<style>
/* Animace (12 s, smyčka):
   A) dopad 0°: paprsek dolů (4–14 %), zpět nahoru stejnou cestou (16–26 %), text (26 %), zmizí (40–43 %);
   B) svítilna se natočí o 30° (44–50 %), paprsek dopadne (52–64 %), úhel α (65 %), odraz (66–78 %), úhel α′ a text (80 %),
   zmizí (95–98 %), svítilna se vrátí (97–100 %).
   Bez animace (prefers-reduced-motion) = koncový stav B (dopad 30°, odraz 30°) podle atributů. */
.lampa { transform-origin: 300px 300px; animation: lampa 12s ease-in-out infinite; }
.f0 { animation: f0 12s linear infinite; }
.p0in { stroke-dasharray: 100; animation: p0in 12s linear infinite; }
.p0out { stroke-dasharray: 100; animation: p0out 12s linear infinite; }
.a0in { animation: a0in 12s linear infinite; }
.a0out { animation: a0out 12s linear infinite; }
.t0 { animation: t0 12s linear infinite; }
.f30 { animation: f30 12s linear infinite; }
.pin { stroke-dasharray: 100; animation: pin 12s linear infinite; }
.pout { stroke-dasharray: 100; animation: pout 12s linear infinite; }
.ain { animation: ain 12s linear infinite; }
.aout { animation: aout 12s linear infinite; }
@keyframes lampa { 0%, 44% { transform: rotate(0deg); } 50%, 97% { transform: rotate(-30deg); } 100% { transform: rotate(0deg); } }
@keyframes f0 { 0%, 40% { opacity: 1; } 43%, 100% { opacity: 0; } }
@keyframes p0in { 0%, 4% { stroke-dashoffset: 100; } 14%, 100% { stroke-dashoffset: 0; } }
@keyframes p0out { 0%, 16% { stroke-dashoffset: 100; } 26%, 100% { stroke-dashoffset: 0; } }
@keyframes a0in { 0%, 9% { opacity: 0; } 10%, 100% { opacity: 1; } }
@keyframes a0out { 0%, 22% { opacity: 0; } 23%, 100% { opacity: 1; } }
@keyframes t0 { 0%, 26% { opacity: 0; } 28%, 100% { opacity: 1; } }
@keyframes f30 { 0%, 50% { opacity: 0; } 51%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }
@keyframes pin { 0%, 52% { stroke-dashoffset: 100; } 64%, 100% { stroke-dashoffset: 0; } }
@keyframes ain { 0%, 64% { opacity: 0; } 65%, 100% { opacity: 1; } }
@keyframes pout { 0%, 66% { stroke-dashoffset: 100; } 78%, 100% { stroke-dashoffset: 0; } }
@keyframes aout { 0%, 79% { opacity: 0; } 80%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .lampa, .f0, .p0in, .p0out, .a0in, .a0out, .t0, .f30, .pin, .pout, .ain, .aout { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="554" rx="14" fill="#e9ecef" stroke="#2b2a26" stroke-width="3"/>
<text x="300" y="38" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Úhly měříme od kolmice</text>

<!-- kruhový úhloměr: střed C = (300, 300), poloměr 160; stupnice po 10°, popisky 0, 30, 60, 90 -->
<circle cx="300" cy="300" r="160" fill="#ffffff" stroke="#212529" stroke-width="3"/>
<path d="M300,140 L300,156 M327.8,142.4 L326.2,151.3 M354.7,149.6 L351.6,158.1 M380,161.4 L372,175.3 M402.8,177.4 L397.1,184.3 M422.6,197.2 L415.7,202.9 M438.6,220 L424.7,228 M450.4,245.3 L441.9,248.4 M457.6,272.2 L448.7,273.8 M460,300 L444,300 M457.6,327.8 L448.7,326.2 M450.4,354.7 L441.9,351.6 M438.6,380 L424.7,372 M422.6,402.8 L415.7,397.1 M402.8,422.6 L397.1,415.7 M380,438.6 L372,424.7 M354.7,450.4 L351.6,441.9 M327.8,457.6 L326.2,448.7 M300,460 L300,444 M272.2,457.6 L273.8,448.7 M245.3,450.4 L248.4,441.9 M220,438.6 L228,424.7 M197.2,422.6 L202.9,415.7 M177.4,402.8 L184.3,397.1 M161.4,380 L175.3,372 M149.6,354.7 L158.1,351.6 M142.4,327.8 L151.3,326.2 M140,300 L156,300 M142.4,272.2 L151.3,273.8 M149.6,245.3 L158.1,248.4 M161.4,220 L175.3,228 M177.4,197.2 L184.3,202.9 M197.2,177.4 L202.9,184.3 M220,161.4 L228,175.3 M245.3,149.6 L248.4,158.1 M272.2,142.4 L273.8,151.3" stroke="#212529" stroke-width="2.5"/>
<!-- kolmice dopadu (0–0) a vodorovná čára (90–90) -->
<line x1="300" y1="140" x2="300" y2="460" stroke="#495057" stroke-width="1.5"/>
<line x1="140" y1="300" x2="460" y2="300" stroke="#495057" stroke-width="1.5"/>
<!-- zrcadlo: odrazná plocha prochází středem úhloměru -->
<rect x="200" y="300" width="200" height="34" fill="#343a40"/>
<text x="300" y="325" font-size="22" fill="#ffffff" text-anchor="middle">zrcadlo</text>

<!-- svítilna: nakreslená nad kolmicí, atributem natočená na 30° (koncový stav) -->
<g class="lampa" transform="rotate(-30)">
<rect x="282" y="62" width="36" height="62" rx="5" fill="#343a40"/>
<path d="M276,124 H324 L318,140 H282 Z" fill="#495057"/>
<line x1="284" y1="139" x2="316" y2="139" stroke="#ffd43b" stroke-width="4"/>
</g>

<!-- A) dopad 0° — v koncovém stavu skryté (opacity 0), animace je ukáže na začátku smyčky -->
<g class="f0" opacity="0">
<line class="p0in" pathLength="100" x1="300" y1="141" x2="300" y2="300" stroke="#e8590c" stroke-width="5"/>
<line class="p0out" pathLength="100" x1="300" y1="300" x2="300" y2="141" stroke="#ffa94d" stroke-width="5"/>
<polygon class="a0in" points="300,250 292,232 308,232" fill="#e8590c"/>
<polygon class="a0out" points="300,186 308,204 292,204" fill="#e8590c"/>
<g class="t0">
<text x="300" y="500" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">dopad 0° → odraz 0°</text>
<text x="300" y="532" font-size="22" fill="#212529" text-anchor="middle">paprsek se vrátí zpátky stejnou cestou</text>
</g>
</g>

<!-- B) dopad 30° → odraz 30° (koncový stav) -->
<g class="f30">
<g class="ain">
<path d="M300,300 L262.5,235 A75,75 0 0 1 300,225 Z" fill="#d0ebff" stroke="#1864ab" stroke-width="2"/>
<text x="286" y="262" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">α</text>
</g>
<g class="aout">
<path d="M300,300 L300,225 A75,75 0 0 1 337.5,235 Z" fill="#d0ebff" stroke="#1864ab" stroke-width="2"/>
<text x="315" y="262" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">α′</text>
</g>
<line class="pin" pathLength="100" x1="220" y1="161.4" x2="293" y2="287.9" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/>
<line class="pout" pathLength="100" x1="300" y1="300" x2="373" y2="173.5" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/>
<polygon class="ain" points="300,300 284.1,288.4 297.9,280.4" fill="#e8590c"/>
<polygon class="aout" points="380,161.4 377.9,181 364.1,173" fill="#e8590c"/>
<g class="aout">
<text x="300" y="500" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">dopad α = 30° → odraz α′ = 30°</text>
<text x="300" y="532" font-size="22" fill="#212529" text-anchor="middle">oba úhly měříme od kolmice (čára přes 0)</text>
</g>
</g>
<!-- popisky stupnice až NAD paprsky (bílé lemování), popisky 30 posunuté na 34° od paprsků na 30° -->
<g font-size="22" font-weight="bold" fill="#212529" text-anchor="middle" stroke="#ffffff" stroke-width="6" paint-order="stroke">
<text x="174" y="292">90</text><text x="190.9" y="245">60</text><text x="232.3" y="207.7">30</text><text x="318" y="182">0</text><text x="367.7" y="207.7">30</text><text x="409.1" y="245">60</text><text x="426" y="292">90</text>
</g>
</svg>
