<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 575" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Schéma tepelné výměny. Vlevo světle červený obdélník s nápisem horké těleso a červenými kuličkami s dlouhými šipkami rychlosti, vpravo světle modrý obdélník s nápisem studené těleso a modrými kuličkami s krátkými šipkami. Nad tělesy vede oranžová ohnutá šipka od horkého tělesa ke studenému s nápisy teplo a přenos energie. Dvě bubliny: rychlejší částice narazí do pomalejších, předají jim část energie a zpomalí; pomalejší částice při srážkách získají energii a zrychlí.">
