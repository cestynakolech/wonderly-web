	<rect class="hout" x="126" y="573" width="210" height="22" rx="5" fill="#ffe8cc" opacity="0"/>
	<rect class="hin" x="126" y="597" width="210" height="22" rx="5" fill="#d0ebff" opacity="0"/>
	<text x="132" y="590" font-size="17" fill="#2b2a26">Plíce: při výdechu <tspan font-weight="bold" fill="#a63e0a">přetlak</tspan>,</text>
	<text x="132" y="614" font-size="17" fill="#2b2a26">při nádechu <tspan font-weight="bold" fill="#1864ab">podtlak</tspan>.</text>
	<text x="428" y="645" font-size="16" font-weight="bold" text-anchor="end" fill="#495057">Dokonalé vakuum neexistuje.</text>
