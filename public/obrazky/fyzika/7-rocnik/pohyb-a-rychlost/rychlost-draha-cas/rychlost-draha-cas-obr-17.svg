<rect x="3" y="3" width="894" height="512" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="24" y="44" font-size="26" font-weight="bold" fill="#e03131" text-anchor="start">Jednotky rychlosti</text>
<text x="24" y="80" font-size="20" fill="#2b2a26" text-anchor="start">Jednotka rychlosti = jednotka délky za jednotku času.</text>
<rect x="24" y="100" width="414" height="152" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5"/>
<rect x="24" y="100" width="10" height="152" rx="4" fill="#1971c2"/><text x="54" y="154" font-size="38" font-weight="bold" fill="#1971c2" text-anchor="start">m/s</text>
<text x="54" y="192" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">metr za sekundu</text>
<text x="54" y="228" font-size="19" fill="#495057" text-anchor="start">základní jednotka</text>
<rect x="462" y="100" width="414" height="152" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2.5"/>
<rect x="462" y="100" width="10" height="152" rx="4" fill="#e8590c"/><text x="492" y="154" font-size="38" font-weight="bold" fill="#e8590c" text-anchor="start">km/h</text>
<text x="492" y="192" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">kilometr za hodinu</text>
<text x="492" y="228" font-size="19" fill="#495057" text-anchor="start">nejčastěji v běžném životě</text>
<rect x="24" y="272" width="414" height="152" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="2.5"/>
<rect x="24" y="272" width="10" height="152" rx="4" fill="#7048e8"/><text x="54" y="326" font-size="38" font-weight="bold" fill="#7048e8" text-anchor="start">mph</text>
<text x="54" y="364" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">míle za hodinu</text>
<text x="54" y="400" font-size="19" fill="#495057" text-anchor="start">USA a Velká Británie</text>
<rect x="462" y="272" width="414" height="152" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.5"/>
<rect x="462" y="272" width="10" height="152" rx="4" fill="#2f9e44"/><text x="492" y="326" font-size="38" font-weight="bold" fill="#2f9e44" text-anchor="start">uzel</text>
<text x="492" y="364" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">námořní míle za hodinu</text>
<text x="492" y="400" font-size="19" fill="#495057" text-anchor="start">v letectví a na moři</text>
<rect x="24" y="444" width="852" height="50" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
<text x="450" y="476" font-size="20" fill="#2b2a26" text-anchor="middle">Další jednotky: km/s, m/min, cm/s …</text>
