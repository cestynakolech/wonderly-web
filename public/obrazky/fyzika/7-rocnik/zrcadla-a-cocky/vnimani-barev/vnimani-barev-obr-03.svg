<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 710" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Proč vidíme těleso barevné. Čtyři pokusy se svítilnou, knihou a okem. Bílé světlo na bílou knihu: odrazí se všechny barvy, kniha je bílá. Bílé světlo na červenou knihu: odrazí se jen červená, zelenou a modrou kniha pohltí, kniha je červená. Bílé světlo na černou knihu: všechno se pohltí, kniha je černá. Modré světlo na červenou knihu: modrou neodráží, do oka nepřijde žádné světlo, kniha vypadá černá. Animace: paprsky dopadnou na knihu a odražené doletí do oka.">
<style>
/* Animace 10 s, smyčka. Předloha: PDF lekce 29, str. 9 (pokusy: svítilna, kniha, oko; text str. 8). dopadající paprsky 5–35 %, odražené 37–62 %, výsledek pod panelem 62–70 %, zmizí 92–98 %. Paprsek, který kniha pohltí, končí na knize.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy ukazují vše. */
.k1 { stroke-dasharray: 100 100; animation: k1 10s linear infinite; }
@keyframes k1 { 0%, 5% { stroke-dashoffset: 100; } 35%, 100% { stroke-dashoffset: 0; } }
.s1 { animation: s1 10s linear infinite; }
@keyframes s1 { 0%, 33% { opacity: 0; } 36%, 100% { opacity: 1; } }
.k2 { stroke-dasharray: 100 100; animation: k2 10s linear infinite; }
@keyframes k2 { 0%, 37% { stroke-dashoffset: 100; } 62%, 100% { stroke-dashoffset: 0; } }
.s2 { animation: s2 10s linear infinite; }
@keyframes s2 { 0%, 60% { opacity: 0; } 63%, 100% { opacity: 1; } }
.vy { animation: vy 10s linear infinite; }
@keyframes vy { 0%, 62% { opacity: 0; } 70%, 100% { opacity: 1; } }
.celek { animation: celek 10s linear infinite; }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .k1, .s1, .k2, .s2, .vy, .celek { animation: none; } }
</style>
