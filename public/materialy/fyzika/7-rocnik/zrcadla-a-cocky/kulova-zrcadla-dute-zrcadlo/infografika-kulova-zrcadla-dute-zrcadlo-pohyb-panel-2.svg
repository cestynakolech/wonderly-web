<svg viewBox="0 0 460 650" width="460" height="650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kulová zrcadla v pohybu 2/3, Strom a vypuklé zrcadlo: strom se po optické ose blíží k vypuklému zrcadlu. Ve dvou zastávkách vedou z vrcholu stromu dva význačné paprsky; po odrazu se rozbíhají, jako by vycházely z bodu za zrcadlem. Tam je obraz, kde leží i zdánlivé ohnisko F a střed křivosti S. Obraz se trochu zvětšuje, ale je pořád menší než strom: vždy zdánlivý, vzpřímený a zmenšený. Využití: dopravní zrcadla, zpětná zrcátka." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Kulová zrcadla v pohybu 2/3: Strom a vypuklé zrcadlo</title>
	<!-- W89 (OPRAVA 1). Předloha: PDF 23, s. 12–13 (vypuklé zrcadlo: V, F, S za zrcadlem, význačné paprsky rovnoběžný
	     – po odrazu jako by vycházel z ohniska – a ohniskový – míří do F, po odrazu rovnoběžně s osou; „vždy zdánlivý, vzpřímený
	     a zmenšený, nezávisle na poloze předmětu“), s. 16 (dopravní zrcadlo, zpětná zrcátka).
	     Geometrie: V = 290, F = 350, S = 410 (za zrcadlem), |f| = 60 px, osa y = 300, strom 70 px (50 · 1,4).
	     Obraz za zrcadlem ve vzdálenosti a' = a·f/(a + f), zvětšení m = f/(a + f) < 1 pro každé a.
	     a(t): 230→180 (0–1,5 s), stojí (do 4,5 s, paprsky od 1,7 s), 180→50 (4,5–6 s), stojí (do 10 s, paprsky od 6,2 s).
	     Obraz 0,21× → 0,25× → 0,55×. Zrcadlo oblouk poloměr 600, paprsky končí na oblouku a čárkovaně míří
	     do spočítaného vrcholu obrazu (od F se odchylují nejvýš o 7 px). Bez pohybu: a = 180 s paprsky. -->
