<svg viewBox="0 0 460 710" width="460" height="710" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Baterka a transformátor: k primární cívce je přes vypínač připojený článek stejnosměrného napětí, u sekundární cívky je žárovka; při zapnutí se v jádře objeví magnetické pole a žárovka krátce blikne, potom je pole stálé, nemění se a žárovka nesvítí; při vypnutí pole zmizí a žárovka zase krátce blikne; primární cívka má malý odpor a mohla by se přehřát, doma to nezkoušej" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Transformátor v pohybu 3/3: Baterka: jen bliknutí</title>
