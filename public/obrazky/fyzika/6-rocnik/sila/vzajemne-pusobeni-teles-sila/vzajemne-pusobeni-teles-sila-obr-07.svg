<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 808" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Šest obrázků. Při dotyku: tlak – ruka tlačí krabici; tah – ruka natahuje pružinu. Na dálku: magnetická síla – magnet přitáhne druhý magnet; elektrická síla – hřeben zvedá vlasy, aniž by se jich dotkl; gravitační síla – Země přitahuje Měsíc, který kolem ní obíhá; jaderná síla – drží jádro atomu pohromadě.">
<style>
/* Předloha: PDF Vzájemné působení těles, síla – oddíl Způsoby vzájemného působení těles (dotyk: tlak, tah; na dálku: gravitační, magnetická, elektrická, jaderná síla) a příklady z úvodu (pružina, hřeben a vlasy, Měsíc a Země). V PDF bez obrázku. */
/* cyklus 6 s (Měsíc 8 s). Bez animace = koncové stavy (krabice posunutá, pružina natažená, magnety u sebe, vlasy zvednuté). */
@keyframes tl { 0%, 15% { transform: translateX(0px); } 60%, 100% { transform: translateX(70px); } }
@keyframes ta { 0%, 15% { transform: translateX(0px); } 60%, 100% { transform: translateX(60px); } }
@keyframes tp { 0%, 15% { transform: scaleX(1); } 60%, 100% { transform: scaleX(1.6667); } }
@keyframes mg { 0%, 15% { transform: translateX(70px); animation-timing-function: ease-in; } 55%, 100% { transform: translateX(0px); } }
@keyframes ms { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.tl { animation: tl 6s ease-in-out infinite; } .ta { animation: ta 6s ease-in-out infinite; }
.tp { transform-origin: 0 0; animation: tp 6s ease-in-out infinite; } .mg { animation: mg 6s infinite; }
.ms { transform-origin: 0 0; animation: ms 8s linear infinite; }
@keyframes v0 { 0%, 20% { transform: rotate(-125deg); } 55%, 100% { transform: rotate(-13.8deg); } }
.v0 { transform-origin: 0 0; animation: v0 6s ease-in-out infinite; }
@keyframes v1 { 0%, 20% { transform: rotate(-108deg); } 55%, 100% { transform: rotate(-9.5deg); } }
.v1 { transform-origin: 0 0; animation: v1 6s ease-in-out infinite; }
@keyframes v2 { 0%, 20% { transform: rotate(-90deg); } 55%, 100% { transform: rotate(-5.0deg); } }
.v2 { transform-origin: 0 0; animation: v2 6s ease-in-out infinite; }
@keyframes v3 { 0%, 20% { transform: rotate(-74deg); } 55%, 100% { transform: rotate(-1.0deg); } }
.v3 { transform-origin: 0 0; animation: v3 6s ease-in-out infinite; }
@keyframes v4 { 0%, 20% { transform: rotate(82deg); } 55%, 100% { transform: rotate(3.0deg); } }
.v4 { transform-origin: 0 0; animation: v4 6s ease-in-out infinite; }
@keyframes v5 { 0%, 20% { transform: rotate(98deg); } 55%, 100% { transform: rotate(7.0deg); } }
.v5 { transform-origin: 0 0; animation: v5 6s ease-in-out infinite; }
@keyframes v6 { 0%, 20% { transform: rotate(114deg); } 55%, 100% { transform: rotate(11.0deg); } }
.v6 { transform-origin: 0 0; animation: v6 6s ease-in-out infinite; }
@keyframes v7 { 0%, 20% { transform: rotate(128deg); } 55%, 100% { transform: rotate(14.5deg); } }
.v7 { transform-origin: 0 0; animation: v7 6s ease-in-out infinite; }
@keyframes sc { 0% { opacity: 0; } 4%, 94% { opacity: 1; } 100% { opacity: 0; } }
.sc { animation: sc 6s linear infinite; }

@media (prefers-reduced-motion: reduce) { .tl, .ta, .tp, .mg, .ms, .sc, .v0, .v1, .v2, .v3, .v4, .v5, .v6, .v7 { animation: none; } }
</style>
