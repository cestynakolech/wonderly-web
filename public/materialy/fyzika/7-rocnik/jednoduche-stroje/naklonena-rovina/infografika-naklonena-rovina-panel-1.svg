<svg viewBox="0 120 460 490" width="460" height="490" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Co je nakloněná rovina: šikmá plocha, třeba rampa, prkno nebo skluz; je to jednoduchý stroj jako páka nebo kladka; prkno vede ze země na podlahu dodávky, bedna stojí u paty prkna a čárkovaná šipka ukazuje její cestu po prkně nahoru; bednu nezvedáme svisle, táhneme ji šikmo nahoru: menší síla, ale delší dráha" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
