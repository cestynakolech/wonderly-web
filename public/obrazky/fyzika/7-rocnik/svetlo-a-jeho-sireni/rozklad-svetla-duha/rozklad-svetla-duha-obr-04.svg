</g>
<text x="545" y="152" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">déšť</text>

<g class="celek">
<!-- duhy: schematicky (jako předloha) oblouky se středem pod obzorem; spodek zakryje zem -->
