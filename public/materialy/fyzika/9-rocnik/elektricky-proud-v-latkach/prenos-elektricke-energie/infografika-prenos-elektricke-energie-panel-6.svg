h="4" stroke-linecap="round"/><path d="M230,4370 L224.2,4360 L235.8,4360 Z" fill="#0b7285"/><rect x="40" y="4372" width="380" height="40" rx="8" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="230" y="4399" font-size="21" text-anchor="middle" fill="#2b2a26">zásuvky a osvětlení</text></g>
