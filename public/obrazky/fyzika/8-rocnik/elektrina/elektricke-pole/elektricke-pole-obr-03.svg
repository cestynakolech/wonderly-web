<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Mezi kladně nabitou deskou vlevo a záporně nabitou deskou vpravo vede šest rovných, rovnoběžných a stejně hustých siločar se šipkami od + k −. Tři malé kladné náboje v různých místech pole jsou přitahovány k záporné desce, fialová šipka elektrické síly je u všech stejná. Takové pole je stejnorodé (homogenní). Animace: náboje se rozjíždějí k záporné desce.">
<style>
/* Předloha: PDF lekce 19, s. 8 (6 rovnoběžných siločar mezi deskou + a deskou −).
   5 s: 0–10 % náboje stojí u kladné desky (x = 155), 10–80 % jedou zrychleně (ease-in) o 290 px k záporné desce, 80–88 % zmizí, pak znovu.
   Bez animace = náboje uprostřed pole (posun 150 px) se šipkou síly, za nimi čárkovaná stopa. */
.nb { transform: translateX(150px); animation: nb 5s ease-in infinite; }
@keyframes nb { 0%, 10% { transform: translateX(0px); opacity: 1; } 80% { transform: translateX(290px); opacity: 1; } 88% { transform: translateX(290px); opacity: 0; } 92% { transform: translateX(0px); opacity: 0; } 100% { transform: translateX(0px); opacity: 1; } }
.so { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .nb { animation: none; } .so { opacity: 0.8; } }
</style>
<rect x="3" y="3" width="594" height="474" rx="14" fill="#f8f9fa"/>
<text x="300" y="38" font-size="26" fill="#212529" font-weight="bold" text-anchor="middle">Pole mezi dvěma deskami</text>
<text x="300" y="70" font-size="22" fill="#212529" text-anchor="middle">rovné, rovnoběžné, stejně husté siločáry</text>
