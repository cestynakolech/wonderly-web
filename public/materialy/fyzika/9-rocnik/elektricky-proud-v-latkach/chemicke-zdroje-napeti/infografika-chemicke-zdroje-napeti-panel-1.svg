<svg viewBox="0 716 460 540" width="460" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Řez suchým článkem: nahoře kovová čepička, kladný vývod; uprostřed uhlíková tyčinka, kladná elektroda; kolem ní oxid manganičitý; dál salmiaková pasta jako elektrolyt; vně zinková nádoba, záporná elektroda. Napětí 1,5 V, jednorázový, třeba v hračkách; vybitý článek může vytéct a poškodit přístroj" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Chemické zdroje napětí 1/4: Suchý článek</title>
