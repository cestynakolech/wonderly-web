<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 790" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Sluneční soustava shora: uprostřed Slunce, kolem něj na oběžných drahách osm planet. Planety obíhají kolem Slunce, kolem Země obíhá Měsíc. Na Zemi působí červená šipka gravitační síly Slunce, míří ke Slunci.">
<style>
/* Planety obíhají kolem Slunce, Měsíc kolem Země (smyčka). Bez animace (prefers-reduced-motion) zůstávají planety v polohách z atributů. */
.o-merkur { transform-box: view-box; transform-origin: 480px 390px; animation: obeh 6s linear infinite; }
.o-venuse { transform-box: view-box; transform-origin: 480px 390px; animation: obeh 10s linear infinite; }
.o-zeme { transform-box: view-box; transform-origin: 480px 390px; animation: obeh 16s linear infinite; }
.o-mars { transform-box: view-box; transform-origin: 480px 390px; animation: obeh 24s linear infinite; }
.o-jupiter { transform-box: view-box; transform-origin: 480px 390px; animation: obeh 40s linear infinite; }
.o-saturn { transform-box: view-box; transform-origin: 480px 390px; animation: obeh 56s linear infinite; }
.o-uran { transform-box: view-box; transform-origin: 480px 390px; animation: obeh 72s linear infinite; }
.o-neptun { transform-box: view-box; transform-origin: 480px 390px; animation: obeh 90s linear infinite; }
.o-mesic { transform-box: view-box; transform-origin: 606px 390px; animation: obeh 2.4s linear infinite; }
@keyframes obeh { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
@media (prefers-reduced-motion: reduce) { .o-merkur, .o-venuse, .o-zeme, .o-mars, .o-jupiter, .o-saturn, .o-uran, .o-neptun, .o-mesic { animation: none; } }
</style>
