<text x="252" y="394" font-size="14" fill="#2b2a26">zdroj</text>
<text x="96" y="262" font-size="17" font-weight="bold" fill="#8a4a1f">měděný drát</text><text x="96" y="282" font-size="17" fill="#2b2a26">malý odpor</text>
