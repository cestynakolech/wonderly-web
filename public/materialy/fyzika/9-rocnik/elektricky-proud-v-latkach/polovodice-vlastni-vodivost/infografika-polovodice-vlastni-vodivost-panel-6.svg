<svg viewBox="0 3096 460 624" width="460" height="624" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Termistor a fotorezistor: termistoru mění odpor teplota, teplejší termistor má menší odpor; slouží v digitálních teploměrech, teplotních čidlech a k měření teploty v hutích. Fotorezistoru mění odpor osvětlení, víc světla znamená menší odpor; je ve fotobuňce, optické závoře a při počítání bankovek. Nakresleny značky obou součástek" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Polovodiče 6/6: Termistor a fotorezistor</title>
	<rect x="0" y="3096" width="460" height="624" fill="#f8f9fa"/>
