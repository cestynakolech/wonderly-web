<text x="245" y="526" font-size="20" fill="#2b2a26" text-anchor="middle">Silně se přichytí k magnetu.</text>
<text x="245" y="552" font-size="20" fill="#2b2a26" text-anchor="middle">Patří sem železo, ocel, kobalt, nikl.</text>
