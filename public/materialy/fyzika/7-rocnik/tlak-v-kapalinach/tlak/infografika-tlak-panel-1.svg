" font-weight="bold" text-anchor="middle" fill="#b8460b">Stejná síla, menší plocha</text><text x="230" y="520" font-size="21" font-weight="bold" text-anchor="middle" fill="#b8460b">= větší tlak.</text><rect x="40" y="536" width="380" height="84" rx="10" fill="#fff4e6" stroke="#b8460b" stroke-width="2"/><text x="230" y="572" font-size="25" text-anchor="middle" fill="#2b2a26">tlak  <tspan font-weight="bold" fill="#b8460b">p = F : S</tspan></text><text x="230" y="604" font-size="18" text-anchor="middle" fill="#2b2a26">p tlak (Pa) · F síla (N) · S plocha (m²)</text>
