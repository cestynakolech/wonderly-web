<svg viewBox="0 0 460 556" width="460" height="556" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Elektrické pole v pohybu 3 ze 4, Elektroskop bez dotyku. Záporně nabitá tyč se přiblíží k původně neutrálnímu elektroskopu, ale nedotkne se ho. Náboj se přerozdělí a ručička se vychýlí. Po oddálení tyče se náboj rozloží rovnoměrně a ručička se vrátí." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Elektrické pole v pohybu 3/4: Elektroskop bez dotyku</title>
  <style>
    .rod { transform: translate(70px,0); animation: rod 8s ease-in-out infinite; }
    .needle { transform: rotate(34deg); transform-origin: 220px 305px; transform-box: view-box; animation: needle 8s ease-in-out infinite; }
    .neutral { opacity: 1; animation: neutral 8s step-end infinite; }
    .separated { opacity: 0; animation: separated 8s step-end infinite; }
    .caption-a { opacity: 0; animation: caption-a 8s step-end infinite; }
    .caption-b { opacity: 1; animation: caption-b 8s step-end infinite; }
    @keyframes rod { 0%,10% { transform: translate(70px,0); } 30%,64% { transform: translate(0,0); } 84%,100% { transform: translate(70px,0); } }
    @keyframes needle { 0%,31% { transform: rotate(0deg); } 44%,68% { transform: rotate(34deg); } 86%,100% { transform: rotate(0deg); } }
    @keyframes neutral { 0%,25% { opacity: 1; } 31%,80% { opacity: 0; } 81%,100% { opacity: 1; } }
    @keyframes separated { 0%,25% { opacity: 0; } 31%,80% { opacity: 1; } 81%,100% { opacity: 0; } }
    @keyframes caption-a { 0%,30% { opacity: 0; } 31%,83% { opacity: 1; } 84%,100% { opacity: 0; } }
    @keyframes caption-b { 0%,83% { opacity: 0; } 84%,94% { opacity: 1; } 95%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rod, .needle, .neutral, .separated, .caption-a, .caption-b { animation: none; }
      .rod { transform: translate(0,0); }
      .needle { transform: rotate(34deg); }
      .neutral, .caption-b { opacity: 0; }
      .separated, .caption-a { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="metal3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.55" stop-color="#dee2e6"/><stop offset="1" stop-color="#adb5bd"/></linearGradient>
    <linearGradient id="rodFill3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf2ff"/><stop offset="1" stop-color="#dbe4ff"/></linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#2b2a26"/></filter>
  </defs>
  <rect width="460" height="556" fill="#f8f9fa"/>
  <rect x="20" y="16" width="420" height="524" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" filter="url(#shadow3)"/>
  <circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2"/>
  <text x="52" y="57" text-anchor="middle" font-size="20" font-weight="bold" fill="#b8460b">3</text>
  <text x="80" y="59" font-size="25" font-weight="bold" fill="#2b2a26">Elektroskop bez dotyku</text>

  <g class="rod">
    <rect x="295" y="123" width="55" height="44" rx="11" fill="url(#rodFill3)" stroke="#2b2a26" stroke-width="2.5"/>
    <g fill="#0b4f91" font-size="25" font-weight="bold" text-anchor="middle" aria-label="záporný náboj"><text x="309" y="154">−</text><text x="335" y="154">−</text></g>
  </g>
  <path d="M220 184V306" stroke="#495057" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="220" cy="151" rx="39" ry="22" fill="url(#metal3)" stroke="#2b2a26" stroke-width="2.5"/>
  <path d="M132 221Q132 202 151 202H297Q316 202 316 221V357Q316 376 297 376H151Q132 376 132 357Z" fill="#fff" fill-opacity="0.72" stroke="#495057" stroke-width="2.5"/>
  <circle cx="220" cy="305" r="10" fill="#495057"/>
  <g class="needle"><path d="M220 305L220 355" stroke="#2b2a26" stroke-width="8" stroke-linecap="round"/><g class="separated"><circle cx="220" cy="338" r="10" fill="#1864ab" stroke="#2b2a26" stroke-width="1.5"/><path d="M215 338H225" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><circle cx="220" cy="305" r="5" fill="#fbfaf6"/></g>
  <path d="M171 391H273M190 376H254" stroke="#2b2a26" stroke-width="8" stroke-linecap="round"/>

  <g class="neutral">
    <text x="205" y="159" font-size="24" font-weight="bold" fill="#9c1c1c">+</text><text x="231" y="159" font-size="26" font-weight="bold" fill="#0b4f91">−</text>
    <text x="205" y="275" font-size="24" font-weight="bold" fill="#9c1c1c">+</text><text x="230" y="276" font-size="26" font-weight="bold" fill="#0b4f91">−</text>
  </g>
  <g class="separated">
    <text x="206" y="159" font-size="25" font-weight="bold" fill="#9c1c1c">+</text><text x="235" y="159" font-size="25" font-weight="bold" fill="#9c1c1c">+</text>
    <circle cx="220" cy="268" r="10" fill="#1864ab" stroke="#2b2a26" stroke-width="1.5"/><path d="M215 268H225" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <rect x="36" y="420" width="388" height="98" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
  <g class="caption-a"><text x="52" y="458" font-size="20" font-weight="bold" fill="#2b2a26">Náboj se přerozdělí</text><text x="52" y="487" font-size="20" fill="#2b2a26">bez dotyku.</text></g>
  <g class="caption-b"><text x="52" y="458" font-size="20" font-weight="bold" fill="#2b2a26">Po oddálení tyče se</text><text x="52" y="487" font-size="20" fill="#2b2a26">ručička vrátí.</text></g>
</svg>
