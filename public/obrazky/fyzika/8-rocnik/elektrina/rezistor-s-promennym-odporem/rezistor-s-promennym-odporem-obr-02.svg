<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dvě provedení proměnného rezistoru. Vlevo posuvné: kovové pouzdro s drážkou, ve které klouže páčka jezdce; dole vývody. Vpravo otočné: kulaté pouzdro, závit s matkou a hřídelka, na kterou lze nasadit knoflík; vývody po straně. Animace: páčka se posouvá, hřídelka se otáčí.">
<style>
/* Předloha: PDF lekce 30, s. 3 (posuvné potenciometry – foto) a s. 4 (otočný potenciometr – foto); fotky nahrazeny kresbou.
   6 s: páčka posuvného provedení jede vlevo a zpět; rýhy hřídelky se posouvají = otáčení. Bez animace: páčka vpravo, hřídelka stojí. */
.paka { animation: paka 6s ease-in-out infinite; }
@keyframes paka { 0%, 10% { transform: translateX(0); } 45%, 60% { transform: translateX(-190px); } 95%, 100% { transform: translateX(0); } }
.ryhy { animation: ryhy 1.2s linear infinite; }
@keyframes ryhy { from { transform: translateX(0); } to { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { .paka, .ryhy { animation: none; } }
</style>
