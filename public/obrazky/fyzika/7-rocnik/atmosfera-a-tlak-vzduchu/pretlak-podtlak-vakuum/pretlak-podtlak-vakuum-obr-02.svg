<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Hustilka je hadičkou připojená k míči. Při každém zdvihu nasaje dávku vzduchu a při stlačení ji vtlačí do míče. V míči přibývají částice vzduchu ze 4 na 8 a ručička manometru stoupá z 0 na 1 bar. Manometr ukazuje přetlak 1 bar, celkový tlak v míči je asi 1 atm plus 1 atm, tedy 2 atmosféry.">
<style>
/* Předloha: PDF lekce 17 str. 1 (hustilka, přetlak), str. 2 (manometr na pneumatice), str. 3 (1 bar, 1 atm + 1 atm = 2 atm), str. 4 (ciferník v barech).
   Animace 10 s: 4 zdvihy po 2 s (rukojeť nahoru 0–8 %, dolů 8–16 % každého 20% úseku), dávka vzduchu válcem a hadičkou do míče,
   v míči přibude částice (4 → 8 = dvojnásobek vzduchu při stejném objemu ⇒ dvojnásobný celkový tlak 2 atm = přetlak 1 bar),
   ručička po 15° (¼ baru) až na 60° = 1 bar; 94–99 % návrat do výchozího stavu.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy prvků ukazují výsledek děje. */
.rucicka{transform-origin:480px 200px;animation:rucicka 10s linear infinite}
@keyframes rucicka{0%{transform:rotate(-60deg)}16%{transform:rotate(-60deg)}18%{transform:rotate(-45deg)}36%{transform:rotate(-45deg)}38%{transform:rotate(-30deg)}56%{transform:rotate(-30deg)}58%{transform:rotate(-15deg)}76%{transform:rotate(-15deg)}78%{transform:rotate(0deg)}94%{transform:rotate(0deg)}99%{transform:rotate(-60deg)}100%{transform:rotate(-60deg)}}
