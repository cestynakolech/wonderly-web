		<text x="30" y="438" font-size="21" fill="#2b2a26">roztáčí turbína; vytváří proměnlivé pole.</text>
		<text x="30" y="470" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Stator</tspan> má cívky — v nich se</text>
