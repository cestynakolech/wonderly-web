<svg xmlns="http://www.w3.org/2000/svg" width="460" height="712" viewBox="0 0 460 712" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Na Zemi a na Měsíci: na dva stejné siloměry se zavěsí stejné těleso o hmotnosti 6 kg. Na Zemi se pružina natáhne až na 60 N, gravitační síla Fg = 60 N. Na Měsíci siloměr ukáže jen 10 N, Fg = 10 N. Na Zemi je g = 10 N/kg, na Měsíci je g 6× menší. Hmotnost je stejná, síla je 6× menší.">
	<title>Gravitační síla v pohybu 2/2: Na Zemi a na Měsíci</title>
	<!-- W78 (14. 10. 2026), panel 2/2 (původně 3/3; původní panel 2 „Dolů = ke středu Země“ vyřazen OPRAVOU 1,
	     opakoval obr-02 a animovaný infografika-gravitacni-sila-panel-2). Opora: výklad, oddíl „Pro zvídavé“: „Kdyby bylo těleso na Zemi
	     přitahováno silou 60 N, na Měsíci by ho gravitace táhla dolů jen silou 10 N, protože 60 : 6 = 10.
	     Hmotnost tělesa by přitom zůstala stejná.“; „g … Na povrchu Měsíce je 6× menší než na Zemi“; g = 10 N/kg;
	     PDF s. 6–7 (g na Měsíci 6krát menší). Hmotnost 6 kg = 60 N : 10 N/kg (m = Fg : g ze vzorce ve výkladu)
	     — přípustný prostý výpočet podle PDF s. 10 „m = Fg : g“, do výkladu se NIC nedoplňuje.
	     Měřítko: stupnice 0–60 N, dílek 20 px = 10 N; šipka Fg 16 px = 10 N (Země 96 px, Měsíc 16 px).
	     Táhlo siloměru je 150 px dlouhé, takže háček s tělesem je vždy pod pouzdrem (i při 0 N).
	     Děj 8 s: prázdné siloměry → zavěsí se těleso 6 kg → pružiny se natáhnou (Země 60 N, Měsíc 10 N) → zpět.
	     Šipka Fg jede s tělesem a je vidět, kdykoli je těleso zavěšené. Bez animace = konečný stav (60 N a 10 N).
	     OPRAVA 1 (W78-kontrola nález 3): štítky „Fg = 60 N“ / „Fg = 10 N“ (třída g3-stitek) jsou vidět jen,
	     když ukazatel stojí na 60 N / 10 N (25 %–95 % pohybu); objeví se 25→27,5 %, zmizí 88,75→90 %
	     (před sundáním tělesa).
     OPRAVA 2 (W78-kontrola-2): písmo nikde < 21 (index „g“ 21 → na 375 px, SVG ≈ 319 px: 21 · 319/460 = 14,6 px). -->
	<style>
		.g3-z { animation: g3-z 8s linear infinite; }
		@keyframes g3-z {
			0%, 11.25% { transform: translateY(-120px); animation-timing-function: ease-out; }
			25%, 95% { transform: translateY(0px); animation-timing-function: ease-in-out; }
			100% { transform: translateY(-120px); }
		}
		.g3-m { animation: g3-m 8s linear infinite; }
		@keyframes g3-m {
			0%, 11.25% { transform: translateY(-20px); animation-timing-function: ease-out; }
			25%, 95% { transform: translateY(0px); animation-timing-function: ease-in-out; }
			100% { transform: translateY(-20px); }
		}
		.g3-pz { transform-box: view-box; transform-origin: 118px 142px; animation: g3-pz 8s linear infinite; }
		@keyframes g3-pz {
			0%, 11.25% { transform: scaleY(0.0769); animation-timing-function: ease-out; }
			25%, 95% { transform: scaleY(1); animation-timing-function: ease-in-out; }
			100% { transform: scaleY(0.0769); }
		}
		.g3-pm { transform-box: view-box; transform-origin: 330px 142px; animation: g3-pm 8s linear infinite; }
		@keyframes g3-pm {
			0%, 11.25% { transform: scaleY(0.3333); animation-timing-function: ease-out; }
			25%, 95% { transform: scaleY(1); animation-timing-function: ease-in-out; }
			100% { transform: scaleY(0.3333); }
		}
		.g3-teleso { animation: g3-teleso 8s linear infinite; }
		@keyframes g3-teleso { 0%, 6.25% { opacity: 0 } 11.25%, 90% { opacity: 1 } 95%, 100% { opacity: 0 } }
		.g3-stitek { animation: g3-stitek 8s linear infinite; }
		@keyframes g3-stitek { 0%, 25% { opacity: 0 } 27.5%, 88.75% { opacity: 1 } 90%, 100% { opacity: 0 } }
		@media (prefers-reduced-motion: reduce) {
			.g3-z, .g3-m, .g3-pz, .g3-pm, .g3-teleso, .g3-stitek { animation: none; }
		}
	</style>

