<svg viewBox="0 3868 460 580" width="460" height="580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Co motor potřebuje: chlazení vodou nebo vzduchem, jinak by se roztavil; mazání olejem z olejové vany, aby se píst nezadřel; startování — elektrický startér z autobaterie roztočí setrvačník, dříve se motor roztáčel klikou; šetrnější motory: přímé vstřikování, turbomotory, katalyzátor, filtr pevných částic — méně paliva, čistší výfukové plyny" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Spalovací motory 6/6: Co motor potřebuje</title>
	<defs></defs>
	<rect x="0" y="3868" width="460" height="580" fill="#f8f9fa"/>
	<g id="panel-6"><rect x="26" y="3884" width="420" height="560" rx="12" fill="#dee2e6"/><rect x="20" y="3878" width="420" height="560" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="3912" r="17" fill="#2b2a26"/><text x="52" y="3920" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">6</text><text x="80" y="3921" font-size="25" font-weight="bold" fill="#2b2a26">Co motor potřebuje</text><rect x="34" y="3948" width="92" height="92" rx="10" fill="#fff" stroke="#ced4da" stroke-width="2"/><rect x="60" y="3964" width="40" height="60" fill="#adb5bd" stroke="#495057" stroke-width="2"/><rect x="50" y="3968" width="60" height="5" rx="2" fill="#adb5bd" stroke="#495057" stroke-width="1"/><rect x="50" y="3980" width="60" height="5" rx="2" fill="#adb5bd" stroke="#495057" stroke-width="1"/><rect x="50" y="3992" width="60" height="5" rx="2" fill="#adb5bd" stroke="#495057" stroke-width="1"/><rect x="50" y="4004" width="60" height="5" rx="2" fill="#adb5bd" stroke="#495057" stroke-width="1"/><rect x="50" y="4016" width="60" height="5" rx="2" fill="#adb5bd" stroke="#495057" stroke-width="1"/><path d="M38,3974 q5,-5 10,0" fill="none" stroke="#495057" stroke-width="2"/><path d="M38,3994 q5,-5 10,0" fill="none" stroke="#495057" stroke-width="2"/><path d="M38,4014 q5,-5 10,0" fill="none" stroke="#495057" stroke-width="2"/><text x="140" y="3974" font-size="21" font-weight="bold" fill="#2b2a26">Chlazení</text><text x="140" y="4004" font-size="21" fill="#2b2a26">vodou nebo vzduchem,</text><text x="140" y="4032" font-size="21" fill="#2b2a26">jinak by se roztavil.</text><rect x="34" y="4060" width="92" height="92" rx="10" fill="#fff" stroke="#ced4da" stroke-width="2"/><rect x="54" y="4104" width="52" height="34" rx="3" fill="#ced4da" stroke="#495057" stroke-width="2"/><line x1="54" y1="4111" x2="106" y2="4111" stroke="#495057" stroke-width="1.5"/><path d="M80,4070 C72,4082 70,4088 70,4091 A10,10 0 0 0 90,4091 C90,4088 88,4082 80,4070 Z" fill="#fcc419" stroke="#b08900" stroke-width="1.5"/><text x="140" y="4086" font-size="21" font-weight="bold" fill="#2b2a26">Mazání</text><text x="140" y="4116" font-size="21" fill="#2b2a26">olejem z olejové vany,</text><text x="140" y="4144" font-size="21" fill="#2b2a26">aby se píst nezadřel.</text><rect x="34" y="4172" width="92" height="92" rx="10" fill="#fff" stroke="#ced4da" stroke-width="2"/><rect x="46" y="4202" width="68" height="46" rx="4" fill="#343a40"/><rect x="54" y="4194" width="12" height="8" fill="#adb5bd"/><rect x="94" y="4194" width="12" height="8" fill="#adb5bd"/><text x="60" y="4234" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">+</text><text x="100" y="4234" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">−</text><text x="140" y="4198" font-size="21" font-weight="bold" fill="#2b2a26">Startování</text><text x="140" y="4228" font-size="21" fill="#2b2a26">startér roztočí setrvačník</text><text x="140" y="4256" font-size="21" fill="#2b2a26">(dříve se roztáčel ručně).</text><line x1="34" y1="4288" x2="426" y2="4288" stroke="#ced4da" stroke-width="2"/><text x="34" y="4322" font-size="21" font-weight="bold" fill="#2b2a26">Šetrnější motory:</text><text x="34" y="4352" font-size="21" fill="#2b2a26">přímé vstřikování, turbomotory,</text><text x="34" y="4382" font-size="21" fill="#2b2a26">katalyzátor, filtr pevných částic.</text><text x="34" y="4416" font-size="21" fill="#2b2a26">Méně paliva, čistší výfukové plyny.</text></g>
</svg>
