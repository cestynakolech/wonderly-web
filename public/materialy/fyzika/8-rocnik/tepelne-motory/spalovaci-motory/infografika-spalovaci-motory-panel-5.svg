<svg viewBox="0 3174 460 690" width="460" height="690" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dvoutaktní motor v řezu při sání a stlačení: píst je nahoře a stlačuje směs, jeho plášť zakrývá výfukový otvor, sací otvor pod ním je odkrytý a směs proudí do klikové skříně; zapalovací svíčka, výfukový otvor, píst, sací otvor, klikový hřídel; nemá ventily, jen otvory, které odkrývá a zakrývá píst; dvě doby: 1. sání a stlačení, 2. výbuch a výfuk, klikový hřídel se otočí jednou; výhoda: menší a lehčí, používá se v sekačkách a motorových pilách; nevýhoda: do benzínu se přidává olej, víc znečišťuje vzduch" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
