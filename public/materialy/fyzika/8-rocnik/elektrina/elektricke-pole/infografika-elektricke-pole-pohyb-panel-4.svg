  <g class="polarized"><text x="186" y="181" font-size="24" font-weight="bold" fill="#9c1c1c">+</text><text x="213" y="181" font-size="24" font-weight="bold" fill="#9c1c1c">+</text><circle cx="205" cy="265" r="10" fill="#1864ab" stroke="#2b2a26" stroke-width="1.5"/><path d="M200 265H210" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
