		.bl { animation: bl 2s linear infinite; }
		@keyframes bl { 0%, 25% { transform: translateY(0px); } 28% { transform: translateY(3px); } 31% { transform: translateY(-3px); } 34% { transform: translateY(2.4px); } 37% { transform: translateY(-2px); } 40% { transform: translateY(1.5px); } 43% { transform: translateY(-1px); } 46% { transform: translateY(0.6px); } 49%, 100% { transform: translateY(0px); } }
		.pr { animation: pr 2s linear infinite; }
		@keyframes pr { 0% { transform: translateY(-34px); } 10% { transform: translateY(4px); } 22% { transform: translateY(12px); } 25%, 100% { transform: translateY(-34px); } }
		.st { transform-box: view-box; transform-origin: 335px 262px; animation: st 2s step-end infinite; }
		@keyframes st { 0% { transform: scaleY(0.05); } 11% { transform: scaleY(0.11); } 12% { transform: scaleY(0.17); } 13% { transform: scaleY(0.24); } 14% { transform: scaleY(0.30); } 15% { transform: scaleY(0.36); } 16% { transform: scaleY(0.42); } 17% { transform: scaleY(0.49); } 18% { transform: scaleY(0.55); } 19% { transform: scaleY(0.61); } 20% { transform: scaleY(0.68); } 21% { transform: scaleY(0.74); } 22% { transform: scaleY(0.80); } 23% { transform: scaleY(0.36); } 24% { transform: scaleY(-0.33); } 25% { transform: scaleY(-0.59); } 26% { transform: scaleY(-0.27); } 27% { transform: scaleY(0.24); } 28% { transform: scaleY(0.44); } 29% { transform: scaleY(0.20); } 30% { transform: scaleY(-0.18); } 31% { transform: scaleY(-0.33); } 32% { transform: scaleY(-0.15); } 33% { transform: scaleY(0.13); } 34% { transform: scaleY(0.24); } 35% { transform: scaleY(0.11); } 36% { transform: scaleY(-0.10); } 37% { transform: scaleY(-0.18); } 38% { transform: scaleY(-0.08); } 39% { transform: scaleY(0.07); } 40% { transform: scaleY(0.13); } 41% { transform: scaleY(0.06); } 42% { transform: scaleY(-0.05); } 43% { transform: scaleY(-0.10); } 44% { transform: scaleY(-0.05); } 45%, 100% { transform: scaleY(0.05); } }
		.vl { animation: vl 2s linear infinite; }
		@keyframes vl { 0%, 25% { opacity: 0; } 28%, 62% { opacity: 1; } 72%, 100% { opacity: 0; } }
		.sy { animation: sy 2s ease-in-out infinite alternate; }
		@keyframes sy { 0% { transform: translateX(-20px); } 100% { transform: translateX(20px); } }
		.sm { transform-box: view-box; transform-origin: 104px 466px; animation: sm 0.4s step-end infinite; }
		@keyframes sm { 0% { transform: scaleX(0.92); } 12.5% { transform: scaleX(0.38); } 25% { transform: scaleX(-0.38); } 37.5%, 50% { transform: scaleX(-0.92); } 62.5% { transform: scaleX(-0.38); } 75% { transform: scaleX(0.38); } 87.5%, 100% { transform: scaleX(0.92); } }
		.vp { animation: vp 0.9s linear infinite; }
		@keyframes vp { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
		.vz { animation: vz 0.6s linear infinite; }
		@keyframes vz { 0% { transform: translateX(0px); opacity: 1; } 100% { transform: translateX(24px); opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.pa, .bl, .pr, .st, .vl, .sy, .sm, .vp, .vz { animation: none; }
		}
	</style>
