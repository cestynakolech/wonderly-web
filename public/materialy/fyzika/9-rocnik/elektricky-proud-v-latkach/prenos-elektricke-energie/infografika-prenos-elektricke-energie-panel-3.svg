<svg viewBox="0 1566 460 554" width="460" height="554" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Proč velmi vysoké napětí: bez ztrát zůstává výkon P = U · I stejný; dvě plochy se stejným obsahem: při nízkém napětí je proud velký, při vysokém napětí malý; kolikrát se napětí zvětší, tolikrát se proud zmenší; malý proud ve vodičích znamená minimální ztráty energie" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Přenos elektrické energie 3/7: Proč velmi vysoké napětí?</title>
	<defs></defs>
	<rect x="0" y="1566" width="460" height="554" fill="#f8f9fa"/>
	<g id="panel-3"><rect x="26" y="1582" width="420" height="534" rx="12" fill="#dee2e6"/><rect x="20" y="1576" width="420" height="534" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="1610" r="17" fill="#2b2a26"/><text x="52" y="1618" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="80" y="1619" font-size="25" font-weight="bold" fill="#2b2a26">Proč velmi vysoké napětí?</text><text x="34" y="1658" font-size="21" fill="#2b2a26">Bez ztrát zůstává výkon stejný:</text><text x="230" y="1694" font-size="25" font-weight="bold" text-anchor="middle" fill="#0b7285"><tspan font-style="italic">P</tspan> = <tspan font-style="italic">U</tspan> · <tspan font-style="italic">I</tspan></text><rect x="40" y="1712" width="380" height="250" rx="8" fill="#ffffff"/><line x1="66" y1="1916" x2="66" y2="1738" stroke="#495057" stroke-width="2"/><path d="M66,1730 L61,1740 L71,1740 Z" fill="#495057"/><line x1="66" y1="1916" x2="194" y2="1916" stroke="#495057" stroke-width="2"/><path d="M202,1916 L192,1911 L192,1921 Z" fill="#495057"/><text x="58" y="1756" font-size="21" text-anchor="end" fill="#495057"><tspan font-style="italic">U</tspan></text><text x="200" y="1904" font-size="21" text-anchor="middle" fill="#495057"><tspan font-style="italic">I</tspan></text><rect x="66" y="1876" width="120" height="40" fill="#c5f6fa" stroke="#0b7285" stroke-width="2.5"/><text x="126" y="1904" font-size="21" font-weight="bold" text-anchor="middle" fill="#0b7285"><tspan font-style="italic">P</tspan></text><text x="68" y="1946" font-size="21" fill="#2b2a26">nízké napětí</text><line x1="256" y1="1916" x2="256" y2="1738" stroke="#495057" stroke-width="2"/><path d="M256,1730 L251,1740 L261,1740 Z" fill="#495057"/><line x1="256" y1="1916" x2="384" y2="1916" stroke="#495057" stroke-width="2"/><path d="M392,1916 L382,1911 L382,1921 Z" fill="#495057"/><text x="248" y="1756" font-size="21" text-anchor="end" fill="#495057"><tspan font-style="italic">U</tspan></text><text x="390" y="1904" font-size="21" text-anchor="middle" fill="#495057"><tspan font-style="italic">I</tspan></text><rect x="256" y="1756" width="30" height="160" fill="#c5f6fa" stroke="#0b7285" stroke-width="2.5"/><text x="271" y="1844" font-size="21" font-weight="bold" text-anchor="middle" fill="#0b7285"><tspan font-style="italic">P</tspan></text><text x="258" y="1946" font-size="21" fill="#2b2a26">vysoké napětí</text><rect x="40" y="1712" width="380" height="250" rx="8" fill="none" stroke="#ced4da" stroke-width="2"/><text x="34" y="1996" font-size="21" fill="#2b2a26">Kolikrát se napětí zvětší,</text><text x="34" y="2024" font-size="21" fill="#2b2a26">tolikrát se proud zmenší.</text><text x="34" y="2058" font-size="21" fill="#2b2a26">Velmi vysoké napětí → <tspan font-weight="bold">malý proud</tspan></text><text x="34" y="2086" font-size="21" fill="#2b2a26">ve vodičích → <tspan font-weight="bold">minimální ztráty</tspan> energie.</text></g>
</svg>
