<svg xmlns="http://www.w3.org/2000/svg" width="460" height="740" viewBox="0 0 460 740" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Hydraulika kolem nás. Zvedák v dílně: malou silou pumpujeme pákou malý píst, olej tlačí na velký píst a ten zvedne plošinu s autem. Brzdy auta: noha sešlápne pedál, ten tlačí na olej ve válci, olej v trubce přenese tlak ke kolu a přitlačí brzdovou destičku ke kotouči. Hydrauliku najdeš i v lisu, který stlačuje materiál, v zubařském křesle a ve výtahu, jehož kabina nevisí na lanech.">
	<title>Pascalův zákon 6/6: Hydraulika kolem nás</title>
	<!-- Panel 6/6 infografiky Pascalův zákon (W52, 14. 10. 2026); bez animace = koncový stav. -->
	<style>
		.p6-pumpa { animation: p6-pumpa 8s ease-in-out infinite; }
		@keyframes p6-pumpa { 0% { transform: translateY(-8px) } 12% { transform: translateY(0px) } 24% { transform: translateY(-8px) } 36% { transform: translateY(0px) } 48% { transform: translateY(-8px) } 60% { transform: translateY(0px) } 100% { transform: translateY(0px) } }
		.p6-auto { animation: p6-auto 8s ease-in-out infinite; }
		@keyframes p6-auto { 0% { transform: translateY(30px) } 10% { transform: translateY(30px) } 60% { transform: translateY(0px) } 88% { transform: translateY(0px) } 97% { transform: translateY(30px) } 100% { transform: translateY(30px) } }
		.p6-tyc { animation: p6-tyc 8s ease-in-out infinite; }
		@keyframes p6-tyc { 0% { transform: translateX(-11px) } 15% { transform: translateX(-11px) } 35% { transform: translateX(0px) } 80% { transform: translateX(0px) } 95% { transform: translateX(-11px) } 100% { transform: translateX(-11px) } }
		.p6-pedal { transform-origin: 70px 540px; transform-box: view-box; }
		.p6-pedal { animation: p6-pedal 8s ease-in-out infinite; }
		@keyframes p6-pedal { 0% { transform: rotate(-12deg) } 15% { transform: rotate(-12deg) } 35% { transform: rotate(0deg) } 80% { transform: rotate(0deg) } 95% { transform: rotate(-12deg) } 100% { transform: rotate(-12deg) } }
		.p6-dest { animation: p6-dest 8s ease-in-out infinite; }
		@keyframes p6-dest { 0% { transform: translateX(-6px) } 20% { transform: translateX(-6px) } 35% { transform: translateX(0px) } 80% { transform: translateX(0px) } 92% { transform: translateX(-6px) } 100% { transform: translateX(-6px) } }
		@media (prefers-reduced-motion: reduce) {
			.p6-auto, .p6-pumpa, .p6-pedal, .p6-dest, .p6-tyc { animation: none; }
		}
	</style>
