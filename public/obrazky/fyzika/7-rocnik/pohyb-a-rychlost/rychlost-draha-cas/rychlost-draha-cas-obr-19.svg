<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 456" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Rovnoměrný pohyb: rychlost se nemění. Nerovnoměrný pohyb: rychlost se mění. Příklady">
<defs>
<marker id="s-mod" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#1971c2"/></marker>
<marker id="s-cer" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#e03131"/></marker>
<marker id="s-zel" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#2f9e44"/></marker>
<marker id="s-ora" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#e8590c"/></marker>
<marker id="s-sed" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#495057"/></marker>
<marker id="s-bila" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#ffffff"/></marker>
</defs>
<rect x="3" y="3" width="894" height="450" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="24" y="44" font-size="26" font-weight="bold" fill="#e03131" text-anchor="start">Rovnoměrný a nerovnoměrný pohyb</text>
<rect x="24" y="66" width="420" height="64" rx="10" fill="#1971c2" stroke="#1971c2" stroke-width="0"/>
<text x="44" y="108" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="start">Rovnoměrný pohyb</text>
<line x1="350" y1="98" x2="420" y2="98" stroke="#ffffff" stroke-width="4" marker-end="url(#s-bila)"/>
<rect x="456" y="66" width="420" height="64" rx="10" fill="#e8590c" stroke="#e8590c" stroke-width="0"/>
<text x="476" y="108" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="start">Nerovnoměrný pohyb</text>
<path d="M800,116 L826,116 L826,100 L852,100 L852,84" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
<rect x="24" y="142" width="420" height="128" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="42" y="174" font-size="19" font-weight="bold" fill="#1971c2" text-anchor="start">Rychlost</text>
<text x="42" y="206" font-size="20" fill="#2b2a26" text-anchor="start">se po celou dobu nemění.</text>
<text x="42" y="234" font-size="20" fill="#2b2a26" text-anchor="start">Za stejné doby urazí</text>
<text x="42" y="262" font-size="20" fill="#2b2a26" text-anchor="start">stejné dráhy.</text>
<rect x="456" y="142" width="420" height="128" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="474" y="174" font-size="19" font-weight="bold" fill="#e8590c" text-anchor="start">Rychlost</text>
<text x="474" y="206" font-size="20" fill="#2b2a26" text-anchor="start">se během pohybu mění.</text>
<text x="474" y="234" font-size="20" fill="#2b2a26" text-anchor="start">Může být zrychlený (rychlost</text>
<text x="474" y="262" font-size="20" fill="#2b2a26" text-anchor="start">roste) nebo zpomalený (klesá).</text>
<rect x="24" y="282" width="420" height="150" rx="10" fill="#ffffff" stroke="#1971c2" stroke-width="2"/>
<text x="42" y="314" font-size="19" font-weight="bold" fill="#1971c2" text-anchor="start">Příklady</text>
<text x="42" y="346" font-size="20" fill="#2b2a26" text-anchor="start">eskalátor (jezdící schody)</text>
<text x="42" y="374" font-size="20" fill="#2b2a26" text-anchor="start">hodinová ručička</text>
<text x="42" y="402" font-size="20" fill="#2b2a26" text-anchor="start">auto na úseku dálnice</text>
<rect x="456" y="282" width="420" height="150" rx="10" fill="#ffffff" stroke="#e8590c" stroke-width="2"/>
<text x="474" y="314" font-size="19" font-weight="bold" fill="#e8590c" text-anchor="start">Příklady</text>
<text x="474" y="346" font-size="20" fill="#2b2a26" text-anchor="start">vlak z Ostravy do Prahy</text>
<text x="474" y="374" font-size="20" fill="#2b2a26" text-anchor="start">kolo do kopce a z kopce</text>
<text x="474" y="402" font-size="20" fill="#2b2a26" text-anchor="start">auto městem přes křižovatky</text>
</svg>
