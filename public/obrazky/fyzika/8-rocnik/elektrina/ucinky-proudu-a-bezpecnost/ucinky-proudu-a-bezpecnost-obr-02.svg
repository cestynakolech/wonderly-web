<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Stupnice proudu procházejícího tělem v miliampérech, orientačně pro střídavý proud. Kolem 1 mA člověk proud ucítí jako brnění. Kolem 10 mA může křeč zabránit tomu, aby se pustil vodiče. Od přibližně 30 mA při delším průchodu roste riziko fibrilace: srdce se chvěje a nepumpuje krev. Platí 1 A = 1 000 mA. Animace: ukazatel stoupá k 1, 10 a 30 mA a rozsvěcí příslušný řádek.">
<style>
.ukaz { animation: ukaz 10s ease-in-out infinite; }
@keyframes ukaz { 0% { transform: translate(0, 450px); } 8%, 28% { transform: translate(0, 435px); } 38%, 58% { transform: translate(0, 300px); } 70%, 96% { transform: translate(0, 0); } 100% { transform: translate(0, 450px); } }
.sl { animation: sl 10s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes sl { 0% { transform: scaleY(0); } 8%, 28% { transform: scaleY(0.0333); } 38%, 58% { transform: scaleY(0.3333); } 70%, 96% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
.r1 { animation: r1 10s step-end infinite; } @keyframes r1 { 0% { opacity: 0; } 8% { opacity: 1; } }
.r2 { animation: r2 10s step-end infinite; } @keyframes r2 { 0% { opacity: 0; } 38% { opacity: 1; } }
.r3 { animation: r3 10s step-end infinite; } @keyframes r3 { 0% { opacity: 0; } 70% { opacity: 1; } }
.chveni { animation: chv 0.15s linear infinite; } @keyframes chv { 50% { transform: translate(2px, -1px); } }
@media (prefers-reduced-motion: reduce) { .ukaz, .sl, .r1, .r2, .r3, .chveni { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="714" rx="14" fill="#f8f9fa"/>

<text x="300" y="42" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Jak silný proud tělem prochází</text>
<text x="300" y="72" font-size="20" fill="#495057" text-anchor="middle">orientačně, střídavý proud</text>
<defs><linearGradient id="teplo" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffd43b"/><stop offset="0.35" stop-color="#fd7e14"/><stop offset="1" stop-color="#e03131"/></linearGradient></defs>
<rect x="70" y="110" width="44" height="530" rx="22" fill="#fff" stroke="#495057" stroke-width="3"/>
<rect class="sl" x="78" y="180" width="28" height="450" rx="6" fill="url(#teplo)"/>
<path d="M114 615H138" stroke="#212529" stroke-width="3"/>
<path d="M114 480H138" stroke="#212529" stroke-width="3"/>
<path d="M114 180H138" stroke="#212529" stroke-width="3"/>
<text x="92" y="670" font-size="20" fill="#212529" text-anchor="middle">0 mA</text>
<text x="92" y="98" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">mA</text>
<g class="ukaz"><path d="M40 169L62 180L40 191Z" fill="#212529"/></g>
<g><path d="M138 615L164 560" stroke="#212529" stroke-width="2"/><rect x="164" y="498" width="412" height="124" rx="10" fill="#fff" stroke="#ced4da" stroke-width="2"/><rect class="r1" x="164" y="498" width="412" height="124" rx="10" fill="#fff4e6" stroke="#f08c00" stroke-width="4"/><g transform="translate(228 560)"><ellipse cx="0" cy="12" rx="26" ry="30" fill="#ffd8a8" stroke="#d9a066" stroke-width="2"/><rect x="-24" y="-38" width="11" height="40" rx="5.5" fill="#ffd8a8" stroke="#d9a066" stroke-width="2"/><rect x="-12" y="-38" width="11" height="40" rx="5.5" fill="#ffd8a8" stroke="#d9a066" stroke-width="2"/><rect x="0" y="-38" width="11" height="40" rx="5.5" fill="#ffd8a8" stroke="#d9a066" stroke-width="2"/><rect x="12" y="-38" width="11" height="40" rx="5.5" fill="#ffd8a8" stroke="#d9a066" stroke-width="2"/><path d="M-36 -30l-8 -4M38 -30l8 -4M-40 0h-10M40 0h10" stroke="#e67700" stroke-width="3" stroke-linecap="round"/></g><text x="294" y="534" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">1 mA</text><text x="294" y="564" font-size="20" fill="#212529" text-anchor="start">proud ucítí</text><text x="294" y="590" font-size="20" fill="#212529" text-anchor="start">jako brnění</text></g>
<g><path d="M138 480L164 420" stroke="#212529" stroke-width="2"/><rect x="164" y="358" width="412" height="124" rx="10" fill="#fff" stroke="#ced4da" stroke-width="2"/><rect class="r2" x="164" y="358" width="412" height="124" rx="10" fill="#fff4e6" stroke="#f08c00" stroke-width="4"/><g transform="translate(228 420)"><path d="M-46 0H46" stroke="#343a40" stroke-width="14" stroke-linecap="round"/><rect x="-22" y="-26" width="44" height="50" rx="16" fill="#ffd8a8" stroke="#d9a066" stroke-width="2"/><path d="M-16 -20V22" stroke="#d9a066" stroke-width="2"/><path d="M-5 -20V22" stroke="#d9a066" stroke-width="2"/><path d="M6 -20V22" stroke="#d9a066" stroke-width="2"/><path d="M17 -20V22" stroke="#d9a066" stroke-width="2"/><path d="M-30 -36l6 8M30 -36l-6 8" stroke="#e67700" stroke-width="3" stroke-linecap="round"/></g><text x="294" y="394" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">10 mA</text><text x="294" y="424" font-size="20" fill="#212529" text-anchor="start">křeč: nemusí se</text><text x="294" y="450" font-size="20" fill="#212529" text-anchor="start">pustit vodiče</text></g>
<g><path d="M138 180L164 190" stroke="#212529" stroke-width="2"/><rect x="164" y="115" width="412" height="150" rx="10" fill="#fff" stroke="#ced4da" stroke-width="2"/><rect class="r3" x="164" y="115" width="412" height="150" rx="10" fill="#fff4e6" stroke="#f08c00" stroke-width="4"/><g transform="translate(228 190)"><g class="chveni"><g transform="translate(0 0)"><path transform="scale(2.2)" d="M0 10C-18 -2 -16 -16 -7 -16C-3 -16 0 -12 0 -9C0 -12 3 -16 7 -16C16 -16 18 -2 0 10Z" fill="#c2255c" stroke="#7d1235" stroke-width="1.5"/></g></g><path d="M-44 34h18l6 -10l8 18l6 -14l6 10l6 -6h20" fill="none" stroke="#a61e4d" stroke-width="3" stroke-linejoin="round"/></g><text x="294" y="151" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">od 30 mA</text><text x="294" y="181" font-size="20" fill="#212529" text-anchor="start">při delším průchodu riziko</text><text x="294" y="207" font-size="20" fill="#212529" text-anchor="start">fibrilace: srdce se chvěje</text><text x="294" y="233" font-size="20" fill="#212529" text-anchor="start">a nepumpuje účinně krev</text></g>
<rect x="164" y="640" width="412" height="56" rx="10" fill="#fff4e6" stroke="#f08c00" stroke-width="2"/>
<text x="370" y="676" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">1 A = 1 000 mA</text>
</svg>
