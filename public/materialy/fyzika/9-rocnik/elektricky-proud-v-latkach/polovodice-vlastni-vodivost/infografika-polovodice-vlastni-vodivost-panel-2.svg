<svg viewBox="0 614 460 622" width="460" height="622" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Teplota mění odpor: kov má čím teplejší, tím větší odpor. Polovodič má čím teplejší, tím menší odpor a lepší vodivost, přesně naopak než kov. Při nízké teplotě nemá volné elektrony, téměř nevede a je spíš izolant; při vysoké teplotě má volné elektrony a díry, vede lépe a je spíš vodič. Odpor polovodiče zmenší i osvětlení" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Polovodiče 2/6: Teplota mění odpor</title>
	<rect x="0" y="614" width="460" height="622" fill="#f8f9fa"/>
	<g id="panel-2"><rect x="26" y="630" width="420" height="602" rx="12" fill="#dee2e6"/><rect x="20" y="624" width="420" height="602" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="658" r="17" fill="#2b2a26"/><text x="52" y="666" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="80" y="667" font-size="25" font-weight="bold" fill="#2b2a26">Teplota mění odpor</text><text x="34" y="710" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Kov:</tspan> čím teplejší, tím</text><text x="34" y="738" font-size="21" fill="#2b2a26">větší odpor.</text><text x="34" y="776" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Polovodič:</tspan> čím teplejší, tím</text><text x="34" y="804" font-size="21" fill="#2b2a26">menší odpor a lepší vodivost.</text><text x="34" y="832" font-size="21" fill="#2b2a26">Je to přesně naopak než u kovů.</text><rect x="34" y="856" width="192" height="272" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><text x="130" y="888" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">nízká teplota</text><rect x="57" y="912" width="14" height="120" rx="7" fill="#fff" stroke="#343a40" stroke-width="2"/><circle cx="64" cy="1040" r="13" fill="#495057" stroke="#343a40" stroke-width="2"/><rect x="61" y="1012" width="6" height="22" fill="#495057"/><rect x="94" y="918" width="118" height="118" rx="6" fill="#e9ecef" stroke="#343a40" stroke-width="2"/><text x="130" y="1086" font-size="21" text-anchor="middle" fill="#2b2a26">téměř nevede,</text><text x="130" y="1114" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">spíš izolant</text><rect x="234" y="856" width="192" height="272" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><text x="330" y="888" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">vysoká teplota</text><rect x="257" y="912" width="14" height="120" rx="7" fill="#fff" stroke="#343a40" stroke-width="2"/><circle cx="264" cy="1040" r="13" fill="#495057" stroke="#343a40" stroke-width="2"/><rect x="261" y="934" width="6" height="100" fill="#495057"/><rect x="294" y="918" width="118" height="118" rx="6" fill="#e9ecef" stroke="#343a40" stroke-width="2"/><g><circle cx="318" cy="944" r="17" fill="#d0ebff" stroke="#4dabf7" stroke-width="2"/><g><circle cx="318" cy="944" r="11" fill="#1971c2" stroke="#0b4f8a" stroke-width="1.5"/><text x="318" y="951" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">−</text></g></g><g><circle cx="384" cy="954" r="11" fill="#fff" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="4 3"/><text x="384" y="961.5" font-size="21" font-weight="bold" text-anchor="middle" fill="#1b6b2d">+</text></g><g><circle cx="336" cy="1004" r="11" fill="#fff" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="4 3"/><text x="336" y="1011.5" font-size="21" font-weight="bold" text-anchor="middle" fill="#1b6b2d">+</text></g><g><circle cx="390" cy="1012" r="17" fill="#d0ebff" stroke="#4dabf7" stroke-width="2"/><g><circle cx="390" cy="1012" r="11" fill="#1971c2" stroke="#0b4f8a" stroke-width="1.5"/><text x="390" y="1019" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">−</text></g></g><text x="330" y="1086" font-size="21" text-anchor="middle" fill="#2b2a26">vede lépe,</text><text x="330" y="1114" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">spíš vodič</text><text x="34" y="1162" font-size="21" fill="#2b2a26">Odpor polovodiče zmenší</text><text x="34" y="1190" font-size="21" fill="#2b2a26">i osvětlení.</text></g>
</svg>
