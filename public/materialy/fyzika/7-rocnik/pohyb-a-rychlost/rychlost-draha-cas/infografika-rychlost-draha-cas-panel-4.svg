<svg viewBox="0 1678 460 636" width="460" height="636" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rovnoměrný a nerovnoměrný pohyb: tečka ukazuje polohu po každé sekundě. Modré auto na dálnici jede rovnoměrně, tečky mají stejné rozestupy: stejné dráhy za stejné doby. Zelený autobus se rozjíždí, pohyb je zrychlený, rozestupy teček se prodlužují. Červený vlak brzdí, pohyb je zpomalený, rozestupy se zkracují, až zastaví. Rovnoměrný pohyb: rychlost se nemění. Nerovnoměrný pohyb: rychlost se mění, je zrychlený nebo zpomalený" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
