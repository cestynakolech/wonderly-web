<use href="#sl" x="320" class="p0"/><use href="#sl" x="340" class="p1"/><use href="#sl" x="360" class="p2"/><use href="#sl" x="380" class="p3"/><use href="#sl" x="400" class="p4"/><use href="#sc" x="420" class="p5"/><use href="#sl" x="440" class="p6"/><use href="#sl" x="460" class="p7"/><use href="#sl" x="480" class="p8"/><use href="#sl" x="500" class="p9"/><use href="#sl" x="520" class="p10"/><use href="#sl" x="540" class="p11"/>
<use href="#sl" x="560" class="p0"/><use href="#sl" x="580" class="p1"/><use href="#sl" x="600" class="p2"/><use href="#sl" x="620" class="p3"/><use href="#sl" x="640" class="p4"/><use href="#sc" x="660" class="p5"/><use href="#sl" x="680" class="p6"/><use href="#sl" x="700" class="p7"/><use href="#sl" x="720" class="p8"/><use href="#sl" x="740" class="p9"/><use href="#sl" x="760" class="p10"/><use href="#sl" x="780" class="p11"/>
<use href="#sa" x="180" class="p5"/><use href="#sa" x="420" class="p5"/><use href="#sa" x="660" class="p5"/>
