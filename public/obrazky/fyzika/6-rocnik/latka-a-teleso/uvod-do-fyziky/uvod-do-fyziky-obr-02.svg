<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Spojnicový graf nejnižší a nejvyšší denní teploty od 1. do 19. února. Vodorovně dny, svisle teplota ve stupních Celsia od minus 7 do 8. Modrá čára nejnižších teplot se drží pod nulou, nejníž na minus 6 stupních. Oranžová čára nejvyšších teplot vystoupá až na 7 stupňů. Animace: obě čáry se postupně kreslí zleva doprava.">
<style>
/* Předloha: PDF Úvod do fyziky, s. 4 (graf „Denní průběh minimální a maximální teploty a její odhad“, 1.–19. 2.).
   Překresleno: hodnoty odečtené z předlohy a zaokrouhlené na celé °C; šedá čára „odhad“ a červené šipky vynechány
   (výklad je nevysvětluje). Čáry se kreslí 4 s, pak 4 s stojí; bez animace (reduced-motion) jsou celé. */
@keyframes kresli { 0% { stroke-dashoffset: 1120; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
.cara { stroke-dasharray: 1120; animation: kresli 8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .cara { animation: none; stroke-dasharray: none; } }
</style>
<rect x="3" y="3" width="954" height="574" rx="14" fill="#f8f9fa"/>
<text x="480" y="42" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Nejnižší a nejvyšší teplota dne (únor)</text>
