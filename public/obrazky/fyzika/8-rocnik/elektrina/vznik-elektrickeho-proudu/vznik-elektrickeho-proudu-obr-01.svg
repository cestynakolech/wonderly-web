<g class="el e6" transform="translate(256 170)"><circle r="13" fill="#1864ab" stroke="#0b3d6e" stroke-width="2"/><text y="8" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text></g>
<g class="el e7" transform="translate(340 170)"><circle r="13" fill="#1864ab" stroke="#0b3d6e" stroke-width="2"/><text y="8" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text></g>
<g class="el e8" transform="translate(424 170)"><circle r="13" fill="#1864ab" stroke="#0b3d6e" stroke-width="2"/><text y="8" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text></g>
<g class="el e9" transform="translate(490 188)"><circle r="13" fill="#1864ab" stroke="#0b3d6e" stroke-width="2"/><text y="8" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text></g>
<g class="el e10" transform="translate(490 272)"><circle r="13" fill="#1864ab" stroke="#0b3d6e" stroke-width="2"/><text y="8" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text></g>
<g class="el e11" transform="translate(490 356)"><circle r="13" fill="#1864ab" stroke="#0b3d6e" stroke-width="2"/><text y="8" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text></g>
<g class="el e12" transform="translate(470 420)"><circle r="13" fill="#1864ab" stroke="#0b3d6e" stroke-width="2"/><text y="8" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text></g>
<g class="el e13" transform="translate(386 420)"><circle r="13" fill="#1864ab" stroke="#0b3d6e" stroke-width="2"/><text y="8" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text></g>
<g class="el e14" transform="translate(302 420)"><circle r="13" fill="#1864ab" stroke="#0b3d6e" stroke-width="2"/><text y="8" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text></g>
<circle class="on" cx="300" cy="122" r="44" fill="#ffd43b" opacity="0.85"/>
<circle cx="300" cy="122" r="34" fill="#ffffff" fill-opacity="0.55" stroke="#495057" stroke-width="3"/>
<path d="M290,150 L290,124 L296,114 L300,124 L304,114 L310,124 L310,150" fill="none" stroke="#495057" stroke-width="2.5"/>
