<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: posuvné měřítko neboli šuplera. Na ocelovém pravítku je stupnice v centimetrech a milimetrech. Posuvná čelist dojede k měděné trubce a sevře ji mezi čelisti, pak se vyznačí průměr trubky. Měří na desetiny milimetru průměr kulatých těles, šířku a hloubku dutin.">
<style>
/* Předloha: PDF Délka — fotografie posuvného měřítka, které sevřelo měděnou trubku. Překresleno, ne kopie.
   Cyklus 8 s: 0–15 % jezdec je odsunutý, 15–50 % čelist dojede k trubce, 55–94 % se ukáže průměr.
   Bez animace = koncový stav (trubka sevřená, průměr vyznačen). */
@keyframes jezdec { 0%, 15% { transform: translate(260px, 0); } 50%, 100% { transform: translate(0, 0); } }
@keyframes prum { 0%, 52% { opacity: 0; } 60%, 94% { opacity: 1; } 100% { opacity: 0; } }
.jezdec { animation: jezdec 8s ease-in-out infinite; }
.prum { animation: prum 8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .jezdec, .prum { animation: none; } }
</style>
<defs>
<linearGradient id="ocel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="0.5" stop-color="#ced4da"/><stop offset="1" stop-color="#adb5bd"/></linearGradient>
<linearGradient id="ocelT" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#adb5bd"/><stop offset="0.5" stop-color="#dee2e6"/><stop offset="1" stop-color="#868e96"/></linearGradient>
<radialGradient id="med" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#f4a261"/><stop offset="0.6" stop-color="#c8692a"/><stop offset="1" stop-color="#8a3c0f"/></radialGradient>
<linearGradient id="medB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8955a"/><stop offset="1" stop-color="#9c4a17"/></linearGradient>
</defs>
