<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Odpor drátu závisí na materiálu, délce, tloušťce a teplotě. Nahoře: dva měděné dráty stejné tloušťky – kratší má menší odpor, delší má větší odpor. Pod nimi dva dráty stejné délky – tenčí má větší odpor, tlustší má menší odpor; bublina ukazuje příčný řez, tedy plochu na konci přestřiženého drátu. Dole věta o teplotě: zahřátý kovový drát má větší odpor.">
