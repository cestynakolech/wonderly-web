e(-3px, -3px); } 69% { transform: translate(-4px, 2px); } 70% { transform: translate(3px, -2px); } 71% { transform: translate(1px, 4px); } 72% { transform: translate(-2px, -4px); } 73% { transform: translate(4px, 1px); } 74% { transform: translate(-3px, -3px); } 75% { transform: translate(-4px, 2px); } 76% { transform: translate(3px, -2px); } 77% { transform: translate(1px, 4px); } 78% { transform: translate(-2px, -4px); } 79% { transform: translate(4px, 1px); } 80% { transform: translate(-3px, -3px); } 81% { transform: translate(-4px, 2px); } 82% { transform: translate(3px, -2px); } 83% { transform: translate(1px, 4px); } 84% { transform: translate(-2px, -4px); } 85% { transform: translate(4px, 1px); } 86% { transform: translate(-3px, -3px); } 87% { transform: translate(-4px, 2px); } 88% { transform: translate(3px, -2px); } 89% { transform: translate(1px, 4px); } 90% { transform: translate(-2px, -4px); } 91% { transform: translate(4px, 1px); } 94%, 100% { transform: translate(0px, 0px); } }
		.kB { animation: kB 10s linear infinite; }
		@keyframes kB { 0% { transform: translate(0px, 0px); } 3% { transform: translate(-1px, 0px); } 6% { transform: translate(1px, 0px); } 9% { transform: translate(-1px, 0px); } 12% { transform: translate(1px, 0px); } 15% { transform: translate(-1px, 0px); } 18% { transform: translate(1px, 0px); } 21% { transform: translate(-1px, 0px); } 24% { transform: translate(1px, 0px); } 27% { transform: translate(-1px, 0px); } 30% { transform: translate(1px, 0px); } 31% { transform: translate(-4px, -1px); } 32% { transform: translate(3px, 3px); } 33% { transform: translate(4px, -2px); } 34% { transform: translate(-3px, 2px); } 35% { transform: translate(-1px, -4px); } 36% { transform: translate(2px, 4px); } 37% { transform: translate(-4px, -1px); } 38% { transform: translate(3px, 3px); } 39% { transform: translate(4px, -2px); } 40% { transform: translate(-3px, 2px); } 41% { transform: translate(-1px, -4px); } 42% { transform: translate(2px, 4px); } 43% { transform: translate(-4px, -1px); } 44% { transform: translate(3px, 3px); } 45% { transform: translate(4px, -2px); } 46% { transform: translate(-3px, 2px); } 47% { transform: translate(-1px, -4px); } 48% { transform: translate(2px, 4px); } 49% { transform: translate(-4px, -1px); } 50% { transform: translate(3px, 3px); } 51% { transform: translate(4px, -2px); } 52% { transform: translate(-3px, 2px); } 53% { transform: translate(-1px, -4px); } 54% { transform: translate(2px, 4px); } 55% { transform: translate(-4px, -1px); } 56% { transform: translate(3px, 3px); } 57% { transform: translate(4px, -2px); } 58% { transform: translate(-3px, 2px); } 59% { transform: translate(-1px, -4px); } 60% { transform: translate(2px, 4px); } 61% { transform: translate(-4px, -1px); } 62% { transform: translate(3px, 3px); } 63% { transform: translate(4px, -2px); } 64% { transform: translate(-3px, 2px); } 65% { transform: translate(-1px, -4px); } 66% { transform: translate(2px, 4px); } 67% { transform: translate(-4px, -1px); } 68% { transform: translate(3px, 3px); } 69% { transform: translate(4px, -2px); } 70% { transform: translate(-3px, 2px); } 71% { transform: translate(-1px, -4px); } 72% { transform: translate(2px, 4px); } 73% { transform: translate(-4px, -1px); } 74% { transform: translate(3px, 3px); } 75% { transform: translate(4px, -2px); } 76% { transform: translate(-3px, 2px); } 77% { transform: translate(-1px, -4px); } 78% { transform: translate(2px, 4px); } 79% { transform: translate(-4px, -1px); } 80% { transform: translate(3px, 3px); } 81% { transform: translate(4px, -2px); } 82% { transform: translate(-3px, 2px); } 83% { transform: translate(-1px, -4px); } 84% { transform: translate(2px, 4px); } 85% { transform: translate(-4px, -1px); } 86% { transform: translate(3px, 3px); } 87% { transform: translate(4px, -2px); } 88% { transform: translate(-3px, 2px); } 89% { transform: translate(-1px, -4px); } 90% { transform: translate(2px, 4px); } 91% { transform: translate(-4px, -1px); } 94%, 100% { transform: translate(0px, 0px); } }
