<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 580" width="460" height="580" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Otevřená lednice: studený vzduch má větší hustotu, klesá a dole z lednice vytéká ven, horem proudí dovnitř teplý vzduch z kuchyně. Dveře otvírej jen na chvilku a hned je zavři; nejdřív si rozmysli, co chceš vyndat.">
	<title>Hospodaření s teplem 2/4: Otevřená lednice</title>
	<!-- Panel 2/4, nová kresba (wonderly, 14. 11. 2026). Opora: výklad podtématu na webu (temata.ts) a ŠVP 8. r. Základní stav = konečný stav děje. -->
	<style>
		@keyframes h2t0 { 0% { transform: translate(430px, 218px); opacity: 1; } 70% { transform: translate(200px, 218px); opacity: 1; } 100% { transform: translate(160px, 222px); opacity: 0; } }
		.h2t0 { animation: h2t0 6s linear infinite; animation-delay: -0s; }
		@keyframes h2s0 { 0% { transform: translate(150px, 398px); opacity: 1; } 25% { transform: translate(250px, 400px); opacity: 1; } 55% { transform: translate(330px, 418px); opacity: 1; } 100% { transform: translate(430px, 418px); opacity: 0; } }
		.h2s0 { animation: h2s0 6s linear infinite; animation-delay: -0.4s; }
		@keyframes h2t1 { 0% { transform: translate(430px, 218px); opacity: 1; } 70% { transform: translate(200px, 218px); opacity: 1; } 100% { transform: translate(160px, 222px); opacity: 0; } }
		.h2t1 { animation: h2t1 6s linear infinite; animation-delay: -1.5s; }
		@keyframes h2s1 { 0% { transform: translate(150px, 398px); opacity: 1; } 25% { transform: translate(250px, 400px); opacity: 1; } 55% { transform: translate(330px, 418px); opacity: 1; } 100% { transform: translate(430px, 418px); opacity: 0; } }
		.h2s1 { animation: h2s1 6s linear infinite; animation-delay: -1.9s; }
		@keyframes h2t2 { 0% { transform: translate(430px, 218px); opacity: 1; } 70% { transform: translate(200px, 218px); opacity: 1; } 100% { transform: translate(160px, 222px); opacity: 0; } }
		.h2t2 { animation: h2t2 6s linear infinite; animation-delay: -3s; }
		@keyframes h2s2 { 0% { transform: translate(150px, 398px); opacity: 1; } 25% { transform: translate(250px, 400px); opacity: 1; } 55% { transform: translate(330px, 418px); opacity: 1; } 100% { transform: translate(430px, 418px); opacity: 0; } }
		.h2s2 { animation: h2s2 6s linear infinite; animation-delay: -3.4s; }
		@keyframes h2t3 { 0% { transform: translate(430px, 218px); opacity: 1; } 70% { transform: translate(200px, 218px); opacity: 1; } 100% { transform: translate(160px, 222px); opacity: 0; } }
