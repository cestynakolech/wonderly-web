  </g>
  <g font-size="17" font-weight="bold" fill="#2b2a26" text-anchor="middle"><text x="151" y="97">1</text><text x="201" y="97">2</text><text x="251" y="97">3</text><text x="301" y="97">4</text></g>

  <g class="rod"><rect x="45" y="150" width="80" height="42" rx="11" fill="url(#rodFill4)" stroke="#2b2a26" stroke-width="2.5"/><g fill="#0b4f91" font-size="25" font-weight="bold" text-anchor="middle" aria-label="záporný náboj"><text x="60" y="180">−</text><text x="85" y="180">−</text><text x="110" y="180">−</text></g></g>
