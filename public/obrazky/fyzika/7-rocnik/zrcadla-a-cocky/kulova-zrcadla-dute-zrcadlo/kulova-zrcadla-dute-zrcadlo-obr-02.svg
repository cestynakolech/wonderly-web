<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Duté zrcadlo. Nahoře: sluneční paprsky rovnoběžné s optickou osou se od zrcadla odrazí a všechny projdou ohniskem F, kde se soustředí, takže tam lze zapálit oheň. Dole reflektor: žárovka je v ohnisku F, paprsky z ní se od zrcadla odrazí jako rovnoběžný svazek. Animace: paprsky postupně doletí k zrcadlu a odrazí se, nahoře se rozsvítí ohnisko.">
<style>
/* Animace 8 s, smyčka. Předloha: PDF lekce 23, str. 6 (rovnoběžné paprsky → ohnisko), text str. 5 (paprsky z ohniska → rovnoběžný svazek, reflektory).
   Zrcadlo: oblouk se středem v S (r = 300, f = 150). paprsky 5–45 %, šipky 45–50 %, ohnisko se rozsvítí 45–60 %, vše zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy níže ukazují vše. */
.pr { stroke-dasharray: 100 100; animation: pr 8s linear infinite; }
.si { animation: si 8s linear infinite; }
.po { animation: po 8s linear infinite; }
.celek { animation: celek 8s linear infinite; }
@keyframes pr { 0%, 5% { stroke-dashoffset: 100; } 45%, 100% { stroke-dashoffset: 0; } }
@keyframes si { 0%, 45% { opacity: 0; } 50%, 100% { opacity: 1; } }
@keyframes po { 0%, 45% { opacity: 0; } 60%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pr, .si, .po, .celek { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="774" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<defs><radialGradient id="kzzar"><stop offset="0" stop-color="#fff3bf"/><stop offset="0.4" stop-color="#ffd43b" stop-opacity="0.9"/><stop offset="1" stop-color="#ff922b" stop-opacity="0"/></radialGradient></defs>
<text x="300" y="38" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Duté zrcadlo</text><text x="300" y="66" font-size="22" font-weight="normal" fill="#212529" text-anchor="middle">rovnoběžné paprsky se odrazí do ohniska F</text>
