<svg viewBox="0 120 460 490" width="460" height="490" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tepelný motor je stroj, který mění teplo na pohyb: pára předá motoru teplo Q v joulech, motor z něj vykoná práci (pohyb) a zbytek odejde jako teplo do okolí; tři druhy: parní stroje, spalovací motory, reaktivní motory; účinnost v procentech říká, jak velkou část energie motor přemění na pohyb" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Tepelný motor a parní stroj 1/6: Tepelný motor</title>
