nt-size="26" text-anchor="middle" font-weight="bold" fill="#1c7ed6">p</text><text x="460" y="470.0" font-size="26" text-anchor="middle" font-weight="bold" fill="#1c7ed6">p</text><text x="740" y="470.0" font-size="26" text-anchor="middle" font-weight="bold" fill="#1c7ed6">p</text><text x="300" y="520.0" font-size="26" text-anchor="middle" font-weight="bold" fill="#1c7ed6">p</text><rect x="40.0" y="600" width="880" height="110" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2.5" />
