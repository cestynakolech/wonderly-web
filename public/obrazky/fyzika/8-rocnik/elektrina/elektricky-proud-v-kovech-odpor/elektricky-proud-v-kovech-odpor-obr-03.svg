<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 830" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Odpor drátu závisí na materiálu, délce, tloušťce a teplotě. Nahoře: dva měděné dráty stejné tloušťky – kratší má menší odpor, delší má větší odpor. Pod nimi dva dráty stejné délky – tenčí má větší odpor, tlustší má menší odpor; bublina ukazuje příčný řez, tedy plochu na konci přestřiženého drátu. Dole rezistor: odporový drát navinutý na keramickém válečku a malý rezistor s barevnými proužky; ve schématu jej u nás kreslíme jako obdélník se dvěma vývody, v amerických schématech také jako klikatou čáru.">
<rect x="3" y="3" width="594" height="824" rx="14" fill="#f8f9fa"/>
<text x="300" y="34" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Na čem závisí odpor drátu</text><text x="300" y="56" font-size="20" fill="#212529" text-anchor="middle">materiál, délka, tloušťka, teplota</text><text x="30" y="86" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">Délka (stejný kov, stejná tloušťka)</text><path d="M40 111H170V125H40Z" fill="#9c4a17"/><ellipse cx="40" cy="118" rx="4" ry="7" fill="#9c4a17"/><rect x="40" y="113.1" width="130" height="2" fill="#fff" opacity="0.25"/><ellipse cx="170" cy="118" rx="4" ry="7" fill="#e8a66b" stroke="#6b3410" stroke-width="2"/><text x="196" y="126" font-size="22" fill="#212529" text-anchor="start">kratší – menší odpor</text><path d="M40 155H340V169H40Z" fill="#9c4a17"/><ellipse cx="40" cy="162" rx="4" ry="7" fill="#9c4a17"/><rect x="40" y="157.1" width="300" height="2" fill="#fff" opacity="0.25"/><ellipse cx="340" cy="162" rx="4" ry="7" fill="#e8a66b" stroke="#6b3410" stroke-width="2"/><text x="364" y="170" font-size="22" fill="#212529" text-anchor="start">delší – větší odpor</text><text x="30" y="222" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">Tloušťka (stejný kov, stejná délka)</text><path d="M40 250H300V262H40Z" fill="#9c4a17"/><ellipse cx="40" cy="256" rx="4" ry="6" fill="#9c4a17"/><rect x="40" y="251.8" width="260" height="2" fill="#fff" opacity="0.25"/><ellipse cx="300" cy="256" rx="4" ry="6" fill="#e8a66b" stroke="#6b3410" stroke-width="2"/><text x="328" y="264" font-size="22" fill="#212529" text-anchor="start">tenčí – větší odpor</text><path d="M40 294H300V342H40Z" fill="#9c4a17"/><ellipse cx="40" cy="318" rx="12" ry="24" fill="#9c4a17"/><rect x="40" y="301.2" width="260" height="6.7" fill="#fff" opacity="0.25"/><ellipse cx="300" cy="318" rx="12" ry="24" fill="#e8a66b" stroke="#6b3410" stroke-width="2"/><text x="328" y="326" font-size="22" fill="#212529" text-anchor="start">tlustší – menší odpor</text><path d="M150 362H320Q332 362 332 374V412Q332 424 320 424H150Q138 424 138 412V374Q138 362 150 362Z" fill="#fff3bf" stroke="#212529" stroke-width="2.5"/><path d="M262 363L300 330L292 363" fill="#fff3bf" stroke="#212529" stroke-width="2.5" stroke-linejoin="round"/><path d="M264 364.5H290" stroke="#fff3bf" stroke-width="4"/><text x="235" y="401" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">příčný řez</text><text x="30" y="466" font-size="22" fill="#212529" text-anchor="start">Teplota: zahřátý kovový drát má větší odpor.</text><path d="M20 492H580" stroke="#ced4da" stroke-width="2"/><text x="300" y="530" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Rezistor – součástka s daným odporem</text><path d="M20 590H50M250 590H280" stroke="#868e96" stroke-width="4" stroke-linecap="round"/><rect x="50" y="562" width="200" height="56" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2.5"/><path d="M66 565L72 615M74 565L80 615M82 565L88 615M90 565L96 615M98 565L104 615M106 565L112 615M114 565L120 615M122 565L128 615M130 565L136 615M138 565L144 615M146 565L152 615M154 565L160 615M162 565L168 615M170 565L176 615M178 565L184 615M186 565L192 615M194 565L200 615M202 565L208 615M210 565L216 615M218 565L224 615M226 565L232 615" stroke="#9c4a17" stroke-width="3" stroke-linecap="round"/><text x="150" y="650" font-size="22" fill="#212529" text-anchor="middle">odporový drát</text><text x="150" y="678" font-size="22" fill="#212529" text-anchor="middle">na keramickém válečku</text><path d="M330 590H380M500 590H560" stroke="#868e96" stroke-width="4" stroke-linecap="round"/><rect x="380" y="570" width="120" height="40" rx="16" fill="#e6cfa0" stroke="#8a6d3b" stroke-width="2"/><rect x="398" y="571" width="10" height="38" fill="#7a3e12"/><rect x="418" y="571" width="10" height="38" fill="#212529"/><rect x="438" y="571" width="10" height="38" fill="#f08c00"/><rect x="476" y="571" width="10" height="38" fill="#c9a227"/><text x="445" y="650" font-size="22" fill="#212529" text-anchor="middle">barevné proužky</text><text x="445" y="678" font-size="22" fill="#212529" text-anchor="middle">udávají odpor</text><text x="300" y="722" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Značka ve schématu</text><path d="M40 770H95M205 770H260" stroke="#212529" stroke-width="4"/><rect x="95" y="755" width="110" height="30" fill="none" stroke="#212529" stroke-width="4"/><text x="150" y="812" font-size="22" fill="#212529" text-anchor="middle">naše schémata</text><path d="M340 770H372L384 750L404 790L424 750L444 790L464 750L476 770H560" fill="none" stroke="#212529" stroke-width="4" stroke-linejoin="round"/><text x="450" y="812" font-size="22" fill="#212529" text-anchor="middle">americká schémata</text></svg>
