<svg viewBox="0 1414 460 576" width="460" height="576" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jiskrový výboj: blesk. Proud v plynu je elektrický výboj. V bouřkovém mraku je kladný náboj nahoře a záporný dole, na zemi pod mrakem je kladný náboj. Blesk vede z mraku na zem, může být dlouhý 2 až 3 km a vzduch v něm má 20 000 °C až 30 000 °C, proto svítí. Vzduch se prudce rozepne a slyšíme hrom; zvuk je pomalejší než světlo, proto nejdřív vidíme blesk a pak slyšíme hrom" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
