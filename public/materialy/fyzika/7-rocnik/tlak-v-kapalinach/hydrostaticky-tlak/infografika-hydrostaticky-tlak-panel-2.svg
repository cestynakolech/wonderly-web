<svg xmlns="http://www.w3.org/2000/svg" width="460" height="714" viewBox="0 0 460 714" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Hydrostatický tlak: p h = h · ρ · g, h je hloubka pod hladinou v metrech, ρ hustota kapaliny v kg/m³, g = 10 N/kg. Nádoba s vodou: voda tlačí na stěny i na dno, šipky tlaku jsou hlouběji delší a na dno nejdelší. Hlouběji je nad námi víc vody, proto větší tlak. Sladká voda má hustotu 1 000 kg/m³, mořská 1 030 kg/m³. Hustší kapalina, větší tlak. Ponorka v moři v hloubce 2 000 m: p = 2 000 · 1 030 · 10 = 20 600 000 Pa.">
	<title>Hydrostatický tlak 2/6: Hloubka a hustota</title>
	<!-- Panel 2/6 infografiky Hydrostatický tlak (W53, 14. 10. 2026); bez animace = koncový stav. -->
	<style>
		.p2-s0 { animation: p2-s0 6s linear infinite; }
		@keyframes p2-s0 { 0% { opacity: 0 } 6% { opacity: 0 } 12% { opacity: 1 } 90% { opacity: 1 } 97% { opacity: 0 } 100% { opacity: 0 } }
		.p2-s1 { animation: p2-s1 6s linear infinite; }
		@keyframes p2-s1 { 0% { opacity: 0 } 18% { opacity: 0 } 24% { opacity: 1 } 90% { opacity: 1 } 97% { opacity: 0 } 100% { opacity: 0 } }
		.p2-s2 { animation: p2-s2 6s linear infinite; }
		@keyframes p2-s2 { 0% { opacity: 0 } 30% { opacity: 0 } 36% { opacity: 1 } 90% { opacity: 1 } 97% { opacity: 0 } 100% { opacity: 0 } }
		.p2-d { animation: p2-d 6s linear infinite; }
		@keyframes p2-d { 0% { opacity: 0 } 42% { opacity: 0 } 48% { opacity: 1 } 90% { opacity: 1 } 97% { opacity: 0 } 100% { opacity: 0 } }
		@media (prefers-reduced-motion: reduce) {
			.p2-d, .p2-s0, .p2-s1, .p2-s2 { animation: none; }
		}
	</style>
	<defs><marker id="sip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8460b"/></marker><marker id="p2r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e03131"/></marker></defs>
	<rect x="0" y="0" width="460" height="714" fill="#f8f9fa"/>
	<rect x="26" y="16" width="420" height="694" rx="12" fill="#dee2e6"/><rect x="20" y="10" width="420" height="694" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="44" r="17" fill="#2b2a26"/><text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Hloubka a hustota</text>
	<text x="40" y="92" font-size="19" fill="#2b2a26">Kapalina nad námi tlačí svou tíhou.</text><rect x="40" y="108" width="380" height="124" rx="10" fill="#fff" stroke="#2b2a26" stroke-width="2"/><text x="230" y="146" font-size="30" font-weight="bold" text-anchor="middle" fill="#b8460b">p<tspan font-size="18" dy="6">h</tspan><tspan dy="-6"> = h · ρ · g</tspan></text><text x="56" y="176" font-size="17" fill="#2b2a26">h … hloubka pod hladinou (m)</text><text x="56" y="198" font-size="17" fill="#2b2a26">ρ … hustota kapaliny (kg/m³)</text><text x="56" y="220" font-size="17" fill="#2b2a26">g = 10 N/kg</text><rect x="140" y="272" width="180" height="158" fill="#74c0fc"/><path d="M140 256 L140 430 L320 430 L320 256" fill="none" stroke="#495057" stroke-width="5" stroke-linejoin="round"/><line x1="140" y1="272" x2="320" y2="272" stroke="#1c7ed6" stroke-width="2.5"/><text x="312" y="292" font-size="15" text-anchor="end" fill="#1c7ed6">hladina</text><line x1="62" y1="276" x2="62" y2="426" stroke="#2b2a26" stroke-width="2" marker-end="url(#sip)"/><text x="80" y="356.0" font-size="16" text-anchor="middle" fill="#2b2a26" transform="rotate(-90 80 356.0)">hloubka</text><g class="p2-s0"><line x1="142" y1="317" x2="124" y2="317" stroke="#e03131" stroke-width="5" marker-end="url(#p2r)"/><line x1="318" y1="317" x2="336" y2="317" stroke="#e03131" stroke-width="5" marker-end="url(#p2r)"/></g><g class="p2-s1"><line x1="142" y1="367" x2="107" y2="367" stroke="#e03131" stroke-width="5" marker-end="url(#p2r)"/><line x1="318" y1="367" x2="353" y2="367" stroke="#e03131" stroke-width="5" marker-end="url(#p2r)"/></g><g class="p2-s2"><line x1="142" y1="417" x2="89" y2="417" stroke="#e03131" stroke-width="5" marker-end="url(#p2r)"/><line x1="318" y1="417" x2="371" y2="417" stroke="#e03131" stroke-width="5" marker-end="url(#p2r)"/></g><g class="p2-d"><line x1="180" y1="428" x2="180" y2="485" stroke="#e03131" stroke-width="5" marker-end="url(#p2r)"/><line x1="230" y1="428" x2="230" y2="485" stroke="#e03131" stroke-width="5" marker-end="url(#p2r)"/><line x1="280" y1="428" x2="280" y2="485" stroke="#e03131" stroke-width="5" marker-end="url(#p2r)"/></g><text x="334" y="298" font-size="16" fill="#6b6a60">stěny</text><text x="300" y="464" font-size="16" fill="#6b6a60">dno</text><text x="230" y="506" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">Hlouběji → víc vody nad námi → větší tlak.</text><rect x="40" y="522" width="380" height="172" rx="10" fill="#fff4e6" stroke="#b8460b" stroke-width="2"/><rect x="56" y="538" width="22" height="22" rx="4" fill="#74c0fc"/><text x="86" y="556" font-size="18" fill="#2b2a26">sladká voda 1 000 kg/m³</text><rect x="56" y="568" width="22" height="22" rx="4" fill="#3b8fd9"/><text x="86" y="586" font-size="18" fill="#2b2a26">mořská voda 1 030 kg/m³</text><text x="56" y="614" font-size="18" font-weight="bold" fill="#2b2a26">Hustší kapalina → větší tlak.</text><text x="56" y="646" font-size="17" fill="#6b6a60">Ponorka v moři v hloubce 2 000 m:</text><text x="56" y="674" font-size="18" fill="#2b2a26">p = 2 000 · 1 030 · 10 = <tspan font-weight="bold" fill="#b8460b">20 600 000 Pa</tspan></text>
</svg>
