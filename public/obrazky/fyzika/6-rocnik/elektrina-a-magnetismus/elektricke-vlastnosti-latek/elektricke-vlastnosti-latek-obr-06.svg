<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace ve dvou částech. Nahoře: k pramenu vlasů s kladným nábojem se přiblíží plastový hřeben se zápornými náboji a vlasy se k němu nakloní – opačné náboje se přitahují. Dole: pět pramenů vlasů se nabije kladně a rozestoupí se od sebe – stejné náboje se odpuzují.">
<style>
/* Předloha: PDF Elektrické vlastnosti látek, oddíl Elektrické pole (text bez obrázku): nesouhlasně nabitá tělesa se přitahují – hřeben (-) a vlasy (+); souhlasně nabitá se odpuzují – jednotlivé vlasy (+) mezi sebou. Animace 10 s: hřeben se přiblíží a prameny se natočí o 20° k němu; prameny dole dostanou + a rozevřou se o ±17° a ±34°. Žluté šipky = směr síly. Bez animace = koncový stav. Úhly jsou pro názornost. */
@keyframes hA { 0%, 8% { transform: translateX(-130px); } 36%, 76% { transform: translateX(0); } 94%, 100% { transform: translateX(-130px); } }
@keyframes pa { 0%, 16% { transform: rotate(0deg); } 40%, 72% { transform: rotate(20deg); } 92%, 100% { transform: rotate(0deg); } }
@keyframes sA { 0%, 36% { opacity: 0; } 42%, 72% { opacity: 1; } 78%, 100% { opacity: 0; } }
@keyframes pbz { 0%, 12% { opacity: 0; } 20%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
@keyframes sB { 0%, 46% { opacity: 0; } 52%, 86% { opacity: 1; } 92%, 100% { opacity: 0; } }
.hA { animation: hA 10s ease-in-out infinite; }
.pa { transform-box: view-box; transform-origin: 420px 176px; transform: rotate(20deg); animation: pa 10s ease-in-out infinite; }
.sA { animation: sA 10s linear infinite; } .pbz { animation: pbz 10s linear infinite; } .sB { animation: sB 10s linear infinite; }
@keyframes pb0 { 0%, 20% { transform: rotate(0deg); } 48%, 88% { transform: rotate(-34deg); } 98%, 100% { transform: rotate(0deg); } }
.pb0 { transform-box: view-box; transform-origin: 300px 520px; transform: rotate(-34deg); animation: pb0 10s ease-in-out infinite; }
@keyframes pb1 { 0%, 20% { transform: rotate(0deg); } 48%, 88% { transform: rotate(-17deg); } 98%, 100% { transform: rotate(0deg); } }
.pb1 { transform-box: view-box; transform-origin: 300px 520px; transform: rotate(-17deg); animation: pb1 10s ease-in-out infinite; }
@keyframes pb2 { 0%, 20% { transform: rotate(0deg); } 48%, 88% { transform: rotate(0deg); } 98%, 100% { transform: rotate(0deg); } }
.pb2 { transform-box: view-box; transform-origin: 300px 520px; transform: rotate(0deg); animation: pb2 10s ease-in-out infinite; }
@keyframes pb3 { 0%, 20% { transform: rotate(0deg); } 48%, 88% { transform: rotate(17deg); } 98%, 100% { transform: rotate(0deg); } }
.pb3 { transform-box: view-box; transform-origin: 300px 520px; transform: rotate(17deg); animation: pb3 10s ease-in-out infinite; }
@keyframes pb4 { 0%, 20% { transform: rotate(0deg); } 48%, 88% { transform: rotate(34deg); } 98%, 100% { transform: rotate(0deg); } }
.pb4 { transform-box: view-box; transform-origin: 300px 520px; transform: rotate(34deg); animation: pb4 10s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
