<svg viewBox="0 0 460 720" width="460" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Magnetické vlastnosti látek v pohybu, Dočasný a trvalý magnet: dvě ocelové tyče drží s přiloženým magnetem hřebíky. Magnety oddálíme. Z tyče z měkké oceli hřebíky odpadnou, je to dočasný magnet. Na tyči z tvrdé oceli hřebíky zůstanou, je to trvalý magnet. Odmagnetování: třením opačným pólem magnetu, cívkou se střídavým proudem nebo zahřátím." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Magnetické vlastnosti látek v pohybu 2/2: Dočasný a trvalý magnet</title>
	<!-- W102. Předloha: PDF 6/08/15. Magnetické vlastnosti látek, s. 9 (Dočasný magnet – po odstranění magnetu hřebíky opět odpadnou, magneticky měkká ocel; Trvalý magnet – hřebíky neodpadnou, magneticky tvrdá ocel; Odmagnetování – třením opačným pólem, cívkou se střídavým proudem, zahřátím), výklad temata.ts (Chování těles v magnetickém poli). Cyklus 8 s: magnety odjedou 0,4–1,2 s; hřebíky vlevo padají 1,2–1,6 s; popisky dočasný/trvalý od 1,6 s; magnety se vrací 6,8–7,6 s, hřebíky vyskočí 7,6–8,0 s. Klid (reduced motion): magnety pryč, vlevo hřebíky na stole. -->
	<style>
		.a2mg { animation: a2mg 8s infinite; }
		@keyframes a2mg { 0%, 5% { transform: translateY(0px); opacity: 1; animation-timing-function: ease-in; } 15%, 85% { transform: translateY(-30px); opacity: 0; animation-timing-function: ease-out; } 95%, 100% { transform: translateY(0px); opacity: 1; } }
		.a2n1 { animation: a2n1 8s infinite; }
		@keyframes a2n1 { 0%, 15% { transform: translate(0px, 0px) rotate(0deg); animation-timing-function: ease-in; } 20%, 95% { transform: translate(-53px, 40px) rotate(-90deg); animation-timing-function: ease-out; } 100% { transform: translate(0px, 0px) rotate(0deg); } }
		.a2n2 { animation: a2n2 8s infinite; }
		@keyframes a2n2 { 0%, 15% { transform: translate(0px, 0px) rotate(0deg); animation-timing-function: ease-in; } 20%, 95% { transform: translate(-20px, 40px) rotate(-90deg); animation-timing-function: ease-out; } 100% { transform: translate(0px, 0px) rotate(0deg); } }
		.a2n3 { animation: a2n3 8s infinite; }
		@keyframes a2n3 { 0%, 15% { transform: translate(0px, 0px) rotate(0deg); animation-timing-function: ease-in; } 20%, 95% { transform: translate(13px, 40px) rotate(-90deg); animation-timing-function: ease-out; } 100% { transform: translate(0px, 0px) rotate(0deg); } }
		.a2lb { animation: a2lb 8s step-end infinite; }
		@keyframes a2lb { 0% { opacity: 0; } 20% { opacity: 1; } 85% { opacity: 0; } 100% { opacity: 0; } }
		.a2s0 { animation: a2s0 8s step-end infinite; }
		@keyframes a2s0 { 0% { opacity: 1; } 15% { opacity: 0; } 95% { opacity: 1; } 100% { opacity: 1; } }
		.a2s1 { animation: a2s1 8s step-end infinite; }
		@keyframes a2s1 { 0% { opacity: 0; } 15% { opacity: 1; } 85% { opacity: 0; } 100% { opacity: 0; } }
		.a2s2 { animation: a2s2 8s step-end infinite; }
		@keyframes a2s2 { 0% { opacity: 0; } 85% { opacity: 1; } 95% { opacity: 0; } 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.a2mg, .a2n1, .a2n2, .a2n3, .a2lb, .a2s0, .a2s1, .a2s2 { animation: none; }
		}
	</style>
