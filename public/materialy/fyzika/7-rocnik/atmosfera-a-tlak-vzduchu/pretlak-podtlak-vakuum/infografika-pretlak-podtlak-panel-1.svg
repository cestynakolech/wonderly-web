		<path d="M208 536 Q208 508 230 508 Q252 508 252 536 Z" fill="#e03131" stroke="#a51111" stroke-width="2"/>
		<text x="230" y="556" font-size="15" text-anchor="middle" fill="#2b2a26">zvon na odpad</text>
	</g>

	<!-- VAKUUM, x = 369 -->
	<g>
		<circle cx="369" cy="206" r="22" fill="#fff9db" stroke="#868e96" stroke-width="2.5"/>
		<path d="M361 222 L361 208 L365 202 L369 208 L373 202 L377 208 L377 222" fill="none" stroke="#e67700" stroke-width="2"/>
		<rect x="360" y="226" width="18" height="14" rx="2" fill="#adb5bd" stroke="#868e96" stroke-width="1.5"/>
		<text x="369" y="259" font-size="15" text-anchor="middle" fill="#2b2a26">žárovka</text>
		<text x="369" y="275" font-size="13" text-anchor="middle" fill="#495057">s vláknem</text>
	</g>
	<g>
		<rect x="330" y="290" width="78" height="44" rx="8" fill="#e7f5ff" stroke="#74c0fc" stroke-width="2"/>
