<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 565" width="460" height="565" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Zavřená lednice v řezu: teplo z kuchyně jde dovnitř pořád, tepelný izolant ve stěnách ho pouští jen pomalu. Lednice teplo odvádí ven a bere na to elektrickou energii ze zásuvky. Mrazák: otevřít krátce a hned zavřít; když zůstane otevřený, potraviny přijímají teplo a začnou tát.">
	<title>Hospodaření s teplem 3/4: Izolant ve stěnách</title>
	<!-- Panel 3/4, nová kresba (wonderly, 14. 11. 2026). Opora: výklad podtématu na webu (temata.ts) a ŠVP 8. r. Základní stav = konečný stav děje. -->
	<style>
		.h3-in0 { animation: h3-in0 8s linear infinite; }
		@keyframes h3-in0 { 0% { transform: translate(0px, 0px); opacity: 0; } 8% { opacity: 1; } 85% { transform: translate(60px, 0px); opacity: 1; } 95%, 100% { transform: translate(60px, 0px); opacity: 0; } }
		.h3-in1 { animation: h3-in1 8s linear infinite; }
		@keyframes h3-in1 { 0% { transform: translate(0px, 0px); opacity: 0; } 8% { opacity: 1; } 85% { transform: translate(60px, 0px); opacity: 1; } 95%, 100% { transform: translate(60px, 0px); opacity: 0; } }
		.h3-ven0 { animation: h3-ven 3s linear infinite; animation-delay: -0s; }
		.h3-ven1 { animation: h3-ven 3s linear infinite; animation-delay: -1s; }
		.h3-ven2 { animation: h3-ven 3s linear infinite; animation-delay: -2s; }
		@keyframes h3-ven { 0% { transform: translate(280px, 230px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(430px, 230px); opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .h3-ven0, .h3-ven1, .h3-ven2 { opacity: 0; } }
		.h3-el0 { animation: h3-el 3s linear infinite; animation-delay: -0s; }
		.h3-el1 { animation: h3-el 3s linear infinite; animation-delay: -1s; }
		.h3-el2 { animation: h3-el 3s linear infinite; animation-delay: -2s; }
		@keyframes h3-el { 0% { transform: translate(398px, 389px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(322px, 389px); opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .h3-el0, .h3-el1, .h3-el2 { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .h3-in0, .h3-in1, .h3-ven0, .h3-ven1, .h3-ven2, .h3-el0, .h3-el1, .h3-el2 { animation: none; } }
	</style>
	<defs><marker id="h3-r" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a" /></marker><marker id="h3-k" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057" /></marker></defs>
	<rect x="0" y="0" width="460" height="565" fill="#f8f9fa" />
