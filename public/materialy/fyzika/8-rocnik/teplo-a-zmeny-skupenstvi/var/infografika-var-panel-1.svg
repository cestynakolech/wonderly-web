<svg viewBox="0 0 460 740" width="460" height="740" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Var a vypařování: vlevo skleněná kádinka se studenou vodou, oranžové kuličky (model částic páry) odcházejí jen z hladiny a uvnitř vody nic nevzniká. Vpravo kádinka, postavená výš na rozpálené plotýnce vařiče, který stojí na stole; za běžného tlaku voda vře při 100 °C, bubliny páry vznikají u dna i uvnitř vody, stoupají a na hladině praskají. Vypařování probíhá jen z povrchu a při každé teplotě, var v celém objemu a jen při teplotě varu." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Var 1/2: Var a vypařování</title>
	<!-- OPRAVA 2 (14. 10. 2026, TEPLO-A-kontrola): miska a hrnec nahrazeny dvěma stejnými kádinkami (srovnání jen podle ohřevu, nekryje se s hrncem var-obr-03); reduced-motion ukazuje částice páry v různých výškách nad hladinou. -->
	<style>
		.p1-vd, .p1-vd2, .p1-rd { animation: p1vd 6s linear infinite; }
		.p1-vd2 { animation-name: p1vd2; }
		.p1-rd { animation: p1rd 3s linear infinite; }
		@keyframes p1vd { 0% { transform: translate(0px, 0px); opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(14px, -200px); opacity: 0; } }
		@keyframes p1vd2 { 0% { transform: translate(0px, 0px); opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-14px, -200px); opacity: 0; } }
		@keyframes p1rd { 0% { transform: translate(0px, 0px); opacity: 0; } 10% { opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(8px, -120px); opacity: 0; } }
		.p1-ba, .p1-bb, .p1-bc { transform-box: fill-box; transform-origin: center; }
		.p1-ba { animation: p1ba 2.4s linear infinite; }
		.p1-bb { animation: p1bb 1.6s linear infinite; }
		.p1-bc { animation: p1bc 1.1s linear infinite; }
		@keyframes p1ba { 0% { transform: translateY(0px) scale(0.4); opacity: 0; } 12% { opacity: 1; } 88% { transform: translateY(-104px) scale(1.2); opacity: 1; } 100% { transform: translateY(-114px) scale(1.5); opacity: 0; } }
		@keyframes p1bb { 0% { transform: translateY(0px) scale(0.4); opacity: 0; } 15% { opacity: 1; } 85% { transform: translateY(-66px) scale(1.1); opacity: 1; } 100% { transform: translateY(-74px) scale(1.4); opacity: 0; } }
		@keyframes p1bc { 0% { transform: translateY(0px) scale(0.4); opacity: 0; } 20% { opacity: 1; } 85% { transform: translateY(-42px) scale(1); opacity: 1; } 100% { transform: translateY(-48px) scale(1.3); opacity: 0; } }
		.p1-zar { animation: p1zar 1.8s ease-in-out infinite alternate; }
		@keyframes p1zar { from { opacity: 0.55; } to { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) { .p1-vd, .p1-vd2, .p1-rd, .p1-ba, .p1-bb, .p1-bc, .p1-zar { animation: none; }
			.p1-vd:nth-child(1) { transform: translate(2px, -20px); } .p1-vd2:nth-child(2) { transform: translate(-5px, -70px); } .p1-vd:nth-child(3) { transform: translate(7px, -120px); } .p1-vd2:nth-child(4) { transform: translate(-10px, -170px); }
			.p1-rd:nth-child(1) { transform: translate(2px, -18px); } .p1-rd:nth-child(2) { transform: translate(4px, -60px); } .p1-rd:nth-child(3) { transform: translate(3px, -95px); } .p1-rd:nth-child(4) { transform: translate(6px, -40px); } .p1-rd:nth-child(5) { transform: translate(5px, -80px); } .p1-rd:nth-child(6) { transform: translate(8px, -110px); } }
	</style>
	<rect x="0" y="0" width="460" height="740" fill="#f8f9fa"/>
	<g id="panel-1">
		<rect x="26" y="16" width="420" height="716" rx="12" fill="#dee2e6"/>
		<rect x="20" y="10" width="420" height="716" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/>
		<circle cx="52" cy="44" r="17" fill="#2b2a26"/>
		<text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
		<text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Var a vypařování</text>
		<text x="34" y="92" font-size="21" fill="#2b2a26">Odkud z vody odchází pára?</text>
		<rect x="30" y="110" width="400" height="470" rx="8" fill="#ffffff"/>
		<line x1="230" y1="122" x2="230" y2="568" stroke="#ced4da" stroke-width="2" stroke-dasharray="8 6"/>
		<text x="130" y="142" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">vypařování</text>
		<text x="130" y="166" font-size="17" text-anchor="middle" fill="#495057">jen z povrchu</text>
		<text x="330" y="142" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">var</text>
		<text x="330" y="166" font-size="17" text-anchor="middle" fill="#495057">v celém objemu</text>

		<!-- stůl přes obě poloviny (miska i vařič na něm stojí) -->
		<rect x="32" y="476" width="396" height="12" fill="#c8935a"/>
		<line x1="32" y1="476" x2="428" y2="476" stroke="#8a5a2b" stroke-width="2"/>
		<!-- VLEVO: skleněná kádinka se studenou vodou na stole -->
		<path d="M66,364 L66,468 Q66,474 72,474 L188,474 Q194,474 194,468 L194,364" fill="#f8fcff" stroke="#868e96" stroke-width="2.5"/>
		<path d="M66,364 L59,357" stroke="#868e96" stroke-width="2.5" stroke-linecap="round"/>
		<path d="M68,400 L192,400 L192,468 Q192,472 188,472 L72,472 Q68,472 68,468 Z" fill="#a5d8ff"/>
		<line x1="68" y1="400" x2="192" y2="400" stroke="#1c7ed6" stroke-width="2.5"/>
		<g stroke="#d9480f" stroke-width="1.5" fill="#ff922b">
			<circle class="p1-vd" cx="88" cy="398" r="5"/>
			<circle class="p1-vd2" cx="118" cy="398" r="5" style="animation-delay:-1.5s"/>
			<circle class="p1-vd" cx="148" cy="398" r="5" style="animation-delay:-3s"/>
			<circle class="p1-vd2" cx="176" cy="398" r="5" style="animation-delay:-4.5s"/>
		</g>
		<text x="130" y="516" font-size="17" text-anchor="middle" fill="#2b2a26">studená voda v kádince</text>
		<text x="130" y="540" font-size="17" text-anchor="middle" fill="#2b2a26">bez ohřívání</text>

		<!-- VPRAVO: stejná kádinka na vařiči (stojí na stole), voda vře; posunuto o 26 px výš -->
		<g transform="translate(0,-26)">
		<rect x="252" y="486" width="156" height="16" rx="3" fill="#868e96" stroke="#495057" stroke-width="2"/>
		<circle cx="394" cy="494" r="4" fill="#343a40"/>
		<rect x="244" y="474" width="172" height="14" rx="3" fill="#343a40"/>
		<ellipse class="p1-zar" cx="330" cy="476" rx="74" ry="5" fill="#fa5252"/>
		<path d="M268,302 L268,466 Q268,472 274,472 L386,472 Q392,472 392,466 L392,302" fill="#f8fcff" stroke="#868e96" stroke-width="2.5"/>
		<path d="M268,302 L261,295" stroke="#868e96" stroke-width="2.5" stroke-linecap="round"/>
		<path d="M270,338 L390,338 L390,466 Q390,470 386,470 L274,470 Q270,470 270,466 Z" fill="#a5d8ff"/>
		<line x1="270" y1="338" x2="390" y2="338" stroke="#1c7ed6" stroke-width="2.5"/>
		<g fill="#ffffff" fill-opacity="0.85" stroke="#1c7ed6" stroke-width="2">
			<circle class="p1-ba" cx="284" cy="456" r="6"/>
			<circle class="p1-ba" cx="318" cy="456" r="6" style="animation-delay:-0.8s"/>
			<circle class="p1-ba" cx="352" cy="456" r="6" style="animation-delay:-1.6s"/>
			<circle class="p1-ba" cx="378" cy="456" r="6" style="animation-delay:-1.2s"/>
			<circle class="p1-bb" cx="300" cy="416" r="5" style="animation-delay:-0.5s"/>
			<circle class="p1-bb" cx="366" cy="416" r="5" style="animation-delay:-1.1s"/>
			<circle class="p1-bc" cx="334" cy="392" r="5" style="animation-delay:-0.3s"/>
		</g>
		<g stroke="#d9480f" stroke-width="1.5" fill="#ff922b">
			<circle class="p1-rd" cx="282" cy="336" r="5"/>
			<circle class="p1-rd" cx="304" cy="336" r="5" style="animation-delay:-0.6s"/>
			<circle class="p1-rd" cx="326" cy="336" r="5" style="animation-delay:-1.5s"/>
			<circle class="p1-rd" cx="346" cy="336" r="5" style="animation-delay:-2.1s"/>
			<circle class="p1-rd" cx="366" cy="336" r="5" style="animation-delay:-0.9s"/>
			<circle class="p1-rd" cx="384" cy="336" r="5" style="animation-delay:-2.6s"/>
		</g>
		</g>
		<text x="330" y="516" font-size="17" text-anchor="middle" fill="#2b2a26">plotýnka dodává teplo</text>
		<text x="330" y="540" font-size="17" font-weight="bold" text-anchor="middle" fill="#2b2a26">voda vře při 100 °C</text>
		<text x="330" y="562" font-size="15" text-anchor="middle" fill="#495057">(za běžného tlaku)</text>

		<!-- legenda -->
		<circle cx="52" cy="606" r="8" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
		<text x="68" y="612" font-size="17" fill="#2b2a26">bublina páry uvnitř vody</text>
		<circle cx="52" cy="634" r="5" fill="#ff922b" stroke="#d9480f" stroke-width="1.5"/>
		<text x="68" y="640" font-size="17" fill="#2b2a26">částice páry (pára sama není vidět)</text>
		<text x="34" y="680" font-size="17" fill="#2b2a26"><tspan font-weight="bold">Vypařování:</tspan> z povrchu, při každé teplotě.</text>
		<text x="34" y="706" font-size="17" fill="#2b2a26"><tspan font-weight="bold">Var:</tspan> v celém objemu, jen při teplotě varu.</text>
	</g>
</svg>
