<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 730" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Černá díra Sagittarius A* uprostřed Mléčné dráhy: černý kruh na hvězdném pozadí. Ze všech stran k ní míří paprsky světla a padají dovnitř. Šipka zevnitř ven končí zarážkou s nápisem ven ne. Černá díra má tak silnou gravitaci, že z ní neunikne ani světlo. Sagittarius A* je hmotná jako miliony Sluncí. Animace: světelné záblesky běží po paprscích do černé díry.">
