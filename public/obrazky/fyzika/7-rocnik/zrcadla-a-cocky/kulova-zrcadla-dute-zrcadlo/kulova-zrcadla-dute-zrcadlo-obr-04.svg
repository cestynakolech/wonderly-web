<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vypuklé zrcadlo. Nahoře: paprsky rovnoběžné s osou se po odrazu rozbíhají, jako by vycházely ze zdánlivého ohniska F za zrcadlem (čárkovaná prodloužení). Dole: od stromu před zrcadlem vede rovnoběžný paprsek, který se odrazí jako by vycházel z F, a paprsek mířící do F, který se odrazí rovnoběžně s osou. Prodloužení odražených paprsků se protnou za zrcadlem: obraz je zdánlivý, vzpřímený a zmenšený. Animace: paprsky se odrazí, dokreslí se prodloužení a objeví se ohnisko a obraz.">
<style>
/* Animace 9 s, smyčka. Předloha: PDF lekce 23, str. 12 (rovnoběžné paprsky, zdánlivé ohnisko za zrcadlem) a str. 14 (obraz stromu).
   Nahoře oblouk se středem v S (r = 220, f = 110). Dole f = −100 px, a = 150 → b = −60, zvětšení 0,4 (zrcadlo kreslené plošší, oblouk r = 500).
   paprsky 5–40 %, šipky 40–45 %, čárkovaná prodloužení 40–55 %, ohnisko / obraz 55–65 %, vše zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy níže ukazují vše. */
.pr { stroke-dasharray: 100 100; animation: pr 9s linear infinite; }
.si { animation: si 9s linear infinite; }
.pe { animation: pe 9s linear infinite; }
.ob { animation: ob 9s linear infinite; }
.celek { animation: celek 9s linear infinite; }
@keyframes pr { 0%, 5% { stroke-dashoffset: 100; } 40%, 100% { stroke-dashoffset: 0; } }
@keyframes si { 0%, 40% { opacity: 0; } 45%, 100% { opacity: 1; } }
@keyframes pe { 0%, 40% { opacity: 0; } 55%, 100% { opacity: 1; } }
@keyframes ob { 0%, 55% { opacity: 0; } 65%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pr, .si, .pe, .ob, .celek { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="794" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
