<linearGradient id="p-cu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8b98a"/><stop offset="1" stop-color="#e8834a"/></linearGradient><linearGradient id="b-cu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c46a2e"/><stop offset="1" stop-color="#9a4a1a"/></linearGradient><linearGradient id="v-cu" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd8b8"/><stop offset="1" stop-color="#f8b98a"/></linearGradient>
