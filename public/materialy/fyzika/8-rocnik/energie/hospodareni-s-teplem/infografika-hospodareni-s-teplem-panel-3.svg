	<text x="434" y="202" font-size="19" fill="#a61e1e" font-weight="bold" text-anchor="end">teplo ven</text>
	<rect x="400" y="372" width="30" height="34" rx="5" fill="#ffffff" stroke="#495057" stroke-width="2.5" />
	<path d="M400,389 H320" stroke="#495057" stroke-width="4" fill="none" />
	<g class="h3-el0"><circle cx="0" cy="0" r="6" fill="#fcc419" stroke="#e67700" stroke-width="2" /></g>
	<g class="h3-el1"><circle cx="0" cy="0" r="6" fill="#fcc419" stroke="#e67700" stroke-width="2" /></g>
	<g class="h3-el2"><circle cx="0" cy="0" r="6" fill="#fcc419" stroke="#e67700" stroke-width="2" /></g>
	<text x="434" y="446" font-size="19" fill="#2b2a26" font-weight="bold" text-anchor="end">elektrická energie</text>
	<text x="26" y="484" font-size="22" fill="#2b2a26">Mrazák: otevřít krátce a hned zavřít.</text>
<text x="26" y="512" font-size="22" fill="#2b2a26">Když zůstane otevřený, potraviny</text>
<text x="26" y="540" font-size="22" fill="#2b2a26">přijímají teplo a začnou tát.</text>
