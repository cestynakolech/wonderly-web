<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Hustota v gramech na centimetr krychlový: ρ = m lomeno V, hmotnost v gramech, objem v centimetrech krychlových, hustota v g/cm³. Převod: z g/cm³ na kg/m³ násobíme 1 000, zpět dělíme 1 000. Voda: 1 g/cm³ po vynásobení 1 000 je 1 000 kg/m³ a 1 000 kg/m³ po vydělení 1 000 je 1 g/cm³. Dosazujeme jednotky, které spolu souvisí: g a cm³, nebo kg a m³.">
<style>
/* Předloha: PDF Hustota — ručně psané „Výpočet hustoty“ s šipkami „v g“, „v cm³“, „v g/cm³“ a vedle oranžové obloučky
   g/cm³ → kg/m³ „· 1000“ a zpět „: 1000“; text 1 g/cm³ = 1 000 kg/m³. Barvy operací shodně se souhrnne-opakovani-velicin-obr-05: násobíme = modrá, dělíme = zelená. Překresleno, ne kopie. Příklad s vodou z výkladu (voda 1 000 kg/m³).
   Cyklus 8 s: 0–45 % zvýrazněn převod · 1 000 a jeho příklad, 50–95 % převod : 1 000. Bez animace = obojí plně viditelné. */
@keyframes nah { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0.25; } 100% { opacity: 1; } }
@keyframes dol { 0%, 45% { opacity: 0.25; } 50%, 95% { opacity: 1; } 100% { opacity: 0.25; } }
.nah { animation: nah 8s linear infinite; } .dol { animation: dol 8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .nah, .dol { animation: none; } }
</style>
<rect x="3" y="3" width="954" height="594" rx="14" fill="#f8f9fa"/>
<rect x="330" y="20" width="300" height="58" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="480" y="59" font-size="28" fill="#212529" text-anchor="middle">Hustota v g/cm³</text>
<text x="150" y="266" font-size="84" fill="#a85a12" text-anchor="middle" font-style="italic">ρ</text><text x="210" y="262" font-size="64" fill="#a85a12" text-anchor="middle">=</text><text x="300" y="222" font-size="72" fill="#a85a12" text-anchor="middle" font-style="italic">m</text><path d="M248 244H352" stroke="#a85a12" stroke-width="6" stroke-linecap="round"/><text x="300" y="322" font-size="72" fill="#a85a12" text-anchor="middle" font-style="italic">V</text>
<path d="M436 186L373.8 195.33" stroke="#1864ab" stroke-width="5" stroke-linecap="round"/><path d="M356 198L372.47 186.43L375.14 204.23Z" fill="#1864ab"/>
<text x="442" y="196" font-size="30" fill="#1864ab" font-weight="bold">v g</text>
<path d="M436 340L368.25 307.74" stroke="#1864ab" stroke-width="5" stroke-linecap="round"/><path d="M352 300L372.12 299.61L364.38 315.86Z" fill="#1864ab"/>
<text x="442" y="352" font-size="30" fill="#1864ab" font-weight="bold">v cm³</text>
<path d="M80 372L126.02 302.98" stroke="#1864ab" stroke-width="5" stroke-linecap="round"/><path d="M136 288L133.5 307.97L118.53 297.98Z" fill="#1864ab"/>
<text x="40" y="412" font-size="30" fill="#1864ab" font-weight="bold">v g/cm³</text>
<text x="640" y="276" font-size="44" font-weight="bold" fill="#a85a12" text-anchor="middle">g/cm³</text><text x="850" y="276" font-size="44" font-weight="bold" fill="#a85a12" text-anchor="middle">kg/m³</text><g class="nah"><path d="M660 222Q745 140 828 222" fill="none" stroke="#1864ab" stroke-width="5" stroke-linecap="round"/><path d="M828 222L808 214L824 202Z" fill="#1864ab" stroke="#1864ab" stroke-width="3" stroke-linejoin="round"/><text x="745" y="158" font-size="30" fill="#1864ab" text-anchor="middle" font-weight="bold">· 1 000</text>
</g><g class="dol"><path d="M828 296Q745 378 660 296" fill="none" stroke="#237032" stroke-width="5" stroke-linecap="round"/><path d="M660 296L680 304L664 316Z" fill="#237032" stroke="#237032" stroke-width="3" stroke-linejoin="round"/><text x="745" y="382" font-size="30" fill="#237032" text-anchor="middle" font-weight="bold">: 1 000</text>
</g>
<rect x="40" y="448" width="880" height="128" rx="12" fill="#fff" stroke="#adb5bd" stroke-width="2"/><text x="66" y="492" font-size="26" fill="#212529" font-weight="bold">Voda:</text>
<g class="nah"><text x="160" y="492" font-size="26" fill="#1864ab" font-weight="bold">1 g/cm³ · 1 000 ⇨ 1 000 kg/m³</text>
</g><g class="dol"><text x="160" y="540" font-size="26" fill="#237032" font-weight="bold">1 000 kg/m³ : 1 000 ⇨ 1 g/cm³</text>
</g><text x="612" y="492" font-size="21" fill="#212529" >Dosazuj jednotky, které</text>
<text x="612" y="520" font-size="21" fill="#212529" >spolu souvisí: g a cm³,</text>
<text x="612" y="548" font-size="21" fill="#212529" >nebo kg a m³.</text>

</svg>
