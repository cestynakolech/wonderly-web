ext-anchor="middle">a přitahuje je k sobě.</text><rect x="306" y="58" width="280" height="76.1" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/><path d="M352,130.1 L334,360 L392,130.1 z" fill="#fff3bf"/><path d="M352,134.1 L334,360 L392,134.1" fill="none" stroke="#f08c00" stroke-width="2.5" stroke-linejoin="round"/><text x="446" y="89.9" font-size="22" fill="#212529" text-anchor="middle">Ruce působí na pás</text><text x="446" y="118" font-size="22" fill="#212529" text-anchor="middle">a natáhnou ho.</text>
</svg>
