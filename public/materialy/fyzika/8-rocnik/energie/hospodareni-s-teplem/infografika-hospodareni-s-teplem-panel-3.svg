	<text x="26" y="44" font-size="25" fill="#2b2a26" font-weight="bold">Izolant ve stěnách</text>
	<text x="26" y="78" font-size="22" fill="#2b2a26">Teplo z kuchyně jde dovnitř pořád.</text>
<text x="26" y="106" font-size="22" fill="#2b2a26">Izolant ve stěnách ho pouští jen</text>
<text x="26" y="134" font-size="22" fill="#2b2a26">pomalu. Lednice teplo odvádí ven</text>
<text x="26" y="162" font-size="22" fill="#2b2a26">a bere na to elektrickou energii.</text>
