<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 630" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Elektrické pole dvou opačně nabitých kuliček: vlevo záporná modrá, vpravo kladná červená. Siločáry vycházejí z kladné kuličky a v obloucích vedou do záporné, šipky míří od plus k minus. U kuliček jsou čáry nejhustší.">
