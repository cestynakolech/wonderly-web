<svg xmlns="http://www.w3.org/2000/svg" width="460" height="600" viewBox="0 0 460 600" role="img" aria-label="Ohmův zákon v pohybu, vlákno žárovky se zahřeje: k nabité baterii jsou připojené žárovka a rezistor z konstantanu. Ruka zapne spínač. Vlákno žárovky se postupně rozžhaví z tmavě červené do jasně žluté – vlákno je horké a jeho odpor se zvětšil. Odpor rezistoru z konstantanu se skoro nemění. Ohmův zákon platí za stálé teploty.">
<title>Ohmův zákon v pohybu 2/3: Vlákno žárovky se zahřeje</title>
<!-- W107 (15. 10. 2026; oprava po kontrole 1: ruka přichází zprava a tlačí nůž spínače shora prsty na horní ploše rukojeti; přívody žárovky na závit a na spodní kontakt patice; popisek „spínač“ pod spínač, aby ho ruka nezakryla). Předloha: PDF 8/5 Elektřina/27. Ohmův zákon, s. 6 (Ohmův zákon platí jen za stálé teploty; odpor kovů s teplotou roste, např. po zapnutí žárovky; konstantan odpor skoro nemění, rezistory); výklad oddíl 6. Cyklus 12 s: 1,0–2,0 s ruka ke spínači, 2,0–2,5 s zapne (ruka po oblouku nože), 2,5–5,0 s vlákno: tmavě červené (3,3) → oranžové (4,2) → žluté (5,0), 5,8 s závěr; 11,55–11,85 s zatmění a návrat. -->
