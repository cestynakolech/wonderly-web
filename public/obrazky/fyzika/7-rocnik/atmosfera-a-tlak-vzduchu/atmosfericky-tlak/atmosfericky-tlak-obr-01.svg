<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vlevo krajina s horou a balónem, částic vzduchu je u povrchu Země nejvíc a s výškou jich ubývá, na vrcholku velehor je řídký vzduch. Vpravo graf: čím větší výška, tím menší tlak vzduchu. Animace: balón stoupá a červená úsečka ukazuje, jak se tlak vzduchu zmenšuje.">
<style>
/* Animace 10 s, smyčka. Předloha: PDF lekce 16, str. 2 (hustota vzduchu s výškou klesá, řídký vzduch ve vysokých horách),
   str. 4 (tlak největší u povrchu, s výškou se zmenšuje), str. 5 (graf závislosti tlaku na výšce — překreslen bez čísel,
   osy otočeny: výška svisle, aby seděla s krajinou vlevo). Křivka p ~ exp(-h/400 px).
   Balón stoupá 10–80 %, nahoře drží do 92 %, zmizí 92–98 %. Bez animace = koncový stav (balón nahoře, malý tlak). */
.vys { animation: vys 10s linear infinite; }
.del { transform-box: fill-box; transform-origin: 0% 50%; animation: del 10s linear infinite; }
.bod { animation: bod 10s linear infinite; }
.celek { animation: celek 10s linear infinite; }
@keyframes vys { 0% { transform: translateY(350px); } 10% { transform: translateY(350px); } 24% { transform: translateY(280px); } 38% { transform: translateY(210px); } 52% { transform: translateY(140px); } 66% { transform: translateY(70px); } 80% { transform: translateY(0px); } 100% { transform: translateY(0px); } }
@keyframes del { 0% { transform: scaleX(2.3989); } 10% { transform: scaleX(2.3989); } 24% { transform: scaleX(2.0138); } 38% { transform: scaleX(1.6905); } 52% { transform: scaleX(1.4191); } 66% { transform: scaleX(1.1912); } 80% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
@keyframes bod { 0% { transform: translateX(97.8px); } 10% { transform: translateX(97.8px); } 24% { transform: translateX(70.9px); } 38% { transform: translateX(48.3px); } 52% { transform: translateX(29.3px); } 66% { transform: translateX(13.4px); } 80% { transform: translateX(0px); } 100% { transform: translateX(0px); } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .vys, .del, .bod, .celek { animation: none; } }
</style>
