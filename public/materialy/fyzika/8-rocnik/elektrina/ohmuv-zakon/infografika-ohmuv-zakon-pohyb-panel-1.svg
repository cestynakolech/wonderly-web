<svg xmlns="http://www.w3.org/2000/svg" width="460" height="600" viewBox="0 0 460 600" role="img" aria-label="Ohmův zákon v pohybu, vybitá a nabitá baterie: k baterii jsou připojené žárovka a motorek s vrtulkou. S téměř vybitou baterií svítí žárovka slabě a vrtulka se točí pomalu. Ruka baterii vyjme, žárovka zhasne a vrtulka se zastaví. Ruka vloží nabitou baterii: žárovka svítí jasně a vrtulka se točí rychle. Napětí a proud spolu úzce souvisí.">
<title>Ohmův zákon v pohybu 1/3: Vybitá a nabitá baterie</title>
