		.c2rh { animation: c2rh 10s linear infinite; }
		@keyframes c2rh { 0% { transform: rotate(0deg); } 5% { transform: rotate(0deg); } 7.5% { transform: rotate(-0.56deg); } 10% { transform: rotate(-2.22deg); } 12.5% { transform: rotate(-5deg); } 15% { transform: rotate(-7.78deg); } 17.5% { transform: rotate(-9.44deg); } 20%, 45% { transform: rotate(-10deg); } 46%, 100% { transform: rotate(0deg); } }
		.c2rd { animation: c2rd 10s linear infinite; }
		@keyframes c2rd { 0% { transform: rotate(0deg); } 5% { transform: rotate(0deg); } 7.5% { transform: rotate(0.56deg); } 10% { transform: rotate(2.22deg); } 12.5% { transform: rotate(5deg); } 15% { transform: rotate(7.78deg); } 17.5% { transform: rotate(9.44deg); } 20%, 45% { transform: rotate(10deg); } 46%, 100% { transform: rotate(0deg); } }
		.c2th { animation: c2th 10s linear infinite; }
		@keyframes c2th { 0% { transform: rotate(0deg) scaleY(1); } 5% { transform: rotate(0deg) scaleY(1); } 7.5% { transform: rotate(2.08deg) scaleY(0.997); } 10% { transform: rotate(8.39deg) scaleY(0.991); } 12.5% { transform: rotate(19deg) scaleY(0.993); } 15% { transform: rotate(29.53deg) scaleY(1.013); } 17.5% { transform: rotate(35.71deg) scaleY(1.032); } 20%, 45% { transform: rotate(37.74deg) scaleY(1.04); } 46%, 100% { transform: rotate(0deg) scaleY(1); } }
		.c2td { animation: c2td 10s linear infinite; }
		@keyframes c2td { 0% { transform: rotate(0deg) scaleY(1); } 5% { transform: rotate(0deg) scaleY(1); } 7.5% { transform: rotate(-2.08deg) scaleY(0.997); } 10% { transform: rotate(-8.39deg) scaleY(0.991); } 12.5% { transform: rotate(-19deg) scaleY(0.993); } 15% { transform: rotate(-29.53deg) scaleY(1.013); } 17.5% { transform: rotate(-35.71deg) scaleY(1.032); } 20%, 45% { transform: rotate(-37.74deg) scaleY(1.04); } 46%, 100% { transform: rotate(0deg) scaleY(1); } }
		.c2pa { animation: c2pa 10s linear infinite; }
		@keyframes c2pa { 0% { transform: rotate(-5.95deg) scaleX(0.965); } 5% { transform: rotate(-5.95deg) scaleX(0.965); } 7.5% { transform: rotate(-10.48deg) scaleX(0.881); } 10% { transform: rotate(-29.42deg) scaleX(0.673); } 12.5% { transform: rotate(-77.24deg) scaleX(0.543); } 15% { transform: rotate(-120.59deg) scaleX(0.681); } 17.5% { transform: rotate(-137.75deg) scaleX(0.847); } 20%, 91.5% { transform: rotate(-142.13deg) scaleX(0.912); } 94.25% { transform: rotate(-77.24deg) scaleX(0.543); } 97%, 100% { transform: rotate(-5.95deg) scaleX(0.965); } }
		.c2pr { animation: c2pr 10s linear infinite; }
		@keyframes c2pr { 0% { transform: translate(144px, 307px) rotate(-5.95deg) scaleX(0.965); } 5% { transform: translate(144px, 307px) rotate(-5.95deg) scaleX(0.965); } 7.5% { transform: translate(139.33px, 303.99px) rotate(-2.3deg) scaleX(0.987); } 10% { transform: translate(125.33px, 295.46px) rotate(6.99deg) scaleX(1.075); } 12.5% { transform: translate(102px, 285.5px) rotate(15.38deg) scaleX(1.245); } 15% { transform: translate(78.67px, 282.68px) rotate(16.16deg) scaleX(1.388); } 17.5% { transform: translate(64.67px, 283.54px) rotate(14.64deg) scaleX(1.461); } 20%, 91.5% { transform: translate(60px, 284px) rotate(14.04deg) scaleX(1.484); } 94.25% { transform: translate(102px, 285.5px) rotate(15.38deg) scaleX(1.245); } 97%, 100% { transform: translate(144px, 307px) rotate(-5.95deg) scaleX(0.965); } }
		.c2si { animation: c2si 10s linear infinite; }
		@keyframes c2si { 0%, 20% { opacity: 0; } 22%, 44% { opacity: 1; } 45%, 100% { opacity: 0; } }
		.c2c0 { animation: c2c0 10s step-end infinite; }
		@keyframes c2c0 { 0% { opacity: 1; } 5% { opacity: 0; } 97% { opacity: 1; } 100% { opacity: 1; } }
		.c2c1 { animation: c2c1 10s step-end infinite; }
		@keyframes c2c1 { 0% { opacity: 0; } 5% { opacity: 1; } 45% { opacity: 0; } 100% { opacity: 0; } }
		.c2c2 { animation: c2c2 10s step-end infinite; }
		@keyframes c2c2 { 0% { opacity: 0; } 45% { opacity: 1; } 90% { opacity: 0; } 100% { opacity: 0; } }
		.c2c3 { animation: c2c3 10s step-end infinite; }
		@keyframes c2c3 { 0% { opacity: 0; } 48.5% { opacity: 1; } 90% { opacity: 0; } 100% { opacity: 0; } }
		.c2c4 { animation: c2c4 10s step-end infinite; }
		@keyframes c2c4 { 0% { opacity: 0; } 91.5% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
