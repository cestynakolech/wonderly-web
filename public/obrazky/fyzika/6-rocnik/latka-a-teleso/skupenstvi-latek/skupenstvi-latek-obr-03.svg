<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 716" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kapalné skupenství. Nahoře moře, jeho hladina je vodorovná. Dole kulatá skleněná mísa s vodou a rybičkami: voda má tvar mísy a nahoře vodorovnou hladinu. Kapalina mění tvar podle nádoby, objem ne. Animace: rybičky plavou, stoupají bublinky.">
<style>
.r1 { transform-box: fill-box; transform-origin: center; animation: r1 9s ease-in-out infinite; } @keyframes r1 { 0% { transform: translateX(0) scaleX(1); } 45% { transform: translateX(-40px) scaleX(1); } 50% { transform: translateX(-40px) scaleX(-1); } 95% { transform: translateX(80px) scaleX(-1); } 100% { transform: translateX(0) scaleX(1); } } .r2 { transform-box: fill-box; transform-origin: center; animation: r2 12s ease-in-out infinite; } @keyframes r2 { 0% { transform: translateX(0) scaleX(1); } 45% { transform: translateX(70px) scaleX(1); } 50% { transform: translateX(70px) scaleX(-1); } 95% { transform: translateX(-60px) scaleX(-1); } 100% { transform: translateX(0) scaleX(1); } } .b0 { animation: bub 3s linear 0s infinite; } .b1 { animation: bub 3s linear -1s infinite; } .b2 { animation: bub 3s linear -2s infinite; } @keyframes bub { 0% { transform: translateY(0); opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(-110px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .r1, .r2, .b0, .b1, .b2 { animation: none; } }
/* Předloha: PDF Skupenství látek, dvojice fotek u Kapalného skupenství – moře a kulaté akvárium. Překresleno. */
</style>
