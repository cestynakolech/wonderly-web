<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 676" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pomůcky pro zapamatování. Nahoře řeka: koryto se u ostrova rozdělí do dvou ramen a za ostrovem se zase spojí, jako se proud rozdělí do dvou větví obvodu; voda se nikde neztrácí. Animace: bílé pruhy proudící vody se posouvají po proudu, v hlavním korytě dvě řady, v každém rameni jedna. Dole odporové dráty: dva dráty za sebou jsou jako jeden delší drát, odpor je větší. Dva stejně dlouhé dráty vedle sebe jsou jako jeden tlustší drát s větším průřezem, odpor je menší.">
<style>
/* Předloha: PDF lekce 29, s. 5–6 (POMŮCKY PRO ZAPAMATOVÁNÍ: proud jako voda v korytě řeky, v rozvětveném obvodu
   se rozdělí do větví; rezistory za sebou = delší odporový drát → větší odpor, vedle sebe = větší plocha průřezu
   → menší odpor). V PDF je pomůcka jen textem, obrázek chybí – děj nakreslen podle textu. Opora: výklad § 5.
   Animace: bílé pruhy proudící vody se stále posouvají po proudu (posun 44 px za 1,5 s, vzor 14 + 30 px, smyčka
   bez švu); v hlavním korytě jsou dvě řady pruhů, v každém rameni jedna – tok se rozdělí a zase spojí.
   Bez animace (reduced-motion) = stejný obraz se stojícími pruhy. Dolní část (dráty) je statická – stav, ne děj. */
.tok { stroke-dasharray: 14 30; animation: tok 1.5s linear infinite; }
@keyframes tok { from { stroke-dashoffset: 44; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .tok { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="670" rx="14" fill="#f8f9fa"/>
<text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Pomůcka: řeka a dráty</text>
