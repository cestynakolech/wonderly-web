<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Nahoře zrcadlo v řezu: vyleštěná kovová vrstva chráněná sklem. Dole značky zrcadel v nákresu: rovinné zrcadlo je přímka, kulové zrcadlo je část kružnice; stranu, kam světlo neprojde, zašrafujeme.">
<defs>
<linearGradient id="kov" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f8f9fa"/>
<stop offset="1" stop-color="#868e96"/>
</linearGradient>
</defs>
<rect x="3" y="3" width="594" height="464" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="300" y="38" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Zrcadlo a jeho značka</text>

<!-- 1) skutečné zrcadlo v řezu -->
<text x="30" y="80" font-size="22" font-weight="bold" fill="#212529">zrcadlo v řezu</text>
<rect x="60" y="110" width="330" height="26" fill="#d0ebff" fill-opacity="0.85" stroke="#1971c2" stroke-width="2"/>
<rect x="60" y="136" width="330" height="10" fill="url(#kov)" stroke="#495057" stroke-width="1.5"/>
<rect x="60" y="146" width="330" height="12" fill="#495057"/>
<line x1="390" y1="123" x2="414" y2="110" stroke="#2b2a26" stroke-width="2"/>
<text x="420" y="112" font-size="22" fill="#212529">sklo</text>
<line x1="390" y1="141" x2="414" y2="148" stroke="#2b2a26" stroke-width="2"/>
<text x="420" y="156" font-size="22" fill="#212529">lesklý kov</text>
<text x="300" y="198" font-size="22" fill="#212529" text-anchor="middle">vyleštěný kov chráněný sklem</text>

<line x1="3" y1="222" x2="597" y2="222" stroke="#2b2a26" stroke-width="2"/>

<!-- 2) značky v nákresu: čára podle tvaru odrazné plochy + šrafování za ní -->
<text x="30" y="260" font-size="22" font-weight="bold" fill="#212529">značka v nákresu</text>
<!-- rovinné zrcadlo -->
<line x1="40" y1="320" x2="270" y2="320" stroke="#212529" stroke-width="5"/>
<path d="M50,322 l-14,16 M70,322 l-14,16 M90,322 l-14,16 M110,322 l-14,16 M130,322 l-14,16 M150,322 l-14,16 M170,322 l-14,16 M190,322 l-14,16 M210,322 l-14,16 M230,322 l-14,16 M250,322 l-14,16 M270,322 l-14,16" stroke="#212529" stroke-width="2.5"/>
<text x="155" y="380" font-size="22" fill="#212529" text-anchor="middle">rovinné zrcadlo</text>
<text x="155" y="406" font-size="22" fill="#495057" text-anchor="middle">(přímka)</text>
<!-- kulové zrcadlo: část kružnice (střed 455,470, poloměr 180), šrafy na vnější straně -->
<path d="M345.9,327 A180,180 0 0 1 564.1,327" fill="none" stroke="#212529" stroke-width="5"/>
<path d="M350.6,320.9 L325.1,320.6 M369.6,309.3 L344.3,305.9 M389.8,300.1 L365.1,293.6 M411,293.4 L387.3,283.9 M432.8,289.4 L410.5,277.1 M455,288 L434.3,273.1 M477.2,289.4 L458.5,272 M499,293.4 L482.6,273.9 M520.2,300.1 L506.2,278.7 M540.4,309.3 L529.2,286.4 M559.4,320.9 L551,296.8" stroke="#212529" stroke-width="2.5"/>
<text x="455" y="380" font-size="22" fill="#212529" text-anchor="middle">kulové zrcadlo</text>
<text x="455" y="406" font-size="22" fill="#495057" text-anchor="middle">(část kružnice)</text>
<text x="300" y="448" font-size="22" fill="#212529" text-anchor="middle">šrafy = strana, kam světlo neprojde</text>
</svg>
