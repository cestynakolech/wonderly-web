	<text x="340" y="532" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b2a26">kolo brzdí</text>
	<rect x="40" y="570" width="380" height="150" rx="10" fill="#fff4e6" stroke="#b8460b" stroke-width="2"/>
	<text x="56" y="600" font-size="18" font-weight="bold" fill="#b8460b">Hydrauliku najdeš i jinde:</text>
	<text x="56" y="632" font-size="18" fill="#2b2a26">• <tspan font-weight="bold">lis</tspan> – stlačuje materiál</text>
	<text x="56" y="662" font-size="18" fill="#2b2a26">• <tspan font-weight="bold">zubařské křeslo</tspan> – výška a poloha</text>
	<text x="56" y="692" font-size="18" fill="#2b2a26">• <tspan font-weight="bold">výtah</tspan> – kabina nevisí na lanech</text>
