<svg xmlns="http://www.w3.org/2000/svg" width="360" height="412" viewBox="0 416 360 412" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Gravitační pole Země: Země přitahuje jablko, astronauta, družici i míček do středu Země. U povrchu padá jablko svisle dolů, gravitační síla Fg míří svisle dolů. Na každý 1 kg působí asi 10 N, g = 10 N/kg, na Měsíci je g 6× menší.">
	<title>Gravitační síla 2/3: Gravitační pole Země</title>
	<!-- Panel 2/3 výřezu z infografika-gravitacni-sila.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.gs-jablko { animation: gs-pada 4s ease-in infinite; }
		@keyframes gs-pada {
			0%, 30% { transform: translateY(0); }
			60%, 100% { transform: translateY(83px); }
		}
		@media (prefers-reduced-motion: reduce) {
			.gs-jablko { animation: none; }
		}
	</style>
	<defs>
		<!-- šipka síly: začíná v 0,0 a míří ve směru +x, délka 32 -->
		<g id="gs-sipka">
			<line x1="0" y1="0" x2="20" y2="0" stroke="#e03131" stroke-width="4" />
			<polygon points="32,0 19,-7 19,7" fill="#e03131" />
		</g>
	</defs>

	<rect x="0" y="416" width="360" height="412" fill="#f8f9fa" />

	<!-- 2: Gravitační pole Země -->
	<g id="gs-pole">
		<rect x="8" y="426" width="344" height="392" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="2" />
		<circle cx="30" cy="448" r="13" fill="#ffffff" stroke="#2b2a26" stroke-width="2" />
		<text x="30" y="454" text-anchor="middle" font-size="18" font-weight="bold" fill="#c92a2a">2</text>
		<text x="52" y="455" font-size="20" font-weight="bold" fill="#2b2a26">Gravitační pole Země</text>

		<!-- Země, střed (104,592), poloměr 50 -->
		<circle cx="104" cy="592" r="50" fill="#4dabf7" stroke="#1864ab" stroke-width="3" />
		<path d="M76,566 Q90,552 106,562 Q102,580 86,584 Z M106,600 Q130,592 138,610 Q124,626 108,618 Z M68,606 Q76,600 82,610 Q76,618 70,614 Z" fill="#69db7c" stroke="#2b8a3e" stroke-width="1.5" />
		<path d="M96,584 L112,600 M112,584 L96,600" stroke="#c92a2a" stroke-width="4" stroke-linecap="round" />

		<!-- šipky do středu Země: od tělesa, hrot na povrchu -->
		<use href="#gs-sipka" transform="translate(104,510) rotate(90)" />
		<use href="#gs-sipka" transform="translate(186,592) rotate(180)" />
		<use href="#gs-sipka" transform="translate(104,674) rotate(-90)" />
		<use href="#gs-sipka" transform="translate(46,534) rotate(45)" />

		<!-- jablko nahoře -->
		<g>
			<path d="M104,490 C96,483 88,488 89,497 C90,506 97,510 104,508 C111,510 118,506 119,497 C120,488 112,483 104,490 Z" fill="#e03131" stroke="#2b2a26" stroke-width="1.5" />
			<line x1="104" y1="490" x2="106" y2="482" stroke="#5c3d1e" stroke-width="2" />
			<path d="M106,485 Q113,479 118,483 Q112,489 106,485 Z" fill="#40c057" stroke="#2b8a3e" stroke-width="1" />
		</g>

		<!-- družice vpravo: tělo, dva solární panely, anténa -->
		<g>
			<rect x="191" y="584" width="14" height="18" rx="2" fill="#ffd43b" stroke="#2b2a26" stroke-width="1.5" />
			<line x1="198" y1="584" x2="198" y2="570" stroke="#2b2a26" stroke-width="1.5" />
			<rect x="186" y="562" width="24" height="8" fill="#1971c2" stroke="#2b2a26" stroke-width="1" />
			<line x1="194" y1="562" x2="194" y2="570" stroke="#a5d8ff" stroke-width="1" />
			<line x1="202" y1="562" x2="202" y2="570" stroke="#a5d8ff" stroke-width="1" />
			<line x1="198" y1="602" x2="198" y2="614" stroke="#2b2a26" stroke-width="1.5" />
			<rect x="186" y="614" width="24" height="8" fill="#1971c2" stroke="#2b2a26" stroke-width="1" />
			<line x1="194" y1="614" x2="194" y2="622" stroke="#a5d8ff" stroke-width="1" />
			<line x1="202" y1="614" x2="202" y2="622" stroke="#a5d8ff" stroke-width="1" />
			<path d="M205,588 L212,582 M209,578 Q216,580 214,587" fill="none" stroke="#2b2a26" stroke-width="1.5" />
		</g>

		<!-- míček dole -->
		<g>
			<circle cx="104" cy="686" r="11" fill="#fab005" stroke="#2b2a26" stroke-width="1.5" />
			<path d="M95,679 Q104,686 95,693 M113,679 Q104,686 113,693" fill="none" stroke="#ffffff" stroke-width="2" />
		</g>

		<!-- astronaut vlevo nahoře: helma s hledím, batoh, ruce, nohy -->
		<g>
			<rect x="15" y="514" width="8" height="16" rx="2" fill="#adb5bd" stroke="#2b2a26" stroke-width="1.2" />
			<rect x="21" y="514" width="16" height="17" rx="4" fill="#ffffff" stroke="#2b2a26" stroke-width="1.5" />
			<circle cx="29" cy="506" r="9" fill="#ffffff" stroke="#2b2a26" stroke-width="1.5" />
			<rect x="24" y="502" width="11" height="7" rx="3" fill="#1971c2" />
			<path d="M37,517 L44,523 M21,518 L15,532" stroke="#2b2a26" stroke-width="3" stroke-linecap="round" />
			<path d="M26,531 L24,540 M33,531 L37,539" stroke="#2b2a26" stroke-width="3.5" stroke-linecap="round" />
			<line x1="23" y1="522" x2="35" y2="522" stroke="#e03131" stroke-width="2" />
		</g>
		<text x="104" y="726" text-anchor="middle" font-size="18" fill="#2b2a26">do středu Země</text>

		<!-- u povrchu: jablko padá svisle dolů, šipka Fg vychází z jablka -->
		<text x="292" y="484" text-anchor="middle" font-size="18" fill="#2b2a26">u povrchu</text>
		<text x="292" y="506" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2a26">svisle dolů</text>
		<!-- oddělení: vlevo Země z vesmíru, vpravo pohled zblízka u povrchu -->
		<line x1="228" y1="474" x2="228" y2="732" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 6" />
		<rect x="236" y="680" width="112" height="50" fill="#f8f0e6" stroke="#d9b48f" stroke-width="1.5" />
		<line x1="236" y1="680" x2="348" y2="680" stroke="#2b8a3e" stroke-width="4" />
		<rect x="274" y="586" width="12" height="94" fill="#8d5a2b" stroke="#5c3d1e" stroke-width="1.5" />
		<!-- koruna z listí: obrys (tmavé kruhy), výplň (světlé kruhy), náznak lístků -->
		<g fill="#2b8a3e">
			<circle cx="280" cy="556" r="28" /><circle cx="258" cy="550" r="20" /><circle cx="302" cy="550" r="20" />
			<circle cx="268" cy="532" r="19" /><circle cx="292" cy="532" r="19" /><circle cx="280" cy="574" r="20" />
		</g>
		<g fill="#8ce99a">
			<circle cx="280" cy="556" r="25.5" /><circle cx="258" cy="550" r="17.5" /><circle cx="302" cy="550" r="17.5" />
			<circle cx="268" cy="532" r="16.5" /><circle cx="292" cy="532" r="16.5" /><circle cx="280" cy="574" r="17.5" />
		</g>
		<g fill="none" stroke="#40c057" stroke-width="2" stroke-linecap="round">
			<path d="M262,540 q5,-6 10,0" /><path d="M286,528 q5,-6 10,0" /><path d="M270,560 q5,-6 10,0" />
			<path d="M292,556 q5,-6 10,0" /><path d="M252,556 q5,-6 10,0" /><path d="M278,578 q5,-6 10,0" />
		</g>
		<line x1="304" y1="576" x2="304" y2="583" stroke="#5c3d1e" stroke-width="2" />
		<g class="gs-jablko">
			<path d="M304,585 C300,581 296,584 296,589 C296,594 300,597 304,596 C308,597 312,594 312,589 C312,584 308,581 304,585 Z" fill="#e03131" stroke="#2b2a26" stroke-width="1.2" />
			<line x1="304" y1="590" x2="304" y2="626" stroke="#c92a2a" stroke-width="4" />
			<polygon points="304,640 297,625 311,625" fill="#c92a2a" />
			<text x="314" y="624" font-size="20" font-weight="bold" fill="#c92a2a">F<tspan font-size="15" dy="5">g</tspan></text>
		</g>

		<g font-size="18" fill="#2b2a26">
			<text x="20" y="756">• na každý <tspan font-weight="bold">1 kg</tspan> působí asi <tspan font-weight="bold">10 N</tspan></text>
			<text x="20" y="782">• g = <tspan font-weight="bold">10 N/kg</tspan></text>
			<text x="20" y="808">• na Měsíci je g <tspan font-weight="bold">6× menší</tspan></text>
		</g>
	</g>
</svg>
