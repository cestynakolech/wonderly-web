<svg viewBox="0 0 460 700" width="460" height="700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meteorologie a měření tlaku v pohybu, Přepočet na hladinu moře: stanice u moře naměří 1 020 hPa, chata 400 m nad mořem 970 hPa. Bez přepočtu by na mapě v horách vycházela věčná níže N. Po přepočtu 400 : 8 = 50 hPa a 970 + 50 = 1 020 hPa mají obě stanice stejný tlak a jde je poctivě porovnat." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Meteorologie a měření tlaku v pohybu 2/3: Přepočet na hladinu moře</title>
	<!-- W112. Opora: výklad temata.ts (naměřené hodnoty se přepočítávají na hladinu moře; bez toho by horská stanice hlásila nízký tlak pořád a na mapě by v horách vycházela věčná níže; po přepočtu jde poctivě porovnat stanice; čísla chata 400 m, 1 020 hPa, 970 hPa, 400 : 8 = 50; N = tlaková níže modře jako obr-02). Cyklus 12 s: 1–2 s údaje putují na mapu; 2 s hodnoty na mapě; 2,6–6,5 s věčná níže N; 5 s výpočet 400 : 8; 6,5 s 970 → 1 020, N zmizí. Klid: obě stanice 1 020 hPa na mapě, výpočet. -->
	<style>
