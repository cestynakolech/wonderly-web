<svg xmlns="http://www.w3.org/2000/svg" width="460" height="680" viewBox="0 0 460 680" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Ruka tlačí stejně na ostrý a na tupý nůž, ostří tlačí na chleba stejnou silou F. Pohled zepředu, chleba v řezu. Ostrý nůž zajede do chleba, tupý jen zmáčkne kůrku. Ostří zblízka: ostré ostří má malou plochu dotyku a velký tlak, tupé větší plochu a menší tlak.">
	<title>Tlak 4/6: Ostrý a tupý nůž</title>
