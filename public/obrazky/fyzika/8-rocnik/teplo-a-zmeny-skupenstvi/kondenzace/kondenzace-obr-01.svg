<svg xmlns="http://www.w3.org/2000/svg" width="375" height="540" viewBox="0 0 375 540" role="img" aria-labelledby="title desc"><title id="title">Kapalnění: plyn → kapalina</title><desc id="desc">Nahoře plyn z oddělených částic, dole kapka kapaliny. Oranžově žlutá šipka Kapalnění vede dolů z plynu do kapaliny. Stejně zbarvená šipka Vypařování vede opačně, nahoru z kapaliny do plynu.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="375" height="540" rx="0" fill="#fff" stroke="none"/><text x="187" y="33" font-size="21" text-anchor="middle" fill="#17324d">Kapalnění: plyn → kapalina</text><defs><radialGradient id="kap" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cfeefe"/><stop offset="1" stop-color="#7cc3ec"/></radialGradient></defs><rect x="12" y="55" width="351" height="34" rx="8" fill="#edf4fa" stroke="none"/><text x="187" y="79" font-size="18" text-anchor="middle" fill="#17324d">Plyn (pára)</text><circle cx="125" cy="125" r="7" fill="#ff922b" stroke="#d9480f" stroke-width="1.5"/><circle cx="210" cy="115" r="7" fill="#ff922b" stroke="#d9480f" stroke-width="1.5"/><circle cx="165" cy="165" r="7" fill="#ff922b" stroke="#d9480f" stroke-width="1.5"/><circle cx="255" cy="150" r="7" fill="#ff922b" stroke="#d9480f" stroke-width="1.5"/><path d="M75 315 L75 195" fill="none" stroke="#f59f00" stroke-width="5"/><path d="M67.5 209.0 L75.0 195.0 L82.5 209.0" fill="none" stroke="#f59f00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M300 195 L300 315" fill="none" stroke="#f59f00" stroke-width="5"/><path d="M307.5 301.0 L300.0 315.0 L292.5 301.0" fill="none" stroke="#f59f00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="92" y="235" font-size="18" text-anchor="start" fill="#17324d">Vypařování</text><text x="92" y="257" font-size="18" text-anchor="start" fill="#17324d">kapalina → plyn</text><text font-weight="bold" x="283" y="285" font-size="18" text-anchor="end" fill="#17324d">Kapalnění</text><text font-weight="bold" x="283" y="307" font-size="18" text-anchor="end" fill="#17324d">plyn → kapalina</text><rect x="12" y="330" width="351" height="34" rx="8" fill="#edf4fa" stroke="none"/><text x="187" y="354" font-size="18" text-anchor="middle" fill="#17324d">Kapalina</text><path d="M187 365.0 Q221.5 407.0 217 422.0 A30 30 0 1 1 157 422.0 Q152.5 407.0 187 365.0 Z" fill="url(#kap)" stroke="#1565a8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="175.0" cy="416.0" rx="6.0" ry="11.4" fill="#fff" opacity="0.8"/><text x="187" y="490" font-size="18" text-anchor="middle" fill="#17324d">Kuličky = model částic páry</text><text x="187" y="516" font-size="18" text-anchor="middle" fill="#17324d">Vodní pára není vidět.</text></g></svg>