<svg xmlns="http://www.w3.org/2000/svg" width="375" height="620" viewBox="0 0 375 620" role="img" aria-labelledby="title desc"><title id="title">Var</title><desc id="desc">Dole kapka kapaliny, pod ní červená šipka dodávaného tepla. Oranžově žlutá šipka Var vede nahoru od kapaliny k modelu oddělených částic páry.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="375" height="620" rx="0" fill="#fff" stroke="none"/><text x="187" y="33" font-size="21" text-anchor="middle" fill="#17324d">Var</text><defs><radialGradient id="kap" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#cfeefe"/><stop offset="1" stop-color="#7cc3ec"/></radialGradient></defs><rect x="12" y="55" width="351" height="34" rx="8" fill="#edf4fa" stroke="none"/><text x="187" y="79" font-size="18" text-anchor="middle" fill="#17324d">Plyn (pára)</text><circle cx="125" cy="125" r="7" fill="#ff922b" stroke="#d9480f" stroke-width="1.5"/><circle cx="210" cy="115" r="7" fill="#ff922b" stroke="#d9480f" stroke-width="1.5"/><circle cx="165" cy="165" r="7" fill="#ff922b" stroke="#d9480f" stroke-width="1.5"/><circle cx="255" cy="150" r="7" fill="#ff922b" stroke="#d9480f" stroke-width="1.5"/><path d="M150 315 L150 195" fill="none" stroke="#f59f00" stroke-width="5"/><path d="M142.5 209.0 L150.0 195.0 L157.5 209.0" fill="none" stroke="#f59f00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text font-weight="bold" x="168" y="245" font-size="18" text-anchor="start" fill="#17324d">Var</text><text x="168" y="267" font-size="18" text-anchor="start" fill="#17324d">kapalina → plyn</text><rect x="12" y="330" width="351" height="34" rx="8" fill="#edf4fa" stroke="none"/><text x="187" y="354" font-size="18" text-anchor="middle" fill="#17324d">Kapalina</text><path d="M187 365.0 Q221.5 407.0 217 422.0 A30 30 0 1 1 157 422.0 Q152.5 407.0 187 365.0 Z" fill="url(#kap)" stroke="#1565a8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><e