<svg viewBox="0 0 460 710" width="460" height="710" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Okamžitá rychlost a tachometr: tachometr ukazuje, jak rychle auto jede právě teď. Auto jede ve městě 50 km/h. Na semaforu naskočí oranžová a pak červená, auto zabrzdí u čáry a stojí, tachometr ukazuje 0 km/h. Na zelenou se rozjede znovu na 50 km/h a za značkou konec obce zrychlí na 90 km/h. Tachometr na palubní desce má stupnici od 0 do 220 km/h po 20 km/h, ručička i displej ukazují 50, 0, 50 a 90 km/h" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Rychlost v pohybu 3/3: Tachometr ukazuje okamžitou rychlost</title>
	<style>
		.v3-auto { transform: translate(330px, 0px); animation: v3-auto 12s linear infinite; } @keyframes v3-auto { 0% { transform: translate(0px, 0px); opacity: 1; } 28% { transform: translate(140px, 0px); } 30% { transform: translate(147px, 0px); } 32%, 48% { transform: translate(150px, 0px); } 50% { transform: translate(153px, 0px); } 52% { transform: translate(160px, 0px); } 68% { transform: translate(240px, 0px); } 70% { transform: translate(254px, 0px); } 72% { transform: translate(270px, 0px); } 88% { transform: translate(414px, 0px); opacity: 1; } 90% { transform: translate(432px, 0px); opacity: 0; } 92% { transform: translate(0px, 0px); opacity: 0; } 96%, 100% { transform: translate(0px, 0px); opacity: 1; } }
		.v3-rucka { transform-box: view-box; transform-origin: 0px 0px; transform: rotate(-24deg); animation: v3-rucka 12s linear infinite; } @keyframes v3-rucka { 0%, 28% { transform: rotate(-72deg); } 32%, 48% { transform: rotate(-132deg); } 52%, 68% { transform: rotate(-72deg); } 72%, 92% { transform: rotate(-24deg); } 95%, 100% { transform: rotate(-72deg); } }
		.v3-c50 { opacity: 0; animation: v3-c50 12s linear infinite; } @keyframes v3-c50 { 0%, 27% { opacity: 1; } 29%, 50% { opacity: 0; } 52%, 67% { opacity: 1; } 69%, 93% { opacity: 0; } 95%, 100% { opacity: 1; } }
		.v3-c0 { opacity: 0; animation: v3-c0 12s linear infinite; } @keyframes v3-c0 { 0%, 30% { opacity: 0; } 32%, 47% { opacity: 1; } 49%, 100% { opacity: 0; } }
		.v3-c90 { opacity: 1; animation: v3-c90 12s linear infinite; } @keyframes v3-c90 { 0%, 70% { opacity: 0; } 72%, 89% { opacity: 1; } 91%, 100% { opacity: 0; } }
		.v3-zelena { opacity: 1; animation: v3-zelena 12s step-end infinite; } @keyframes v3-zelena { 0% { opacity: 1; } 18% { opacity: 0; } 48% { opacity: 1; } }
		.v3-oranzova { opacity: 0; animation: v3-oranzova 12s step-end infinite; } @keyframes v3-oranzova { 0% { opacity: 0; } 18% { opacity: 1; } 22% { opacity: 0; } 46% { opacity: 1; } 48% { opacity: 0; } }
		.v3-cervena { opacity: 0; animation: v3-cervena 12s step-end infinite; } @keyframes v3-cervena { 0% { opacity: 0; } 22% { opacity: 1; } 48% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .v3-auto, .v3-rucka, .v3-c50, .v3-c0, .v3-c90, .v3-zelena, .v3-oranzova, .v3-cervena { animation: none; } }
	</style>
