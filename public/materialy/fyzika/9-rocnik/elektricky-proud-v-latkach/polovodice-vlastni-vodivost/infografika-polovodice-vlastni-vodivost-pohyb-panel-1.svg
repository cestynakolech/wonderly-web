			</g></g>
		</g>
		<use href="#q1-kahan" x="130" y="470"/>
		<g transform="translate(130,470)"><g class="q1-plamen" opacity="1"><g class="q1-mihot"><use href="#q1-ohen"/></g></g></g>
		<text class="q1-teply" opacity="1" x="130" y="566" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">proud slábne</text>

