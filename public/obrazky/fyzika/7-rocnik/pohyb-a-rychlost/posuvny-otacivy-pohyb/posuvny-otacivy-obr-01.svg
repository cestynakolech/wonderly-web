<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" viewBox="0 0 900 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Posuvný pohyb letadla: letadlo ve dvou polohách a pět rovnoběžných stejně dlouhých šipek z různých bodů letadla">
<!-- Překresleno podle PDF „Posuvný otáčivý pohyb“, str. 2 (letadlo ve dvou polohách + 5 rovnoběžných šipek).
     Barvy: červená = trajektorie bodu při posuvném pohybu. Animace jen při prefers-reduced-motion: no-preference;
     bez animace se ukáže konečný stav (obě polohy, celé šipky). -->
<style>
@media (prefers-reduced-motion: no-preference) {
  .jede { animation: jede 7s linear infinite; }
  .stopa { stroke-dasharray: 100 100; animation: stopa 7s linear infinite; }
}
@keyframes jede { 0%, 12% { transform: translateX(-400px); } 80%, 100% { transform: translateX(0px); } }
@keyframes stopa { 0%, 12% { stroke-dashoffset: 100; } 80%, 100% { stroke-dashoffset: 0; } }
</style>
<defs>
<linearGradient id="trup" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f1f3f5"/><stop offset="1" stop-color="#ced4da"/>
</linearGradient>
<linearGradient id="motor" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f8f9fa"/><stop offset="1" stop-color="#adb5bd"/>
</linearGradient>
<!-- Letadlo bokem, nos vpravo. Počátek = konec trupu u ocasu, osa trupu y = 0. -->
<g id="letadlo">
<path d="M150,-14 L118,-52 L134,-52 L214,-14 Z" fill="#adb5bd" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>
<path d="M22,-10 L-8,-32 L8,-32 L52,-12 Z" fill="#adb5bd" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>
<path d="M14,-16 L-6,-92 L18,-92 L80,-20 Z" fill="#dee2e6" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>
<path d="M6,-8 C20,-20 40,-22 62,-22 L300,-22 C334,-22 354,-12 364,0 C356,12 330,18 300,18 L70,18 C40,18 18,10 6,-8 Z" fill="url(#trup)" stroke="#495057" stroke-width="2.5"/>
<path d="M70,12 L300,12" stroke="#ced4da" stroke-width="3"/>
<path d="M330,-13 L345,-13 L352,-6 L334,-6 Z" fill="#343a40"/>
<rect x="96" y="-15" width="11" height="24" rx="2" fill="none" stroke="#868e96" stroke-width="2"/>
<rect x="296" y="-15" width="11" height="24" rx="2" fill="none" stroke="#868e96" stroke-width="2"/>
<g fill="#343a40"><circle cx="118" cy="-6" r="3.2"/><circle cx="131" cy="-6" r="3.2"/><circle cx="144" cy="-6" r="3.2"/><circle cx="157" cy="-6" r="3.2"/><circle cx="170" cy="-6" r="3.2"/><circle cx="183" cy="-6" r="3.2"/><circle cx="196" cy="-6" r="3.2"/><circle cx="209" cy="-6" r="3.2"/><circle cx="222" cy="-6" r="3.2"/><circle cx="235" cy="-6" r="3.2"/><circle cx="248" cy="-6" r="3.2"/><circle cx="261" cy="-6" r="3.2"/><circle cx="274" cy="-6" r="3.2"/><circle cx="287" cy="-6" r="3.2"/></g>
<path d="M84,-22 L94,-30 L118,-30 L112,-22 Z" fill="#ced4da" stroke="#495057" stroke-width="1.5"/>
<rect x="66" y="-46" width="68" height="24" rx="12" fill="url(#motor)" stroke="#495057" stroke-width="2"/>
<ellipse cx="132" cy="-34" rx="5" ry="11" fill="#343a40"/>
<path d="M24,-2 L-14,18 L4,18 L56,0 Z" fill="#e9ecef" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>
<path d="M148,8 L236,6 L122,70 L96,70 Z" fill="#e9ecef" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>
<path d="M176,20 L190,28" stroke="#495057" stroke-width="5"/>
<rect x="150" y="26" width="64" height="24" rx="12" fill="url(#motor)" stroke="#495057" stroke-width="2"/>
<ellipse cx="212" cy="38" rx="5" ry="11" fill="#343a40"/>
</g>
<!-- Hrot šipky: špička v bodě (0,0), míří doprava. -->
<path id="hrot" d="M0,0 L-18,-9 L-18,9 Z" fill="#e03131"/>
</defs>
<rect x="3" y="3" width="894" height="494" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="24" y="44" font-size="26" font-weight="bold" fill="#e03131">Posuvný pohyb: letadlo</text>
<rect x="24" y="66" width="852" height="300" rx="10" fill="#e7f5ff"/>
<path d="M60,120 q20,-14 44,-4 q14,-16 36,-4 q24,-2 20,14 z" fill="#ffffff" opacity="0.9"/>
<path d="M700,330 q20,-14 44,-4 q14,-16 36,-4 q24,-2 20,14 z" fill="#ffffff" opacity="0.9"/>
<!-- Poloha na začátku (průhlednější) -->
<use xlink:href="#letadlo" href="#letadlo" transform="translate(70,240)" opacity="0.55"/>
<!-- Poloha o chvíli později (při animaci přijede zleva) -->
<g transform="translate(470,240)"><g class="jede">
<use xlink:href="#letadlo" href="#letadlo"/>
<use xlink:href="#hrot" href="#hrot" x="6" y="-88"/>
<use xlink:href="#hrot" href="#hrot" x="132" y="-34"/>
<use xlink:href="#hrot" href="#hrot" x="217" y="38"/>
<use xlink:href="#hrot" href="#hrot" x="364" y="0"/>
<use xlink:href="#hrot" href="#hrot" x="100" y="68"/>
</g></g>
<!-- Trajektorie pěti bodů: každá dlouhá 400 (stejný směr, stejná délka). -->
<g stroke="#e03131" stroke-width="5" stroke-linecap="butt" fill="none">
<path class="stopa" pathLength="100" d="M76,152 H476"/>
<path class="stopa" pathLength="100" d="M202,206 H602"/>
<path class="stopa" pathLength="100" d="M287,278 H687"/>
<path class="stopa" pathLength="100" d="M434,240 H834"/>
<path class="stopa" pathLength="100" d="M170,308 H570"/>
</g>
<g fill="#e03131" stroke="#ffffff" stroke-width="2"><circle cx="76" cy="152" r="5"/><circle cx="202" cy="206" r="5"/><circle cx="287" cy="278" r="5"/><circle cx="434" cy="240" r="5"/><circle cx="170" cy="308" r="5"/></g>
<text x="250" y="352" font-size="20" font-weight="bold" fill="#495057" text-anchor="middle">poloha na začátku</text>
<text x="650" y="352" font-size="20" font-weight="bold" fill="#495057" text-anchor="middle">poloha o chvíli později</text>
<rect x="24" y="384" width="852" height="96" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
<line x1="44" y1="416" x2="96" y2="416" stroke="#e03131" stroke-width="5"/><use xlink:href="#hrot" href="#hrot" x="100" y="416"/>
<text x="112" y="423" font-size="21" fill="#2b2a26"><tspan font-weight="bold" fill="#c92a2a">trajektorie bodů letadla</tspan> — všechny šipky jsou rovnoběžné</text>
<text x="44" y="462" font-size="21" fill="#2b2a26">Každý bod letadla urazí <tspan font-weight="bold">stejnou dráhu stejným směrem</tspan>.</text>
</svg>
