<svg xmlns="http://www.w3.org/2000/svg" width="460" height="560" viewBox="0 0 460 560" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Statické působení: kniha leží na stole, Země ji táhne dolů a stůl ji tlačí nahoru, obě šipky jsou stejně dlouhé, síly se ruší a kniha zůstává v klidu. Dynamické působení: člověk tlačí auto silou F a auto se rozjíždí stále rychleji, jeho pohyb se mění.">
	<title>Síla v pohybu 1/4: Klid, nebo změna pohybu</title>
	<!-- Infografika „Síla v pohybu“, panel 1 (W70, oprava 1, 14. 10. 2026); animovaná verze obr. sila-obr-08, předloha PDF „Ipůsobení těles deformace“ str. 3.
	     Děj navíc proti obrázku: auto se pod stálou silou F zrychleně rozjíždí a odjíždí (nezastaví se, dokud ho člověk tlačí). Bez animace = konec rozjezdu. -->
	<style>
		.p7-sz, .p7-ss { animation: p7-sily 8s linear infinite; }
		@keyframes p7-sily { 0% { opacity: 0 } 6% { opacity: 0 } 12% { opacity: 1 } 90% { opacity: 1 } 96% { opacity: 0 } 100% { opacity: 0 } }
		.p7-klid { animation: p7-klid 8s linear infinite; }
		@keyframes p7-klid { 0% { opacity: 0 } 18% { opacity: 0 } 24% { opacity: 1 } 90% { opacity: 1 } 96% { opacity: 0 } 100% { opacity: 0 } }
		.p7-vid { animation: p7-vid 8s linear infinite; }
		@keyframes p7-vid { 0% { opacity: 1 } 60% { opacity: 1 } 68% { opacity: 0 } 76% { opacity: 0 } 82% { opacity: 1 } 100% { opacity: 1 } }
		.p7-jede { animation: p7-jede 8s linear infinite; }
		@keyframes p7-jede { 0% { transform: translateX(0px) } 14% { transform: translateX(0px); animation-timing-function: cubic-bezier(0.5, 0, 1, 1) } 68% { transform: translateX(120px) } 69% { transform: translateX(0px) } 100% { transform: translateX(0px) } }
		.p7-k1 { transform-box: view-box; transform-origin: 160px 484px; animation: p7-kolo 8s linear infinite; }
		.p7-k2 { transform-box: view-box; transform-origin: 266px 484px; animation: p7-kolo 8s linear infinite; }
		@keyframes p7-kolo { 0% { transform: rotate(0deg) } 14% { transform: rotate(0deg); animation-timing-function: cubic-bezier(0.5, 0, 1, 1) } 68% { transform: rotate(430deg) } 69% { transform: rotate(0deg) } 100% { transform: rotate(0deg) } }
		.p7-roz { animation: p7-roz 8s linear infinite; }
		@keyframes p7-roz { 0% { opacity: 0 } 30% { opacity: 0 } 36% { opacity: 1 } 64% { opacity: 1 } 68% { opacity: 0 } 100% { opacity: 0 } }
		@media (prefers-reduced-motion: reduce) {
			.p7-sz, .p7-ss, .p7-klid, .p7-vid, .p7-jede, .p7-k1, .p7-k2, .p7-roz { animation: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="560" fill="#f8f9fa"/>
	<rect x="26" y="16" width="420" height="540" rx="12" fill="#dee2e6"/><rect x="20" y="10" width="420" height="540" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="44" r="17" fill="#2b2a26"/><text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Klid, nebo změna pohybu</text>

	<!-- STATICKÉ PŮSOBENÍ: kniha na stole -->
	<rect x="30" y="74" width="400" height="200" rx="8" fill="#fff" stroke="#ced4da" stroke-width="2"/>
	<text x="230" y="102" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">Statické působení</text>
	<rect x="104" y="206" width="8" height="36" fill="#8a5a2b"/><rect x="348" y="206" width="8" height="36" fill="#8a5a2b"/>
	<rect x="90" y="196" width="280" height="10" rx="2" fill="#c9a37a" stroke="#8a5a2b" stroke-width="2"/>
	<rect x="176" y="172" width="108" height="24" rx="3" fill="#1c4f8a" stroke="#2b2a26" stroke-width="2"/><rect x="182" y="176" width="100" height="16" fill="#fff" stroke="#adb5bd" stroke-width="1"/><line x1="186" y1="181" x2="278" y2="181" stroke="#dee2e6" stroke-width="1"/><line x1="186" y1="186" x2="278" y2="186" stroke="#dee2e6" stroke-width="1"/>
	<g class="p7-sz"><g transform="translate(212,184) rotate(90)"><line x1="0" y1="0" x2="36" y2="0" stroke="#e03131" stroke-width="5"/><polygon points="50,0 36,-7 36,7" fill="#e03131"/><circle cx="0" cy="0" r="5" fill="#2b2a26"/></g><text x="200" y="232" font-size="18" text-anchor="end" fill="#2b2a26">síla Země</text></g>
	<g class="p7-ss"><g transform="translate(248,196) rotate(-90)"><line x1="0" y1="0" x2="36" y2="0" stroke="#e03131" stroke-width="5"/><polygon points="50,0 36,-7 36,7" fill="#e03131"/><circle cx="0" cy="0" r="5" fill="#2b2a26"/></g><text x="262" y="158" font-size="18" fill="#2b2a26">síla stolu</text></g>
	<text class="p7-klid" x="230" y="264" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">kniha je v klidu, síly se ruší</text>

	<!-- DYNAMICKÉ PŮSOBENÍ: člověk roztlačuje auto -->
	<rect x="30" y="284" width="400" height="256" rx="8" fill="#fff" stroke="#ced4da" stroke-width="2"/>
	<text x="230" y="312" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">Dynamické působení</text>
	<line x1="40" y1="500" x2="420" y2="500" stroke="#2b2a26" stroke-width="2"/>
	<!-- místo, odkud auto vyjelo -->
	<path d="M130,484 L130,456 Q132,448 142,446 L182,444 L206,420 Q212,416 222,416 L258,416 Q266,416 272,422 L290,442 Q296,444 296,452 L296,484 Z" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="6 5"/>
	<g class="p7-roz"><text x="290" y="352" font-size="18" text-anchor="middle" fill="#495057">auto se rozjíždí</text><line x1="362" y1="346" x2="392" y2="346" stroke="#495057" stroke-width="3"/><polygon points="402,346 390,340 390,352" fill="#495057"/></g>
	<g class="p7-vid"><g class="p7-jede" transform="translate(120,0)">
		<!-- člověk se opírá o zadní část auta -->
		<line x1="72" y1="466" x2="42" y2="500" stroke="#3b5bdb" stroke-width="9" stroke-linecap="round"/><line x1="72" y1="466" x2="86" y2="500" stroke="#3b5bdb" stroke-width="9" stroke-linecap="round"/>
		<line x1="72" y1="466" x2="96" y2="426" stroke="#868e96" stroke-width="16" stroke-linecap="round"/>
		<line x1="98" y1="430" x2="128" y2="460" stroke="#f1c27d" stroke-width="7" stroke-linecap="round"/>
		<circle cx="106" cy="410" r="14" fill="#f1c27d" stroke="#2b2a26" stroke-width="2"/>
		<!-- auto -->
		<path d="M130,484 L130,456 Q132,448 142,446 L182,444 L206,420 Q212,416 222,416 L258,416 Q266,416 272,422 L290,442 Q296,444 296,452 L296,484 Z" fill="#a5d8ff" stroke="#1971c2" stroke-width="2.5"/>
		<polygon points="212,442 226,424 246,424 246,442" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/><polygon points="252,442 252,424 264,424 280,442" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
		<g class="p7-k1" transform="rotate(430)"><circle cx="160" cy="484" r="16" fill="#343a40" stroke="#2b2a26" stroke-width="2"/><circle cx="160" cy="484" r="7" fill="#adb5bd"/><line x1="160" y1="470" x2="160" y2="498" stroke="#adb5bd" stroke-width="3"/></g>
		<g class="p7-k2" transform="rotate(430)"><circle cx="266" cy="484" r="16" fill="#343a40" stroke="#2b2a26" stroke-width="2"/><circle cx="266" cy="484" r="7" fill="#adb5bd"/><line x1="266" y1="470" x2="266" y2="498" stroke="#adb5bd" stroke-width="3"/></g>
		<!-- síla F: působiště v místě dotyku rukou -->
		<g transform="translate(130,460) rotate(0)"><line x1="0" y1="0" x2="42" y2="0" stroke="#e03131" stroke-width="5"/><polygon points="56,0 42,-7 42,7" fill="#e03131"/><circle cx="0" cy="0" r="5" fill="#2b2a26"/></g>
		<text x="150" y="446" font-size="21" font-weight="bold" fill="#e03131">F</text>
	</g></g>
	<text x="230" y="528" font-size="18" text-anchor="middle" fill="#2b2a26">Síla mění pohyb auta: rozjíždí se.</text>
</svg>
