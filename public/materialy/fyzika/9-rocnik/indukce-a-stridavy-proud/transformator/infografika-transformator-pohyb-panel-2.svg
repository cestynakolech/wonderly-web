		.p8-0 { opacity: 0; animation: p8n 9s linear infinite; }
		@keyframes p8n { 0%, 16% { opacity: 1; } 18%, 95% { opacity: 0; } 97%, 100% { opacity: 1; } }
		.p8-a { animation: p8a 9s linear infinite; }
