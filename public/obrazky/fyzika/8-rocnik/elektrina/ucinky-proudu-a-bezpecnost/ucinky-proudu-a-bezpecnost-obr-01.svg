<text x="442" y="612" font-size="20" fill="#c92a2a" text-anchor="middle">mozek</text>
<path d="M30 80H72" stroke="#f08c00" stroke-width="8" stroke-dasharray="14 12"/>
<text x="82" y="88" font-size="20" fill="#212529" text-anchor="start">cesta proudu</text>
