	<g>
		<rect x="333" y="474" width="72" height="62" rx="8" fill="#1b1f3b"/>
		<circle cx="384" cy="516" r="11" fill="#4dabf7"/>
		<g fill="#fff"><circle cx="344" cy="484" r="1.6"/><circle cx="360" cy="498" r="1.6"/><circle cx="396" cy="484" r="1.6"/><circle cx="348" cy="522" r="1.6"/><circle cx="372" cy="480" r="1.6"/><circle cx="358" cy="528" r="1.6"/></g>
