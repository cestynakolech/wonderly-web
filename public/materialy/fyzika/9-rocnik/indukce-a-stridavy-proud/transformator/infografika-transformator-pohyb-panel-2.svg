<svg viewBox="0 0 460 740" width="460" height="740" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nabíječka telefonu: malá nabíječka s evropskou vidlicí je v zásuvce, kabel USB-C vede ze zdířky na její čelní stěně do telefonu ve stojánku; zvětšený pohled dovnitř nabíječky ukazuje transformátor a další součástky; ze zásuvky přichází střídavé napětí 230 V, transformátor ho sníží na 20 V, další součástky přemění střídavý proud na stejnosměrný a baterie telefonu se postupně nabíjí; telefon se nabíjí stejnosměrným proudem" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
