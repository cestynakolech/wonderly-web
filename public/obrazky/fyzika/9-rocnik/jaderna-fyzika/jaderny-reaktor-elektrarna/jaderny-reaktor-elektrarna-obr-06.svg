<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kresba pohledu shora do otevřeného reaktoru pod vodou. Do hloubky vedou šedé šachty, z nich mezi palivo dole zajíždějí tmavé regulační tyče. Na dně jsou žluté konce palivových tyčí, všechno je pod modrou vodou. Animace: regulační tyče se pomalu zasouvají a vysouvají.">
<style>
.tyc { animation: tyc 8s ease-in-out infinite; }
@keyframes tyc { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(46px); } }
.tyc2 { animation: tyc 8s ease-in-out infinite; animation-delay: -4s; }
.vlna { animation: vlna 4s ease-in-out infinite; }
@keyframes vlna { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.6; } }
@media (prefers-reduced-motion: reduce) { .tyc, .tyc2, .vlna { animation: none; } }
/* Předloha: PDF 20, s. 4 – fotografie pohledu shora do otevřeného reaktoru pod vodou (svislé šachty, palivo dole,
   vše v modré vodě), u textu o regulačních tyčích. Fotka nahrazena kresbou. Animace 8 s: regulační tyče se pomalu
   zasouvají a vysouvají (regulační tyče se podle potřeby zasouvají). Bez animace = tyče v klidu. */
</style>
