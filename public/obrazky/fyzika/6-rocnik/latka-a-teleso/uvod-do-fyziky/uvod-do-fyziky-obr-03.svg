<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Otevřený čtverečkovaný sešit s tužkou. Barevně ručně napsané tři vzorce: modře v rovná se s lomeno t (rychlost), oranžově ró rovná se m lomeno V (hustota), červeně F rovná se m krát g (gravitační síla). Dole: Vzorec zapisuje vztah pomocí písmen a čísel.">
<rect x="3" y="3" width="714" height="554" rx="14" fill="#f8f9fa"/>
<!-- Předloha: PDF Úvod do fyziky, s. 5 (ručně psané vzorce v = s/t modře, ρ = m/V oranžově, F = mg červeně). Překresleno do sešitu. -->
<text x="360" y="42" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Vzorce: vztahy psané písmeny</text>
<defs><pattern id="ctverecky" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#a5d8ff" stroke-width="1"/></pattern>
<linearGradient id="drevo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd43b"/><stop offset="1" stop-color="#f59f00"/></linearGradient></defs>
<rect x="62" y="80" width="600" height="390" rx="8" fill="#000" opacity="0.12"/><rect x="54" y="70" width="600" height="390" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="54" y="70" width="600" height="390" rx="8" fill="url(#ctverecky)"/><path d="M110 70V460" stroke="#fa5252" stroke-width="2"/>
<g fill="#3b5bdb" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="bold"><text x="150" y="196" font-size="56">v =</text><text x="270" y="160" font-size="48" text-anchor="middle">s</text><path d="M240 176H300" stroke="#3b5bdb" stroke-width="5" stroke-linecap="round"/><text x="270" y="224" font-size="48" text-anchor="middle">t</text></g><text x="225" y="268" font-size="20" fill="#495057" text-anchor="middle">rychlost</text>
<g fill="#b8400a" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="bold"><text x="380" y="160" font-size="56">ρ =</text><text x="510" y="124" font-size="48" text-anchor="middle">m</text><path d="M476 140H544" stroke="#b8400a" stroke-width="5" stroke-linecap="round"/><text x="510" y="188" font-size="48" text-anchor="middle">V</text></g><text x="462" y="228" font-size="20" fill="#495057" text-anchor="middle">hustota</text>
<text x="300" y="370" font-size="60" fill="#c92a2a" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="bold">F = m · g</text><text x="410" y="412" font-size="20" fill="#495057" text-anchor="middle">gravitační síla</text>
<g transform="translate(560 300) rotate(-35)"><rect x="0" y="-11" width="150" height="22" fill="url(#drevo)" stroke="#c77700" stroke-width="2"/><path d="M0 -11L-34 0L0 11Z" fill="#ffe8cc" stroke="#c77700" stroke-width="2"/><path d="M-22 -4L-34 0L-22 4Z" fill="#343a40"/><rect x="150" y="-11" width="16" height="22" fill="#adb5bd"/><rect x="166" y="-11" width="20" height="22" rx="5" fill="#f783ac"/></g>
<rect x="60" y="484" width="600" height="54" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><text x="360" y="519" font-size="22" fill="#212529" text-anchor="middle">Vzorec zapisuje vztah pomocí písmen a čísel.</text>
</svg>
