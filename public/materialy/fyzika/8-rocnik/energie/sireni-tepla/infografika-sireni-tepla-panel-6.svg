<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 530" width="460" height="530" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Často všechno najednou: při vaření vody v hrnci na plotně se dno hrnce ohřeje od plotny vedením (1), voda se prohřeje prouděním, teplá stoupá a studenější klesá (2), a ruka kousek vedle plotny cítí teplo, které k ní přichází zářením (3).">
