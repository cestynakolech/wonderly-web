<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 892" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace částic ve třech skupenstvích. Pevná látka: částice jsou blízko u sebe v pravidelných řadách a jen kmitají na místě, látka drží tvar i objem. Kapalná látka: částice jsou blízko u sebe na dně nádoby a řady po sobě kloužou, kapalina má tvar podle nádoby. Plynná látka: několik částic daleko od sebe létá volně a rychle po celé nádobě.">
