fect="non-scaling-stroke"/></g></g><g transform="translate(0 272)"><g class="m3" transform="scale(1 0.7097)"><rect x="245" y="-62" width="55" height="62" fill="url(#potah)" stroke="#1971c2" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M272.5,-54 L258.5,-48.2 L286.5,-42.5 L258.5,-36.8 L286.5,-31 L258.5,-25.2 L286.5,-19.5 L258.5,-13.8 L272.5,-8" fill="none" stroke="#868e96" stroke-width="2.5" vector-effect="non-scaling-stroke"/></g></g><g transform="translate(0 272)"><g class="m4" transform="scale(1 0.7097)"><rect x="300" y="-62" width="55" height="62" fill="url(#potah)" stroke="#1971c2" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M327.5,-54 L313.5,-48.2 L341.5,-42.5 L313.5,-36.8 L341.5,-31 L313.5,-25.2 L341.5,-19.5 L313.5,-13.8 L327.5,-8" fill="none" stroke="#868e96" stroke-width="2.5" vector-effect="non-scaling-stroke"/></g></g><g transform="translate(0 272)"><g class="m5" transform="scale(1 0.8387)"><rect x="355" y="-62" width="55" height="62" fill="url(#potah)" stroke="#1971c2" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M382.5,-54 L368.5,-48.2 L396.5,-42.5 L368.5,-36.8 L396.5,-31 L368.5,-25.2 L396.5,-19.5 L368.5,-13.8 L382.5,-8" fill="none" stroke="#868e96" stroke-width="2.5" vector-effect="non-scaling-stroke"/></g></g><g transform="translate(0 272)"><g class="m6" transform="scale(1 0.9355)"><rect x="410" y="-62" width="55" height="62" fill="url(#potah)" stroke="#1971c2" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M437.5,-54 L423.5,-48.2 L451.5,-42.5 L423.5,-36.8 L451.5,-31 L423.5,-25.2 L451.5,-19.5 L423.5,-13.8 L437.5,-8" fill="none" stroke="#868e96" stroke-width="2.5" vector-effect="non-scaling-stroke"/></g></g><g transform="translate(0 272)"><rect x="465" y="-62" width="55" height="62" fill="url(#potah)" stroke="#1971c2" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M492.5,-54 L478.5,-48.2 L506.5,-42.5 L478.5,-36.8 L506.5,-31 L478.5,-25.2 L506.5,-19.5 L478.5,-13.8 L492.5,-8" fill="none" stroke="#868e96" stroke-width="2.5" vector-effect="non-scaling-stroke"/></g><g clip-path="url(#kp1)"><g class="r1" transform="translate(0 18)"><path d="M330,184 L420,60" stroke="#b07a52" stroke-width="42" stroke-linecap="round"/><path d="M330,184 L420,60" stroke="#f1c9a5" stroke-width="38" stroke-linecap="round"/><path d="M400,88 L460,5" stroke="#4dabf7" stroke-width="50"/><path d="M242,207 Q238,180 266,176 L340,172 Q362,180 356,207 Q300,213 242,207 Z" fill="#f1c9a5" stroke="#b07a52" stroke-width="2.5"/><path d="M250 198 h34 M250 188 h30" stroke="#b07a52" stroke-width="2" stroke-linecap="round"/><ellipse cx="306" cy="176" rx="16" ry="7" fill="#e2b48c" stroke="#b07a52" stroke-width="2"/></g></g><text x="300" y="330" font-size="19" fill="#212529" text-anchor="middle">Po zvednutí ruky se matrace vrátí do původního tvaru.</text><rect x="60" y="574" width="480" height="16" rx="4" fill="url(#deska)" stroke="#6b3f17" stroke-width="2"/><g transform="translate(300 574)"><g class="pl" transform="scale(1.7 0.42)"><circle cx="0" cy="-40" r="40" fill="url(#plast)" stroke="#a63c06" stroke-width="2.5" vector-effect="non-scaling-stroke"/><path d="M-22 -48 q8 -10 18 -6 M8 -26 q10 -4 16 4" stroke="#a63c06" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/></g></g><g clip-path="url(#kp2)"><g class="r2" transform="translate(0 -80)"><path d="M330,468 L420,344" stroke="#b07a52" stroke-width="42" stroke-linecap="round"/><path d="M330,468 L420,344" stroke="#f1c9a5" stroke-width="38" stroke-linecap="round"/><path d="M400,372 L460,289" stroke="#4dabf7" stroke-width="50"/><path d="M242,491 Q238,464 266,460 L340,456 Q362,464 356,491 Q300,497 242,491 Z" fill="#f1c9a5" stroke="#b07a52" stroke-width="2.5"/><path d="M250 482 h34 M250 472 h30" stroke="#b07a52" stroke-width="2" stroke-linecap="round"/><ellipse cx="306" cy="460" rx="16" ry="7" fill="#e2b48c" stroke="#b07a52" stroke-width="2"/></g></g><text x="300" y="628" font-size="19" fill="#212529" text-anchor="middle">