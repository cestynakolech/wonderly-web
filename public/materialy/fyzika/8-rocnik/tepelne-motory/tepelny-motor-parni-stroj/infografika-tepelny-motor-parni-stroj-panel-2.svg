<svg viewBox="0 614 460 580" width="460" height="580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hérónova baňka, první parní stroj (Hérón z Alexandrie, 1. století): oheň ohřívá kovovou nádrž s vodou, voda vře, pára jde dvěma bočními trubicemi do koule otáčivé kolem vodorovné osy a vyfukuje ze dvou zahnutých trysek; vyfukující pára odtlačuje kouli na opačnou stranu (reaktivní síla, červené šipky) a koule se točí; vynález sloužil jen pro zábavu diváků" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Tepelný motor a parní stroj 2/6: Hérónova baňka</title>
