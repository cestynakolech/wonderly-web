<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Záporně nabitá kulička vlevo a kladně nabitá kulička vpravo. Siločáry vycházejí z kladné kuličky, zakřivují se a vedou do záporné kuličky. Mezi kuličkami a těsně u nich jsou siločáry nejhustší, daleko od nich řídnou. Šipky ukazují směr siločar od + k −.">
<!-- Předloha: PDF lekce 19, s. 9 (pole dvojice opačně nabitých kuliček, − vlevo, + vpravo).
     Siločáry spočítány numericky (Coulombovo pole dvou stejně velkých opačných nábojů, 16 čar z +, krok 1 px, RK2);
     čáry, které opustí rámeček, jsou zrcadleně doplněny jako čáry vstupující do − zvenku.
     Statický obrázek: pohyblivé čárky po siločárách byly odstraněny (kontrola 3. 10. 2026, Z6) – svádějí k představě,
     že po siločárách něco teče („Siločáry nejsou hmotné nitě“). Směr ukazují šipky. -->
<defs><clipPath id="kd"><rect x="20" y="60" width="560" height="340"/></clipPath></defs>
<rect x="3" y="3" width="594" height="484" rx="14" fill="#f8f9fa"/>
<text x="300" y="40" font-size="26" fill="#212529" font-weight="bold" text-anchor="middle">Siločáry mezi opačně nabitými kuličkami</text>
