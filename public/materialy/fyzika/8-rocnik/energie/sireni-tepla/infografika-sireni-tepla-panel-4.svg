<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 610" width="460" height="610" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Záření (sálání): od Slunce letí záření prázdným prostorem (vakuem) až k Zemi. U táboráku záření z ohně dopadá na obličej, ten se ohřívá, záda zůstávají studená. Teplá tělesa vysílají infračervené záření, okem ho nevidíme, cítíme ho jako teplo; pohlcené záření těleso ohřeje. Tak hřejí i kamna a plotna.">
	<title>Šíření tepla 4/6: Záření (sálání)</title>
