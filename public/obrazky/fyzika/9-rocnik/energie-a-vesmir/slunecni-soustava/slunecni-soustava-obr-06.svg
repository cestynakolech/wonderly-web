<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Měsíc obíhá kolem Země, Slunce svítí zleva. Podle polohy Měsíce vidíme ze Země nov, první čtvrt, úplněk a poslední čtvrt. Měsíc je k Zemi natočen stále stejnou stranou. Animace: Měsíc obíhá kolem Země a dole se zvýrazní fáze, kterou právě vidíme. Velikosti ani vzdálenosti nejsou v měřítku.">
