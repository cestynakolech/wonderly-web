<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tepelná uhelná elektrárna. V kotli hoří uhlí a ohřívá vodu na páru. Pára roztáčí turbínu, ta pohání generátor a elektřina jde do vedení. V kondenzátoru se pára mění zpět na vodu, která se vrací do kotle. Z komína odchází kouř.">
<style>
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes rotz { to { transform: rotate(-360deg); } }
.rot { animation: rot 1.6s linear infinite; }
@keyframes tok { to { stroke-dashoffset: -36; } }
@keyframes tokz { to { stroke-dashoffset: 36; } }
.tok { stroke-dasharray: 12 24; animation: tok 1s linear infinite; }
.tokz { stroke-dasharray: 12 24; animation: tokz 1s linear infinite; }
@keyframes el { to { stroke-dashoffset: -18; } }
@keyframes elz { to { stroke-dashoffset: 18; } }
.el { stroke-dasharray: 8 10; animation: el 0.6s linear infinite; }
.elz { stroke-dasharray: 8 10; animation: elz 0.6s linear infinite; }
.plamen { transform-origin: 205px 512px; animation: plamen 0.5s ease-in-out infinite alternate; }
@keyframes plamen { to { transform: scale(1.08, 0.85); } }
.kour { animation: kour 4s linear infinite; }
.kour2 { animation: kour 4s linear infinite; animation-delay: -2s; }
@keyframes kour { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translate(24px, -60px); opacity: 0; } }
.pas { animation: pas 3s linear infinite; }
@keyframes pas { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 80% { transform: translate(52px, -40px); opacity: 1; } 100% { transform: translate(52px, -40px); opacity: 0; } }
/* Uhlí se sype do kotle, oheň ohřívá vodu na páru, pára roztáčí turbínu a generátor,
   v kondenzátoru se pára mění zpět na vodu, z komína jde kouř. Klid: vše stojí. */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
