<text x="156" y="506" font-size="21" font-weight="bold" fill="#212529" text-anchor="middle">odpor člověka v suchu</text>
<text x="156" y="536" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">asi 150 000 Ω</text>
<text x="156" y="568" font-size="19" fill="#212529" text-anchor="middle">i se suchou obuví</text>
<rect x="312" y="476" width="264" height="112" rx="10" fill="#fff" stroke="#ced4da" stroke-width="2"/>
<text x="444" y="506" font-size="21" font-weight="bold" fill="#212529" text-anchor="middle">odpor člověka ve vlhku</text>
<text x="444" y="536" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">asi 2 000 Ω</text>
<text x="444" y="568" font-size="19" fill="#212529" text-anchor="middle">i s vlhkou obuví</text>
<text x="300" y="622" font-size="21" font-weight="bold" fill="#212529" text-anchor="middle">Vlhko snižuje odpor – proudu projde víc.</text>
<text x="300" y="652" font-size="20" fill="#212529" text-anchor="middle">230 V a 2 000 Ω: I = 115 mA, víc než 30 mA.</text>
<text x="300" y="690" font-size="20" font-weight="bold" fill="#c92a2a" text-anchor="middle">Nikdy nezkoušej – ani suchý dotyk není bezpečný!</text>
