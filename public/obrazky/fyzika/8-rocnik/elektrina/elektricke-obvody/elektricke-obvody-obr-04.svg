<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 716" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dvě žárovky zapojené vedle sebe, každá ve vlastní větvi připojené k baterii; vodiče se spojují v uzlech. Dole schéma se dvěma větvemi a uzly vyznačenými tečkou. Když se vlákno horní žárovky přeruší, zhasne jen ona a dolní žárovka svítí dál. Animace: vlákno horní žárovky se přetrhne, dolní žárovka dál svítí.">
<style>
/* Předloha: PDF lekce 22, s. 12 (skutečný obvod: 2 žárovky nad sebou vlevo, baterie v držáku nahoře vpravo, spínač dole)
   a s. 13 (schéma: dvě větve se žárovkami, uzly vyznačené tečkou). Děj z výkladu: přeruší-li se jedna větev, ostatní fungují dál.
   8 s: 0–40 % obě svítí; ve 40 % se přeruší vlákno horní žárovky → zhasne jen ona, dolní svítí dál; v 92 % znovu.
   Bez animace = koncový stav: horní vlákno přerušené, horní nesvítí, dolní svítí. */
.fil-x { animation: zmiz 8s step-end infinite; opacity: 0; }
.brk-x, .krouzek, .sp { opacity: 1; animation: obj 8s step-end infinite; }
.sc { opacity: 0; animation: zmiz 8s step-end infinite; }
.lit-x { opacity: 0; animation: zmiz 8s step-end infinite; }
.lit-2 { opacity: 1; }
@keyframes zmiz { 0% { opacity: 1; } 40% { opacity: 0; } 92% { opacity: 1; } }
@keyframes obj { 0% { opacity: 0; } 40% { opacity: 1; } 92% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .fil-x, .brk-x, .krouzek, .sp, .sc, .lit-x { animation: none; } }
</style>
