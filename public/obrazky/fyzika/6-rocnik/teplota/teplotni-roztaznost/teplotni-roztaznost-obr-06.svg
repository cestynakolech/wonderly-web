<path d="M312 150L232 164" stroke="#212529" stroke-width="2"/><text x="228" y="170" font-size="20" fill="#212529" text-anchor="end">kapalina</text>
<path d="M342 236L380 280" stroke="#212529" stroke-width="2"/><text x="300" y="300" font-size="20" fill="#212529">uzávěr přívodu</text>
<text x="146" y="574" font-size="20" fill="#212529" text-anchor="middle">radiátor</text>
<!-- stav -->
<text x="300" y="604" font-size="21" font-weight="bold" fill="#c92a2a" text-anchor="middle" class="tO" opacity="0">Horká voda teče do radiátoru.</text>
<text x="300" y="604" font-size="21" font-weight="bold" fill="#1864ab" text-anchor="middle" class="tZ">Kapalina se roztáhla a zaškrtila přívod.</text>
</svg>
