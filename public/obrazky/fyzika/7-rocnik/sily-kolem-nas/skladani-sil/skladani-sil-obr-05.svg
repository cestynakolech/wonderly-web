<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 520" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Skládání různoběžných sil rovnoběžníkem. Ze společného působiště vede modrá šipka F1 = 40 N dlouhá 4 cm vodorovně doprava a fialová šipka F2 = 30 N dlouhá 3 cm šikmo vzhůru pod úhlem 44 stupňů. Z konců obou šipek vedou čárkované pomocné čáry rovnoběžné s druhou silou, které spolu s šipkami tvoří rovnoběžník. Červená šipka F vede z působiště do průsečíku čar a je dlouhá asi 65 mm, tedy asi 65 N. Žlutá bublina popisuje kroky 1 až 4. Měřítko 1 cm = 10 N.">
<defs>
<marker id="a-cer" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e03131"/></marker>
<marker id="a-mod" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1971c2"/></marker>
<marker id="a-zel" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2f9e44"/></marker>
<marker id="a-ora" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e8590c"/></marker>
<marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2b2a26"/></marker>
<marker id="a-sed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#495057"/></marker>
<marker id="a-zlu" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#f08c00"/></marker>
<marker id="a-fia" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#7048e8"/></marker>
<marker id="b-cer" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e03131"/></marker>
<marker id="b-zel" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#2f9e44"/></marker>
<marker id="b-mod" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#1971c2"/></marker>
<marker id="b-ora" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e8590c"/></marker>
<marker id="b-ink" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#2b2a26"/></marker>
<marker id="b-zlu" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#f08c00"/></marker>
<marker id="b-fia" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#7048e8"/></marker>
</defs>
<rect x="3" y="3" width="954" height="514" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="480.0" y="40.0" font-size="26" font-weight="bold" fill="#2b2a26" text-anchor="middle">Skládání různoběžných sil rovnoběžníkem</text>
<line x1="280.0" y1="400.0" x2="387.9" y2="295.8" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round"/>
<line x1="187.9" y1="295.8" x2="387.9" y2="295.8" stroke="#495057" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round"/>
<line x1="80.0" y1="400.0" x2="280.0" y2="400.0" stroke="#1971c2" stroke-width="8" marker-end="url(#b-mod)" stroke-linecap="round"/>
<line x1="80.0" y1="400.0" x2="187.9" y2="295.8" stroke="#7048e8" stroke-width="8" marker-end="url(#b-fia)" stroke-linecap="round"/>
<line x1="80.0" y1="400.0" x2="387.9" y2="295.8" stroke="#e03131" stroke-width="9" marker-end="url(#b-cer)" stroke-linecap="round"/>
<line x1="68.0" y1="388.0" x2="92.0" y2="412.0" stroke="#6c757d" stroke-width="5" stroke-linecap="round"/>
<line x1="68.0" y1="412.0" x2="92.0" y2="388.0" stroke="#6c757d" stroke-width="5" stroke-linecap="round"/>
<path d="M130,400 A50,50 0 0 0 116.0,365.3" fill="none" stroke="#2b2a26" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="142.0" y="388.0" font-size="22" font-weight="bold" fill="#2b2a26" text-anchor="start">44°</text>
<text x="270.0" y="434.0" font-size="24" font-weight="bold" fill="#1971c2" text-anchor="middle">F<tspan font-size="18" dy="6">1</tspan> = 40 N</text>
<text x="127.9" y="289.8" font-size="24" font-weight="bold" fill="#7048e8" text-anchor="middle">F<tspan font-size="18" dy="6">2</tspan> = 30 N</text>
<text x="341.9" y="269.8" font-size="24" font-weight="bold" fill="#e03131" text-anchor="start">F = asi 65 N</text>
<text x="50.0" y="466.0" font-size="20" fill="#495057" text-anchor="start">Společné působiště</text>
<circle cx="362.0" cy="353.9" r="15" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/>
<text x="362.0" y="360.9" font-size="19" font-weight="bold" fill="#2b2a26" text-anchor="middle">1</text>
<circle cx="287.9" cy="277.8" r="15" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/>
<text x="287.9" y="284.8" font-size="19" font-weight="bold" fill="#2b2a26" text-anchor="middle">2</text>
<circle cx="210.0" cy="363.9" r="15" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/>
<text x="210.0" y="370.9" font-size="19" font-weight="bold" fill="#2b2a26" text-anchor="middle">3</text>
<rect x="520.0" y="80.0" width="420.0" height="340.0" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text x="536.0" y="122.0" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">1.</text>
<text x="566.0" y="122.0" font-size="20" fill="#2b2a26" text-anchor="start">Z konce F<tspan font-size="18" dy="6">1</tspan> vedeme pomocnou čáru</text>
<text x="566.0" y="148.0" font-size="20" fill="#2b2a26" text-anchor="start">rovnoběžnou s F<tspan font-size="18" dy="6">2</tspan>.</text>
<text x="536.0" y="190.0" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">2.</text>
<text x="566.0" y="190.0" font-size="20" fill="#2b2a26" text-anchor="start">Z konce F<tspan font-size="18" dy="6">2</tspan> vedeme pomocnou čáru</text>
<text x="566.0" y="216.0" font-size="20" fill="#2b2a26" text-anchor="start">rovnoběžnou s F<tspan font-size="18" dy="6">1</tspan>.</text>
<text x="536.0" y="258.0" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">3.</text>
<text x="566.0" y="258.0" font-size="20" fill="#2b2a26" text-anchor="start">Výslednice F začíná v působišti a</text>
<text x="566.0" y="284.0" font-size="20" fill="#2b2a26" text-anchor="start">končí v průsečíku pomocných čar.</text>
<text x="536.0" y="326.0" font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="start">4.</text>
<text x="566.0" y="326.0" font-size="20" fill="#2b2a26" text-anchor="start">Velikost F změříme a zapíšeme</text>
<text x="566.0" y="352.0" font-size="20" fill="#2b2a26" text-anchor="start">ve správných jednotkách.</text>
<text x="536.0" y="402.0" font-size="20" font-weight="bold" fill="#e03131" text-anchor="start">65 mm na obrázku = 65 N</text>
<line x1="80.0" y1="488.0" x2="130.0" y2="488.0" stroke="#2b2a26" stroke-width="3" stroke-linecap="round"/>
<line x1="80.0" y1="480.0" x2="80.0" y2="496.0" stroke="#2b2a26" stroke-width="3" stroke-linecap="round"/>
<line x1="130.0" y1="480.0" x2="130.0" y2="496.0" stroke="#2b2a26" stroke-width="3" stroke-linecap="round"/>
<text x="142.0" y="495.0" font-size="20" fill="#2b2a26" text-anchor="start">měřítko: 1 cm = 10 N</text>
</svg>
