<svg viewBox="0 2636 460 662" width="460" height="662" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Elektrolyty jsou roztoky solí, kyselin a zásad, elektrolytem může být i roztavená látka. Vede proud: roztok kuchyňské soli, roztok kyseliny sírové, roztok skalice modré, mořská voda. Nevede proud: destilovaná voda, roztok cukru, pevná sůl. Pozor: i pitná voda vede proud, má v sobě ionty minerálních látek, na spotřebiče nesahej mokrou rukou. Cukr se rozpustí, ale na ionty se nerozpadá, proto roztok nevede." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Proud v kapalinách 5/6: Elektrolyty</title>
	<defs></defs>
	<rect x="0" y="2636" width="460" height="662" fill="#f8f9fa"/>
	<g id="panel-5"><rect x="26" y="2652" width="420" height="642" rx="12" fill="#dee2e6"/><rect x="20" y="2646" width="420" height="642" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="2680" r="17" fill="#2b2a26"/><text x="52" y="2688" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">5</text><text x="80" y="2689" font-size="25" font-weight="bold" fill="#2b2a26">Elektrolyty</text><text x="34" y="2728" font-size="21" fill="#2b2a26">Elektrolyty: roztoky <tspan font-weight="bold">solí, kyselin</tspan></text><text x="34" y="2756" font-size="21" fill="#2b2a26"><tspan font-weight="bold">a zásad</tspan>, i roztavená látka.</text><rect x="34" y="2776" width="392" height="334" rx="8" fill="#fff" stroke="#ced4da" stroke-width="2"/><circle cx="58" cy="2806" r="17" fill="#ffd43b" opacity="0.6"/><circle cx="58" cy="2806" r="11" fill="#ffd43b" stroke="#343a40" stroke-width="2"/><rect x="52" y="2816" width="12" height="8" fill="#adb5bd" stroke="#343a40" stroke-width="1.5"/><text x="84" y="2814" font-size="21" fill="#2b2a26"><tspan font-weight="bold">vede proud</tspan></text><circle cx="58" cy="2986" r="11" fill="#fff" stroke="#343a40" stroke-width="2"/><rect x="52" y="2996" width="12" height="8" fill="#adb5bd" stroke="#343a40" stroke-width="1.5"/><text x="84" y="2994" font-size="21" fill="#2b2a26"><tspan font-weight="bold">nevede proud</tspan></text><circle cx="62" cy="2844" r="4" fill="#2b2a26"/><text x="76" y="2851" font-size="21" fill="#2b2a26">roztok kuchyňské soli</text><circle cx="62" cy="2874" r="4" fill="#2b2a26"/><text x="76" y="2881" font-size="21" fill="#2b2a26">roztok kyseliny sírové</text><circle cx="62" cy="2904" r="4" fill="#2b2a26"/><text x="76" y="2911" font-size="21" fill="#2b2a26">roztok skalice modré</text><circle cx="62" cy="2934" r="4" fill="#2b2a26"/><text x="76" y="2941" font-size="21" fill="#2b2a26">mořská voda</text><circle cx="62" cy="3024" r="4" fill="#2b2a26"/><text x="76" y="3031" font-size="21" fill="#2b2a26">destilovaná voda</text><circle cx="62" cy="3054" r="4" fill="#2b2a26"/><text x="76" y="3061" font-size="21" fill="#2b2a26">roztok cukru</text><circle cx="62" cy="3084" r="4" fill="#2b2a26"/><text x="76" y="3091" font-size="21" fill="#2b2a26">pevná sůl</text><line x1="44" y1="2958" x2="416" y2="2958" stroke="#ced4da" stroke-width="2"/><text x="34" y="3146" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Pozor:</tspan> i pitná voda vede proud,</text><text x="34" y="3174" font-size="21" fill="#2b2a26">má v sobě ionty minerálních látek.</text><text x="34" y="3202" font-size="21" fill="#2b2a26">Na spotřebiče nesahej mokrou rukou.</text><text x="34" y="3238" font-size="21" fill="#2b2a26">Cukr se rozpustí, ale na ionty se</text><text x="34" y="3266" font-size="21" fill="#2b2a26">nerozpadá, proto roztok nevede.</text></g>
</svg>
