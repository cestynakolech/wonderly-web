<path d="M200 198v-24M209 198v-10M218 198v-10M227 198v-10M236 198v-10M245 198v-16M254 198v-10M263 198v-10M272 198v-10M281 198v-10M290 198v-24M299 198v-10M308 198v-10M317 198v-10M326 198v-10M335 198v-16M344 198v-10M353 198v-10M362 198v-10M371 198v-10M380 198v-24M389 198v-10M398 198v-10M407 198v-10M416 198v-10M425 198v-16M434 198v-10M443 198v-10M452 198v-10M461 198v-10M470 198v-24M479 198v-10M488 198v-10M497 198v-10M506 198v-10M515 198v-16M524 198v-10M533 198v-10M542 198v-10M551 198v-10M560 198v-24M569 198v-10M578 198v-10M587 198v-10M596 198v-10M605 198v-16M614 198v-10M623 198v-10M632 198v-10M641 198v-10M650 198v-24M659 198v-10M668 198v-10M677 198v-10M686 198v-10M695 198v-16M704 198v-10M713 198v-10M722 198v-10M731 198v-10M740 198v-24M749 198v-10M758 198v-10M767 198v-10M776 198v-10M785 198v-16M794 198v-10M803 198v-10M812 198v-10M821 198v-10M830 198v-24" stroke="#212529" stroke-width="1.6"/>
<text x="200" y="238" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">35</text>
<text x="290" y="238" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">36</text>
<text x="380" y="238" font-size="26" font-weight="bold" fill="#c92a2a" text-anchor="middle">37</text>
<text x="470" y="238" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">38</text>
<text x="560" y="238" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">39</text>
<text x="650" y="238" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">40</text>
<text x="740" y="238" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">41</text>
<text x="830" y="238" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">42</text>
<text x="864" y="238" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">°C</text>
<g clip-path="url(#kapl)"><rect class="rt" x="40" y="198" width="340" height="16" fill="url(#rtut)"/></g>
</g>
<rect x="40" y="296" width="540" height="168" rx="12" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
<text x="92" y="338" font-size="24" fill="#212529" text-anchor="start">1  teploměr měří — rtuť stoupá</text>
<text x="92" y="386" font-size="24" fill="#212529" text-anchor="start">2  po sundání ukazuje teplotu dál</text>
<text x="92" y="434" font-size="24" fill="#212529" text-anchor="start">3  pro nové měření rtuť střepeme</text>
<path class="krok" d="M80 378l-24 -12v24Z" fill="#c92a2a"/>
<rect x="610" y="296" width="310" height="80" rx="12" fill="#fff" stroke="#1864ab" stroke-width="2.5"/>
<text x="765" y="330" font-size="24" font-weight="bold" fill="#1864ab" text-anchor="middle">měří od 35 °C</text>
<text x="765" y="362" font-size="24" font-weight="bold" fill="#1864ab" text-anchor="middle">do 42 °C</text>
<rect x="610" y="390" width="310" height="74" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="2.5"/>
<text x="765" y="422" font-size="22" font-weight="bold" fill="#a33c06" text-anchor="middle">rtuť je jedovatá —</text>
<text x="765" y="450" font-size="20" fill="#a33c06" text-anchor="middle">rozbitý teploměr je nebezpečný</text>
<text x="480" y="520" font-size="22" fill="#212529" text-anchor="middle">Dnes se rtuťový teploměr kvůli riziku otravy moc nepoužívá.</text>
</svg>
