<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: modrá pastelka dojede nad pravítko tak, že její začátek je přesně na nule. Nad koncem pastelky je oko, které se dívá kolmo na stupnici. Konec pastelky je u dílku 7 centimetrů a 2 milimetry. Zápis: l = 72 mm.">
<style>
/* Podle textu PDF Délka — pravidla měření (nula na začátku tělesa, kolmý pohled, nejbližší dílek, zápis s jednotkou, příklad l = 72 mm).
   Na straně PDF k tomu obrázek není — obrázek navíc. Pastelka je dlouhá 72 mm (1 mm = 6 jednotek).
   Cyklus 10 s: 0–25 % pastelka dojede začátkem na nulu, 25–90 %: nula → kolmý pohled → l = 72 mm.
   Bez animace = koncový stav. */
@keyframes tuz { 0%, 8% { transform: translate(90px, -70px); } 25%, 100% { transform: translate(0, 0); } }
@keyframes k1 { 0%, 28% { opacity: 0; } 34%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes k2 { 0%, 44% { opacity: 0; } 50%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes k3 { 0%, 62% { opacity: 0; } 68%, 94% { opacity: 1; } 100% { opacity: 0; } }
.tuz { animation: tuz 10s ease-in-out infinite; }
.k1 { animation: k1 10s linear infinite; }
.k2 { animation: k2 10s linear infinite; }
.k3 { animation: k3 10s linear infinite; }
@media (prefers-reduced-motion: reduce) { .tuz, .k1, .k2, .k3 { animation: none; } }
</style>
<defs>
<linearGradient id="prav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7f5ff"/><stop offset="1" stop-color="#a5d8ff"/></linearGradient>
<linearGradient id="tuzka" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4dabf7"/><stop offset="0.45" stop-color="#1971c2"/><stop offset="1" stop-color="#0b3d6e"/></linearGradient>
<linearGradient id="drevoT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4d7a8"/><stop offset="1" stop-color="#c99a5b"/></linearGradient>
</defs>
