<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 692" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Řízená řetězová reakce. Neutron rozštěpí jádro uranu 235. Ze tří uvolněných neutronů letí jeden k dalšímu jádru a rozštěpí ho, zbylé dva se pohltí v šedých tyčích nahoře a dole. Tak to pokračuje stále stejně: výkon zůstává stálý, tak funguje jaderný reaktor. Žluté hvězdy jsou uvolněná energie.">
<style>
/* Předloha: PDF 19 Jaderná energie, s. 8 (řízená reakce: jen určitý počet neutronů štěpí, zbytek je pohlcen) a s. 9 (využití v reaktorech).
   Výklad: § Řetězová reakce (řízená → jaderný reaktor, část neutronů se pohltí). Šedé tyče = místo pohlcení (bez názvu; regulační tyče má až podtéma o reaktoru).
   Smyčka 9 s: každé štěpení pošle 1 neutron dál, 2 se pohltí. Bez animace = schéma se šipkami. */
.u40 { animation: u40 9s linear infinite; } .f40 { animation: f40 9s linear infinite; } .z40 { animation: z40 9s linear infinite; }
@keyframes u40 { 0%, 10% { opacity: 1; } 11%, 97% { opacity: 0; } 100% { opacity: 1; } }
