		<line x1="90" y1="1960" x2="90" y2="1952" /><line x1="105.6" y1="1966.4" x2="111.2" y2="1960.8" />
	</g>
	<circle cx="90" cy="1982" r="18" fill="#ffd43b" stroke="#e67700" stroke-width="2" />
	<circle cx="90" cy="1982" r="7" fill="#e8590c" />
	<text x="152" y="1977" font-size="22" font-weight="bold" fill="#2b2a26">jaderná energie</text>
	<text x="152" y="2005" font-size="21" fill="#495057">v jádru Slunce</text>

	<!-- 1 světelná: paprsky ze Slunce -->
	<circle cx="64" cy="2052" r="10" fill="#ffd43b" stroke="#e67700" stroke-width="2" />
	<g stroke="#fab005" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5">
