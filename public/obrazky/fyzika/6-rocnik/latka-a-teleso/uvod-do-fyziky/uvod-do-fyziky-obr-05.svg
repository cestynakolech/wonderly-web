<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dva pokusy vedle sebe. Vlevo padá kniha a vedle ní list papíru zvlášť: kniha dopadne na podlahu dřív, papír se kolébá a opírá se o vzduch, dopadne později. Vpravo leží menší list papíru navrchu na knize: kniha mu odhrne vzduch z cesty a dopadnou spolu. Animace ve smyčce.">
<style>
/* Podle výkladu (pokus „pusť list papíru a knihu, pak polož list navrch na knihu“).
   Smyčka 5 s: 0–15 % drží, kniha padá 15–40 % (y ~ t², cubic-bezier(0.33,0,0.67,0.33)),
   samotný papír se kolébá dolů 15–85 %. Vpravo kniha s listem navrchu: stejné keyframes jako kniha vlevo.
   Bez animace (reduced-motion) = koncový stav: vše leží na podlaze. */
@keyframes kniha { 0%, 15% { transform: translateY(-260px); animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0.33); } 40%, 100% { transform: translateY(0); } }
@keyframes papir { 0%, 15% { transform: translate(0, -260px) rotate(0deg); } 29% { transform: translate(-26px, -200px) rotate(-18deg); } 43% { transform: translate(24px, -140px) rotate(16deg); } 57% { transform: translate(-22px, -84px) rotate(-14deg); } 71% { transform: translate(16px, -32px) rotate(10deg); } 85%, 100% { transform: translate(0, 0) rotate(0deg); } }
.kn { animation: kniha 5s infinite; }
.pa { animation: papir 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) { .kn, .pa { animation: none; } }
</style>
<rect x="3" y="3" width="894" height="634" rx="14" fill="#f8f9fa"/>
<defs><linearGradient id="podlaha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a066"/><stop offset="1" stop-color="#a0682c"/></linearGradient>
<linearGradient id="desky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e03131"/><stop offset="1" stop-color="#a51d1d"/></linearGradient></defs>
<text x="450" y="42" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Pokus: kniha a list papíru</text>
<rect x="30" y="64" width="410" height="436" rx="12" fill="#e7f5ff" stroke="#adb5bd" stroke-width="2"/><rect x="30" y="470" width="410" height="30" fill="url(#podlaha)"/><rect x="30" y="64" width="410" height="436" rx="12" fill="none" stroke="#868e96" stroke-width="2"/><rect x="460" y="64" width="410" height="436" rx="12" fill="#e7f5ff" stroke="#adb5bd" stroke-width="2"/><rect x="460" y="470" width="410" height="30" fill="url(#podlaha)"/><rect x="460" y="64" width="410" height="436" rx="12" fill="none" stroke="#868e96" stroke-width="2"/>
<path d="M44 210H426M474 210H856" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6"/>
<text x="235" y="96" font-size="22" fill="#212529" text-anchor="middle" font-weight="bold">Zvlášť</text><text x="665" y="96" font-size="22" fill="#212529" text-anchor="middle" font-weight="bold">List navrchu na knize</text>
<g class="kn"><path d="M70 424L90 408H220L200 424Z" fill="url(#desky)" stroke="#7a1414" stroke-width="2"/><path d="M70 424H200V464H70Z" fill="#fff9db" stroke="#7a1414" stroke-width="2"/><path d="M200 424L220 408V448L200 464Z" fill="#a51d1d" stroke="#7a1414" stroke-width="2"/><path d="M70 464H200V470H70Z" fill="#a51d1d"/><path d="M74 438H196" stroke="#e9d8a6" stroke-width="1.5"/><path d="M74 446H196" stroke="#e9d8a6" stroke-width="1.5"/><path d="M74 454H196" stroke="#e9d8a6" stroke-width="1.5"/><path d="M74 462H196" stroke="#e9d8a6" stroke-width="1.5"/></g>
<g class="pa"><path d="M275 469L289 457H399L385 469Z" fill="#ffffff" stroke="#495057" stroke-width="2"/></g>
<g class="kn"><path d="M580 424L600 408H730L710 424Z" fill="url(#desky)" stroke="#7a1414" stroke-width="2"/><path d="M580 424H710V464H580Z" fill="#fff9db" stroke="#7a1414" stroke-width="2"/><path d="M710 424L730 408V448L710 464Z" fill="#a51d1d" stroke="#7a1414" stroke-width="2"/><path d="M580 464H710V470H580Z" fill="#a51d1d"/><path d="M584 438H706" stroke="#e9d8a6" stroke-width="1.5"/><path d="M584 446H706" stroke="#e9d8a6" stroke-width="1.5"/><path d="M584 454H706" stroke="#e9d8a6" stroke-width="1.5"/><path d="M584 462H706" stroke="#e9d8a6" stroke-width="1.5"/><path d="M610 420L624 408H714L700 420Z" fill="#ffffff" stroke="#495057" stroke-width="2"/></g>
<g font-size="22" fill="#495057" stroke="#e7f5ff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><text x="44" y="232">start (spodní hrany)</text><text x="474" y="232">start (spodní hrany)</text></g>
<rect x="30" y="514" width="410" height="94" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><rect x="460" y="514" width="410" height="94" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><text x="235" y="552" font-size="20" fill="#212529" text-anchor="middle">Kniha dopadne dřív.</text><text x="235" y="584" font-size="20" fill="#212529" text-anchor="middle">Papír se opírá o vzduch.</text><text x="665" y="552" font-size="20" fill="#212529" text-anchor="middle">Kniha odhrne vzduch z cesty.</text><text x="665" y="584" font-size="20" fill="#212529" text-anchor="middle"><tspan font-weight="bold">Dopadnou spolu.</tspan></text>
</svg>
