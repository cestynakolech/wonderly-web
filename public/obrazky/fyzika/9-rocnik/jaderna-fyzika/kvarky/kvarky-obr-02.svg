<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Proton a neutron. Proton i neutron se skládají ze tří kvarků. Kvarky drží pohromadě velmi silná jaderná síla. Kvark je zatím nejmenší známá částice, ze které se skládá proton a neutron, a zatím se ho nikomu nepodařilo rozdělit na nic menšího.">
<style>
/* Předloha: PDF není (rozhodnutí učitele 5. 10. 2026) – kresleno PODLE VÝKLADU temata.ts, slug 'kvarky':
   proton i neutron = 3 kvarky; drží je velmi silná jaderná síla; kvark = zatím nejmenší známá částice,
   zatím se nepodařilo rozdělit. Typy kvarků (u, d) ani náboje výklad neuvádí → všechny kvarky stejné (žluté).
   Barvy: proton červený #c92a2a s bílým +, neutron šedý #adb5bd (jadro-atomu-obr-01), zelená vazba = jaderná síla (jadro-atomu-obr-07),
   kvark žlutý #ffd43b (KvarkySimulace). Statický obrázek – děj (zvětšování) je v kvarky-obr-01. */
</style>
<rect x="3" y="3" width="594" height="594" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="42" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Z čeho je proton a neutron</text>

<rect x="80" y="64" width="160" height="42" rx="8" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
<g><circle cx="104" cy="85" r="13" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M96.9 85H111.2M104 77.8V92.2" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
<text x="174" y="93" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">proton</text>
<rect x="360" y="64" width="160" height="42" rx="8" fill="#fff" stroke="#495057" stroke-width="2"/>
<circle cx="384" cy="85" r="13" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/>
<text x="456" y="93" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">neutron</text>

<circle cx="160" cy="245" r="110" fill="#ffe3e3" stroke="#c92a2a" stroke-width="4"/>
<circle cx="440" cy="245" r="110" fill="#e9ecef" stroke="#495057" stroke-width="4"/>
<g fill="none" stroke="#2b8a3e" stroke-width="8" stroke-linejoin="round">
<path d="M160 190L112 278L208 278Z"/><path d="M440 190L392 278L488 278Z"/>
</g>
<g fill="#ffd43b" stroke="#212529" stroke-width="2">
<circle cx="160" cy="190" r="30"/><circle cx="112" cy="278" r="30"/><circle cx="208" cy="278" r="30"/>
<circle cx="440" cy="190" r="30"/><circle cx="392" cy="278" r="30"/><circle cx="488" cy="278" r="30"/>
</g>

<path d="M252 158L192 180M348 158L408 180" stroke="#212529" stroke-width="2"/>
<circle cx="192" cy="180" r="4" fill="#212529"/><circle cx="408" cy="180" r="4" fill="#212529"/>
<rect x="252" y="134" width="96" height="40" rx="8" fill="#fff9db" stroke="#212529" stroke-width="2"/>
<text x="300" y="161" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">kvark</text>

<text x="160" y="390" font-size="22" fill="#212529" text-anchor="middle"><tspan font-weight="bold">3 kvarky</tspan></text>
<text x="440" y="390" font-size="22" fill="#212529" text-anchor="middle"><tspan font-weight="bold">3 kvarky</tspan></text>

<circle cx="60" cy="428" r="14" fill="#ffd43b" stroke="#212529" stroke-width="2"/>
<text x="88" y="435" font-size="20" fill="#212529">kvark – zatím nejmenší známá částice</text>
<path d="M44 466H76" stroke="#2b8a3e" stroke-width="8" stroke-linecap="round"/>
<text x="88" y="473" font-size="20" fill="#212529">velmi silná jaderná síla drží kvarky pohromadě</text>

<rect x="22" y="496" width="556" height="84" rx="12" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/>
<text x="300" y="530" font-size="20" fill="#212529" text-anchor="middle">Proton i neutron se skládají ze <tspan font-weight="bold">tří kvarků</tspan>.</text>
<text x="300" y="561" font-size="20" fill="#212529" text-anchor="middle">Kvark se zatím nikomu nepodařilo rozdělit.</text>
</svg>
