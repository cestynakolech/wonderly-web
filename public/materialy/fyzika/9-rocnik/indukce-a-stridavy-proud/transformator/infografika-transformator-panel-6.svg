<svg viewBox="0 3016 460 580" width="460" height="580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Velký proud hřeje: výkon P = U · I zůstává stejný, 200 V · 2 A = 400 W a 40 V · 10 A = 400 W; napětí 5× menší znamená proud 5× větší; ruka kleštěmi zasune kovovou tyč do cívky s velkým proudem a konec tyče v cívce se rozžhaví, ruka tyč zase vytáhne a ta vychladne; indukční pec taví a kalí kovy, svařování 10–50 V a oblouk až 6 000 °C, páječka má sekundární cívku jen s 1 závitem" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
