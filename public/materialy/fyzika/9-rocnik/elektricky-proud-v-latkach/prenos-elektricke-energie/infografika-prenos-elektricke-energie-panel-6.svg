<svg viewBox="0 3514 460 930" width="460" height="930" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spotřebitel: domácnosti, firmy a továrny; zásuvka má fázový vodič, který přivádí proud, nulovací vodič, který je uzemněný a vrací proud k transformátoru místní sítě, a ochranný kolík, který uzemňuje konstrukci spotřebiče pro případ poškození; doma je jedna fáze, v zásuvce 230 V; mezi dvěma fázovými vodiči je 400 V; velké stroje jako míchačka nebo cirkulárka mají tři fáze, 3 × 230 V nebo 3 × 400 V; cesta v domě: rozvodná skříň s jističi a chrániči, elektroměr, bytová rozvodná skříň, zásuvky a osvětlení" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Přenos elektrické energie 6/7: Spotřebitel</title>
	<defs></defs>
	<rect x="0" y="3514" width="460" height="930" fill="#f8f9fa"/>
