					<polygon points="196,301 216,301 212,292 199,292" fill="#fab005" stroke="#7a5c12" stroke-width="1" />
					<polygon points="196,303 216,303 212,312 199,312" fill="#fab005" stroke="#7a5c12" stroke-width="1" />
				</g>
			</g>
