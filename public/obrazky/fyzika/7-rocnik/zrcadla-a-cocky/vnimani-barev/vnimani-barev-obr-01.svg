<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Skládání barevných světel RGB. Na černou stěnu ve tmě svítí červené, zelené a modré světlo. Kde se překrývá červené a zelené, je žlutá; zelené a modré azurová; červené a modré purpurová; uprostřed, kde svítí všechna tři stejně silně, je bílá. Animace: světla se rozsvěcují postupně.">
<style>
/* Animace 10 s, smyčka. Předloha: PDF lekce 29, str. 4 (tři barevná světla na černém pozadí), text str. 2–4, infografika barvy-rgb-cmyk (karta 2). červené 3–10 %, zelené + žlutá 18–25 %, modré + azurová/purpurová/bílá 35–42 %, popisky řádků po nich, zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy ukazují vše. */
.sR { animation: sR 10s linear infinite; }
@keyframes sR { 0%, 3% { opacity: 0; } 10%, 100% { opacity: 1; } }
.sG { animation: sG 10s linear infinite; }
@keyframes sG { 0%, 18% { opacity: 0; } 25%, 100% { opacity: 1; } }
.sB { animation: sB 10s linear infinite; }
@keyframes sB { 0%, 35% { opacity: 0; } 42%, 100% { opacity: 1; } }
.l1 { animation: l1 10s linear infinite; }
@keyframes l1 { 0%, 25% { opacity: 0; } 30%, 100% { opacity: 1; } }
.l2 { animation: l2 10s linear infinite; }
@keyframes l2 { 0%, 42% { opacity: 0; } 47%, 100% { opacity: 1; } }
.l3 { animation: l3 10s linear infinite; }
@keyframes l3 { 0%, 47% { opacity: 0; } 52%, 100% { opacity: 1; } }
.l4 { animation: l4 10s linear infinite; }
@keyframes l4 { 0%, 52% { opacity: 0; } 57%, 100% { opacity: 1; } }
.celek { animation: celek 10s linear infinite; }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sR, .sG, .sB, .l1, .l2, .l3, .l4, .celek { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="714" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="38" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Skládání barevných světel — RGB</text><text x="300" y="66" font-size="22" font-weight="normal" fill="#212529" text-anchor="middle">tři reflektory svítí na stěnu ve tmě</text>
<defs><clipPath id="vbR"><circle cx="300" cy="330" r="100"/></clipPath><clipPath id="vbG"><circle cx="353.7" cy="237" r="100"/></clipPath></defs>
<rect x="30" y="88" width="540" height="368" rx="10" fill="#000000"/>
<text x="48" y="440" font-size="22" font-weight="normal" fill="#ffffff" text-anchor="start">tma = žádné světlo</text>
<g class="celek">
<g class="sR"><circle cx="300" cy="330" r="100" fill="#ff0000"/><text x="300" y="402" font-size="22" font-weight="bold" fill="#000000" text-anchor="middle">červená</text></g>
<g class="sG"><circle cx="353.7" cy="237" r="100" fill="#00ff00"/><circle cx="353.7" cy="237" r="100" fill="#ffff00" clip-path="url(#vbR)"/><text x="398.7" y="197" font-size="22" font-weight="bold" fill="#000000" text-anchor="middle">zelená</text></g>
<g class="sB"><circle cx="246.3" cy="237" r="100" fill="#0000ff"/><circle cx="246.3" cy="237" r="100" fill="#00ffff" clip-path="url(#vbG)"/><circle cx="246.3" cy="237" r="100" fill="#ff00ff" clip-path="url(#vbR)"/><g clip-path="url(#vbG)"><circle cx="246.3" cy="237" r="100" fill="#ffffff" clip-path="url(#vbR)"/></g><text x="201.3" y="197" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">modrá</text><text x="300" y="276" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">bílá</text></g>
<g class="l1"><circle cx="62" cy="492" r="15" fill="#ffff00" stroke="#495057" stroke-width="2"/><text x="90" y="500" font-size="22" font-weight="normal" fill="#212529" text-anchor="start">červená + zelená = <tspan font-weight="bold">žlutá</tspan></text></g>
<g class="l2"><circle cx="62" cy="542" r="15" fill="#00ffff" stroke="#495057" stroke-width="2"/><text x="90" y="550" font-size="22" font-weight="normal" fill="#212529" text-anchor="start">zelená + modrá = <tspan font-weight="bold">azurová</tspan></text></g>
<g class="l3"><circle cx="62" cy="592" r="15" fill="#ff00ff" stroke="#495057" stroke-width="2"/><text x="90" y="600" font-size="22" font-weight="normal" fill="#212529" text-anchor="start">červená + modrá = <tspan font-weight="bold">purpurová</tspan></text></g>
<g class="l4"><circle cx="62" cy="642" r="15" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="90" y="650" font-size="22" font-weight="normal" fill="#212529" text-anchor="start">všechny tři stejně silně = <tspan font-weight="bold">bílá</tspan></text></g>
</g>
<text x="300" y="700" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle">světla se skládají → výsledek je světlejší</text>
</svg>
