<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tlaková síla F působí kolmo na plochu a může těleso zdeformovat. Stejný kvádr leží na měkké podložce naplocho a na užší hraně, v obou případech působí stejnou silou F. Naplocho udělá malý důlek, na hraně hluboký. Stejná síla, menší plocha = větší tlak. Tlak p = F : S, p tlak v pascalech, F síla v newtonech, S plocha v m².">
	<title>Tlak 1/6: Tlaková síla a tlak</title>
	<!-- Panel 1/6 infografiky Tlak (W50, 14. 10. 2026); bez animace = koncový stav. -->
	<style>
		.p1-k1 { animation: p1-k1 8s ease-in-out infinite; }
		@keyframes p1-k1 { 0% { transform: translateY(0px) } 20% { transform: translateY(0px) } 50% { transform: translateY(8px) } 88% { transform: translateY(8px) } 100% { transform: translateY(0px) } }
		.p1-s1 { animation: p1-k1 8s ease-in-out infinite; }
		.p1-d1 { transform-box: view-box; transform-origin: 130.0px 320px; animation: p1-d 8s ease-in-out infinite; }
		.p1-k2 { animation: p1-k2 8s ease-in-out infinite; }
		@keyframes p1-k2 { 0% { transform: translateY(0px) } 20% { transform: translateY(0px) } 50% { transform: translateY(30px) } 88% { transform: translateY(30px) } 100% { transform: translateY(0px) } }
		.p1-s2 { animation: p1-k2 8s ease-in-out infinite; }
		.p1-d2 { transform-box: view-box; transform-origin: 330.0px 320px; animation: p1-d 8s ease-in-out infinite; }
		@keyframes p1-d { 0% { transform: scaleY(0) } 20% { transform: scaleY(0) } 50% { transform: scaleY(1) } 88% { transform: scaleY(1) } 100% { transform: scaleY(0) } }
		.p1-dul { animation: p1-dul 8s linear infinite; }
		@keyframes p1-dul { 0% { opacity: 0 } 50% { opacity: 0 } 56% { opacity: 1 } 86% { opacity: 1 } 92% { opacity: 0 } 100% { opacity: 0 } }
		@media (prefers-reduced-motion: reduce) {
			.p1-k1, .p1-s1, .p1-d1, .p1-k2, .p1-s2, .p1-d2, .p1-dul { animation: none; }
		}
	</style>
