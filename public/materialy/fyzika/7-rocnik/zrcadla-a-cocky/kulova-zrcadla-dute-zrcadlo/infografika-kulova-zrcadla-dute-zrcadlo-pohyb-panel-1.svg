<svg viewBox="0 0 460 670" width="460" height="670" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kulová zrcadla v pohybu 1/3, Strom jede k dutému zrcadlu: strom se po optické ose blíží k dutému zrcadlu a obraz se mění. Ve třech zastávkách vedou z vrcholu stromu význačné paprsky a kde se po odrazu protnou, je obraz. Dál než střed křivosti S, tedy dál než r, je obraz skutečný, převrácený a zmenšený. Mezi S a ohniskem F, tedy mezi r a f, je obraz skutečný, převrácený a zvětšený. Blíž než ohnisko F, tedy blíž než f, se paprsky po odrazu rozbíhají, obraz je zdánlivý, vzpřímený a zvětšený a leží za zrcadlem." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Kulová zrcadla v pohybu 1/3: Strom jede k dutému zrcadlu</title>
	<!-- W89 (14. 10. 2026, OPRAVA 1). Předloha: PDF 23 Kulová zrcadla, s. 7 (význačné paprsky: ohniskový, rovnoběžný, středový;
	     kde se odražené protnou, je obraz; neprotnou-li se, oko vidí zdánlivý obraz), s. 8–10 (strom před dutým zrcadlem,
	     tři druhy obrazu, světle zelený obraz). Odlišení od obr-03 (3 oddělené případy): tady JEDEN strom jede a obraz jede s ním.
	     Geometrie: V = 330, F = 270, S = 210, f = 60 px, r = 120 px, osa y = 310, strom 50 px.
	     Obraz: 1/a + 1/a' = 1/f, a' = a·f/(a − f), zvětšení m = −a'/a (paraxiálně, rovina vrcholu).
	     a(t): 270→180 (0–1,5 s), stojí 180 (do 4 s), 180→100 (4–5 s, projde S v 4,75 s), stojí 100 (do 7,5 s),
	     100→74 (7,5–7,9 s), rychle 74→42 (7,9–8,05 s, projde F v 7,966 s),
	     42→30 (8,05–8,4 s), stojí 30 (do 12 s). Vzorky po 0,05 s. Obraz je vidět vždy, když leží
	     v obrázku; mimo obrázek je jen při a ≈ 72…44 (7,91–8,04 s, obraz daleko vlevo / vpravo), v ohnisku žádný není.
	     Paprsky jen v zastávkách: a = 180 a 100 rovnoběžný (→ přes F) + ohniskový (→ rovnoběžně), a = 30 rovnoběžný
	     + středový (zpět po téže přímce), čárkovaně prodloužení za zrcadlo k zdánlivému obrazu.
	     Zrcadlo kresleno plošším obloukem (poloměr 600) jako obr-03 (poloměr 800) – paprsky končí na nakresleném oblouku
	     a míří do spočítaného vrcholu obrazu; od F se odchylují nejvýš o 4 px. Bez pohybu: a = 180 s paprsky. -->
