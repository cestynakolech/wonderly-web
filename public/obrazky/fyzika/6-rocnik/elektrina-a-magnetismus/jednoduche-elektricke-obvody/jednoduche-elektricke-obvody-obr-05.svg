<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Klasická žárovka s popisky: uvnitř skleněné baňky je tenké stočené wolframové vlákno. Jeden konec vlákna je spojen se závitovou paticí žárovky, druhý konec vlákna je spojen s kovovým výčnělkem dole na žárovce.">
<!-- Předloha: PDF Jednoduché elektrické obvody, fotografie čiré žárovky se třemi popisky (wolframové vlákno; jeden konec vlákna spojen s paticí; druhý konec spojen s výčnělkem na dolním konci). Fotografie → vlastní kresba. -->
<defs>
<radialGradient id="sklo" cx="45%" cy="38%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#e7f1fa"/><stop offset="1" stop-color="#c5dced"/></radialGradient>
<linearGradient id="kov" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#6c757d"/><stop offset="0.3" stop-color="#e9ecef"/><stop offset="0.55" stop-color="#ced4da"/><stop offset="1" stop-color="#495057"/></linearGradient>
<marker id="sip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e67700"/></marker>
</defs>
<rect x="3" y="3" width="634" height="554" rx="14" fill="#f8f9fa"/>
<text x="24" y="44" font-size="26" font-weight="bold" fill="#212529">Klasická žárovka</text>
<!-- stín -->
<ellipse cx="300" cy="490" rx="70" ry="9" fill="#000" opacity="0.1"/>
<!-- skleněná baňka -->
<path d="M245 362C245 318 180 290 180 200A120 120 0 1 1 420 200C420 290 355 318 355 362Z" fill="url(#sklo)" stroke="#868e96" stroke-width="2.5"/>
<path d="M212 176A92 92 0 0 1 262 108" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
<!-- skleněná nožka a podpěra -->
<path d="M282 364L289 252H311L318 364Z" fill="#dbe9f5" stroke="#adb5bd" stroke-width="2"/>
<circle cx="300" cy="248" r="7" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
<path d="M300 241V184" stroke="#868e96" stroke-width="2"/>
<!-- přívodní drátky -->
<path d="M287 364V300L255 172M313 364V300L345 172" fill="none" stroke="#495057" stroke-width="2.5"/>
<!-- wolframové vlákno (stočený drátek) -->
<path d="M255 172c3-9 7-9 10 0c3-9 7-9 10 0c3-9 7-9 10 0c3-9 7-9 10 0c3-9 7-9 10 0c3-9 7-9 10 0c3-9 7-9 10 0c3-9 7-9 10 0c3-9 7-9 10 0" fill="none" stroke="#343a40" stroke-width="3" stroke-linejoin="round"/>
<!-- patice se závitem -->
<rect x="248" y="358" width="104" height="84" fill="url(#kov)"/>
<rect x="242" y="364" width="116" height="14" rx="7" fill="url(#kov)" stroke="#495057" stroke-width="1.5"/>
<rect x="242" y="382" width="116" height="14" rx="7" fill="url(#kov)" stroke="#495057" stroke-width="1.5"/>
<rect x="242" y="400" width="116" height="14" rx="7" fill="url(#kov)" stroke="#495057" stroke-width="1.5"/>
<rect x="242" y="418" width="116" height="14" rx="7" fill="url(#kov)" stroke="#495057" stroke-width="1.5"/>
<!-- izolace a výčnělek -->
<path d="M258 442H342L328 460H272Z" fill="#212529"/>
<path d="M288 460H312L308 472Q300 477 292 472Z" fill="url(#kov)" stroke="#495057" stroke-width="1.5"/>
<!-- popisky -->
<g fill="none" stroke="#e67700" stroke-width="3">
<rect x="440" y="62" width="186" height="76" rx="8" fill="#fff"/>
<path d="M440 104L330 164" marker-end="url(#sip)"/>
<rect x="14" y="326" width="204" height="110" rx="8" fill="#fff"/>
<path d="M218 384L240 391" marker-end="url(#sip)"/>
<rect x="396" y="418" width="234" height="118" rx="8" fill="#fff"/>
<path d="M396 470L318 468" marker-end="url(#sip)"/>
</g>
<g font-size="21" fill="#212529" text-anchor="middle">
<text x="533" y="93" font-weight="bold">wolframové</text>
<text x="533" y="122" font-weight="bold">vlákno</text>
<text x="116" y="357">jeden konec</text>
<text x="116" y="387">vlákna je spojen</text>
<text x="116" y="417">s <tspan font-weight="bold">paticí</tspan></text>
<text x="513" y="451">druhý konec vlákna</text>
<text x="513" y="481">je spojen</text>
<text x="513" y="511">s <tspan font-weight="bold">výčnělkem</tspan> dole</text>
</g>
</svg>
