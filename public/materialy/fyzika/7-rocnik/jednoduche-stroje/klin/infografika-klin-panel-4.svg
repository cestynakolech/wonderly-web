<svg viewBox="0 0 460 650" width="460" height="650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Menší síla, delší dráha: dva klíny seker dlouhé 12 cm, sekera A tlustá 4 cm, sekera B tlustá 2 cm. Na sekeru A tlačí červená šipka větší síly, na sekeru B šipka poloviční délky. Oba klíny zajíždějí do dřeva, až ho rozevřou stejně široko; sekera B přitom zajede dvakrát hlouběji, zelená šipka její dráhy je dvakrát delší. Nákres rozměrů, zmenšený 1 : 2, ukazuje, že oba klíny jsou dlouhé 12 cm. Poměry 12 : 4 = 3 a 12 : 2 = 6" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Klín 4/4: Menší síla, delší dráha</title>
	<style>
		.p4-ka, .p4-kb, .p4-al, .p4-ar, .p4-bl, .p4-br, .p4-ga, .p4-gb, .p4-ha, .p4-hb { transform-box: view-box; }
		.p4-ka { transform-origin: 0 0; transform: translate(130px, 420px); animation: p4ka 10s ease-in-out infinite; }
		@keyframes p4ka { 0%, 20% { transform: translate(130px, 360px); } 60%, 90% { transform: translate(130px, 420px); } 100% { transform: translate(130px, 360px); } }
		.p4-kb { transform-origin: 0 0; transform: translate(330px, 480px); animation: p4kb 10s ease-in-out infinite; }
		@keyframes p4kb { 0%, 20% { transform: translate(330px, 360px); } 60%, 90% { transform: translate(330px, 480px); } 100% { transform: translate(330px, 360px); } }
		.p4-al, .p4-ar { transform-origin: 130px 520px; }
		.p4-bl, .p4-br { transform-origin: 330px 520px; }
		.p4-al, .p4-bl { transform: rotate(-3.58deg); animation: p4l 10s ease-in-out infinite; }
		.p4-ar, .p4-br { transform: rotate(3.58deg); animation: p4r 10s ease-in-out infinite; }
		@keyframes p4l { 0%, 20% { transform: rotate(0deg); } 60%, 90% { transform: rotate(-3.58deg); } 100% { transform: rotate(0deg); } }
		@keyframes p4r { 0%, 20% { transform: rotate(0deg); } 60%, 90% { transform: rotate(3.58deg); } 100% { transform: rotate(0deg); } }
		.p4-ga { transform-origin: 230px 360px; transform: scaleY(1); animation: p4g 10s ease-in-out infinite; }
		.p4-gb { transform-origin: 416px 360px; transform: scaleY(1); animation: p4g 10s ease-in-out infinite; }
		@keyframes p4g { 0%, 20% { transform: scaleY(0); } 60%, 90% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
		.p4-ha { transform: translateY(60px); animation: p4ha 10s ease-in-out infinite; }
		@keyframes p4ha { 0%, 20% { transform: translateY(0px); } 60%, 90% { transform: translateY(60px); } 100% { transform: translateY(0px); } }
		.p4-hb { transform: translateY(120px); animation: p4hb 10s ease-in-out infinite; }
		@keyframes p4hb { 0%, 20% { transform: translateY(0px); } 60%, 90% { transform: translateY(120px); } 100% { transform: translateY(0px); } }
		.p4-dr { opacity: 1; animation: p4dr 10s linear infinite; }
		@keyframes p4dr { 0%, 16% { opacity: 0; } 20%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
		.p4-o { opacity: 1; animation: p4o 10s linear infinite; }
		@keyframes p4o { 0%, 58% { opacity: 0; } 63%, 88% { opacity: 1; } 92%, 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .p4-ka, .p4-kb, .p4-al, .p4-ar, .p4-bl, .p4-br, .p4-ga, .p4-gb, .p4-ha, .p4-hb, .p4-dr, .p4-o { animation: none; } }
	</style>
	<rect x="0" y="0" width="460" height="650" fill="#f8f9fa"/>
	<g id="panel-4">
		<rect x="26" y="16" width="420" height="626" rx="12" fill="#dee2e6"/>
		<rect x="20" y="10" width="420" height="626" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/>
		<circle cx="52" cy="44" r="17" fill="#2b2a26"/>
		<text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">4</text>
		<text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Menší síla, delší dráha</text>
		<text x="34" y="92" font-size="21" fill="#2b2a26">Dvě sekery, obě dřevo rozevřou stejně.</text>
		<rect x="30" y="110" width="400" height="430" rx="8" fill="#ffffff"/>
		<text x="130" y="140" font-size="19" font-weight="bold" text-anchor="middle" fill="#2b2a26">sekera A</text>
		<text x="330" y="140" font-size="19" font-weight="bold" text-anchor="middle" fill="#2b2a26">sekera B</text>
		<rect x="30" y="520" width="400" height="20" fill="#e9ecef"/>
		<line x1="30" y1="520" x2="430" y2="520" stroke="#868e96" stroke-width="2.5"/>
		<!-- dřevo A -->
		<path d="M117,361 L143,361 L130,520 Z" fill="#3b2412"/>
		<g class="p4-al"><rect x="60" y="360" width="70" height="160" fill="#c8935a" stroke="#8a5a2b" stroke-width="2"/><path d="M82,366 Q78,440 84,514 M106,366 Q110,440 104,514" fill="none" stroke="#8a5a2b" stroke-width="1.5"/></g>
		<g class="p4-ar"><rect x="130" y="360" width="70" height="160" fill="#c8935a" stroke="#8a5a2b" stroke-width="2"/><path d="M154,366 Q150,440 156,514 M178,366 Q182,440 176,514" fill="none" stroke="#8a5a2b" stroke-width="1.5"/></g>
		<!-- dřevo B -->
		<path d="M317,361 L343,361 L330,520 Z" fill="#3b2412"/>
		<g class="p4-bl"><rect x="260" y="360" width="70" height="160" fill="#c8935a" stroke="#8a5a2b" stroke-width="2"/><path d="M282,366 Q278,440 284,514 M306,366 Q310,440 304,514" fill="none" stroke="#8a5a2b" stroke-width="1.5"/></g>
		<g class="p4-br"><rect x="330" y="360" width="70" height="160" fill="#c8935a" stroke="#8a5a2b" stroke-width="2"/><path d="M354,366 Q350,440 356,514 M378,366 Q382,440 376,514" fill="none" stroke="#8a5a2b" stroke-width="1.5"/></g>
		<!-- klín A: délka 12 cm = 120 px, tloušťka 4 cm = 40 px -->
		<g class="p4-ka">
			<path d="M-20,-120 L20,-120 L0,0 Z" fill="#ced4da" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>
			<path d="M0,-120 L20,-120 L0,0 Z" fill="#adb5bd"/>
			<rect x="-21" y="-126" width="42" height="7" rx="2" fill="#343a40"/>
			<!-- síla: celková délka šipky 64 px (od -216 po hrot -152) -->
			<line x1="0" y1="-216" x2="0" y2="-165" stroke="#c92a2a" stroke-width="6"/>
			<path d="M-10,-166 L10,-166 L0,-152 Z" fill="#c92a2a"/>
			<!-- kóta tloušťky (stále viditelná) přes celou šířku hřbetu; délka 12 cm je v pevném nákresu „rozměry klínů“ -->
			<g stroke="#e8890c" stroke-width="3">
				<line x1="-20" y1="-144" x2="20" y2="-144"/><line x1="-20" y1="-149" x2="-20" y2="-139"/><line x1="20" y1="-149" x2="20" y2="-139"/>
			</g>
			<text x="26" y="-138" font-size="18" font-weight="bold" fill="#2b2a26">4 cm</text>
		</g>
		<!-- klín B: délka 12 cm = 120 px, tloušťka 2 cm = 20 px -->
		<g class="p4-kb">
			<path d="M-10,-120 L10,-120 L0,0 Z" fill="#ced4da" stroke="#495057" stroke-width="2" stroke-linejoin="round"/>
			<path d="M0,-120 L10,-120 L0,0 Z" fill="#adb5bd"/>
			<rect x="-11" y="-126" width="22" height="7" rx="2" fill="#343a40"/>
			<!-- síla: celková délka šipky 32 px (od -184 po hrot -152) -->
			<line x1="0" y1="-184" x2="0" y2="-165" stroke="#c92a2a" stroke-width="6"/>
			<path d="M-10,-166 L10,-166 L0,-152 Z" fill="#c92a2a"/>
			<!-- kóta tloušťky (stále viditelná) přes celou šířku hřbetu; délka 12 cm je v pevném nákresu „rozměry klínů“ -->
			<g stroke="#e8890c" stroke-width="3">
				<line x1="-10" y1="-144" x2="10" y2="-144"/><line x1="-10" y1="-149" x2="-10" y2="-139"/><line x1="10" y1="-149" x2="10" y2="-139"/>
			</g>
			<text x="16" y="-138" font-size="18" font-weight="bold" fill="#2b2a26">2 cm</text>
		</g>
		<!-- dráha (zelená) -->
		<g class="p4-dr">
			<line x1="221" y1="360" x2="239" y2="360" stroke="#2f9e44" stroke-width="3"/>
			<line class="p4-ga" x1="230" y1="360" x2="230" y2="414" stroke="#2f9e44" stroke-width="5"/>
			<path class="p4-ha" d="M223,348 L237,348 L230,362 Z" fill="#2f9e44"/>
			<line x1="407" y1="360" x2="425" y2="360" stroke="#2f9e44" stroke-width="3"/>
			<line class="p4-gb" x1="416" y1="360" x2="416" y2="474" stroke="#2f9e44" stroke-width="5"/>
			<path class="p4-hb" d="M409,348 L423,348 L416,362 Z" fill="#2f9e44"/>
		</g>
		<!-- stejně široké rozevření: kóta šipkami zvenku nad hranou dřeva, hroty přesně v rozích mezery (A 120–140, B 320–340 = 20 px), čáry mimo tělo klínu -->
		<g class="p4-o">
			<g stroke="#e8890c" stroke-width="3">
				<line x1="98" y1="354" x2="113" y2="354"/><line x1="162" y1="354" x2="147" y2="354"/>
				<line x1="298" y1="354" x2="313" y2="354"/><line x1="362" y1="354" x2="347" y2="354"/>
			</g>
			<g fill="#e8890c">
				<path d="M120,354 L111,349 L111,359 Z"/><path d="M140,354 L149,349 L149,359 Z"/>
				<path d="M320,354 L311,349 L311,359 Z"/><path d="M340,354 L349,349 L349,359 Z"/>
			</g>
			<text x="112" y="342" font-size="15" font-weight="bold" text-anchor="end" fill="#e8890c">rozevření</text>
			<text x="312" y="342" font-size="15" font-weight="bold" text-anchor="end" fill="#e8890c">rozevření</text>
		</g>
		<!-- nákres rozměrů klínů (pevný, mimo dřevo, vidět vždy): zmenšeno 1 : 2, oba dlouhé 12 cm (60 px), A tlustý 20 px, B 10 px; rámeček od x212 = odstup od popisku „4 cm“, text „12 cm“ uprostřed kóty o řádek níž -->
		<g>
			<rect data-nakres="ramecek" x="212" y="148" width="96" height="166" rx="6" fill="#f1f3f5" stroke="#ced4da" stroke-width="1.5"/>
			<text x="260" y="165" font-size="16" font-weight="bold" text-anchor="middle" fill="#2b2a26">rozměry</text>
			<text x="260" y="182" font-size="16" font-weight="bold" text-anchor="middle" fill="#2b2a26">klínů</text>
			<text x="260" y="200" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">zmenšeno</text>
			<text x="260" y="217" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">1 : 2</text>
			<line x1="245" y1="228" x2="302" y2="228" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3 2"/>
			<line x1="245" y1="288" x2="302" y2="288" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3 2"/>
			<path d="M266,228 L286,228 L276,288 Z" fill="#ced4da" stroke="#495057" stroke-width="1.5" stroke-linejoin="round"/>
			<path d="M292,228 L302,228 L297,288 Z" fill="#ced4da" stroke="#495057" stroke-width="1.5" stroke-linejoin="round"/>
			<g data-k12="nakres" stroke="#e8890c" stroke-width="3"><line x1="240" y1="228" x2="240" y2="288"/><line x1="235" y1="228" x2="245" y2="228"/><line x1="235" y1="288" x2="245" y2="288"/></g>
			<rect x="217" y="249" width="46" height="19" fill="#f1f3f5"/>
			<text data-k12="nakres-text" x="240" y="264" font-size="16" font-weight="bold" text-anchor="middle" fill="#2b2a26">12 cm</text>
			<text x="276" y="306" font-size="16" font-weight="bold" text-anchor="middle" fill="#2b2a26">A</text>
			<text x="297" y="306" font-size="16" font-weight="bold" text-anchor="middle" fill="#2b2a26">B</text>
		</g>
		<text x="130" y="570" font-size="22" font-weight="bold" text-anchor="middle" fill="#2b2a26">12 : 4 = 3</text>
		<text x="330" y="570" font-size="22" font-weight="bold" text-anchor="middle" fill="#2b2a26">12 : 2 = 6</text>
		<text x="130" y="596" font-size="17" font-weight="bold" text-anchor="middle" fill="#c92a2a">větší síla</text>
		<text x="330" y="596" font-size="17" font-weight="bold" text-anchor="middle" fill="#c92a2a">zhruba poloviční síla</text>
		<text x="130" y="620" font-size="17" font-weight="bold" text-anchor="middle" fill="#2f9e44">kratší dráha</text>
		<text x="330" y="620" font-size="17" font-weight="bold" text-anchor="middle" fill="#2f9e44">dvakrát delší dráha</text>
	</g>
</svg>
