<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Plynné planety: Jupiter je největší planeta, má víc než 95 měsíců a Velkou rudou skvrnu. Saturn má prstence z ledu a prachu a hustotu menší než voda. Uran má osu otáčení naležato a je nejchladnější, až minus 220 stupňů Celsia. Neptun je ledový obr se silným prouděním atmosféry. Animace: planety se otáčejí, Velká rudá skvrna se posouvá. Velikosti nejsou v měřítku.">
<style>
.grs { animation: grs 8s linear infinite; }
@keyframes grs { 0.000% { transform:translate(-150px,0px) } 100.000% { transform:translate(110px,0px) } }
.uro { animation: uro 6s linear infinite; }
@keyframes uro { 0.000% { transform:translate(0px,0px) } 100.000% { transform:translate(0px,100px) } }
.nsk { animation: nsk 5s linear infinite; }
@keyframes nsk { 0.000% { transform:translate(-90px,0px) } 100.000% { transform:translate(90px,0px) } }
@media (prefers-reduced-motion: reduce) { .grs, .uro, .nsk { animation: none; } }
/* Předloha: fotografie Jupiteru, Saturnu, Uranu a Neptunu (nahrazeny kresbou). Animace: Velká rudá skvrna 8 s, světlé mraky Uranu obíhají kolem vodorovné osy (osa skloněná o 98°, planeta leží na boku), posouvají se svisle podél pruhů 6 s, skvrna Neptunu 5 s. Bez animace = skvrny v klidu. */
</style>
