<text x="330" y="196" font-size="22" fill="#212529" text-anchor="start">Elektron narazí</text>
<text x="330" y="226" font-size="22" fill="#212529" text-anchor="start">do méně atomů.</text>
<text x="330" y="256" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">→ menší odpor</text>
