	<text x="152" y="2065" font-size="22" font-weight="bold" fill="#2b2a26">světelná energie</text>
	<text x="152" y="2093" font-size="21" fill="#495057">světlo ze Slunce</text>

	<!-- 2 rostliny -->
	<rect x="48" y="2182" width="84" height="6" fill="#8d5a2b" />
	<rect x="86" y="2154" width="8" height="28" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1" />
	<circle cx="76" cy="2154" r="11" fill="#40c057" stroke="#2b8a3e" stroke-width="2" />
	<circle cx="104" cy="2154" r="11" fill="#40c057" stroke="#2b8a3e" stroke-width="2" />
	<circle cx="90" cy="2144" r="15" fill="#40c057" stroke="#2b8a3e" stroke-width="2" />
	<path d="M 60 2182 Q 56 2170 52 2166 M 62 2182 Q 64 2168 68 2164 M 118 2182 Q 122 2170 128 2166" fill="none" stroke="#2b8a3e" stroke-width="2.5" stroke-linecap="round" />
	<text x="152" y="2153" font-size="22" font-weight="bold" fill="#2b2a26">chemická energie</text>
	<text x="152" y="2181" font-size="21" fill="#495057">uloží ji rostliny</text>

	<!-- 3 uhlí -->
	<rect x="48" y="2272" width="84" height="3" fill="#adb5bd" />
	<path d="M 52 2272 L 62 2254 L 74 2250 L 82 2236 L 96 2230 L 108 2238 L 118 2246 L 128 2272 Z" fill="#343a40" stroke="#000000" stroke-width="1.5" />
	<path d="M 82 2236 L 88 2254 M 96 2230 L 100 2248 M 118 2246 L 110 2262 M 74 2250 L 70 2264" fill="none" stroke="#868e96" stroke-width="2" />
	<text x="152" y="2241" font-size="22" font-weight="bold" fill="#2b2a26">chemická energie</text>
	<text x="152" y="2269" font-size="21" fill="#495057">v uhlí z rostlin</text>

	<!-- 4 kotel: uhlí hoří, pára se zahřeje -->
	<rect x="48" y="2364" width="84" height="3" fill="#adb5bd" />
	<line x1="68" y1="2344" x2="68" y2="2364" stroke="#2b2a26" stroke-width="3" />
	<line x1="112" y1="2344" x2="112" y2="2364" stroke="#2b2a26" stroke-width="3" />
	<path d="M 78 2364 Q 74 2356 82 2348 Q 83 2355 88 2352 Q 87 2346 92 2346 Q 98 2352 96 2358 Q 100 2356 102 2350 Q 108 2358 102 2364 Z" fill="#fd7e14" stroke="#e8590c" stroke-width="1.5" />
	<rect x="62" y="2316" width="56" height="28" rx="6" fill="#868e96" stroke="#2b2a26" stroke-width="2" />
	<rect x="86" y="2306" width="8" height="10" fill="#868e96" stroke="#2b2a26" stroke-width="1.5" />
	<g class="para">
		<circle cx="100" cy="2307" r="5" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5" />
		<circle cx="109" cy="2304" r="4" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5" />
	</g>
	<text x="152" y="2329" font-size="22" font-weight="bold" fill="#2b2a26">tepelná energie</text>
	<text x="152" y="2357" font-size="21" fill="#495057">zahřáté páry</text>

	<!-- 5 turbína: pára se pohybuje a roztáčí kolo -->
	<rect x="48" y="2450" width="84" height="3" fill="#adb5bd" />
	<rect x="96" y="2420" width="8" height="30" fill="#868e96" stroke="#2b2a26" stroke-width="1.5" />
	<rect x="46" y="2398" width="28" height="10" fill="#868e96" stroke="#2b2a26" stroke-width="1.5" />
	<g stroke="#adb5bd" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3">
		<line x1="76" y1="2401" x2="90" y2="2405" />
		<line x1="76" y1="2406" x2="86" y2="2410" />
	</g>
	<g class="otac">
		<circle cx="100" cy="2420" r="20" fill="none" stroke="#495057" stroke-width="2" />
		<g stroke="#495057" stroke-width="5">
			<line x1="105" y1="2420" x2="119" y2="2420" /><line x1="103.5" y1="2423.5" x2="113.4" y2="2433.4" />
			<line x1="100" y1="2425" x2="100" y2="2439" /><line x1="96.5" y1="2423.5" x2="86.6" y2="2433.4" />
			<line x1="95" y1="2420" x2="81" y2="2420" /><line x1="96.5" y1="2416.5" x2="86.6" y2="2406.6" />
			<line x1="100" y1="2415" x2="100" y2="2401" /><line x1="103.5" y1="2416.5" x2="113.4" y2="2406.6" />
		</g>
		<circle cx="100" cy="2420" r="5" fill="#2b2a26" />
	</g>
	<text x="152" y="2417" font-size="22" font-weight="bold" fill="#2b2a26">pohybová energie</text>
	<text x="152" y="2445" font-size="21" fill="#495057">pára se pohybuje</text>

	<!-- 6 stožáry a dráty -->
	<rect x="46" y="2536" width="88" height="3" fill="#adb5bd" />
	<g fill="none" stroke="#495057" stroke-width="2.5">
		<polyline points="52,2536 60,2490 68,2536" /><line x1="50" y1="2498" x2="70" y2="2498" /><line x1="55" y1="2520" x2="65" y2="2520" />
		<polyline points="112,2536 120,2490 128,2536" /><line x1="110" y1="2498" x2="130" y2="2498" /><line x1="115" y1="2520" x2="125" y2="2520" />
	</g>
	<path d="M 70 2498 Q 90 2508 110 2498 M 46 2500 Q 48 2499 50 2498 M 130 2498 Q 132 2499 134 2500" fill="none" stroke="#2b2a26" stroke-width="1.5" />
	<text x="152" y="2505" font-size="22" font-weight="bold" fill="#2b2a26">elektrická energie</text>
	<text x="152" y="2533" font-size="21" fill="#495057">vedou ji dráty</text>

	<!-- 7 žárovka: světlo a teplo -->
	<circle class="zare" opacity="0.6" cx="90" cy="2584" r="21" fill="#ffd43b" />
	<rect x="52" y="2628" width="76" height="3" fill="#adb5bd" />
	<rect x="72" y="2620" width="36" height="8" rx="2" fill="#495057" stroke="#2b2a26" stroke-width="1.5" />
	<rect x="83" y="2600" width="14" height="20" fill="#adb5bd" stroke="#2b2a26" stroke-width="1.5" />
	<line x1="83" y1="2606" x2="97" y2="2606" stroke="#495057" stroke-width="1.5" />
	<line x1="83" y1="2612" x2="97" y2="2612" stroke="#495057" stroke-width="1.5" />
	<rect x="84" y="2594" width="12" height="7" fill="#fff3bf" stroke="#2b2a26" stroke-width="1.5" />
	<circle cx="90" cy="2584" r="14" fill="#fff3bf" stroke="#2b2a26" stroke-width="2" />
	<!-- vlákno: dva přívodní drátky a stočená spirála mezi nimi -->
	<path d="M 86 2595 L 86 2585 M 94 2595 L 94 2585" fill="none" stroke="#495057" stroke-width="1.2" />
	<path d="M 86 2585 q 1 -4 2 0 q 1 -4 2 0 q 1 -4 2 0 q 1 -4 2 0" fill="none" stroke="#e8590c" stroke-width="1.5" />
	<path d="M 120 2596 q 4 -5 0 -10 q -4 -5 0 -10 M 128 2598 q 4 -5 0 -10 q -4 -5 0 -10" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round" />
	<line x1="62" y1="2576" x2="55" y2="2572" stroke="#fab005" stroke-width="3" stroke-linecap="round" />
	<line x1="60" y1="2588" x2="52" y2="2588" stroke="#fab005" stroke-width="3" stroke-linecap="round" />
	<text x="152" y="2593" font-size="22" font-weight="bold" fill="#2b2a26">světlo a teplo</text>
	<text x="152" y="2621" font-size="21" fill="#495057">v žárovce</text>

	<text x="230" y="2672" text-anchor="middle" font-size="21" fill="#2b2a26">Energie mění podobu, ale <tspan font-weight="bold">nezmizí</tspan>.</text>

	</g>
</svg>
