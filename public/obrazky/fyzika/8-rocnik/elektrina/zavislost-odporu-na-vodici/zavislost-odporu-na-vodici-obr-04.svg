<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Nahoře obvod: zdroj, spínač, měděné přívodní kabely a topná spirála z nichromu. Po zavření spínače se spirála rozžhaví do oranžova, měděný kabel zůstane studený – nichrom má mnohem větší měrný odpor než měď. Dole sloupce měrného odporu v Ω·mm²/m: měď 0,018, hliník 0,028, konstantan 0,50, nichrom 1,1. Měď a hliník mají nejmenší měrný odpor – jsou to nejlepší vodiče. Animace: spínač se zavře, spirála se rozžhaví, pak se spínač otevře a spirála vychladne.">
<style>
/* Předloha: PDF lekce 26, s. 2–3 (látka, z níž je vodič vyroben; měrný odpor ρ; nejlepší vodiče měď, …) + výklad
   (měď 0,018, hliník 0,028, konstantan 0,50, nichrom 1,1 Ω·mm²/m; nichromová spirála se rozžhaví, měděný kabel zůstane studený).
   8 s: 0–25 % spínač otevřený; 25–31 % se zavře; 31–70 % spirála se rozžhavuje; 70–85 % žhne; 85–91 % spínač se otevře a spirála chladne.
   Bez animace (reduced-motion) = koncový stav: spínač zavřený, spirála žhne, kabel studený. */
.ps { animation: ps 8s ease-in-out infinite; }
@keyframes ps { 0%, 25% { transform: rotate(-26deg); } 31%, 85% { transform: rotate(0deg); } 91%, 100% { transform: rotate(-26deg); } }
.zh { animation: zh 8s linear infinite; }
@keyframes zh { 0%, 31% { opacity: 0; } 70%, 85% { opacity: 1; } 97%, 100% { opacity: 0; } }
.sz { animation: sv 8s step-end infinite; } .so { opacity: 0; animation: tm 8s step-end infinite; }
@keyframes sv { 0% { opacity: 0; } 31% { opacity: 1; } 86% { opacity: 0; } }
@keyframes tm { 0% { opacity: 1; } 31% { opacity: 0; } 86% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ps, .zh, .sz, .so { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="714" rx="14" fill="#f8f9fa"/>

