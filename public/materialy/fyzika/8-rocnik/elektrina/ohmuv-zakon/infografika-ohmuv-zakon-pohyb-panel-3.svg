<svg xmlns="http://www.w3.org/2000/svg" width="460" height="600" viewBox="0 0 460 600" role="img" aria-label="Ohmův zákon v pohybu, odpor změří ohmmetr: jeden vývod rezistoru drží svorka černého kabelu. Ruka přiloží červený hrot ke konci druhého vývodu a ohmmetr ukáže 6 Ω – měří odpor přímo. Nepřímo: při napětí 12 V teče proud 2 A, R = U : I = 12 V : 2 A = 6 Ω.">
<title>Ohmův zákon v pohybu 3/3: Odpor změří ohmmetr</title>
<!-- W107 (15. 10. 2026; oprava po kontrole 1: svorka nakreslena jako krokosvorka se zuby, kabel hrotu se nenatahuje, popisek „hrot“ vedle hrotu). Předloha: PDF 8/5 Elektřina/27. Ohmův zákon, s. 3 (měřidlo odporu: ohmmetr; nepřímo měřením proudu a napětí a výpočtem R = U : I); výklad oddíl 3; čísla 6 Ω, 12 V, 2 A z části Zvídavé (rezistor 6 Ω při 12 V vede 2 A). Cyklus 12 s: 0,3–2,0 s ruka přivede hrot obloukem kolem zdířky ohmmetru (kabel napnutý, délka stálá 80 px), 2,0 s dotyk → displej 6 Ω, 4,0 s a 5,5 s nepřímé určení; 11,55–11,85 s zatmění a návrat. -->
