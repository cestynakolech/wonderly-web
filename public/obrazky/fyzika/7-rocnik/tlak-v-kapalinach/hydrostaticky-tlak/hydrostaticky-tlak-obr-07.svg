<text x="250" y="40.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#212529">hráz přehrady</text><text x="720" y="40.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#212529">řez hrází</text><rect x="20" y="380" width="450" height="120" rx="0" fill="#b2f2bb" stroke="#2f9e44" stroke-width="3" /><path d="M40,380 L60,170 H430 L450,380 Z" fill="#ced4da" stroke="#212529" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M110,380 L110,190" fill="none" stroke="#212529" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M200,380 L200,190" fill="none" stroke="#212529" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M290,380 L290,190" fill="none" stroke="#212529" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M380,380 L380,190" fill="none" stroke="#212529" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="60" y1="240" x2="430" y2="240" stroke="#868e96" stroke-width="2" /><line x1="55" y1="310" x2="435" y2="310" stroke="#868e96" stroke-width="2" /><path d="M500,250 H630 V490 H500 Z" fill="#a5d8ff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><line x1="500" y1="250" x2="630" y2="250" stroke="#1c7ed6" stroke-width="3" /><path d="M630,200 H680 L770,490 H630 Z" fill="#ced4da" stroke="#212529" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="500" y="490" width="380" height="26" rx="0" fill="#6c5a48" stroke="#212529" stroke-width="3" /><rect x="500" y="250" width="130" height="240" fill="#a5d8ff" opacity="0.8"/><line x1="500" y1="250" x2="630" y2="250" stroke="#1c7ed6" stroke-width="3" /><line x1="590" y1="280" x2="626" y2="280" stroke="#e03131" stroke-width="5" marker-end="url(#ahr)"/><line x1="565" y1="340" x2="626" y2="340" stroke="#e03131" stroke-width="5" marker-end="url(#ahr)"/><line x1="540" y1="400" x2="626" y2="400" stroke="#e03131" stroke-width="5" marker-end="url(#ahr)"/><line x1="515" y1="455" x2="626" y2="455" stroke="#e03131" stroke-width="5" marker-end="url(#ahr)"/><rect x="520.0" y="540" width="400" height="90" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="2.5" />
