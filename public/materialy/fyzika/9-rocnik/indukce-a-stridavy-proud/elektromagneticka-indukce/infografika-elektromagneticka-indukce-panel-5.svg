<svg viewBox="0 2268 460 496" width="460" height="496" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Směr proudu: ruka zasune magnet pólem N do cívky, chvíli ho drží a pak ho vysune; když se magnet přibližuje, pole se zesiluje a proud teče jedním směrem; když stojí, pole se nemění a proud neteče; když se vzdaluje, pole se zeslabuje a proud teče opačně; prohozené póly také obrátí směr proudu" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Elektromagnetická indukce 5/6: Směr proudu</title>
	<style>
		.p5-mag { animation: p5mag 8s infinite; }
		@keyframes p5mag { 0%, 8% { transform: translateX(0); animation-timing-function: ease-in-out; } 28%, 45% { transform: translateX(60px); animation-timing-function: ease-in-out; } 65%, 100% { transform: translateX(0); } }
		.p5-ruc { transform-box: view-box; transform-origin: 0 0; animation: p5ruc 8s infinite; }
		@keyframes p5ruc { 0%, 8% { transform: rotate(0deg); animation-timing-function: ease-in-out; } 18% { transform: rotate(40deg); animation-timing-function: ease-in-out; } 28%, 45% { transform: rotate(0deg); animation-timing-function: ease-in-out; } 55% { transform: rotate(-40deg); animation-timing-function: ease-in-out; } 65%, 100% { transform: rotate(0deg); } }
		.p5-a { opacity: 0; animation: p5a 8s infinite; }
		@keyframes p5a { 0%, 10% { opacity: 0; } 11%, 25% { opacity: 1; } 26%, 100% { opacity: 0; } }
		.p5-b { opacity: 0; animation: p5b 8s infinite; }
		@keyframes p5b { 0%, 47% { opacity: 0; } 48%, 62% { opacity: 1; } 63%, 100% { opacity: 0; } }
		.p5-st1 { animation: p5st1 8s infinite; }
		@keyframes p5st1 { 0%, 17.5% { opacity: 0; } 18%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
		.p5-st2 { animation: p5st2 8s infinite; }
		@keyframes p5st2 { 0%, 54.5% { opacity: 0; } 55%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .p5-mag, .p5-ruc, .p5-a, .p5-b, .p5-st1, .p5-st2 { animation: none; } }
	</style>
