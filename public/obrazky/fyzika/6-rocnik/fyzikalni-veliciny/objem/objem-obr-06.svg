<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: měření objemu pevného tělesa. Vlevo odměrný válec jen s vodou, V1 = 8 ml. Vpravo ruka spouští na provázku šroub do vody, hladina stoupá, a když je šroub celý pod hladinou, je na 13 ml, V2 = 13 ml. Objem šroubu V = V2 − V1 = 13 ml − 8 ml = 5 ml.">
<style>
/* Předloha: PDF Objem — dva odměrné válce: vlevo voda V1 = 8 ml, vpravo voda se šroubem V2 = 13 ml, mezi nimi kóta V,
   dole V = V2 − V1 = 13 ml − 8 ml = 5 ml. Překresleno, ne kopie. Podle textu PDF šroub visí na tenkém provázku a je celý ponořený.
   Cyklus 10 s: 10–60 % ruka spouští šroub do vody; hladina stoupá přesně o objem ponořené části (výpočet v generátoru, lineárně po úsecích),
   celý ponořený šroub zvedne hladinu z 8 na 13 ml. Pak se ukáže V2, kóta V a výpočet. Bez animace = koncový stav. */
@keyframes sroub { 0% { transform: translate(0, -120px); } 10% { transform: translate(0, -120px); } 15% { transform: translate(0, -108px); } 49.6% { transform: translate(0, -24.96px); } 55% { transform: translate(0, -12px); } 60% { transform: translate(0, 0px); } 96% { transform: translate(0, 0); } 100% { transform: translate(0, -120px); } }
@keyframes voda { 0% { transform: translate(0, 80px); } 10% { transform: translate(0, 80px); } 15% { transform: translate(0, 80px); } 49.6% { transform: translate(0, 23.04px); } 55% { transform: translate(0, 0px); } 60% { transform: translate(0, 0px); } 96% { transform: translate(0, 0); } 100% { transform: translate(0, 80px); } }
@keyframes v2 { 0%, 62% { opacity: 0; } 68%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes kota { 0%, 70% { opacity: 0; } 76%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes vys { 0%, 78% { opacity: 0; } 84%, 94% { opacity: 1; } 100% { opacity: 0; } }
.sroub { animation: sroub 10s linear infinite; } .voda { animation: voda 10s linear infinite; }
.v2 { animation: v2 10s linear infinite; } .kota { animation: kota 10s linear infinite; } .vys { animation: vys 10s linear infinite; }
@media (prefers-reduced-motion: reduce) { .sroub, .voda, .v2, .kota, .vys { animation: none; } }
</style>
<defs>
<linearGradient id="sroub" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#495057"/><stop offset="0.35" stop-color="#ced4da"/><stop offset="0.6" stop-color="#868e96"/><stop offset="1" stop-color="#343a40"/></linearGradient>
<linearGradient id="hlava" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#343a40"/><stop offset="0.3" stop-color="#adb5bd"/><stop offset="0.5" stop-color="#dee2e6"/><stop offset="0.7" stop-color="#868e96"/><stop offset="1" stop-color="#343a40"/></linearGradient>
<clipPath id="vnitrekP"><rect x="480" y="230" width="160" height="320"/></clipPath>
<clipPath id="provazek"><rect x="0" y="204" width="800" height="720"/></clipPath>
</defs>
