<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kovový vodič nakreslený jako válec, vlevo záporný pól −, vpravo kladný pól +. Uvnitř se elektrony pohybují od − k + (modré šipky). Nad vodičem oranžová šipka dohodnutého směru proudu míří opačně, od + k −, s nápisem I = 20 mA. Animace: elektrony se ve vodiči stále posouvají směrem ke kladnému pólu.">
<style>
/* Předloha: PDF lekce 23, s. 2 (vodič jako válec, vlevo −, vpravo +; elektrony se šipkami míří k +;
   nad vodičem šipka proudu doleva s nápisem I = 20 mA). Opora: výklad § 3 „Na obrázku vodiče s proudem 20 mA uvidíš
   šipku proudu proti šipkám elektronů.“ Barvy jako vznik-elektrickeho-proudu: proud oranžově, elektrony modře.
   Animace: elektrony se stále posouvají od − k + (vzor 120 px za 3 s, smyčka bez švu). Bez animace = stejný
   obraz, elektrony stojí (šipky směr ukazují i tak). */
.drift { animation: drift 3s linear infinite; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(120px); } }
@media (prefers-reduced-motion: reduce) { .drift { animation: none; } }
</style>
<defs>
<marker id="v-ora" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e8590c"/></marker>
<marker id="v-mod" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1864ab"/></marker>
</defs>
<rect x="3" y="3" width="594" height="454" rx="14" fill="#f8f9fa"/>
