<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Světlo letí ze Slunce k Zemi. Vzdálenost je 150 000 000 km, rychlost světla c = 300 000 km/s. Animace: paprsek letí od Slunce k Zemi a čas letu přibývá po 100 sekundách, až u Země ukáže 500 s, to je 8 minut a 20 sekund.">
<style>
/* Animace (10 s, smyčka): paprsek letí stálou rychlostí od Slunce k Zemi 5–65 %. Čára je rozdělená
   pěti dílky; hrot projde dílkem k v čase 5 + 12·k %, tehdy se čas letu změní na k·100 s (0 až 500 s).
   Výsledek 500 s = 8 min 20 s se objeví 66–70 %; vše zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: paprsek u Země, čas 500 s, výsledek. */
.let { stroke-dasharray: 100; animation: let 10s linear infinite; }
.hrot { animation: hrot 10s linear infinite; }
.c0 { animation: c0 10s linear infinite; }
.c1 { animation: c1 10s linear infinite; }
.c2 { animation: c2 10s linear infinite; }
.c3 { animation: c3 10s linear infinite; }
.c4 { animation: c4 10s linear infinite; }
.c5 { animation: c5 10s linear infinite; }
.vys { animation: vys 10s linear infinite; }
.celek { animation: celek 10s linear infinite; }
@keyframes let { 0%, 5% { stroke-dashoffset: 100; } 65%, 100% { stroke-dashoffset: 0; } }
@keyframes hrot { 0%, 5% { transform: translateX(-409px); opacity: 0; } 5.5% { opacity: 1; } 65%, 100% { transform: translateX(0); opacity: 1; } }
@keyframes c0 { 0%, 16.9% { opacity: 1; } 17%, 100% { opacity: 0; } }
@keyframes c1 { 0%, 16.9% { opacity: 0; } 17%, 28.9% { opacity: 1; } 29%, 100% { opacity: 0; } }
@keyframes c2 { 0%, 28.9% { opacity: 0; } 29%, 40.9% { opacity: 1; } 41%, 100% { opacity: 0; } }
@keyframes c3 { 0%, 40.9% { opacity: 0; } 41%, 52.9% { opacity: 1; } 53%, 100% { opacity: 0; } }
@keyframes c4 { 0%, 52.9% { opacity: 0; } 53%, 64.9% { opacity: 1; } 65%, 100% { opacity: 0; } }
@keyframes c5 { 0%, 64.9% { opacity: 0; } 65%, 100% { opacity: 1; } }
@keyframes vys { 0%, 66% { opacity: 0; } 70%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .let, .hrot, .c0, .c1, .c2, .c3, .c4, .c5, .vys, .celek { animation: none; } }
</style>
<defs>
<clipPath id="ramec"><rect x="5" y="5" width="590" height="390" rx="12"/></clipPath>
</defs>
<rect x="3" y="3" width="594" height="394" rx="14" fill="#fff9db" stroke="#2b2a26" stroke-width="3"/>
<text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Jak dlouho letí světlo ze Slunce</text>

<!-- Slunce (okraj vlevo) a Země (vpravo), měřítko nezachováno -->
<circle cx="-20" cy="190" r="110" fill="#ffd43b" stroke="#f08c00" stroke-width="4" clip-path="url(#ramec)"/>
<text x="45" y="158" font-size="22" font-weight="bold" fill="#5c3d00" text-anchor="middle">Slunce</text>
<circle cx="530" cy="190" r="26" fill="#4dabf7" stroke="#1864ab" stroke-width="3"/>
<path d="M514,176 q10,-6 18,2 q-4,10 -14,8 z M530,200 q12,-4 16,6 q-10,8 -18,0 z" fill="#69db7c"/>
<text x="530" y="146" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Země</text>

<!-- vzdálenost -->
<text x="300" y="96" font-size="22" fill="#212529" text-anchor="middle">vzdálenost <tspan font-weight="bold">150 000 000 km</tspan></text>
<line x1="109" y1="116" x2="490" y2="116" stroke="#1971c2" stroke-width="2.5"/>
<polygon points="95,116 111,109 111,123" fill="#1971c2"/>
<polygon points="504,116 488,109 488,123" fill="#1971c2"/>

<!-- dílky po pětinách dráhy (hrot paprsku 95 → 504) -->
<g stroke="#868e96" stroke-width="2">
<line x1="176.8" y1="200" x2="176.8" y2="212"/>
<line x1="258.6" y1="200" x2="258.6" y2="212"/>
<line x1="340.4" y1="200" x2="340.4" y2="212"/>
<line x1="422.2" y1="200" x2="422.2" y2="212"/>
</g>

<g class="celek">
<!-- paprsek letí stálou rychlostí -->
<line class="let" pathLength="100" x1="95" y1="190" x2="488" y2="190" stroke="#e8590c" stroke-width="5" stroke-linecap="round"/>
<polygon class="hrot" points="504,190 486,181 486,199" fill="#e8590c"/>
</g>

<!-- čas letu -->
<text x="232" y="262" font-size="22" fill="#212529" text-anchor="end">čas letu:</text>
<rect x="244" y="230" width="132" height="46" rx="10" fill="#343a40"/>
<g class="celek" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">
<text class="c0" x="310" y="264" opacity="0">0 s</text>
<text class="c1" x="310" y="264" opacity="0">100 s</text>
<text class="c2" x="310" y="264" opacity="0">200 s</text>
<text class="c3" x="310" y="264" opacity="0">300 s</text>
<text class="c4" x="310" y="264" opacity="0">400 s</text>
<text class="c5" x="310" y="264">500 s</text>
</g>

<text x="300" y="322" font-size="22" fill="#212529" text-anchor="middle">rychlost světla <tspan font-weight="bold">c = 300 000 km/s</tspan></text>
<g class="celek"><g class="vys">
<text x="300" y="368" font-size="22" fill="#212529" text-anchor="middle">150 000 000 : 300 000 = <tspan font-weight="bold">500 s = 8 min 20 s</tspan></text>
</g></g>
</svg>
