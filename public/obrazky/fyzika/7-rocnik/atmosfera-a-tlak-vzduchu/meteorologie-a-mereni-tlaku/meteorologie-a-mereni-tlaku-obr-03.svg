<text x="345" y="206" font-size="22" fill="#212529">ručička ukáže déšť</text>
<g stroke="#0c8599" stroke-width="3" stroke-linecap="round"><line x1="534" y1="140" x2="530" y2="150"/><line x1="548" y1="140" x2="544" y2="150"/><line x1="562" y1="140" x2="558" y2="150"/></g>
<g fill="#dee2e6" stroke="#495057" stroke-width="2.5"><ellipse cx="537" cy="124" rx="17" ry="11"/><ellipse cx="561" cy="124" rx="17" ry="11"/><ellipse cx="549" cy="114" rx="17" ry="13"/></g>
