		.p8-b { animation: p8b 9s linear infinite; }
		@keyframes p8b { 0%, 26% { opacity: 0; } 30%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
		.p8-c { animation: p8c 9s linear infinite; }
		@keyframes p8c { 0%, 34% { opacity: 0; } 38%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
		.p8-d1 { animation: p8d1 9s linear infinite; }
		@keyframes p8d1 { 0%, 50% { opacity: 0; } 52%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
		.p8-d2 { animation: p8d2 9s linear infinite; }
		@keyframes p8d2 { 0%, 60% { opacity: 0; } 62%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
		.p8-d3 { animation: p8d3 9s linear infinite; }
		@keyframes p8d3 { 0%, 70% { opacity: 0; } 72%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
		.p8-d4 { animation: p8d4 9s linear infinite; }
		@keyframes p8d4 { 0%, 80% { opacity: 0; } 82%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .p8-konektor, .p8-0, .p8-a, .p8-b, .p8-c, .p8-d1, .p8-d2, .p8-d3, .p8-d4 { animation: none; } }
