<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: dívka sedí na zemi s nataženýma nohama, pružný pás má přes podrážky bot a oba konce drží v rukou. Zakloní se a pás natáhne. Bubliny: Ruce působí na pás a natáhnou ho. Natažený pás působí na ruce i nohy a přitahuje je k sobě.">
<style>
/* Předloha: PDF Vzájemné působení těles, síla – fotografie cvičení s pružným pásem a dvě bubliny. Překresleno, děj natažení animován. Bez animace (reduced-motion) = natažený pás. */
/* cyklus 6 s: 0–15 % klid, 15–45 % záklon a natažení, 45–75 % drží, 75–95 % povolí */
@keyframes telo { 0%, 15% { transform: rotate(0deg); } 45%, 75% { transform: rotate(10deg); } 95%, 100% { transform: rotate(0deg); } }
@keyframes pasA { 0%, 15% { transform: translate(152px, 420px) rotate(-12.32deg) scaleX(1); } 45%, 75% { transform: translate(152px, 420px) rotate(-15.53deg) scaleX(1.1114); } 95%, 100% { transform: translate(152px, 420px) rotate(-12.32deg) scaleX(1); } }
@keyframes pasB { 0%, 15% { transform: translate(152px, 462px) rotate(-24.69deg) scaleX(1); } 45%, 75% { transform: translate(152px, 462px) rotate(-26.48deg) scaleX(1.1125); } 95%, 100% { transform: translate(152px, 462px) rotate(-24.69deg) scaleX(1); } }
.telo { transform-origin: 0 0; animation: telo 6s ease-in-out infinite; }
.pA { transform-origin: 0 0; animation: pasA 6s ease-in-out infinite; }
.pB { transform-origin: 0 0; animation: pasB 6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .telo, .pA, .pB { animation: none; } }
</style>
<defs><marker id="b-cer" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e03131"/></marker><marker id="b-mod" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#1971c2"/></marker><marker id="b-ora" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e8590c"/></marker><marker id="b-sed" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#868e96"/></marker><marker id="m-sed" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#868e96"/></marker><linearGradient id="podl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dee2e6"/><stop offset="1" stop-color="#ced4da"/></linearGradient><linearGradient id="leg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c757d"/><stop offset="1" stop-color="#343a40"/></linearGradient><linearGradient id="pasg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f783ac"/><stop offset="1" stop-color="#d6336c"/></linearGradient></defs>
<rect x="3" y="3" width="594" height="554" rx="14" fill="#f8f9fa"/>
