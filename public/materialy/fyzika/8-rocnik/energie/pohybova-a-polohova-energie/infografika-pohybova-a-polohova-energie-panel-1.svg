<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 156 460 496" width="460" height="496" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Mechanická energie: těleso ji získá, když s ním konáme mechanickou práci. Mechanická energie je pohybová (kinetická) Ek a polohová (potenciální); polohová je v gravitačním poli Země Ep a pružnosti. Všechny se měří v joulech (J).">
