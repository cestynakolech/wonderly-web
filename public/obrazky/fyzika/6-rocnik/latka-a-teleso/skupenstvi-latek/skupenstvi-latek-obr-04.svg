<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Plynné skupenství. Nahoře Země z vesmíru, kolem ní je tenká modrá vrstva vzduchu – vzduch je plyn. Dole ruka s bublifukem a mýdlové bubliny: v bublině je vzduch a má tvar bubliny. Kapaliny i plyny lze přelévat, říkáme jim tekutiny. Animace: bubliny stoupají.">
