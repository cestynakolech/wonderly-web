<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Zdánlivé obrazy. Nahoře lupa: předmět je blíž ke spojce než ohnisko F; paprsky se za čočkou rozbíhají a oko je vidí, jako by vycházely z většího vzpřímeného stromu před čočkou — obraz je zdánlivý, vzpřímený a zvětšený. Dole rozptylka: paprsky se za čočkou rozbíhají, jako by vycházely z menšího vzpřímeného stromu blíž u čočky — obraz je vždy zdánlivý, vzpřímený a zmenšený. Animace: paprsky proletí čočkou, dokreslí se čárkovaná prodloužení dozadu a v jejich průsečíku se objeví zdánlivý obraz.">
<style>
/* Animace 9 s, smyčka. Předloha: PDF lekce 25, str. 13 (lupa: předmět blíž než f, zdánlivý zvětšený obraz,
   čárkovaná prodloužení). Rozptylka: PDF str. 17 (nákres rozptylky: strom před F´, zdánlivý zmenšený obraz mezi F´ a čočkou).
   Geometrie: lupa f = 90, a = 60 → b = −180, obraz 3× (30 → 90 px);
   rozptylka f = −150 (F´ x = 250, čočka x = 400), a = 225 (strom x = 175) → b = −90 (obraz x = 310), zvětšení 0,4, obraz 75 → 30 px.
   Předmět stojí dál než F´, takže čárkované prodloužení do F´ předmět nepřeškrtá; oko je mezi rozbíhavými paprsky.
   paprsky 5–40 %, čárkovaná prodloužení 40–55 %, zdánlivý obraz 55–65 %, vše zmizí 92–98 %. Bez animace = koncový stav. */
.pr { stroke-dasharray: 100 100; animation: pr 9s linear infinite; }
.si { animation: si 9s linear infinite; }
.ca { animation: ca 9s linear infinite; }
.ob { animation: ob 9s linear infinite; }
.celek { animation: celek 9s linear infinite; }
@keyframes pr { 0%, 5% { stroke-dashoffset: 100; } 40%, 100% { stroke-dashoffset: 0; } }
@keyframes si { 0%, 40% { opacity: 0; } 45%, 100% { opacity: 1; } }
@keyframes ca { 0%, 40% { opacity: 0; } 55%, 100% { opacity: 1; } }
@keyframes ob { 0%, 55% { opacity: 0; } 65%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pr, .si, .ca, .ob, .celek { animation: none; } }
</style>
