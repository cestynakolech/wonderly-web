<svg viewBox="0 614 460 532" width="460" height="532" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Menší síla, delší dráha: stejnou bednu dostáváme do výšky 1 m na plošinu; vlevo ji ruka zvedá lanem svisle silou 600 N po dráze 1 m, vpravo ji ruka táhne lanem po rampě dlouhé 3 m silou 200 N po dráze 3 m; červená šipka síly je u svislého zvedání třikrát delší; obě bedny jedou stejně rychle, po rampě jede bedna déle a nahoře se překlopí na plošinu; potom ji ruce zase spouštějí dolů" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
