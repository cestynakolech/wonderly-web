<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Řez uchem: zvuková vlna vstoupí do ušního boltce, projde zvukovodem a rozkmitá ušní bubínek. Kůstky kladívko, kovadlinka a třmínek předají kmity přes pružné okénko do hlemýždě s kapalinou. Vláskové buňky v hlemýždi pošlou signál sluchovým nervem do mozku. Pás dole ukazuje, čím kmity postupně procházejí: vzduch, kůstky, kapalina, nervový signál. Animace: vlny putují zvukovodem, bubínek a kůstky kmitají, kapalina v hlemýždi se vlní a nervem běží signál do mozku.">
<title>Cesta zvuku uchem</title>
<style>
/* Předloha: PDF lekce 35 (Škola/8/6 Zvuk/35 …/35. Vnímání zvuku, hlasitost zvuku .pdf), s. 1 – řez uchem
   (boltec, zvukovod, bubínek, kladívko, kovadlinka, třmínek, oválné okénko, hlemýžď, polokruhové kanálky, nerv);
   s. 2–4 – popis cesty zvuku (boltec → zvukovod → bubínek → kůstky → pružné okénko → kapalina hlemýždě →
   vláskové buňky → sluchový nerv → mozek). Infografiky ve složce lekce: vlna vstupuje zleva, nerv vede do mozku.
   Polokruhové kanálky jsou nakreslené bez popisku (výklad je nezmiňuje), Eustachova trubice, vestibulární nerv
   a bubínková dutina se nepopisují (nejsou ve výkladu).
   Smyčka 2 s: vlny projdou zvukovodem; bubínek a kůstky kmitají s periodou 0,3 s; kapalina a signál běží stále.
   Bez animace (reduced-motion) = vlny ve zvukovodu, ostatní v klidu. */
.vlna { animation: vlna 2s linear infinite; }
@keyframes vlna { 0% { transform: translateX(-250px); opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(130px); opacity: 0; } }
.kmit { animation: kmit .3s ease-in-out infinite alternate; }
.kmit2 { animation: kmit .3s ease-in-out .08s infinite alternate; }
@keyframes kmit { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
.kap { stroke-dasharray: 5 13; animation: tok 1.2s linear infinite; }
@keyframes tok { to { stroke-dashoffset: -36; } }
.sig { stroke-dasharray: 2 28; animation: sig 1s linear infinite; }
@keyframes sig { to { stroke-dashoffset: -60; } }
@media (prefers-reduced-motion: reduce) { .vlna, .kmit, .kmit2, .kap, .sig { animation: none; } }
</style>
