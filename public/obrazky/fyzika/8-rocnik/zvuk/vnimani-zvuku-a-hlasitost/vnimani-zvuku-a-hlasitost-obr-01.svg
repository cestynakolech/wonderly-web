<linearGradient id="kuze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbd9c4"/><stop offset=".6" stop-color="#f2b896"/><stop offset="1" stop-color="#e29a76"/></linearGradient>
<radialGradient id="mozek" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe3e3"/><stop offset="1" stop-color="#ffa8a8"/></radialGradient>
<pattern id="kost" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#f1e8d6"/><circle cx="6" cy="7" r="2.5" fill="#e3d5b8"/><circle cx="16" cy="17" r="2" fill="#e3d5b8"/></pattern>
