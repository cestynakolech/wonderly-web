<svg xmlns="http://www.w3.org/2000/svg" width="460" height="640" viewBox="0 0 460 640" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vysoká nádoba s vodou na stojanu má tři otvory pod sebou. Vodu doléváme, hladina se nemění. Z otvorů stříká voda do vaničky. Horní otvor: malý tlak, prostřední: větší tlak, dolní: největší tlak. Dolní otvor stříká nejsilněji. Čím hlouběji pod hladinou, tím větší tlak.">
	<title>Hydrostatický tlak 1/6: Tlak roste s hloubkou</title>
	<!-- Panel 1/6 infografiky Hydrostatický tlak (W53, 14. 10. 2026); bez animace = koncový stav. -->
	<style>
		.p1-j0 { animation: p1-j0 1.6s ease-out 0.6s both; }
		@keyframes p1-j0 { 0% { stroke-dasharray: 276 276; stroke-dashoffset: 276 } 100% { stroke-dasharray: 276 276; stroke-dashoffset: 0 } }
		.p1-t0 { animation: p1-tok 0.7s linear infinite, p1-obj 0.3s ease 2.2s both; }
		.p1-j1 { animation: p1-j1 1.6s ease-out 0.6s both; }
		@keyframes p1-j1 { 0% { stroke-dasharray: 287 287; stroke-dashoffset: 287 } 100% { stroke-dasharray: 287 287; stroke-dashoffset: 0 } }
		.p1-t1 { animation: p1-tok 0.49s linear infinite, p1-obj 0.3s ease 2.2s both; }
		.p1-j2 { animation: p1-j2 1.6s ease-out 0.6s both; }
		@keyframes p1-j2 { 0% { stroke-dasharray: 287 287; stroke-dashoffset: 287 } 100% { stroke-dasharray: 287 287; stroke-dashoffset: 0 } }
		.p1-t2 { animation: p1-tok 0.4s linear infinite, p1-obj 0.3s ease 2.2s both; }
		@keyframes p1-tok { 0% { stroke-dashoffset: 20 } 100% { stroke-dashoffset: 0 } }
		@keyframes p1-obj { 0% { opacity: 0 } 100% { opacity: 1 } }
		@media (prefers-reduced-motion: reduce) {
			.p1-j0, .p1-j1, .p1-j2, .p1-obj, .p1-t0, .p1-t1, .p1-t2, .p1-tok { animation: none; }
		}
	</style>
