<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2262 460 638" width="460" height="638" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Jak spočítat Ep: práce vykonaná při zvednutí se v tělese uloží jako Ep. Ep = m · g · h, m hmotnost v kilogramech, h výška v metrech, g = 10 N/kg, Ep energie v joulech. Zvedneme těleso m do výšky h; ze vzorce m = Ep : (g · h) a h = Ep : (m · g).">
	<title>Pohybová a polohová energie 5/6: Jak spočítat Ep</title>
	<!-- Panel 5/6 výřezu z infografika-pohybova-a-polohova-energie.svg (souřadnice beze změny, jen viewBox; postup PANELY-NAVOD.md). -->
	<defs>
		<linearGradient id="ocel" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#868e96" />
			<stop offset="0.45" stop-color="#dee2e6" />
			<stop offset="1" stop-color="#495057" />
		</linearGradient>
		<linearGradient id="drevo" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#e3b778" />
			<stop offset="1" stop-color="#c08a4a" />
		</linearGradient>
	</defs>
	<rect x="0" y="2262" width="460" height="638" fill="#f3f1ea" />
	<g id="panel-5" data-vyrez="14 2266 438 630">
	<!-- ===== Panel 5:Výpočet (y 2272–2884) ===== -->
	<rect x="26" y="2278" width="420" height="612" rx="10" fill="#2b2a26" />
	<rect x="20" y="2272" width="420" height="612" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
	<circle cx="52" cy="2306" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
	<text x="52" y="2313" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">5</text>
	<text x="80" y="2315" font-size="28" font-weight="bold" fill="#2b2a26">Jak spočítat <tspan fill="#1864ab">E<tspan font-size="21" dy="6">p</tspan></tspan></text>

	<circle cx="44" cy="2345" r="4" fill="#2b2a26" />
	<text x="56" y="2352" font-size="21" fill="#2b2a26">práce vykonaná při zvednutí</text>
	<text x="56" y="2380" font-size="21" fill="#2b2a26">se v tělese <tspan font-weight="bold">uloží</tspan> jako <tspan font-weight="bold" fill="#1864ab">E<tspan font-size="18" dy="5">p</tspan></tspan></text>

	<rect x="60" y="2400" width="340" height="62" rx="10" fill="#fff3bf" stroke="#2b2a26" stroke-width="2.5" />
	<text x="230" y="2444" text-anchor="middle" font-size="34" font-weight="bold" fill="#2b2a26"><tspan fill="#1864ab">E<tspan font-size="24" dy="7">p</tspan></tspan><tspan dy="-7"> = m · g · h</tspan></text>

	<text x="56" y="2500" font-size="21" fill="#2b2a26"><tspan font-weight="bold">m</tspan> … hmotnost (kg)</text>
	<text x="56" y="2530" font-size="21" fill="#2b2a26"><tspan font-weight="bold">h</tspan> … výška (m)</text>
	<text x="56" y="2560" font-size="21" fill="#2b2a26"><tspan font-weight="bold">g</tspan> = 10 N/kg</text>
	<text x="56" y="2590" font-size="21" fill="#2b2a26"><tspan font-weight="bold" fill="#1864ab">E<tspan font-size="18" dy="5">p</tspan></tspan><tspan dy="-5"> … energie (J)</tspan></text>

	<text x="44" y="2632" font-size="21" fill="#2b2a26">zvedneme těleso <tspan font-weight="bold">m</tspan> do výšky <tspan font-weight="bold">h</tspan>:</text>

	<!-- zem -->
	<rect x="34" y="2820" width="392" height="14" fill="#8ce99a" stroke="#2b2a26" stroke-width="2" />
	<!-- lešení -->
	<g stroke="#2b2a26" stroke-width="2">
		<rect x="236" y="2710" width="8" height="110" fill="url(#ocel)" />
		<rect x="384" y="2710" width="8" height="110" fill="url(#ocel)" />
		<rect x="310" y="2710" width="8" height="110" fill="url(#ocel)" />
		<line x1="244" y1="2765" x2="384" y2="2765" stroke="#868e96" stroke-width="4" />
		<line x1="244" y1="2818" x2="310" y2="2765" stroke="#868e96" stroke-width="3" />
		<line x1="318" y1="2765" x2="384" y2="2712" stroke="#868e96" stroke-width="3" />
		<rect x="226" y="2700" width="176" height="10" fill="url(#drevo)" />
		<rect x="230" y="2816" width="20" height="5" fill="#495057" />
		<rect x="304" y="2816" width="20" height="5" fill="#495057" />
		<rect x="378" y="2816" width="20" height="5" fill="#495057" />
	</g>
	<!-- těleso (cihla) na lešení — bez čísel (příklad s čísly je jen v „Pro zvídavé“, do taháku nepatří) -->
	<rect x="290" y="2682" width="52" height="18" rx="1" fill="#c0492b" stroke="#2b2a26" stroke-width="2" />
	<line x1="292" y1="2691" x2="340" y2="2691" stroke="#e8a48f" stroke-width="1.5" />
	<line x1="306" y1="2684" x2="306" y2="2690" stroke="#e8a48f" stroke-width="1.5" /><line x1="326" y1="2692" x2="326" y2="2698" stroke="#e8a48f" stroke-width="1.5" />
	<text x="316" y="2672" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a26">m</text>
	<!-- výška lešení -->
	<line x1="200" y1="2700" x2="226" y2="2700" stroke="#1864ab" stroke-width="2" stroke-dasharray="5 4" />
	<line x1="206" y1="2712" x2="206" y2="2808" stroke="#1864ab" stroke-width="3" />
	<polygon points="206,2702 200,2714 212,2714" fill="#1864ab" />
	<polygon points="206,2818 200,2806 212,2806" fill="#1864ab" />
	<text x="190" y="2768" text-anchor="end" font-size="25" font-weight="bold" fill="#1864ab">h</text>

	<text x="44" y="2866" font-size="21" fill="#2b2a26">m = <tspan fill="#1864ab">E<tspan font-size="18" dy="5">p</tspan></tspan><tspan dy="-5"> : (g · h)</tspan></text>
	<text x="246" y="2866" font-size="21" fill="#2b2a26">h = <tspan fill="#1864ab">E<tspan font-size="18" dy="5">p</tspan></tspan><tspan dy="-5"> : (m · g)</tspan></text>

	</g>
</svg>
