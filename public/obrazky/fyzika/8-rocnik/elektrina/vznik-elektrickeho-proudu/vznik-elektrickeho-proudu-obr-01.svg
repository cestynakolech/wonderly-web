<rect x="235" y="395" width="130" height="50" rx="8" fill="#343a40" stroke="#212529" stroke-width="2"/><rect x="365" y="410" width="10" height="20" rx="2" fill="#868e96" stroke="#212529" stroke-width="2"/><text x="300" y="428" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">baterie</text>
<text x="250" y="386" font-size="32" font-weight="bold" fill="#1864ab" text-anchor="middle">−</text>
<text x="352" y="386" font-size="32" font-weight="bold" fill="#c92a2a" text-anchor="middle">+</text>
<g class="on"><line x1="532" y1="385" x2="532" y2="205" stroke="#e8590c" stroke-width="7" stroke-linecap="round" marker-end="url(#v-ora)"/><line x1="68" y1="205" x2="68" y2="385" stroke="#e8590c" stroke-width="7" stroke-linecap="round" marker-end="url(#v-ora)"/><line x1="455" y1="210" x2="455" y2="380" stroke="#1864ab" stroke-width="5" stroke-linecap="round" marker-end="url(#v-mod)"/><line x1="145" y1="380" x2="145" y2="210" stroke="#1864ab" stroke-width="5" stroke-linecap="round" marker-end="url(#v-mod)"/></g>
<line x1="36" y1="506" x2="96" y2="506" stroke="#e8590c" stroke-width="7" stroke-linecap="round" marker-end="url(#v-ora)"/>
<text x="112" y="514" font-size="22" fill="#212529" text-anchor="start">dohodnutý směr proudu: od + k −</text>
<line x1="36" y1="546" x2="96" y2="546" stroke="#1864ab" stroke-width="5" stroke-linecap="round" marker-end="url(#v-mod)"/>
<text x="112" y="554" font-size="22" fill="#212529" text-anchor="start">elektrony se pohybují opačně: od − k +</text>
</svg>
