<text x="34" y="92" font-size="21" fill="#2b2a26">Pomáhej jen tak, aby ses</text>
<text x="34" y="120" font-size="21" fill="#2b2a26">nezranil i ty.</text>
<g class="k0"><rect x="34" y="138" width="192" height="360" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="2"/><circle cx="54" cy="160" r="14" fill="#2b2a26"/><text x="54" y="167" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="130" y="352" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">Vypni proud</text><text x="130" y="378" font-size="21" text-anchor="middle" fill="#2b2a26">jističem.</text><polygon points="104,198 120,186 172,186 156,198" fill="#dee2e6" stroke="#343a40" stroke-width="2" stroke-linejoin="round"/><polygon points="156,198 172,186 172,284 156,296" fill="#adb5bd" stroke="#343a40" stroke-width="2" stroke-linejoin="round"/><rect x="104" y="198" width="52" height="98" fill="#f1f3f5" stroke="#343a40" stroke-width="2"/><rect x="122" y="216" width="16" height="56" rx="3" fill="#343a40"/><rect class="pa" x="117" y="218" width="26" height="22" rx="4" fill="#495057" stroke="#212529" stroke-width="2"/><path class="bl" d="M74,206 L62,232 L74,232 L64,258" fill="none" stroke="#f08c00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></g>
