<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Svíčkové hodiny: vysoká svíčka ve svícnu na stole. Na svíčce je vyrytá stupnice s dílky 1 až 6. Svíčka hoří, zkracuje se stále stejně rychle a podle toho, ke kterému dílku dohořela, se pozná uplynulý čas.">
<style>
/* Svíčka hoří a stupnice mizí odshora (18 s, smyčka). Bez animace platí atributy = konečný stav: svíčka uhořela o 3 dílky. */
.uhori { animation: uhori-k 18s linear infinite; }
.plamen { transform-box: view-box; transform-origin: 480px 146px; animation: plapolani 0.8s ease-in-out infinite alternate; }
@keyframes uhori-k { 0% { transform: translateY(0px); } 88%, 100% { transform: translateY(150px); } }
@keyframes plapolani { from { transform: scale(1, 1); } to { transform: scale(0.9, 1.12); } }
@media (prefers-reduced-motion: reduce) { .uhori, .plamen { animation: none; } }
</style>
<defs>
<linearGradient id="vosk2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe8a3"/><stop offset="0.4" stop-color="#fff9db"/><stop offset="1" stop-color="#f5d77a"/></linearGradient>
<linearGradient id="mosaz2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f6b12"/><stop offset="0.45" stop-color="#f2d06b"/><stop offset="1" stop-color="#7a5a0e"/></linearGradient>
<linearGradient id="stul2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a0703f"/><stop offset="1" stop-color="#6b4423"/></linearGradient>
<radialGradient id="plamen2" cx="0.5" cy="0.7" r="0.6"><stop offset="0" stop-color="#fff"/><stop offset="0.35" stop-color="#ffe066"/><stop offset="0.8" stop-color="#ff922b"/><stop offset="1" stop-color="#f76707"/></radialGradient>
<radialGradient id="zare2"><stop offset="0" stop-color="#ffe066" stop-opacity="0.55"/><stop offset="1" stop-color="#ffe066" stop-opacity="0"/></radialGradient>
</defs>
