<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Krátkozrakost. Nahoře oko bez brýlí: paprsky od vzdálené postavy se sejdou už před sítnicí, obraz vzniká před sítnicí a na sítnici dopadá rozmazaně. Dole jsou před okem brýle s rozptylkou (záporné dioptrie): paprsky se před okem trochu rozbíhají a obraz vznikne přesně na sítnici, postava je vidět ostře. Animace: brýle s rozptylkou sjedou před oko a obraz se posune dozadu na sítnici.">
<style>
/* Překresleno podle předlohy: PDF lekce 26 Oko, vady oka, str. 9 (obrázek Dalekozrakost / Krátkozrakost: postava vlevo,
   oko v řezu, nahoře obraz mimo sítnici, dole brýlová čočka před okem a obraz na sítnici). Text podle výkladu.
   Model: oko = tenká spojka f = 80 px v místě čočky, sítnice 160 px za ní; brýle = rozptylka f = -160 px, 80 px před čočkou oka.
   Předmět 240 px před čočkou, polovina výšky 30. Bez brýlí: b = 120 (obraz před sítnicí), polovina obrazu 15.
   S brýlemi: obraz přesně na sítnici (b = 160), polovina obrazu 15. Paprsky z hlavy oranžové, z nohou modré.
   Dolní panel, animace 10 s, smyčka: 0–15 % stav bez brýlí, 15–22 % paprsky bez brýlí zhasnou, 18–30 % brýle sjedou před oko, 30–40 % rozsvítí se paprsky s brýlemi
   a obraz se posune na sítnici, obraz se posune 22–40 %, popisek „ostře“ 30–40 %, 88–100 % návrat. Bez animace (prefers-reduced-motion)
   = koncový stav: brýle nasazené, obraz na sítnici (atributy níže). Horní panel je stav (bez animace). */
.bryle { animation: bryle 10s ease-in-out infinite; }
.stA { animation: stA 10s linear infinite; }
.stB { animation: stB 10s linear infinite; }
.obr { transform-box: view-box; transform-origin: 490px 570px; animation: obr 10s ease-in-out infinite; }
@keyframes bryle { 0%, 18% { transform: translateY(-30px); opacity: 0; } 30%, 90% { transform: translateY(0); opacity: 1; } 96%, 100% { transform: translateY(-30px); opacity: 0; } }
@keyframes stA { 0%, 15% { opacity: 1; } 22%, 96% { opacity: 0; } 100% { opacity: 1; } }
@keyframes stB { 0%, 30% { opacity: 0; } 40%, 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
@keyframes obr { 0%, 22% { transform: translateX(-40px) scale(1); } 40%, 90% { transform: translateX(0) scale(1); } 96%, 100% { transform: translateX(-40px) scale(1); } }
@media (prefers-reduced-motion: reduce) { .bryle, .stA, .stB, .obr { animation: none; } }
</style>
