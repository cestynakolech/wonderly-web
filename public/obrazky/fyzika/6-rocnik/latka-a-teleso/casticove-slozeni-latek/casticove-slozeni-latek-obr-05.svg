<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 715" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace ve dvou částech. Nahoře ruce natahují pružinu posilovače; pod ní zvětšená řada čtyř částic: částice se od sebe vzdálí a červené šipky ukazují přitažlivé síly, které je táhnou k sobě. Dole dlaň zmáčkne gumový míček na stole; částice se k sobě přiblíží a červené šipky ukazují odpudivé síly, které je tlačí od sebe.">
<style>
/* Předloha: PDF Částicové složení látek, oddíl ČÁSTICE NA SEBE PŮSOBÍ SILAMI (přitažlivé síly – natažení pružných lan či pružin; odpudivé síly – stlačení míče; materiál je pružný) a fotografie posilovače s pružinou a ženy s míčkem. Fotografie překresleny kresbou. Smyčka 6 s: 0–15 % klid, 15–40 % natažení / zmáčknutí, 40–65 % drží, 65–85 % návrat (pružnost). Vzdálenost částic 52 px, natažení 72 px, stlačení 38 px. Šipky sil se ukážou jen při změně vzdálenosti. Bez animace = klidový stav bez šipek. */
@keyframes pruz { 0% { transform: translate(92px, 150px) scale(1, 1) } 15% { transform: translate(92px, 150px) scale(1, 1) } 40% { transform: translate(92px, 150px) scale(1.4348, 1) } 65% { transform: translate(92px, 150px) scale(1.4348, 1) } 85% { transform: translate(92px, 150px) scale(1, 1) } 100% { transform: translate(92px, 150px) scale(1, 1) } }
@keyframes drzP { 0% { transform: translate(334px, 150px) } 15% { transform: translate(334px, 150px) } 40% { transform: translate(434px, 150px) } 65% { transform: translate(434px, 150px) } 85% { transform: translate(334px, 150px) } 100% { transform: translate(334px, 150px) } }
.pz { animation: pruz 6s ease-in-out infinite; }
.dp { animation: drzP 6s ease-in-out infinite; }
@keyframes sipky { 0% { opacity: 0 } 20% { opacity: 0 } 35% { opacity: 1 } 68% { opacity: 1 } 80% { opacity: 0 } 100% { opacity: 0 } }
@keyframes ac0 { 0% { transform: translate(222px, 262px) } 15% { transform: translate(222px, 262px) } 40% { transform: translate(192px, 262px) } 65% { transform: translate(192px, 262px) } 85% { transform: translate(222px, 262px) } 100% { transform: translate(222px, 262px) } }
.ac0 { animation: ac0 6s ease-in-out infinite; }
@keyframes ac1 { 0% { transform: translate(274px, 262px) } 15% { transform: translate(274px, 262px) } 40% { transform: translate(264px, 262px) } 65% { transform: translate(264px, 262px) } 85% { transform: translate(274px, 262px) } 100% { transform: translate(274px, 262px) } }
.ac1 { animation: ac1 6s ease-in-out infinite; }
@keyframes ac2 { 0% { transform: translate(326px, 262px) } 15% { transform: translate(326px, 262px) } 40% { transform: translate(336px, 262px) } 65% { transform: translate(336px, 262px) } 85% { transform: translate(326px, 262px) } 100% { transform: translate(326px, 262px) } }
.ac2 { animation: ac2 6s ease-in-out infinite; }
@keyframes ac3 { 0% { transform: translate(378px, 262px) } 15% { transform: translate(378px, 262px) } 40% { transform: translate(408px, 262px) } 65% { transform: translate(408px, 262px) } 85% { transform: translate(378px, 262px) } 100% { transform: translate(378px, 262px) } }
.ac3 { animation: ac3 6s ease-in-out infinite; }
@keyframes as0 { 0% { transform: translate(248px, 232px) } 15% { transform: translate(248px, 232px) } 40% { transform: translate(228px, 232px) } 65% { transform: translate(228px, 232px) } 85% { transform: translate(248px, 232px) } 100% { transform: translate(248px, 232px) } }
.as0 { animation: as0 6s ease-in-out infinite, sipky 6s linear infinite; }
@keyframes as1 { 0% { transform: translate(300px, 232px) } 15% { transform: translate(300px, 232px) } 40% { transform: translate(300px, 232px) } 65% { transform: translate(300px, 232px) } 85% { transform: translate(300px, 232px) } 100% { transform: translate(300px, 232px) } }
.as1 { animation: as1 6s ease-in-out infinite, sipky 6s linear infinite; }
@keyframes as2 { 0% { transform: translate(352px, 232px) } 15% { transform: translate(352px, 232px) } 40% { transform: translate(372px, 232px) } 65% { transform: translate(372px, 232px) } 85% { transform: translate(352px, 232px) } 100% { transform: translate(352px, 232px) } }
