<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dva vodiče s volnými elektrony. Nahoře stejnosměrný proud (DC), například z článku nebo akumulátoru: svorky mají stále stejné znaménko a elektrony se pohybují stále stejným směrem. Dole střídavý proud (AC), například ze zásuvky: znaménka svorek + a − se pravidelně střídají a elektrony se pohybují tam a zpět.">
<style>
/* Výklad kap. 6 (PDF lekce 20, str. 8): stejnosměrný proud teče stále stejným směrem (články, akumulátory);
   střídavý proud pravidelně mění směr, mění se polarita zdroje (zásuvka). DC: elektrony plynou ke + (80 px za 2 s, bez švu).
   AC: cyklus 6 s — 0–50 % vlevo −, vpravo +, elektrony jedou doprava; 50–100 % znaménka se vymění, elektrony jedou doleva
   (ease-in-out, v okamžiku výměny stojí). Bez animace = koncový stav: první polovina (vlevo −, vpravo +) a dvojitá šipka. */
.dc { animation: dc 2s linear infinite; }
.ac { animation: ac 6s ease-in-out infinite; }
.pa { animation: pa 6s linear infinite; }
.pb { opacity: 0; animation: pb 6s linear infinite; }
.rm { opacity: 0; }
@keyframes dc { from { transform: translateX(0px); } to { transform: translateX(80px); } }
@keyframes ac { 0%, 100% { transform: translateX(0px); } 50% { transform: translateX(45px); } }
@keyframes pa { 0%, 46% { opacity: 1; } 50%, 96% { opacity: 0; } 100% { opacity: 1; } }
@keyframes pb { 0%, 46% { opacity: 0; } 50%, 96% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .dc, .ac { animation: none; } .pa { animation: none; opacity: 0; } .pb { animation: none; opacity: 0; } .pa.zn { opacity: 1; } .rm { opacity: 1; } }
</style>
