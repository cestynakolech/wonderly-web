<text x="910" y="57" font-size="30" font-weight="bold" fill="#1864ab" text-anchor="end" class="c5" opacity="0">5 °C</text>
<text x="910" y="57" font-size="30" font-weight="bold" fill="#237032" text-anchor="end" class="c25" opacity="0">25 °C</text>
<text x="910" y="57" font-size="30" font-weight="bold" fill="#c92a2a" text-anchor="end" class="c45">45 °C</text>
