<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace ve dvou částech. Dočasná deformace: ruka zmáčkne matraci, matrace se prohne, a když ruka odejde, vrátí se do původního tvaru. Trvalá deformace: ruka zmáčkne kuličku plastelíny na placku, ruka odejde a plastelína zůstane zmáčknutá.">
<style>
/* Předloha: PDF Vzájemné působení těles, síla – oddíl Deformační účinky (dočasná: matrace, trvalá: plastelína). V PDF bez obrázku, nakresleno podle textu. */
/* cyklus 7 s. Matrace: ruka zmáčkne (25–40 %), drží, zvedne se (55–70 %), matrace se vrátí. Plastelína: ruka zmáčkne (25–42 %), zvedne se (55–75 %), plastelína zůstane placatá. Bez animace = stav se zmáčknutím. */
@keyframes r1 { 0%, 10% { transform: translateY(-70px); } 25% { transform: translateY(0px); } 40%, 55% { transform: translateY(18px); } 70% { transform: translateY(0px); } 85%, 100% { transform: translateY(-70px); } }
@keyframes m1 { 0%, 25% { transform: scaleY(1); } 40%, 55% { transform: scaleY(0.9355); } 70%, 100% { transform: scaleY(1); } }
.m1 { transform-origin: 0 0; animation: m1 7s ease-in-out infinite; }
@keyframes m2 { 0%, 25% { transform: scaleY(1); } 40%, 55% { transform: scaleY(0.8387); } 70%, 100% { transform: scaleY(1); } }
.m2 { transform-origin: 0 0; animation: m2 7s ease-in-out infinite; }
@keyframes m3 { 0%, 25% { transform: scaleY(1); } 40%, 55% { transform: scaleY(0.7097); } 70%, 100% { transform: scaleY(1); } }
.m3 { transform-origin: 0 0; animation: m3 7s ease-in-out infinite; }
@keyframes m4 { 0%, 25% { transform: scaleY(1); } 40%, 55% { transform: scaleY(0.7097); } 70%, 100% { transform: scaleY(1); } }
.m4 { transform-origin: 0 0; animation: m4 7s ease-in-out infinite; }
@keyframes m5 { 0%, 25% { transform: scaleY(1); } 40%, 55% { transform: scaleY(0.8387); } 70%, 100% { transform: scaleY(1); } }
.m5 { transform-origin: 0 0; animation: m5 7s ease-in-out infinite; }
@keyframes m6 { 0%, 25% { transform: scaleY(1); } 40%, 55% { transform: scaleY(0.9355); } 70%, 100% { transform: scaleY(1); } }
.m6 { transform-origin: 0 0; animation: m6 7s ease-in-out infinite; }
@keyframes r2 { 0%, 10% { transform: translateY(-80px); } 25% { transform: translateY(0px); } 42%, 55% { transform: translateY(46.4px); } 75%, 100% { transform: translateY(-80px); } }
@keyframes pl { 0%, 25% { transform: scale(1, 1); } 42%, 100% { transform: scale(1.7, 0.42); } }
.r1 { animation: r1 7s ease-in-out infinite; } .r2 { animation: r2 7s ease-in-out infinite; } .pl { transform-origin: 0 0; animation: pl 7s ease-in-out infinite; }
@keyframes sc { 0% { opacity: 0; } 4%, 94% { opacity: 1; } 100% { opacity: 0; } }
.sc { animation: sc 7s linear infinite; }

@media (prefers-reduced-motion: reduce) { .r1, .r2, .pl, .sc, .m1, .m2, .m3, .m4, .m5, .m6 { animation: none; } }
</style>
<defs><marker id="b-cer" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e03131"/></marker><marker id="b-mod" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#1971c2"/></marker><marker id="b-ora" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e8590c"/></marker><marker id="b-sed" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#868e96"/></marker><marker id="m-sed" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#868e96"/></marker><linearGradient id="potah" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7f5ff"/><stop offset="1" stop-color="#a5d8ff"/></linearGradient><linearGradient id="deska" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2ad72"/><stop offset="1" stop-color="#9c6431"/></linearGradient><radialGradient id="plast" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffc078"/><stop offset="0.6" stop-color="#fd7e14"/><stop offset="1" stop-color="#d9480f"/></radialGradient><clipPath id="kp1"><rect x="13" y="98" width="574" height="244"/></clipPath><clipPath id="kp2"><rect x="13" y="396" width="574" height="244"/></clipPath></defs>
<rect x="3" y="3" width="594" height="654" rx="14" fill="#f8f9fa"/>
