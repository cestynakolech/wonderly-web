eight="bold">Vznětový</tspan> (Dieselův) — nafta</text><text x="34" y="2818" font-size="21" fill="#2b2a26">Svíčku nepotřebuje: stlačený</text><text x="34" y="2848" font-size="21" fill="#2b2a26">vzduch se zahřeje a nafta</text><text x="34" y="2878" font-size="21" fill="#2b2a26">se v něm sama vznítí.</text><text x="34" y="2908" font-size="21" fill="#2b2a26">Účinnost 30 až 40 %.</text><rect x="34" y="2938" width="392" height="200" rx="10" fill="#fff" stroke="#2b2a26" stroke-width="2"/><text x="48" y="2970" font-size="21" fill="#2b2a26">Benzín 25 000 kJ, účinnost 20 %:</text><rect x="48" y="2982" width="73" height="24" rx="3" fill="#2b7a3e"/><rect x="121" y="2982" width="291" height="24" rx="3" fill="#e8590c"/><text x="48" y="3032" font-size="21" fill="#2b2a26"><tspan font-weight="bold">5 000 kJ</tspan> <tspan font-weight="bold" fill="#2b7a3e">pohyb</tspan>, 20 000 kJ <tspan font-weight="bold" fill="#b54708">teplo</tspan></text><text x="48" y="3070" font-size="21" fill="#2b2a26">Nafta 15 000 kJ, účinnost 40 %:</text><rect x="48" y="3082" width="87" height="24" rx="3" fill="#2b7a3e"/><rect x="135" y="3082" width="131" height="24" rx="3" fill="#e8590c"/><text x="48" y="3130" font-size="21" fill="#2b2a26"><tspan font-weight="bold">6 000 kJ</tspan> <tspan font-weight="bold" fill="#2b7a3e">pohyb</tspan>, zbytek <tspan font-weight="bold" fill="#b54708">teplo</tspan></text></g>
