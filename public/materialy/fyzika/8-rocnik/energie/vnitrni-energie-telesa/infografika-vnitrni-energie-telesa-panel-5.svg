<svg viewBox="0 1994 460 536" width="460" height="536" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jak ji zvýšíme: zahřátím (částice se pohybují rychleji), přidáním částic (dofouknutím pneumatiky), konáním práce (třením, stlačením nebo natažením) a přijetím tepelné energie od tělesa s vyšší teplotou." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Vnitřní energie tělesa 5/7: Jak ji zvýšíme</title>
	<!-- Panel 5/7 výřezu z infografika-vnitrni-energie-telesa.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.pumpa { animation: pumpa 1.6s ease-in-out infinite; }
		.ruka { animation: ruka 0.8s ease-in-out infinite; }
		.horko { animation: horko 0.8s ease-in-out infinite; }
		.tok { animation: tok 1.5s linear infinite; }
		@keyframes pumpa { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
		@keyframes ruka { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(6px); } 75% { transform: translateX(-6px); } }
		@keyframes horko { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
		@keyframes tok { 0% { transform: translateX(-12px); opacity: 0.3; } 60%, 100% { transform: translateX(0); opacity: 1; } }
		@media (prefers-reduced-motion: reduce) {
			.pumpa, .ruka, .horko, .tok { animation: none; }
		}
	</style>
	<defs>
