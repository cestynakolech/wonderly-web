<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: k atomu dusíku se 7 protony a 7 elektrony přiletí zvenku jeden elektron navíc a usadí se v obalu. Atom má 7 protonů a 8 elektronů, záporný náboj převažuje a atom se stane záporným iontem. Jádro se nemění.">
<style>
/* Předloha: PDF Elektrické vlastnosti látek, obrázek Záporný iont – 7 protonů (+), 8 elektronů (-), celkový náboj atomu záporný (-); žlutá šipka ukazuje přijatý elektron. Animace 9 s: elektron přiletí zvenku do obalu, potom se objeví modrý znak −. Bez animace = koncový stav (8 elektronů, znak − vidět). Jádro beze změny (záporný iont nevzniká odtržením protonů). */
@keyframes mv { 0% { transform: translate(-193.4px, 115.6px); opacity: 0; } 6%, 22% { transform: translate(-193.4px, 115.6px); opacity: 1; } 50%, 93% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(0, 0); opacity: 0; } }
@keyframes sip { 0%, 20% { opacity: 0; } 26%, 50% { opacity: 1; } 58%, 100% { opacity: 0.35; } }
@keyframes zn { 0%, 52% { opacity: 0; } 60%, 94% { opacity: 1; } 100% { opacity: 0; } }
.mv { animation: mv 9s ease-in-out infinite; } .sip { animation: sip 9s linear infinite; } .zn { animation: zn 9s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
