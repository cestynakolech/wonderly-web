<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1050" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Skutečný obraz spojky ve třech případech. Z vrcholu stromu vedou tři význačné paprsky: rovnoběžný s osou se láme do ohniska F´, středový prochází středem čočky beze změny směru a ohniskový jde ohniskem F a za čočkou pokračuje rovnoběžně s osou. Kde se protnou, je vrchol obrazu. 1) Předmět dál než 2f: obraz skutečný, převrácený, zmenšený. 2) Předmět přesně ve 2f: obraz skutečný, převrácený, stejně velký. 3) Předmět mezi f a 2f: obraz skutečný, převrácený, zvětšený. Animace: paprsky se postupně nakreslí a v místě jejich průsečíku se objeví převrácený obraz.">
<style>
/* Animace 9 s, smyčka. Předloha: PDF lekce 25, str. 11 (předmět dál než 2f) a str. 12 (mezi f a 2f);
   případ „přesně ve 2f“ je jen ve výkladu (PDF ho nemá), kreslen stejně.
   Geometrie: f = 80 px, čočka x = 300; a = 240/160/120 → b = 120/160/240, výška obrazu 30/50/90 (1/f = 1/a + 1/b).
   paprsky 5–40 %, šipky 40–45 %, obraz 45–58 %, vše zmizí 92–98 %. Bez animace = koncový stav (vše vidět). */
.pr { stroke-dasharray: 100 100; animation: pr 9s linear infinite; }
.si { animation: si 9s linear infinite; }
.ob { animation: ob 9s linear infinite; }
.celek { animation: celek 9s linear infinite; }
@keyframes pr { 0%, 5% { stroke-dashoffset: 100; } 40%, 100% { stroke-dashoffset: 0; } }
@keyframes si { 0%, 40% { opacity: 0; } 45%, 100% { opacity: 1; } }
@keyframes ob { 0%, 45% { opacity: 0; } 58%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pr, .si, .ob, .celek { animation: none; } }
</style>
