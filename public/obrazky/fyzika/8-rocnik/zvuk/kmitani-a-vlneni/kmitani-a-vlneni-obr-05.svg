<text x="150" y="311" font-size="20" fill="#212529">částice kmitá tam a zpět</text>
<path d="M520 304H760" stroke="#1864ab" stroke-width="5"/><path d="M756 292L780 304L756 316Z" fill="#1864ab"/>
<text x="650" y="338" font-size="20" fill="#212529" text-anchor="middle">směr šíření vlnění</text>
<rect x="60" y="364" width="780" height="92" rx="12" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/>
<text x="450" y="394" font-size="22" fill="#212529" text-anchor="middle">Částice kmitají <tspan font-weight="bold">ve směru</tspan> šíření vlnění.</text>
<text x="450" y="421" font-size="22" fill="#212529" text-anchor="middle">Vzniká nahuštěním a zředěním částic. Příklad: zvuk.</text>
<text x="450" y="448" font-size="22" fill="#212529" text-anchor="middle">Podélné vlnění existuje ve všech skupenstvích.</text>
</svg>
