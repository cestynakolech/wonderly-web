	<circle cx="340" cy="460" r="48" fill="#2b2a26"/><circle cx="340" cy="460" r="30" fill="#adb5bd" stroke="#495057" stroke-width="3"/><circle cx="340" cy="460" r="7" fill="#495057"/>
	<rect x="276" y="436" width="28" height="22" rx="3" fill="#f6c453" stroke="#2b2a26" stroke-width="2.5"/>
