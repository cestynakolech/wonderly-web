<g font-size="20" font-weight="bold" text-anchor="middle" fill="#0b7285"><text x="-180" y="98">nahuštění</text><text x="60" y="98">nahuštění</text><text x="300" y="98">nahuštění</text><text x="540" y="98">nahuštění</text><text x="780" y="98">nahuštění</text></g>
<g font-size="20" text-anchor="middle" fill="#212529"><text x="-60" y="98">zředění</text><text x="180" y="98">zředění</text><text x="420" y="98">zředění</text><text x="660" y="98">zředění</text></g>
</g></g>
<rect x="40" y="70" width="90" height="38" fill="url(#zl)"/><rect x="790" y="70" width="90" height="38" fill="url(#zp)"/>
