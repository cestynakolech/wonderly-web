<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 544" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Hodina má 3 600 s, kilometr 1 000 m, proto 1 m/s = 3,6 km/h">
<defs>
<marker id="s-mod" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#1971c2"/></marker>
<marker id="s-cer" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#e03131"/></marker>
<marker id="s-zel" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#2f9e44"/></marker>
<marker id="s-ora" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#e8590c"/></marker>
<marker id="s-sed" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#495057"/></marker>
</defs>
<rect x="3" y="3" width="894" height="538" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<rect x="24" y="20" width="852" height="52" rx="12" fill="#fff5f5" stroke="#e03131" stroke-width="2.5"/>
<text x="450" y="54" font-size="20" font-weight="bold" fill="#e03131" text-anchor="middle">Pozor! Při převodu m/s a km/h se desetinná čárka neposouvá.</text>
<text x="24" y="112" font-size="26" font-weight="bold" fill="#2b2a26" text-anchor="start">Odkud se bere číslo 3,6?</text>
<rect x="24" y="136" width="400" height="64" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="2.5"/>
<text x="44" y="176" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="start">Dráha:</text>
<text x="140" y="176" font-size="24" font-weight="bold" fill="#2b2a26" text-anchor="start">1 km = 1 000 m</text>
<rect x="24" y="216" width="400" height="64" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5"/>
<text x="44" y="256" font-size="20" font-weight="bold" fill="#1971c2" text-anchor="start">Čas:</text>
<text x="140" y="256" font-size="24" font-weight="bold" fill="#2b2a26" text-anchor="start">1 h = 3 600 s</text>
<path d="M424,168 C470,168 470,200 506,208" fill="none" stroke="#e8590c" stroke-width="4" marker-end="url(#s-ora)"/><path d="M424,248 C470,248 470,222 506,216" fill="none" stroke="#1971c2" stroke-width="4" marker-end="url(#s-mod)"/>
<circle cx="610" cy="212" r="92" fill="#ffffff" stroke="#2b2a26" stroke-width="3"/><text x="610" y="204" font-size="24" font-weight="bold" fill="#2b2a26" text-anchor="middle">3 600 : 1 000</text>
<text x="610" y="244" font-size="30" font-weight="bold" fill="#e03131" text-anchor="middle">= 3,6</text>
<text x="24" y="330" font-size="20" font-weight="bold" fill="#2b2a26" text-anchor="start">Proč? Těleso jede rychlostí 1 m/s:</text>
<text x="44" y="364" font-size="20" fill="#2b2a26" text-anchor="start">za 1 s urazí 1 m, za 1 h (3 600 s) urazí 3 600 m = 3,6 km</text>
<text x="44" y="398" font-size="20" fill="#2b2a26" text-anchor="start">proto</text>
<text x="110" y="398" font-size="22" font-weight="bold" fill="#e03131" text-anchor="start">1 m/s = 3,6 km/h</text>
<rect x="24" y="424" width="420" height="96" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2.5"/>
<text x="40" y="458" font-size="20" font-weight="bold" fill="#2f9e44" text-anchor="start">m/s → km/h: násobíme 3,6</text>
<text x="40" y="494" font-size="20" fill="#2b2a26" text-anchor="start">Příklad: 10 m/s = 36 km/h</text>
<rect x="456" y="424" width="420" height="96" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="2.5"/>
<text x="472" y="458" font-size="20" font-weight="bold" fill="#7048e8" text-anchor="start">km/h → m/s: dělíme 3,6</text>
<text x="472" y="494" font-size="20" fill="#2b2a26" text-anchor="start">Příklad: 36 km/h = 10 m/s</text>
</svg>
