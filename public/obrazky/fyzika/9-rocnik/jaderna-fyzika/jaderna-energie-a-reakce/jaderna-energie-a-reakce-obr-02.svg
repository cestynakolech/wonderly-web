<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Štěpení jádra uranu 235. Neutron zleva narazí do velkého jádra uranu 235. Jádro se rozdělí na dvě lehčí jádra, baryum a krypton, vyletí tři další neutrony a uvolní se energie, znázorněná žlutou hvězdou. Červená kulička je proton, šedá neutron; těžká jádra jsou nakreslena zjednodušeně, ne kulička po kuličce.">
<style>
/* Předloha: PDF 19 Jaderná energie, s. 6 (obrázek: neutron → U 235 → Ba + Kr + 3 neutrony, hvězda energie) a s. 5 (rovnice).
   Výklad: § Štěpení jádra uranu. Těžká jádra jsou schematická (40/24/17 kuliček, ne 235/140/93 nukleonů); hvězda = energie (v předloze „200 MeV“ – ve výkladu není, proto jen slovo).
   Smyčka 6 s: neutron doletí, jádro se protáhne a rozpadne, lehčí jádra a 3 neutrony se rozletí. Bez animace = celé schéma jako v předloze. */
.s2n { animation: s2n 6s linear infinite; } .s2u { transform-box: view-box; transform-origin: 220px 260px; animation: s2u 6s ease-in-out infinite; }
.s2z { transform-box: view-box; transform-origin: 335px 260px; animation: s2z 6s ease-out infinite; }
.s2ba { animation: s2ba 6s ease-out infinite; } .s2kr { animation: s2kr 6s ease-out infinite; }
.s2v0 { animation: s2v0 6s ease-out infinite; } .s2v1 { animation: s2v1 6s ease-out infinite; } .s2v2 { animation: s2v2 6s ease-out infinite; }
@keyframes s2n { 0% { transform: translate(0px, 0px); opacity: 1; } 30% { transform: translate(108px, 0px); opacity: 1; } 32%, 100% { transform: translate(108px, 0px); opacity: 0; } }
@keyframes s2u { 0%, 26% { transform: scale(1, 1); opacity: 1; } 31% { transform: scale(1.14, .88); opacity: 1; } 34%, 96% { transform: scale(1.14, .88); opacity: 0; } 100% { transform: scale(1, 1); opacity: 1; } }
@keyframes s2z { 0%, 32% { transform: scale(.2); opacity: 0; } 38% { transform: scale(1.12); opacity: 1; } 45% { transform: scale(1); opacity: 1; } 92% { transform: scale(1); opacity: 1; } 97%, 100% { transform: scale(1); opacity: 0; } }
@keyframes s2ba { 0%, 33% { transform: translate(-220px, 110px); opacity: 0; } 35% { opacity: 1; } 60% { transform: translate(0px, 0px); opacity: 1; } 92% { transform: translate(0px, 0px); opacity: 1; } 97%, 100% { transform: translate(0px, 0px); opacity: 0; } }
@keyframes s2kr { 0%, 33% { transform: translate(-220px, -135px); opacity: 0; } 35% { opacity: 1; } 60% { transform: translate(0px, 0px); opacity: 1; } 92% { transform: translate(0px, 0px); opacity: 1; } 97%, 100% { transform: translate(0px, 0px); opacity: 0; } }
@keyframes s2v0 { 0%, 33% { transform: translate(-340px, 45px); opacity: 0; } 35% { opacity: 1; } 60% { transform: translate(0px, 0px); opacity: 1; } 92% { transform: translate(0px, 0px); opacity: 1; } 97%, 100% { transform: translate(0px, 0px); opacity: 0; } }
@keyframes s2v1 { 0%, 33% { transform: translate(-365px, -2px); opacity: 0; } 35% { opacity: 1; } 60% { transform: translate(0px, 0px); opacity: 1; } 92% { transform: translate(0px, 0px); opacity: 1; } 97%, 100% { transform: translate(0px, 0px); opacity: 0; } }
@keyframes s2v2 { 0%, 33% { transform: translate(-340px, -50px); opacity: 0; } 35% { opacity: 1; } 60% { transform: translate(0px, 0px); opacity: 1; } 92% { transform: translate(0px, 0px); opacity: 1; } 97%, 100% { transform: translate(0px, 0px); opacity: 0; } }
.s2ul { animation: s2ul 6s linear infinite; } .s2vl { animation: s2vl 6s linear infinite; }
@keyframes s2ul { 0%, 31% { opacity: 1; } 34%, 96% { opacity: 0; } 100% { opacity: 1; } }
@keyframes s2vl { 0%, 50% { opacity: 0; } 56%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .s2n, .s2u, .s2z, .s2ba, .s2kr, .s2ul, .s2vl, .s2v0, .s2v1, .s2v2 { animation: none; } }
</style>
