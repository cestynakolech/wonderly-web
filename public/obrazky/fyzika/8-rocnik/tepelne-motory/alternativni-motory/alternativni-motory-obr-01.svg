<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Řez Wankelovým motorem: oválná komora, uvnitř trojúhelníkový rotor, jehož tři vrcholy se dotýkají stěny a vytvářejí tři komory (světle modrá sání, tmavě modrá stlačení, červená výbuch a rozpínání); vpravo dole u komory se stlačenou směsí a výbuchem dvě zapalovací svíčky, vlevo modrý sací kanál, vpravo nahoře hnědý výfukový kanál; dvě popisky vysvětlují otáčivý rotor a čtyři doby: sání, stlačení, výbuch a výfuk.">
