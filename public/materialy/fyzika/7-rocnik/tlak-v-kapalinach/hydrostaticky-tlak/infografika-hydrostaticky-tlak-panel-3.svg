		.p3-wc { animation: p3-wc 7s ease-in-out infinite; }
		@keyframes p3-wc { 0% { transform: translateY(160px) } 8% { transform: translateY(160px) } 38% { transform: translateY(0) } 84% { transform: translateY(0) } 97% { transform: translateY(160px) } 100% { transform: translateY(160px) } }
		.p3-lc { animation: p3-lc 7s linear infinite; }
		@keyframes p3-lc { 0% { opacity: 0 } 40% { opacity: 0 } 47% { opacity: 1 } 82% { opacity: 1 } 86% { opacity: 0 } 100% { opacity: 0 } }
		.p3-hl { animation: p3-hl 7s linear infinite; }
