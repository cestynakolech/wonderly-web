<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Graf závislosti proudu I v miliampérech na napětí U ve voltech od 0 do 10 V. Obě přímky vycházejí z počátku. Oranžová přímka se čtverečky (1. vodič) stoupá strměji: při 10 V prochází proud 200 mA. Zelená přímka s kroužky (2. vodič) je méně strmá: při 10 V jen 50 mA. Bubliny: 1. vodič má větší proud a menší odpor, R₁ = 10 000 mV : 200 mA = 50 Ω; 2. vodič má menší proud a větší odpor, R₂ = 10 000 mV : 50 mA = 200 Ω. Animace: přímky se kreslí od 0 do 10 V po jednotlivých bodech, pak se objeví odečet při 10 V a výpočty.">
<style>
/* Předloha: PDF Ohmův zákon, s. 5 (graf závislosti proudu I (mA) na napětí U (V), 0–10 V, 0–220 mA; dvě přímky z počátku:
   vodič s 200 mA při 10 V a vodič s 50 mA při 10 V; bubliny s výpočtem odporu 50 Ω a 200 Ω).
   Body: vodič 1 I = 20 · U (mA), vodič 2 I = 5 · U (mA), U = 0…10 V po 1 V – vše celá čísla.
   12 s: 4–54 % se obě přímky kreslí od 0 V do 10 V (bod pro U = k se objeví v čase 4 + 5k %); 58–60 % objeví se odečet při 10 V a bubliny s výpočtem;
   92–94 % vše zmizí, smyčka. Bez animace (reduced-motion) = celý graf včetně výpočtů. */
.ln { animation: ln 12s linear infinite; }
@keyframes ln { 0%, 4% { stroke-dashoffset: 100; opacity: 1; } 54%, 92% { stroke-dashoffset: 0; opacity: 1; } 94% { stroke-dashoffset: 0; opacity: 0; } 95%, 100% { stroke-dashoffset: 100; opacity: 0; } }
.vy { animation: vy 12s linear infinite; }
@keyframes vy { 0%, 58% { opacity: 0; } 60%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.b0 { animation: b0 12s linear infinite; }
@keyframes b0 { 0%, 3.5% { opacity: 0; } 4%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.b1 { animation: b1 12s linear infinite; }
@keyframes b1 { 0%, 8.5% { opacity: 0; } 9%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.b2 { animation: b2 12s linear infinite; }
@keyframes b2 { 0%, 13.5% { opacity: 0; } 14%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.b3 { animation: b3 12s linear infinite; }
@keyframes b3 { 0%, 18.5% { opacity: 0; } 19%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.b4 { animation: b4 12s linear infinite; }
@keyframes b4 { 0%, 23.5% { opacity: 0; } 24%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.b5 { animation: b5 12s linear infinite; }
@keyframes b5 { 0%, 28.5% { opacity: 0; } 29%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.b6 { animation: b6 12s linear infinite; }
@keyframes b6 { 0%, 33.5% { opacity: 0; } 34%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.b7 { animation: b7 12s linear infinite; }
@keyframes b7 { 0%, 38.5% { opacity: 0; } 39%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.b8 { animation: b8 12s linear infinite; }
@keyframes b8 { 0%, 43.5% { opacity: 0; } 44%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.b9 { animation: b9 12s linear infinite; }
@keyframes b9 { 0%, 48.5% { opacity: 0; } 49%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.b10 { animation: b10 12s linear infinite; }
@keyframes b10 { 0%, 53.5% { opacity: 0; } 54%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ln, .vy, .b0, .b1, .b2, .b3, .b4, .b5, .b6, .b7, .b8, .b9, .b10 { animation: none; } }
</style>
