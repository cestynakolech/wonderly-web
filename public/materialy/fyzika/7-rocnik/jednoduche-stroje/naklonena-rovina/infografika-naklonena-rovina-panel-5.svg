<svg viewBox="0 2236 460 580" width="460" height="580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zlaté pravidlo mechaniky: kolikrát si usnadníme sílu, tolikrát delší dráhu urazíme; příklad G = 800 N, h = 2 m, F = 200 N; sloupce: síla svisle 800 N, po rampě 200 N; dráha svisle 2 m, po rampě 8 m; l = G · h : F = 800 · 2 : 200 = 8 m; síla čtyřikrát menší, dráha čtyřikrát delší; práci nám rampa neušetří" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Nakloněná rovina 5/6: Zlaté pravidlo mechaniky</title>
	<defs><clipPath id="ok5"><rect x="30" y="2438" width="400" height="232" rx="8"/></clipPath></defs>
	<rect x="0" y="2236" width="460" height="580" fill="#f8f9fa"/>
	<g id="panel-5"><rect x="26" y="2252" width="420" height="560" rx="12" fill="#dee2e6"/><rect x="20" y="2246" width="420" height="560" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="2280" r="17" fill="#2b2a26"/><text x="52" y="2288" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">5</text><text x="80" y="2289" font-size="25" font-weight="bold" fill="#2b2a26">Zlaté pravidlo mechaniky</text><text x="34" y="2328" font-size="21" font-weight="bold" fill="#2b2a26">Kolikrát si usnadníme sílu,</text><text x="34" y="2356" font-size="21" font-weight="bold" fill="#2b2a26">tolikrát delší dráhu urazíme.</text><text x="34" y="2392" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Příklad:</tspan> <tspan font-style="italic">G</tspan> = 800 N, <tspan font-style="italic">h</tspan> = 2 m,</text><text x="34" y="2420" font-size="21" fill="#2b2a26"><tspan font-style="italic">F</tspan> = 200 N</text><rect x="30" y="2438" width="400" height="232" rx="8" fill="#ffffff"/><text x="42" y="2470" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Síla</tspan></text><text x="42" y="2504" font-size="21" fill="#2b2a26">svisle</text><rect x="150" y="2482" width="260" height="30" rx="5" fill="#c92a2a"/><text x="400" y="2504" font-size="21" font-weight="bold" text-anchor="end" fill="#fff">800 N</text><text x="42" y="2542" font-size="21" fill="#2b2a26">po rampě</text><rect x="150" y="2520" width="65" height="30" rx="5" fill="#c92a2a"/><text x="225" y="2542" font-size="21" font-weight="bold" fill="#2b2a26">200 N</text><text x="42" y="2586" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Dráha</tspan></text><text x="42" y="2620" font-size="21" fill="#2b2a26">svisle</text><rect x="150" y="2598" width="65" height="30" rx="5" fill="#495057"/><text x="225" y="2620" font-size="21" font-weight="bold" fill="#2b2a26">2 m</text><text x="42" y="2658" font-size="21" fill="#2b2a26">po rampě</text><rect x="150" y="2636" width="260" height="30" rx="5" fill="#495057"/><text x="400" y="2658" font-size="21" font-weight="bold" text-anchor="end" fill="#fff">8 m</text><rect x="30" y="2438" width="400" height="232" rx="8" fill="none" stroke="#ced4da" stroke-width="2"/><text x="34" y="2706" font-size="21" fill="#2b2a26"><tspan font-style="italic">l</tspan> = <tspan font-style="italic">G</tspan> · <tspan font-style="italic">h</tspan> : <tspan font-style="italic">F</tspan></text><text x="34" y="2734" font-size="21" fill="#2b2a26"><tspan font-style="italic">l</tspan> = 800 · 2 : 200 = <tspan font-weight="bold">8 m</tspan></text><text x="34" y="2764" font-size="21" fill="#2b2a26">Síla 4× menší, dráha 4× delší.</text><text x="34" y="2792" font-size="21" fill="#495057">Práci nám rampa neušetří.</text></g>
</svg>
