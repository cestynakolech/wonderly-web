<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Řez vodním tlakovým reaktorem uvnitř kontejnmentu z oceli a betonu. Dole v tlakové nádobě je aktivní zóna se žlutými palivovými tyčemi z uranu 235, mezi ně shora zajíždějí tmavé regulační tyče, fialová havarijní tyč čeká nad palivem. Studená voda přitéká zleva, proudí dolů podél stěn, zespodu stoupá kolem paliva, ohřeje se a odtéká vpravo. Voda je chladivo i moderátor, má asi 300 °C a tlak asi 16 MPa. Animace: voda obíhá a aktivní zóna žhne.">
<style>
.tok { stroke-dasharray: 10 14; animation: tok 1.2s linear infinite; }
@keyframes tok { to { stroke-dashoffset: -24; } }
.para { stroke-dasharray: 1 9; animation: para 0.8s linear infinite; }
@keyframes para { to { stroke-dashoffset: -10; } }
.zhav { animation: zhav 3s ease-in-out infinite; }
@keyframes zhav { 0%, 100% { opacity: 0.18; } 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .tok, .zhav { animation: none; } }
/* Předloha: PDF 20 Jaderný reaktor, s. 2 – řez vodním tlakovým reaktorem: regulační a bezpečnostní tyče nahoře,
   palivo dole, chladivo, šipka vstupu studené (modrá) a výstupu ohřáté vody (červená), zakřivené šipky oběhu.
   Kontejnment podle s. 9 (šedá kupole) a výkladu. Čísla 235, 300 °C, 16 MPa z výkladu.
   Animace: voda obíhá (čárky se posouvají, 1,2 s), aktivní zóna žhne (3 s). Bez animace = klidný řez. */
</style>
