<svg viewBox="0 0 460 610" width="460" height="610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dvě stejné žárovky, jednu napájí tužková baterie, druhou buřtová. Obě mají napětí 1,5 V, proto žárovky svítí stejně. Zásoba energie tužkové baterie dojde dřív a její žárovka zhasne, buřtová svítí déle. Napětí článku nezávisí na jeho velikosti, větší článek jen vydrží déle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
