<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 690" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Ocelový klín zaražený ostřím do stojícího dřevěného špalku. Kladivo dvakrát udeří shora do hřbetu klínu, klín pokaždé zajede hlouběji a špalek se rozevírá. Červené šipky ukazují úder shora a dvě síly, kterými šikmé plochy klínu tlačí dřevo do stran.">
<style>
/* Cyklus 7 s: dva údery kladiva (v 0,84 s a 2,94 s). Klín po každém úderu zajede o 50 dílků hlouběji
   (hloubka 20 → 70 → 120), poloviny špalku se rozevřou přesně o šířku klínu v rovině čela špalku
   (úhel = arctg(šířka : 520)). Bez animace (prefers-reduced-motion) zůstane koncový stav. */
.kW { animation: kW-k 7s linear infinite; }
@keyframes kW-k { 0%, 12% { transform: translate(0px, -100px); } 16%, 42% { transform: translate(0px, -50px); } 46%, 100% { transform: translate(0px, 0px); } }
.kR { transform-box: view-box; transform-origin: 715px 267px; transform: rotate(0deg); animation: kR-k 7s ease-in infinite; }
@keyframes kR-k { 0% { transform: rotate(25deg); } 12%, 16% { transform: rotate(0deg); } 30% { transform: rotate(25deg); } 42%, 100% { transform: rotate(0deg); } }
.kL { transform-box: view-box; transform-origin: 480px 590px; transform: rotate(-4.399deg); animation: kL-k 7s linear infinite; }
@keyframes kL-k { 0%, 12% { transform: rotate(-0.735deg); } 16%, 42% { transform: rotate(-2.569deg); } 46%, 100% { transform: rotate(-4.399deg); } }
.kP { transform-box: view-box; transform-origin: 480px 590px; transform: rotate(4.399deg); animation: kP-k 7s linear infinite; }
@keyframes kP-k { 0%, 12% { transform: rotate(0.735deg); } 16%, 42% { transform: rotate(2.569deg); } 46%, 100% { transform: rotate(4.399deg); } }
.kU { animation: kU-k 7s linear infinite; }
@keyframes kU-k { 0%, 9% { opacity: 0; } 11%, 17% { opacity: 1; } 20%, 39% { opacity: 0; } 41%, 100% { opacity: 1; } }
.kS { animation: kS-k 7s linear infinite; }
@keyframes kS-k { 0%, 12% { opacity: 0; } 14%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .kW, .kR, .kL, .kP, .kU, .kS { animation: none; } }
</style>
<defs>
<marker id="b-cer" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e03131"/></marker>
<linearGradient id="k-kura" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="630" y2="0"><stop offset="0" stop-color="#5c3a1e"/><stop offset="0.35" stop-color="#8b5a2b"/><stop offset="0.65" stop-color="#8b5a2b"/><stop offset="1" stop-color="#5c3a1e"/></linearGradient>
<linearGradient id="k-ocel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#868e96"/><stop offset="0.45" stop-color="#f1f3f5"/><stop offset="1" stop-color="#6c757d"/></linearGradient>
<linearGradient id="k-hlava" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#adb5bd"/><stop offset="0.4" stop-color="#e9ecef"/><stop offset="1" stop-color="#6c757d"/></linearGradient>
<linearGradient id="k-nasada" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c08a52"/><stop offset="1" stop-color="#7a4a1e"/></linearGradient>
</defs>
<rect x="3" y="3" width="954" height="684" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="30" y="46" font-size="28" font-weight="bold" fill="#2b2a26">Klín rozráží špalek</text>

<!-- tmavá štěrbina mezi polovinami špalku (vidět, až se rozevřou) -->
<polygon points="440,330 520,330 480,590" fill="#3b2a1a"/>

<!-- levá polovina špalku -->
<g class="kL">
<rect x="330" y="330" width="150" height="260" fill="url(#k-kura)" stroke="#4a2f17" stroke-width="3"/>
<path d="M352,346 q6,60 0,120 q-6,60 0,120 M384,348 q-5,70 0,130 q5,55 0,108 M418,348 q6,50 0,110 q-6,70 0,128 M452,348 q-4,80 0,140 q4,50 0,98" fill="none" stroke="#4a2f17" stroke-width="2.5" opacity="0.7"/>
<path d="M330,330 A150,16 0 0 1 480,314 L480,346 A150,16 0 0 1 330,330 Z" fill="#f0d6a8" stroke="#8b5a2b" stroke-width="3"/>
<path d="M380,330 A100,10.67 0 0 1 480,319.33 M380,330 A100,10.67 0 0 0 480,340.67 M430,330 A50,5.33 0 0 1 480,324.67 M430,330 A50,5.33 0 0 0 480,335.33" fill="none" stroke="#c9a26b" stroke-width="2"/>
</g>
<!-- pravá polovina špalku -->
<g class="kP">
<rect x="480" y="330" width="150" height="260" fill="url(#k-kura)" stroke="#4a2f17" stroke-width="3"/>
<path d="M508,348 q5,60 0,120 q-5,60 0,120 M542,348 q-6,70 0,130 q6,55 0,108 M576,348 q5,50 0,110 q-5,70 0,128 M608,346 q-4,80 0,140 q4,50 0,98" fill="none" stroke="#4a2f17" stroke-width="2.5" opacity="0.7"/>
<path d="M630,330 A150,16 0 0 0 480,314 L480,346 A150,16 0 0 0 630,330 Z" fill="#f0d6a8" stroke="#8b5a2b" stroke-width="3"/>
<path d="M580,330 A100,10.67 0 0 0 480,319.33 M580,330 A100,10.67 0 0 1 480,340.67 M530,330 A50,5.33 0 0 0 480,324.67 M530,330 A50,5.33 0 0 1 480,335.33" fill="none" stroke="#c9a26b" stroke-width="2"/>
</g>

<!-- zem (zakrývá spodní hranu pootočených polovin) -->
<rect x="6" y="590" width="948" height="32" fill="#d8c3a5"/>
<line x1="6" y1="590" x2="954" y2="590" stroke="#5c4a32" stroke-width="4"/>

<!-- klín: délka 150, hřbet 50 (poměr 3); v koncovém stavu ostří 120 pod čelem špalku -->
<g class="kW">
<g transform="translate(480 450)">
<polygon points="0,0 -25,-150 25,-150" fill="url(#k-ocel)" stroke="#343a40" stroke-width="3" stroke-linejoin="round"/>
<polygon points="0,0 -6,-36 6,-36" fill="#f8f9fa" opacity="0.8"/>
<rect x="-29" y="-158" width="58" height="11" rx="4" fill="#868e96" stroke="#343a40" stroke-width="3"/>
<text x="-52" y="-142" font-size="24" font-weight="bold" fill="#2b2a26" text-anchor="end" stroke="#f8f9fa" stroke-width="6" paint-order="stroke">hřbet</text>
<line x1="4" y1="2" x2="168" y2="34" stroke="#f8f9fa" stroke-width="7" stroke-linecap="round"/>
<line x1="4" y1="2" x2="168" y2="34" stroke="#2b2a26" stroke-width="3" stroke-linecap="round"/>
<text x="176" y="44" font-size="24" font-weight="bold" fill="#2b2a26" stroke="#f8f9fa" stroke-width="6" paint-order="stroke">ostří</text>
<g class="kS">
<line x1="-14" y1="-61" x2="-140" y2="-40" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
<line x1="-14" y1="-61" x2="-140" y2="-40" stroke="#e03131" stroke-width="7" marker-end="url(#b-cer)" stroke-linecap="round"/>
<line x1="14" y1="-61" x2="140" y2="-40" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
<line x1="14" y1="-61" x2="140" y2="-40" stroke="#e03131" stroke-width="7" marker-end="url(#b-cer)" stroke-linecap="round"/>
<text x="-176" y="-42" font-size="24" font-weight="bold" fill="#c92a2a" text-anchor="end" stroke="#f8f9fa" stroke-width="6" paint-order="stroke">síla do strany</text>
<text x="176" y="-42" font-size="24" font-weight="bold" fill="#c92a2a" stroke="#f8f9fa" stroke-width="6" paint-order="stroke">síla do strany</text>
</g>
</g>
</g>

<!-- kladivo: v koncovém stavu leží na hřbetu klínu; otáčí se kolem ruky -->
<g class="kW">
<g class="kR">
<rect x="526" y="260" width="200" height="14" rx="6" fill="url(#k-nasada)" stroke="#5c3a1e" stroke-width="2"/>
<rect x="430" y="242" width="100" height="50" rx="7" fill="url(#k-hlava)" stroke="#343a40" stroke-width="3"/>
<rect x="430" y="242" width="100" height="9" rx="4" fill="#868e96"/>
<rect x="430" y="283" width="100" height="9" rx="4" fill="#868e96"/>
<rect x="702" y="247" width="26" height="40" rx="10" fill="#f1c9a5" stroke="#a9744f" stroke-width="2.5"/>
<line x1="706" y1="257" x2="724" y2="257" stroke="#a9744f" stroke-width="1.8" stroke-linecap="round"/>
<line x1="706" y1="267" x2="724" y2="267" stroke="#a9744f" stroke-width="1.8" stroke-linecap="round"/>
<line x1="706" y1="277" x2="724" y2="277" stroke="#a9744f" stroke-width="1.8" stroke-linecap="round"/>
</g>
<g class="kU">
<line x1="480" y1="150" x2="480" y2="232" stroke="#e03131" stroke-width="7" marker-end="url(#b-cer)" stroke-linecap="round"/>
<text x="400" y="196" font-size="24" font-weight="bold" fill="#c92a2a" text-anchor="end" stroke="#f8f9fa" stroke-width="6" paint-order="stroke">úder shora</text>
</g>
</g>

<rect x="60" y="632" width="840" height="46" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
<text x="480" y="663" font-size="22" font-weight="bold" fill="#2b2a26" text-anchor="middle">Klín mění úder shora na dvě síly do stran – ty dřevo rozevírají a štípou.</text>
</svg>
