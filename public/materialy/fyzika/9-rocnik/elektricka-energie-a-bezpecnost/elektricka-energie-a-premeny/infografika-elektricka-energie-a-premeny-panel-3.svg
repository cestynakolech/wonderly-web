<svg viewBox="0 0 460 610" width="460" height="610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nad rámec RVP, opakování z 8. ročníku. Trouba s příkonem 2 kW je připojená přes elektroměr. Po zapnutí trouba peče, kotouč elektroměru se točí a ručička hodin oběhne jednou dokola, to je 1 hodina. Počítadlo elektroměru ukáže nejdřív 1 kWh a po hodině 2 kWh. Elektrická práce W = P · t = 2 kW · 1 h = 2 kWh. Když 1 kWh stojí 5 Kč, zaplatíme 2 · 5 = 10 Kč. Elektroměr měří spotřebu energie a podle ní platíme účet za elektřinu" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Elektrická energie a její přeměny 3/3: Elektroměr počítá kWh</title>
	<style>
		.ga { animation: ga 10s linear infinite; } .gb { animation: gb 10s linear infinite; } .gc { animation: gc 10s linear infinite; }
		.c0 { animation: c0 10s linear infinite; } .c1 { animation: c1 10s linear infinite; } .c2 { animation: c2 10s linear infinite; }
		.hod { transform-box: view-box; transform-origin: 305px 365px; animation: hod 10s linear infinite; }
		.kot { animation: kot 0.8s ease-in-out infinite; }
		@keyframes ga { 0% { opacity: 1; } 9% { opacity: 1; } 10% { opacity: 0; } 95% { opacity: 0; } 96% { opacity: 1; } 100% { opacity: 1; } }
		@keyframes gb { 0% { opacity: 0; } 9% { opacity: 0; } 10% { opacity: 1; } 69% { opacity: 1; } 70% { opacity: 0; } 100% { opacity: 0; } }
		@keyframes gc { 0% { opacity: 0; } 69% { opacity: 0; } 70% { opacity: 1; } 95% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
		@keyframes c0 { 0% { opacity: 1; } 39% { opacity: 1; } 40% { opacity: 0; } 95% { opacity: 0; } 96% { opacity: 1; } 100% { opacity: 1; } }
		@keyframes c1 { 0% { opacity: 0; } 39% { opacity: 0; } 40% { opacity: 1; } 69% { opacity: 1; } 70% { opacity: 0; } 100% { opacity: 0; } }
		@keyframes c2 { 0% { opacity: 0; } 69% { opacity: 0; } 70% { opacity: 1; } 95% { opacity: 1; } 96% { opacity: 0; } 100% { opacity: 0; } }
		@keyframes hod { 0% { transform: rotate(0deg); } 10% { transform: rotate(0deg); } 70% { transform: rotate(360deg); } 100% { transform: rotate(360deg); } }
		@keyframes kot { 0% { transform: translate(-38px, 0px); opacity: 1; } 50% { transform: translate(38px, 0px); opacity: 1; } 51% { opacity: 0; } 99% { opacity: 0; } 100% { transform: translate(-38px, 0px); opacity: 1; } }
		@media (prefers-reduced-motion: reduce) { .ga, .gb, .gc, .c0, .c1, .c2, .hod, .kot { animation: none; } }
	</style>
