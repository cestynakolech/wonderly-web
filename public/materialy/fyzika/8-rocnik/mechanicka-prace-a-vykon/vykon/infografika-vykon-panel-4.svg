<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Watt a násobky. Výkon 1 W znamená práci 1 J za 1 s. Výkon 2 kW znamená práci 2 kJ za 1 s. 1 kW = 1 000 W, 1 MW = 1 000 000 W. Nepleť si: W = 60 J je práce, P = 60 W je výkon.">
	<title>Výkon 4/6: Watt a násobky</title>
	<!-- Obsah podle Výkon.pdf s. 2–3 (watt, kW, MW, 1 W = 1 J za 1 s, 2 kW = 2 kJ za 1 s).
	     Animace: ručička stopek oběhne 1 kolo za 1 s (rotace kolem středu ciferníku, view-box). -->
	<style>
		.vyk-rucicka { animation: vyk-rucicka 1s linear infinite; transform-box: view-box; transform-origin: 380px 112px; }
		@keyframes vyk-rucicka { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
		@media (prefers-reduced-motion: reduce) {
			.vyk-rucicka { animation: none; }
		}
	</style>

	<rect x="0" y="0" width="460" height="420" fill="#f8f9fa" />
	<g id="vyk-watt">
		<rect x="10" y="10" width="440" height="400" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="2" />
		<text x="26" y="44" font-size="25" font-weight="bold" fill="#2b2a26">Watt a násobky</text>

		<!-- stopky 1 s -->
		<rect x="372" y="62" width="16" height="10" rx="2" fill="#495057" />
		<circle cx="380" cy="112" r="38" fill="#ffffff" stroke="#495057" stroke-width="4" />
		<line x1="380" y1="78" x2="380" y2="86" stroke="#495057" stroke-width="3" />
		<line x1="414" y1="112" x2="406" y2="112" stroke="#495057" stroke-width="3" />
		<line x1="380" y1="146" x2="380" y2="138" stroke="#495057" stroke-width="3" />
		<line x1="346" y1="112" x2="354" y2="112" stroke="#495057" stroke-width="3" />
		<line class="vyk-rucicka" x1="380" y1="112" x2="380" y2="82" stroke="#c92a2a" stroke-width="3" stroke-linecap="round" />
		<circle cx="380" cy="112" r="4" fill="#c92a2a" />
		<text x="380" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2a26">1 s</text>

		<text x="26" y="92" font-size="22" font-weight="bold" fill="#2b2a26">1 W</text>
		<text x="26" y="120" font-size="21" fill="#2b2a26">= práce <tspan font-weight="bold">1 J</tspan> za 1 s</text>
		<text x="26" y="158" font-size="22" font-weight="bold" fill="#2b2a26">2 kW</text>
		<text x="26" y="186" font-size="21" fill="#2b2a26">= práce <tspan font-weight="bold">2 kJ</tspan> za 1 s</text>

		<rect x="26" y="206" width="408" height="92" rx="8" fill="#f1f3f5" />
		<text x="44" y="242" font-size="23" font-weight="bold" fill="#1971c2">1 kW = 1 000 W</text>
		<text x="44" y="280" font-size="23" font-weight="bold" fill="#1971c2">1 MW = 1 000 000 W</text>

		<text x="26" y="336" font-size="20" font-weight="bold" fill="#c92a2a">Nepleť si písmeno W:</text>
		<text x="26" y="364" font-size="20" fill="#2b2a26">W = 60 J → <tspan font-weight="bold">práce</tspan></text>
		<text x="26" y="392" font-size="20" fill="#2b2a26">P = 60 W → <tspan font-weight="bold">výkon</tspan> (W = watt)</text>
	</g>
</svg>
