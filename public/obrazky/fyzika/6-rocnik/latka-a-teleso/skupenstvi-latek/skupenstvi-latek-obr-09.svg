<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Nahoře hromádka broušených diamantů, které se třpytí. Diamant je nejtvrdší látka na Zemi, brousí se jím a řeže. Dole diamant v držáku jede po krystalu křemene a zanechá v něm rýhu – vryp. Tvrdší nerost zanechá v měkčím vryp. Animace: diamant dělá vryp.">
<style>
.dd { animation: dd 6s ease-in-out infinite; } @keyframes dd { 0% { transform: translate(-240px, -30px); } 10% { transform: translate(-240px, 0); } 70% { transform: translate(0, 0); } 85% { transform: translate(0, 0); } 95% { transform: translate(0, -30px); } 100% { transform: translate(-240px, -30px); } } .vr { animation: vr 6s ease-in-out infinite; } @keyframes vr { 0%, 10% { stroke-dashoffset: 240; opacity: 1; } 70% { stroke-dashoffset: 0; } 92% { stroke-dashoffset: 0; opacity: 1; } 99% { opacity: 0; } 100% { stroke-dashoffset: 240; opacity: 0; } } .j0 { transform-box: fill-box; transform-origin: center; animation: j 2s ease-in-out 0.0s infinite; } .j1 { transform-box: fill-box; transform-origin: center; animation: j 2s ease-in-out -0.5s infinite; } .j2 { transform-box: fill-box; transform-origin: center; animation: j 2s ease-in-out -1.0s infinite; } .j3 { transform-box: fill-box; transform-origin: center; animation: j 2s ease-in-out -1.5s infinite; } @keyframes j { 0%, 100% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(1); } }
.vl { animation: vl 6s ease-in-out infinite; } @keyframes vl { 0%, 62% { opacity: 0; } 72%, 92% { opacity: 1; } 99%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .vl, .dd, .vr, .j0, .j1, .j2, .j3 { animation: none; } }
/* Předloha: PDF Skupenství látek, foto krystalů u Tvrdosti nerostů. Překresleno jako broušené diamanty; animace vrypu znázorňuje větu výkladu o stupnici tvrdosti. Bez animace = vryp hotový, diamant na konci. */
</style>
