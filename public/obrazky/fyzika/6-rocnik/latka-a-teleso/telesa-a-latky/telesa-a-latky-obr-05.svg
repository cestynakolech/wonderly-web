<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1060" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vlastnosti látek. Deset karet: barva (tři barevné kapky), chuť (jazyk), vůně (nos a vlnky vůně), tvrdost (železný hřebík zatlučený do dřeva), pružnost (ocelová pružina se stlačí a zase narovná), rozpustnost (sůl mizí ve vodě), křehkost (prasklé sklo), sypkost (sůl se sype ze slánky), tvárnost (z kuličky modelíny se vyválí váleček) a tekutost (voda teče ze sklenice do sklenice).">
<style>
/* Předloha: PDF Tělesa a látky, oddíl Vlastnosti látek (barva, chuť, vůně, tvrdost, pružnost, rozpustnost,
   křehkost, sypkost, tvárnost, tekutost). V PDF jen výčet slov; ke každému slovu kresba s látkou z výkladu
   (železo, dřevo, ocel, sůl, voda, sklo) nebo obecný obrázek. Bez animace (reduced-motion) = klidový stav. */
@keyframes vune { to { stroke-dashoffset: 32; } }
@keyframes pruzina { 0%, 20%, 100% { transform: translateY(45px) scaleY(1) translateY(-45px); } 45%, 70% { transform: translateY(45px) scaleY(0.6) translateY(-45px); } }
@keyframes zavazi { 0%, 20%, 100% { transform: translateY(0); } 45%, 70% { transform: translateY(26px); } }
@keyframes rozpust { 0%, 15% { opacity: 1; transform: scale(1); } 75%, 100% { opacity: 0; transform: scale(0.3); } }
@keyframes zrnko { 0% { transform: translate(0, 0); opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(6px, 58px); opacity: 0; } }
@keyframes proud { to { stroke-dashoffset: -28; } }
.vu { stroke-dasharray: 10 6; animation: vune 1.2s linear infinite; }
.pr { animation: pruzina 3s ease-in-out infinite; }
.za { animation: zavazi 3s ease-in-out infinite; }
.ro { transform-box: fill-box; transform-origin: center; animation: rozpust 4s ease-in infinite; }
.ro2 { animation-delay: -1.3s; } .ro3 { animation-delay: -2.6s; }
.zr { animation: zrnko 0.9s linear infinite; }
.zr2 { animation-delay: -0.3s; } .zr3 { animation-delay: -0.6s; }
.pu { stroke-dasharray: 14 14; animation: proud 0.6s linear infinite; }
@media (prefers-reduced-motion: reduce) { .vu, .pr, .za, .ro, .zr, .pu { animation: none; } }
</style>
<defs>
<linearGradient id="dr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2ad72"/><stop offset="1" stop-color="#9c6431"/></linearGradient>
<linearGradient id="kov" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#495057"/><stop offset="0.45" stop-color="#e9ecef"/><stop offset="1" stop-color="#6c757d"/></linearGradient>
<linearGradient id="voda" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5d8ff"/><stop offset="1" stop-color="#74c0fc"/></linearGradient>
<radialGradient id="mod" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffd43b"/><stop offset="1" stop-color="#e67700"/></radialGradient>
</defs>
<rect x="3" y="3" width="594" height="1054" rx="14" fill="#f8f9fa"/>
<text x="300" y="46" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Vlastnosti látek</text>
<text x="300" y="84" font-size="24" fill="#212529" text-anchor="middle">Různé látky se liší svými vlastnostmi.</text>
