<svg viewBox="0 0 460 616" width="460" height="616" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Další složené pohyby. Země se otáčí kolem své osy a zároveň obíhá kolem Slunce (obrázek není v měřítku). Šroub se otáčí kolem své osy (točí se drážka na hlavě, závity klouzají po dříku) a zároveň se posouvá do dřeva, bod závitu opisuje šroubovici. Složené jsou i pohyby na horské dráze nebo při akrobatickém letu" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Posuvný a otáčivý pohyb 6/6: Další složené pohyby</title>
	<style>
		.p6-o { transform-origin: 124px 176px; transform-box: view-box; animation: p6-o 12s linear infinite; } @keyframes p6-o { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
		.p6-z { transform-origin: 206px 176px; transform-box: view-box; animation: p6-z 1.5s linear infinite; } @keyframes p6-z { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
		.p6-f { animation: p6-f 1.0s linear infinite; } @keyframes p6-f { from { stroke-dashoffset: 34; } to { stroke-dashoffset: 0; } }
		.p6-s { animation: p6-s 6s linear infinite; } @keyframes p6-s { 0% { transform: translate(0px, 0px); opacity: 1; } 85% { transform: translate(0px, 36px); opacity: 1; } 95% { transform: translate(0px, 36px); opacity: 0; } 96% { transform: translate(0px, 0px); opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 1; } }
		.p6-t { animation: p6-t 6s linear infinite; } @keyframes p6-t { 0% { transform: translate(0px, 0px); } 85%, 95% { transform: translate(0px, -36px); } 96%, 100% { transform: translate(0px, 0px); } }
		.p6-x { transform-origin: 0px 0px; transform-box: view-box; animation: p6-x 6s linear infinite; } @keyframes p6-x { 0% { transform: rotate(0deg); } 85%, 95% { transform: rotate(1440deg); } 96%, 100% { transform: rotate(0deg); } }
		@media (prefers-reduced-motion: reduce) { .p6-f, .p6-o, .p6-s, .p6-t, .p6-x, .p6-z { animation: none; } }
	</style>
