<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Přenosné zdroje napětí: tužkový článek s napětím 1,5 V, plochá baterie s napětím 4,5 V se dvěma plíšky (kratší plus, delší minus) a autobaterie (akumulátor) s napětím asi 12 V s červenou kladnou a modrou zápornou svorkou.">
<!-- Předloha: PDF Jednoduché elektrické obvody, ilustrace mnoha druhů baterií a akumulátorů (tužkové, ploché, knoflíkové, autobaterie…).
     Překresleny jen zdroje, které výklad jmenuje s napětím: tužkový článek 1,5 V, plochá baterie 4,5 V, autobaterie asi 12 V (PDF uvádí 12,6 V, výklad „asi 12 V“). -->
<defs>
<linearGradient id="cerna" x1="0" x2="1"><stop offset="0" stop-color="#212529"/><stop offset="0.35" stop-color="#495057"/><stop offset="1" stop-color="#1a1d20"/></linearGradient>
<linearGradient id="zlata" x1="0" x2="1"><stop offset="0" stop-color="#b8741a"/><stop offset="0.35" stop-color="#f7c873"/><stop offset="1" stop-color="#9c5f12"/></linearGradient>
<linearGradient id="kov" x1="0" x2="1"><stop offset="0" stop-color="#868e96"/><stop offset="0.4" stop-color="#f1f3f5"/><stop offset="1" stop-color="#6c757d"/></linearGradient>
<linearGradient id="mosaz" x1="0" x2="1"><stop offset="0" stop-color="#a87b2b"/><stop offset="0.45" stop-color="#f2d38a"/><stop offset="1" stop-color="#8f6620"/></linearGradient>
<linearGradient id="modra" x1="0" x2="1"><stop offset="0" stop-color="#1864ab"/><stop offset="0.35" stop-color="#4dabf7"/><stop offset="1" stop-color="#0b4f8a"/></linearGradient>
<linearGradient id="seda" x1="0" x2="1"><stop offset="0" stop-color="#343a40"/><stop offset="0.3" stop-color="#5c636a"/><stop offset="1" stop-color="#212529"/></linearGradient>
</defs>
<rect x="3" y="3" width="634" height="474" rx="14" fill="#f8f9fa"/>
<text x="320" y="44" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Přenosné zdroje napětí</text>
<!-- stíny -->
<ellipse cx="110" cy="360" rx="44" ry="7" fill="#000" opacity="0.12"/>
<ellipse cx="320" cy="360" rx="92" ry="8" fill="#000" opacity="0.12"/>
<ellipse cx="525" cy="360" rx="100" ry="8" fill="#000" opacity="0.12"/>

<!-- tužkový článek -->
<rect x="99" y="130" width="22" height="14" rx="3" fill="url(#kov)" stroke="#495057" stroke-width="1.5"/>
<rect x="82" y="142" width="56" height="214" rx="10" fill="url(#cerna)"/>
<path d="M82 206V152Q82 142 92 142H128Q138 142 138 152V206Z" fill="url(#zlata)"/>
<rect x="90" y="150" width="7" height="198" rx="3" fill="#fff" opacity="0.22"/>
<path d="M101 176H119M110 167V185" stroke="#212529" stroke-width="4" stroke-linecap="round"/>
<text transform="translate(117 286) rotate(-90)" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">1,5 V</text>
<path d="M101 338H119" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

<!-- plochá baterie: kratší plíšek +, delší plíšek − -->
<path d="M272 200V170H290V200Z" fill="url(#mosaz)" stroke="#8f6620" stroke-width="1.5"/>
<path d="M350 200V132H368V200Z" fill="url(#mosaz)" stroke="#8f6620" stroke-width="1.5"/>
<path d="M350 132Q359 120 368 132" fill="url(#mosaz)" stroke="#8f6620" stroke-width="1.5"/>
<rect x="245" y="198" width="150" height="158" rx="8" fill="url(#modra)"/>
<rect x="245" y="196" width="150" height="14" rx="4" fill="#343a40"/>
<rect x="245" y="248" width="150" height="46" fill="#ffd43b"/>
<rect x="253" y="214" width="8" height="134" rx="3" fill="#fff" opacity="0.25"/>
<text x="320" y="281" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">4,5 V</text>
<path d="M248 182H264M256 174V190" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/>
<path d="M378 152H394" stroke="#1864ab" stroke-width="4" stroke-linecap="round"/>

<!-- autobaterie (akumulátor) -->
<path d="M492 202V182H558V202" fill="none" stroke="#868e96" stroke-width="7" stroke-linejoin="round"/>
<rect x="452" y="184" width="24" height="18" rx="3" fill="#e03131" stroke="#a61e1e" stroke-width="1.5"/>
<rect x="574" y="184" width="24" height="18" rx="3" fill="#1971c2" stroke="#0b4f8a" stroke-width="1.5"/>
<rect x="434" y="200" width="182" height="26" rx="5" fill="#212529"/>
<rect x="440" y="222" width="170" height="134" rx="6" fill="url(#seda)"/>
<rect x="448" y="230" width="8" height="118" rx="3" fill="#fff" opacity="0.18"/>
<path d="M455 213H471M463 205V221" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<path d="M578 213H594" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<rect x="466" y="264" width="118" height="52" rx="5" fill="#c92a2a"/>
<text x="525" y="299" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">12 V</text>

<!-- popisky -->
<g font-size="21" fill="#212529" text-anchor="middle">
<text x="110" y="400">tužkový článek</text>
<text x="110" y="430" font-weight="bold">1,5 V</text>
<text x="320" y="400">plochá baterie</text>
<text x="320" y="430" font-weight="bold">4,5 V</text>
<text x="525" y="400">autobaterie</text>
<text x="525" y="428" fill="#495057" font-size="20">(akumulátor)</text>
<text x="525" y="458" font-weight="bold">asi 12 V</text>
</g>
</svg>
