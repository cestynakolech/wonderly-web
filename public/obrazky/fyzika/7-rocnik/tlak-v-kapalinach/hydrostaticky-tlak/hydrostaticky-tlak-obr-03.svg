<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Helvetica, Arial, sans-serif">
<title>Příklad s přehradou na tabuli</title>
<defs>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
<marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>
<rect x="20" y="20" width="920" height="560" rx="10" fill="#2b4a3a" stroke="#6d4c2b" stroke-width="10" /><text x="50" y="70.0" font-size="19" text-anchor="start" font-weight="normal" fill="#f8f9fa">Jak hluboká je přehrada, jestliže na hráz u dna působí</text><text x="50" y="98.0" font-size="19" text-anchor="start" font-weight="normal" fill="#f8f9fa">tlak vody o velikosti 600 kPa?</text><text x="50" y="150.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">ρ = 1 000 kg/m³</text><text x="50" y="182.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">p<tspan font-size="14" dy="4.4">h</tspan><tspan dy="-4.4"> = 600 kPa = 600 000 Pa</tspan></text><text x="50" y="214.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">g = 10 N/kg</text><text x="50" y="246.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">h = ? m</text><rect x="520.0" y="165" width="280" height="34" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="2.5" />
<text x="660" y="188.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#212529">základní jednotka: pascal</text><line x1="40" y1="270" x2="900" y2="270" stroke="#f8f9fa" stroke-width="2" /><text x="50" y="315.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">p<tspan font-size="14" dy="4.4">h</tspan><tspan dy="-4.4"> = h · ρ · g</tspan></text><text x="50" y="352.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">h = p<tspan font-size="14" dy="4.4">h</tspan><tspan dy="-4.4"> : (ρ · g)</tspan></text><text x="330" y="352.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">nebo zlomkem: h = p / (ρ · g)</text><text x="50" y="400.0" font-size="20" text-anchor="start" font-weight="normal" fill="#f8f9fa">h = 600 000 Pa : (1 000 kg/m³ · 10 N/kg)</text><text x="50" y="445.0" font-size="24" text-anchor="start" font-weight="bold" fill="#f8f9fa">h = 60 m</text><line x1="40" y1="475" x2="900" y2="475" stroke="#f8f9fa" stroke-width="2" /><text x="50" y="525.0" font-size="22" text-anchor="start" font-weight="normal" fill="#f8f9fa">Přehrada je hluboká 60 metrů.</text>
</svg>
