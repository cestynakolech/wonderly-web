<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Noční město pod fialovou bouřkovou oblohou. Z mraků šlehají tři rozvětvené blesky až k domům, okna svítí žlutě. Animace: blesky postupně problikávají a obloha se při záblesku rozsvítí. Dole nápis: Pozorování – fyzik zkoumá, jak se příroda chová.">
<style>
/* Předloha: PDF Úvod do fyziky, s. 2 (fotografie blesků nad nočním městem u odstavce Pozorování) – překresleno.
   Blesky blikají ve smyčce 6 s s posunutými fázemi; bez animace (reduced-motion) jsou vidět všechny tři blesky. */
@keyframes blik { 0% { opacity: 0; } 2% { opacity: 1; } 4% { opacity: 0.2; } 6% { opacity: 1; } 11% { opacity: 0; } 100% { opacity: 0; } }
@keyframes zablesk { 0% { opacity: 0; } 2% { opacity: 0.35; } 4% { opacity: 0.05; } 6% { opacity: 0.3; } 11% { opacity: 0; } 100% { opacity: 0; } }
.b1 { animation: blik 6s linear infinite; }
.b2 { animation: blik 6s linear -4s infinite; }
.b3 { animation: blik 6s linear -2.2s infinite; }
.z1 { opacity: 0; animation: zablesk 6s linear infinite; }
.z2 { opacity: 0; animation: zablesk 6s linear -4s infinite; }
.z3 { opacity: 0; animation: zablesk 6s linear -2.2s infinite; }
@media (prefers-reduced-motion: reduce) { .b1, .b2, .b3, .z1, .z2, .z3 { animation: none; } }
</style>
