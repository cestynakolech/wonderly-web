<svg viewBox="0 0 460 520" width="460" height="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Obnovitelné a neobnovitelné zdroje v pohybu 3/3, Slunce, déšť a turbína. 1: Slunce ohřívá vodu v jezeře a ta se vypařuje. 2: Pára stoupá a vznikne mrak, vítr ho nese nad hory. 3: Z mraku prší, řeka teče z hor do nádrže za hrází. 4: Voda z nádrže teče potrubím na turbínu, roztočí ji i generátor a ten vyrábí elektřinu. Voda pak odtéká zpět do jezera. Energie vodní elektrárny tedy pochází ze Slunce." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Obnovitelné a neobnovitelné zdroje v pohybu 3/3: Slunce, déšť a turbína</title>
	<!-- W82 (14. 10. 2026): náhrada návrhu „přečerpávací jako baterie“ (zdvojil by obr-03). Opora výkladu: „vodní elektrárna žije z koloběhu
	     vody, a ten pohání sluneční teplo, které vodu vypařuje“ + „voda z nádrže teče na turbínu a generátor vyrábí elektřinu“.
	     Barvy dle LEGENDA-TEPLO: šipka tepla #e03131, šipka výparu #f59f00, kapky a tekoucí voda #1971c2, voda #74c0fc, hladina #1c7ed6.
	     Blesk = vyrábí elektřinu (stejně jako v panelu 2). Animace jen CSS transform/opacity.
	     OPRAVA 2 (14. 10.): značky ≥3:1 vůči pozadí — šipka výparu zůstává #f59f00 (legenda), dostala tmavý lem #7a3e00; mrak bílý s obrysem #495057;
	     řeka #a5d8ff s okrajem #1971c2; Slunce obrys + paprsky #c2410c; popisek „nádrž“ nad hladinou (na obloze, nekříží svah). -->
	<style>
		.p3-par { transform: translateY(0px); opacity: 1; animation: p3-par 2s linear infinite; }
		@keyframes p3-par { 0% { transform: translateY(16px); opacity: 0; } 20% { opacity: 1; } 75% { opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
		.p3-par2 { animation-delay: -1s; }
		.p3-mrak { transform: translate(268px,-70px) scale(1); opacity: 1; animation: p3-mrak 8s ease-in-out infinite; }
		@keyframes p3-mrak { 0% { transform: translate(0px,0px) scale(0.5); opacity: 0; } 8% { transform: translate(0px,0px) scale(0.6); opacity: 1; } 42% { transform: translate(268px,-70px) scale(1); opacity: 1; } 86% { transform: translate(268px,-70px) scale(1); opacity: 1; } 94% { transform: translate(268px,-70px) scale(1); opacity: 0; } 100% { transform: translate(0px,0px) scale(0.5); opacity: 0; } }
		.p3-dest { opacity: 1; animation: p3-dest 8s linear infinite; }
		@keyframes p3-dest { 0% { opacity: 0; } 42% { opacity: 0; } 45% { opacity: 1; } 86% { opacity: 1; } 89% { opacity: 0; } 100% { opacity: 0; } }
		.p3-kapka { transform: translateY(7px); opacity: 1; animation: p3-kapka 0.8s linear infinite; }
		@keyframes p3-kapka { 0% { transform: translateY(0px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
		.p3-k2 { animation-delay: -0.4s; }
		.p3-reka { transform: translate(-54px,40px); opacity: 1; animation: p3-reka 1.6s linear infinite; }
		@keyframes p3-reka { 0% { transform: translate(0px,0px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(-108px,80px); opacity: 0; } }
		.p3-r2 { animation-delay: -0.8s; }
		.p3-roura { transform: translateX(-12px); opacity: 1; animation: p3-roura 0.8s linear infinite; }
		@keyframes p3-roura { 0% { transform: translateX(0px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(-24px); opacity: 0; } }
		.p3-kolo { transform: rotate(0deg); animation: p3-kolo 1.2s linear infinite; }
		@keyframes p3-kolo { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
		.p3-blesk { opacity: 1; animation: p3-blesk 1.2s ease-in-out infinite; }
		@keyframes p3-blesk { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) {
			.p3-par, .p3-mrak, .p3-dest, .p3-kapka, .p3-reka, .p3-roura, .p3-kolo, .p3-blesk { animation: none; }
		}
	</style>
	<defs>
		<marker id="p3-sip-cervena" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e03131" /></marker>
		<marker id="p3-sip-oranzova" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#f59f00" stroke="#7a3e00" stroke-width="1.4" stroke-linejoin="round" /></marker>
		<polygon id="d-blesk" points="3,-17 -9,2 -1,2 -4,17 9,-3 1,-3" fill="#fcc419" stroke="#2b2a26" stroke-width="2" stroke-linejoin="round" />
		<!-- kapka deště: počátek = horní špička -->
		<path id="d-kapka" d="M 0 0 C 3 6 5 8 5 11 A 5 5 0 0 1 -5 11 C -5 8 -3 6 0 0 Z" fill="#1971c2" />
		<clipPath id="p3-klip-reka" clipPathUnits="userSpaceOnUse"><path d="M 372 178 L 384 186 L 266 270 L 254 262 Z" /></clipPath>
		<clipPath id="p3-klip-roura" clipPathUnits="userSpaceOnUse"><rect x="176" y="282" width="24" height="10" /></clipPath>
	</defs>
	<rect x="0" y="0" width="460" height="520" fill="#f8f9fa" />
	<g id="panel-3">
		<rect x="26" y="22" width="420" height="484" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="484" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">3</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Slunce, déšť a turbína</text>
		<!-- obloha -->
		<rect x="32" y="82" width="396" height="256" fill="#d0ebff" />
		<!-- Slunce -->
		<g transform="translate(0,6)">
			<path d="M 72 78 V 86 M 72 138 V 146 M 38 112 H 46 M 98 112 H 106 M 48 88 L 54 94 M 90 130 L 96 136 M 48 136 L 54 130 M 90 94 L 96 88" stroke="#c2410c" stroke-width="4" stroke-linecap="round" />
			<circle cx="72" cy="112" r="21" fill="#ffd43b" stroke="#c2410c" stroke-width="2.5" />
		</g>
		<!-- terén: hory vpravo, rovina s elektrárnou, jezero vlevo dole -->
		<polygon points="112,300 198,300 198,295 250,295 330,140 365,178 410,135 428,148 428,338 112,338" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" stroke-linejoin="round" />
		<polygon points="32,300 112,300 112,338 32,338" fill="#74c0fc" />
		<line x1="32" y1="300" x2="112" y2="300" stroke="#1c7ed6" stroke-width="3" />
		<text x="72" y="326" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c3d5a">jezero</text>
		<!-- 1: teplo ze Slunce do vody -->
		<line x1="72" y1="156" x2="72" y2="286" stroke="#e03131" stroke-width="4" marker-end="url(#p3-sip-cervena)" />
		<!-- 2: výpar (oranžové vlnité šipky nahoru) -->
		<g class="p3-par"><path d="M 92 290 q 6 -10 0 -20 q -6 -10 0 -20 q 6 -10 0 -20" fill="none" stroke="#7a3e00" stroke-width="7" stroke-linecap="round" /><path d="M 92 290 q 6 -10 0 -20 q -6 -10 0 -20 q 6 -10 0 -20" fill="none" stroke="#f59f00" stroke-width="3.5" marker-end="url(#p3-sip-oranzova)" /></g>
		<g class="p3-par p3-par2"><path d="M 104 278 q 6 -10 0 -20 q -6 -10 0 -20 q 6 -10 0 -20" fill="none" stroke="#7a3e00" stroke-width="7" stroke-linecap="round" /><path d="M 104 278 q 6 -10 0 -20 q -6 -10 0 -20 q 6 -10 0 -20" fill="none" stroke="#f59f00" stroke-width="3.5" marker-end="url(#p3-sip-oranzova)" /></g>
		<!-- mrak: vznikne malý nad jezerem (střed x=104, nad párou, vpravo od šipky tepla x=72), roste a pluje nad hory (372,110) -->
		<g transform="translate(104,180)"><g class="p3-mrak">
			<ellipse cx="0" cy="4" rx="40" ry="14" fill="#fff" stroke="#495057" stroke-width="2.5" />
			<circle cx="-16" cy="-6" r="15" fill="#fff" stroke="#495057" stroke-width="2.5" />
			<circle cx="8" cy="-10" r="19" fill="#fff" stroke="#495057" stroke-width="2.5" />
			<ellipse cx="0" cy="6" rx="38" ry="11" fill="#fff" />
		</g></g>
		<!-- 3: déšť nad horami — kapky jen nad údolím 345–390, spodek kapky nejníž start+16+14 ≤ svah − 1 (OPRAVA 1) -->
		<g class="p3-dest">
			<g class="p3-kapka"><use href="#d-kapka" x="351" y="124" /><use href="#d-kapka" x="373" y="128" /><use href="#d-kapka" x="383" y="122" /></g>
			<g class="p3-kapka p3-k2"><use href="#d-kapka" x="361" y="128" /><use href="#d-kapka" x="379" y="128" /></g>
		</g>
		<!-- řeka z hor do nádrže -->
		<path d="M 378 182 L 260 266" stroke="#1971c2" stroke-width="13" stroke-linecap="round" />
		<path d="M 378 182 L 260 266" stroke="#a5d8ff" stroke-width="8" stroke-linecap="round" />
		<g clip-path="url(#p3-klip-reka)">
			<g class="p3-reka"><path d="M 376 183 l -12 8.5 M 350 201.5 l -12 8.5" stroke="#1971c2" stroke-width="4" stroke-linecap="round" /></g>
			<g class="p3-reka p3-r2"><path d="M 376 183 l -12 8.5 M 350 201.5 l -12 8.5" stroke="#1971c2" stroke-width="4" stroke-linecap="round" /></g>
		</g>
		<!-- nádrž za hrází -->
		<polygon points="198,262 267,262 250,295 198,295" fill="#74c0fc" />
		<line x1="198" y1="262" x2="267" y2="262" stroke="#1c7ed6" stroke-width="3" />
		<polygon points="186,248 198,248 198,300 178,300" fill="#adb5bd" stroke="#495057" stroke-width="2" stroke-linejoin="round" />
		<text x="228" y="255" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c3d5a">nádrž</text>
		<!-- potrubí hrází k turbíně -->
		<rect x="176" y="282" width="24" height="10" fill="#a5d8ff" stroke="#495057" stroke-width="2" />
		<g clip-path="url(#p3-klip-roura)"><g class="p3-roura"><rect x="194" y="285" width="7" height="4" fill="#1971c2" /><rect x="182" y="285" width="7" height="4" fill="#1971c2" /></g></g>
		<!-- strojovna v šikmém pohledu: přední stěna s turbínou, střecha s generátorem -->
		<polygon points="166,262 178,252 178,290 166,300" fill="#ced4da" stroke="#2b2a26" stroke-width="2" stroke-linejoin="round" />
		<polygon points="118,262 130,252 178,252 166,262" fill="#e9ecef" stroke="#2b2a26" stroke-width="2" stroke-linejoin="round" />
		<rect x="118" y="262" width="48" height="38" fill="#dee2e6" stroke="#2b2a26" stroke-width="2" />
		<circle cx="142" cy="281" r="15" fill="#a5d8ff" stroke="#2b2a26" stroke-width="2" />
		<g transform="translate(142,281)"><g class="p3-kolo">
			<path d="M 0 0 L 0 -13 M 0 0 L 11.3 6.5 M 0 0 L -11.3 6.5" stroke="#2b2a26" stroke-width="3" stroke-linecap="round" />
			<path d="M 0 -13 q 5 1 6 5 M 11.3 6.5 q -2 5 -7 6 M -11.3 6.5 q -3 -4 -1 -8" fill="none" stroke="#2b2a26" stroke-width="2.5" />
		</g></g>
		<line x1="148" y1="257" x2="148" y2="244" stroke="#495057" stroke-width="3" />
		<rect x="136" y="228" width="24" height="18" fill="#adb5bd" stroke="#2b2a26" stroke-width="2" />
		<ellipse cx="148" cy="228" rx="12" ry="4" fill="#dee2e6" stroke="#2b2a26" stroke-width="2" />
		<path d="M 141 238 q 3.5 -6 7 0 q 3.5 6 7 0" fill="none" stroke="#2b2a26" stroke-width="2" />
		<g class="p3-blesk"><use href="#d-blesk" transform="translate(178,226)" /></g>
		<!-- odtok zpět do jezera -->
		<path d="M 118 296 L 108 296" stroke="#1971c2" stroke-width="4" stroke-linecap="round" />
		<!-- čísla kroků ve scéně -->
		<g font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">
			<circle cx="48" cy="214" r="13" fill="#2b2a26" /><text x="48" y="220">1</text>
			<circle cx="128" cy="210" r="13" fill="#2b2a26" /><text x="128" y="216">2</text>
			<circle cx="404" cy="206" r="13" fill="#2b2a26" /><text x="404" y="212">3</text>
			<circle cx="142" cy="320" r="13" fill="#2b2a26" /><text x="142" y="326">4</text>
		</g>
		<!-- popis kroků -->
		<g font-size="20" fill="#2b2a26">
			<g font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">
				<circle cx="48" cy="366" r="13" fill="#2b2a26" /><text x="48" y="372">1</text>
				<circle cx="48" cy="398" r="13" fill="#2b2a26" /><text x="48" y="404">2</text>
				<circle cx="48" cy="430" r="13" fill="#2b2a26" /><text x="48" y="436">3</text>
				<circle cx="48" cy="462" r="13" fill="#2b2a26" /><text x="48" y="468">4</text>
			</g>
			<text x="70" y="373">Slunce ohřeje vodu, ta se vypaří.</text>
			<text x="70" y="405">Pára stoupá a vznikne mrak.</text>
			<text x="70" y="437">Z mraku prší, řeka plní nádrž.</text>
			<text x="70" y="469">Voda roztočí turbínu a generátor.</text>
		</g>
	</g>
</svg>
