<svg viewBox="0 0 460 750" width="460" height="750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ohřev: kov a křemík. Dva obvody se zdrojem a ampérmetrem, v jednom je kus kovu, ve druhém kus křemíku, pod oběma hoří kahan. Když se kov zahřeje, jeho atomy kmitají víc a brzdí volné elektrony, ručička ampérmetru klesne, proud slábne. Když se zahřeje křemík, z vazeb se uvolní elektrony a vzniknou díry, elektrony jdou ke kladnému pólu, díry k zápornému, ručička stoupne, proud sílí. Po vychladnutí se vše vrátí. Počet nakreslených částic je jen názorný" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Polovodiče v pohybu 1/4: Ohřev: kov a křemík</title>
	<style>
		.q1-tep { animation: q1-tep 10s linear infinite; }
		.q1-plamen { animation: q1-plamen 10s linear infinite; }
		.q1-mihot { animation: q1-mihot 0.5s ease-in-out infinite alternate; }
		.q1-studeny { animation: q1-studeny 10s linear infinite; }
		.q1-teply { animation: q1-teply 10s linear infinite; }
		.q1-par0 { animation: q1-par0 10s linear infinite; }
		.q1-par1 { animation: q1-par1 10s linear infinite; }
		.q1-par2 { animation: q1-par2 10s linear infinite; }
		.q1-ruc-kov { animation: q1-ruc-kov 10s linear infinite; }
		.q1-ruc-si { animation: q1-ruc-si 10s linear infinite; }
		.q1-kmit-maly { animation: q1-kmit-maly 0.4s ease-in-out infinite alternate; }
		.q1-kmit-velky { animation: q1-kmit-velky 0.2s ease-in-out infinite alternate; }
		.q1-e-rychle { animation: q1-e-rychle 1.2s linear infinite; }
		.q1-e-pomalu { animation: q1-e-pomalu 2.4s linear infinite; }
		.q1-e-si { animation: q1-e-si 2.4s linear infinite; }
		.q1-d-si { animation: q1-d-si 4s linear infinite; }
		@keyframes q1-tep { 0%, 10% { opacity: 0; } 60%, 80% { opacity: 0.35; } 95%, 100% { opacity: 0; } }
		@keyframes q1-plamen { 0%, 8% { opacity: 0; } 10%, 78% { opacity: 1; } 80%, 100% { opacity: 0; } }
		@keyframes q1-mihot { from { opacity: 1; } to { opacity: 0.75; } }
		@keyframes q1-studeny { 0%, 25% { opacity: 1; } 45%, 82% { opacity: 0; } 95%, 100% { opacity: 1; } }
		@keyframes q1-teply { 0%, 25% { opacity: 0; } 45%, 82% { opacity: 1; } 95%, 100% { opacity: 0; } }
		@keyframes q1-par0 { 0%, 20% { opacity: 0; } 28%, 80% { opacity: 1; } 90%, 100% { opacity: 0; } }
		@keyframes q1-par1 { 0%, 32% { opacity: 0; } 40%, 82% { opacity: 1; } 92%, 100% { opacity: 0; } }
		@keyframes q1-par2 { 0%, 44% { opacity: 0; } 52%, 84% { opacity: 1; } 94%, 100% { opacity: 0; } }
		@keyframes q1-ruc-kov { 0%, 10% { transform: rotate(46deg); } 60%, 80% { transform: rotate(16deg); } 95%, 100% { transform: rotate(46deg); } }
		@keyframes q1-ruc-si { 0%, 18% { transform: rotate(-52deg); } 28% { transform: rotate(-40deg); } 40% { transform: rotate(-25deg); } 52%, 80% { transform: rotate(-10deg); } 94%, 100% { transform: rotate(-52deg); } }
		@keyframes q1-kmit-maly { from { transform: translateX(-1.5px); } to { transform: translateX(1.5px); } }
		@keyframes q1-kmit-velky { from { transform: translate(-5px, 2px); } to { transform: translate(5px, -2px); } }
		@keyframes q1-e-rychle { from { transform: translateX(0px); } to { transform: translateX(46px); } }
		@keyframes q1-e-pomalu { from { transform: translateX(0px); } to { transform: translateX(46px); } }
		@keyframes q1-e-si { from { transform: translateX(0px); } to { transform: translateX(120px); } }
		@keyframes q1-d-si { from { transform: translateX(0px); } to { transform: translateX(-120px); } }
		@media (prefers-reduced-motion: reduce) { .q1-tep, .q1-plamen, .q1-mihot, .q1-studeny, .q1-teply, .q1-par0, .q1-par1, .q1-par2, .q1-ruc-kov, .q1-ruc-si, .q1-kmit-maly, .q1-kmit-velky, .q1-e-rychle, .q1-e-pomalu, .q1-e-si, .q1-d-si { animation: none; } }
	</style>
	<defs>
