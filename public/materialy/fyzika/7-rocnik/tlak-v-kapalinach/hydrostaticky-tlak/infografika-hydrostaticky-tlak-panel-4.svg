<svg xmlns="http://www.w3.org/2000/svg" width="460" height="640" viewBox="0 0 460 640" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Spojené nádoby. Dvě svislé trubice spojené dole trubkou s kohoutem. Při zavřeném kohoutu je vlevo voda výš, vpravo níž. Po otevření kohoutu se hladiny vyrovnají do stejné výšky. Hladina je ve spojených nádobách vodorovná a ve stejné výšce. Platí to pro nádoby jakéhokoli tvaru – úzká, šikmá, nálevka, široká – všude je stejná výška hladiny.">
	<title>Hydrostatický tlak 4/6: Spojené nádoby</title>
