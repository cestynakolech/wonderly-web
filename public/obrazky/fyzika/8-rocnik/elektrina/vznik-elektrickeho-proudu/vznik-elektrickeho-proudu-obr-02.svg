<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Obvod: baterie, vodiče, spínač a žárovka. Když je spínač vypnutý, obvod je přerušený a žárovka nesvítí. Po zapnutí spínače je obvod uzavřený, volné elektrony ve vodičích se pohybují od záporné svorky − ke kladné svorce + a žárovka svítí. Oranžové šipky ukazují dohodnutý směr proudu od + k −, modré šipky pohyb elektronů opačně, od − k +.">
<style>
/* Předloha: PDF lekce 20, str. 1 a 3 (přístroj potřebuje obvod se zdrojem napětí; volné elektrony míří od − ke +);
   výklad: baterie, vodiče, spínač a žárovka; přerušený obvod = žárovka nesvítí. Cyklus 10 s: 0–45 % spínač vypnutý,
   elektrony stojí, žárovka nesvítí; 45–50 % spínač se zavře; 50–95 % elektrony obíhají od − ke + (240 px, rozestup 80 px,
   pás bez švu), žárovka svítí, ukáže se oranžová šipka dohodnutého směru proudu (od + k −) a modrá šipka elektronů (od − k +);
   95–100 % spínač se otevře. Bez animace = koncový stav: spínač zapnutý, žárovka svítí, obě šipky vidět. */
.pak { transform-origin: 150px 420px; transform: rotate(-35deg); animation: pak 10s linear infinite; }
.on { opacity: 0; animation: on 10s linear infinite; }
.off { opacity: 1; animation: off 10s linear infinite; }
.cl { animation: cl 10s linear infinite; }
.cr { animation: cr 10s linear infinite; }
.cu { animation: cu 10s linear infinite; }
.cd { animation: cd 10s linear infinite; }
@keyframes pak { 0%, 45% { transform: rotate(-35deg); } 50%, 95% { transform: rotate(0deg); } 100% { transform: rotate(-35deg); } }
@keyframes on { 0%, 48% { opacity: 0; } 52%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
@keyframes off { 0%, 46% { opacity: 1; } 49%, 96% { opacity: 0; } 99%, 100% { opacity: 1; } }
@keyframes cl { 0%, 50% { transform: translate(0px, 0px); } 95%, 100% { transform: translate(-240px, 0px); } }
@keyframes cr { 0%, 50% { transform: translate(0px, 0px); } 95%, 100% { transform: translate(240px, 0px); } }
@keyframes cu { 0%, 50% { transform: translate(0px, 0px); } 95%, 100% { transform: translate(0px, -240px); } }
@keyframes cd { 0%, 50% { transform: translate(0px, 0px); } 95%, 100% { transform: translate(0px, 240px); } }
@media (prefers-reduced-motion: reduce) { .pak { animation: none; transform: none; } .on { animation: none; opacity: 1; } .off { animation: none; opacity: 0; } .cl, .cr, .cu, .cd { animation: none; } }
</style>
