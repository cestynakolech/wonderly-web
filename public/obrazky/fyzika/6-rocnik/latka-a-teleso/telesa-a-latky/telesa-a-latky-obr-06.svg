<rect x="20" y="648" width="560" height="96" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/>
<text x="300" y="688" font-size="24" fill="#212529" text-anchor="middle">Vlastnosti těles, které můžeme změřit,</text>
<text x="300" y="722" font-size="24" fill="#212529" text-anchor="middle">jsou <tspan font-weight="bold">fyzikální veličiny</tspan>.</text>
</svg>
