<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Varná konvice s příkonem 2 000 wattů vaří vodu. Vedle ní stopky odměřují 30 minut, tedy 1 800 sekund, a sloupec spotřebované energie se plní až na 3 600 000 joulů, což je 1 kilowatthodina. Výpočet: W = P0 · t = 2 000 W · 1 800 s = 3 600 000 J = 1 kWh.">
<style>
/* Předloha: PDF lekce 31, s. 2–3 – W = P · t; 1 Ws = 1 J; 1 Wh = 3 600 J; 1 kWh = 3 600 000 J.
   Čísla příkladu: výklad, Pro zvídavé – konvice 2 000 W, 30 minut denně, 2 000 · 1 800 = 3 600 000 J = 1 kWh.
   Obrázek v PDF chybí, nakresleno podle vztahu. Cyklus 6 s: 0–4,8 s ručička 0 → 30 min a sloupec
   0 → 3 600 000 J (oba rovnoměrně = stálý příkon), pak 1,2 s stojí. Bez animace = koncový stav. */
@keyframes rucka { 0% { transform: rotate(0deg); } 80%, 100% { transform: rotate(180deg); } }
.rucka { animation: rucka 6s linear infinite; transform-box: view-box; transform-origin: 0px 0px; }
@keyframes sloupec { 0% { transform: scaleY(0); } 80%, 100% { transform: scaleY(1); } }
.sloupec { animation: sloupec 6s linear infinite; transform-box: view-box; transform-origin: 0px 0px; }
@keyframes para { 0% { transform: translateY(0); opacity: 0.9; } 100% { transform: translateY(-26px); opacity: 0; } }
.para { animation: para 2s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .rucka, .sloupec, .para { animation: none; } }
</style>
<defs>
<linearGradient id="nerez" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#868e96"/><stop offset="0.3" stop-color="#f8f9fa"/><stop offset="0.65" stop-color="#ced4da"/><stop offset="1" stop-color="#6c757d"/></linearGradient>
<linearGradient id="ramecek" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ced4da"/><stop offset="0.5" stop-color="#868e96"/><stop offset="1" stop-color="#495057"/></linearGradient>
<linearGradient id="energie" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f59f00"/><stop offset="1" stop-color="#ffd43b"/></linearGradient>
</defs>
<rect x="3" y="3" width="894" height="574" rx="14" fill="#f8f9fa"/>
<text x="450" y="44" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Spotřebovaná energie: W = P<tspan font-size="18" dy="6">0</tspan><tspan dy="-6" dx="6">· t</tspan></text>

<!-- konvice (stejná kresba jako u přeměn energie) -->
<g transform="translate(150 214) scale(1.1) translate(-604 -210)">
<ellipse cx="604" cy="286" rx="54" ry="5" fill="#000" opacity="0.12"/>
<rect x="556" y="270" width="96" height="14" rx="5" fill="#343a40"/>
<path d="M640 160Q680 166 670 232L644 240" fill="none" stroke="#343a40" stroke-width="11" stroke-linecap="round"/>
<path d="M568 176L544 158L550 154L572 166Z" fill="#adb5bd" stroke="#495057" stroke-width="2"/>
<path d="M566 268L574 152Q604 136 634 152L642 268Z" fill="url(#nerez)" stroke="#495057" stroke-width="2"/>
<rect x="584" y="188" width="10" height="64" rx="4" fill="#a5d8ff" stroke="#495057" stroke-width="1.5"/>
<ellipse cx="604" cy="146" rx="15" ry="6" fill="#343a40"/>
<circle cx="624" cy="258" r="4" fill="#e03131"/>
<g fill="none" stroke="#adb5bd" stroke-width="4" stroke-linecap="round">
<path class="para" style="animation-delay:0s" d="M542 148q-6 -10 0 -20q6 -10 0 -20"/>
<path class="para" style="animation-delay:-0.7s" d="M528 152q-6 -10 0 -20q6 -10 0 -20"/>
<path class="para" style="animation-delay:-1.4s" d="M556 140q-6 -10 0 -20q6 -10 0 -20"/>
</g>
</g>
<text x="150" y="344" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">příkon P<tspan font-size="16" dy="5">0</tspan><tspan dy="-5" dx="6">= 2 000 W</tspan></text>
<text x="150" y="370" font-size="18" fill="#495057" text-anchor="middle">jako na štítku konvice (PDF s. 4)</text>

<!-- stopky -->
<rect x="440" y="94" width="20" height="16" rx="3" fill="#495057"/>
<rect x="430" y="88" width="40" height="10" rx="4" fill="#868e96"/>
<circle cx="452" cy="204" r="92" fill="#000" opacity="0.08"/>
<circle cx="450" cy="200" r="92" fill="url(#ramecek)"/>
<circle cx="450" cy="200" r="80" fill="#fff" stroke="#495057" stroke-width="2"/>
<g stroke="#495057" stroke-linecap="round" transform="translate(450 200)">
<path d="M0 -78V-64M0 78V64M-78 0H-64M78 0H64" stroke-width="4"/>
<path d="M0 -78V-70" stroke-width="2" transform="rotate(30)"/><path d="M0 -78V-70" stroke-width="2" transform="rotate(60)"/>
<path d="M0 -78V-70" stroke-width="2" transform="rotate(120)"/><path d="M0 -78V-70" stroke-width="2" transform="rotate(150)"/>
<path d="M0 -78V-70" stroke-width="2" transform="rotate(210)"/><path d="M0 -78V-70" stroke-width="2" transform="rotate(240)"/>
<path d="M0 -78V-70" stroke-width="2" transform="rotate(300)"/><path d="M0 -78V-70" stroke-width="2" transform="rotate(330)"/>
</g>
<text x="450" y="155" font-size="18" fill="#212529" text-anchor="middle">0</text>
<text x="450" y="260" font-size="18" fill="#212529" text-anchor="middle">30</text>
<text x="502" y="206" font-size="18" fill="#212529" text-anchor="middle">15</text>
<text x="398" y="206" font-size="18" fill="#212529" text-anchor="middle">45</text>
<text x="398" y="234" font-size="18" fill="#495057" text-anchor="middle">min</text>
<g transform="translate(450 200)">
<g class="rucka" transform="rotate(180)"><path d="M0 12V-32" stroke="#c92a2a" stroke-width="5" stroke-linecap="round"/><path d="M-7 -30L0 -44L7 -30Z" fill="#c92a2a"/></g>
<circle r="7" fill="#212529"/>
</g>
<text x="450" y="344" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">t = 30 min = 1 800 s</text>
<text x="450" y="370" font-size="18" fill="#495057" text-anchor="middle">celkem za den (modelový příklad)</text>

<!-- sloupec spotřebované energie -->
<rect x="700" y="96" width="60" height="200" rx="6" fill="#fff" stroke="#495057" stroke-width="2.5"/>
<g transform="translate(702 294)"><rect class="sloupec" x="0" y="-196" width="56" height="196" rx="4" fill="url(#energie)"/></g>
<path d="M694 96H766M694 296H766" stroke="#495057" stroke-width="2.5"/>
<text x="772" y="104" font-size="20" font-weight="bold" fill="#212529">3 600 000 J</text>
<text x="772" y="128" font-size="20" fill="#212529">= 1 kWh</text>
<text x="772" y="302" font-size="20" fill="#212529">0 J</text>
<text x="730" y="344" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">energie W</text>

<text x="450" y="402" font-size="20" fill="#212529" text-anchor="middle">1 W znamená 1 J za 1 s → konvice odebere každou sekundu 2 000 J.</text>
<text x="450" y="450" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">W = P<tspan font-size="17" dy="6">0</tspan><tspan dy="-6" dx="6">· t = 2 000 W · 1 800 s = 3 600 000 J</tspan></text>
<text x="450" y="494" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">3 600 000 J = 1 kWh</text>
<text x="270" y="542" font-size="20" fill="#212529" text-anchor="middle">1 Wh = 3 600 J</text>
<text x="590" y="542" font-size="20" fill="#212529" text-anchor="middle">1 kWh = 1 000 Wh = 3 600 000 J</text>
</svg>
