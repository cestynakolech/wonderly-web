<g class="tok" stroke="#fab005" stroke-width="4" stroke-dasharray="8 12">
<path d="M424 322C400 310 380 286 356 272"/>
<path d="M496 322C520 306 536 292 556 280"/>
<path d="M424 364C380 380 320 400 320 452"/>
<path d="M496 364C540 380 600 400 600 452"/>
</g>
</g>

