		<path id="hvv" d="M0.0 -30.0 L3.9 -14.5 L15.0 -26.0 L10.6 -10.6 L26.0 -15.0 L14.5 -3.9 L30.0 0.0 L14.5 3.9 L26.0 15.0 L10.6 10.6 L15.0 26.0 L3.9 14.5 L0.0 30.0 L-3.9 14.5 L-15.0 26.0 L-10.6 10.6 L-26.0 15.0 L-14.5 3.9 L-30.0 0.0 L-14.5 -3.9 L-26.0 -15.0 L-10.6 -10.6 L-15.0 -26.0 L-3.9 -14.5Z" fill="url(#gz)" stroke="#c92a2a" stroke-width="2.5" stroke-linejoin="round" />
