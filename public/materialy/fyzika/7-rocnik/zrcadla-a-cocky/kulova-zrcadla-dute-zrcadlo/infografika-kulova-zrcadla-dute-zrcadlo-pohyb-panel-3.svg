<svg viewBox="0 0 460 640" width="460" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kulová zrcadla v pohybu 3/3, Kolik řidič uvidí: pohled shora na nepřehlednou křižovatku. Řidič vyjíždí z ulice mezi domy, naproti stojí zrcadlo. Zleva přijíždí auto, které řidiči celou dobu zakrývá dům, přímo ho nevidí. S rovinným zrcadlem vidí řidič jen úzký kousek silnice před sebou a auto nevidí ani v zrcadle. S vypuklým zrcadlem vidí mnohem větší část silnice, i přijíždějící auto. Světlo od auta se odrazí od zrcadla do oka řidiče." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Kulová zrcadla v pohybu 3/3: Kolik řidič uvidí?</title>
	<!-- W89 (OPRAVA 1). Předloha: PDF 23, s. 16 („ve vypuklém zrcadle vidíme mnohem větší část prostoru než v rovinném zrcadle;
	     dopravní zrcadlo v nepřehledných křižovatkách“) a s. 17 (fotografie dopravního zrcadla u silnice; tady pohled shora).
	     Pohled shora. Oko E = (230, 420), zrcadlo šířky 60 se středem (230, 152); vypuklé = oblouk r = 60, střed (230, 92).
	     Okrajové paprsky spočítané odrazem podle kolmice k ploše zrcadla v bodě dopadu (úhel dopadu = úhel odrazu).
	     Rovinné: silnice (y = 228) vidět jen x ≈ 191.5–268.5; vypuklé: od okraje k okraji obrázku.
	     Auto jede z x -26–30 do 70–126 (vyjíždí zpoza levého okraje, výřez kartou): přímka oko → kterýkoli roh auta
	     protne dům (x 36–162, y 262), řidič auto přímo NEVIDÍ v žádné poloze (nejblíž rohu domu x = 149.8).
	     Paprsek auto → zrcadlo → oko: auto (120, 228), bod dopadu (208, 147.8).
	     Cyklus 10 s: 0–5 s rovinné, 5–10 s vypuklé; auto jede 0–4 s a 5–9 s; paprsek od auta 9,1–10 s.
	     Bez pohybu: rovinné zrcadlo, auto vlevo (mimo výhled). -->
