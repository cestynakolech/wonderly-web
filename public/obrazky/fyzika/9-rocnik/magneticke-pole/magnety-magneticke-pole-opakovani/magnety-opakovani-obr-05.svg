<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 540" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dvojice tyčových magnetů: opačné póly se přitahují, stejné se odpuzují">
<defs>
