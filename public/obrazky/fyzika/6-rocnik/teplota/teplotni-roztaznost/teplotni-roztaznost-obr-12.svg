<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: vlevo zvětšené částice studené vody, vpravo stejný počet částic horké vody, v obou 16 modrých částic. Ve studené vodě se částice chvějí pomalu a jsou blízko u sebe. V horké vodě se pohybují rychleji a do větších vzdáleností, mají mezi sebou větší mezery a zabírají víc místa. Dole: Stejný počet částic ve větším objemu, a proto je hustota menší.">
<style>
/* Předloha: PDF Teplotní roztažnost, Vliv teploty na hustotu — „Při vyšší teplotě se částice látky pohybují větší rychlostí ⇒
   pohybují se do větších vzdáleností ⇒ mají mezi sebou větší mezery ⇒ hustota látky se zmenšuje.“ (v PDF bez obrázku).
   Částice jako ve vzoru Částicové složení látek (modré částice vody, poloměr 13). V obou 16 částic (4 × 4).
   Studená: rozestup 34, chvění 2 px za 1,2 s. Horká: rozestup 48, chvění 6 px za 0,5 s. Bez animace = částice v klidu na místě. */
@keyframes c1 { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(1px, -1px); } 50% { transform: translate(-1px, -1px); } 75% { transform: translate(-1px, 1px); } }
@keyframes c2 { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-1px, 1px); } 50% { transform: translate(1px, 1px); } 75% { transform: translate(1px, -1px); } }
@keyframes h1 { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(6px, -6px); } 50% { transform: translate(-6px, -6px); } 75% { transform: translate(-6px, 6px); } }
@keyframes h2 { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-6px, 6px); } 50% { transform: translate(6px, 6px); } 75% { transform: translate(6px, -6px); } }
.c1 { animation: c1 1.2s linear infinite; } .c2 { animation: c2 1.2s linear 0.3s infinite; } .c3 { animation: c1 1.2s linear 0.6s infinite; } .c4 { animation: c2 1.2s linear 0.9s infinite; }
.h1 { animation: h1 0.5s linear infinite; } .h2 { animation: h2 0.5s linear 0.12s infinite; } .h3 { animation: h1 0.5s linear 0.25s infinite; } .h4 { animation: h2 0.5s linear 0.37s infinite; }
@media (prefers-reduced-motion: reduce) { .c1, .c2, .c3, .c4, .h1, .h2, .h3, .h4 { animation: none; } }
</style>
<defs>
<radialGradient id="voda" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#e7f5ff"/><stop offset="1" stop-color="#4dabf7"/></radialGradient>
<circle id="c" r="12" fill="url(#voda)" stroke="#1864ab" stroke-width="1.5"/>
</defs>
<rect x="3" y="3" width="594" height="594" rx="14" fill="#f8f9fa"/>
<rect x="90" y="16" width="420" height="54" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="300" y="52" font-size="26" fill="#212529" text-anchor="middle">Částice při zahřátí</text>
<text x="150" y="160" font-size="23" font-weight="bold" fill="#1864ab" text-anchor="middle">studená voda</text>
<text x="450" y="160" font-size="23" font-weight="bold" fill="#c92a2a" text-anchor="middle">horká voda</text>
<rect x="70" y="210" width="160" height="160" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="350" y="190" width="200" height="200" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2" stroke-dasharray="8 5"/>
<g transform="translate(99 239)"><g class="c1"><use href="#c"/></g></g><g transform="translate(133 239)"><g class="c2"><use href="#c"/></g></g><g transform="translate(167 239)"><g class="c3"><use href="#c"/></g></g><g transform="translate(201 239)"><g class="c4"><use href="#c"/></g></g>
<g transform="translate(99 273)"><g class="c2"><use href="#c"/></g></g><g transform="translate(133 273)"><g class="c3"><use href="#c"/></g></g><g transform="translate(167 273)"><g class="c4"><use href="#c"/></g></g><g transform="translate(201 273)"><g class="c1"><use href="#c"/></g></g>
<g transform="translate(99 307)"><g class="c3"><use href="#c"/></g></g><g transform="translate(133 307)"><g class="c4"><use href="#c"/></g></g><g transform="translate(167 307)"><g class="c1"><use href="#c"/></g></g><g transform="translate(201 307)"><g class="c2"><use href="#c"/></g></g>
<g transform="translate(99 341)"><g class="c4"><use href="#c"/></g></g><g transform="translate(133 341)"><g class="c1"><use href="#c"/></g></g><g transform="translate(167 341)"><g class="c2"><use href="#c"/></g></g><g transform="translate(201 341)"><g class="c3"><use href="#c"/></g></g>
<g transform="translate(378 218)"><g class="h1"><use href="#c"/></g></g><g transform="translate(426 218)"><g class="h2"><use href="#c"/></g></g><g transform="translate(474 218)"><g class="h3"><use href="#c"/></g></g><g transform="translate(522 218)"><g class="h4"><use href="#c"/></g></g>
<g transform="translate(378 266)"><g class="h2"><use href="#c"/></g></g><g transform="translate(426 266)"><g class="h3"><use href="#c"/></g></g><g transform="translate(474 266)"><g class="h4"><use href="#c"/></g></g><g transform="translate(522 266)"><g class="h1"><use href="#c"/></g></g>
<g transform="translate(378 314)"><g class="h3"><use href="#c"/></g></g><g transform="translate(426 314)"><g class="h4"><use href="#c"/></g></g><g transform="translate(474 314)"><g class="h1"><use href="#c"/></g></g><g transform="translate(522 314)"><g class="h2"><use href="#c"/></g></g>
<g transform="translate(378 362)"><g class="h4"><use href="#c"/></g></g><g transform="translate(426 362)"><g class="h1"><use href="#c"/></g></g><g transform="translate(474 362)"><g class="h2"><use href="#c"/></g></g><g transform="translate(522 362)"><g class="h3"><use href="#c"/></g></g>
<path d="M250 290H330" stroke="#212529" stroke-width="3"/><path d="M330 290l-14 -8v16z" fill="#212529"/>
<text x="290" y="276" font-size="20" fill="#212529" text-anchor="middle">ohřev</text>
<text x="150" y="420" font-size="20" fill="#212529" text-anchor="middle">pohyb pomalejší,</text>
<text x="150" y="446" font-size="20" fill="#212529" text-anchor="middle">mezery menší</text>
<text x="450" y="420" font-size="20" fill="#212529" text-anchor="middle">pohyb rychlejší,</text>
<text x="450" y="446" font-size="20" fill="#212529" text-anchor="middle">mezery větší</text>
<rect x="40" y="484" width="520" height="92" rx="10" fill="#fff" stroke="#868e96" stroke-width="2"/>
<text x="300" y="518" font-size="21" fill="#212529" text-anchor="middle">Stejný počet částic zabere víc místa.</text>
<text x="300" y="554" font-size="21" font-weight="bold" fill="#212529" text-anchor="middle">Objem se zvětší, hustota se zmenší.</text>
</svg>
