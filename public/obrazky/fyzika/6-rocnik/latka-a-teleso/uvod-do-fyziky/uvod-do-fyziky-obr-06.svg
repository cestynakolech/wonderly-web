<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tři karty vedle sebe, jak pracuje fyzik. Pozorování: oko se dívá na mrak s bleskem – zkoumá, jak se příroda chová. Pokus: kulička se kutálí po nakloněném prkně jako u Galilea – ověří hypotézu. Měření: pravítko a stopky – popisuje vlastnosti čísly. Šipky vedou ke kartičce: ověřené poznatky – fyzikální zákon. Animace: kulička se kutálí dolů a ručička stopek se otáčí.">
<style>
/* Podle PDF Úvod do fyziky, s. 2–3 (Hlavní pracovní metody: pozorování, pokus, měření; z ověřených poznatků
   fyzikální zákony) a výkladu (Galileo pouštěl kuličky po nakloněné rovině a měřil).
   Kulička: smyčka 4 s, 0–15 % stojí nahoře, 15–60 % zrychleně dolů (y ~ t²), pak dole. Ručička stopek 1 otáčka za 4 s.
   Bez animace (reduced-motion) = kulička dole, ručička svisle. */
@keyframes kut { 0%, 15% { transform: translate(-166px, -79px); animation-timing-function: cubic-bezier(0.33, 0, 0.67, 0.33); } 60%, 100% { transform: translate(0, 0); } }
@keyframes toc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.kul { animation: kut 4s infinite; }
.ruc { animation: toc 4s linear infinite; transform-origin: 790px 238px; }
@media (prefers-reduced-motion: reduce) { .kul, .ruc { animation: none; } }
</style>
<rect x="3" y="3" width="954" height="554" rx="14" fill="#f8f9fa"/>
<defs><radialGradient id="koule" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#495057"/></radialGradient>
<linearGradient id="prkno" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8b27a"/><stop offset="1" stop-color="#a0682c"/></linearGradient>
<linearGradient id="mrak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#868e96"/><stop offset="1" stop-color="#495057"/></linearGradient></defs>
<text x="480" y="42" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Jak pracuje fyzik?</text>
<rect x="30" y="66" width="270" height="340" rx="14" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="165" y="104" font-size="24" fill="#c92a2a" text-anchor="middle" font-weight="bold">Pozorování</text><text x="165" y="352" font-size="20" fill="#212529" text-anchor="middle">zkoumá, jak se</text><text x="165" y="380" font-size="20" fill="#212529" text-anchor="middle">příroda chová</text>
<rect x="345" y="66" width="270" height="340" rx="14" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="480" y="104" font-size="24" fill="#c92a2a" text-anchor="middle" font-weight="bold">Pokus</text><text x="480" y="352" font-size="20" fill="#212529" text-anchor="middle">ověří, zda platí</text><text x="480" y="380" font-size="20" fill="#212529" text-anchor="middle">hypotéza</text>
<rect x="660" y="66" width="270" height="340" rx="14" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="795" y="104" font-size="24" fill="#c92a2a" text-anchor="middle" font-weight="bold">Měření</text><text x="795" y="352" font-size="20" fill="#212529" text-anchor="middle">popisuje</text><text x="795" y="380" font-size="20" fill="#212529" text-anchor="middle">vlastnosti čísly</text>
