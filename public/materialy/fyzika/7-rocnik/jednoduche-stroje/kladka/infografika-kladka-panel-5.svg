		.p5-ruka { animation: p5ruka 8s infinite; }
		@keyframes p5ruka { 0%, 10% { transform: translateY(-140px); animation-timing-function: ease-in-out; } 45%, 70% { transform: none; animation-timing-function: ease-in-out; } 92%, 100% { transform: translateY(-140px); } }
		.p5-kv { transform-box: view-box; transform-origin: 200px 2942px; animation: p5kv 8s infinite; }
		@keyframes p5kv { 0%, 10% { transform: rotate(134deg); animation-timing-function: ease-in-out; } 45%, 70% { transform: rotate(0deg); animation-timing-function: ease-in-out; } 92%, 100% { transform: rotate(134deg); } }
		.p5-kp { transform-box: view-box; transform-origin: 260px 2842px; animation: p5kp 8s infinite; }
		@keyframes p5kp { 0%, 10% { transform: rotate(-267deg); animation-timing-function: ease-in-out; } 45%, 70% { transform: rotate(0deg); animation-timing-function: ease-in-out; } 92%, 100% { transform: rotate(-267deg); } }
		@media (prefers-reduced-motion: reduce) { .p5-vol, .p5-ruka, .p5-kv, .p5-kp { animation: none; } }
	</style>
