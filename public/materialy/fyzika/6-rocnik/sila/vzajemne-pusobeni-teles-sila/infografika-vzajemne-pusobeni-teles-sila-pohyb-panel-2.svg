		}
	</style>
	<rect x="0" y="0" width="460" height="612" fill="#f8f9fa" />
	<g id="panel-2">
		<rect x="26" y="22" width="420" height="578" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="578" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
