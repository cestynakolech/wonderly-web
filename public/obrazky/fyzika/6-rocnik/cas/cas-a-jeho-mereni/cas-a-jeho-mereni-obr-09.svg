<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Převody jednotek času: den, hodina, minuta, sekunda. Šipky doprava: krát 24 z dnů na hodiny, krát 60 z hodin na minuty, krát 60 z minut na sekundy. Šipky doleva: děleno 24, děleno 60, děleno 60. Platí 1 d = 24 h, 1 h = 60 min = 3 600 s, 1 min = 60 s. Pozor: 0,75 h není 75 minut, ale 45 minut.">
