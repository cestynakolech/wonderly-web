<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Čtyři krychle o stejné hmotnosti 1 kg na vahách: zlato s hustotou 19 300 kg/m³ má objem asi 52 cm³, železo 7 800 kg/m³ asi 128 cm³, hliník 2 700 kg/m³ asi 370 cm³, měď 8 900 kg/m³ asi 112 cm³. Nejmenší je zlato, největší hliník.">
<style>
/* Předloha: PDF Hustota — „Jak velká jsou tělesa o stejné hmotnosti 1 kg vyrobená z různých kovů?“: krychle různé velikosti,
   zelené rámečky s hustotou, oranžové štítky s objemem. Překresleno, ne kopie; hrany krychlí úměrné třetí odmocnině objemu.
   Objem = 1 000 000 : ρ (cm³, zaokrouhleno). Měď 8 900 kg/m³ (v PDF zde chybně 8 800, jinde 8 900 — objem 112 cm³ odpovídá 8 900). Statický obrázek. */
</style>
