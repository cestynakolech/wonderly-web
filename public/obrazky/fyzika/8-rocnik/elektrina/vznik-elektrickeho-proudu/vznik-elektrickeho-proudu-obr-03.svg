<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Nádoba s roztokem kuchyňské soli, do které jsou ponořené dvě desky připojené k baterii: vlevo k záporné svorce −, vpravo ke kladné svorce +. Červené kladné ionty se pohybují k záporné desce, modré záporné ionty ke kladné desce.">
<style>
/* Předloha: PDF lekce 20, str. 4 (nádoba s roztokem soli, vlevo deska −, vpravo deska +, kladné ionty se šipkou
   k −, záporné ionty se šipkou k +). Výklad: v roztocích solí proudí kladné a záporné ionty, kladné k −, záporné k +.
   Ionty plynou v pásech (120 px za 4 s, bez švu), šipka jede s iontem. Bez animace = koncový stav: ionty stojí, šipky vidět. */
.il { animation: il 4s linear infinite; }
.ir { animation: ir 4s linear infinite; }
@keyframes il { from { transform: translateX(0px); } to { transform: translateX(-120px); } }
@keyframes ir { from { transform: translateX(0px); } to { transform: translateX(120px); } }
@media (prefers-reduced-motion: reduce) { .il, .ir { animation: none; } }
</style>
