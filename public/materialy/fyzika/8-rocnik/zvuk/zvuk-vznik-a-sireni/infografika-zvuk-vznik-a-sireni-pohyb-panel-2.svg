<svg viewBox="0 0 460 640" width="460" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zvuk v pohybu 2/3, Závod zvuku látkami: chvějící se deska postrčí první částici a ta postrčí další. Ve vzduchu jsou částice daleko od sebe a postrčení postupuje nejpomaleji, rychlost 340 m/s. Ve vodě 1 500 m/s. V oceli jsou částice blízko a pevně vázané, zvuk je v cíli první, 5 000 m/s. Ve vakuu nejsou žádné částice, zvuk se nešíří, 0 m/s." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Zvuk v pohybu 2/3: Závod zvuku látkami</title>
	<!-- W86 (14. 10. 2026). Předloha: PDF 34 Zvuk, vznik a šíření zvuku, s. 1 („Těleso při chvění … stlačuje a zřeďuje částice …
	     Tyto změny v hustotě částic se šíří látkou postupně dál od zdroje“, „Zvuk se nešíří ve vakuu: nejsou zde žádné částice“)
	     a s. 5–6 („Nejrychleji se šíří v pevných látkách: částice jsou blízko u sebe a jsou vázány velkými silami ➪ reagují … velice
	     rychle“, „Nejpomaleji … v plynech: částice jsou velice daleko od sebe“, 340 / 1500 / 5000 / 0 m/s). Výklad: § Rychlost zvuku.
	     Statický obr-04 ukazuje délky pruhů; tady jde o děj: postrčení putuje částicemi (podélně, zhuštění).
	     Model: jedno postrčení za cyklus 8 s; částice se posune o 10 px doprava a zpět za 0,3 s. Rychlost čela úměrná skutečné:
	     ocel 900 px/s, voda 270 px/s (900·1500/5000), vzduch 61,2 px/s (900·340/5000). Do cíle (372 px od desky):
	     ocel 0,41 s, voda 1,38 s, vzduch 6,08 s. animation-delay = (x − 48) / v.
	     Barvy jako obr-04: vzduch #74c0fc, voda #4dabf7, ocel #868e96; oranžová = chvějící se těleso (jako W85 a panel 1).
	     Bez pohybu: částice v klidu, pořadí v cíli je vidět (popisky mají opacity 1). -->
	<style>
		.tl { animation: tl 8s linear infinite; }
		@keyframes tl { 0% { transform: translateX(0px); } 1.875% { transform: translateX(10px); } 3.75% { transform: translateX(0px); } 100% { transform: translateX(0px); } }
		.c1 { animation: c1 8s linear infinite; }
		.c2 { animation: c2 8s linear infinite; }
		.c3 { animation: c3 8s linear infinite; }
		@keyframes c1 { 0%, 5.1% { opacity: 0; } 5.2%, 97% { opacity: 1; } 100% { opacity: 0; } }
		@keyframes c2 { 0%, 17.1% { opacity: 0; } 17.2%, 97% { opacity: 1; } 100% { opacity: 0; } }
		@keyframes c3 { 0%, 75.9% { opacity: 0; } 76%, 97% { opacity: 1; } 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.tl, .c1, .c2, .c3 { animation: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="640" fill="#f8f9fa" />
	<g id="panel-2">
		<rect x="26" y="22" width="420" height="608" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="608" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Závod zvuku látkami</text>
		<text x="40" y="96" font-size="20" fill="#2b2a26">Chvějící se deska postrčí částici,</text>
		<text x="40" y="124" font-size="20" fill="#2b2a26">ta postrčí další… Kdo je dřív v cíli?</text>

		<!-- řádek 1: vzduch -->
		<text x="40" y="168" font-size="20" font-weight="bold" fill="#2b2a26">vzduch <tspan font-weight="normal" fill="#495057">340 m/s</tspan></text>
		<text class="c3" x="430" y="168" text-anchor="end" font-size="20" font-weight="bold" fill="#2b2a26">3. v cíli</text>
		<path d="M428 172V220" stroke="#495057" stroke-width="2" stroke-dasharray="5 4" />
		<rect class="tl" x="40" y="174" width="8" height="44" rx="2" fill="#e8590c" stroke="#2b2a26" stroke-width="2" />
		<g>
