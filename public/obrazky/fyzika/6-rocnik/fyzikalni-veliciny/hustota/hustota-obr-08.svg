<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: ponorka na hladině napustí vodu do nádrže — má větší hmotnost při stejném objemu, její hustota je větší než hustota vody, a proto klesá ke dnu. Pak vodu odčerpá, v nádrži je vzduch, hustota je menší než hustota vody a ponorka stoupá zpět k hladině.">
<style>
/* Předloha: PDF Hustota — fotka ponorky pod vodou (k textu: při ponoru načerpá do nádrží mořskou vodu, zvětší hmotnost při stejném
   objemu a zvýší celkovou hustotu nad hustotu okolní vody; při stoupání vodu odčerpá, v nádržích je vzduch, hustota menší).
   Fotka nahrazena kresbou ponorky s výřezem nádrže. Cyklus 12 s: 5–22 % nádrž se plní, 16–45 % ponorka klesá (posun 250 px),
   55–68 % voda se odčerpá (bubliny), 62–90 % ponorka stoupá k hladině. Šipka v panelu ukazuje právě probíhající krok.
   Bez animace = stav po ponoru (ponorka u dna, nádrž plná vody, obě vysvětlení). */
@keyframes ponorka { 0%, 16% { transform: translate(0, -250px); } 45%, 60% { transform: translate(0, 0); } 90%, 100% { transform: translate(0, -250px); } }
@keyframes nadrz { 0%, 5% { transform: scale(1, 0); } 22%, 55% { transform: scale(1, 1); } 68%, 100% { transform: scale(1, 0); } }
@keyframes bubliny { 0%, 55% { opacity: 0; transform: translate(0, 0); } 58% { opacity: 1; transform: translate(0, 0); } 70% { opacity: 1; transform: translate(0, -30px); } 72%, 100% { opacity: 0; transform: translate(0, -34px); } }
@keyframes zn1 { 0%, 4% { opacity: 0; } 5%, 50% { opacity: 1; } 52%, 100% { opacity: 0; } }
@keyframes zn2 { 0%, 54% { opacity: 0; } 55%, 98% { opacity: 1; } 100% { opacity: 0; } }
.ponorka { animation: ponorka 12s ease-in-out infinite; }
.nadrz { animation: nadrz 12s linear infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.bubliny { animation: bubliny 12s linear infinite; opacity: 0; }
.zn1 { animation: zn1 12s linear infinite; } .zn2 { animation: zn2 12s linear infinite; }
@media (prefers-reduced-motion: reduce) { .ponorka, .nadrz, .bubliny, .zn1, .zn2 { animation: none; } .zn2 { opacity: 0; } }
</style>
<defs>
<linearGradient id="more" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5d8ff"/><stop offset="1" stop-color="#74c0fc"/></linearGradient><linearGradient id="trup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#495057"/><stop offset="0.3" stop-color="#868e96"/><stop offset="0.6" stop-color="#495057"/><stop offset="1" stop-color="#212529"/></linearGradient><linearGradient id="vez" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#343a40"/><stop offset="0.4" stop-color="#868e96"/><stop offset="1" stop-color="#343a40"/></linearGradient>
</defs>
<rect x="3" y="3" width="954" height="674" rx="14" fill="#f8f9fa"/>
<rect x="3" y="80" width="954" height="120" fill="#e7f5ff"/><rect x="3" y="200" width="954" height="477" fill="url(#more)"/><path d="M3 570Q150 552 300 566T600 562T957 568V677H3Z" fill="#e3c99a"/><path d="M80 566q-10 -40 6 -70M92 564q14 -30 0 -56M560 564q-12 -36 4 -64M572 564q12 -28 -2 -50" fill="none" stroke="#2b8a3e" stroke-width="5" stroke-linecap="round"/><path d="M3 200q40 -8 80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t74 0" fill="none" stroke="#1971c2" stroke-width="4"/>
<text x="20" y="186" font-size="21" fill="#1864ab" font-weight="bold">hladina</text>
<g transform="translate(320 482)"><g class="ponorka"><path d="M-212 0C-206 -6 -196 -12 -186 -14L-232 -46L-240 -46L-226 0L-240 46L-232 46L-186 14C-196 12 -206 6 -212 0Z" fill="#343a40"/><ellipse cx="-244" cy="0" rx="8" ry="26" fill="#868e96" stroke="#212529" stroke-width="2"/><path d="M-215 0C-190 -32 -140 -48 -90 -48L150 -48C196 -48 222 -24 222 0C222 24 196 48 150 48L-90 48C-140 48 -190 32 -215 0Z" fill="url(#trup)" stroke="#212529" stroke-width="3"/><path d="M30 -48L42 -104H112L122 -48Z" fill="url(#vez)" stroke="#212529" stroke-width="3" stroke-linejoin="round"/><path d="M18 -82H52M104 -82H136" stroke="#343a40" stroke-width="6" stroke-linecap="round"/><path d="M86 -104V-140H104" fill="none" stroke="#343a40" stroke-width="5" stroke-linecap="round"/><path d="M-150 -30H170M-100 -48V48M0 -48V48M100 -48V48" stroke="#212529" stroke-width="1.5" opacity="0.4"/><rect x="-130" y="6" width="250" height="34" rx="8" fill="#eef2f7" stroke="#212529" stroke-width="2.5"/><rect class="nadrz" x="-128" y="8" width="246" height="30" rx="7" fill="#1971c2"/><rect x="-60" y="62" width="150" height="34" rx="8" fill="#fff" stroke="#212529" stroke-width="2"/><text x="15" y="86" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">nádrž</text><path d="M-30 62L-50 40" stroke="#212529" stroke-width="2.5"/><g class="bubliny"><circle cx="-60" cy="-56" r="6" fill="#fff" stroke="#1971c2" stroke-width="2"/><circle cx="-40" cy="-80" r="4" fill="#fff" stroke="#1971c2" stroke-width="2"/><circle cx="-70" cy="-100" r="5" fill="#fff" stroke="#1971c2" stroke-width="2"/></g></g></g>
<rect x="610" y="224" width="330" height="300" rx="12" fill="#fff" stroke="#212529" stroke-width="2.5"/><g class="zn1"><path d="M622 262l16 10l-16 10z" fill="#c92a2a"/></g><text x="646" y="280" font-size="22" fill="#c92a2a" font-weight="bold">Ponor: napustí vodu</text>
<text x="646" y="312" font-size="20" fill="#212529" >větší hmotnost, stejný objem</text>
<text x="646" y="340" font-size="20" fill="#212529" >⇨ hustota větší než voda</text>
<text x="646" y="368" font-size="22" fill="#c92a2a" font-weight="bold">⇨ klesá</text>
<g class="zn2"><path d="M622 402l16 10l-16 10z" fill="#237032"/></g><text x="646" y="420" font-size="22" fill="#237032" font-weight="bold">Vynoření: vodu odčerpá</text>
<text x="646" y="452" font-size="20" fill="#212529" >v nádržích je vzduch</text>
<text x="646" y="480" font-size="20" fill="#212529" >⇨ hustota menší než voda</text>
<text x="646" y="508" font-size="22" fill="#237032" font-weight="bold">⇨ stoupá</text>
<rect x="260" y="14" width="440" height="58" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="480" y="53" font-size="28" fill="#212529" text-anchor="middle">Jak se ponorka potopí a vynoří</text>

</svg>
