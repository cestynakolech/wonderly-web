<circle cx="494" cy="522" r="13" fill="#dee2e6" stroke="#495057" stroke-width="2"/><circle cx="490" cy="519" r="3" fill="#adb5bd"/><path d="M450 548 q 8 -12 16 0 t 16 0 t 16 0 t 16 0" fill="none" stroke="#1864ab" stroke-width="3.5" stroke-linecap="round"/><path d="M450 558 q 8 -12 16 0 t 16 0 t 16 0 t 16 0" fill="none" stroke="#1864ab" stroke-width="3.5" stroke-linecap="round"/><text x="480" y="594" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">přílivová</text><text x="480" y="622" font-size="18" fill="#212529" text-anchor="middle">otáčení Země</text>
