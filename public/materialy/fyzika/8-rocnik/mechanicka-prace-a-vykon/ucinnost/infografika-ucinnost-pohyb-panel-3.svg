<svg xmlns="http://www.w3.org/2000/svg" width="460" height="560" viewBox="0 0 460 560" role="img" aria-labelledby="title desc"><title id="title">Účinnost v pohybu 3/3: Kladkostroj v pohybu</title><desc id="desc">Tahový konec lana klesá dvakrát delší dráhou, než stoupá břemeno s volnou kladkou. Podle příkladu ve výkladu je účinnost přibližně 83 procent a ztráty přibližně 17 procent.</desc><style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;fill:#2b2a26} .nadpis{font-size:25px;font-weight:bold}.mensi{font-size:20px}.zelena{fill:#1e7031}.oranzova{fill:#b5400a}.cervena{fill:#c92a2a} .anim{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:linear} @media(prefers-reduced-motion:reduce){.anim{animation:none!important}}@keyframes zdvih{0%,15%{transform:translateY(0)}65%,85%{transform:translateY(-45px)}100%{transform:translateY(0)}}.zatez{animation-name:zdvih}@keyframes tah{0%,15%{transform:translateY(0)}65%,85%{transform:translateY(90px)}100%{transform:translateY(0)}}.tah{animation-name:tah}
@keyframes leva{0%,15%,100%{transform:scaleY(1)}65%,85%{transform:scaleY(.7428571429)}}.lanoL{animation-name:leva;transform-origin:234px 125px}
@keyframes stred{0%,15%,100%{transform:scaleY(1)}65%,85%{transform:scaleY(.6666666667)}}.lanoM{animation-name:stred;transform-origin:278px 165px}
@keyframes prava{0%,15%,100%{transform:scaleY(1)}65%,85%{transform:scaleY(2.5)}}.lanoP{animation-name:prava;transform-origin:322px 165px}
@keyframes pevna{0%,15%,100%{transform:rotate(0deg)}65%,85%{transform:rotate(234.4deg)}}.pevna{animation-name:pevna}</style><rect width="460" height="560" rx="18" fill="#f8f9fa"/><rect x="12" y="12" width="436" height="536" rx="12" fill="white" stroke="#ced4da"/><text x="28" y="50" class="nadpis" text-anchor="start">Kladkostroj v pohybu</text><text x="28" y="86" class="" text-anchor="start">Pevná a volná kladka</text><rect x="65" y="110" width="320" height="15" fill="#b59570"/>
<path d="M300 125 V143" stroke="#2b2a26" stroke-width="4"/><circle cx="300" cy="165" r="22" fill="#e3ebef" stroke="#2b2a26" stroke-width="3"/>
<g transform="translate(300 165)"><g class="anim pevna" stroke="#536775" stroke-width="3"><path d="M-17 0 H17 M0 -17 V17"/></g></g>
<path d="M234 125 V300" class="anim lanoL" stroke="#e8590c" stroke-width="4"/><path d="M278 165 V300" class="anim lanoM" stroke="#e8590c" stroke-width="4"/>
<path d="M278 165 A22 22 0 0 1 322 165" fill="none" stroke="#e8590c" stroke-width="4"/>
<path d="M322 165 V225" class="anim lanoP" stroke="#e8590c" stroke-width="4"/>
<g class="anim tah"><path d="M322 230 V252 M314 245 L322 253 330 245" fill="none" stroke="#e8590c" stroke-width="4"/></g>
<g class="anim zatez"><circle cx="256" cy="300" r="22" fill="#e3ebef" stroke="#2b2a26" stroke-width="3"/><path d="M234 300 A22 22 0 0 0 278 300" fill="none" stroke="#e8590c" stroke-width="4"/><path d="M256 300 V340" stroke="#2b2a26" stroke-width="4"/><rect x="216" y="340" width="80" height="48" rx="5" fill="#d8c0a5" stroke="#8d6e51" stroke-width="3"/><path d="M94 282 H192 L231 298 M224 290 L231 298 221 300" fill="none" stroke="#868e96" stroke-width="2"/><text x="28" y="287" class="mensi">volná</text><path d="M132 351 H213 M205 346 L213 351 205 356" fill="none" stroke="#868e96" stroke-width="2"/><text x="28" y="357" class="mensi">břemeno</text></g><text x="28" y="162" class="mensi" text-anchor="start">pevná kladka</text><path d="M160 155 H264 L278 165 M268 155 L278 165 266 167" fill="none" stroke="#868e96" stroke-width="2"/><text x="28" y="430" class="" text-anchor="start">Tah dolů zvedá břemeno.</text><text x="28" y="467" class="" text-anchor="start">Výkon je menší než příkon.</text><text x="28" y="501" class="" text-anchor="start">Účinnost přibližně 83 %</text><text x="28" y="532" class="mensi cervena" text-anchor="start">Ztráty třením přibližně 17 %.</text></svg>