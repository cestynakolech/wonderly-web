<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: převody jednotek délky. V řadě jsou jednotky km, m, dm, cm, mm. Mezi km a m jsou tři obloučky, mezi m a dm, dm a cm, cm a mm po jednom obloučku. Jeden oblouček je jedna nula. Na menší jednotku násobíme a nuly přidáváme, na větší jednotku dělíme a nuly škrtáme. Dole příklady: 1 km = 1 000 m, 1 m = 10 dm, 1 dm = 10 cm, 1 cm = 10 mm.">
<style>
/* Předloha: PDF Souhrnné opakování fyzikálních veličin — ručně psané „Převody jednotek délky“: km m dm cm mm,
   pod mezerami červené obloučky (3, 1, 1, 1). Překresleno, ne kopie; styl podle delka-obr-01.
   Legenda: červený oblouček = 1 nula, modrá = násobíme (na menší), zelená = dělíme (na větší).
   Cyklus 10 s: postupně se rozsvítí obloučky km→m, m→dm, dm→cm, cm→mm a s nimi příklady. Bez animace = koncový stav. */
@keyframes g1 { 0%, 6% { opacity: 0.35; } 12%, 94% { opacity: 1; } 100% { opacity: 0.35; } }
@keyframes g2 { 0%, 24% { opacity: 0.35; } 30%, 94% { opacity: 1; } 100% { opacity: 0.35; } }
@keyframes g3 { 0%, 42% { opacity: 0.35; } 48%, 94% { opacity: 1; } 100% { opacity: 0.35; } }
@keyframes g4 { 0%, 60% { opacity: 0.35; } 66%, 94% { opacity: 1; } 100% { opacity: 0.35; } }
.g1 { animation: g1 10s linear infinite; } .g2 { animation: g2 10s linear infinite; }
.g3 { animation: g3 10s linear infinite; } .g4 { animation: g4 10s linear infinite; }
@media (prefers-reduced-motion: reduce) { .g1, .g2, .g3, .g4 { animation: none; } }
</style>
<rect x="3" y="3" width="954" height="514" rx="14" fill="#f8f9fa"/>
<rect x="290" y="20" width="380" height="56" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="480" y="58" font-size="28" fill="#212529" text-anchor="middle">Převody jednotek délky</text>
<!-- násobky nad mezerami -->
<g font-size="24" font-weight="bold" fill="#1864ab" text-anchor="middle">
<text x="246" y="124" class="g1">· 1 000</text>
<text x="454" y="124" class="g2">· 10</text>
<text x="600" y="124" class="g3">· 10</text>
<text x="737" y="124" class="g4">· 10</text>
</g>
<!-- jednotky -->
<g font-size="44" font-weight="bold" fill="#a85a12" text-anchor="middle">
<text x="90" y="176">km</text>
<text x="390" y="176">m</text>
<text x="530" y="176">dm</text>
<text x="670" y="176">cm</text>
<text x="810" y="176">mm</text>
</g>
<!-- obloučky: 1 oblouček = 1 nula -->
<g fill="none" stroke="#c92a2a" stroke-width="5" stroke-linecap="round">
<g class="g1"><path d="M128,192 q39,48 78,0"/><path d="M206,192 q40,48 80,0"/><path d="M286,192 q39,48 78,0"/></g>
<path class="g2" d="M414,192 q41,48 82,0"/>
<path class="g3" d="M566,192 q35,48 70,0"/>
<path class="g4" d="M704,192 q35,48 70,0"/>
</g>
<text x="480" y="262" font-size="22" fill="#212529" text-anchor="middle">1 oblouček = 1 nula</text>
<!-- šipka na menší jednotku -->
<path d="M120 300H820" stroke="#1864ab" stroke-width="5"/><path d="M820 288L844 300L820 312Z" fill="#1864ab"/>
<text x="480" y="336" font-size="22" font-weight="bold" fill="#1864ab" text-anchor="middle">na menší jednotku: násobíme, nuly přidáváme</text>
<!-- šipka na větší jednotku -->
<path d="M140 370H840" stroke="#237032" stroke-width="5"/><path d="M140 358L116 370L140 382Z" fill="#237032"/>
<text x="480" y="406" font-size="22" font-weight="bold" fill="#237032" text-anchor="middle">na větší jednotku: dělíme, nuly škrtáme</text>
<!-- plaketky s příklady -->
<g font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">
<g class="g1"><rect x="40" y="432" width="202" height="56" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="141" y="469">1 km = 1 000 m</text></g>
<g class="g2"><rect x="266" y="432" width="202" height="56" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="367" y="469">1 m = 10 dm</text></g>
<g class="g3"><rect x="492" y="432" width="202" height="56" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="593" y="469">1 dm = 10 cm</text></g>
<g class="g4"><rect x="718" y="432" width="202" height="56" rx="12" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text x="819" y="469">1 cm = 10 mm</text></g>
</g>
</svg>
