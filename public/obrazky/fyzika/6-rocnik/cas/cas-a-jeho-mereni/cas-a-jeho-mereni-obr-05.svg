<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Mechanický stroj Pražského orloje z roku 1410: v tmavém železném rámu ze svislých a vodorovných trámů zapadají do sebe dvě velká ozubená kola s paprsky, uprostřed mají mosazné destičky se šroubem. Vlevo visí řetěz. Kola se pomalu otáčejí, každé na opačnou stranu.">
<style>
/* Ozubená kola se točí: velké kolo (60 zubů) jednou za 120 s po směru hodin, malé (30 zubů) dvakrát rychleji proti směru. Zuby do sebe stále zapadají.
   Bez animace (prefers-reduced-motion) kola stojí ve výchozí poloze. */
.kolo1 { transform-box: view-box; transform-origin: 400px 330px; animation: kolo1-k 120s linear infinite; }
.kolo2 { transform-box: view-box; transform-origin: 620.8px 457.5px; animation: kolo2-k 60s linear infinite; }
@keyframes kolo1-k { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes kolo2-k { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
@media (prefers-reduced-motion: reduce) { .kolo1, .kolo2 { animation: none; } }
</style>
