<svg xmlns="http://www.w3.org/2000/svg" width="460" height="470" viewBox="0 0 460 470" role="img" aria-label="Prohození měřicích vodičů"><title>Elektrické napětí a jeho měření 2/2: Prohození měřicích vodičů</title><style>text{font-family:Arial,sans-serif;fill:#212529}.a{animation:a 6s step-end infinite}.b{opacity:0;animation:b 6s step-end infinite}@keyframes a{0%{opacity:1}25%{opacity:0}75%,100%{opacity:1}}@keyframes b{0%{opacity:0}25%{opacity:1}75%,100%{opacity:0}}.slide{animation:slide 6s ease-in-out infinite}@keyframes slide{0%,3%{transform:translateY(65px)}25%,75%{transform:translateY(0)}100%{transform:translateY(65px)}}@media(prefers-reduced-motion:reduce){.a{animation:none;opacity:0}.b{animation:none;opacity:1}.slide{animation:none;transform:none}}</style><rect width="460" height="470" fill="#f8f9fa"/><rect x="10" y="10" width="440" height="450" rx="12" fill="#fff" stroke="#adb5bd"/><text x="230" y="48" font-size="25" text-anchor="middle">Prohození měřicích vodičů</text><text x="230" y="88" font-size="21" text-anchor="middle">Zdroj má stále stejné svorky.</text><rect x="115" y="120" width="230" height="80" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="3"/><text x="230" y="148" font-size="21" text-anchor="middle">Zdroj</text><text x="230" y="179" font-size="25" text-anchor="middle" style="fill:#0b7285">12 V</text><text x="140" y="147" font-size="25" text-anchor="middle" style="fill:#c92a2a">+</text><text x="320" y="147" font-size="25" text-anchor="middle" style="fill:#1864ab">−</text><g class="a"><path d="M140 190V260H165V300" stroke="#c92a2a" stroke-width="5" fill="none"/><path d="M320 190V260H295V300" stroke="#1864ab" stroke-width="5" fill="none"/></g><g class="b"><path d="M320 190L165 300" stroke="#fff" stroke-width="11" fill="none"/><path d="M320 190L165 300" stroke="#c92a2a" stroke-width="5" fill="none"/><path d="M140 190L295 300" stroke="#fff" stroke-width="11" fill="none"/><path d="M140 190L295 300" stroke="#1864ab" stroke-width="5" fill="none"/></g><circle cx="140" cy="190" r="7" fill="#c92a2a"/><circle cx="320" cy="190" r="7" fill="#1864ab"/><rect x="120" y="300" width="220" height="82" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="3"/><text x="165" y="326" font-size="22" text-anchor="middle" style="fill:#c92a2a">+</text><text x="295" y="326" font-size="22" text-anchor="middle" style="fill:#1864ab">−</text><g class="a"><text x="230" y="364" font-size="30" text-anchor="middle" style="fill:#0b7285">12 V</text></g><g class="b"><text x="230" y="364" font-size="30" text-anchor="middle" style="fill:#0b7285">−12 V</text></g><text x="230" y="410" font-size="21" text-anchor="middle">Digitální voltmetr</text><text x="230" y="442" font-size="20" text-anchor="middle">Prohození změní znaménko.</text></svg>