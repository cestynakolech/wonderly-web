<svg viewBox="0 1867 460 411" width="460" height="411" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tření ubírá energii: část mechanické energie se mění na vnitřní energii (zahřátí). Skateboardista na U rampě nevystoupá do výšky startu (čárkovaně); aby tam vyjel, musí vykonat práci." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Zákon zachování mechanické energie 5/5: Tření ubírá energii</title>
	<!-- Panel 5/5 výřezu z infografika-zakon-zachovani-mechanicke-energie.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.skejt { animation: skejt 9s infinite; }
		.trenistitek { animation: trenistitek 9s step-end infinite; }
		.pracestitek { animation: pracestitek 9s step-end infinite; }
		@keyframes skejt { 0% { transform: rotate(60deg); animation-timing-function: ease-in-out; } 15% { transform: rotate(-48deg); animation-timing-function: ease-in-out; } 30% { transform: rotate(38deg); animation-timing-function: ease-in-out; } 45% { transform: rotate(-30deg); animation-timing-function: ease-in-out; } 62% { transform: rotate(42deg); animation-timing-function: ease-in-out; } 80% { transform: rotate(-52deg); animation-timing-function: ease-in-out; } 100% { transform: rotate(60deg); } }
		@keyframes trenistitek { 0% { opacity: 1; } 45%, 100% { opacity: 0; } }
		@keyframes pracestitek { 0% { opacity: 0; } 45%, 100% { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) {
			.skejt, .trenistitek, .pracestitek { animation: none; }
		}
	</style>
	<rect x="0" y="1867" width="460" height="411" fill="#f3f1ea" />
	<g id="panel-5" transform="translate(0,1877)">
		<rect x="26" y="6" width="420" height="385" rx="10" fill="#2b2a26" />
		<rect x="20" y="0" width="420" height="385" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="34" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="41" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">5</text>
		<text x="80" y="43" font-size="28" font-weight="bold" fill="#2b2a26">Tření ubírá energii</text>
		<text x="40" y="80" font-size="21" fill="#2b2a26">Část mechanické energie se mění</text>
		<text x="40" y="106" font-size="21" fill="#2b2a26">na <tspan font-weight="bold">vnitřní energii</tspan> (zahřátí).</text>

		<!-- U rampa: oblouk r = 150 kolem (230, 110), konce ±70°, plošiny, plné těleso až na zem -->
		<path d="M 50 161.3 L 89 161.3 A 150 150 0 0 0 371 161.3 L 410 161.3 L 410 272 L 50 272 Z" fill="#d9a066" stroke="#2b2a26" stroke-width="2.5" stroke-linejoin="round" />
		<path d="M 89 161.3 A 150 150 0 0 0 371 161.3" fill="none" stroke="#6b4423" stroke-width="3" />
		<line x1="70" y1="190" x2="70" y2="272" stroke="#a9824f" stroke-width="2" />
		<line x1="390" y1="190" x2="390" y2="272" stroke="#a9824f" stroke-width="2" />
		<circle cx="89" cy="161.3" r="4" fill="#adb5bd" stroke="#2b2a26" stroke-width="1.5" />
		<circle cx="371" cy="161.3" r="4" fill="#adb5bd" stroke="#2b2a26" stroke-width="1.5" />
		<rect x="34" y="272" width="392" height="10" fill="#c9a77c" stroke="#2b2a26" stroke-width="1.5" />
		<!-- výška startu (60°): kola ve výšce 110 + 145·cos 60° = 182,5 -->
		<line x1="96" y1="182.5" x2="364" y2="182.5" stroke="#1e7a34" stroke-width="2.5" stroke-dasharray="8 6" />
		<!-- štítek fáze: nejdřív tření ubírá, pak se odráží (koná práci) -->
		<text class="trenistitek" x="230" y="140" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a26">tření ubírá</text>
		<text class="pracestitek" x="230" y="140" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b" opacity="0">koná práci</text>
		<!-- skateboardista: prkno i postava v jedné otáčené skupině, kola vždy na povrchu -->
		<g transform="translate(230,110)">
			<g class="skejt" transform="rotate(-48)">
				<circle cx="-10" cy="145" r="4" fill="#495057" stroke="#2b2a26" stroke-width="1" />
				<circle cx="10" cy="145" r="4" fill="#495057" stroke="#2b2a26" stroke-width="1" />
				<rect x="-17" y="137" width="34" height="5" rx="2.5" fill="#2b2a26" />
				<line x1="-5" y1="137" x2="-3" y2="116" stroke="#495057" stroke-width="6" stroke-linecap="round" />
				<line x1="6" y1="137" x2="4" y2="116" stroke="#495057" stroke-width="6" stroke-linecap="round" />
				<rect x="-8" y="94" width="16" height="24" rx="5" fill="#a5673f" stroke="#2b2a26" stroke-width="1.5" />
				<line x1="-7" y1="99" x2="-20" y2="110" stroke="#a5673f" stroke-width="5" stroke-linecap="round" />
				<line x1="7" y1="99" x2="20" y2="110" stroke="#a5673f" stroke-width="5" stroke-linecap="round" />
				<circle cx="0" cy="85" r="8" fill="#f1c27d" stroke="#2b2a26" stroke-width="1.5" />
				<path d="M -9 85 A 9 9 0 0 1 9 85 Z" fill="#fab005" stroke="#2b2a26" stroke-width="1.5" />
			</g>
		</g>
		<text x="40" y="316" font-size="21" fill="#2b2a26">Skateboardista nevystoupá do</text>
		<text x="40" y="342" font-size="21" fill="#2b2a26">výšky startu (<tspan fill="#1e7a34" font-weight="bold">čárkovaně</tspan>). Aby tam</text>
		<text x="40" y="368" font-size="21" fill="#2b2a26">vyjel, musí <tspan font-weight="bold">vykonat práci</tspan>.</text>
	</g>
</svg>
