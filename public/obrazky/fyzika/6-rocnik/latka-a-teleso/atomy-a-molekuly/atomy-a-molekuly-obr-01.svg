<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Atom helia. Uprostřed je jádro atomu se 2 protony a 2 neutrony, kolem je obal atomu se 2 elektrony. Atom se skládá z ještě menších částeček. Animace: elektrony obíhají kolem jádra.">
<style>
.ob { transform-origin: 360px 390px; animation: ob 10s linear infinite; }
@keyframes ob { to { transform: rotate(360deg); } }
.pr { transform-box: fill-box; transform-origin: center; animation: pr 10s linear infinite; }
@keyframes pr { to { transform: rotate(-360deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
/* Překresleno k výkladu „atom se skládá z ještě menších částeček“; styl částic jako jadro-atomu (9. ročník).
   Helium jako u balonku: 2 protony, 2 neutrony, 2 elektrony. Animace: elektrony obíhají jádro (10 s).
   Bez animace = elektrony v klidu na dráze. */
</style>
<defs><radialGradient id="gH" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#f7f8fa"/><stop offset="0.16" stop-color="#f1f3f5"/><stop offset="0.78" stop-color="#f1f3f5"/><stop offset="1" stop-color="#adb5bd"/></radialGradient><radialGradient id="gO" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#e78d8d"/><stop offset="0.16" stop-color="#d32f2f"/><stop offset="0.78" stop-color="#d32f2f"/><stop offset="1" stop-color="#891f1f"/></radialGradient><radialGradient id="gC" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#8f9396"/><stop offset="0.16" stop-color="#343a40"/><stop offset="0.78" stop-color="#343a40"/><stop offset="1" stop-color="#22262a"/></radialGradient><radialGradient id="gN" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#93a5eb"/><stop offset="0.16" stop-color="#3b5bdb"/><stop offset="0.78" stop-color="#3b5bdb"/><stop offset="1" stop-color="#263b8e"/></radialGradient><radialGradient id="gCl" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#acebb7"/><stop offset="0.16" stop-color="#69db7c"/><stop offset="0.78" stop-color="#69db7c"/><stop offset="1" stop-color="#448e51"/></radialGradient><radialGradient id="gNa" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#b09af2"/><stop offset="0.16" stop-color="#7048e8"/><stop offset="0.78" stop-color="#7048e8"/><stop offset="1" stop-color="#492f97"/></radialGradient><radialGradient id="gHe" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#fddf80"/><stop offset="0.16" stop-color="#fcc419"/><stop offset="0.78" stop-color="#fcc419"/><stop offset="1" stop-color="#a47f10"/></radialGradient><radialGradient id="gP" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#fbab77"/><stop offset="0.16" stop-color="#f76707"/><stop offset="0.78" stop-color="#f76707"/><stop offset="1" stop-color="#a14305"/></radialGradient></defs>
<rect x="3" y="3" width="714" height="694" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/><text x="360.0" y="44" font-size="28" fill="#212529" text-anchor="middle" font-weight="bold">Atom helia</text><text x="360.0" y="78" font-size="20" fill="#495057" text-anchor="middle">Atom se skládá z ještě menších částeček.</text><g><circle cx="70" cy="122" r="13" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M62.9 122H77.2M70 114.8V129.2" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g><text x="92" y="130" font-size="21" fill="#212529">proton p<tspan font-size="15" dy="-9">+</tspan><tspan dy="9"></tspan></text><circle cx="270" cy="122" r="13" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><text x="292" y="130" font-size="21" fill="#212529">neutron n<tspan font-size="15" dy="-9">0</tspan><tspan dy="9"></tspan></text><g><circle cx="480" cy="122" r="11" fill="#1864ab" stroke="#212529" stroke-width="1.5"/><path d="M473.9 122H486.1" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g><text x="500" y="130" font-size="21" fill="#212529">elektron e<tspan font-size="15" dy="-9">−</tspan><tspan dy="9"></tspan></text><circle cx="360" cy="390" r="205" fill="#e9ecef" stroke="#868e96" stroke-width="2.5"/><circle cx="360" cy="390" r="160" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="6 7"/><circle cx="360" cy="390" r="46" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><circle cx="347" cy="377" r="13" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><g><circle cx="373" cy="377" r="13" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M365.9 377H380.1M373 369.9V384.1" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g><g><circle cx="347" cy="403" r="13" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M339.9 403H354.1M347 395.9V410.1" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g><circle cx="373" cy="403" r="13" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><g class="ob"><g class="pr"><circle cx="520" cy="390" r="11" fill="#1864ab" stroke="#212529" stroke-width="1.5"/><path d="M514.0 390H526.0" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g><g class="pr"><circle cx="200" cy="390" r="11" fill="#1864ab" stroke="#212529" stroke-width="1.5"/><path d="M193.9 390H206.1" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g></g><line x1="394" y1="358" x2="600" y2="212" stroke="#212529" stroke-width="2"/><text x="700" y="200" font-size="22" fill="#212529" text-anchor="end" font-weight="bold">jádro atomu</text><line x1="180" y1="294" x2="110" y2="212" stroke="#212529" stroke-width="2"/><text x="20" y="200" font-size="22" fill="#212529" text-anchor="start" font-weight="bold">obal atomu</text><text x="360.0" y="640" font-size="20" fill="#495057" text-anchor="middle">Jádro je ve skutečnosti mnohem menší,</text><text x="360.0" y="668" font-size="20" fill="#495057" text-anchor="middle">než je nakreslené.</text>
</svg>
