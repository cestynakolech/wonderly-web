<svg viewBox="0 0 460 640" width="460" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Optická čočka v pohybu 2/3, Víc dioptrií, víc láme: na spojku dopadá svazek rovnoběžných paprsků. Spojka se postupně třikrát víc zakřiví. Málo zakřivená spojka spojí paprsky v ohnisku F´ daleko za čočkou, víc zakřivená blíž a nejvíc zakřivená nejblíž. Ohnisková vzdálenost f se zkracuje. Čím víc dioptrií, tím je čočka zakřivenější a víc láme paprsky." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Optická čočka v pohybu 2/3: Víc dioptrií, víc láme</title>
	<!-- W88 (14. 10. 2026). Předloha: PDF 25 Čočky, spojky, rozptylky, s. 7 („Optická mohutnost čočky: udává počet
	     dioptrií … čím více má čočka dioptrií, tím je čočka mohutnější a zakřivenější a tím více láme paprsky“,
	     „Ohnisková vzdálenost f: vzdálenost ohniska od optického středu“), s. 8 (pět rovnoběžných paprsků zleva,
	     svislá spojka, ohnisko F´ za čočkou, optická osa čerchovaná). Výklad: „čím víc dioptrií, tím je čočka
	     zakřivenější a víc láme paprsky“. Čísla dioptrií výklad nemá — nečíslují se.
	     Geometrie: spojka x = 170, osa y = 290, paprsky y = 230, 260, 290, 320, 350. Tři stavy f = 150, 100, 60 px
	     (F´ x = 320, 270, 230), poloviční tloušťka čočky 8, 12, 20 px (scaleX 1 / 1,5 / 2,5) – OPRAVA 1: f · tloušťka = 1200
	     ve všech stavech (ohnisková vzdálenost nepřímo úměrná zakřivení, víc dioptrií = kratší f).
	     Úhel paprsku za čočkou = atan(dy / f): f 150 → 21,80° a 11,31°; f 100 → 30,96° a 16,70°; f 60 → 45,00° a 26,57°;
	     každý paprsek končí 90 px za F´ (délka = √(f² + dy²) + 90). Šipka jen na krajních a středním paprsku.
	     Cyklus 12 s, 3 stavy po 4 s (záporné zpoždění 0 / −8 / −4 s): 0–0,6 s čočka se zakřiví, 0,6–1,2 s paprsky
	     doletí k čočce, 1,2–1,8 s za čočku, od 1,8 s F´, f a popisek; do 4 s stojí. Bez pohybu: první stav. -->
	<style>
		.lz { animation: lz 12s linear infinite; }
		@keyframes lz { 0% { transform: scaleX(2.5); } 5% { transform: scaleX(1); } 33.333% { transform: scaleX(1); } 38.333% { transform: scaleX(1.5); } 66.667% { transform: scaleX(1.5); } 71.667% { transform: scaleX(2.5); } 100% { transform: scaleX(2.5); } }
		.ri { animation: ri 4s linear infinite; }
		@keyframes ri { 0% { transform: scaleX(0); } 15% { transform: scaleX(0); } 30% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
		.s { opacity: 0; animation: s 12s step-end infinite; }
		@keyframes s { 0% { opacity: 1; } 33.333% { opacity: 0; } 100% { opacity: 0; } }
		.ro { animation: ro 12s linear infinite; }
		@keyframes ro { 0% { transform: scaleX(0); } 10% { transform: scaleX(0); } 15% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
		.u { animation: u 12s step-end infinite; }
		@keyframes u { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 1; } }
		.k1 { animation-delay: -8s; }
		.k2 { animation-delay: -4s; }
		@media (prefers-reduced-motion: reduce) {
			.lz, .ri, .s, .ro, .u { animation: none; }
			.s { opacity: 0; }
			.s.k0 { opacity: 1; }
		}
	</style>
	<rect x="0" y="0" width="460" height="640" fill="#f8f9fa" />
	<g id="panel-2">
		<rect x="26" y="22" width="420" height="608" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="608" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Víc dioptrií, víc láme</text>
		<text x="40" y="96" font-size="20" fill="#2b2a26">Spojku vyměníme za zakřivenější.</text>
		<text x="40" y="120" font-size="20" fill="#2b2a26">Kam se posune ohnisko F´?</text>

		<!-- optická osa (čerchovaná) -->
		<path d="M30 290H430" stroke="#495057" stroke-width="2" stroke-dasharray="14 5 3 5" />

		<!-- spojka: uprostřed nejširší, zakřivuje se -->
		<g transform="translate(170,0)">
			<g class="lz">
				<path d="M0 205Q16 290 0 375Q-16 290 0 205Z" fill="#c3fae8" fill-opacity="0.75" stroke="#0b7285" stroke-width="2.5" vector-effect="non-scaling-stroke" />
			</g>
		</g>
		<text x="170" y="196" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a26">spojka</text>

		<!-- rovnoběžné paprsky k čočce -->
		<g transform="translate(40,0)">
			<g class="ri" stroke="#c2410c" stroke-width="4">
				<path d="M0 230H130M0 260H130M0 290H130M0 320H130M0 350H130" />
			</g>
		</g>

		<!-- stav 1: málo zakřivená, f = 150 -->
		<g class="s k0">
			<g transform="translate(170,230) rotate(21.80)"><g class="ro k0"><path d="M0 0H251.6" stroke="#c2410c" stroke-width="4" /></g><path class="u k0" d="M251.6 0l-16 -8v16z" fill="#c2410c" /></g>
			<g transform="translate(170,260) rotate(11.31)"><g class="ro k0"><path d="M0 0H243" stroke="#c2410c" stroke-width="4" /></g></g>
			<g transform="translate(170,290)"><g class="ro k0"><path d="M0 0H240" stroke="#c2410c" stroke-width="4" /></g><path class="u k0" d="M240 0l-16 -8v16z" fill="#c2410c" /></g>
			<g transform="translate(170,320) rotate(-11.31)"><g class="ro k0"><path d="M0 0H243" stroke="#c2410c" stroke-width="4" /></g></g>
			<g transform="translate(170,350) rotate(-21.80)"><g class="ro k0"><path d="M0 0H251.6" stroke="#c2410c" stroke-width="4" /></g><path class="u k0" d="M251.6 0l-16 -8v16z" fill="#c2410c" /></g>
			<g class="u k0">
				<path d="M320 280V300" stroke="#2b2a26" stroke-width="3" />
				<text x="320" y="346" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a26">F´</text>
				<path d="M170 396V412M170 404H320M320 396V412" stroke="#2b2a26" stroke-width="2" />
				<text x="245" y="434" text-anchor="middle" font-size="21" font-weight="bold" font-style="italic" fill="#2b2a26">f</text>
				<text x="40" y="478" font-size="22" font-weight="bold" fill="#2b2a26">Málo zakřivená spojka:</text>
				<text x="40" y="506" font-size="20" fill="#2b2a26">ohnisko F´ je daleko.</text>
			</g>
		</g>

		<!-- stav 2: víc zakřivená, f = 100 -->
		<g class="s k1">
			<g transform="translate(170,230) rotate(30.96)"><g class="ro k1"><path d="M0 0H206.6" stroke="#c2410c" stroke-width="4" /></g><path class="u k1" d="M206.6 0l-16 -8v16z" fill="#c2410c" /></g>
			<g transform="translate(170,260) rotate(16.70)"><g class="ro k1"><path d="M0 0H194.4" stroke="#c2410c" stroke-width="4" /></g></g>
			<g transform="translate(170,290)"><g class="ro k1"><path d="M0 0H190" stroke="#c2410c" stroke-width="4" /></g><path class="u k1" d="M190 0l-16 -8v16z" fill="#c2410c" /></g>
			<g transform="translate(170,320) rotate(-16.70)"><g class="ro k1"><path d="M0 0H194.4" stroke="#c2410c" stroke-width="4" /></g></g>
			<g transform="translate(170,350) rotate(-30.96)"><g class="ro k1"><path d="M0 0H206.6" stroke="#c2410c" stroke-width="4" /></g><path class="u k1" d="M206.6 0l-16 -8v16z" fill="#c2410c" /></g>
			<g class="u k1">
				<path d="M270 280V300" stroke="#2b2a26" stroke-width="3" />
				<text x="270" y="346" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a26">F´</text>
				<path d="M170 396V412M170 404H270M270 396V412" stroke="#2b2a26" stroke-width="2" />
				<text x="220" y="434" text-anchor="middle" font-size="21" font-weight="bold" font-style="italic" fill="#2b2a26">f</text>
				<text x="40" y="478" font-size="22" font-weight="bold" fill="#2b2a26">Víc zakřivená spojka:</text>
				<text x="40" y="506" font-size="20" fill="#2b2a26">ohnisko F´ je blíž.</text>
			</g>
		</g>

		<!-- stav 3: nejvíc zakřivená, f = 60 -->
		<g class="s k2">
			<g transform="translate(170,230) rotate(45.00)"><g class="ro k2"><path d="M0 0H174.9" stroke="#c2410c" stroke-width="4" /></g><path class="u k2" d="M174.9 0l-16 -8v16z" fill="#c2410c" /></g>
			<g transform="translate(170,260) rotate(26.57)"><g class="ro k2"><path d="M0 0H157.1" stroke="#c2410c" stroke-width="4" /></g></g>
			<g transform="translate(170,290)"><g class="ro k2"><path d="M0 0H150" stroke="#c2410c" stroke-width="4" /></g><path class="u k2" d="M150 0l-16 -8v16z" fill="#c2410c" /></g>
			<g transform="translate(170,320) rotate(-26.57)"><g class="ro k2"><path d="M0 0H157.1" stroke="#c2410c" stroke-width="4" /></g></g>
			<g transform="translate(170,350) rotate(-45.00)"><g class="ro k2"><path d="M0 0H174.9" stroke="#c2410c" stroke-width="4" /></g><path class="u k2" d="M174.9 0l-16 -8v16z" fill="#c2410c" /></g>
			<g class="u k2">
				<path d="M230 280V300" stroke="#2b2a26" stroke-width="3" />
				<text x="230" y="346" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a26">F´</text>
				<path d="M170 396V412M170 404H230M230 396V412" stroke="#2b2a26" stroke-width="2" />
				<text x="200" y="434" text-anchor="middle" font-size="21" font-weight="bold" font-style="italic" fill="#2b2a26">f</text>
				<text x="40" y="478" font-size="22" font-weight="bold" fill="#2b2a26">Nejvíc zakřivená spojka:</text>
				<text x="40" y="506" font-size="20" fill="#2b2a26">ohnisko F´ je nejblíž.</text>
			</g>
		</g>

		<text x="40" y="572" font-size="20" fill="#2b2a26">Čím víc dioptrií, tím je čočka</text>
		<text x="40" y="598" font-size="20" fill="#2b2a26">zakřivenější a víc láme paprsky.</text>
	</g>
</svg>
