<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t01">
  <title id="t01">Lom světla ke kolmici: paprsek přechází ze vzduchu do vody a láme se ke kolmici dopadu, úhel lomu β je menší než úhel dopadu α</title>
  <style>
    .d1{animation:d1 8s linear infinite}
    .d2{animation:d2 8s linear infinite}
    .a1{animation:a1 8s linear infinite}
    .a2{animation:a2 8s linear infinite}
    .f{animation:f 8s linear infinite}
    @keyframes d1{0%{stroke-dashoffset:100;opacity:1}25%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes d2{0%,30%{stroke-dashoffset:100;opacity:1}55%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes a1{0%,24%{opacity:0}26%,92%{opacity:1}98%,100%{opacity:0}}
    @keyframes a2{0%,54%{opacity:0}56%,92%{opacity:1}98%,100%{opacity:0}}
    @keyframes f{0%,58%{opacity:0}68%,92%{opacity:1}98%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.d1,.d2,.a1,.a2,.f{animation:none}}
  </style>
  <!-- prostředí -->
  <rect x="0" y="0" width="600" height="230" fill="#f1f8ff"/>
  <rect x="0" y="230" width="600" height="210" fill="#a5d8ff"/>
  <line x1="0" y1="230" x2="600" y2="230" stroke="#1971c2" stroke-width="2"/>
  <text x="300" y="32" text-anchor="middle" font-size="24" font-weight="bold" fill="#212529">vzduch → voda: lom KE kolmici</text>
  <text x="30" y="205" font-size="22" fill="#212529">vzduch</text>
  <text x="30" y="266" font-size="22" font-weight="bold" fill="#0b3d6b">voda</text>
  <!-- kolmice dopadu -->
  <line x1="300" y1="50" x2="300" y2="430" stroke="#212529" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="310" y="72" font-size="22" font-style="italic" fill="#212529">k</text>
  <!-- úhly a směr bez lomu (objeví se po lomu) -->
  <g class="f">
    <line x1="300" y1="230" x2="430.2" y2="339.3" stroke="#495057" stroke-width="2.5" stroke-dasharray="4 6"/>
    <path d="M300,230 L300,170 A60,60 0 0,0 254.0,191.4 Z" fill="#d0bfff" stroke="#7048e8" stroke-width="2"/>
    <path d="M300,230 L300,290 A60,60 0 0,0 334.6,279.0 Z" fill="#ffe066" stroke="#e67700" stroke-width="2"/>
    <text x="264" y="161" text-anchor="middle" font-size="24" font-weight="bold" fill="#5f3dc4">α</text>
    <text x="327" y="320" text-anchor="middle" font-size="24" font-weight="bold" fill="#5c3c00">β</text>
  </g>
  <!-- paprsky -->
  <line class="d1" x1="146.8" y1="101.4" x2="300" y2="230" pathLength="100" stroke-dasharray="100" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
  <polygon class="a1" points="223.4,165.7 202.3,159.8 213.9,146.0" fill="#e8590c"/>
  <line class="d2" x1="300" y1="230" x2="408.1" y2="383.2" pathLength="100" stroke-dasharray="100" stroke="#e8590c" stroke-width="4" stroke-linecap="round"/>
  <polygon class="a2" points="415.2,393.5 396.3,382.3 411.0,372.0" fill="#e8590c"/>
  <!-- legenda -->
  <g class="f" font-size="22" fill="#0b3d6b">
    <text x="20" y="306"><tspan font-weight="bold" fill="#5f3dc4">α</tspan> úhel dopadu</text>
    <text x="20" y="334"><tspan font-weight="bold" fill="#5c3c00">β</tspan> úhel lomu</text>
    <text x="20" y="362"><tspan font-style="italic">k</tspan> kolmice dopadu</text>
    <line x1="20" y1="383" x2="56" y2="383" stroke="#495057" stroke-width="2.5" stroke-dasharray="4 6"/>
    <text x="64" y="390">směr bez lomu</text>
    <text x="20" y="424" font-weight="bold">β je menší než α</text>
  </g>
</svg>
