<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Nahoře skutečný obvod: baterie, žárovka v objímce a páčkový spínač spojené vodiči. Dole jeho schéma: značka článku s kladnou a zápornou svorkou, spínač a žárovka jako kolečko s křížkem. Když je spínač otevřený, obvod je přerušený a žárovka nesvítí. Po zavření spínače je obvod uzavřený a žárovka svítí. Animace: spínač se zavře, žárovka se rozsvítí, pak se spínač zase otevře.">
<style>
/* Předloha: PDF lekce 22, s. 2 (skutečný obvod: žárovka v objímce, baterie, páčkový spínač; otevřený / zavřený)
   a s. 4 + 7 (schéma: článek vlevo, spínač nahoře, žárovka vpravo; nesvítí / svítí).
   6 s: 0–30 % spínač otevřený, žárovka nesvítí; 30–36 % páčka dosedne; 36–85 % obvod uzavřený, žárovka svítí;
   85–91 % páčka se zvedne a žárovka zhasne; do 100 % otevřený.
   Bez animace (reduced-motion) = koncový stav děje: spínač zavřený, žárovka svítí. */
.pa { transform-origin: 432px 226px; animation: pa 6s ease-in-out infinite; }
.ps { transform-origin: 260px 400px; animation: ps 6s ease-in-out infinite; }
@keyframes pa { 0%, 30% { transform: rotate(-28deg); } 36%, 85% { transform: rotate(0deg); } 91%, 100% { transform: rotate(-28deg); } }
@keyframes ps { 0%, 30% { transform: rotate(-22deg); } 36%, 85% { transform: rotate(0deg); } 91%, 100% { transform: rotate(-22deg); } }
.lit-a { animation: sv 6s step-end infinite; }
.sz { animation: sv 6s step-end infinite; }
.so { opacity: 0; animation: tm 6s step-end infinite; }
@keyframes sv { 0% { opacity: 0; } 36% { opacity: 1; } 86% { opacity: 0; } }
@keyframes tm { 0% { opacity: 1; } 36% { opacity: 0; } 86% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pa, .ps, .lit-a, .sz, .so { animation: none; } }
</style>
