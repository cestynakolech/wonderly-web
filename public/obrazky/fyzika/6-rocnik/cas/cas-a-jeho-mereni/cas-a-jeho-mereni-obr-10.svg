<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Výpočet doby trvání cesty vlakem. Na první stanici ukazují hodiny odjezd t1 = 8 h 20 min, na druhé stanici příjezd t2 = 10 h 50 min. Vlak jede od první stanice ke druhé. Doba trvání cesty t = t2 − t1 = 10 h 50 min − 8 h 20 min = 2 h 30 min.">
<style>
/* Vlak odjede z první stanice a dojede do druhé (10 s, smyčka). Bez animace stojí vlak v cíli. */
.vlak { animation: vlak-k 10s ease-in-out infinite; }
@keyframes vlak-k { 0%, 10% { transform: translateX(-520px); } 80%, 100% { transform: translateX(0px); } }
@media (prefers-reduced-motion: reduce) { .vlak { animation: none; } }
</style>
