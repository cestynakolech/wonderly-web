			<!-- luk: úchop 226,302; ramena se při napínání otočí, tětiva vede z konců ramen do ruky -->
			<g transform="translate(226 302)">
				<g class="c2rh" transform="rotate(-10)">
					<path d="M0 -12C12 -40 6 -74 -34 -92" fill="none" stroke="#8a5a2b" stroke-width="6" stroke-linecap="round" />
