db5bd" stroke="#212529" stroke-width="1.5"/><g><circle cx="121.1" cy="196" r="15" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M112.9 196H129.4M121.1 187.8V204.2" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><text x="266" y="184.6" font-size="36" font-weight="bold" fill="#212529" text-anchor="end">12</text><text x="266" y="227.8" font-size="36" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="270" y="222" font-size="72" font-weight="bold" fill="#212529">C</text><text x="370" y="180" font-size="22" font-weight="bold" fill="#c92a2a" text-anchor="start">6 protonů</text><text x="370" y="214" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">6 neutronů</text><text x="370" y="248" font-size="20" fill="#495057" text-anchor="start">12 − 6 = 6</text><rect x="22" y="292" width="556" height="170" rx="12" fill="#fff" stroke="#adb5bd" stroke-width="2"/><circle class="nv2" cx="166.5" cy="364.6" r="15" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle class="nv1" cx="61.8" cy="349.1" r="15" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="126" cy="428" r="15" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><g><circle cx="131.6" cy="330.8" r="15" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M123.4 330.8H139.9M131.6 322.5V339" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><circle cx="65.1" cy="395.5" r="15" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><g><circle cx="153.1" cy="392.8" r="15" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M144.9 392.8H161.4M153.1 384.5V401" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><circle cx="90.1" cy="338.7" r="15" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><g><circle cx="99.6" cy="415.8" r="15" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M91.3 415.8H107.8M99.6 407.5V424" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><circle cx="141.2" cy="357.2" r="15" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><g><circle cx="77.1" cy="371.2" r="15" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M68.9 371.2H85.4M77.1 362.9V379.4" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><circle cx="127.9" cy="400.4" r="15" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><g><circle cx="112.2" cy="352.2" r="15" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M103.9 352.2H120.4M112.2 343.9V360.4" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><circle cx="95.8" cy="390" r="15" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><g><circle cx="121.1" cy="377" r="15" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M112.9 377H129.4M121.1 368.8V385.2" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><text x="266" y="365.6" font-size="36" font-weight="bold" fill="#212529" text-anchor="end">14</text><text x="266" y="408.8" font-size="36" font-weight="bold" fill="#212529" text-anchor="end">6</text><text x="270" y="403" font-size="72" font-weight="bold" fill="#212529">C</text><text x="370" y="360" font-size="22" font-weight="bold" fill="#c92a2a" text-anchor="start">6 protonů</text><text x="370" y="394" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">8 neutronů</text><text x="370" y="428" font-size="20" fill="#495057" text-anchor="start">14 − 6 = 8</text><rect x="22" y="480" width="556" height="110" rx="12" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/><text x="300" y="511.4" font-size="21" fill="#212529" text-anchor="middle">Oba mají <tspan font-weight="bold">6 protonů</tspan> – oba jsou uhlík.</text><text x="300" y="542.4" font-size="21" fill="#212529" text-anchor="middle">Liší se počtem neutronů → jiná hmotnost.</text><text x="300" y="573.4" font-size="21" fill="#212529" text-anchor="middle">To jsou <tspan font-weight="bold">izotopy</tspan>.</text>
</svg>
