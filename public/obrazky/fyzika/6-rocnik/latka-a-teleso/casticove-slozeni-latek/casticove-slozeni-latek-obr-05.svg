@keyframes mic { 0% { transform: translate(300px, 530px) scale(1, 1) } 15% { transform: translate(300px, 530px) scale(1, 1) } 40% { transform: translate(300px, 530px) scale(1.25, 0.72) } 65% { transform: translate(300px, 530px) scale(1.25, 0.72) } 85% { transform: translate(300px, 530px) scale(1, 1) } 100% { transform: translate(300px, 530px) scale(1, 1) } }
@keyframes dlan { 0% { transform: translate(300px, 434px) } 15% { transform: translate(300px, 434px) } 40% { transform: translate(300px, 460.9px) } 65% { transform: translate(300px, 460.9px) } 85% { transform: translate(300px, 434px) } 100% { transform: translate(300px, 434px) } }
.mi { animation: mic 6s ease-in-out infinite; }
.dl { animation: dlan 6s ease-in-out infinite; }
@keyframes bc0 { 0% { transform: translate(222px, 622px) } 15% { transform: translate(222px, 622px) } 40% { transform: translate(243px, 622px) } 65% { transform: translate(243px, 622px) } 85% { transform: translate(222px, 622px) } 100% { transform: translate(222px, 622px) } }
