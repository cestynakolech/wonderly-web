<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kyvadlová váha na dopisy: kovový stojánek na třech nožkách, nahoře talířek, na otočné ose kyvadlo s kulatým závažím a jazýčkem, vedle obloukovitá stupnice od 0 do 100 g. Na talířek dopadne dopis, talířek trochu klesne, kyvadlo se vychýlí, závaží se zvedne a jazýček ukáže na stupnici 20 g.">
<style>
/* Vážení dopisu (10 s, smyčka). Bez animace (prefers-reduced-motion) zůstává koncový stav z atributů: dopis na talířku, jazýček na 20 g. */
.kyvadlo { transform-box: view-box; transform-origin: 400px 360px; animation: kyvadlo 10s infinite; }
.talir { animation: talir 10s infinite; }
.dopis { animation: dopis 10s infinite; }
.vysl6 { animation: vysl6 10s infinite; }
@keyframes kyvadlo { 0%, 16% { transform: rotate(-10deg); } 24% { transform: rotate(2deg); } 28% { transform: rotate(-1deg); } 32%, 88% { transform: rotate(0deg); } 96%, 100% { transform: rotate(-10deg); } }
@keyframes talir { 0%, 16% { transform: translateY(-8px); } 24%, 88% { transform: translateY(0px); } 96%, 100% { transform: translateY(-8px); } }
@keyframes dopis { 0%, 9% { transform: translateY(-90px); opacity: 0; } 11% { transform: translateY(-80px); opacity: 1; animation-timing-function: cubic-bezier(.55,0,1,.45); } 16%, 88% { transform: translateY(0px); opacity: 1; } 91%, 100% { transform: translateY(0px); opacity: 0; } }
@keyframes vysl6 { 0%, 32% { opacity: 0; } 35%, 88% { opacity: 1; } 90%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .kyvadlo, .talir, .dopis, .vysl6 { animation: none; } }
</style>
<defs>
<linearGradient id="kov06" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6977a"/><stop offset="0.45" stop-color="#e3d8c0"/><stop offset="1" stop-color="#6b5f48"/></linearGradient>
<linearGradient id="kovT06" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a4033"/><stop offset="0.45" stop-color="#8c7d63"/><stop offset="1" stop-color="#3b3328"/></linearGradient>
<radialGradient id="zavazi06" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#d8cbb0"/><stop offset="0.6" stop-color="#8c7d63"/><stop offset="1" stop-color="#4a4033"/></radialGradient>
<linearGradient id="stul06" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c08552"/><stop offset="1" stop-color="#8a5a2b"/></linearGradient>
</defs>
<rect x="3" y="3" width="954" height="654" rx="14" fill="#f8f9fa"/>
<rect x="150" y="10" width="660" height="48" rx="4" fill="#f79a4a" stroke="#c8692a" stroke-width="2"/>
<text x="480" y="43" font-size="28" fill="#212529" text-anchor="middle">Kyvadlová váha: na dopisy a drobné cennosti</text>
<!-- stůl -->
<path d="M20,610 L940,610 L940,654 L20,654 Z" fill="url(#stul06)"/>
<path d="M20,610 L940,610" stroke="#6b3f17" stroke-width="3"/>
<g stroke="#6b3f17" stroke-width="2" opacity="0.45" fill="none"><path d="M60,628 C200,622 320,636 460,628"/><path d="M520,640 C640,632 760,646 900,636"/></g>
<!-- trojnožka a sloupek -->
<path d="M400,560 C380,580 330,596 300,610 L318,612 C346,602 384,590 400,580 C416,590 454,602 482,612 L500,610 C470,596 420,580 400,560 Z" fill="url(#kovT06)" stroke="#2b2a26" stroke-width="2"/>
<rect x="392" y="556" width="16" height="50" fill="url(#kovT06)"/>
<rect x="386" y="290" width="28" height="280" rx="6" fill="url(#kovT06)" stroke="#2b2a26" stroke-width="2"/>
<!-- obloukovitá stupnice (pevná) -->
<path d="M542.7,406.4 L599.7,424.9 A210,210 0 0 1 450.8,563.8 L436.3,505.5 A150,150 0 0 0 542.7,406.4 Z" fill="url(#kov06)" stroke="#2b2a26" stroke-width="2.5"/>
<line x1="400" y1="360" x2="540" y2="420" stroke="#4a4033" stroke-width="8"/>
<line x1="400" y1="360" x2="444" y2="502" stroke="#4a4033" stroke-width="8"/>
<g stroke="#2b2a26" stroke-width="3">
<line x1="543.7" y1="418.1" x2="562.2" y2="425.6"/><line x1="531.4" y1="442.2" x2="548.4" y2="452.8"/><line x1="515.2" y1="463.7" x2="530" y2="477.1"/><line x1="495.5" y1="482.1" x2="507.8" y2="497.9"/><line x1="472.7" y1="496.9" x2="482.1" y2="514.5"/><line x1="447.9" y1="507.4" x2="454.1" y2="526.4"/>
</g>
<g font-size="20" font-weight="bold" fill="#2b2a26" text-anchor="middle">
<text x="583" y="442">0</text><text x="568" y="472">20</text><text x="547" y="499">40</text><text x="522" y="523">60</text><text x="493" y="542">80</text><text x="461" y="556">100</text>
</g>
<text x="598" y="500" font-size="22" font-weight="bold" fill="#2b2a26">g</text>
<!-- kyvadlo: rameno se závažím a jazýček (otáčí se kolem osy) -->
<g class="kyvadlo">
<line x1="400" y1="360" x2="299" y2="413" stroke="url(#kovT06)" stroke-width="12" stroke-linecap="round"/>
<circle cx="299" cy="413" r="36" fill="url(#zavazi06)" stroke="#2b2a26" stroke-width="2.5"/>
<circle cx="299" cy="413" r="20" fill="none" stroke="#4a4033" stroke-width="2"/>
<path d="M400,354 L556,452 L552,458 L400,366 Z" fill="#c92a2a" stroke="#7a1515" stroke-width="1.5"/>
</g>
<circle cx="400" cy="360" r="10" fill="#d8cbb0" stroke="#2b2a26" stroke-width="2.5"/>
<!-- talířek (klesá s dopisem) -->
<g class="talir">
<rect x="394" y="238" width="12" height="60" fill="url(#kovT06)" stroke="#2b2a26" stroke-width="1.5"/>
<ellipse cx="400" cy="240" rx="118" ry="16" fill="url(#kov06)" stroke="#2b2a26" stroke-width="2.5"/>
<g class="dopis">
<path d="M322,240 L458,240 L482,212 L346,212 Z" fill="#ffffff" stroke="#495057" stroke-width="2.5"/>
<path d="M322,240 L402,224 L482,212" fill="none" stroke="#adb5bd" stroke-width="2"/>
<path d="M346,212 L402,224 L458,240" fill="none" stroke="#adb5bd" stroke-width="2"/>
<path d="M448,232 L466,232 L474,222 L456,222 Z" fill="#fa5252"/>
</g>
</g>
<!-- popisky -->
<g font-size="20" fill="#2b2a26">
<text x="560" y="236">talířek s dopisem</text>
<line x1="556" y1="230" x2="500" y2="236" stroke="#495057" stroke-width="2"/>
<text x="640" y="400">jazýček ukazuje</text>
<text x="640" y="424">na stupnici</text>
<text x="96" y="340">závaží kyvadla</text>
<text x="96" y="364">se zvedne</text>
<line x1="230" y1="372" x2="270" y2="396" stroke="#495057" stroke-width="2"/>
</g>
<g class="vysl6">
<rect x="620" y="530" width="260" height="44" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
<text x="750" y="560" font-size="22" font-weight="bold" fill="#2b2a26" text-anchor="middle">dopis: m = 20 g</text>
</g>
</svg>
