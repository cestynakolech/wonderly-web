<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tři podoby Ohmova zákona: U = R · I vypočítá napětí, I = U : R vypočítá proud, R = U : I vypočítá odpor. Napětí ve voltech, proud v ampérech, odpor v ohmech. Animace: postupně se zvýrazní řádek, který vypočítá napětí, pak proud a nakonec odpor.">
<style>
/* Předloha: PDF Ohmův zákon, s. 3 (vzorce I = U : R, U = R · I, R = U : I; výklad oddíl 4 „Tři podoby stejného vztahu“). Bez trojúhelníku (v PDF není).
   12 s: 0–30 % zvýrazněn řádek U = R · I; 33–63 % řádek I = U : R; 66–96 % řádek R = U : I; smyčka.
   Bez animace (reduced-motion) = zvýrazněn řádek U = R · I, ostatní řádky vidět. */
.r1, .r2, .r3 { animation: 12s linear infinite; }
.r1 { animation-name: r1; } .r2 { opacity: 0; animation-name: r2; } .r3 { opacity: 0; animation-name: r3; }
@keyframes r1 { 0%, 30% { opacity: 1; } 32%, 98% { opacity: 0; } 100% { opacity: 1; } }
@keyframes r2 { 0%, 31% { opacity: 0; } 33%, 63% { opacity: 1; } 65%, 100% { opacity: 0; } }
@keyframes r3 { 0%, 64% { opacity: 0; } 66%, 96% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .r1, .r2, .r3 { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="374" rx="14" fill="#f8f9fa"/>
<text x="300" y="42" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Tři podoby Ohmova zákona</text><text x="300" y="78" font-size="20" fill="#212529" text-anchor="middle">Každý vztah vypočítá jednu veličinu.</text><rect class="r1" x="60" y="110" width="480" height="46" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/><text x="84" y="144" font-size="28" font-weight="bold" fill="#212529" text-anchor="start">U = R · I</text><text x="270" y="144" font-size="22" fill="#212529" text-anchor="start">→ vypočítá napětí</text><rect class="r2" x="60" y="166" width="480" height="46" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/><text x="84" y="200" font-size="28" font-weight="bold" fill="#212529" text-anchor="start">I = U : R</text><text x="270" y="200" font-size="22" fill="#212529" text-anchor="start">→ vypočítá proud</text><rect class="r3" x="60" y="222" width="480" height="46" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/><text x="84" y="256" font-size="28" font-weight="bold" fill="#212529" text-anchor="start">R = U : I</text><text x="270" y="256" font-size="22" fill="#212529" text-anchor="start">→ vypočítá odpor</text><text x="300" y="326" font-size="20" fill="#212529" text-anchor="middle">U ve voltech (V), I v ampérech (A), R v ohmech (Ω)</text></svg>
