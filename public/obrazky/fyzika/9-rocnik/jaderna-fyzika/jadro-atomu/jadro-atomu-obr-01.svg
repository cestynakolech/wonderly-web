<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Stavba atomu uhlíku. Uprostřed je malé jádro s 6 protony a 6 neutrony, kolem je obal se 6 elektrony. Protonů je stejně jako elektronů, atom je elektricky neutrální. Jádro je ve skutečnosti asi stotisíckrát menší než atom. Animace: elektrony obíhají kolem jádra.">
<style>
.ob { transform-origin: 300px 350px; animation: ob 12s linear infinite; }
@keyframes ob { to { transform: rotate(360deg); } }
.pr { transform-box: fill-box; transform-origin: center; animation: pr 12s linear infinite; }
@keyframes pr { to { transform: rotate(-360deg); } }
@media (prefers-reduced-motion: reduce) { .ob, .pr { animation: none; } }
/* Předloha: PDF lekce 17 Jádro atomu, s. 2 – atom s popisky Jádro atomu, Obal atomu, Elektron e⁻, Proton p⁺, Neutron n⁰.
   Počty podle výkladu (uhlík ¹²C: 6 p, 6 n, 6 e). Animace: elektrony obíhají jádro (perioda 12 s), znaménko − zůstává vodorovné.
   Bez animace (reduced-motion) = elektrony v klidu na dráze. */
</style>
<rect x="3" y="3" width="594" height="744" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="42" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Stavba atomu</text>
