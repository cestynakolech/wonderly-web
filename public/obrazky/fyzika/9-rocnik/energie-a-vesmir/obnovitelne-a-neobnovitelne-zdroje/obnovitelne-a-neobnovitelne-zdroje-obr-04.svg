<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Větrná elektrárna. Vítr roztáčí tři listy rotoru, generátor v gondole vyrábí elektřinu a ta jde stožárem do vedení.">
<style>
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes rotz { to { transform: rotate(-360deg); } }
.rot { animation: rot 1.6s linear infinite; }
@keyframes tok { to { stroke-dashoffset: -36; } }
@keyframes tokz { to { stroke-dashoffset: 36; } }
.tok { stroke-dasharray: 12 24; animation: tok 1s linear infinite; }
.tokz { stroke-dasharray: 12 24; animation: tokz 1s linear infinite; }
@keyframes el { to { stroke-dashoffset: -18; } }
@keyframes elz { to { stroke-dashoffset: 18; } }
.el { stroke-dasharray: 8 10; animation: el 0.6s linear infinite; }
.elz { stroke-dasharray: 8 10; animation: elz 0.6s linear infinite; }
.rotor { animation: rot 4s linear infinite; }
.vitr { stroke-dasharray: 40 30; animation: vitr 1.4s linear infinite; }
@keyframes vitr { to { stroke-dashoffset: -70; } }
/* Vítr (modré čáry) roztáčí rotor, generátor v gondole vyrábí elektřinu (žluté čárky do vedení).
   Klid: rotor stojí. */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
