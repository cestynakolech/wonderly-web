<g><ellipse cx="190" cy="160" rx="60" ry="26" fill="url(#mrak)"/><ellipse cx="160" cy="150" rx="36" ry="24" fill="url(#mrak)"/><ellipse cx="206" cy="142" rx="34" ry="26" fill="url(#mrak)"/><path d="M196 180L184 214L200 214L188 252" fill="none" stroke="#f59f00" stroke-width="6" stroke-linejoin="round"/><path d="M64 284q36-30 72 0q-36 30-72 0Z" fill="#ffffff" stroke="#212529" stroke-width="3"/><circle cx="100" cy="284" r="13" fill="#1c7ed6"/><circle cx="100" cy="284" r="6" fill="#212529"/><circle cx="96" cy="280" r="3" fill="#fff"/><path d="M140 270L178 236" stroke="#868e96" stroke-width="2.5" stroke-dasharray="6 5"/></g>
<path d="M380 196L590 296V312H380Z" fill="url(#prkno)" stroke="#7a4a1a" stroke-width="2"/><path d="M380 196L590 296" stroke="#5c3b1a" stroke-width="3"/><rect x="380" y="196" width="16" height="116" fill="#8a5a2b"/><g class="kul"><circle cx="578" cy="278" r="14" fill="url(#koule)" stroke="#343a40" stroke-width="2"/></g>
