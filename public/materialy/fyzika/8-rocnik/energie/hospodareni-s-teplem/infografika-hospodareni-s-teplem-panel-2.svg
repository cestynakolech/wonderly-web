	<path d="M160,400 H250 L330,418 H420" stroke="#1864ab" stroke-width="3" fill="none" marker-end="url(#h2-b)" />
	<text x="434" y="172" font-size="19" fill="#a61e1e" font-weight="bold" text-anchor="end">teplý vzduch dovnitř</text>
	<text x="434" y="352" font-size="19" fill="#1864ab" font-weight="bold" text-anchor="end">studený</text>
	<text x="434" y="374" font-size="19" fill="#1864ab" font-weight="bold" text-anchor="end">vzduch ven</text>
	<text x="175" y="290" font-size="18" fill="#2b2a26" text-anchor="middle">lednice</text>
	<text x="26" y="492" font-size="22" fill="#2b2a26">Dveře otvírej jen na chvilku a hned</text>
<text x="26" y="520" font-size="22" fill="#2b2a26">je zavři. Nejdřív si rozmysli, co</text>
<text x="26" y="548" font-size="22" fill="#2b2a26">chceš vyndat, a teprve pak otevři.</text>
