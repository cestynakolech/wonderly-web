<radialGradient id="gSklo" cx="50%" cy="50%" r="50%" fx="30%" fy="25%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#e7f5ff"/><stop offset="1" stop-color="#c5f6fa"/></radialGradient>
<radialGradient id="gKuze" cx="50%" cy="50%" r="50%" fx="40%" fy="35%"><stop offset="0" stop-color="#ffe8d6"/><stop offset="1" stop-color="#eeb48a"/></radialGradient>
<linearGradient id="gPlast" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd8a8"/><stop offset="0.5" stop-color="#fd7e14"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
<linearGradient id="gDeska" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#212529"/><stop offset="0.45" stop-color="#6c757d"/><stop offset="1" stop-color="#212529"/></linearGradient></defs>
