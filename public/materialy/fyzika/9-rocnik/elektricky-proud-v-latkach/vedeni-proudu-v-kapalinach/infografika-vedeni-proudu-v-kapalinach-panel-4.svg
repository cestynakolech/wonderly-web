<svg viewBox="0 1962 460 670" width="460" height="670" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Elektrolýza: proud mění látky. Pomědění železného předmětu: v roztoku skalice modré CuSO₄ je měděná anoda připojená na kladný pól zdroje a železný předmět jako katoda připojený přes ampérmetr na záporný pól. V roztoku jsou 2 kationty Cu²⁺ a 2 anionty SO₄²⁻. Kationty Cu²⁺ putují k železnému předmětu a usazují se na něm jako vrstva mědi; z anody se uvolňují nové ionty mědi a anoda se postupně rozpouští. Anionty SO₄²⁻ se pohybují k anodě. CuSO₄ → Cu²⁺ + SO₄²⁻, z 1 částice vzniknou 2 ionty." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
