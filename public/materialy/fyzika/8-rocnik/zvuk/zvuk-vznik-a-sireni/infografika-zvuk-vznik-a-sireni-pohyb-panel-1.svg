<svg viewBox="0 0 460 680" width="460" height="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zvuk v pohybu 1/3, Jak rozkmitáme těleso: zvuk vzniká chvěním pružných těles. Úderem: palička udeří do bubnu a blána se chvěje. Drnkáním: prst drnkne strunu kytary a struna kmitá. Smýkáním: smyčec táhneme napříč přes strunu houslí a struna se chvěje. Prouděním vzduchu kolem ostré hrany: foukáme do píšťalky. Chvění je zpomalené." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Zvuk v pohybu 1/3: Jak rozkmitáme těleso</title>
	<!-- W86 (14. 10. 2026). Předloha: PDF 34 Zvuk, vznik a šíření zvuku, s. 1 („Vzniká chvěním těles (např. rozkmitaná struna, blána
	     bubnu …)“) a s. 4 („úderem rozkmitáme blánu bubnu“, „drnkáním rozkmitáme struny harfy či kytary“, „smýkáním rozkmitá smyčec
	     struny houslí“, „prouděním vzduchu kolem ostré hrany tělesa rozkmitáme píšťalku, flétnu“). Strana 4 je bez obrázku — scény
	     jsou kresba podle textu. Výklad: § Zdroje zvuku, tón a hluk (tytéž čtyři způsoby). Žádný statický obr podtématu je neukazuje
	     (obr-05 = tón × hluk).
	     Oranžová = chvějící se těleso (blána, struna; stejný význam jako „kulička, kterou rozkmitáme“ ve W85), šedé oblouky = zvuk.
	     Chvění je zpomalené (skutečné má aspoň 16 kmitů za 1 s — výklad § Frekvence), proto nápis „Pohyb je zpomalený“.
	     Cyklus buben/kytara 2 s: úder/drnknutí v 0,5 s, pak doznívání do 1,4 s. Smyčec 2 s tam a 2 s zpět, píšťalka 0,6 s.
	     OPRAVA 1 (W86-kontrola-1): housle stojí svisle (struny svisle), smyčec leží NAPŘÍČ přes struny mezi hmatníkem a kobylkou
	     a táhne se tam a zpět napříč (translateX, kolmo ke strunám) — tvar podle infografiky učitele (unnamed.png u PDF 34:
	     housle s hlavicí, krkem, hmatníkem, kobylkou, efy a smyčcem přes struny). Kytara: korpus se dvěma oblouky, otvor,
	     kobylka, krk s pražci a hlava s kolíčky (korpus jako obr-05). Struny kmitají krokově (step-end) mezi hodnotami bez nuly
	     (|scale| ≥ 0,05) — struna se nikdy nezdegeneruje a nezmizí.
	     Bez pohybu: palička na bláně, prst na struně, oblouky zvuku vidět. -->
	<style>
		.pa { transform-box: view-box; transform-origin: 206px 186px; animation: pa 2s ease-in infinite; }
