108 306" fill="none" stroke="#e03131" stroke-width="3"/><path d="M110.7 319.4 L108.0 306.0 L120.7 311.1" fill="none" stroke="#e03131" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="92" y="470" font-size="18" text-anchor="middle" fill="#17324d">Zahříváme</text><text x="300" y="470" font-size="18" text-anchor="middle" fill="#17324d">Kapalina</text><text x="187" y="508" font-size="18" text-anchor="middle" fill="#17324d">Směs zahříváme, vzniká pára.</text><text x="187" y="534" font-size="18" text-anchor="middle" fill="#17324d">Páru odvedeme a ochladíme,</text><text x="187" y="560" font-size="18" text-anchor="middle" fill="#17324d">aby opět zkapalněla.</text><text x="187" y="592" font-size="18" text-anchor="middle" fill="#17324d">Šedá cesta: pára → kapalina</text></g></svg>