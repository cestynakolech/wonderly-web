<svg viewBox="0 1154 460 520" width="460" height="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Převod m/s a km/h: šipka z km/h do m/s znamená dělit 3,6, šipka z m/s do km/h násobit 3,6. 1 m/s = 3,6 km/h. Příklady: 10 m/s · 3,6 = 36 km/h, 72 km/h : 3,6 = 20 m/s. Desetinnou čárku neposouváme. 1 h = 3 600 s, 1 km = 1 000 m" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Rychlost, dráha, čas 3/6: Převod m/s a km/h</title>
