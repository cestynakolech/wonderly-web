<svg viewBox="0 0 460 660" width="460" height="660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Odraz světla v pohybu 2/2: Kolmice u kulové plochy. Bod dopadu se pohybuje po kulové ploše a spojnice středu s bodem dopadu se natáčí spolu s ním. Jediný paprsek se odráží souměrně podle této kolmice, takže úhel odrazu je roven úhlu dopadu." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Odraz světla v pohybu 2/2: Kolmice u kulové plochy</title>
	<defs>
		<marker id="sipka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
			<path d="M0 0L10 5L0 10Z" fill="#c2410c" />
		</marker>
	</defs>
	<style>
		.pohyb-bodu {
			transform-origin: 230px 430px;
			transform-box: view-box;
			animation: pohybBodu 6s ease-in-out infinite;
		}
		@keyframes pohybBodu {
			0%, 100% { transform: rotate(-48deg); }
			25%, 75% { transform: rotate(-36deg); }
			50% { transform: rotate(-24deg); }
		}
		.klidova-konstrukce { display: none; }
		@media (prefers-reduced-motion: reduce) {
			.pohyb-bodu { animation: none; transform: rotate(-24deg); }
			.animovana-konstrukce { display: none; }
			.klidova-konstrukce { display: inline; }
		}
	</style>
	<rect x="0" y="0" width="460" height="660" fill="#f8f9fa" />
	<g id="panel-2">
