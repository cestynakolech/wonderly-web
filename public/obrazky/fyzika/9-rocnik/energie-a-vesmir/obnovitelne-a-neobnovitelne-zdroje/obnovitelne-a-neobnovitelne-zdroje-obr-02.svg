<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Geotermální elektrárna. Horká pára stoupá vrtem z hloubky, roztáčí turbínu a ta generátor, elektřina jde do vedení. V kondenzátoru se pára mění na vodu a ta se druhým vrtem vrací pod zem.">
<style>
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes rotz { to { transform: rotate(-360deg); } }
.rot { animation: rot 1.6s linear infinite; }
@keyframes tok { to { stroke-dashoffset: -36; } }
@keyframes tokz { to { stroke-dashoffset: 36; } }
.tok { stroke-dasharray: 12 24; animation: tok 1s linear infinite; }
.tokz { stroke-dasharray: 12 24; animation: tokz 1s linear infinite; }
@keyframes el { to { stroke-dashoffset: -18; } }
@keyframes elz { to { stroke-dashoffset: 18; } }
.el { stroke-dasharray: 8 10; animation: el 0.6s linear infinite; }
.elz { stroke-dasharray: 8 10; animation: elz 0.6s linear infinite; }
.tepl { animation: tepl 1.2s ease-in-out infinite alternate; }
@keyframes tepl { to { transform: translateX(7px); } }
.teplz { animation: teplz 1.2s ease-in-out infinite alternate; }
@keyframes teplz { to { transform: translateX(-7px); } }
.ven { animation: ven 1.2s ease-in-out infinite alternate; }
@keyframes ven { to { transform: translateX(7px); } }
.venz { animation: venz 1.2s ease-in-out infinite alternate; }
@keyframes venz { to { transform: translateX(-7px); } }
/* Překresleno podle schématu geotermální elektrárny v předloze: vrt s párou vlevo, turbína
   a generátor nahoře, stožár vedení, kondenzátor, voda zpět do země vrtem vpravo. */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
