<svg viewBox="0 0 460 640" width="460" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jaderná energie v pohybu 1/2, Kam se energie poděje: atom uranu 235 je uvnitř kousku látky mezi dalšími atomy. Jádro je nakreslené zvětšené, ve skutečnosti je asi 100 000krát menší než atom. Neutron ho rozštěpí, uvolní se energie, úlomky jádra a neutrony vyletí rychle a nesou pohybovou energii. Atomy pak kmitají víc a látka se zahřeje, teploměr stoupá. Jaderná energie se projeví hlavně jako teplo." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Jaderná energie v pohybu 1/2: Kam se energie poděje?</title>
	<!-- W81 (14. 10. 2026). Předloha: PDF 19 Jaderná energie, s. 1 (energie se uvolňuje jako pohybová energie částic unikajících z jádra a projevuje se
	     hlavně jako teplo, zahřívání látek). Výklad: úvod („Uvolní se při vhodné jaderné reakci a projeví se hlavně jako teplo“).
	     Náhrada návrhu „kam zmizela hmotnost“: úbytek hmotnosti není v PDF ani ve výkladu, proto se nekreslí.
	     Jen děj v látce (žádná voda, pára ani turbína: to je podtéma reaktor/elektrárna, W80). Rychlost atomů = čárky pohybu + silnější kmitání (LEGENDA-TEPLO bod 2),
	     teploměr červený #e03131 (jen grafika; text „látka se zahřeje“ #c92a2a kvůli kontrastu 5,23:1). Jádra zjednodušená, zmenšená 0,4: U 19 = 8 p + 11 n; + 1 n = Ba 10 + Kr 7 + 3 n.
	     MĚŘÍTKO (OPRAVA 2, PDF 17 Jádro atomu: „Jádro je vzhledem k velikosti atomu velice maličké (asi stotisíckrát menší …)“): atomy látky r 28 bez jader,
	     atom uranu = čárkovaný obal r 28, jádro uvnitř jen průměr ≈ 32 (výrazně menší než atom) s popiskem „jádro zvětšeno“ + dole „Jádro je asi 100 000krát menší než atom.“
	     Volné neutrony = malá šedá kulička r 3,5 (velikost nukleonu v jádře). Hvězda štěpení jako W80: přechod #fff3bf→#ffd43b→#fab005, obrys #c92a2a.
	     Opora „atomy kmitají víc, látka se zahřeje“: 8. r. 2 Energie / 7 Vnitřní energie tělesa, PDF s. 1–2 („Čím vyšší teplota tělesa ➪ tím rychlejší pohyb částic“,
	     „v pevných látkách částice kmitají“) + PDF 19 s. 1 („Projevuje se hlavně ve formě tepla - zahřívání látek“). Opora „vyletí rychle, nesou pohybovou energii“: PDF 19 s. 1
	     („Uvolňuje se ve formě pohybové energie částic, které během reakce unikají z jádra“). Srážky s atomy se nekreslí ani nepíšou (bez opory).
	     Cyklus 10 s: neutron dolétne za 1,2 s, úlomky a neutrony vyletí 1,3–3 s a zmizí (nezůstanou ležet
	     přes atomy), od 3 s atomy kmitají víc, teploměr stoupá do 7 s. Bez pohybu = konečné polohy úlomků se šipkami. -->
