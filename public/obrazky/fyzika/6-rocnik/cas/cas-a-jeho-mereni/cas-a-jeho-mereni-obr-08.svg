<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Mechanické stopky: kulaté stříbrné pouzdro s korunkou, tlačítkem a očkem nahoře. Na bílém ciferníku je stupnice sekund od 0 do 60. Velká ručička oběhne celý ciferník za 60 sekund, tedy za 1 minutu. Malá ručička na malém ciferníku počítá celé minuty.">
<style>
/* Stopky běží skutečným tempem: velká ručička oběhne ciferník za 60 s = 1 min, malá ručička poskočí
   po každé celé minutě o jeden dílek (oběhne za 30 min). Bez animace: stopky na nule. */
.sek8 { transform-box: view-box; transform-origin: 360px 370px; animation: sek8-k 60s linear infinite; }
@keyframes sek8-k { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.min8 { transform-box: view-box; transform-origin: 360px 470px; animation: min8-k 1800s steps(30, end) infinite; }
@keyframes min8-k { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sek8, .min8 { animation: none; } }
</style>
