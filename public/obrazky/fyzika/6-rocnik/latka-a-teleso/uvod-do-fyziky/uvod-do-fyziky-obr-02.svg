text x="100" y="130" font-size="18" fill="#212529" text-anchor="end">7</text><path d="M110 100H925" stroke="#dee2e6" stroke-width="1.5"/><text x="100" y="106" font-size="18" fill="#212529" text-anchor="end">8</text>
