<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dva stejné tyčové magnety. Vlevo feromagnetické látky: železný hřebík, ocelová sponka a ocelová matice visí přichycené na magnetu. Vpravo nemagnetické látky: dřevěný špalík, korková zátka, list papíru, hliníková plechovka a měděná mince zůstaly ležet na stole pod magnetem.">
