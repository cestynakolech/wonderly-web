<svg viewBox="0 0 460 650" width="460" height="650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stupnice proudu tělem odspodu nahoru: 0,5 až 1 mA první pocit, že proud teče; 1 až 5 mA brní to a svaly se stahují; 5 až 15 mA křeč, člověk se sám nepustí; kolem 25 mA křeč dýchacích svalů; od 30 mA se srdce může roztřást, fibrilace (jistěji kolem 60 mA); nad 80 mA hrozí zástava srdce. Čím déle proud teče, tím hůř" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Účinky proudu 1/3: Proud tělem a nebezpečí</title>
	<style>
		.p0 { animation: p0 14s linear infinite; } @keyframes p0 { 0% { opacity: 0.2; } 2% { opacity: 1; } 92% { opacity: 1; } 97% { opacity: 0.2; } 100% { opacity: 0.2; } }
		.p1 { animation: p1 14s linear infinite; } @keyframes p1 { 0% { opacity: 0.2; } 11% { opacity: 0.2; } 14% { opacity: 1; } 92% { opacity: 1; } 97% { opacity: 0.2; } 100% { opacity: 0.2; } }
		.p2 { animation: p2 14s linear infinite; } @keyframes p2 { 0% { opacity: 0.2; } 23% { opacity: 0.2; } 26% { opacity: 1; } 92% { opacity: 1; } 97% { opacity: 0.2; } 100% { opacity: 0.2; } }
		.p3 { animation: p3 14s linear infinite; } @keyframes p3 { 0% { opacity: 0.2; } 35% { opacity: 0.2; } 38% { opacity: 1; } 92% { opacity: 1; } 97% { opacity: 0.2; } 100% { opacity: 0.2; } }
		.p4 { animation: p4 14s linear infinite; } @keyframes p4 { 0% { opacity: 0.2; } 47% { opacity: 0.2; } 50% { opacity: 1; } 92% { opacity: 1; } 97% { opacity: 0.2; } 100% { opacity: 0.2; } }
		.p5 { animation: p5 14s linear infinite; } @keyframes p5 { 0% { opacity: 0.2; } 59% { opacity: 0.2; } 62% { opacity: 1; } 92% { opacity: 1; } 97% { opacity: 0.2; } 100% { opacity: 0.2; } }
		.uk { animation: uk 14s ease-in-out infinite; } @keyframes uk { 0% { transform: translateY(360px); } 11% { transform: translateY(360px); } 14% { transform: translateY(288px); } 23% { transform: translateY(288px); } 26% { transform: translateY(216px); } 35% { transform: translateY(216px); } 38% { transform: translateY(144px); } 47% { transform: translateY(144px); } 50% { transform: translateY(72px); } 59% { transform: translateY(72px); } 62% { transform: translateY(0px); } 92% { transform: translateY(0px); } 97% { transform: translateY(360px); } 100% { transform: translateY(360px); } }
		@media (prefers-reduced-motion: reduce) { .p0, .p1, .p2, .p3, .p4, .p5, .uk { animation: none; } }
	</style>
	<rect x="0" y="0" width="460" height="650" fill="#f8f9fa"/>
	<g id="panel-1"><rect x="26" y="16" width="420" height="630" rx="12" fill="#dee2e6"/><rect x="20" y="10" width="420" height="630" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="44" r="17" fill="#2b2a26"/><text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Proud tělem a nebezpečí</text>
<text x="34" y="92" font-size="21" fill="#2b2a26">Čím větší proud tělem prochází,</text>
<text x="34" y="120" font-size="21" fill="#2b2a26">tím větší je nebezpečí.</text>
<rect x="42" y="144" width="44" height="436" rx="6" fill="#ffffff" stroke="#343a40" stroke-width="2"/>
<rect class="p0" x="44" y="506" width="40" height="72" fill="#fff3bf" stroke="#ffffff" stroke-width="1"/>
<g class="p0"><text x="104" y="536" font-size="21" font-weight="bold" fill="#2b2a26">0,5 až 1 mA</text><text x="104" y="564" font-size="21" fill="#2b2a26">první pocit, že proud teče</text></g>
<rect class="p1" x="44" y="434" width="40" height="72" fill="#ffe066" stroke="#ffffff" stroke-width="1"/>
<g class="p1"><text x="104" y="464" font-size="21" font-weight="bold" fill="#2b2a26">1 až 5 mA</text><text x="104" y="492" font-size="21" fill="#2b2a26">brní to, svaly se stahují</text></g>
<rect class="p2" x="44" y="362" width="40" height="72" fill="#ffc078" stroke="#ffffff" stroke-width="1"/>
<g class="p2"><text x="104" y="392" font-size="21" font-weight="bold" fill="#2b2a26">5 až 15 mA</text><text x="104" y="420" font-size="21" fill="#2b2a26">křeč, sám se nepustí</text></g>
<rect class="p3" x="44" y="290" width="40" height="72" fill="#ff922b" stroke="#ffffff" stroke-width="1"/>
<g class="p3"><text x="104" y="320" font-size="21" font-weight="bold" fill="#2b2a26">kolem 25 mA</text><text x="104" y="348" font-size="21" fill="#2b2a26">křeč dýchacích svalů</text></g>
<rect class="p4" x="44" y="218" width="40" height="72" fill="#f03e3e" stroke="#ffffff" stroke-width="1"/>
<g class="p4"><text x="104" y="248" font-size="21" font-weight="bold" fill="#2b2a26">od 30 mA</text><text x="104" y="276" font-size="21" fill="#2b2a26">srdce se může roztřást</text></g>
<rect class="p5" x="44" y="146" width="40" height="72" fill="#c92a2a" stroke="#ffffff" stroke-width="1"/>
<g class="p5"><text x="104" y="176" font-size="21" font-weight="bold" fill="#2b2a26">nad 80 mA</text><text x="104" y="204" font-size="21" fill="#2b2a26">hrozí zástava srdce</text></g>
<path class="uk" d="M88,182.0 L100,173.0 L100,191.0 Z" fill="#2b2a26"/>
<text x="34" y="616" font-size="21" font-weight="bold" fill="#2b2a26">Čím déle proud teče, tím hůř.</text>
	</g>
</svg>
