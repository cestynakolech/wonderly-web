		@keyframes p3-wa { 0% { transform: translateY(160px) } 8% { transform: translateY(160px) } 38% { transform: translateY(0) } 84% { transform: translateY(0) } 97% { transform: translateY(160px) } 100% { transform: translateY(160px) } }
		.p3-la { animation: p3-la 7s linear infinite; }
