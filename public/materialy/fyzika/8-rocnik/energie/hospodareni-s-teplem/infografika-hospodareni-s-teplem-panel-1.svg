		.h1z1 { animation: h1z1 6s linear infinite; animation-delay: -3.8s; }
		@media (prefers-reduced-motion: reduce) { .h1u0, .h1u1, .h1u2, .h1u3, .h1z0, .h1z1 { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .h1u0, .h1u1, .h1u2, .h1u3, .h1z0, .h1z1 { animation: none; } }
