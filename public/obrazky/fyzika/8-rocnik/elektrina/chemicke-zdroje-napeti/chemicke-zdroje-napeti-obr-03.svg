<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Olověný akumulátor 12 V. Nahoře vybíjení: akumulátor svítí žárovkou, elektrony tečou drátem od záporného pólu ke kladnému a zásoba chemické energie ubývá. Dole nabíjení: akumulátor je připojen k nabíječce, elektrony tečou opačným směrem, látky uvnitř se obnovují a zásoba chemické energie přibývá.">
<style>
/* Předloha: PDF lekce 21, s. 3 (olověné akumulátory: dobíjecí, opakovaně použitelné, 12 V, automobil). Kresba v PDF chybí.
   8 s cyklus: zásoba při vybíjení klesá z plné na 15 %, při nabíjení stoupá z 15 % na plnou (0–85 %), pak drží a začne znovu.
   Elektrony: tečky po 32 px, posun 32 px za 1 s; při vybíjení od − ke +, při nabíjení opačně.
   Bez animace: vybíjení = zásoba skoro prázdná (15 %), nabíjení = zásoba plná; tečky stojí, směr ukazují šipky. */
.el { stroke-dasharray: 0 32; animation: el 1s linear infinite; }
@keyframes el { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -32; } }
.sv { opacity: 0.45; animation: sv 1.2s ease-in-out infinite alternate; }
@keyframes sv { from { opacity: 0.3; } to { opacity: 0.65; } }
.za { transform-box: fill-box; transform-origin: left center; }
.gA { transform: scaleX(0.15); animation: gA 8s linear infinite; }
.gB { transform: scaleX(1); animation: gB 8s linear infinite; }
@keyframes gA { 0% { transform: scaleX(1); } 85%, 100% { transform: scaleX(0.15); } }
@keyframes gB { 0% { transform: scaleX(0.15); } 85%, 100% { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .el, .sv, .gA, .gB { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="594" rx="14" fill="#f8f9fa"/>
<text x="300" y="38" font-size="26" fill="#212529" font-weight="bold" text-anchor="middle">Olověný akumulátor 12 V</text>
<!-- ===== VYBÍJENÍ ===== -->
