<svg viewBox="0 0 460 770" width="460" height="770" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vnímání zvuku v pohybu 1/2, Štafeta v uchu: řez uchem se zvukovodem, bubínkem, kůstkami kladívkem, kovadlinkou a třmínkem, hlemýžděm, nervem a mozkem. Kmit si části ucha předávají jedna po druhé jako štafetu. Krok 1: zvuková vlna projde zvukovodem, kmitá vzduch, akustická energie. Krok 2: vlna rozkmitá bubínek, mechanická energie. Krok 3: bubínek rozhoupe kladívko, kovadlinku a třmínek, kůstky předají kmit dál, mechanická energie. Krok 4: třmínek rozvlní kapalinu v hlemýždi, hydraulická energie. Krok 5: vláskové buňky vyšlou elektrický signál a nerv ho donese do mozku. Vždy se pohybuje jen ta část, na kterou právě došla řada, a zvýrazní se spolu s řádkem pod obrázkem. Do mozku se zvuk nedostane přímo, ale až po několika přeměnách." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Vnímání zvuku v pohybu 1/2: Štafeta v uchu</title>
	<!-- W95 OPRAVA 2 (15. 10. 2026). KRESBA UCHA PŘEVZATA z živého obr-01 téže stránky
	     (public/obrazky/fyzika/8-rocnik/zvuk/vnimani-zvuku-a-hlasitost/vnimani-zvuku-a-hlasitost-obr-01.svg, ř. 34–78:
	     hlava, spánková kost, zvukovod, bubínková dutina, polokruhové kanálky, předsíň, hlemýžď, nerv, mozek, bubínek,
	     kůstky, pružné okénko) — cesty beze změny v souřadnicích obr-01, výřez x 322–882, y 88–499, měřítko 0,7
	     (bod obr-01 (x, y) → panel (0,7·x − 191,4; 0,7·y + 76,4)). Boltec je mimo výřez (štafeta začíná
	     ve zvukovodu). Předloha obr-01 = PDF 35 s. 1 (řez uchem). Výklad: § Ucho jako přeměňovač energie
	     (vzduch = akustická, bubínek a kůstky = mechanická, kapalina = hydraulická, vláskové buňky → elektrický signál).
	     Rozdíl od obr-01 (tam vše kmitá naráz): zde jde o DĚJ — pohybuje se jen ta část, na kterou došla řada.
	     Bubínek je oranžový (oranžová = kmitající těleso, jako v panelu 2), modré oblouky = zvuková vlna (jako v obr-01).
	     Model, cyklus 8 s, krok i (1–5) v [1,6·(i−1); 1,6·i) s:
	       1) 0–1,6 s vlna (3 oblouky) projde zvukovodem: posun 48 jednotek obr-01 (= 33,6 px; poslední oblouk dojde k bubínku x 434) za 1,6 s;
	       2) 1,6–4,8 s bubínek kmitá ±5 j. (±3,5 px), perioda 0,6 s (trvá i v kroku 3, protože kůstky pohání);
	       3) 3,2–6,4 s kůstky se kývají ±4° kolem kloubu kladívko–kovadlinka (478, 262) ve fázi s bubínkem
	          (rukojeť kladívka ~83 j. pod kloubem → posun ±5,8 j.), pružné okénko ±4 j.; trvá i v kroku 4 (třmínek tlačí okénko);
	       4) 4,8–6,4 s kapalina v hlemýždi proudí: 3 snímky čárkování posunuté o 6 j. po 0,2 s (30 j./s jako obr-01);
	       5) 6,4–8 s signál: tečka po nervu 0–1,2 s (9 bodů Bézierovy křivky nervu z obr-01), záblesk mozku 7,6–8 s.
	     Kmitání je zpomalené. Bez pohybu (reduced-motion): vlna ve zvukovodu, vše v klidu, nic zvýrazněno.
	     Animace jen CSS transform a opacity; otáčení kůstek přes vnořené translate (počátek 0 0), bez transform-origin. -->
	<style>
		.hl { opacity: 0; animation: hl 8s linear infinite; }
		@keyframes hl { 0%, 19.9% { opacity: 1; } 20%, 100% { opacity: 0; } }
		.vl { animation: vl 8s linear infinite; }
		@keyframes vl { 0% { transform: translateX(0px); opacity: 0; } 2% { opacity: 1; } 18% { opacity: 1; } 20% { transform: translateX(48px); opacity: 0; } 100% { transform: translateX(48px); opacity: 0; } }
		.bu-p { opacity: 0; animation: bu-p 8s linear infinite; }
		@keyframes bu-p { 0%, 19.9% { opacity: 0; } 20%, 59.9% { opacity: 1; } 60%, 100% { opacity: 0; } }
		.bu-k { animation: bu-k 8s linear infinite; }
		@keyframes bu-k { 0%, 19.9% { opacity: 1; } 20%, 59.9% { opacity: 0; } 60%, 100% { opacity: 1; } }
		.ku-p { opacity: 0; animation: ku-p 8s linear infinite; }
		@keyframes ku-p { 0%, 39.9% { opacity: 0; } 40%, 79.9% { opacity: 1; } 80%, 100% { opacity: 0; } }
		.ku-k { animation: ku-k 8s linear infinite; }
		@keyframes ku-k { 0%, 39.9% { opacity: 1; } 40%, 79.9% { opacity: 0; } 80%, 100% { opacity: 1; } }
		.ka-p { opacity: 0; animation: ka-p 8s linear infinite; }
		@keyframes ka-p { 0%, 59.9% { opacity: 0; } 60%, 79.9% { opacity: 1; } 80%, 100% { opacity: 0; } }
		.ka-k { animation: ka-k 8s linear infinite; }
		@keyframes ka-k { 0%, 59.9% { opacity: 1; } 60%, 79.9% { opacity: 0; } 80%, 100% { opacity: 1; } }
		.kmb { animation: kmb 0.3s ease-in-out infinite alternate; }
		@keyframes kmb { 0% { transform: translateX(-5px); } 100% { transform: translateX(5px); } }
		.kmo { animation: kmo 0.3s ease-in-out infinite alternate; }
		@keyframes kmo { 0% { transform: translateX(-4px); } 100% { transform: translateX(4px); } }
		.rot { animation: rot 0.3s ease-in-out infinite alternate; }
		@keyframes rot { 0% { transform: rotate(4deg); } 100% { transform: rotate(-4deg); } }
		.f { opacity: 0; animation: f 0.6s linear infinite; }
		@keyframes f { 0%, 33.3% { opacity: 1; } 33.31%, 100% { opacity: 0; } }
		.sg { opacity: 0; animation: sg 8s linear infinite; }
		@keyframes sg {
			0%, 79.9% { transform: translate(0px, 0px); opacity: 0; }
			80% { transform: translate(0px, 0px); opacity: 1; }
			81.875% { transform: translate(34.75px, -16.84px); }
			83.75% { transform: translate(62px, -37.25px); }
			85.625% { transform: translate(83.25px, -61.03px); }
			87.5% { transform: translate(100px, -88px); }
			89.375% { transform: translate(109.78px, -109px); }
			91.25% { transform: translate(118.25px, -130px); }
			93.125% { transform: translate(125.6px, -151px); }
			95% { transform: translate(132px, -172px); opacity: 1; }
			95.1%, 100% { transform: translate(132px, -172px); opacity: 0; }
		}
		.mz { opacity: 0; animation: mz 8s linear infinite; }
		@keyframes mz { 0%, 94.9% { opacity: 0; } 95%, 100% { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) {
			.hl, .vl, .bu-p, .bu-k, .ku-p, .ku-k, .ka-p, .ka-k, .kmb, .kmo, .rot, .f, .sg, .mz { animation: none; }
		}
	</style>
