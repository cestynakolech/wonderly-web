<svg viewBox="0 0 460 640" width="460" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hmotnost v pohybu, Jednotky a vhodné váhy: na kuchyňskou váhu dopadne kousek salámu a displej ukáže 100 g, to je 10 dag, lidově 10 deka. Na velkou plošinovou váhu, kreslenou zmenšeně, dopadnou 4 pytle cementu po 25 kg a displej ukáže 100 kg, protože 4 krát 25 kg je 100 kg, to je 1 q, lidově metrák. Kuchyňská váha váží jen do 5 kg, cement patří na velkou váhu. Platí 1 kg = 1 000 g a 1 t = 1 000 kg." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Hmotnost v pohybu 2/2: Jednotky a vhodné váhy</title>
	<!-- W99. Předloha: PDF 6/03 Fyzikální veličiny/7. Hmotnost, s. 3–4 (1 kg = 1 000 g, 1 t = 1 000 kg; dekagram: „10 deka salámu = 100 g“, 1 dag = 10 g; metrický cent: metrák cementu, brambor, 1 q = 100 kg) a s. 10–11 (zvolíme vhodné měřidlo; rozsah stupnice – těžší předmět může váhu zničit), výklad temata.ts (Další jednotky, Pravidla; rozsah 5 kg = obr-07). Cyklus 8 s: salám padá 0–0,5 s, displej 100 g, popisek od 1 s; pytle padají 3,0–3,5 s, displej 100 kg, popisek od 4 s; drží do 7,5 s; salám i pytle zmizí 7,5–7,6 s, teprve pak displeje 0 g / 0 kg. OPRAVA 1: pytel padá jen 30 px a displej plošinové váhy je v podstavci pod plošinou (pytel přes něj nepřejíždí); pytel větší než celá kuchyňská váha (160×158 px vs 100 px). OPRAVA 2: místo jednoho pytle 100 kg (v prodeji neexistuje, měřítko neodpovídalo) 4 ležící pytle cementu po 25 kg (PDF s. 4 „metrák cementu“; 25 kg = běžné balení), 4 · 25 = 100 kg; pravá část v čárkovaném podkladu „kresleno zmenšeně“ = jiné měřítko než kuchyňská váha. Klid (reduced motion): obojí zvážené. -->
	<style>
		.a3sa { animation: a3sa 8s infinite; }
		@keyframes a3sa { 0% { transform: translateY(-70px); opacity: 0; animation-timing-function: ease-in; } 6.25%, 93.75% { transform: translateY(0px); opacity: 1; } 95%, 100% { transform: translateY(0px); opacity: 0; } }
		.a3py { animation: a3py 8s infinite; }
		@keyframes a3py { 0%, 37.5% { transform: translateY(-30px); opacity: 0; animation-timing-function: ease-in; } 43.75%, 93.75% { transform: translateY(0px); opacity: 1; } 95%, 100% { transform: translateY(0px); opacity: 0; } }
		.a3k0 { animation: a3k0 8s step-end infinite; }
		@keyframes a3k0 { 0% { opacity: 1; } 6.25% { opacity: 0; } 95% { opacity: 1; } 100% { opacity: 1; } }
		.a3k1 { animation: a3k1 8s step-end infinite; }
		@keyframes a3k1 { 0% { opacity: 0; } 6.25% { opacity: 1; } 95% { opacity: 0; } 100% { opacity: 0; } }
		.a3p0 { animation: a3p0 8s step-end infinite; }
		@keyframes a3p0 { 0% { opacity: 1; } 43.75% { opacity: 0; } 95% { opacity: 1; } 100% { opacity: 1; } }
		.a3p1 { animation: a3p1 8s step-end infinite; }
		@keyframes a3p1 { 0% { opacity: 0; } 43.75% { opacity: 1; } 95% { opacity: 0; } 100% { opacity: 0; } }
		.a3l1 { animation: a3l1 8s step-end infinite; }
		@keyframes a3l1 { 0% { opacity: 0; } 12.5% { opacity: 1; } 95% { opacity: 0; } 100% { opacity: 0; } }
		.a3l2 { animation: a3l2 8s step-end infinite; }
		@keyframes a3l2 { 0% { opacity: 0; } 50% { opacity: 1; } 95% { opacity: 0; } 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.a3sa, .a3py, .a3k0, .a3k1, .a3p0, .a3p1, .a3l1, .a3l2 { animation: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="640" fill="#f8f9fa" />
	<g id="panel-2">
		<rect x="26" y="22" width="420" height="606" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="606" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Jednotky a vhodné váhy</text>
		<text x="40" y="96" font-size="20" fill="#2b2a26">Malá věc na malou váhu,</text>
		<text x="40" y="122" font-size="20" fill="#2b2a26">velká věc na velkou váhu.</text>
		<!-- pravá část = jiné měřítko (zmenšeno) -->
		<rect x="196" y="130" width="236" height="314" rx="8" fill="#f1ede4" stroke="#868e96" stroke-width="2" stroke-dasharray="6 5" />
		<text x="312" y="154" text-anchor="middle" font-size="20" font-style="italic" fill="#2b2a26">kresleno zmenšeně</text>
		<!-- podlaha -->
		<rect x="40" y="372" width="380" height="8" rx="3" fill="#6c757d" />
		<!-- kuchyňská váha (malá: 100 px) -->
		<rect x="66" y="330" width="100" height="42" rx="8" fill="#343a40" stroke="#2b2a26" stroke-width="2.5" />
		<rect x="73" y="336" width="86" height="30" rx="5" fill="#d3f9d8" stroke="#8ce99a" stroke-width="2.5" />
		<g font-size="22" font-weight="bold" fill="#2b2a26" text-anchor="middle">
			<text class="a3k0" x="116" y="359" opacity="0">0 g</text>
			<text class="a3k1" x="116" y="359">100 g</text>
		</g>
		<g class="a3sa">
			<rect x="88" y="300" width="52" height="18" rx="9" fill="#9c3644" stroke="#5c1a24" stroke-width="2.5" />
			<path d="M140 309H147" stroke="#5c1a24" stroke-width="3" stroke-linecap="round" />
			<circle cx="100" cy="307" r="2.5" fill="#ffe3e3" />
			<circle cx="112" cy="313" r="2.5" fill="#ffe3e3" />
			<circle cx="124" cy="306" r="2.5" fill="#ffe3e3" />
			<circle cx="132" cy="312" r="2.5" fill="#ffe3e3" />
		</g>
		<rect x="60" y="318" width="112" height="10" rx="4" fill="#ced4da" stroke="#495057" stroke-width="2.5" />
		<text x="116" y="408" text-anchor="middle" font-size="20" fill="#2b2a26">salám</text>
		<text x="116" y="432" text-anchor="middle" font-size="20" fill="#2b2a26">kuchyňská váha</text>
		<!-- plošinová váha: displej v podstavci pod plošinou (pytel přes něj nepadá) -->
		<rect x="210" y="330" width="204" height="42" rx="6" fill="#343a40" stroke="#2b2a26" stroke-width="2.5" />
		<rect x="265" y="336" width="94" height="30" rx="4" fill="#d3f9d8" stroke="#8ce99a" stroke-width="2.5" />
		<g font-size="22" font-weight="bold" fill="#2b2a26" text-anchor="middle">
			<text class="a3p0" x="312" y="359" opacity="0">0 kg</text>
			<text class="a3p1" x="312" y="359">100 kg</text>
		</g>
		<!-- 4 pytle cementu po 25 kg (ležící, 180 × 32 px; vpravo kresleno zmenšeně = jiné měřítko) -->
		<g class="a3py">
			<rect x="222" y="286" width="180" height="32" rx="12" fill="#dee2e6" stroke="#495057" stroke-width="2.5" />
			<path d="M234 292V312M390 292V312" stroke="#495057" stroke-width="2" stroke-linecap="round" />
			<text x="312" y="309" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2a26">25 kg</text>
			<rect x="222" y="254" width="180" height="32" rx="12" fill="#dee2e6" stroke="#495057" stroke-width="2.5" />
			<path d="M234 260V280M390 260V280" stroke="#495057" stroke-width="2" stroke-linecap="round" />
			<text x="312" y="277" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2a26">25 kg</text>
			<rect x="222" y="222" width="180" height="32" rx="12" fill="#dee2e6" stroke="#495057" stroke-width="2.5" />
			<path d="M234 228V248M390 228V248" stroke="#495057" stroke-width="2" stroke-linecap="round" />
			<text x="312" y="245" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2a26">25 kg</text>
			<rect x="222" y="190" width="180" height="32" rx="12" fill="#dee2e6" stroke="#495057" stroke-width="2.5" />
			<path d="M234 196V216M390 196V216" stroke="#495057" stroke-width="2" stroke-linecap="round" />
			<text x="312" y="213" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2a26">25 kg</text>
		</g>
		<rect x="204" y="318" width="216" height="12" rx="3" fill="#adb5bd" stroke="#495057" stroke-width="2.5" />
		<text x="312" y="408" text-anchor="middle" font-size="20" fill="#2b2a26">4 pytle cementu</text>
		<text x="312" y="432" text-anchor="middle" font-size="20" fill="#2b2a26">velká váha</text>
		<!-- převody -->
		<g class="a3l1">
			<text x="116" y="472" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2a26">100 g = 10 dag</text>
			<text x="116" y="498" text-anchor="middle" font-size="20" fill="#2b2a26">„10 deka“</text>
		</g>
		<g class="a3l2">
			<text x="312" y="472" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2a26">4 · 25 kg = 100 kg</text>
			<text x="312" y="498" text-anchor="middle" font-size="20" fill="#2b2a26">= 1 q, „metrák“</text>
		</g>
		<path d="M40 518H420" stroke="#868e96" stroke-width="2" />
		<text x="40" y="546" font-size="20" font-weight="bold" fill="#2b2a26">Pozor na rozsah:</text>
		<text x="40" y="572" font-size="20" fill="#2b2a26">kuchyňská váha váží jen do 5 kg.</text>
		<text x="40" y="606" font-size="20" fill="#2b2a26">1 kg = 1 000 g  ·  1 t = 1 000 kg</text>
	</g>
</svg>
