	<style>
		.za { transform-box: view-box; transform-origin: 70px 449px; animation: za 12s linear infinite; } .zd { transform-box: view-box; transform-origin: 270px 449px; animation: zd 12s linear infinite; }
		.ga { animation: ga 12s linear infinite; } .gd { animation: gd 12s linear infinite; }
		.ba { animation: ba 12s linear infinite; } .bd { animation: bd 12s linear infinite; }
		.stejne { animation: stejne 12s steps(1, end) infinite; }
		@keyframes stejne { 0% { opacity: 1; } 38%,40%,88%,90%,97% { opacity: 0; } 100% { opacity: 1; } }
