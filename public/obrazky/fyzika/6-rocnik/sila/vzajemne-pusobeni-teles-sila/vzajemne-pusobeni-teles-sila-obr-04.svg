<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: čtyři stejné siloměry se stupnicí 0 až 10 N. Na první se zavěsí jedno závaží, na další dvě, tři a čtyři. Každé závaží má 100 gramů a táhne silou asi 1 N. Ukazatele ukážou 1 N, 2 N, 3 N a 4 N a háček klesá tím níž, čím víc závaží visí: kolikrát větší síla, tolikrát větší prodloužení.">
<style>
/* Předloha: PDF Vzájemné působení těles, síla – kresba čtyř siloměrů s jedním až čtyřmi barevnými závažími (ukazují 1, 2, 3, 4 N). Překresleno, zavěšování animováno. Bez animace = všechna závaží zavěšená. */
/* cyklus 12 s: siloměry se zatěžují postupně (1., 2., 3., 4. závaží), drží, na konci zhasne a začne znovu. 20 px na 1 N. */
@keyframes z0 { 0%, 8% { transform: translateY(0px); } 16%, 100% { transform: translateY(20px); } }
@keyframes w0 { 0%, 5% { opacity: 0; } 8%, 100% { opacity: 1; } }
.z0 { animation: z0 12s ease-out infinite; } .w0 { animation: w0 12s linear infinite; }
@keyframes z1 { 0%, 26% { transform: translateY(0px); } 34%, 100% { transform: translateY(40px); } }
@keyframes w1 { 0%, 23% { opacity: 0; } 26%, 100% { opacity: 1; } }
.z1 { animation: z1 12s ease-out infinite; } .w1 { animation: w1 12s linear infinite; }
@keyframes z2 { 0%, 44% { transform: translateY(0px); } 52%, 100% { transform: translateY(60px); } }
@keyframes w2 { 0%, 41% { opacity: 0; } 44%, 100% { opacity: 1; } }
.z2 { animation: z2 12s ease-out infinite; } .w2 { animation: w2 12s linear infinite; }
@keyframes z3 { 0%, 62% { transform: translateY(0px); } 70%, 100% { transform: translateY(80px); } }
@keyframes w3 { 0%, 59% { opacity: 0; } 62%, 100% { opacity: 1; } }
.z3 { animation: z3 12s ease-out infinite; } .w3 { animation: w3 12s linear infinite; }
@keyframes sc { 0% { opacity: 0; } 4%, 94% { opacity: 1; } 100% { opacity: 0; } }
.sc { animation: sc 12s linear infinite; }

@media (prefers-reduced-motion: reduce) { .sc, .z0, .w0, .z1, .w1, .z2, .w2, .z3, .w3 { animation: none; } }
</style>
