<path d="M640 168L549.95 174.67" stroke="#1864ab" stroke-width="5" stroke-linecap="round"/><path d="M532 176L549.29 165.69L550.62 183.65Z" fill="#1864ab"/>
<text x="650" y="176" font-size="30" fill="#1864ab" font-weight="bold">v kg</text>
<path d="M640 318L539.05 283.78" stroke="#1864ab" stroke-width="5" stroke-linecap="round"/><path d="M522 278L541.94 275.26L536.16 292.3Z" fill="#1864ab"/>
<text x="650" y="330" font-size="30" fill="#1864ab" font-weight="bold">v m³</text>
