		.p1-b-t { animation: p1-b-t 7s linear infinite; }
		@keyframes p1-b-l { 0% { stroke-dashoffset: 100; opacity: 1 } 24% { stroke-dashoffset: 100; opacity: 1 } 36% { stroke-dashoffset: 0; opacity: 1 } 76% { stroke-dashoffset: 0; opacity: 1 } 82% { stroke-dashoffset: 0; opacity: 0 } 99.9% { stroke-dashoffset: 100; opacity: 0 } 100% { stroke-dashoffset: 100; opacity: 1 } }
		@keyframes p1-b-h { 0% { transform: translateX(-56px); opacity: 0 } 24% { transform: translateX(-56px); opacity: 0 } 25% { transform: translateX(-53.2px); opacity: 1 } 36% { transform: translateX(0px); opacity: 1 } 76% { transform: translateX(0px); opacity: 1 } 82% { transform: translateX(0px); opacity: 0 } 100% { transform: translateX(-56px); opacity: 0 } }
		@keyframes p1-b-t { 0% { opacity: 0 } 20% { opacity: 0 } 24% { opacity: 1 } 76% { opacity: 1 } 82% { opacity: 0 } 100% { opacity: 0 } }
