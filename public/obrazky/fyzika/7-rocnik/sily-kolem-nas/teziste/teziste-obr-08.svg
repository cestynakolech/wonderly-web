<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tři nákresy téže šikmo vychýlené tyče vedle sebe, u každého je označený bod T a z něj vede svisle dolů šipka tíhové síly. Vlevo a) stálá poloha: tyč visí na závěsu nahoře, bod T je pod závěsem. Uprostřed b) volná poloha: tyč se otáčí kolem bodu, který leží v bodě T. Vpravo c) vratká poloha: tyč stojí na podpěrném bodu dole, bod T je nad ním.">
