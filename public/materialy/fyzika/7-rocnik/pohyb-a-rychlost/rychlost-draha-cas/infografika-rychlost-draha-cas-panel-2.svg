"middle" fill="#495057">km</text><line x1="310" y1="750" x2="360" y2="780" stroke="#495057" stroke-width="2.5"/><rect x="300" y="780" width="120" height="100" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="360" y="810" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">čas</text><text x="360" y="839" font-size="21" text-anchor="middle" fill="#495057">s</text><text x="360" y="867" font-size="21" text-anchor="middle" fill="#495057">h</text><text x="34" y="914" font-size="21" fill="#2b2a26">Jednotky, které patří k sobě:</text><text x="34" y="942" font-size="21" fill="#2b2a26">metry a sekundy → <tspan font-weight="bold">m/s</tspan></text><text x="34" y="970" font-size="21" fill="#2b2a26">kilometry a hodiny → <tspan font-weight="bold">km/h</tspan></text><rect x="30" y="986" width="400" height="82" rx="8" fill="#f1f3f5" stroke="#ced4da" stroke-width="2"/><text x="44" y="1016" font-size="21" fill="#2b2a26">Příklad: 30 m za 3 s</text><text x="44" y="1050" font-size="21" fill="#2b2a26">v = 30 : 3 = <tspan font-weight="bold">10 m/s</tspan></text><text x="34" y="1106" font-size="21" fill="#495057" xml:space="preserve">Také: s = v · t  a  t = s : v</text></g>
