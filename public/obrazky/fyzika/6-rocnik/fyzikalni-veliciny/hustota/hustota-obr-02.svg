<text x="170" y="524" font-size="20" fill="#a85a12" text-anchor="middle" >hustota</text>
<rect x="300" y="460" width="200" height="76" rx="12" fill="#fff" stroke="#a85a12" stroke-width="2.5"/><text x="400" y="494" font-size="28" fill="#212529" text-anchor="middle" font-weight="bold">m = ρ · V</text>
<text x="400" y="524" font-size="20" fill="#a85a12" text-anchor="middle" >hmotnost</text>
