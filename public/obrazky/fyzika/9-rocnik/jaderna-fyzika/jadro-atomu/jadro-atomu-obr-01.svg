"round"/></g></g><path d="M150 158L262 318" stroke="#212529" stroke-width="2"/><circle cx="262" cy="318" r="4" fill="#212529"/><rect x="22" y="124" width="150" height="40" rx="8" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/><text x="97" y="152" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">jádro atomu</text><path d="M470 158L436 196" stroke="#212529" stroke-width="2"/><circle cx="436" cy="196" r="4" fill="#212529"/><rect x="428" y="124" width="150" height="40" rx="8" fill="#fff" stroke="#868e96" stroke-width="2"/><text x="503" y="152" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">obal atomu</text><rect x="30" y="580" width="540" height="118" rx="12" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/><text x="300" y="615" font-size="20" fill="#212529" text-anchor="middle">Jádro: <tspan font-weight="bold">6 protonů</tspan> + 6 neutronů (nukleony).</text><text x="300" y="646" font-size="20" fill="#212529" text-anchor="middle">Obal: <tspan font-weight="bold">6 elektronů</tspan>.</text><text x="300" y="677" font-size="20" fill="#212529" text-anchor="middle">Protonů je stejně jako elektronů → atom je neutrální.</text><text x="300" y="728" font-size="19" fill="#495057" text-anchor="middle">Jádro je ve skutečnosti asi stotisíckrát menší než atom.</text>
</svg>
