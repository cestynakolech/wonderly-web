<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Izotopy vodíku. Lehký vodík (protium) má v jádře 1 proton a 0 neutronů, těžký vodík (deuterium) 1 proton a 1 neutron, supertěžký vodík (tritium) 1 proton a 2 neutrony. Všechny mají 1 proton, je to pořád vodík. Deuterium je dvakrát těžší než lehký vodík, tritium je vzácné a radioaktivní. Animace: do jader přiletí neutrony.">
<style>
.d1 { animation: d1 9s ease-in-out infinite; }
@keyframes d1 { 0%, 8% { transform: translate(-80px, 0); opacity: 0; } 12% { opacity: 1; } 28%, 100% { transform: translate(0, 0); opacity: 1; } }
.t1 { animation: t1 9s ease-in-out infinite; }
@keyframes t1 { 0%, 32% { transform: translate(-80px, 0); opacity: 0; } 36% { opacity: 1; } 50%, 100% { transform: translate(0, 0); opacity: 1; } }
.t2 { animation: t2 9s ease-in-out infinite; }
@keyframes t2 { 0%, 46% { transform: translate(-80px, 0); opacity: 0; } 50% { opacity: 1; } 64%, 100% { transform: translate(0, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .d1, .t1, .t2 { animation: none; } }
/* Předloha: PDF lekce 17, s. 8 – zápisy ¹₁H, ²₁H, ³₁H, jádra (oranžový proton, šedé neutrony) a zelené štítky
   lehký vodík (protium), těžký vodík (deuterium), supertěžký vodík (tritium). „Dvakrát těžší“, „vzácné a radioaktivní“
   z výkladu (Izotopy). Smyčka 9 s: neutrony přiletí zleva do jader deuteria a tritia. Bez animace = jádra úplná. */
</style>
<rect x="3" y="3" width="594" height="594" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="42" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Izotopy vodíku</text>
<g><circle cx="130" cy="84" r="13" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M122.8 84H137.2M130 76.8V91.2" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g><text x="152" y="92" font-size="21" fill="#212529" text-anchor="start">proton</text><circle cx="330" cy="84" r="13" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><text x="352" y="92" font-size="21" fill="#212529" text-anchor="start">neutron</text><text x="88" y="146.7" font-size="32" font-weight="bold" fill="#212529" text-anchor="end">1</text><text x="88" y="185.1" font-size="32" font-weight="bold" fill="#212529" text-anchor="end">1</text><text x="92" y="180" font-size="64" font-weight="bold" fill="#212529">H</text><text x="288" y="146.7" font-size="32" font-weight="bold" fill="#212529" text-anchor="end">2</text><text x="288" y="185.1" font-size="32" font-weight="bold" fill="#212529" text-anchor="end">1</text><text x="292" y="180" font-size="64" font-weight="bold" fill="#212529">H</text><text x="488" y="146.7" font-size="32" font-weight="bold" fill="#212529" text-anchor="end">3</text><text x="488" y="185.1" font-size="32" font-weight="bold" fill="#212529" text-anchor="end">1</text><text x="492" y="180" font-size="64" font-weight="bold" fill="#212529">H</text><g><circle cx="100" cy="250" r="24" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M86.8 250H113.2M100 236.8V263.2" stroke="#fff" stroke-width="4.8" stroke-linecap="round"/></g><circle class="d1" cx="286" cy="234" r="24" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><g><circle cx="310" cy="262" r="24" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M296.8 262H323.2M310 248.8V275.2" stroke="#fff" stroke-width="4.8" stroke-linecap="round"/></g><circle class="t1" cx="482" cy="230" r="24" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle class="t2" cx="478" cy="270" r="24" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><g><circle cx="516" cy="256" r="24" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M502.8 256H529.2M516 242.8V269.2" stroke="#fff" stroke-width="4.8" stroke-linecap="round"/></g><rect x="6" y="304" width="188" height="76" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="100" y="336" font-size="21" font-weight="bold" fill="#212529" text-anchor="middle">lehký vodík</text><text x="100" y="366" font-size="20" fill="#212529" text-anchor="middle">(protium)</text><text x="100" y="412" font-size="20" font-weight="bold" fill="#c92a2a" text-anchor="middle">1 proton</text><text x="100" y="440" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">0 neutronů</text><rect x="206" y="304" width="188" height="76" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="300" y="336" font-size="21" font-weight="bold" fill="#212529" text-anchor="middle">těžký vodík</text><text x="300" y="366" font-size="20" fill="#212529" text-anchor="middle">(deuterium)</text><text x="300" y="412" font-size="20" font-weight="bold" fill="#c92a2a" text-anchor="middle">1 proton</text><text x="300" y="440" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">1 neutron</text><rect x="406" y="304" width="188" height="76" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2.5"/><text x="500" y="336" font-size="21" font-weight="bold" fill="#212529" text-anchor="middle">supertěžký vodík</text><text x="500" y="366" font-size="20" fill="#212529" text-anchor="middle">(tritium)</text><text x="500" y="412" font-size="20" font-weight="bold" fill="#c92a2a" text-anchor="middle">1 proton</text><text x="500" y="440" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">2 neutrony</text><rect x="22" y="466" width="556" height="112" rx="12" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/><text x="300" y="498.4" font-size="21" fill="#212529" text-anchor="middle">Všechny mají 1 proton – je to pořád vodík.</text><text x="300" y="529.4" font-size="21" fill="#212529" text-anchor="middle">Deuterium je dvakrát těžší než lehký vodík.</text><text x="300" y="560.4" font-size="21" fill="#212529" text-anchor="middle">Tritium je v přírodě vzácné a radioaktivní.</text>
</svg>
