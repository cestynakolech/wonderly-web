<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vodní elektrárna. Voda z nádrže za hrází teče potrubím dolů na turbínu, roztáčí ji a generátor vyrábí elektřinu, která jde do vedení. Voda pak odtéká do řeky.">
<style>
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes rotz { to { transform: rotate(-360deg); } }
.rot { animation: rot 1.6s linear infinite; }
@keyframes tok { to { stroke-dashoffset: -36; } }
@keyframes tokz { to { stroke-dashoffset: 36; } }
.tok { stroke-dasharray: 12 24; animation: tok 1s linear infinite; }
.tokz { stroke-dasharray: 12 24; animation: tokz 1s linear infinite; }
@keyframes el { to { stroke-dashoffset: -18; } }
@keyframes elz { to { stroke-dashoffset: 18; } }
.el { stroke-dasharray: 8 10; animation: el 0.6s linear infinite; }
.elz { stroke-dasharray: 8 10; animation: elz 0.6s linear infinite; }
.reka { stroke-dasharray: 26 18; animation: reka 1.6s linear infinite; }
@keyframes reka { to { stroke-dashoffset: -44; } }
/* Voda z nádrže teče potrubím hrází na turbínu, generátor vyrábí elektřinu (žluté čárky do vedení).
   Klid: turbína stojí. */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
