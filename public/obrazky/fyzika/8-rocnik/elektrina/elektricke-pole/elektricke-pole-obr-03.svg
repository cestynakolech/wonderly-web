<g class="nb"><g><circle cx="155" cy="124" r="12" fill="#c92a2a" stroke="#7a1c1c" stroke-width="1.5"/><path d="M148.4 124H161.6M155 117.4V130.6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><path d="M171 124H201" stroke="#5f3dc4" stroke-width="5" stroke-linecap="round"/><polygon points="214.2,124 194.6,116.3 198.8,124 194.6,131.7" fill="#5f3dc4"/></g>
