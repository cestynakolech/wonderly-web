<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Zápis jádra uranu: nukleonové číslo 238 vlevo nahoře, protonové číslo 92 vlevo dole, vedle značka U. Nukleonové číslo A je počet protonů a neutronů, protonové číslo Z je počet protonů a určuje prvek. Příklad: neutrální atom uranu 238 má 92 protonů, 238 − 92 = 146 neutronů a 92 elektronů. Animace: bubliny a řádky výpočtu se postupně objevují.">
<style>
.b1 { animation: b1 12s linear infinite; } @keyframes b1 { 0%, 4% { opacity: 0; } 10%, 100% { opacity: 1; } }
.b2 { animation: b2 12s linear infinite; } @keyframes b2 { 0%, 16% { opacity: 0; } 22%, 100% { opacity: 1; } }
.r1 { animation: r1 12s linear infinite; } @keyframes r1 { 0%, 32% { opacity: 0; } 37%, 100% { opacity: 1; } }
.r2 { animation: r2 12s linear infinite; } @keyframes r2 { 0%, 46% { opacity: 0; } 51%, 100% { opacity: 1; } }
.r3 { animation: r3 12s linear infinite; } @keyframes r3 { 0%, 60% { opacity: 0; } 65%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .b1, .b2, .r1, .r2, .r3 { animation: none; } }
/* Předloha: PDF lekce 17, s. 5 (bubliny Nukleonové číslo / Protonové číslo u značky prvku) a s. 6 (příklad uran 238:
   92 protonů, 238 − 92 = 146 neutronů, 92 elektronů). Na s. 5 je železo ⁵⁶₂₆Fe – protonové číslo 26 výklad nemá,
   proto je značka nakreslena na uranu z příkladu s. 6. Smyčka 12 s: bubliny a řádky výpočtu se postupně objeví.
   Bez animace = vše vidět. */
</style>
<rect x="3" y="3" width="594" height="604" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="42" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Jak zapsat jádro atomu</text>
<text x="472" y="190" font-size="62" font-weight="bold" fill="#862e9c" text-anchor="end">238</text><text x="472" y="262" font-size="62" font-weight="bold" fill="#c92a2a" text-anchor="end">92</text><text x="482" y="252" font-size="130" font-weight="bold" fill="#212529">U</text><g class="b1"><path d="M22 92H300Q312 92 312 104V124L362 168L312 152V172Q312 184 300 184H34Q22 184 22 172Z" fill="#fff3bf" stroke="#212529" stroke-width="2"/><text x="36" y="126" font-size="22" font-weight="bold" fill="#862e9c" text-anchor="start">Nukleonové číslo A</text><text x="36" y="160" font-size="21" fill="#212529" text-anchor="start">protony + neutrony</text></g><g class="b2"><path d="M22 214H300Q312 214 312 226V236L362 246L312 262V294Q312 306 300 306H34Q22 306 22 294Z" fill="#fff3bf" stroke="#212529" stroke-width="2"/><text x="36" y="248" font-size="22" font-weight="bold" fill="#c92a2a" text-anchor="start">Protonové číslo Z</text><text x="36" y="282" font-size="21" fill="#212529" text-anchor="start">počet protonů – určuje prvek</text></g><rect x="22" y="336" width="556" height="250" rx="12" fill="#fff9db" stroke="#495057" stroke-width="2"/><text x="42" y="374" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">Příklad: neutrální atom uranu 238</text><g class="r1"><text x="42" y="420" font-size="22" font-weight="bold" fill="#c92a2a" text-anchor="start">protonů:</text><text x="250" y="420" font-size="22" fill="#212529" text-anchor="start">Z = 92</text></g><g class="r2"><text x="42" y="466" font-size="22" font-weight="bold" fill="#495057" text-anchor="start">neutronů:</text><text x="250" y="466" font-size="22" fill="#212529" text-anchor="start">A − Z = 238 − 92 = 146</text></g><g class="r3"><text x="42" y="512" font-size="22" font-weight="bold" fill="#1864ab" text-anchor="start">elektronů:</text><text x="250" y="512" font-size="22" fill="#212529" text-anchor="start">92</text></g><g class="r3"><text x="250" y="548" font-size="19" fill="#495057" text-anchor="start">(stejně jako protonů –</text><text x="250" y="572" font-size="19" fill="#495057" text-anchor="start">atom je neutrální)</text></g>
</svg>
