<svg viewBox="0 664 460 608" width="460" height="608" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pevná kladka visí nahoře u stropu a neposouvá se; přes ni vede lano, na jednom konci visí závaží 2 kg s tíhou FG = 20 N, na druhém konci táhne ruka dolů silou F = 20 N; ruka stáhne lano o 1 m dolů, kladka se otočí a závaží vyjede o 1 m nahoru; F = FG = 20 N, síla se nezmění, pevná kladka mění směr tahu; vlajka na stožáru, studna s okovem" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
