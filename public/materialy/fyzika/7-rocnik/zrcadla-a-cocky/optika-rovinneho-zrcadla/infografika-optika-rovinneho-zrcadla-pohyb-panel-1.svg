<svg viewBox="0 0 460 650" width="460" height="650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rovinné zrcadlo v pohybu 1/3, Ema jde k zrcadlu: Ema stojí před zrcadlem na stojanu a jde k němu po dlaždicích, nejdřív 3 dlaždice od zrcadla, pak 2 a nakonec 1, potom couvne zpět. Její obraz za zrcadlem jde proti ní a je vždy stejně daleko za zrcadlem jako Ema před ním: 3 a 3, 2 a 2, 1 a 1 dlaždice. Modrá čárkovaná čára nad hlavou ukazuje, že obraz je stejně vysoký, tedy stejně velký jako Ema. Obraz je kreslený světle a čárkovaně, protože je zdánlivý." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Rovinné zrcadlo v pohybu 1/3: Ema jde k zrcadlu</title>
	<!-- W91 (15. 10. 2026). Předloha: PDF 22 Rovinné zrcadlo, s. 6 (vlastnosti 2. stejně velký, 3. stejně vzdálený od zrcadla)
	     a s. 7 (K a K′ souměrně podle zrcadla, čárkované spojnice); infografika učitele unnamed.png u PDF 22 (postava před
	     zrcadlem na stojanu, jablko na pravítku „stejná velikost a vzdálenost“). Výklad § Vlastnosti obrazu (stejně velký,
	     stejně vzdálený, zdánlivý). Odlišení od obr-02 (statická konstrukce K): tady Ema JDE a obraz jde s ní.
	     Geometrie: zrcadlo x = 230, obraz = osová souměrnost x′ = 460 − x (obal matrix(-1 0 0 1 460 0) — obraz je přesná
	     kopie Emy se stejnými animacemi, takže je souměrný v každém okamžiku). Dlaždice 60 px; Ema (střed) x = 230 − 60·k,
	     k = 3, 2, 1 (x = 50, 110, 170), obraz x′ = 230 + 60·k (410, 350, 290). Celá čísla dlaždic.
	     Časování 9 s: stojí k = 3 (0–1 s), jde (1–2 s), stojí k = 2 (2–3,5 s), jde (3,5–4,5 s), stojí k = 1 (4,5–6,5 s),
	     couvá na k = 3 (6,5–8 s), stojí (8–9 s). Pohyb začíná v 1 s. Růžová kóta (jako „stejně daleko“ v obr-02) se zkracuje
	     spolu s chůzí (scaleX = k/3 kolem bodu zrcadla). Modrá = stejně velký (jako obr-02). Obraz = světlý a čárkovaný = zdánlivý
	     (jako W89). Zrcadlo = černá plocha + šedý rub (jako W89). Bez pohybu: k = 3 s popiskem „3 dlaždice“. -->
	<style>
		.ch { animation: ch 9s linear infinite; }
		@keyframes ch { 0%, 11.111% { transform: translate(50px,420px); } 22.222%, 38.889% { transform: translate(110px,420px); } 50%, 72.222% { transform: translate(170px,420px); } 88.889%, 100% { transform: translate(50px,420px); } }
		.na, .nb { transform-box: view-box; transform-origin: 0px 0px; }
		.na { animation: na 9s linear infinite; }
		.nb { animation: nb 9s linear infinite; }
		@keyframes na { 0%, 11.111% { transform: rotate(0deg); } 13.889% { transform: rotate(18deg); } 19.444% { transform: rotate(-18deg); } 22.222%, 38.889% { transform: rotate(0deg); } 41.667% { transform: rotate(18deg); } 47.222% { transform: rotate(-18deg); } 50%, 72.222% { transform: rotate(0deg); } 76.389% { transform: rotate(-18deg); } 84.722% { transform: rotate(18deg); } 88.889%, 100% { transform: rotate(0deg); } }
		@keyframes nb { 0%, 11.111% { transform: rotate(0deg); } 13.889% { transform: rotate(-18deg); } 19.444% { transform: rotate(18deg); } 22.222%, 38.889% { transform: rotate(0deg); } 41.667% { transform: rotate(-18deg); } 47.222% { transform: rotate(18deg); } 50%, 72.222% { transform: rotate(0deg); } 76.389% { transform: rotate(18deg); } 84.722% { transform: rotate(-18deg); } 88.889%, 100% { transform: rotate(0deg); } }
		.ko { transform-box: view-box; transform-origin: 230px 478px; animation: ko 9s linear infinite; }
		@keyframes ko { 0%, 11.111% { transform: scaleX(1); } 22.222%, 38.889% { transform: scaleX(0.6667); } 50%, 72.222% { transform: scaleX(0.3333); } 88.889%, 100% { transform: scaleX(1); } }
		.s3 { animation: s3 9s step-end infinite; }
		@keyframes s3 { 0% { opacity: 1; } 11.111% { opacity: 0; } 88.889% { opacity: 1; } 100% { opacity: 1; } }
		.s2 { animation: s2 9s step-end infinite; }
		@keyframes s2 { 0% { opacity: 0; } 22.222% { opacity: 1; } 38.889% { opacity: 0; } 100% { opacity: 0; } }
		.s1 { animation: s1 9s step-end infinite; }
		@keyframes s1 { 0% { opacity: 0; } 50% { opacity: 1; } 72.222% { opacity: 0; } 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.ch, .na, .nb, .ko, .s3, .s2, .s1 { animation: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="650" fill="#f8f9fa" />
	<g id="panel-1">
		<rect x="26" y="22" width="420" height="618" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="618" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">1</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Ema jde k zrcadlu</text>
		<text x="40" y="96" font-size="20" fill="#2b2a26">Ema se blíží k zrcadlu a její obraz</text>
		<text x="40" y="120" font-size="20" fill="#2b2a26">jde proti ní z druhé strany.</text>
		<text x="125" y="160" text-anchor="middle" font-size="20" fill="#2b2a26">před zrcadlem</text>
		<text x="335" y="160" text-anchor="middle" font-size="20" fill="#2b2a26">za zrcadlem</text>
		<text x="230" y="200" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2a26">zrcadlo</text>

		<!-- podlaha: před zrcadlem plná, za zrcadlem čárkovaná (tam jen „vidíme“) -->
		<path d="M30 420H230" stroke="#2b2a26" stroke-width="3" />
		<path d="M230 420H430" stroke="#868e96" stroke-width="3" stroke-dasharray="8 6" />
		<path d="M50 420V432M110 420V432M170 420V432M230 420V432" stroke="#2b2a26" stroke-width="2.5" />
		<path d="M290 420V432M350 420V432M410 420V432" stroke="#868e96" stroke-width="2.5" />
		<g font-size="20" text-anchor="middle" fill="#2b2a26">
			<text x="80" y="456">3</text><text x="140" y="456">2</text><text x="200" y="456">1</text>
			<text x="260" y="456">1</text><text x="320" y="456">2</text><text x="380" y="456">3</text>
		</g>

		<!-- stejně velký: hlava Emy i obrazu sahá do stejné výšky -->
		<path d="M30 280H430" stroke="#1971c2" stroke-width="2.5" stroke-dasharray="10 6" />

		<!-- zrcadlo na stojanu (bokem): černá odrazná plocha, šedý rub -->
		<path d="M234.5 210V412" stroke="#adb5bd" stroke-width="9" />
		<path d="M230 210V412" stroke="#2b2a26" stroke-width="3.5" />
		<path d="M212 420H252M232 412V420" stroke="#495057" stroke-width="5" stroke-linecap="round" />

		<!-- Ema (předmět) -->
		<g id="ema">
			<g class="kota">
				<path d="M232 478H50" class="ko" stroke="#c2255c" stroke-width="3" />
				<path d="M50 468V488" class="ko" stroke="#c2255c" stroke-width="3" vector-effect="non-scaling-stroke" />
			</g>
			<g class="ch" transform="translate(50,420)">
				<g transform="translate(0,-58)"><g class="nb"><rect x="-5" y="0" width="10" height="54" rx="5" fill="#495057" stroke="#2b2a26" stroke-width="1.5" /><rect x="-5" y="49" width="17" height="8" rx="4" fill="#2b2a26" /></g></g>
				<rect x="-13" y="-112" width="26" height="58" rx="9" fill="#7048e8" stroke="#2b2a26" stroke-width="2" />
				<g transform="translate(0,-58)"><g class="na"><rect x="-5" y="0" width="10" height="54" rx="5" fill="#343a40" stroke="#2b2a26" stroke-width="1.5" /><rect x="-5" y="49" width="17" height="8" rx="4" fill="#2b2a26" /></g></g>
				<rect x="-1" y="-106" width="9" height="40" rx="4.5" fill="#f1c27d" stroke="#2b2a26" stroke-width="1.5" />
				<path d="M-15 -127Q-24 -116 -19 -104" fill="none" stroke="#5c3a1e" stroke-width="6" stroke-linecap="round" />
				<circle cx="0" cy="-126" r="14" fill="#f1c27d" stroke="#2b2a26" stroke-width="2" />
				<path d="M-14 -124A14 14 0 0 1 13 -131Q2 -134 -3 -126Q-8 -122 -14 -124Z" fill="#5c3a1e" />
				<circle cx="7" cy="-127" r="2" fill="#2b2a26" />
				<path d="M13 -124L17 -120L13 -119" fill="none" stroke="#2b2a26" stroke-width="1.5" stroke-linejoin="round" />
			</g>
		</g>

		<!-- obraz: přesná zrcadlová kopie Emy (osová souměrnost podle x = 230), světlý a čárkovaný = zdánlivý -->
		<g transform="matrix(-1 0 0 1 460 0)">
			<g class="kota">
				<path d="M232 478H50" class="ko" stroke="#c2255c" stroke-width="3" />
				<path d="M50 468V488" class="ko" stroke="#c2255c" stroke-width="3" vector-effect="non-scaling-stroke" />
			</g>
			<g class="ch" transform="translate(50,420)" stroke-dasharray="5 3">
				<g transform="translate(0,-58)"><g class="nb"><rect x="-5" y="0" width="10" height="54" rx="5" fill="#dee2e6" stroke="#495057" stroke-width="1.8" /><rect x="-5" y="49" width="17" height="8" rx="4" fill="#ced4da" stroke="#495057" stroke-width="1.5" /></g></g>
				<rect x="-13" y="-112" width="26" height="58" rx="9" fill="#e5dbff" stroke="#495057" stroke-width="2" />
				<g transform="translate(0,-58)"><g class="na"><rect x="-5" y="0" width="10" height="54" rx="5" fill="#ced4da" stroke="#495057" stroke-width="1.8" /><rect x="-5" y="49" width="17" height="8" rx="4" fill="#ced4da" stroke="#495057" stroke-width="1.5" /></g></g>
				<rect x="-1" y="-106" width="9" height="40" rx="4.5" fill="#fbe9d0" stroke="#495057" stroke-width="1.5" />
				<path d="M-15 -127Q-24 -116 -19 -104" fill="none" stroke="#c9a98a" stroke-width="6" stroke-linecap="round" stroke-dasharray="none" />
				<circle cx="0" cy="-126" r="14" fill="#fbe9d0" stroke="#495057" stroke-width="2" />
				<path d="M-14 -124A14 14 0 0 1 13 -131Q2 -134 -3 -126Q-8 -122 -14 -124Z" fill="#c9a98a" stroke="none" />
				<circle cx="7" cy="-127" r="2" fill="#495057" stroke="none" />
				<path d="M13 -124L17 -120L13 -119" fill="none" stroke="#495057" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="none" />
			</g>
		</g>

		<!-- kolik dlaždic: mění se po zastavení -->
		<g font-size="22" font-weight="bold" fill="#c2255c">
			<g class="s3"><text x="40" y="516">Ema: 3 dlaždice před zrcadlem</text><text x="40" y="544">Obraz: 3 dlaždice za zrcadlem</text></g>
			<g class="s2" opacity="0"><text x="40" y="516">Ema: 2 dlaždice před zrcadlem</text><text x="40" y="544">Obraz: 2 dlaždice za zrcadlem</text></g>
			<g class="s1" opacity="0"><text x="40" y="516">Ema: 1 dlaždice před zrcadlem</text><text x="40" y="544">Obraz: 1 dlaždice za zrcadlem</text></g>
		</g>

		<!-- legenda -->
		<path d="M40 578H76" stroke="#1971c2" stroke-width="2.5" stroke-dasharray="10 6" />
		<text x="88" y="585" font-size="20" fill="#2b2a26">stejná výška = stejně velký obraz</text>
		<rect x="46" y="598" width="24" height="24" rx="6" fill="#e5dbff" stroke="#495057" stroke-width="2" stroke-dasharray="5 3" />
		<text x="88" y="617" font-size="20" fill="#2b2a26">světlý čárkovaný = zdánlivý obraz</text>
	</g>
</svg>
