<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 570" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Výpočet rychlosti nákladního auta 15 metrů za sekundu a osobního auta 20 metrů za sekundu">
<defs>
<marker id="a-cer" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e03131"/></marker>
<marker id="a-mod" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1971c2"/></marker>
<marker id="a-zel" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2f9e44"/></marker>
<marker id="a-ora" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e8590c"/></marker>
<marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2b2a26"/></marker>
<marker id="a-sed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#495057"/></marker>
<marker id="a-fia" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#7048e8"/></marker>
</defs>
<rect x="3" y="3" width="894" height="564" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="450.0" y="44.0" font-size="26" font-weight="bold" fill="#2b2a26" text-anchor="middle">Rychlost = dráha za jednotku času</text>
<rect x="30.0" y="80.0" width="400.0" height="330.0" rx="12" fill="#ffffff" stroke="#1971c2" stroke-width="3"/>
<text x="230.0" y="122.0" font-size="24" font-weight="bold" fill="#1971c2" text-anchor="middle">Nákladní auto</text>
<text x="70.0" y="176.0" font-size="24" fill="#2b2a26" text-anchor="start">s = 60 m</text>
<text x="70.0" y="212.0" font-size="24" fill="#2b2a26" text-anchor="start">t = 4 s</text>
<line x1="70.0" y1="232.0" x2="280.0" y2="232.0" stroke="#2b2a26" stroke-width="3" stroke-linecap="round"/>
<text x="70.0" y="274.0" font-size="24" font-weight="bold" fill="#2b2a26" text-anchor="start">v = s : t</text>
<text x="70.0" y="316.0" font-size="24" fill="#2b2a26" text-anchor="start">v = 60 m : 4 s</text>
<text x="70.0" y="372.0" font-size="28" font-weight="bold" fill="#1971c2" text-anchor="start">v = 15 m/s</text>
<rect x="470.0" y="80.0" width="400.0" height="330.0" rx="12" fill="#ffffff" stroke="#e03131" stroke-width="3"/>
<text x="670.0" y="122.0" font-size="24" font-weight="bold" fill="#e03131" text-anchor="middle">Osobní auto</text>
<text x="510.0" y="176.0" font-size="24" fill="#2b2a26" text-anchor="start">s = 60 m</text>
<text x="510.0" y="212.0" font-size="24" fill="#2b2a26" text-anchor="start">t = 3 s</text>
<line x1="510.0" y1="232.0" x2="720.0" y2="232.0" stroke="#2b2a26" stroke-width="3" stroke-linecap="round"/>
<text x="510.0" y="274.0" font-size="24" font-weight="bold" fill="#2b2a26" text-anchor="start">v = s : t</text>
<text x="510.0" y="316.0" font-size="24" fill="#2b2a26" text-anchor="start">v = 60 m : 3 s</text>
<text x="510.0" y="372.0" font-size="28" font-weight="bold" fill="#e03131" text-anchor="start">v = 20 m/s</text>
<rect x="120.0" y="440.0" width="660.0" height="96.0" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<text x="450.0" y="480.8" font-size="22" fill="#2b2a26" text-anchor="middle">Osobní auto je rychlejší:</text>
<text x="450.0" y="510.5" font-size="22" fill="#2b2a26" text-anchor="middle">za 1 s ujede 20 m, nákladní jen 15 m.</text>
</svg>
