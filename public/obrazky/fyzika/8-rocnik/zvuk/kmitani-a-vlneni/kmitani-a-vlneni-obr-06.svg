<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tlumené kmitání: graf výchylky v čase. Modrá křivka kmitá nahoru a dolů, ale její výchylka se postupně zmenšuje, až se těleso téměř zastaví; šedé čárkované čáry ukazují, jak se největší výchylka zmenšuje. Vpravo nahoře malé kyvadlo, jehož kývání slábne. Animace: křivka se kreslí zleva doprava a kyvadlo zároveň kmitá se zmenšující se výchylkou, až se zastaví.">
<style>
/* Předloha: infografika lekce 33 (unnamed (1).png) – „Tlumené kmitání“: graf s modrou křivkou, jejíž výchylka se
   zmenšuje mezi čárkovanými obálkami, popisek „výchylka se postupně zmenšuje vlivem tření a odporu vzduchu“.
   Text PDF s. 4 (tlumené kmitání, tření částí tělesa a tření se vzduchem) = výklad § Perioda a frekvence, poslední odstavec.
   Malé kyvadlo je obrázek navíc (předloha kyvadla PDF s. 2) a kmitá synchronně s grafem: jeden kyv = 40 px grafu = 5 % smyčky.
   Smyčka 6 s: 0–70 % se křivka kreslí (zakrývací obdélník jede rovnoměrně doprava), 70–95 % stojí celá, pak znovu.
   Bez animace (reduced-motion) = celá křivka, kyvadlo v klidu. */
.kryt { animation: kryt 6s linear infinite; }
@keyframes kryt { 0% { transform: translateX(0); } 70%, 100% { transform: translateX(580px); } }
.mk { transform-origin: 590px 74px; animation: mk 6s cubic-bezier(.37,0,.63,1) infinite; }
@keyframes mk { 0% { transform: rotate(24deg); } 5% { transform: rotate(-19.8deg); } 10% { transform: rotate(16.4deg); } 15% { transform: rotate(-13.6deg); } 20% { transform: rotate(11.2deg); } 25% { transform: rotate(-9.3deg); } 30% { transform: rotate(7.7deg); } 35% { transform: rotate(-6.3deg); } 40% { transform: rotate(5.2deg); } 45% { transform: rotate(-4.3deg); } 50% { transform: rotate(3.6deg); } 55% { transform: rotate(-3deg); } 60% { transform: rotate(2.4deg); } 65% { transform: rotate(-2deg); } 70% { transform: rotate(1.7deg); } 75%, 100% { transform: rotate(0deg); } }
@media (prefers-reduced-motion: reduce) { .kryt, .mk { animation: none; } .kryt { opacity: 0; } }
</style>
<defs>
<radialGradient id="kul" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#fff3bf"/><stop offset=".45" stop-color="#ffd43b"/><stop offset="1" stop-color="#e67700"/></radialGradient>
<clipPath id="graf"><rect x="81" y="60" width="600" height="280"/></clipPath>
</defs>
<rect x="3" y="3" width="694" height="444" rx="14" fill="#f8f9fa"/>
<text x="350" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Tlumené kmitání</text>
