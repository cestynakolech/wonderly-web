e-width="4"/><path d="M398.8 178.8L441.2 221.2M441.2 178.8L398.8 221.2" stroke="#212529" stroke-width="4"/><text x="356" y="208" font-size="22" fill="#212529" text-anchor="end">žárovka</text><path d="M420 130H530V170M530 230V270H420" fill="none" stroke="#212529" stroke-width="4" stroke-linecap="square"/><circle cx="420" cy="130" r="7" fill="#212529"/><circle cx="420" cy="270" r="7" fill="#212529"/><circle cx="530" cy="200" r="30" fill="#fff" stroke="#212529" stroke-width="4"/><text x="530" y="212" font-size="34" font-weight="bold" fill="#212529" text-anchor="middle">V</text><path d="M557 154H575M566 145V163" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><path d="M557 246H575" stroke="#1864ab" stroke-width="4" stroke-linecap="round"/><text x="530" y="304" font-size="22" fill="#212529" text-anchor="middle">voltmetr</text><text class="sz" x="300" y="352" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Spínač zavřený – žárovka svítí.</text><text class="so" x="300" y="352" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Spínač otevřený – žárovka nesvítí.</text><path d="M20 372H580" stroke="#ced4da" stroke-width="2"/><text x="300" y="404" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Stupnice voltmetru</text><rect x="175" y="445" width="250" height="215" rx="14" fill="#e9ecef" stroke="#495057" stroke-width="3"/><rect x="188" y="458" width="224" height="192" rx="10" fill="#fff" stroke="#868e96" stroke-width="2"/><path d="M219.6 572.5A105 105 0 0 1 380.4 572.5" fill="none" stroke="#212529" stroke-width="2.5"/><path d="M232.6 583.4L219.6 572.5" stroke="#212529" stroke-width="3"/><text x="205.0" y="568.3" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">0</text><path d="M238.9 567.2L232.5 559.6" stroke="#212529" stroke-width="2"/><path d="M256.0 563.8L247.5 549.1" stroke="#212529" stroke-width="3"/><text x="238.0" y="540.6" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">2</text><path d="M267.5 550.7L264.1 541.3" stroke="#212529" stroke-width="2"/><path d="M284.7 553.3L281.8 536.6" stroke="#212529" stroke-width="3"/><text x="278.5" y="525.9" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">4</text><path d="M300.0 545.0L300.0 535.0" stroke="#212529" stroke-width="2"/><path d="M315.3 553.3L318.2 536.6" stroke="#212529" stroke-width="3"/><text x="321.5" y="525.9" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">6</text><path d="M332.5 550.7L335.9 541.3" stroke="#212529" stroke-width="2"/><path d="M344.0 563.8L352.5 549.1" stroke="#212529" stroke-width="3"/><text x="362.0" y="540.6" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">8</text><path d="M361.1 567.2L367.5 559.6" stroke="#212529" stroke-width="2"/><path d="M367.4 583.4L380.4 572.5" stroke="#212529" stroke-width="3"/><text x="395.0" y="568.3" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">10</text><text x="374" y="636" font-size="34" font-weight="bold" fill="#212529" text-anchor="middle">V</text><path class="ru" d="M300 640L317.0 543.5" stroke="#212529" stroke-width="4" stroke-linecap="round"/><circle cx="300" cy="640" r="8" fill="#343a40"/><text class="uz" x="450" y="560" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">U = 6 V</text><text class="uo" x="450" y="560" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">U = 0 V</text></svg>
