<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Sériový obvod: článek, zavřený spínač a dva rezistory R₁ a R₂ za sebou. Osm oranžových šipek s písmenem I ukazuje, že ve všech částech obvodu, před rezistory, mezi nimi i za nimi, prochází stejný proud I. Pod rezistory jsou napětí U₁ a U₂, nad celým obvodem napětí zdroje U = U₁ + U₂.">
<style>
/* Předloha: PDF lekce 28, s. 4 (proud I a napětí U₁, U₂, U = U₁ + U₂ v sériovém obvodu; + článku vlevo).
   Oprava proti předloze: v PDF je spínač nakreslený otevřený, a přesto jsou zakresleny šipky proudu – zde spínač zavřený.
   Barvy podle legendy tématu: proud oranžové šipky (jako lekce 23–25), napětí tmavě tyrkysové (modrá patří elektronu).
   Statický obrázek – stav obvodu, ne děj. */
</style>
<defs>
<marker id="v-ora" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e8590c"/></marker>
