<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 830" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Řetěz přeměn energie v jaderné elektrárně ve šesti krocích shora dolů: štěpení jader uranu uvolní energii ukrytou v jádře; úlomky jader zahřejí palivo i vodu; z horké vody vznikne pára; pára roztočí lopatky turbíny; roztočený rotor generátoru vyrábí elektřinu; elektřinu používáme doma. Animace: žluté zvýraznění postupně sjíždí po krocích.">
<style>
.r0 { animation: r0 9s linear infinite; }
@keyframes r0 { 0%, 16.6% { opacity: 1; } 16.7%, 100% { opacity: 0; } }
.r1 { animation: r1 9s linear infinite; }
@keyframes r1 { 0%, 16.6% { opacity: 0; } 16.8% { opacity: 1; } 33.3% { opacity: 1; } 33.4%, 100% { opacity: 0; } }
.r2 { animation: r2 9s linear infinite; }
@keyframes r2 { 0%, 33.2% { opacity: 0; } 33.4% { opacity: 1; } 50% { opacity: 1; } 50.1%, 100% { opacity: 0; } }
.r3 { animation: r3 9s linear infinite; }
@keyframes r3 { 0%, 49.9% { opacity: 0; } 50.1% { opacity: 1; } 66.7% { opacity: 1; } 66.8%, 100% { opacity: 0; } }
.r4 { animation: r4 9s linear infinite; }
@keyframes r4 { 0%, 66.6% { opacity: 0; } 66.8% { opacity: 1; } 83.3% { opacity: 1; } 83.4%, 100% { opacity: 0; } }
.r5 { animation: r5 9s linear infinite; }
@keyframes r5 { 0%, 83.2% { opacity: 0; } 83.4% { opacity: 1; } 100% { opacity: 1; } 100.1%, 100% { opacity: 0; } }
.rot { animation: rot 1.4s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.ua { animation: ua 2s ease-in-out infinite; } .ub { animation: ub 2s ease-in-out infinite; }
@keyframes ua { 0%, 20% { transform: translate(0, 0); } 70%, 100% { transform: translate(-12px, -8px); } }
@keyframes ub { 0%, 20% { transform: translate(0, 0); } 70%, 100% { transform: translate(12px, 8px); } }
.vl { animation: vl 1.6s ease-in-out infinite; }
@keyframes vl { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-6px); opacity: 1; } }
.pr { animation: pr 2.4s ease-out infinite; }
@keyframes pr { 0% { transform: translateY(8px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-22px); opacity: 0; } }
.zar { animation: zar 1.2s ease-in-out infinite; }
@keyframes zar { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .r0, .r1, .r2, .r3, .r4, .r5, .rot, .ua, .ub, .vl, .pr, .zar { animation: none; } .r1, .r2, .r3, .r4, .r5 { opacity: 0; } .r0 { opacity: 1; } }
/* Předloha: PDF 20, s. 7 (text): energie z řízeného štěpení → úlomky se rozlétají, materiál se zahřívá → horká pára →
   lopatky turbíny → rotor generátoru → elektrická energie v domácnostech. PDF k tomu obrázek nemá – vlastní obrázek navíc.
   Animace 9 s: žluté zvýraznění postupně sjede po krocích, ikony se hýbou. Bez animace = zvýrazněný první krok. */
</style>
