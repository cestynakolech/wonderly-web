<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vznik obrazu v oku. Oko v řezu: rohovka, komorová voda, duhovka se zornicí, čočka, sklivec, sítnice a zrakový nerv. Paprsky z hlavy a z nohou postavy projdou zornicí a čočkou a sejdou se na sítnici. Obraz na sítnici je skutečný, zmenšený a převrácený. Animace: paprsky postupně doběhnou na sítnici a objeví se převrácený obraz.">
<style>
/* Překresleno podle předlohy: PDF lekce 26 Oko, vady oka, str. 2 (stavba oka v řezu, popisky částí) a str. 5
   (předmět vlevo před okem, paprsky přes čočku, převrácený obraz na sítnici). Popisky jen částí, které zná výklad.
   Model: celé oko = tenká spojka v místě čočky (f = 96 px), sítnice 160 px za čočkou; postava 240 px před čočkou,
   výška 60 → obraz 40 (1/f = 1/a + 1/b: 1/96 = 1/240 + 1/160), převrácený. Lom kreslen jen na čočce (zjednodušení).
   Barvy (jeden význam, stejně ve všech obrázcích tématu): paprsky z hlavy oranžové, z nohou modré; sítnice tmavě fialová
   #5c1a73, zrakový nerv růžový, předmět tmavě šedý, jeho obraz světle šedý (#868e96 s tmavým obrysem).
   Animace 8 s, smyčka: paprsky 5–40 %, šipky 40–45 %, obraz a popisek 45–55 %, vše zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy ukazují vše. */
.pr { stroke-dasharray: 100 100; animation: pr 8s linear infinite; }
.si { animation: si 8s linear infinite; }
.ob { animation: ob 8s linear infinite; }
.celek { animation: celek 8s linear infinite; }
@keyframes pr { 0%, 5% { stroke-dashoffset: 100; } 40%, 100% { stroke-dashoffset: 0; } }
@keyframes si { 0%, 40% { opacity: 0; } 45%, 100% { opacity: 1; } }
@keyframes ob { 0%, 45% { opacity: 0; } 55%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pr, .si, .ob, .celek { animation: none; } }
</style>
<defs><radialGradient id="cocka" cx="0.4" cy="0.4" r="0.7"><stop offset="0" stop-color="#e7f5ff"/><stop offset="1" stop-color="#4dabf7"/></radialGradient><linearGradient id="sklo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#66d9e8" stop-opacity="0.75"/><stop offset="0.45" stop-color="#e3fafc" stop-opacity="0.8"/><stop offset="1" stop-color="#3bc9db" stop-opacity="0.7"/></linearGradient></defs>
