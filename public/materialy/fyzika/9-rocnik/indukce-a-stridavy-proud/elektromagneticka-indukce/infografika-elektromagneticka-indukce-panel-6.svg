<svg viewBox="0 2768 460 592" width="460" height="592" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dynamo na kole a využití: kolo je otočené vzhůru nohama (sedlo a řídítka na podlaze); ruka roztočí kolo jízdního kola otočeného vzhůru nohama, kolo roztáčí dynamo a světlo svítí; když se kolo zastaví, světlo nesvítí; energie se nevyrábí, jen se pohybová energie přeměňuje na elektrickou; indukci využívá alternátor v elektrárně, transformátor, indukční varná deska, bezdrátová nabíječka a elektrická kytara" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Elektromagnetická indukce 6/6: Dynamo na kole a využití</title>
	<style>
		.zmiz { animation: zmiz 8s linear infinite; }
		@keyframes zmiz { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
		.objev { opacity: 0; animation: objev 8s linear infinite; }
		@keyframes objev { 0%, 92% { opacity: 0; } 98%, 100% { opacity: 1; } }
		.p6-kolo { transform-box: view-box; transform-origin: 0 0; animation: p6kolo 8s infinite; }
		@keyframes p6kolo { 0%, 6% { transform: rotate(-720deg); animation-timing-function: cubic-bezier(0.3, 0.6, 0.5, 1); } 80%, 100% { transform: rotate(0deg); } }
		.p6-kl { transform-box: view-box; transform-origin: 0 0; animation: p6kl 8s infinite; }
		@keyframes p6kl { 0%, 6% { transform: rotate(7380deg); animation-timing-function: cubic-bezier(0.3, 0.6, 0.5, 1); } 80%, 100% { transform: rotate(0deg); } }
		.p6-ruka { animation: p6ruka 8s infinite; }
		@keyframes p6ruka { 0%, 6% { transform: translate(0, 0); animation-timing-function: linear; } 8% { transform: translate(50px, 17px); animation-timing-function: ease-out; } 20%, 100% { transform: translate(70px, -50px); } }
		.p6-sv { opacity: 0; animation: p6sv 8s infinite; }
		@keyframes p6sv { 0%, 6% { opacity: 0; } 8% { opacity: 0.9; } 40% { opacity: 0.5; } 80%, 100% { opacity: 0; } }
		.p6-skl { animation: p6skl 8s infinite; }
		@keyframes p6skl { 0%, 6% { fill: #dee2e6; } 8% { fill: #fcc419; } 40% { fill: #ffe066; } 80%, 100% { fill: #dee2e6; } }
		@media (prefers-reduced-motion: reduce) { .zmiz, .objev, .p6-kolo, .p6-kl, .p6-ruka, .p6-sv, .p6-skl { animation: none; } }
	</style>
