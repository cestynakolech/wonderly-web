<svg xmlns="http://www.w3.org/2000/svg" width="460" height="650" viewBox="0 0 460 650" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Závaží 5 kg tlačí silou F = 5 · 10 = 50 N. Přímo na písku stojí na ploše 100 cm² a zaboří se, na desce 1 m² se písek nepromáčkne. Na desce: p = 50 : 1 = 50 Pa (tíhu desky nepočítáme). Přímo na písku je plocha 100 cm² 100krát menší než 1 m², tlak je 100krát větší: p = 50 · 100 = 5 000 Pa = 5 kPa.">
	<title>Tlak 5/6: Počítáme tlak</title>
	<!-- Panel 5/6 infografiky Tlak (W50, 14. 10. 2026); bez animace = koncový stav. -->
	<style>
		.p5-z { animation: p5-z 9s ease-in-out infinite; }
		@keyframes p5-z { 0% { transform: translateY(0px) } 15% { transform: translateY(0px) } 45% { transform: translateY(12px) } 88% { transform: translateY(12px) } 100% { transform: translateY(0px) } }
		.p5-d { transform-box: view-box; transform-origin: 120px 290px; animation: p5-d 9s ease-in-out infinite; }
		@keyframes p5-d { 0% { transform: scaleY(0) } 15% { transform: scaleY(0) } 45% { transform: scaleY(1) } 88% { transform: scaleY(1) } 100% { transform: scaleY(0) } }
		.p5-v { animation: p5-v 9s linear infinite; }
		@keyframes p5-v { 0% { opacity: 0 } 45% { opacity: 0 } 52% { opacity: 1 } 88% { opacity: 1 } 95% { opacity: 0 } 100% { opacity: 0 } }
		@media (prefers-reduced-motion: reduce) {
			.p5-z, .p5-d, .p5-v { animation: none; }
		}
	</style>
	<rect x="0" y="0" width="460" height="650" fill="#f8f9fa"/>
	<rect x="26" y="16" width="420" height="630" rx="12" fill="#dee2e6"/><rect x="20" y="10" width="420" height="630" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="44" r="17" fill="#2b2a26"/><text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">5</text><text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Počítáme tlak</text>
	<text x="40" y="95" font-size="21" fill="#2b2a26">Závaží <tspan font-weight="bold" fill="#b8460b">5 kg</tspan> tlačí silou</text><text x="40" y="125" font-size="21" fill="#2b2a26">F = 5 · 10 = <tspan font-weight="bold" fill="#b8460b">50 N</tspan>.</text><text x="120" y="168" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">přímo na písku</text><text x="320" y="168" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">na desce 1 m²</text><rect x="40" y="290" width="380" height="50" fill="#f2d48b" stroke="#2b2a26" stroke-width="2"/><circle cx="133.6" cy="316.7" r="1.6" fill="#c9a24a"/><circle cx="182.1" cy="318.9" r="1.6" fill="#c9a24a"/><circle cx="276.3" cy="298.5" r="1.6" fill="#c9a24a"/><circle cx="50.8" cy="327.8" r="1.6" fill="#c9a24a"/><circle cx="141.4" cy="304.9" r="1.6" fill="#c9a24a"/><circle cx="412.4" cy="313.9" r="1.6" fill="#c9a24a"/><circle cx="353.8" cy="314.1" r="1.6" fill="#c9a24a"/><circle cx="281.2" cy="301.7" r="1.6" fill="#c9a24a"/><circle cx="279.6" cy="329" r="1.6" fill="#c9a24a"/><circle cx="238.5" cy="324.2" r="1.6" fill="#c9a24a"/><circle cx="293.1" cy="298.4" r="1.6" fill="#c9a24a"/><circle cx="325" cy="318.5" r="1.6" fill="#c9a24a"/><circle cx="156.9" cy="297.2" r="1.6" fill="#c9a24a"/><circle cx="364.5" cy="314" r="1.6" fill="#c9a24a"/><circle cx="310.5" cy="329.4" r="1.6" fill="#c9a24a"/><circle cx="308.8" cy="331" r="1.6" fill="#c9a24a"/><circle cx="191.3" cy="326.4" r="1.6" fill="#c9a24a"/><circle cx="209.6" cy="331.6" r="1.6" fill="#c9a24a"/><circle cx="369.4" cy="299.7" r="1.6" fill="#c9a24a"/><circle cx="96" cy="304.2" r="1.6" fill="#c9a24a"/><circle cx="401.3" cy="312.6" r="1.6" fill="#c9a24a"/><circle cx="276.6" cy="307.4" r="1.6" fill="#c9a24a"/><circle cx="232.7" cy="310.7" r="1.6" fill="#c9a24a"/><circle cx="175.1" cy="318.2" r="1.6" fill="#c9a24a"/><circle cx="261" cy="330.4" r="1.6" fill="#c9a24a"/><circle cx="297" cy="331.3" r="1.6" fill="#c9a24a"/><circle cx="361.2" cy="333.7" r="1.6" fill="#c9a24a"/><circle cx="293" cy="302.2" r="1.6" fill="#c9a24a"/><circle cx="362.7" cy="332.7" r="1.6" fill="#c9a24a"/><circle cx="378.9" cy="317.6" r="1.6" fill="#c9a24a"/><circle cx="308.7" cy="304" r="1.6" fill="#c9a24a"/><circle cx="352" cy="317.8" r="1.6" fill="#c9a24a"/><circle cx="150.9" cy="298.4" r="1.6" fill="#c9a24a"/><circle cx="360.3" cy="333.6" r="1.6" fill="#c9a24a"/><circle cx="78.6" cy="326.4" r="1.6" fill="#c9a24a"/><circle cx="197" cy="301.7" r="1.6" fill="#c9a24a"/><circle cx="154.2" cy="325.2" r="1.6" fill="#c9a24a"/><circle cx="367.2" cy="297.7" r="1.6" fill="#c9a24a"/><circle cx="272.1" cy="297.7" r="1.6" fill="#c9a24a"/><circle cx="310.4" cy="308.6" r="1.6" fill="#c9a24a"/><g class="p5-d"><path d="M86,289  C93.0,290 100,292.4 100,302 L140,302 C140,292.4 147.0,290 154,290 L154,289 Z" fill="#d9b25c"/><path d="M86,290 C93.0,290 100,292.4 100,302 L140,302 C140,292.4 147.0,290 154,290" fill="none" stroke="#2b2a26" stroke-width="2" vector-effect="non-scaling-stroke"/></g><g class="p5-z" transform="translate(0,12)"><path d="M100,290 L100,250 Q100,244 108,242 L114,236 L126,236 L132,242 Q140,244 140,250 L140,290 Z" fill="#868e96" stroke="#2b2a26" stroke-width="2"/><text x="120" y="262" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">5 kg</text></g><line x1="80" y1="290" x2="160" y2="290" stroke="#2b2a26" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="224" y="282" width="192" height="8" fill="#d9a066" stroke="#2b2a26" stroke-width="1.8"/><path d="M300,282 L300,242 Q300,236 308,234 L314,228 L326,228 L332,234 Q340,236 340,242 L340,282 Z" fill="#868e96" stroke="#2b2a26" stroke-width="2"/><text x="320" y="254" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">5 kg</text><text x="120" y="368" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c7ed6">S = 100 cm²</text><text x="320" y="368" font-size="18" font-weight="bold" text-anchor="middle" fill="#1c7ed6">S = 1 m²</text><text x="230" y="392" font-size="15" text-anchor="middle" fill="#6b6a60">(obrázek není v měřítku)</text><rect x="40" y="410" width="380" height="104" rx="10" fill="#fff" stroke="#ced4da" stroke-width="2"/><text x="56" y="440" font-size="18" fill="#6b6a60">Na desce 1 m²:</text><text x="56" y="472" font-size="21" fill="#2b2a26">p = F : S = 50 : 1 = <tspan font-weight="bold" fill="#b8460b">50 Pa</tspan></text><text x="56" y="500" font-size="15" fill="#6b6a60">(tíhu desky nepočítáme)</text><g class="p5-v"><rect x="40" y="526" width="380" height="104" rx="10" fill="#fff4e6" stroke="#b8460b" stroke-width="2"/><text x="56" y="556" font-size="18" fill="#6b6a60">Přímo na písku: 100 cm² je 100krát</text><text x="56" y="580" font-size="18" fill="#6b6a60">méně než 1 m² → tlak 100krát větší:</text><text x="56" y="614" font-size="21" fill="#2b2a26">p = 50 · 100 = <tspan font-weight="bold" fill="#b8460b">5 000 Pa = 5 kPa</tspan></text></g>
</svg>
