<svg xmlns="http://www.w3.org/2000/svg" width="460" height="660" viewBox="0 0 460 660" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Ruka drží za rukojeť ostrý a tupý nůž a tlačí na oba stejně, ostří tlačí na chleba stejnou silou F. Pohled zboku, chleba v řezu. Ostrý nůž zajede do chleba, tupý jen zmáčkne kůrku. Ostří zblízka v průřezu: ostré ostří má malou plochu dotyku a velký tlak, tupé větší plochu a menší tlak.">
