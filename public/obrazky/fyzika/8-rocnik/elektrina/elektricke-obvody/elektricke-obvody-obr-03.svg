<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dvě žárovky zapojené za sebou v jedné cestě s baterií a zavřeným spínačem; dole schéma téhož obvodu. Obě žárovky svítí. Když se vlákno jedné žárovky přeruší, přeruší se celá cesta a zhasne i druhá žárovka. Animace: vlákno pravé žárovky se přetrhne a obě žárovky zhasnou.">
<style>
/* Předloha: PDF lekce 22, s. 9 (skutečný obvod: 2 žárovky nahoře, spínač vlevo dole, baterie v držáku vpravo dole)
   a s. 10 (schéma dvou žárovek za sebou). Děj z výkladu: přeruší-li se vlákno jedné žárovky, zhasnou obě.
   8 s: 0–40 % obě svítí; ve 40 % se přeruší vlákno pravé žárovky → obě zhasnou; v 92 % znovu od začátku.
   Schéma: svítící žárovka má 6 paprsků (2 horní vynechány, aby nezasahovaly do popisku nad schématem).
   Bez animace = koncový stav: vlákno přerušené, obě žárovky nesvítí. */
.fil-x { animation: zmiz 8s step-end infinite; opacity: 0; }
.brk-x, .krouzek, .sp { opacity: 1; animation: obj 8s step-end infinite; }
.sc { opacity: 0; animation: zmiz 8s step-end infinite; }
.lit-1, .lit-x { opacity: 0; animation: zmiz 8s step-end infinite; }

@keyframes zmiz { 0% { opacity: 1; } 40% { opacity: 0; } 92% { opacity: 1; } }
@keyframes obj { 0% { opacity: 0; } 40% { opacity: 1; } 92% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .fil-x, .brk-x, .krouzek, .sp, .sc, .lit-1, .lit-x { animation: none; } }
</style>
