<line x1="320" y1="690" x2="350" y2="690" stroke="#343a40" stroke-width="2" stroke-dasharray="16 5 3 5"/><line x1="350" y1="690" x2="580" y2="690" stroke="#adb5bd" stroke-width="2" stroke-dasharray="16 5 3 5"/><path d="M370.1,635 A114,114 0 0 0 370.1,745" fill="none" stroke="#adb5bd" stroke-width="9"/><path d="M363.3,635 A120,120 0 0 0 363.3,745" fill="none" stroke="#212529" stroke-width="3.5"/><line x1="410" y1="680" x2="410" y2="700" stroke="#212529" stroke-width="3"/><text x="410" y="724" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">F</text><line x1="470" y1="680" x2="470" y2="700" stroke="#212529" stroke-width="3"/><text x="470" y="724" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">S</text>
<text x="150" y="768" font-size="22" font-weight="normal" fill="#212529" text-anchor="middle">S a F před zrcadlem</text><text x="450" y="768" font-size="22" font-weight="normal" fill="#212529" text-anchor="middle">S a F za zrcadlem</text>
</svg>
