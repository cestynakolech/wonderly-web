<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vodní hodiny: z hliněné nádoby na dřevěném stojanu odkapává malým otvorem voda do skleněné nádoby, která stojí na váze. Voda odkapává stále stejně rychle, dole jí přibývá a ručička váhy ukazuje větší hmotnost. Hmotnost odkapané vody udává uplynulý čas.">
<style>
/* Voda z horní nádoby odkapává stále stejně rychle, ve spodní nádobě vody přibývá a ručička váhy ukazuje větší hmotnost (16 s, smyčka).
   Bez animace platí atributy = konečný stav (horní nádoba skoro prázdná, spodní plná, ručička vychýlená). */
.hore { animation: hore-k 16s linear infinite; }
.dole { animation: dole-k 16s linear infinite; }
.rucicka3 { transform-box: view-box; transform-origin: 480px 556px; animation: ruc-k 16s linear infinite; }
.kapka { animation: kapka-k 1.2s linear infinite; }
.k2 { animation-delay: -0.4s; } .k3 { animation-delay: -0.8s; }
@keyframes hore-k { 0% { transform: translateY(-80px); } 92%, 100% { transform: translateY(0px); } }
@keyframes dole-k { 0% { transform: translateY(96px); } 92%, 100% { transform: translateY(0px); } }
@keyframes ruc-k { 0% { transform: rotate(-60deg); } 92%, 100% { transform: rotate(60deg); } }
@keyframes kapka-k { 0% { transform: translateY(0px); opacity: 1; } 90% { transform: translateY(130px); opacity: 1; } 100% { transform: translateY(140px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hore, .dole, .rucicka3, .kapka { animation: none; } .kapka { opacity: 0; } }
</style>
