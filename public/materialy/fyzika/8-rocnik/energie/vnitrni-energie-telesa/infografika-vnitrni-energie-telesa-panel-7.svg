<svg viewBox="0 3222 460 450" width="460" height="450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Využití a chlazení: pomáhá, třením si zahřejeme studené ruce a rozděláme oheň; škodí, přehřátí poškodí materiál, proto chladíme vodou, olejem, vzduchem. Zub při vrtání chladíme vodou, kov při obrábění olejem, chladí se i motor v autě, kosmickou loď chrání tepelný štít." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Vnitřní energie tělesa 7/7: Využití a chlazení</title>
	<!-- Panel 7/7 výřezu z infografika-vnitrni-energie-telesa.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.voda { animation: voda 0.6s linear infinite; }
		@keyframes voda { 0% { stroke-dashoffset: 12; } 100% { stroke-dashoffset: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.voda { animation: none; }
		}
	</style>
	<defs>
		<clipPath id="oknoZub"><rect x="34" y="196" width="192" height="144" rx="8" /></clipPath>
	</defs>
	<rect x="0" y="3222" width="460" height="450" fill="#f3f1ea" />
	<g id="panel-7" transform="translate(0,3232)">
		<rect x="26" y="6" width="420" height="424" rx="10" fill="#2b2a26" />
		<rect x="20" y="0" width="420" height="424" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="34" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="41" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">7</text>
		<text x="80" y="43" font-size="28" font-weight="bold" fill="#2b2a26">Využití a chlazení</text>

		<text x="34" y="80" font-size="21" fill="#2b2a26"><tspan font-weight="bold" fill="#1e7a34">Pomáhá:</tspan> třením si zahřejeme</text>
		<text x="34" y="108" font-size="21" fill="#2b2a26">studené ruce, rozděláme oheň</text>
		<text x="34" y="144" font-size="21" fill="#2b2a26"><tspan font-weight="bold">Škodí:</tspan> přehřátí poškodí materiál</text>
		<text x="34" y="172" font-size="21" fill="#2b2a26">→ <tspan font-weight="bold">chladíme</tspan> vodou, olejem, vzduchem</text>

		<!-- zubař vrtá zub a chladí ho vodou (výřez) -->
		<rect x="34" y="196" width="192" height="144" rx="8" fill="#fff" />
		<g clip-path="url(#oknoZub)">
			<!-- dáseň a zub -->
			<path d="M 98 312 L 96 268 Q 96 252 109 252 Q 119 256 128 252 Q 137 256 147 252 Q 160 252 160 268 L 158 312 Z" fill="#fff" stroke="#2b2a26" stroke-width="2" />
			<ellipse cx="127" cy="259" rx="7" ry="4" fill="#495057" />
			<path d="M 30 340 L 30 306 Q 128 290 230 306 L 230 340 Z" fill="#f3a6b5" stroke="#2b2a26" stroke-width="2" />
			<!-- vrtačka v ruce v rukavici -->
			<line x1="150" y1="226" x2="250" y2="182" stroke="#adb5bd" stroke-width="14" stroke-linecap="round" />
			<line x1="150" y1="226" x2="250" y2="182" stroke="#495057" stroke-width="2" stroke-dasharray="1 0" opacity="0.4" />
			<rect x="132" y="216" width="22" height="16" rx="4" fill="#868e96" stroke="#2b2a26" stroke-width="2" />
			<line x1="134" y1="232" x2="129" y2="254" stroke="#495057" stroke-width="3" />
			<ellipse cx="206" cy="200" rx="24" ry="14" transform="rotate(-24 206 200)" fill="#74c0fc" stroke="#2b2a26" stroke-width="2" />
			<path d="M 222 176 L 250 160 L 262 186 L 230 204 Z" fill="#74c0fc" stroke="#2b2a26" stroke-width="2" />
			<!-- proud vody na zub -->
			<line class="voda" x1="152" y1="232" x2="137" y2="256" stroke="#1971c2" stroke-width="3" stroke-dasharray="6 6" />
		</g>
		<rect x="34" y="196" width="192" height="144" rx="8" fill="none" stroke="#495057" stroke-width="2" />

		<text x="240" y="220" font-size="21" fill="#2b2a26">zub při vrtání</text>
		<text x="240" y="248" font-size="21" fill="#2b2a26">→ <tspan font-weight="bold" fill="#1864ab">vodou</tspan></text>
		<text x="240" y="290" font-size="21" fill="#2b2a26">kov při obrábění</text>
		<text x="240" y="318" font-size="21" fill="#2b2a26">→ <tspan font-weight="bold">olejem</tspan></text>

		<text x="34" y="376" font-size="21" fill="#2b2a26">chladí se i <tspan font-weight="bold">motor v autě</tspan></text>
		<text x="34" y="406" font-size="21" fill="#2b2a26"><tspan font-weight="bold">kosmickou loď</tspan> chrání tepelný štít</text>
	</g>
</svg>
