		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Dá se to spočítat?</text>
		<g class="p2sc">
		<text x="40" y="96" font-size="20" fill="#2b2a26">Pokládáme hřebíky na stůl a počítáme.</text>
		<rect x="22" y="290" width="416" height="14" fill="url(#dr2)" stroke="#6b3f17" stroke-width="2" />
		<g clip-path="url(#r2)">
			<g class="p2h0"><g transform="rotate(6.84) scale(0.75)"><path d="M-62 -5L58 -5L82 0L58 5L-62 5Z" fill="url(#kov2)" stroke="#343a40" stroke-width="2"/><rect x="-74" y="-18" width="12" height="36" rx="3" fill="url(#kov2)" stroke="#343a40" stroke-width="2"/><path d="M-56 -2H50" stroke="#fff" stroke-width="2" opacity="0.7"/></g></g>
			<g class="p2h1"><g transform="rotate(6.84) scale(0.75)"><path d="M-62 -5L58 -5L82 0L58 5L-62 5Z" fill="url(#kov2)" stroke="#343a40" stroke-width="2"/><rect x="-74" y="-18" width="12" height="36" rx="3" fill="url(#kov2)" stroke="#343a40" stroke-width="2"/><path d="M-56 -2H50" stroke="#fff" stroke-width="2" opacity="0.7"/></g></g>
			<g class="p2h2"><g transform="rotate(6.84) scale(0.75)"><path d="M-62 -5L58 -5L82 0L58 5L-62 5Z" fill="url(#kov2)" stroke="#343a40" stroke-width="2"/><rect x="-74" y="-18" width="12" height="36" rx="3" fill="url(#kov2)" stroke="#343a40" stroke-width="2"/><path d="M-56 -2H50" stroke="#fff" stroke-width="2" opacity="0.7"/></g></g>
			<!-- ruka: paže vychází z pravého okraje panelu, prsty svírají dřík hřebíku u hlavičky -->
			<g class="p2ru">
				<rect x="0" y="-14" width="640" height="28" fill="#1971c2" stroke="#0b4f8a" stroke-width="2" transform="translate(4 -30) rotate(-10)" />
				<rect x="-18" y="-34" width="36" height="30" rx="11" fill="#f1c9a5" stroke="#8a5a2b" stroke-width="2" />
