<svg viewBox="0 507 460 431" width="460" height="431" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kulička bez tření: Ep se mění na Ek a zpět, součet zůstává E = 10 J. V polohách 1 až 6 je Ep 10, 6, 2, 0, 5 a 10 J a Ek 0, 4, 8, 10, 5 a 0 J, E je vždy 10 J." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Zákon zachování mechanické energie 2/5: Kulička bez tření</title>
	<!-- Panel 2/5 výřezu z infografika-zakon-zachovani-mechanicke-energie.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.kul { animation: kul 6s linear infinite; }
		.ep { transform-box: fill-box; transform-origin: 50% 100%; animation: ep 6s linear infinite; }
		@keyframes kul { 0% { transform: rotate(60deg); } 2.5% { transform: rotate(59.3deg); } 5% { transform: rotate(57.2deg); } 7.5% { transform: rotate(53.7deg); } 10% { transform: rotate(48.9deg); } 12.5% { transform: rotate(42.9deg); } 15% { transform: rotate(35.8deg); } 17.5% { transform: rotate(27.8deg); } 20% { transform: rotate(19deg); } 22.5% { transform: rotate(9.6deg); } 25% { transform: rotate(0deg); } 27.5% { transform: rotate(-9.6deg); } 30% { transform: rotate(-19deg); } 32.5% { transform: rotate(-27.8deg); } 35% { transform: rotate(-35.8deg); } 37.5% { transform: rotate(-42.9deg); } 40% { transform: rotate(-48.9deg); } 42.5% { transform: rotate(-53.7deg); } 45% { transform: rotate(-57.2deg); } 47.5% { transform: rotate(-59.3deg); } 50% { transform: rotate(-60deg); } 52.5% { transform: rotate(-59.3deg); } 55% { transform: rotate(-57.2deg); } 57.5% { transform: rotate(-53.7deg); } 60% { transform: rotate(-48.9deg); } 62.5% { transform: rotate(-42.9deg); } 65% { transform: rotate(-35.8deg); } 67.5% { transform: rotate(-27.8deg); } 70% { transform: rotate(-19deg); } 72.5% { transform: rotate(-9.6deg); } 75% { transform: rotate(0deg); } 77.5% { transform: rotate(9.6deg); } 80% { transform: rotate(19deg); } 82.5% { transform: rotate(27.8deg); } 85% { transform: rotate(35.8deg); } 87.5% { transform: rotate(42.9deg); } 90% { transform: rotate(48.9deg); } 92.5% { transform: rotate(53.7deg); } 95% { transform: rotate(57.2deg); } 97.5% { transform: rotate(59.3deg); } 100% { transform: rotate(60deg); } }
		@keyframes ep { 0% { transform: scaleY(1); } 2.5% { transform: scaleY(0.979); } 5% { transform: scaleY(0.916); } 7.5% { transform: scaleY(0.817); } 10% { transform: scaleY(0.686); } 12.5% { transform: scaleY(0.536); } 15% { transform: scaleY(0.378); } 17.5% { transform: scaleY(0.23); } 20% { transform: scaleY(0.108); } 22.5% { transform: scaleY(0.028); } 25% { transform: scaleY(0); } 27.5% { transform: scaleY(0.028); } 30% { transform: scaleY(0.108); } 32.5% { transform: scaleY(0.23); } 35% { transform: scaleY(0.379); } 37.5% { transform: scaleY(0.536); } 40% { transform: scaleY(0.686); } 42.5% { transform: scaleY(0.817); } 45% { transform: scaleY(0.916); } 47.5% { transform: scaleY(0.979); } 50% { transform: scaleY(1); } 52.5% { transform: scaleY(0.979); } 55% { transform: scaleY(0.916); } 57.5% { transform: scaleY(0.817); } 60% { transform: scaleY(0.686); } 62.5% { transform: scaleY(0.536); } 65% { transform: scaleY(0.378); } 67.5% { transform: scaleY(0.23); } 70% { transform: scaleY(0.108); } 72.5% { transform: scaleY(0.028); } 75% { transform: scaleY(0); } 77.5% { transform: scaleY(0.028); } 80% { transform: scaleY(0.108); } 82.5% { transform: scaleY(0.23); } 85% { transform: scaleY(0.379); } 87.5% { transform: scaleY(0.536); } 90% { transform: scaleY(0.686); } 92.5% { transform: scaleY(0.817); } 95% { transform: scaleY(0.916); } 97.5% { transform: scaleY(0.979); } 100% { transform: scaleY(1); } }
		@media (prefers-reduced-motion: reduce) {
			.kul, .ep { animation: none; }
		}
	</style>
	<rect x="0" y="507" width="460" height="431" fill="#f3f1ea" />
	<g id="panel-2" transform="translate(0,517)">
		<rect x="26" y="6" width="420" height="405" rx="10" fill="#2b2a26" />
		<rect x="20" y="0" width="420" height="405" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="34" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="41" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="43" font-size="28" font-weight="bold" fill="#2b2a26">Kulička bez tření</text>
		<text x="40" y="78" font-size="21" fill="#2b2a26"><tspan fill="#1971c2" font-weight="bold">E<tspan font-size="18" dy="5">p</tspan></tspan><tspan dy="-5"> se mění na </tspan><tspan fill="#c92a2a" font-weight="bold">E<tspan font-size="18" dy="5">k</tspan></tspan><tspan dy="-5"> a zpět,</tspan></text>
		<text x="40" y="106" font-size="21" fill="#2b2a26">součet zůstává <tspan font-weight="bold" fill="#1e7a34">E = 10 J</tspan>.</text>

		<!-- země a podpěry dráhy -->
		<rect x="34" y="240" width="300" height="10" fill="#c9a77c" stroke="#2b2a26" stroke-width="1.5" />
		<rect x="41" y="160" width="8" height="80" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1.5" />
		<rect x="281" y="160" width="8" height="80" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1.5" />
		<rect x="145" y="232" width="40" height="8" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1.5" />
		<!-- dráha: oblouk r = 140 kolem (165, 90), konce ±65° -->
		<path d="M 38.1 149.2 A 140 140 0 0 0 291.9 149.2" fill="none" stroke="#2b2a26" stroke-width="11" stroke-linecap="round" />
		<path d="M 38.1 149.2 A 140 140 0 0 0 291.9 149.2" fill="none" stroke="#d9a066" stroke-width="6" stroke-linecap="round" />
		<!-- značky poloh 1–6 (úhly z Eₚ: cos φ = 1 − Eₚ/20) -->
		<g stroke="#2b2a26" stroke-width="2.5">
			<line x1="52.4" y1="155" x2="38.6" y2="163" />
			<line x1="72.2" y1="181" x2="60.7" y2="192.2" />
			<line x1="108.3" y1="207" x2="101.4" y2="221.4" />
			<line x1="165" y1="220" x2="165" y2="236" />
			<line x1="251" y1="187.5" x2="261.6" y2="199.5" />
			<line x1="277.6" y1="155" x2="291.4" y2="163" />
		</g>
		<!-- čísla poloh: kroužky na r 92 (mimo dráhu kuličky r 110–136), vodicí čárka k rysce na dráze;
		     1 a 6 posunuty na ±66° (kulička tam nikdy nedojede), aby se 1 a 2 nedotýkaly (odstup středů 32,6) -->
		<g stroke="#868e96" stroke-width="1.5" stroke-dasharray="3 3">
			<line x1="69.1" y1="132.7" x2="52.4" y2="155" />
			<line x1="90" y1="163.5" x2="72.2" y2="181" />
			<line x1="119.2" y1="184.5" x2="108.3" y2="207" />
			<line x1="165" y1="195" x2="165" y2="220" />
			<line x1="234.5" y1="168.7" x2="251" y2="187.5" />
			<line x1="260.9" y1="132.7" x2="277.6" y2="155" />
		</g>
		<g font-size="21" font-weight="bold" fill="#2b2a26" text-anchor="middle">
			<circle cx="81" cy="127.4" r="13" fill="#fff" stroke="#2b2a26" stroke-width="1.5" /><text x="81" y="134.9">1</text>
			<circle cx="99.3" cy="154.4" r="13" fill="#fff" stroke="#2b2a26" stroke-width="1.5" /><text x="99.3" y="161.9">2</text>
			<circle cx="124.9" cy="172.8" r="13" fill="#fff" stroke="#2b2a26" stroke-width="1.5" /><text x="124.9" y="180.3">3</text>
			<circle cx="165" cy="182" r="13" fill="#fff" stroke="#2b2a26" stroke-width="1.5" /><text x="165" y="189.5">4</text>
			<circle cx="225.9" cy="159" r="13" fill="#fff" stroke="#2b2a26" stroke-width="1.5" /><text x="225.9" y="166.5">5</text>
			<circle cx="249" cy="127.4" r="13" fill="#fff" stroke="#2b2a26" stroke-width="1.5" /><text x="249" y="134.9">6</text>
		</g>
		<!-- kulička: celá v jedné otáčené skupině, střed vždy 123 od středu oblouku = leží na dráze -->
		<g transform="translate(165,90)">
			<g class="kul" transform="rotate(60)">
				<circle cx="0" cy="123" r="13" fill="#868e96" stroke="#2b2a26" stroke-width="2" />
				<circle cx="-4" cy="118" r="4" fill="#f1f3f5" />
			</g>
		</g>

		<!-- sloupec energie: celek 10 J = 100 px; modrá Eₚ zdola, zbytek nahoře červený = Eₖ -->
		<text x="358" y="122" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e7a34">E = 10 J</text>
		<rect x="340" y="132" width="36" height="100" fill="#e03131" />
		<rect class="ep" x="340" y="132" width="36" height="100" fill="#1971c2" />
		<rect x="340" y="132" width="36" height="100" fill="none" stroke="#2b2a26" stroke-width="2.5" />
		<text x="384" y="154" font-size="21" font-weight="bold" fill="#c92a2a">E<tspan font-size="18" dy="5">k</tspan></text>
		<text x="384" y="228" font-size="21" font-weight="bold" fill="#1971c2">E<tspan font-size="18" dy="5">p</tspan></text>
		<rect x="332" y="232" width="52" height="8" fill="#868e96" stroke="#2b2a26" stroke-width="1.5" />

		<!-- tabulka z výkladu -->
		<g font-size="21" fill="#2b2a26" text-anchor="middle">
			<line x1="34" y1="262" x2="426" y2="262" stroke="#2b2a26" stroke-width="1.5" />
			<text x="34" y="288" text-anchor="start">poloha</text>
			<g font-weight="bold"><text x="165" y="288">1</text><text x="213" y="288">2</text><text x="261" y="288">3</text><text x="309" y="288">4</text><text x="357" y="288">5</text><text x="405" y="288">6</text></g>
			<line x1="34" y1="298" x2="426" y2="298" stroke="#adb5bd" stroke-width="1.5" />
			<text x="34" y="320" text-anchor="start" fill="#1971c2" font-weight="bold">E<tspan font-size="18" dy="5">p</tspan><tspan dy="-5" fill="#2b2a26" font-weight="normal"> (J)</tspan></text>
			<g fill="#1971c2"><text x="165" y="320">10</text><text x="213" y="320">6</text><text x="261" y="320">2</text><text x="309" y="320">0</text><text x="357" y="320">5</text><text x="405" y="320">10</text></g>
			<line x1="34" y1="330" x2="426" y2="330" stroke="#adb5bd" stroke-width="1.5" />
			<text x="34" y="352" text-anchor="start" fill="#c92a2a" font-weight="bold">E<tspan font-size="18" dy="5">k</tspan><tspan dy="-5" fill="#2b2a26" font-weight="normal"> (J)</tspan></text>
			<g fill="#c92a2a"><text x="165" y="352">0</text><text x="213" y="352">4</text><text x="261" y="352">8</text><text x="309" y="352">10</text><text x="357" y="352">5</text><text x="405" y="352">0</text></g>
			<line x1="34" y1="362" x2="426" y2="362" stroke="#adb5bd" stroke-width="1.5" />
			<text x="34" y="384" text-anchor="start" fill="#1e7a34" font-weight="bold">E<tspan fill="#2b2a26" font-weight="normal"> (J)</tspan></text>
			<g fill="#1e7a34" font-weight="bold"><text x="165" y="384">10</text><text x="213" y="384">10</text><text x="261" y="384">10</text><text x="309" y="384">10</text><text x="357" y="384">10</text><text x="405" y="384">10</text></g>
		</g>
	</g>
</svg>
