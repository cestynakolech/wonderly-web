<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Rezistor – součástka s daným odporem. Vlevo odporový drát navinutý na keramickém válečku, vpravo malý rezistor s barevnými proužky, které udávají odpor. Dole značka rezistoru ve schématu: u nás obdélník se dvěma vývody, v amerických schématech klikatá čára.">
