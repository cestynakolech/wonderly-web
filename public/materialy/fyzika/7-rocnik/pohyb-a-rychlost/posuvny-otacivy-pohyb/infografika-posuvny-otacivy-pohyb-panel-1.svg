<svg viewBox="0 0 460 452" width="460" height="452" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dva základní pohyby těles. Posuvný: krabice jede po pokladním pásu, všechny její body jdou stejně. Otáčivý: lopatky ventilátoru, body jdou po kružnicích kolem osy. Složitější pohyby se z těchto dvou skládají, je to složený pohyb" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Posuvný a otáčivý pohyb 1/6: Dva základní pohyby</title>
	<style>
		.p1-k { transform: translate(100px, 0px); animation: p1-k 5s linear infinite; } @keyframes p1-k { 0%, 8% { transform: translate(0px, 0px); opacity: 1; } 68%, 88% { transform: translate(100px, 0px); opacity: 1; } 93% { transform: translate(100px, 0px); opacity: 0; } 94% { transform: translate(0px, 0px); opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 1; } }
		.p1-st { stroke-dasharray: 100 100; stroke-dashoffset: 0; animation: p1-st 5s linear infinite; } @keyframes p1-st { 0%, 8% { stroke-dashoffset: 100; opacity: 1; } 68%, 88% { stroke-dashoffset: 0; opacity: 1; } 93%, 94% { stroke-dashoffset: 0; opacity: 0; } 94.5% { stroke-dashoffset: 100; opacity: 0; } 100% { stroke-dashoffset: 100; opacity: 1; } }
		.p1-v { transform-origin: 332px 228px; transform-box: view-box; animation: p1-v 3s linear infinite; } @keyframes p1-v { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
		@media (prefers-reduced-motion: reduce) { .p1-k, .p1-st, .p1-v { animation: none; } }
	</style>
	<rect x="0" y="0" width="460" height="452" fill="#f8f9fa"/>
	<g id="panel-1"><rect x="26" y="16" width="420" height="432" rx="12" fill="#dee2e6"/><rect x="20" y="10" width="420" height="432" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="44" r="17" fill="#2b2a26"/><text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Dva základní pohyby</text><text x="34" y="92" font-size="21" fill="#2b2a26">Tělesa se pohybují dvěma</text><text x="34" y="118" font-size="21" fill="#2b2a26">základními způsoby:</text><rect x="34" y="134" width="188" height="226" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/><text x="128" y="166" font-size="23" font-weight="bold" text-anchor="middle" fill="#2b2a26">posuvný</text><rect x="44" y="280" width="168" height="16" rx="8" fill="#343a40"/><circle cx="52" cy="288" r="5" fill="#868e96"/><circle cx="204" cy="288" r="5" fill="#868e96"/><rect x="52" y="296" width="152" height="10" fill="#868e96"/><line class="p1-st" x1="58" y1="242" x2="158" y2="242" stroke="#e03131" stroke-width="3"/><line class="p1-st" x1="94" y1="242" x2="194" y2="242" stroke="#1971c2" stroke-width="3"/><line class="p1-st" x1="76" y1="274" x2="176" y2="274" stroke="#2f9e44" stroke-width="3"/><g class="p1-k"><rect x="52" y="236" width="48" height="44" rx="3" fill="#d9a066" stroke="#8a5a2b" stroke-width="2"/><rect x="72" y="236" width="8" height="44" fill="#c08040" opacity="0.6"/><circle cx="58" cy="242" r="5" fill="#e03131"/><circle cx="94" cy="242" r="5" fill="#1971c2"/><circle cx="76" cy="274" r="5" fill="#2f9e44"/></g><text x="128" y="328" font-size="20" text-anchor="middle" fill="#2b2a26">všechny body</text><text x="128" y="352" font-size="20" text-anchor="middle" fill="#2b2a26">jdou stejně</text><rect x="238" y="134" width="188" height="226" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/><text x="332" y="166" font-size="23" font-weight="bold" text-anchor="middle" fill="#2b2a26">otáčivý</text><rect x="328" y="232" width="8" height="58" fill="#868e96"/><rect x="304" y="286" width="56" height="10" rx="4" fill="#495057"/><circle cx="332" cy="228" r="40" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="6 5"/><g class="p1-v"><ellipse cx="332" cy="206" rx="9" ry="22" fill="#74c0fc" stroke="#1c7ed6" stroke-width="1.5" transform="rotate(0 332 228)"/><ellipse cx="332" cy="206" rx="9" ry="22" fill="#74c0fc" stroke="#1c7ed6" stroke-width="1.5" transform="rotate(120 332 228)"/><ellipse cx="332" cy="206" rx="9" ry="22" fill="#74c0fc" stroke="#1c7ed6" stroke-width="1.5" transform="rotate(240 332 228)"/><circle cx="332" cy="188" r="5" fill="#e03131"/></g><circle cx="332" cy="228" r="6" fill="#343a40"/><circle cx="332" cy="228" r="48" fill="none" stroke="#adb5bd" stroke-width="2"/><text x="332" y="328" font-size="20" text-anchor="middle" fill="#2b2a26">body jdou po</text><text x="332" y="352" font-size="20" text-anchor="middle" fill="#2b2a26">kružnicích</text><text x="34" y="396" font-size="21" fill="#2b2a26">Složitější pohyby se skládají</text><text x="34" y="422" font-size="21" fill="#2b2a26">z těchto dvou: <tspan font-weight="bold">složený pohyb</tspan>.</text></g>
</svg>
