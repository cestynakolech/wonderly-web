<svg xmlns="http://www.w3.org/2000/svg" width="460" height="690" viewBox="0 0 460 690" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Přehrada v příčném řezu: hráz je dole širší, protože u dna tlačí voda nejvíc; šipky tlaku jsou hlouběji delší. Přehrada hluboká 60 m: na dně 60 · 1 000 · 10 = 600 000 Pa. Vodojem stojí na kopci výš než domy, hladina ve vodojemu je výš než kohoutky. Výška hladiny ve vodojemu tlačí vodu potrubím až do kohoutků v domech.">
	<title>Hydrostatický tlak 5/6: Přehrada a vodojem</title>
