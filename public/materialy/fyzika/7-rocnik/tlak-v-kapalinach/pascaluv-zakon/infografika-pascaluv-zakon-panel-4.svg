<svg xmlns="http://www.w3.org/2000/svg" width="460" height="690" viewBox="0 0 460 690" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Malá stříkačka s pístem 1 cm² a velká s pístem 4 cm² jsou spojené hadičkou s vodou. Malý píst zatlačíme silou F o 8 cm, odteče 1 · 8 = 8 cm³ vody. Velký píst se vysune o 8 : 4 = 2 cm, zato na něj působí 4krát větší síla. Co se získá na síle, ztratí se na dráze.">
	<title>Pascalův zákon 4/6: Síla a dráha</title>
	<!-- Panel 4/6 infografiky Pascalův zákon (W52, 14. 10. 2026); bez animace = koncový stav. -->
	<style>
		.p4-m { animation: p4-m 8s ease-in-out infinite; }
		@keyframes p4-m { 0% { transform: translateY(-80px) } 15% { transform: translateY(-80px) } 50% { transform: translateY(0px) } 85% { transform: translateY(0px) } 95% { transform: translateY(-80px) } 100% { transform: translateY(-80px) } }
		.p4-v { animation: p4-v 8s ease-in-out infinite; }
		@keyframes p4-v { 0% { transform: translateY(20px) } 15% { transform: translateY(20px) } 50% { transform: translateY(0px) } 85% { transform: translateY(0px) } 95% { transform: translateY(20px) } 100% { transform: translateY(20px) } }
		.p4-d { animation: p4-d 8s linear infinite; }
		@keyframes p4-d { 0% { opacity: 0 } 50% { opacity: 0 } 54% { opacity: 1 } 85% { opacity: 1 } 90% { opacity: 0 } 100% { opacity: 0 } }
		@media (prefers-reduced-motion: reduce) {
			.p4-m, .p4-v, .p4-d { animation: none; }
		}
	</style>
	<defs><clipPath id="p4-cm"><rect x="100" y="166" width="20" height="214"/></clipPath><clipPath id="p4-cv"><rect x="290" y="226" width="40" height="154"/></clipPath></defs>
	<rect x="0" y="0" width="460" height="690" fill="#f8f9fa"/>
	<rect x="26" y="16" width="420" height="670" rx="12" fill="#dee2e6"/><rect x="20" y="10" width="420" height="670" rx="12" fill="#fbfaf6" stroke="#ced4da" stroke-width="2"/><circle cx="52" cy="44" r="17" fill="#2b2a26"/><text x="52" y="52" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">4</text><text x="80" y="53" font-size="25" font-weight="bold" fill="#2b2a26">Síla a dráha</text>
	<text x="40" y="95" font-size="21" fill="#2b2a26">Malá stříkačka má píst 1 cm²,</text>
	<text x="40" y="123" font-size="21" fill="#2b2a26">velká 4 cm². Spojuje je hadička.</text>
	<g transform="translate(0,50)">
	<path d="M110,380 L110,412 L310,412 L310,380" fill="none" stroke="#2b2a26" stroke-width="14" stroke-linejoin="round"/><path d="M110,378 L110,412 L310,412 L310,378" fill="none" stroke="#74c0fc" stroke-width="8" stroke-linejoin="round"/>
	<rect x="100" y="186" width="20" height="194" fill="#74c0fc"/>
	<rect x="290" y="246" width="40" height="134" fill="#74c0fc"/>
	<g class="p4-m"><g clip-path="url(#p4-cm)"><rect x="95" y="-20" width="30" height="300" fill="#fbfaf6"/></g><rect x="101" y="270" width="18" height="10" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1.5"/><line x1="110" y1="270" x2="110" y2="206" stroke="#495057" stroke-width="5"/><rect x="92" y="200" width="36" height="8" rx="3" fill="#495057"/><line x1="110.0" y1="168.0" x2="110.0" y2="184.0" stroke="#e03131" stroke-width="4" stroke-linecap="round"/><polygon points="110.0,196.0 103.4,184.0 116.6,184.0" fill="#e03131"/><text x="124" y="188" font-size="18" font-weight="bold" fill="#e03131">F</text></g>
	<g class="p4-v"><g clip-path="url(#p4-cv)"><rect x="285" y="-20" width="50" height="300" fill="#fbfaf6"/></g><rect x="291" y="268" width="38" height="12" fill="#8d5a2b" stroke="#2b2a26" stroke-width="1.5"/><line x1="310" y1="268" x2="310" y2="220" stroke="#495057" stroke-width="8"/><rect x="280" y="212" width="60" height="10" rx="3" fill="#495057"/><line x1="310.0" y1="208.0" x2="310.0" y2="165.0" stroke="#e03131" stroke-width="6" stroke-linecap="round"/><polygon points="310.0,150.0 318.2,165.0 301.8,165.0" fill="#e03131"/><text x="322" y="180" font-size="18" font-weight="bold" fill="#e03131">4 · F</text></g>
	<path d="M98,186 L98,382 M122,186 L122,382" stroke="#2b2a26" stroke-width="4"/><path d="M288,246 L288,382 L332,382 L332,246" fill="none" stroke="#2b2a26" stroke-width="4"/><line x1="98" y1="382" x2="122" y2="382" stroke="#2b2a26" stroke-width="4"/>
	<text x="310" y="350" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c7ed6">voda</text>
	<text x="110" y="444" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">1 cm²</text>
	<text x="310" y="444" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">4 cm²</text>
	<g class="p4-d"><line x1="80" y1="200" x2="80" y2="280" stroke="#b8460b" stroke-width="2.5"/><line x1="74" y1="200" x2="86" y2="200" stroke="#b8460b" stroke-width="2.5"/><line x1="74" y1="280" x2="86" y2="280" stroke="#b8460b" stroke-width="2.5"/><text x="72" y="246" font-size="18" font-weight="bold" text-anchor="end" fill="#b8460b">8 cm</text><line x1="370" y1="280" x2="370" y2="300" stroke="#b8460b" stroke-width="2.5"/><line x1="364" y1="280" x2="376" y2="280" stroke="#b8460b" stroke-width="2.5"/><line x1="364" y1="300" x2="376" y2="300" stroke="#b8460b" stroke-width="2.5"/><text x="380" y="296" font-size="18" font-weight="bold" fill="#b8460b">2 cm</text></g>
	</g>
	<rect x="40" y="516" width="380" height="154" rx="10" fill="#fff4e6" stroke="#b8460b" stroke-width="2"/>
	<text x="56" y="546" font-size="18" fill="#2b2a26">Malý píst o 8 cm: odteče 1 · 8 = 8 cm³.</text>
	<text x="56" y="572" font-size="18" fill="#2b2a26">Velký píst se vysune o 8 : 4 = 2 cm,</text>
	<text x="56" y="598" font-size="18" fill="#2b2a26">zato na něj působí 4krát větší síla.</text>
	<text x="230" y="630" font-size="21" font-weight="bold" text-anchor="middle" fill="#b8460b">Co se získá na síle,</text>
	<text x="230" y="656" font-size="21" font-weight="bold" text-anchor="middle" fill="#b8460b">ztratí se na dráze.</text>
</svg>
