<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: usměvavá slečna se zkříženýma nohama dosedne do čalouněného křesla, sedák se stlačí. Z místa dotyku vedou dvě stejně dlouhé šipky: oranžová nahoru – křeslo působí silou nahoru a drží slečnu, aby nespadla; modrá dolů – slečna tlačí silou dolů na křeslo, stlačí ho a trochu prohne.">
<style>
/* Předloha: PDF Vzájemné působení těles, síla – fotografie slečny v křesle se dvěma opačnými šipkami a dvěma bublinami. Překresleno; barva plakety = barva šipky. Bez animace = sedí, šipky viditelné. */
/* cyklus 7 s: 0–20 % slečna těsně nad sedákem, 20–38 % dosedne a sedák se stlačí, 42–52 % objeví se šipky, drží, 94–100 % zhasne */
@keyframes divka { 0%, 20% { transform: translateY(-34px); } 30% { transform: translateY(-13px); } 38%, 100% { transform: translateY(0px); } }
@keyframes sedak { 0%, 30% { transform: scaleY(1.25); } 38%, 100% { transform: scaleY(1); } }
@keyframes sipy { 0%, 42% { opacity: 0; } 52%, 100% { opacity: 1; } }
.dv { animation: divka 7s ease-in-out infinite; }
.sd { transform-origin: 300px 512px; animation: sedak 7s ease-in-out infinite; }
.sp { animation: sipy 7s linear infinite; }
@keyframes sc { 0% { opacity: 0; } 4%, 94% { opacity: 1; } 100% { opacity: 0; } }
.sc { animation: sc 7s linear infinite; }
@media (prefers-reduced-motion: reduce) { .dv, .sd, .sp, .sc { animation: none; } }
</style>
<defs><marker id="b-cer" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e03131"/></marker><marker id="b-mod" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#1971c2"/></marker><marker id="b-ora" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e8590c"/></marker><marker id="b-sed" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#868e96"/></marker><marker id="m-sed" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#868e96"/></marker><linearGradient id="cal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d98c7c"/><stop offset="0.45" stop-color="#f4bfb3"/><stop offset="1" stop-color="#cf7f6f"/></linearGradient><linearGradient id="cal2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7cdc3"/><stop offset="1" stop-color="#e2a092"/></linearGradient><linearGradient id="drevo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9824d"/><stop offset="0.4" stop-color="#e2b07a"/><stop offset="1" stop-color="#a8723f"/></linearGradient><linearGradient id="dzin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5c8ec"/><stop offset="1" stop-color="#5f93c9"/></linearGradient><linearGradient id="parkety" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9dccb"/><stop offset="1" stop-color="#d2bfa6"/></linearGradient></defs>
<rect x="3" y="3" width="594" height="634" rx="14" fill="#f8f9fa"/>
<text x="300" y="40" font-size="27" font-weight="bold" fill="#212529" text-anchor="middle">Slečna a křeslo na sebe působí</text><rect x="14" y="58" width="282" height="99.5" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="2.5"/><line x1="36" y1="150" x2="36" y2="86" stroke="#e8590c" stroke-width="6" marker-end="url(#b-ora)"/><text x="54" y="88.4" font-size="21" fill="#212529" text-anchor="start">Křeslo působí silou</text><text x="54" y="115.3" font-size="21" fill="#212529" text-anchor="start">nahoru a drží</text><text x="54" y="142.2" font-size="21" fill="#212529" text-anchor="start">slečnu, aby nespadla.</text><rect x="304" y="58" width="282" height="99.5" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5"/><line x1="328" y1="80" x2="328" y2="144" stroke="#1971c2" stroke-width="6" marker-end="url(#b-mod)"/><text x="344" y="88.4" font-size="21" fill="#212529" text-anchor="start">Slečna tlačí silou</text><text x="344" y="115.3" font-size="21" fill="#212529" text-anchor="start">dolů na křeslo, stlačí</text><text x="344" y="142.2" font-size="21" fill="#212529" text-anchor="start">ho a trochu prohne.</text><rect x="12" y="588" width="576" height="46" fill="url(#parkety)"/><path d="M12 588H588" stroke="#b49a7c" stroke-width="2"/><path d="M90 590L60 632" stroke="#c4ae92" stroke-width="2"/><path d="M210 590L180 632" stroke="#c4ae92" stroke-width="2"/><path d="M350 590L320 632" stroke="#c4ae92" stroke-width="2"/><path d="M480 590L450 632" stroke="#c4ae92" stroke-width="2"/><g class="sc"><ellipse cx="300" cy="596" rx="150" ry="8" fill="#000" opacity="0.13"/><path d="M222 545 L206 596" stroke="#9c6b3c" stroke-width="11" stroke-linecap="round"/><path d="M378 545 L394 596" stroke="#9c6b3c" stroke-width="11" stroke-linecap="round"/><path d="M244 540 L230 600" stroke="url(#drevo)" stroke-width="15" stroke-linecap="round"/><path d="M356 540 L370 600" stroke="url(#drevo)" stroke-width="15" stroke-linecap="round"/><path d="M168,510 C146,400 172,254 300,240 C428,254 454,400 432,510 Z" fill="url(#cal)" stroke="#a85a4b" stroke-width="3"/><path d="M200,340 C214,288 250,272 300,270 C350,272 386,288 400,340" stroke="#c97b6b" stroke-width="2.5" fill="none"/><path d="M150,378 C176,384 172,510 188,522 L212,522 L212,412 C200,386 174,374 150,378 Z" fill="url(#cal2)" stroke="#a85a4b" stroke-width="3"/><path d="M450,378 C424,384 428,510 412,522 L388,522 L388,412 C400,386 426,374 450,378 Z" fill="url(#cal2)" stroke="#a85a4b" stroke-width="3"/><rect x="186" y="506" width="228" height="38" rx="12" fill="url(#cal)" stroke="#a85a4b" stroke-width="3"/><g class="sd"><rect x="200" y="460" width="200" height="52" rx="16" fill="url(#cal2)" stroke="#a85a4b" stroke-width="3" vector-effect="non-scaling-stroke"/><path d="M214 470 Q300 462 386 470" stroke="#ffffff" stroke-width="3" opacity="0.6" fill="none" vector-effect="non-scaling-stroke"/></g><g class="dv"><path d="M262,296 C258,254 278,228 300,228 C330,228 346,248 342,290 C348,330 356,358 346,376 L326,370 L274,370 L252,376 C244,356 254,330 262,296 Z" fill="#4a2c17"/><path d="M256,342 C262,328 338,328 344,342 L350,440 C330,454 270,454 250,440 Z" fill="#ffffff" stroke="#adb5bd" stroke-width="2.5"/><path d="M300 340 L300 436" stroke="#dee2e6" stroke-width="2"/><path d="M222,436 C240,422 330,426 352,440 C350,458 330,466 300,464 C262,464 226,460 222,436 Z" fill="url(#dzin)" stroke="#1864ab" stroke-width="2.5"/><path d="M378,436 C360,422 270,426 248,440 C250,458 270,466 300,464 C338,464 374,460 378,436 Z" fill="url(#dzin)" stroke="#1864ab" stroke-width="2.5"/><ellipse cx="236" cy="452" rx="17" ry="9" fill="#f1c9a5" stroke="#b07a52" stroke-width="2"/><ellipse cx="364" cy="452" rx="17" ry="9" fill="#f1c9a5" stroke="#b07a52" stroke-width="2"/><path d="M256,344 C238,370 238,396 244,412" stroke="#adb5bd" stroke-width="24" fill="none" stroke-linecap="round"/><path d="M256,344 C238,370 238,396 244,412" stroke="#ffffff" stroke-width="20" fill="none" stroke-linecap="round"/><path d="M244,412 L270,438" stroke="#b07a52" stroke-width="15" stroke-linecap="round"/><path d="M244,412 L270,438" stroke="#f1c9a5" stroke-width="11" stroke-linecap="round"/><path d="M344,344 C362,370 362,396 356,412" stroke="#adb5bd" stroke-width="24" fill="none" stroke-linecap="round"/><path d="M344,344 C362,370 362,396 356,412" stroke="#ffffff" stroke-width="20" fill="none" stroke-linecap="round"/><path d="M356,412 L330,438" stroke="#b07a52" stroke-width="15" stroke-linecap="round"/><path d="M356,412 L330,438" stroke="#f1c9a5" stroke-width="11" stroke-linecap="round"/><rect x="290" y="302" width="20" height="30" rx="6" fill="#f1c9a5" stroke="#b07a52" stroke-width="2"/><ellipse cx="300" cy="276" rx="28" ry="32" fill="#f1c9a5" stroke="#b07a52" stroke-width="2.5"/><path d="M272,272 C270,240 292,234 304,236 C326,238 334,254 330,272 C318,254 296,250 272,272 Z" fill="#4a2c17"/><path d="M284 276 Q290 272 295 276 M306 276 Q311 272 317 276" stroke="#212529" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M288 291 Q300 302 312 291 Z" fill="#ffffff" stroke="#a5523a" stroke-width="2.2" stroke-linejoin="round"/></g><g class="sp"><line x1="292" y1="460" x2="292" y2="328" stroke="#e8590c" stroke-width="7" stroke-linecap="round" marker-end="url(#b-ora)"/><circle cx="292" cy="460" r="8" fill="#e8590c" stroke="#212529" stroke-width="2"/><line x1="308" y1="460" x2="308" y2="592" stroke="#1971c2" stroke-width="7" stroke-linecap="round" marker-end="url(#b-mod)"/><circle cx="308" cy="460" r="8" fill="#1971c2" stroke="#212529" stroke-width="2"/></g></g>
</svg>
