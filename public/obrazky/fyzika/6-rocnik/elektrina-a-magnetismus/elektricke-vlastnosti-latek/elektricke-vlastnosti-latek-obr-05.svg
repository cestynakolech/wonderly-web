<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: dívka se češe růžovým plastovým hřebenem. Vlasy i hřeben jsou na začátku nenabité. Při česání přejde 5 elektronů z vlasů na hřeben. Na vlasech pak zůstane 5 kladných nábojů a na hřebenu je 5 elektronů: vlasy jsou nabité kladně, hřeben záporně.">
<style>
/* Předloha: PDF Elektrické vlastnosti látek, dvojice fotografií dívky s hřebenem: vlevo zelené elektrony se žlutými šipkami přecházejí z vlasů na hřeben, vpravo + u vlasů a − u hřebenu (fotografie → vlastní kresba, obě fáze jako jedna animace). Animace 11 s: 2 tahy hřebenem, 5 elektronů přeletí na hřeben, na vlasech se objeví 5 znaků +. Počty + a − jsou stejné (nabijí se obě tělesa). Bez animace = koncový stav. */
@keyframes cesani { 0%, 12% { transform: translateY(0); } 19% { transform: translateY(70px); } 26% { transform: translateY(0); } 33% { transform: translateY(70px); } 40%, 100% { transform: translateY(0); } }
@keyframes plus { 0%, 55% { opacity: 0; } 60%, 95% { opacity: 1; } 100% { opacity: 0; } }
@keyframes c1 { 0%, 11% { opacity: 1; } 13%, 100% { opacity: 0; } }
@keyframes c2 { 0%, 11% { opacity: 0; } 13%, 56% { opacity: 1; } 58%, 100% { opacity: 0; } }
@keyframes c3 { 0%, 56% { opacity: 0; } 58%, 100% { opacity: 1; } }
.hreben { animation: cesani 11s ease-in-out infinite; } .plus { animation: plus 11s linear infinite; }
.c1 { animation: c1 11s linear infinite; } .c2 { animation: c2 11s linear infinite; } .c3 { animation: c3 11s linear infinite; }
@keyframes e0 { 0%, 11% { transform: translate(-32px, 16px); opacity: 0; } 13%, 40% { transform: translate(-32px, 16px); opacity: 1; } 48%, 95% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(0, 0); opacity: 0; } }
.e0 { animation: e0 11s ease-in-out infinite; }
@keyframes e1 { 0%, 11% { transform: translate(-26px, 18px); opacity: 0; } 13%, 43% { transform: translate(-26px, 18px); opacity: 1; } 51%, 95% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(0, 0); opacity: 0; } }
.e1 { animation: e1 11s ease-in-out infinite; }
@keyframes e2 { 0%, 11% { transform: translate(-32px, 20px); opacity: 0; } 13%, 46% { transform: translate(-32px, 20px); opacity: 1; } 54%, 95% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(0, 0); opacity: 0; } }
.e2 { animation: e2 11s ease-in-out infinite; }
@keyframes e3 { 0%, 11% { transform: translate(-28px, 22px); opacity: 0; } 13%, 49% { transform: translate(-28px, 22px); opacity: 1; } 57%, 95% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(0, 0); opacity: 0; } }
.e3 { animation: e3 11s ease-in-out infinite; }
@keyframes e4 { 0%, 11% { transform: translate(-30px, 24px); opacity: 0; } 13%, 52% { transform: translate(-30px, 24px); opacity: 1; } 60%, 95% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(0, 0); opacity: 0; } }
.e4 { animation: e4 11s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
