<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Stavba atomu dusíku. Uprostřed je malé jádro atomu se 7 červenými protony se znaménkem plus a 7 šedými neutrony bez náboje. Kolem je obal atomu se 7 modrými elektrony se znaménkem minus. Protonů je stejně jako elektronů, a proto je atom elektricky neutrální.">
