.hl0 { animation: hl0 16s linear infinite; }
@keyframes hl0 { 0.000% { opacity:1 } 12.490% { opacity:1 } 12.500% { opacity:0 } 87.490% { opacity:0 } 87.500% { opacity:1 } 100.000% { opacity:1 } }
.hl1 { animation: hl1 16s linear infinite; }
@keyframes hl1 { 0.000% { opacity:0 } 12.490% { opacity:0 } 12.500% { opacity:1 } 37.490% { opacity:1 } 37.500% { opacity:0 } 100.000% { opacity:0 } }
.hl2 { animation: hl2 16s linear infinite; }
@keyframes hl2 { 0.000% { opacity:0 } 37.490% { opacity:0 } 37.500% { opacity:1 } 62.490% { opacity:1 } 62.500% { opacity:0 } 100.000% { opacity:0 } }
.hl3 { animation: hl3 16s linear infinite; }
@keyframes hl3 { 0.000% { opacity:0 } 62.490% { opacity:0 } 62.500% { opacity:1 } 87.490% { opacity:1 } 87.500% { opacity:0 } 100.000% { opacity:0 } }
@media (prefers-reduced-motion: reduce) { .mob, .mzp, .hl0, .hl1, .hl2, .hl3 { animation: none; } }
