<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Molekuly z různých atomů: molekula vody H2O ze 2 atomů vodíku a 1 atomu kyslíku, molekula oxidu uhličitého CO2 z 1 atomu uhlíku a 2 atomů kyslíku a molekula chlorovodíku HCl z 1 atomu chloru a 1 atomu vodíku. Animace: atomy se k sobě přiblíží a spojí do molekuly.">
<style>
@keyframes s00 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(0px,-46px); } 90%,100% { transform: translate(0,0); } }
.s00 { animation: s00 6s ease-in-out infinite; }
@keyframes s01 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(-39px,24px); } 90%,100% { transform: translate(0,0); } }
.s01 { animation: s01 6s ease-in-out infinite; }
@keyframes s02 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(39px,24px); } 90%,100% { transform: translate(0,0); } }
.s02 { animation: s02 6s ease-in-out infinite; }
@keyframes s10 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(0px,0px); } 90%,100% { transform: translate(0,0); } }
.s10 { animation: s10 6s ease-in-out infinite; }
@keyframes s11 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(-46px,0px); } 90%,100% { transform: translate(0,0); } }
.s11 { animation: s11 6s ease-in-out infinite; }
@keyframes s12 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(46px,0px); } 90%,100% { transform: translate(0,0); } }
.s12 { animation: s12 6s ease-in-out infinite; }
@keyframes s20 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(0px,0px); } 90%,100% { transform: translate(0,0); } }
.s20 { animation: s20 6s ease-in-out infinite; }
@keyframes s21 { 0%,30% { transform: translate(0,0); } 50%,62% { transform: translate(39px,24px); } 90%,100% { transform: translate(0,0); } }
.s21 { animation: s21 6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
/* Předloha: molekuly H2O, CO2 a HCl jako spojené koule s popisky atomů.
   Animace (6 s): hotová molekula se rozdělí na atomy a ty se znovu spojí; bez animace = hotová molekula. */
</style>
<defs><radialGradient id="gH" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#f7f8fa"/><stop offset="0.16" stop-color="#f1f3f5"/><stop offset="0.78" stop-color="#f1f3f5"/><stop offset="1" stop-color="#adb5bd"/></radialGradient><radialGradient id="gO" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#e78d8d"/><stop offset="0.16" stop-color="#d32f2f"/><stop offset="0.78" stop-color="#d32f2f"/><stop offset="1" stop-color="#891f1f"/></radialGradient><radialGradient id="gC" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#8f9396"/><stop offset="0.16" stop-color="#343a40"/><stop offset="0.78" stop-color="#343a40"/><stop offset="1" stop-color="#22262a"/></radialGradient><radialGradient id="gN" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#93a5eb"/><stop offset="0.16" stop-color="#3b5bdb"/><stop offset="0.78" stop-color="#3b5bdb"/><stop offset="1" stop-color="#263b8e"/></radialGradient><radialGradient id="gCl" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#acebb7"/><stop offset="0.16" stop-color="#69db7c"/><stop offset="0.78" stop-color="#69db7c"/><stop offset="1" stop-color="#448e51"/></radialGradient><radialGradient id="gNa" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#b09af2"/><stop offset="0.16" stop-color="#7048e8"/><stop offset="0.78" stop-color="#7048e8"/><stop offset="1" stop-color="#492f97"/></radialGradient><radialGradient id="gHe" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#fddf80"/><stop offset="0.16" stop-color="#fcc419"/><stop offset="0.78" stop-color="#fcc419"/><stop offset="1" stop-color="#a47f10"/></radialGradient><radialGradient id="gP" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#fbab77"/><stop offset="0.16" stop-color="#f76707"/><stop offset="0.78" stop-color="#f76707"/><stop offset="1" stop-color="#a14305"/></radialGradient></defs>
<rect x="3" y="3" width="954" height="464" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/><text x="480.0" y="44" font-size="28" fill="#212529" text-anchor="middle" font-weight="bold">Molekuly z různých atomů</text><text x="480.0" y="78" font-size="20" fill="#495057" text-anchor="middle">Molekuly vznikají spojením dvou a více atomů.</text><g class="s00"><circle cx="160.0" cy="218.0" r="56.0" fill="url(#gO)" stroke="#6a1818" stroke-width="1.5"/><text x="160.0" y="229.9" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="bold">O</text></g><g class="s01"><circle cx="108.0" cy="262.0" r="36.0" fill="url(#gH)" stroke="#868e96" stroke-width="1.5"/><text x="108.0" y="269.7" font-size="22" fill="#212529" text-anchor="middle" font-weight="bold">H</text></g><g class="s02"><circle cx="212.0" cy="262.0" r="36.0" fill="url(#gH)" stroke="#868e96" stroke-width="1.5"/><text x="212.0" y="269.7" font-size="22" fill="#212529" text-anchor="middle" font-weight="bold">H</text></g><text x="160" y="360" font-size="21" fill="#212529" text-anchor="middle" font-weight="bold">molekula vody H<tspan font-size="14" dy="6">2</tspan><tspan dy="-6">O</tspan></text><text x="160" y="390" font-size="20" fill="#495057" text-anchor="middle">2 atomy H + 1 atom O</text><g class="s10"><circle cx="480.0" cy="230.0" r="47.5" fill="url(#gC)" stroke="#1a1d20" stroke-width="1.5"/><text x="480.0" y="240.2" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="bold">C</text></g><g class="s11"><circle cx="417.3" cy="230.0" r="45.599999999999994" fill="url(#gO)" stroke="#6a1818" stroke-width="1.5"/><text x="417.3" y="239.8" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">O</text></g><g class="s12"><circle cx="542.7" cy="230.0" r="45.599999999999994" fill="url(#gO)" stroke="#6a1818" stroke-width="1.5"/><text x="542.7" y="239.8" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold">O</text></g><text x="480" y="360" font-size="21" fill="#212529" text-anchor="middle" font-weight="bold">molekula oxidu</text><text x="480" y="390" font-size="21" fill="#212529" text-anchor="middle" font-weight="bold">uhličitého CO<tspan font-size="14" dy="6">2</tspan></text><text x="480" y="420" font-size="20" fill="#495057" text-anchor="middle">1 atom C + 2 atomy O</text><g class="s20"><circle cx="800.0" cy="230.0" r="64.0" fill="url(#gCl)" stroke="#346e3e" stroke-width="1.5"/><text x="786.0" y="233.9" font-size="34" fill="#212529" text-anchor="middle" font-weight="bold">Cl</text></g><g class="s21"><circle cx="850.0" cy="260.0" r="30.0" fill="url(#gH)" stroke="#868e96" stroke-width="1.5"/><text x="850.0" y="266.6" font-size="19" fill="#212529" text-anchor="middle" font-weight="bold">H</text></g><text x="800" y="360" font-size="21" fill="#212529" text-anchor="middle" font-weight="bold">molekula</text><text x="800" y="390" font-size="21" fill="#212529" text-anchor="middle" font-weight="bold">chlorovodíku HCl</text><text x="800" y="420" font-size="20" fill="#495057" text-anchor="middle">1 atom Cl + 1 atom H</text>
</svg>
