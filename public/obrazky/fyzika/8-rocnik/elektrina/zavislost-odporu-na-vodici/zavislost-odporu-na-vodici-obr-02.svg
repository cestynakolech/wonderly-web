<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dva měděné dráty stejné délky s průhledem dovnitř: tenký a tlustý. Uvnitř jsou šedé atomy mřížky a modré volné elektrony. V tenkém drátu mají elektrony jen jednu úzkou cestičku mezi atomy – mají málo místa, drát má větší odpor. V tlustém drátu vedou vedle sebe tři cestičky – elektrony mají víc místa, drát má menší odpor. Na konci každého drátu je vidět jeho příčný řez: malý a velký. Animace: elektrony se pohybují od záporné svorky ke kladné.">
<style>
/* Předloha: PDF lekce 26, s. 1 (tloušťka vodiče: čím je vodič tenčí, tím méně prostoru elektrony k pohybu mají;
   čím tenčí vodič, tím větší odpor). Obrázek v PDF chybí, děj nakreslen podle textu.
   Elektrony letí stejnou rychlostí 6 s celou délkou drátu; tenký drát má 1 cestičku, tlustý 3.
   Bez animace (reduced-motion) = elektrony stojí rozmístěné v cestičkách. */
@keyframes t0 { 0% { transform: translate(74px, 190px); } 100% { transform: translate(456px, 190px); } }
.t0 { animation: t0 6s linear infinite; }
@keyframes s0 { 0% { transform: translate(74px, 398px); } 100% { transform: translate(456px, 398px); } }
.s0 { animation: s0 6s linear infinite; }
@keyframes s1 { 0% { transform: translate(74px, 450px); } 100% { transform: translate(456px, 450px); } }
.s1 { animation: s1 6s linear infinite; }
@keyframes s2 { 0% { transform: translate(74px, 502px); } 100% { transform: translate(456px, 502px); } }
.s2 { animation: s2 6s linear infinite; }
@media (prefers-reduced-motion: reduce) { .t0, .s0, .s1, .s2 { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="684" rx="14" fill="#f8f9fa"/>

