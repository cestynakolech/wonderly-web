<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Řešený příklad v sešitě: 5 m³ dřeva váží 3 500 kg. Zápis m = 3 500 kg, V = 5 m³, ρ = ? v kg/m³. Výpočet ρ = m : V = 3 500 kg : 5 m³ = 700 kg/m³. Vpravo jiný způsob: pět dřevěných krychlí po 1 m³ váží 3 500 kg, jedna krychle sjede na váhu a ta ukáže 3 500 kg : 5 = 700 kg.">
<style>
/* Předloha: PDF Hustota — ručně psaný „Příklad 1“ ve čtverečkovaném sešitě: 5 m³ dřeva váží 3,5 t; zápis m = 3 500 kg, V = 5 m³,
   ρ = ? (kg/m³); ρ = m/V nebo ρ = m:V; ρ = 3 500 kg : 5 m³ = 700 kg/m³; „Jiný způsob řešení“ 5 m³ … 3 500 kg, 1 m³ … ? kg, :5.
   Překresleno, ne kopie; tuny vynechány (rovnou 3 500 kg, celá čísla). Cyklus 10 s: 10–35 % jedna krychle 1 m³ sjede na váhu,
   38 % „1 m³ … ? kg“, 50 % displej 700 kg a „3 500 kg : 5 = 700 kg“. Bez animace = koncový stav. */
@keyframes kus { 0%, 10% { transform: translate(-40px, -260px); } 22% { transform: translate(-46px, -140px); } 35%, 92% { transform: translate(0, 0); } 100% { transform: translate(-40px, -260px); } }
@keyframes txt1 { 0%, 36% { opacity: 0; } 40%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
@keyframes txt2 { 0%, 48% { opacity: 0; } 52%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
@keyframes v1 { 0%, 48% { opacity: 0; } 50%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
@keyframes v0 { 0%, 48% { opacity: 1; } 50%, 92% { opacity: 0; } 96%, 100% { opacity: 1; } }
.kus { animation: kus 10s ease-in-out infinite; } .txt1 { animation: txt1 10s linear infinite; } .txt2 { animation: txt2 10s linear infinite; }
.v1 { animation: v1 10s linear infinite; } .v0 { animation: v0 10s linear infinite; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .kus, .txt1, .txt2, .v1, .v0 { animation: none; } }
</style>
<defs>
<pattern id="mrizka" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#d0ebff" stroke-width="1.2"/></pattern>
<linearGradient id="p-dr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9b77a"/><stop offset="1" stop-color="#c98a45"/></linearGradient><linearGradient id="b-dr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a86a2c"/><stop offset="1" stop-color="#7f4d1c"/></linearGradient><linearGradient id="v-dr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3d2a2"/><stop offset="1" stop-color="#e2ad6c"/></linearGradient>
</defs>
