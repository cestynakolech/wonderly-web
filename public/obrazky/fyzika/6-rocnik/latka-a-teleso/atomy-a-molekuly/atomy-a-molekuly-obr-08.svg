<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vzduch je směs. V oblaku jsou smíchané různé molekuly: nejvíc molekul dusíku N2, dále molekuly kyslíku O2, oxidu uhličitého CO2, vody H2O a vodíku H2. Animace: molekuly plynu se neustále pohybují.">
<style>
@keyframes k1 { 0%,100% { transform: translate(0,0) rotate(0); } 25% { transform: translate(12px,-5px) rotate(8deg); } 50% { transform: translate(-4px,12px) rotate(-6deg); } 75% { transform: translate(-12px,-3px) rotate(4deg); } }
@keyframes k2 { 0%,100% { transform: translate(0,0) rotate(0); } 30% { transform: translate(-11px,11px) rotate(-8deg); } 60% { transform: translate(11px,4px) rotate(6deg); } 80% { transform: translate(3px,-12px) rotate(-3deg); } }
@keyframes k3 { 0%,100% { transform: translate(0,0) rotate(0); } 20% { transform: translate(5px,12px) rotate(6deg); } 55% { transform: translate(-12px,-4px) rotate(-8deg); } 85% { transform: translate(4px,-11px) rotate(3deg); } }
.k1, .k2, .k3 { transform-box: fill-box; transform-origin: center; }
.k1 { animation: k1 3s ease-in-out infinite; } .k2 { animation: k2 4s ease-in-out infinite; } .k3 { animation: k3 5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
/* Předloha: vzduch jako směs (oblak s molekulami O2, CO2, N2, H2O a H2).
   Dusíku je ve vzduchu nejvíc, proto je molekul N2 nakresleno nejvíc. Animace: molekuly plynu se pohybují. */
</style>
