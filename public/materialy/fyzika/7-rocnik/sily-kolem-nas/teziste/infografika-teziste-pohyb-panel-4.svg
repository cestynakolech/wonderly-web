<svg viewBox="0 0 460 420" width="460" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Těžiště v pohybu 4/4, Provazochodec s tyčí: díváme se podél lana, lano vidíme jako kroužek pod chodidly a tyč drží napříč přes lano. Provazochodec se nakloní, svislice z těžiště celku provazochodec s tyčí mine lano a spadl by. Posune tyč na druhou stranu, svislice z těžiště celku zase prochází lanem, a pak se i s tyčí narovná." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Těžiště v pohybu 4/4: Provazochodec s tyčí</title>
	<!-- W74 OPRAVA 1 (14. 10. 2026): pohled PODÉL lana (lano = průřez pod chodidly), tyč napříč přes lano.
	     T člověka 80 px, tyč 95 px nad chodidly, podíl tyče 1/4 => T celku 83,75 px. Náklon 16° => T celku −23,08 / +3,24 px;
	     posun tyče S = 96,06 px => T celku 0,00 / −3,38 px (zase přesně nad lanem). Animace jen CSS transform/opacity. -->
	<style>
		.p4-nak { transform: rotate(-16deg); animation: p4-nak 8s ease-in-out infinite; }
		@keyframes p4-nak { 0% { transform: rotate(0deg); } 10% { transform: rotate(0deg); } 24% { transform: rotate(-16deg); } 64% { transform: rotate(-16deg); } 80% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }
		.p4-tyc { transform: translateX(96.06px); animation: p4-tyc 8s ease-in-out infinite; }
		@keyframes p4-tyc { 0% { transform: translateX(0px); } 36% { transform: translateX(0px); } 52% { transform: translateX(96.06px); } 64% { transform: translateX(96.06px); } 80% { transform: translateX(0px); } 100% { transform: translateX(0px); } }
		.p4-t { transform: translate(0px, -3.38px); animation: p4-t 8s ease-in-out infinite; }
		@keyframes p4-t { 0% { transform: translate(0px, 0px); } 10% { transform: translate(0px, 0px); } 24% { transform: translate(-23.08px, 3.24px); } 36% { transform: translate(-23.08px, 3.24px); } 52% { transform: translate(0px, -3.38px); } 64% { transform: translate(0px, -3.38px); } 80% { transform: translate(0px, 0px); } 100% { transform: translate(0px, 0px); } }
		.p4k0 { opacity: 0; animation: p4k0 8s linear infinite; }
		@keyframes p4k0 { 0% { opacity: 1; } 9% { opacity: 1; } 10% { opacity: 0; } 99% { opacity: 0; } 100% { opacity: 1; } }
		.p4k1 { opacity: 0; animation: p4k1 8s linear infinite; }
		@keyframes p4k1 { 0% { opacity: 0; } 9% { opacity: 0; } 10% { opacity: 1; } 35% { opacity: 1; } 36% { opacity: 0; } 100% { opacity: 0; } }
		.p4k2 { opacity: 1; animation: p4k2 8s linear infinite; }
		@keyframes p4k2 { 0% { opacity: 0; } 35% { opacity: 0; } 36% { opacity: 1; } 63% { opacity: 1; } 64% { opacity: 0; } 100% { opacity: 0; } }
		.p4k3 { opacity: 0; animation: p4k3 8s linear infinite; }
		@keyframes p4k3 { 0% { opacity: 0; } 63% { opacity: 0; } 64% { opacity: 1; } 100% { opacity: 1; } }
		.p4-pozor { opacity: 0; animation: p4-pozor 8s linear infinite; }
		@keyframes p4-pozor { 0% { opacity: 0; } 20% { opacity: 0; } 24% { opacity: 1; } 36% { opacity: 1; } 42% { opacity: 0; } 100% { opacity: 0; } }
		.p4-ok { opacity: 1; animation: p4-ok 8s linear infinite; }
		@keyframes p4-ok { 0% { opacity: 1; } 10% { opacity: 1; } 20% { opacity: 0; } 46% { opacity: 0; } 52% { opacity: 1; } 100% { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) {
			.p4-nak, .p4-tyc, .p4-t, .p4-pozor, .p4-ok, .p4k0, .p4k1, .p4k2, .p4k3 { animation: none; }
		}
	</style>
	<defs>
		<!-- samotná značka těžiště (bez šipky): počátek = T -->
		<g id="d-x">
			<circle r="9" fill="#fbfaf6" fill-opacity="0.85" stroke="#c92a2a" stroke-width="2" />
			<path d="M -6 -6 L 6 6 M 6 -6 L -6 6" stroke="#2b2a26" stroke-width="2.5" />
		</g>
	</defs>
	<rect x="0" y="0" width="460" height="420" fill="#f8f9fa" />
	<g id="panel-4">
		<rect x="26" y="22" width="420" height="384" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="384" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">4</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Provazochodec s tyčí</text>
		<text class="p4k0" x="230" y="100" text-anchor="middle" font-size="21" font-weight="bold" fill="#5f3dc4">svislice z T vede lanem</text>
		<text class="p4k1" x="230" y="100" text-anchor="middle" font-size="21" font-weight="bold" fill="#5f3dc4">nakloní se: svislice mine lano</text>
		<text class="p4k2" x="230" y="100" text-anchor="middle" font-size="21" font-weight="bold" fill="#5f3dc4">posune tyč: svislice zase lanem</text>
		<text class="p4k3" x="230" y="100" text-anchor="middle" font-size="21" font-weight="bold" fill="#5f3dc4">narovná se i s tyčí</text>
		<!-- provazochodec čelem k nám, otáčí se kolem chodidel na laně (230,312) -->
		<g transform="translate(230,312)"><g class="p4-nak">
			<path d="M -3 -4 L -9 -50 M 3 -4 L 9 -50" stroke="#364fc7" stroke-width="9" stroke-linecap="round" />
			<ellipse cx="0" cy="-3" rx="11" ry="4" fill="#2b2a26" />
			<rect x="-14" y="-104" width="28" height="58" rx="10" fill="#f76707" stroke="#2b2a26" stroke-width="2.5" />
			<circle cx="0" cy="-120" r="15" fill="#f1c9a5" stroke="#2b2a26" stroke-width="2.5" />
			<path d="M -15 -124 A 15 15 0 0 1 15 -124 Z" fill="#5c3d2e" />
			<!-- tyč napříč přes lano: posouvá se rukama do strany -->
			<g class="p4-tyc">
				<rect x="-130" y="-98" width="260" height="6" rx="3" fill="#495057" stroke="#2b2a26" stroke-width="1.5" />
				<circle cx="-130" cy="-95" r="6" fill="#495057" stroke="#2b2a26" stroke-width="1.5" />
				<circle cx="130" cy="-95" r="6" fill="#495057" stroke="#2b2a26" stroke-width="1.5" />
			</g>
			<path d="M -12 -98 L -28 -95 M 12 -98 L 28 -95" stroke="#f76707" stroke-width="8" stroke-linecap="round" />
			<circle cx="-28" cy="-95" r="6" fill="#f1c9a5" stroke="#2b2a26" stroke-width="2" />
			<circle cx="28" cy="-95" r="6" fill="#f1c9a5" stroke="#2b2a26" stroke-width="2" />
		</g></g>
		<!-- lano v průřezu (díváme se podél něj) -->
		<circle cx="230" cy="321" r="9" fill="#8d5a2b" stroke="#2b2a26" stroke-width="2" />
		<path d="M 224 316 L 236 326 M 223 322 L 231 329 M 229 313 L 237 320" stroke="#c4925a" stroke-width="2" />
		<!-- těžiště celku člověk + tyč a jeho svislice -->
		<g transform="translate(230,228.25)"><g class="p4-t">
			<line x1="0" y1="0" x2="0" y2="128" stroke="#5f3dc4" stroke-width="3.5" stroke-dasharray="6 4" />
			<use href="#d-x" />
			<text x="14" y="26" font-size="22" font-weight="bold" fill="#2b2a26" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">T</text>
		</g></g>
		<text x="262" y="334" font-size="20" font-weight="bold" fill="#8d5a2b">← lano</text>
		<text class="p4-pozor" x="122" y="350" text-anchor="middle" font-size="20" font-weight="bold" fill="#c92a2a">mimo lano:</text>
		<text class="p4-pozor" x="122" y="372" text-anchor="middle" font-size="20" font-weight="bold" fill="#c92a2a">spadl by!</text>
		<text class="p4-ok" x="345" y="364" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e7a34">nad lanem</text>
		<text x="230" y="394" text-anchor="middle" font-size="20" fill="#2b2a26">díváme se podél lana · T = těžiště celku</text>
	</g>
</svg>
