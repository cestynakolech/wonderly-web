<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 585" width="460" height="585" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Účinnost v kuchyni: energie jde ze zásuvky kabelem do plotny. Užitečná část ohřeje jídlo v hrnci, část uteče do kuchyně a je to ztráta. Účinnost η = P : P₀, účinnost = výkon : příkon. Uniklá energie nezmizí, ohřeje vzduch v kuchyni, vařit s ní už nemůžeme.">
	<title>Hospodaření s teplem 1/4: Účinnost v kuchyni</title>
