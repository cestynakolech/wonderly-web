<text x="480" y="59" font-size="28" fill="#212529" text-anchor="middle">Příklad: hustota dřeva</text>
<rect x="30" y="96" width="450" height="540" rx="6" fill="url(#mrizka)" stroke="#adb5bd" stroke-width="2"/><rect x="30" y="96" width="450" height="540" rx="6" fill="none" stroke="#adb5bd" stroke-width="2"/><text x="50" y="134" font-size="24" fill="#c92a2a" font-weight="bold">Příklad</text>
<text x="50" y="168" font-size="22" fill="#212529" >Urči hustotu dřeva, jestliže</text>
<text x="50" y="196" font-size="22" fill="#212529" >5 m³ dřeva váží 3 500 kg.</text>
<rect x="46" y="214" width="84" height="32" rx="4" fill="#d8f5a2"/><text x="52" y="238" font-size="22" fill="#237032" font-weight="bold">Zápis:</text>
<text x="70" y="280" font-size="26" fill="#1864ab" >m = 3 500 kg</text>
<text x="70" y="316" font-size="26" fill="#1864ab" >V = 5 m³</text>
<text x="70" y="352" font-size="26" fill="#1864ab" >ρ = ? (kg/m³)</text>
<path d="M50 368H440" stroke="#1864ab" stroke-width="2.5"/><text x="70" y="412" font-size="26" fill="#1864ab" >ρ = m : V</text>
<text x="70" y="460" font-size="26" fill="#1864ab" >ρ = 3 500 kg : 5 m³</text>
<text x="70" y="508" font-size="30" fill="#1864ab" font-weight="bold">ρ = 700 kg/m³</text>
<path d="M70 520H290M70 527H290" stroke="#1864ab" stroke-width="2.5"/><text x="50" y="574" font-size="22" fill="#212529" >Hustota dřeva je 700 kg/m³:</text>
<text x="50" y="604" font-size="22" fill="#212529" >1 m³ dřeva váží 700 kg.</text>
