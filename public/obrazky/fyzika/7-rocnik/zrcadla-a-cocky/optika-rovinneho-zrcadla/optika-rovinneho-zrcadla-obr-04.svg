<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Periskop ponorky. Ponorka je pod hladinou, z ní vede nad hladinu trubice periskopu se dvěma rovinnými zrcadly skloněnými o 45 stupňů. Světlo od stromu na břehu vstoupí do horního otvoru, odrazí se na horním zrcadle dolů, na dolním zrcadle se odrazí vodorovně a přijde do oka pozorovatele v ponorce. Animace: světlo postupně proběhne periskopem od stromu až do oka.">
<style>
/* Animace (8 s, smyčka) podle předlohy (PDF lekce 22 Rovinné zrcadlo, str. 8 — periskop, strom, dvě zrcadla „a“):
   osa světla se kreslí od stromu k oku (5–50 %), šipky se objeví, když je čára mine, pak putuje světelný záblesk (55–95 %).
   Odraz na zrcadlech skloněných o 45°: vodorovný paprsek → svislý → vodorovný (zákon odrazu).
   Bez animace (prefers-reduced-motion) = koncový stav: celá cesta světla se šipkami, záblesk skrytý. */
.osa { stroke-dasharray: 100; animation: osa 8s linear infinite; }
.s1 { animation: s1 8s linear infinite; }
.s2 { animation: s2 8s linear infinite; }
.s3 { animation: s3 8s linear infinite; }
.svazek { animation: svazek 8s linear infinite; }
.puls { stroke-dasharray: 8 192; animation: puls 8s linear infinite; }
.celek { animation: celek 8s linear infinite; }
@keyframes osa { 0%, 5% { stroke-dashoffset: 100; } 50%, 100% { stroke-dashoffset: 0; } }
@keyframes s1 { 0%, 15% { opacity: 0; } 16%, 100% { opacity: 1; } }
@keyframes s2 { 0%, 31% { opacity: 0; } 32%, 100% { opacity: 1; } }
@keyframes s3 { 0%, 46% { opacity: 0; } 47%, 100% { opacity: 1; } }
@keyframes svazek { 0%, 5% { opacity: 0; } 50%, 100% { opacity: 1; } }
@keyframes puls { 0%, 55% { stroke-dashoffset: 8; opacity: 1; } 94% { stroke-dashoffset: -92; opacity: 1; } 95%, 100% { stroke-dashoffset: -92; opacity: 0; } }
@keyframes celek { 0%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .osa, .s1, .s2, .s3, .svazek, .celek { animation: none; } .puls { animation: none; display: none; } }
</style>
<defs>
<clipPath id="z4ram"><rect x="3" y="3" width="594" height="554" rx="14"/></clipPath>
</defs>
<g clip-path="url(#z4ram)">
<rect x="0" y="0" width="600" height="200" fill="#e7f5ff"/>
<rect x="0" y="200" width="600" height="360" fill="#a5d8ff"/>
<path d="M0,200 Q15,193 30,200 T60,200 T90,200 T120,200 T150,200 T180,200 T210,200 T240,200 T270,200 T300,200 T330,200 T360,200 T390,200 T420,200 T450,200 T480,200 T510,200 T540,200 T570,200 T600,200" fill="none" stroke="#1971c2" stroke-width="2.5"/>
<!-- břeh se stromem -->
<path d="M0,190 Q60,178 120,186 Q150,192 165,201 L0,201 Z" fill="#8ce99a" stroke="#2f9e44" stroke-width="2"/>
<rect x="63" y="148" width="11" height="40" fill="#795548"/>
<ellipse cx="68" cy="128" rx="23" ry="34" fill="#2f9e44" stroke="#2b8a3e" stroke-width="2"/>
<!-- ponorka pod hladinou -->
<rect x="250" y="372" width="280" height="110" rx="16" fill="#adb5bd"/>
<rect x="120" y="468" width="500" height="80" rx="40" fill="#adb5bd"/>
<text x="480" y="524" font-size="22" text-anchor="middle" fill="#212529" font-weight="bold">ponorka</text>
</g>
<rect x="3" y="3" width="594" height="554" rx="14" fill="none" stroke="#2b2a26" stroke-width="3"/>

<text x="440" y="40" font-size="22" text-anchor="middle" fill="#2b2a26" font-weight="bold">periskop ponorky</text>
<text x="590" y="186" font-size="22" text-anchor="end" fill="#1864ab">hladina</text>

<!-- trubice periskopu -->
<path d="M245,105 H300 L360,165 V410 H415 V470 H360 L300,410 V165 H245 Z" fill="#f8f9fa"/>
<g class="celek">
<path class="svazek" d="M95,115 H310 L350,155 V420 H415 V460 H350 L310,420 V155 H95 Z" fill="#ffe066" opacity="1" fill-opacity="0.55"/>
<path class="osa" pathLength="100" d="M95,135 H330 V440 H448" fill="none" stroke="#e8590c" stroke-width="3" stroke-linejoin="round"/>
<polygon class="s1" points="214,135 200,128 200,142" fill="#e8590c"/>
<polygon class="s2" points="330,292 323,278 337,278" fill="#e8590c"/>
<polygon class="s3" points="398,440 384,433 384,447" fill="#e8590c"/>
<path class="puls" pathLength="100" d="M95,135 H330 V440 H448" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0"/>
</g>
<g fill="none" stroke="#212529" stroke-width="4" stroke-linecap="round">
<path d="M245,105 H300"/><path d="M245,165 H300 V410"/><path d="M360,165 V410 H415"/><path d="M360,470 H415"/>
</g>
<!-- zrcadla skloněná o 45°, šrafy na zadní straně -->
<g>
<line x1="300" y1="105" x2="360" y2="165" stroke="#5f3dc4" stroke-width="6" stroke-linecap="round"/>
<g stroke="#9775fa" stroke-width="2"><line x1="310" y1="115" x2="318" y2="107"/><line x1="322" y1="127" x2="330" y2="119"/><line x1="334" y1="139" x2="342" y2="131"/><line x1="346" y1="151" x2="354" y2="143"/></g>
<line x1="300" y1="410" x2="360" y2="470" stroke="#5f3dc4" stroke-width="6" stroke-linecap="round"/>
<g stroke="#9775fa" stroke-width="2"><line x1="306" y1="424" x2="298" y2="432"/><line x1="318" y1="436" x2="310" y2="444"/><line x1="330" y1="448" x2="322" y2="456"/><line x1="342" y1="460" x2="334" y2="468"/></g>
</g>
<g font-size="22" fill="#5f3dc4" font-weight="bold">
<text x="372" y="128">zrcadlo</text>
<text x="240" y="432" text-anchor="end">zrcadlo</text>
</g>
<line x1="244" y1="425" x2="304" y2="418" stroke="#5f3dc4" stroke-width="2.5" stroke-linecap="round"/>

<!-- oko pozorovatele v ponorce (dívá se doleva do periskopu) -->
<g transform="translate(474 440)">
<path d="M-24,0 Q0,-17 24,0 Q0,17 -24,0 Z" fill="#ffffff" stroke="#212529" stroke-width="2.5"/>
