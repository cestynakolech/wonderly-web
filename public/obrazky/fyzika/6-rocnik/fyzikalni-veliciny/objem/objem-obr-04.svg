<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: skleněný odměrný válec s hubičkou a podstavcem stojí na vodorovné podložce. Z kádinky se do něj opatrně vlévá kapalina a hladina stoupá. Na stupnici jsou mililitry, rozsah je 250 ml a nejmenší dílek 5 ml.">
<style>
/* Předloha: PDF Objem — fotografie skleněného odměrného válce 250 ml (hubička, podstavec, stupnice po 50 ml, dílek 5 ml). Překresleno, ne kopie.
   Cyklus 8 s: 0–6 % prázdný válec, 6–50 % opatrně vlijeme kapalinu z kádinky, hladina stoupá, pak se ustálí.
   Bez animace = koncový stav (kapalina ve válci, kádinka skrytá). */
@keyframes hl { 0%, 6% { transform: translate(0, 258px); } 50%, 96% { transform: translate(0, 0); } 100% { transform: translate(0, 258px); } }
@keyframes kad { 0%, 3% { opacity: 0; } 6%, 50% { opacity: 1; } 54%, 100% { opacity: 0; } }
.hl { animation: hl 8s ease-out infinite; }
.kad { opacity: 0; animation: kad 8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .hl, .kad { animation: none; } }
</style>
<defs>
<linearGradient id="sklo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ced4da" stop-opacity="0.9"/><stop offset="0.15" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="0.8" stop-color="#e9ecef" stop-opacity="0.5"/><stop offset="1" stop-color="#adb5bd" stop-opacity="0.9"/></linearGradient>
<linearGradient id="voda" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#74c0fc"/><stop offset="0.4" stop-color="#a5d8ff"/><stop offset="1" stop-color="#74c0fc"/></linearGradient>
<clipPath id="vnitrek"><rect x="290" y="40" width="140" height="560"/></clipPath>
</defs>
