<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica, Arial, sans-serif">
<title>Hadice a nádoba s trubicemi</title>
<defs>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
<marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
</defs>
<rect width="960" height="560" fill="#ffffff"/>
<rect x="30.0" y="14" width="900" height="64" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="2.5" />
<text x="480" y="40.5" font-size="20" text-anchor="middle" font-weight="normal" fill="#212529">Působením vnější tlakové síly na povrch kapaliny v uzavřené nádobě</text>
<text x="480" y="65.5" font-size="20" text-anchor="middle" font-weight="normal" fill="#212529">vznikne ve všech místech kapaliny stejný tlak</text><line x1="40" y1="470" x2="420" y2="470" stroke="#2f9e44" stroke-width="6" /><circle cx="130" cy="250" r="28" fill="#ffe8cc" stroke="#212529" stroke-width="3"/><line x1="130" y1="278" x2="130" y2="380" stroke="#212529" stroke-width="5" /><line x1="130" y1="380" x2="100" y2="470" stroke="#212529" stroke-width="5" /><line x1="130" y1="380" x2="165" y2="470" stroke="#212529" stroke-width="5" /><line x1="130" y1="300" x2="200" y2="340" stroke="#212529" stroke-width="5" /><path d="M200,340 q40,20 70,-10" fill="none" stroke="#f59f00" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><path d="M270,330 q70,-40 140,140" fill="none" stroke="#339af0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/><text x="230" y="520.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#212529">chlapec stříká vodou z hadice</text><line x1="520" y1="470" x2="950" y2="470" stroke="#2f9e44" stroke-width="6" /><rect x="540" y="360" width="240" height="110" rx="0" fill="#a5d8ff" stroke="none" stroke-width="0" /><rect x="780" y="390" width="70" height="60" rx="0" fill="#a5d8ff" stroke="none" stroke-width="0" /><rect x="555" y="235" width="20" height="125" rx="0" fill="#a5d8ff" stroke="none" stroke-width="0" /><rect x="620" y="235" width="20" height="125" rx="0" fill="#a5d8ff" stroke="none" stroke-width="0" /><rect x="685" y="235" width="20" height="125" rx="0" fill="#a5d8ff" stroke="none" stroke-width="0" /><rect x="745" y="235" width="20" height="125" rx="0" fill="#a5d8ff" stroke="none" stroke-width="0" /><path d="M540,360 V470 H780 V450 H880 M780,390 H880 M780,390 V360" fill="none" stroke="#495057" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M540,360 H555 M575,360 H620 M640,360 H685 M705,360 H745 M765,360 H780" fill="none" stroke="#495057" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M555,200 V360 M575,200 V360" fill="none" stroke="#495057" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M620,200 V360 M640,200 V360" fill="none" stroke="#495057" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M685,200 V360 M705,200 V360" fill="none" stroke="#495057" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M745,200 V360 M765,200 V360" fill="none" stroke="#495057" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="545" y1="235" x2="775" y2="235" stroke="#e03131" stroke-width="3" stroke-dasharray="8 5"/><rect x="850" y="386" width="16" height="68" rx="0" fill="#d9a066" stroke="#8a5a2b" stroke-width="3" /><line x1="866" y1="420" x2="902" y2="420" stroke="#212529" stroke-width="8" /><rect x="902" y="392" width="44" height="56" rx="14" fill="#ffe8cc" stroke="#212529" stroke-width="3" /><line x1="924" y1="392" x2="924" y2="448" stroke="#212529" stroke-width="2" /><line x1="935" y1="392" x2="935" y2="448" stroke="#212529" stroke-width="2" /><line x1="946" y1="370" x2="886" y2="370" stroke="#212529" stroke-width="5" marker-end="url(#ahk)"/><text x="892" y="505.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#212529">ruka tlačí</text>
<text x="892" y="527.5" font-size="18" text-anchor="middle" font-weight="normal" fill="#212529">na píst</text><text x="660" y="185.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#212529">hladina je všude stejně vysoko</text><text x="660" y="520.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#212529">kapalina v nádobě s trubicemi</text>
</svg>
