<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Aneroid zevnitř: pružná plechová krabička je spojená s ručičkou. Když tlak vzduchu klesá, krabička se roztáhne a ručička se posune k nápisu déšť – počasí se kazí. Když tlak stoupá, krabička se stlačí a ručička se posune k nápisu jasno. Rychlý pokles o víc než 10 hPa za pár hodin varuje před vichřicí. Animace: krabička se střídavě roztahuje a stlačuje a ručička se otáčí.">
<style>
/* Předloha: PDF lekce 18, str. 5–6 (barometr obsahuje aneroid – plechovou krabičku, která se při změně tlaku prohýbá
   a posunuje ručičkou na stupnici; změny tlaku přinášejí změny počasí). Pozn.: vnější pohled na aneroid a barograf
   je v obrázku podtématu atmosfericky-tlak (obr-03) – tady je NOVĚ vnitřek a souvislost s počasím.
   10 s: 0–8 % normální tlak, 8–30 % tlak klesá (krabička 1 → 1,5, táhlo −15 px, ručička 0° → −40°), drží do 48 %,
   48–70 % tlak stoupá (krabička → 0,7, táhlo +9 px, ručička → +40°), drží do 88 %, 88–100 % zpět.
   Zvýraznění karty: „klesá“ 18–48 %, „stoupá“ 62–88 %.
   Popisky „déšť“/„jasno“ leží na prodloužení ručičky v krajní poloze ∓40° (165 jedn. od osy 170,250),
   dílky ±40° jsou zvýrazněné. Barvy jako na celé stránce: tlak klesá (k níži N) modře, tlak stoupá (k výši V) červeně,
   ručička černě, déšť tyrkysově.
   Bez animace = koncový stav „tlak klesá“: krabička roztažená, ručička u „déšť“, zvýrazněná horní karta. */
.ru { transform-origin: 170px 250px; transform: rotate(-40deg); animation: ru 10s ease-in-out infinite; }
.kr { transform-origin: 170px 337px; transform: scaleY(1.5); animation: kr 10s ease-in-out infinite; }
.ta { transform: translateY(-15px); animation: ta 10s ease-in-out infinite; }
.zk { animation: zk 10s linear infinite; }
.zs { animation: zs 10s linear infinite; }
@keyframes ru { 0%, 8% { transform: rotate(0deg); } 30%, 48% { transform: rotate(-40deg); } 70%, 88% { transform: rotate(40deg); } 100% { transform: rotate(0deg); } }
@keyframes kr { 0%, 8% { transform: scaleY(1); } 30%, 48% { transform: scaleY(1.5); } 70%, 88% { transform: scaleY(0.7); } 100% { transform: scaleY(1); } }
@keyframes ta { 0%, 8% { transform: translateY(0px); } 30%, 48% { transform: translateY(-15px); } 70%, 88% { transform: translateY(9px); } 100% { transform: translateY(0px); } }
@keyframes zk { 0%, 12% { opacity: 0; } 18%, 48% { opacity: 1; } 54%, 100% { opacity: 0; } }
@keyframes zs { 0%, 56% { opacity: 0; } 62%, 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ru, .kr, .ta, .zk, .zs { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="484" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Aneroid: krabička hýbe ručičkou</text>
<text x="300" y="70" font-size="22" fill="#212529" text-anchor="middle">při změně tlaku se krabička prohne</text>
