<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Slučování jader, fúze. Při teplotě milionů stupňů Celsia letí proti sobě dvě jádra vodíku: jedno z 1 protonu a 1 neutronu, druhé z 1 protonu a 2 neutronů. Spojí se v jádro helia ze 2 protonů a 2 neutronů, vyletí jeden neutron a uvolní se energie. Dole stejný děj jako zápis: vodík plus vodík dá helium, neutron a energii. Ve Slunci, asi 15 milionů stupňů Celsia, se tak vodík mění na helium.">
<style>
/* Předloha: PDF 19 Jaderná energie, s. 3 (slučování: lehčí → těžší, miliony °C, srážka rychlých jader) a s. 4 (Slunce 15 000 000 °C; 3. rovnice 2H + 3H → 4He + n).
   Výklad: § Slučování jader (fúze). Počty kuliček přesné: 2 + 3 = 4 + 1 nukleon, 1 + 1 = 2 + 0 protonů. Obě vstupní jádra jsou vodík (výklad nerozlišuje izotopy).
   Smyčka 6 s: jádra se rozletí proti sobě, spojí se v helium, vyletí neutron a záblesk energie. Bez animace = stav po sloučení + zápis pod scénou. */
.f5d { animation: f5d 6s ease-in infinite; } .f5t { animation: f5t 6s ease-in infinite; }
.f5h { transform-box: view-box; transform-origin: 320px 215px; animation: f5h 6s ease-out infinite; }
.f5z { transform-box: view-box; transform-origin: 320px 215px; animation: f5z 6s ease-out infinite; }
.f5n { animation: f5n 6s ease-out infinite; }
@keyframes f5d { 0% { transform: translate(0px, 0px); opacity: 1; } 30% { transform: translate(182px, 0px); opacity: 1; } 32%, 100% { transform: translate(182px, 0px); opacity: 0; } }
@keyframes f5t { 0% { transform: translate(0px, 0px); opacity: 1; } 30% { transform: translate(-182px, 0px); opacity: 1; } 32%, 100% { transform: translate(-182px, 0px); opacity: 0; } }
@keyframes f5h { 0%, 30% { transform: scale(.6); opacity: 0; } 36% { transform: scale(1); opacity: 1; } 94% { transform: scale(1); opacity: 1; } 98%, 100% { transform: scale(1); opacity: 0; } }
@keyframes f5z { 0%, 30% { transform: scale(.2); opacity: 0; } 37% { transform: scale(1.1); opacity: 1; } 44% { transform: scale(1); opacity: 1; } 94% { transform: scale(1); opacity: 1; } 98%, 100% { transform: scale(1); opacity: 0; } }
@keyframes f5n { 0%, 32% { transform: translate(-220px, -85px); opacity: 0; } 34% { opacity: 1; } 58% { transform: translate(0px, 0px); opacity: 1; } 94% { transform: translate(0px, 0px); opacity: 1; } 98%, 100% { transform: translate(0px, 0px); opacity: 0; } }
.f5nl { animation: f5nl 6s linear infinite; }
@keyframes f5nl { 0%, 56% { opacity: 0; } 61%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
.f5l { animation: f5l 6s linear infinite; }
@keyframes f5l { 0%, 31% { opacity: 0; } 36%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .f5d, .f5t, .f5h, .f5z, .f5n, .f5l, .f5nl { animation: none; } }
</style>
<defs>
<radialGradient id="gz" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3bf"/><stop offset=".55" stop-color="#ffd43b"/><stop offset="1" stop-color="#fab005"/></radialGradient>
