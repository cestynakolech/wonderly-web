<svg viewBox="0 2706 460 346" width="460" height="346" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Energie jako veličina: značka E, jednotka joule (J), stejné jednotky jako práce, u elektřiny i Wh a kWh (elektroměr)." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Energie a její přeměny 5/5: Energie jako veličina</title>
	<!-- Panel 5/5 výřezu z infografika-energie-a-jeji-premeny.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.kot { animation: kot 2s linear infinite; }
		@keyframes kot { from { transform: translateX(-22px); } to { transform: translateX(22px); } }
		@media (prefers-reduced-motion: reduce) {
			.kot { animation: none; }
		}
	</style>
	<rect x="0" y="2706" width="460" height="346" fill="#f3f1ea" />
	<g id="panel-5">
	<!-- ===== Panel 5: Energie jako veličina ===== -->
	<rect x="26" y="2722" width="420" height="320" rx="10" fill="#2b2a26" />
	<rect x="20" y="2716" width="420" height="320" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
	<circle cx="52" cy="2750" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
	<text x="52" y="2757" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">5</text>
	<text x="80" y="2759" font-size="28" font-weight="bold" fill="#2b2a26">Energie jako veličina</text>
	<circle cx="44" cy="2796" r="4" fill="#2b2a26" />
	<text x="56" y="2803" font-size="21" fill="#2b2a26">značka <tspan font-weight="bold">E</tspan></text>
	<circle cx="44" cy="2830" r="4" fill="#2b2a26" />
	<text x="56" y="2837" font-size="21" fill="#2b2a26">jednotka <tspan font-weight="bold">joule (J)</tspan></text>
	<circle cx="44" cy="2864" r="4" fill="#2b2a26" />
	<text x="56" y="2871" font-size="21" fill="#2b2a26">stejné jednotky jako <tspan font-weight="bold">práce</tspan></text>
	<circle cx="44" cy="2898" r="4" fill="#2b2a26" />
	<text x="56" y="2905" font-size="21" fill="#2b2a26">u elektřiny i <tspan font-weight="bold">Wh</tspan> a <tspan font-weight="bold">kWh</tspan></text>
	<!-- elektroměr na dřevěné desce -->
	<rect x="168" y="2922" width="124" height="100" rx="4" fill="#c9a77c" stroke="#2b2a26" stroke-width="2" />
	<circle cx="176" cy="2930" r="3" fill="#8d5a2b" /><circle cx="284" cy="2930" r="3" fill="#8d5a2b" />
	<circle cx="176" cy="3014" r="3" fill="#8d5a2b" /><circle cx="284" cy="3014" r="3" fill="#8d5a2b" />
	<line x1="205" y1="3012" x2="205" y2="3022" stroke="#2b2a26" stroke-width="3" />
	<line x1="255" y1="3012" x2="255" y2="3022" stroke="#2b2a26" stroke-width="3" />
	<rect x="180" y="2932" width="100" height="80" rx="6" fill="#f1f3f5" stroke="#2b2a26" stroke-width="2" />
	<rect x="192" y="2944" width="76" height="22" fill="#f8f9fa" stroke="#2b2a26" stroke-width="2" />
	<g stroke="#2b2a26" stroke-width="1.5">
		<line x1="207" y1="2944" x2="207" y2="2966" /><line x1="222" y1="2944" x2="222" y2="2966" />
		<line x1="237" y1="2944" x2="237" y2="2966" /><line x1="252" y1="2944" x2="252" y2="2966" />
	</g>
	<text x="230" y="2990" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a26">kWh</text>
	<rect x="205" y="2996" width="50" height="8" fill="#dee2e6" stroke="#2b2a26" stroke-width="1" />
	<rect class="kot" x="228" y="2996" width="4" height="8" fill="#c92a2a" />
	</g>
</svg>
