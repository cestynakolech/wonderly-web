<marker id="ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker>
</defs>
<rect width="960" height="620" fill="#ffffff"/>
<line x1="40" y1="480" x2="920" y2="480" stroke="#212529" stroke-width="4" /><clipPath id="cl"><rect x="0" y="160" width="960" height="400"/></clipPath><g clip-path="url(#cl)"><path d="M140,130 V300 L70,480 H330 L260,300 V130" fill="#a5d8ff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M400,130 V480 H620 V130" fill="#a5d8ff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M660,130 L740,410 V480 H840 V410 L920,130" fill="#a5d8ff" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /></g><path d="M140,130 V300 L70,480 H330 L260,300 V130" fill="none" stroke="#495057" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M400,130 V480 H620 V130" fill="none" stroke="#495057" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M660,130 L740,410 V480 H840 V410 L920,130" fill="none" stroke="#495057" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><line x1="40" y1="160" x2="920" y2="160" stroke="#1c7ed6" stroke-width="3" stroke-dasharray="10 6"/><line x1="70" y1="480" x2="330" y2="480" stroke="#e03131" stroke-width="10" /><line x1="400" y1="480" x2="620" y2="480" stroke="#e03131" stroke-width="10" /><line x1="740" y1="480" x2="840" y2="480" stroke="#e03131" stroke-width="10" /><rect x="36" y="130" width="4" height="0" /><text x="480" y="60.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#212529">stejná velikost dna, stejná výška hladiny, stejná síla na dno</text><text x="200" y="535.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#e03131">dno</text><text x="510" y="535.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#e03131">dno</text><text x="790" y="535.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#e03131">dno</text><text x="480" y="590.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#495057">červená čára = dno, všechna