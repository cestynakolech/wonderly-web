<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 74 360 348" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Co o ní víme: Slunce a Země se přitahují navzájem. Gravitační síla působí mezi všemi tělesy s hmotností, je vždy přitažlivá a vzájemná, větší hmotnost → větší síla, větší vzdálenost → menší síla, zákony popsal Isaac Newton.">
	<title>Gravitační síla 1/3: Co o ní víme</title>
	<!-- Panel 1/3 výřezu z infografika-gravitacni-sila.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.gs-tah { animation: gs-tahne 1.2s linear infinite; }
		@keyframes gs-tahne { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -24; } }
		@media (prefers-reduced-motion: reduce) {
			.gs-tah { animation: none; }
		}
	</style>

	<rect x="0" y="74" width="360" height="348" fill="#f8f9fa" />

	<!-- 1: Co o ní víme -->
	<g id="gs-vime">
		<rect x="8" y="84" width="344" height="328" rx="12" fill="#ffffff" stroke="#ced4da" stroke-width="2" />
		<circle cx="30" cy="106" r="13" fill="#ffffff" stroke="#2b2a26" stroke-width="2" />
		<text x="30" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#c92a2a">1</text>
		<text x="52" y="113" font-size="20" font-weight="bold" fill="#2b2a26">Co o ní víme</text>

		<text x="114" y="140" font-size="18" font-weight="bold" fill="#c92a2a">přitahují se navzájem</text>

		<!-- Slunce -->
		<g stroke="#f08c00" stroke-width="4" stroke-linecap="round">
			<line x1="64" y1="126" x2="64" y2="134" /><line x1="64" y1="210" x2="64" y2="218" />
			<line x1="18" y1="172" x2="26" y2="172" /><line x1="102" y1="172" x2="110" y2="172" />
			<line x1="31" y1="139" x2="37" y2="145" /><line x1="91" y1="199" x2="97" y2="205" />
			<line x1="31" y1="205" x2="37" y2="199" /><line x1="91" y1="145" x2="97" y2="139" />
		</g>
		<circle cx="64" cy="172" r="34" fill="#ffd43b" stroke="#f08c00" stroke-width="3" />
		<text x="64" y="240" text-anchor="middle" font-size="18" fill="#2b2a26">Slunce</text>

		<!-- Země -->
		<circle cx="304" cy="172" r="22" fill="#4dabf7" stroke="#1864ab" stroke-width="2.5" />
		<path d="M293,159 Q300,153 307,160 Q304,168 296,168 Z M304,178 Q315,174 319,183 Q312,191 304,187 Z" fill="#69db7c" stroke="#2b8a3e" stroke-width="1.5" />
		<text x="304" y="220" text-anchor="middle" font-size="18" fill="#2b2a26">Země</text>

		<!-- dvě stejně dlouhé šipky (68 px), každá od svého tělesa k druhému -->
		<line x1="114" y1="172" x2="166" y2="172" stroke="#e03131" stroke-width="6" />
		<polygon points="182,172 166,163 166,181" fill="#e03131" />
		<line class="gs-tah" x1="114" y1="172" x2="164" y2="172" stroke="#ffc9c9" stroke-width="2" stroke-dasharray="10 14" />
		<line x1="270" y1="172" x2="218" y2="172" stroke="#e03131" stroke-width="6" />
		<polygon points="202,172 218,163 218,181" fill="#e03131" />
		<line class="gs-tah" x1="270" y1="172" x2="220" y2="172" stroke="#ffc9c9" stroke-width="2" stroke-dasharray="10 14" />

		<g font-size="18" fill="#2b2a26">
			<text x="20" y="272">• působí mezi <tspan font-weight="bold">všemi tělesy</tspan></text>
			<text x="34" y="298" font-weight="bold">s hmotností</text>
			<text x="20" y="324">• je vždy <tspan font-weight="bold">přitažlivá</tspan> a <tspan font-weight="bold">vzájemná</tspan></text>
			<text x="20" y="350">• větší <tspan font-weight="bold">hmotnost</tspan> → větší síla</text>
			<text x="20" y="376">• větší <tspan font-weight="bold">vzdálenost</tspan> → menší síla</text>
			<text x="20" y="402">• zákony popsal <tspan font-weight="bold">Isaac Newton</tspan></text>
		</g>
	</g>
</svg>
