<svg viewBox="0 1476 460 856" width="460" height="856" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Čtyři doby čtyřtaktu, čtyři řezy motorem: 1. sání — sací ventil otevřený, výfukový zavřený, píst jde dolů, nasává se směs; 2. stlačení — oba ventily zavřené, píst jde nahoru, směs se stlačí; 3. výbuch a rozpínání — oba ventily zavřené, horké plyny tlačí píst dolů, pracovní doba; 4. výfuk — sací ventil zavřený, výfukový otevřený, píst jde nahoru a vytlačí spaliny; doby se stále opakují; motor má nejčastěji 4 válce, každý je v jiné době, takže běží plynule" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
