		<g transform="translate(131,422)"><g class="a2n3" transform="translate(13,40) rotate(-90)"><line x1="0" y1="0" x2="0" y2="27" stroke="#495057" stroke-width="4.5" /><path d="M-2.25 27 L0 33 L2.25 27 Z" fill="#495057" /><rect x="-7" y="-5" width="14" height="5" rx="1" fill="#495057" /></g></g>
		<text x="120" y="505" text-anchor="middle" font-size="20" fill="#2b2a26">měkká ocel</text>
		<g class="a2lb">
			<text x="120" y="533" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2a26">dočasný magnet</text>
			<text x="120" y="559" text-anchor="middle" font-size="20" fill="#2b2a26">hřebíky odpadly</text>
		</g>
		<g class="a2mg" opacity="0"><rect x="305.0" y="154" width="36" height="90" rx="4" fill="#000000" opacity="0.13" /><rect x="302.0" y="150" width="36" height="45.0" fill="#236bbb" /><rect x="302.0" y="195.0" width="36" height="45.0" fill="#d93645" /><rect x="302.0" y="150" width="36" height="90" rx="4" fill="none" stroke="#2b2a26" stroke-width="2.5" /><text x="320" y="180.5" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff">S</text><text x="320" y="225.5" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff">N</text></g>
		<rect x="305.0" y="240" width="30" height="180" rx="3" fill="#ced4da" stroke="#2b2a26" stroke-width="2.5" /><rect x="309.0" y="245" width="6" height="170" rx="3" fill="#ffffff" opacity="0.6" /><path d="M360 304 L412 310 L412 362 L360 370 Z" fill="#f1c9a5" stroke="#a8743c" stroke-width="2.5" stroke-linejoin="round" /><rect x="324" y="298" width="56" height="76" rx="22" fill="#f1c9a5" stroke="#a8743c" stroke-width="2.5" /><rect x="296" y="300" width="58" height="17" rx="8" fill="#f1c9a5" stroke="#a8743c" stroke-width="2" /><ellipse cx="303" cy="308.5" rx="4" ry="5" fill="#f8e1cf" stroke="#a8743c" stroke-width="1.2" /><rect x="296" y="317" width="56" height="17" rx="8" fill="#f1c9a5" stroke="#a8743c" stroke-width="2" /><ellipse cx="303" cy="325.5" rx="4" ry="5" fill="#f8e1cf" stroke="#a8743c" stroke-width="1.2" /><rect x="296" y="334" width="54" height="17" rx="8" fill="#f1c9a5" stroke="#a8743c" stroke-width="2" /><ellipse cx="303" cy="342.5" rx="4" ry="5" fill="#f8e1cf" stroke="#a8743c" stroke-width="1.2" /><rect x="296" y="351" width="52" height="17" rx="8" fill="#f1c9a5" stroke="#a8743c" stroke-width="2" /><ellipse cx="303" cy="359.5" rx="4" ry="5" fill="#f8e1cf" stroke="#a8743c" stroke-width="1.2" />
