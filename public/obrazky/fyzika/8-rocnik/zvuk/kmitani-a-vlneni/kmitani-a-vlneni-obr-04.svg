"url(#cm)" stroke="#0b7285" stroke-width="2.5"/><circle class="q2" cx="600" cy="200" r="10" fill="url(#cm)" stroke="#0b7285" stroke-width="2.5"/><circle class="q3" cx="630" cy="200" r="10" fill="url(#cm)" stroke="#0b7285" stroke-width="2.5"/><g class="q4"><path d="M660 158V172M660 228V242" stroke="#c92a2a" stroke-width="4"/><path d="M651 162L660 148L669 162ZM651 238L660 252L669 238Z" fill="#c92a2a"/><circle cx="660" cy="200" r="12" fill="url(#cs)" stroke="#a51d1d" stroke-width="3"/></g><circle class="q5" cx="690" cy="200" r="10" fill="url(#cm)" stroke="#0b7285" stroke-width="2.5"/><circle class="q6" cx="720" cy="200" r="10" fill="url(#cm)" stroke="#0b7285" stroke-width="2.5"/><circle class="q7" cx="750" cy="200" r="10" fill="url(#cm)" stroke="#0b7285" stroke-width="2.5"/><circle class="q0" cx="780" cy="200" r="10" fill="url(#cm)" stroke="#0b7285" stroke-width="2.5"/><circle class="q1" cx="810" cy="200" r="10" fill="url(#cm)" stroke="#0b7285" stroke-width="2.5"/><circle class="q2" cx="840" cy="200" r="10" fill="url(#cm)" stroke="#0b7285" stroke-width="2.5"/>
