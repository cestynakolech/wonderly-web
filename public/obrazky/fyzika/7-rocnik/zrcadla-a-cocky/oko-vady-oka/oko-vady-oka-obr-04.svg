<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Kde oko vidí ostře. Tři pruhy od oka do dálky. Zdravé oko vidí ostře od blízkého bodu 10 až 15 centimetrů až do nekonečna. Dalekozraké oko má blízký bod dál než 25 centimetrů, blízké předměty vidí rozmazaně, pomohou brýle se spojkou. Krátkozraké oko má daleký bod blíž než 5 metrů, vzdálené předměty vidí rozmazaně, pomohou brýle s rozptylkou. Osa není v měřítku.">
<!-- Shrnutí výkladu (odstavec Zrakové vady a jejich korekce, Akomodace) a PDF lekce 26 str. 7–10 (blízký a daleký bod).
     Stav bez děje → bez animace. Osa schematická (není v měřítku), čísla jen z výkladu: 10–15 cm, 25 cm, 5 m, nekonečno. -->
<defs><radialGradient id="cocka" cx="0.4" cy="0.4" r="0.7"><stop offset="0" stop-color="#e7f5ff"/><stop offset="1" stop-color="#4dabf7"/></radialGradient><linearGradient id="sklo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#66d9e8" stop-opacity="0.75"/><stop offset="0.45" stop-color="#e3fafc" stop-opacity="0.8"/><stop offset="1" stop-color="#3bc9db" stop-opacity="0.7"/></linearGradient></defs>
<rect x="3" y="3" width="594" height="554" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="30" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="start">Kde oko vidí ostře</text>
<text x="30" y="70" font-size="22" font-weight="normal" fill="#495057" text-anchor="start">osa od oka do dálky (není v měřítku)</text>
<line x1="150" y1="122" x2="150" y2="136" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="150" y="112" font-size="22" font-weight="normal" fill="#343a40" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">10 cm</text>
<line x1="250" y1="122" x2="250" y2="136" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="250" y="112" font-size="22" font-weight="normal" fill="#343a40" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">25 cm</text>
<line x1="430" y1="122" x2="430" y2="136" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="430" y="112" font-size="22" font-weight="normal" fill="#343a40" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">5 m</text>
<line x1="554" y1="122" x2="554" y2="136" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="538" y="112" font-size="22" font-weight="normal" fill="#343a40" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">nekonečno</text>
<text x="30" y="170" font-size="22" font-weight="bold" fill="#212529" text-anchor="start" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">zdravé oko</text>
<g><path d="M18,215 Q40,197 62,215 Q40,233 18,215 Z" fill="#ffffff" stroke="#212529" stroke-width="2.5"/><circle cx="42" cy="215" r="8" fill="#1c7ed6" stroke="#1864ab" stroke-width="1.5"/><circle cx="42" cy="215" r="3.5" fill="#101113"/></g>
<rect x="70" y="200" width="510" height="30" rx="6" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/>
<rect x="150" y="200" width="430" height="30" rx="6" fill="#237032"/>
<line x1="150" y1="190" x2="150" y2="200" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="250" y1="190" x2="250" y2="200" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="430" y1="190" x2="430" y2="200" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="554" y1="190" x2="554" y2="200" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="355" y="223" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">ostře</text>
<text x="30" y="260" font-size="22" font-weight="normal" fill="#212529" text-anchor="start">blízký bod 10–15 cm, daleký bod v nekonečnu</text>
<text x="30" y="300" font-size="22" font-weight="bold" fill="#212529" text-anchor="start" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">dalekozraké oko</text>
<g><path d="M18,345 Q40,327 62,345 Q40,363 18,345 Z" fill="#ffffff" stroke="#212529" stroke-width="2.5"/><circle cx="42" cy="345" r="8" fill="#1c7ed6" stroke="#1864ab" stroke-width="1.5"/><circle cx="42" cy="345" r="3.5" fill="#101113"/></g>
<rect x="70" y="330" width="510" height="30" rx="6" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/>
<rect x="290" y="330" width="290" height="30" rx="6" fill="#237032"/>
<line x1="150" y1="320" x2="150" y2="330" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="250" y1="320" x2="250" y2="330" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="430" y1="320" x2="430" y2="330" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="554" y1="320" x2="554" y2="330" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="425" y="353" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">ostře</text>
<text x="180" y="353" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle">rozmazaně</text>
<text x="30" y="390" font-size="22" font-weight="normal" fill="#212529" text-anchor="start">blízký bod dál než 25 cm → brýle se spojkou (+)</text>
<text x="30" y="430" font-size="22" font-weight="bold" fill="#212529" text-anchor="start" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">krátkozraké oko</text>
<g><path d="M18,475 Q40,457 62,475 Q40,493 18,475 Z" fill="#ffffff" stroke="#212529" stroke-width="2.5"/><circle cx="42" cy="475" r="8" fill="#1c7ed6" stroke="#1864ab" stroke-width="1.5"/><circle cx="42" cy="475" r="3.5" fill="#101113"/></g>
<rect x="70" y="460" width="510" height="30" rx="6" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/>
<rect x="150" y="460" width="240" height="30" rx="6" fill="#237032"/>
<line x1="150" y1="450" x2="150" y2="460" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="250" y1="450" x2="250" y2="460" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="430" y1="450" x2="430" y2="460" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="554" y1="450" x2="554" y2="460" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="270" y="483" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">ostře</text>
<text x="485" y="483" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle">rozmazaně</text>
<text x="30" y="520" font-size="22" font-weight="normal" fill="#212529" text-anchor="start">daleký bod blíž než 5 m → brýle s rozptylkou (−)</text>
</svg>
