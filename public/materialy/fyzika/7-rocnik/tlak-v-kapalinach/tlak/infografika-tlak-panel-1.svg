	<text x="40" y="95" font-size="21" fill="#2b2a26">Tlaková síla <tspan font-weight="bold" fill="#e03131">F</tspan> působí kolmo</text><text x="40" y="123" font-size="21" fill="#2b2a26">na plochu a může těleso zdeformovat.</text><text x="130" y="160" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">naplocho</text><text x="330" y="160" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">na užší hraně</text><path d="M40,320 L54,308 L234,308 L220,320 Z" fill="#f2c94c" stroke="#2b2a26" stroke-width="2"/><path d="M220,320 L234,308 L234,398 L220,410 Z" fill="#e0b42a" stroke="#2b2a26" stroke-width="2"/><rect x="40" y="320" width="180" height="90" fill="#ffe066" stroke="#2b2a26" stroke-width="2"/><circle cx="60" cy="370" r="3" fill="#f2c94c"/><circle cx="95" cy="386" r="3" fill="#f2c94c"/><circle cx="130" cy="370" r="3" fill="#f2c94c"/><circle cx="165" cy="386" r="3" fill="#f2c94c"/><circle cx="200" cy="370" r="3" fill="#f2c94c"/><g class="p1-d1"><path d="M52,319  C61.0,320 70,321.6 70,328 L190,328 C190,321.6 199.0,320 208,320 L208,319 Z" fill="#f2c94c"/><path d="M52,320 C61.0,320 70,321.6 70,328 L190,328 C190,321.6 199.0,320 208,320" fill="none" stroke="#2b2a26" stroke-width="2" vector-effect="non-scaling-stroke"/></g><g class="p1-k1" transform="translate(0,8)"><rect x="70" y="270" width="120" height="50" fill="#f4a6b8" stroke="#2b2a26" stroke-width="2.5"/><path d="M70,270 L84,258 L204,258 L190,270 Z" fill="#f8c8d4" stroke="#2b2a26" stroke-width="2"/><path d="M190,270 L204,258 L204,308 L190,320 Z" fill="#d6788f" stroke="#2b2a26" stroke-width="2"/></g><line x1="46" y1="320" x2="214" y2="320" stroke="#2b2a26" stroke-width="1.5" stroke-dasharray="4 4"/><g class="p1-s1" transform="translate(0,8)"><line x1="130" y1="320" x2="130" y2="347" stroke="#e03131" stroke-width="5"/><polygon points="130,360 123,346 137,346" fill="#e03131"/><circle cx="130" cy="320" r="5" fill="#2b2a26"/><text x="140" y="350" font-size="21" font-weight="bold" fill="#e