<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Meteoroid je úlomek, který vznikl rozpadem komety. Když vletí do atmosféry Země, začne hořet a vidíme meteor, padající hvězdu. Zbytek, který dopadne na zem, je meteorit. Meteorický roj jsou meteory ze stejného směru, například Perseidy v srpnu nebo Leonidy v listopadu. Animace: meteoroid vletí do atmosféry, zazáří a zbytek dopadne na zem.">
<style>
.kam { animation: kam 9s linear infinite; }
@keyframes kam { 0.000% { transform:translate(140px,150px) scale(1);opacity:1 } 33.333% { transform:translate(300px,290px) scale(1);opacity:1 } 51.111% { transform:translate(400px,430px) scale(0.55);opacity:1 } 62.222% { transform:translate(448px,534px) scale(0.5);opacity:1 } 94.444% { transform:translate(448px,534px) scale(0.5);opacity:1 } 100.000% { transform:translate(448px,534px) scale(0.5);opacity:0 } }
.zare { animation: zare 9s linear infinite; }
.st { animation: st 9s linear infinite; }
@keyframes st { 0.000% { stroke-dasharray:0 100 } 33.333% { stroke-dasharray:0 100 } 51.111% { stroke-dasharray:100 100 } 100.000% { stroke-dasharray:100 100 } }
@keyframes zare { 0.000% { opacity:0 } 33.333% { opacity:0 } 33.8% { opacity:1 } 55.556% { opacity:1 } 68.889% { opacity:0 } 100.000% { opacity:0 } }
.ohn { animation: ohn 9s linear infinite; }
@keyframes ohn { 0.000% { transform:translate(300px,290px);opacity:0 } 33.333% { transform:translate(300px,290px);opacity:0 } 35.556% { transform:translate(308px,297px);opacity:1 } 51.111% { transform:translate(400px,430px);opacity:1 } 54.444% { transform:translate(406px,442px);opacity:0 } 100.000% { transform:translate(400px,430px);opacity:0 } }
.dop { animation: dop 9s linear infinite; }
@keyframes dop { 0.000% { opacity:0 } 62.222% { opacity:0 } 63.333% { opacity:1 } 94.444% { opacity:1 } 100.000% { opacity:0 } }
@media (prefers-reduced-motion: reduce) { .kam, .zare, .st, .ohn, .dop { animation: none; } .kam { opacity: 0; } }
/* Předloha: kometa, meteory a meteorit. Animace 9 s: 0–3 s meteoroid letí k atmosféře, 3–4,6 s hoří (meteor) a zmenšuje se, 5,6 s zbytek dopadne (meteorit). Stopa meteoru se kreslí za tělesem (stroke-dasharray od 0 do 100). Bez animace = meteorit na zemi, kámen v letu skrytý. */
</style>
