<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vlastnosti těles. Dřevěný stůl se šipkou délka nad deskou a šipkou výška od podlahy k desce. Kniha se položí na kuchyňskou váhu a ručička se pohne – hmotnost. Mléko v lahvi s čárkovaně vyznačeným místem, které zabírá – objem. Dole: Vlastnosti těles, které můžeme změřit, jsou fyzikální veličiny.">
<style>
/* Předloha: PDF Tělesa a látky, oddíl Vlastnosti těles (tvar, velikost, hmotnost; co můžeme změřit =
   fyzikální veličiny: délka, výška, hmotnost, objem, hustota). V PDF jen text; kresba ukazuje délku, výšku,
   hmotnost a objem na tělesech z výkladu (stůl, kniha, mléko v lahvi). Bez čísel.
   Cyklus 5 s: kniha dosedne (0–30 %), ručička se otočí o 90° (30–50 %), stav drží. Bez animace = kniha leží, ručička vychýlená. */
@keyframes kniha { 0% { transform: translateY(-70px); opacity: 0; } 8% { opacity: 1; } 30%, 92% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
@keyframes rucicka { 0%, 30% { transform: rotate(-60deg); } 50%, 100% { transform: rotate(30deg); } }
.kn { animation: kniha 5s ease-out infinite; }
.ru { transform-box: view-box; transform-origin: 155px 544px; transform: rotate(30deg); animation: rucicka 5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .kn, .ru { animation: none; } }
</style>
<defs>
<linearGradient id="dr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2ad72"/><stop offset="1" stop-color="#9c6431"/></linearGradient>
<linearGradient id="drV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9c6431"/><stop offset="0.35" stop-color="#d39a5e"/><stop offset="1" stop-color="#8a5526"/></linearGradient>
<linearGradient id="vaha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="1" stop-color="#adb5bd"/></linearGradient>
<marker id="sip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1864ab"/></marker>
</defs>
<rect x="3" y="3" width="594" height="754" rx="14" fill="#f8f9fa"/>
<text x="300" y="46" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Vlastnosti těles</text>
<text x="300" y="84" font-size="24" fill="#212529" text-anchor="middle">Těleso má tvar, velikost, hmotnost…</text>
