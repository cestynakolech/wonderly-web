@keyframes rukojet{0%{transform:translateY(0)}0%{transform:translateY(0)}8%{transform:translateY(-130px)}16%{transform:translateY(0)}20%{transform:translateY(0)}28%{transform:translateY(-130px)}36%{transform:translateY(0)}40%{transform:translateY(0)}48%{transform:translateY(-130px)}56%{transform:translateY(0)}60%{transform:translateY(0)}68%{transform:translateY(-130px)}76%{transform:translateY(0)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
