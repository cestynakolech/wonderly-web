<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vzorec hustoty: ρ se rovná m lomeno V. Šipky ukazují jednotky: hmotnost m v kilogramech, objem V v metrech krychlových, hustota ρ v kilogramech na metr krychlový. V řádku ρ = m : V. Dole tři tvary: ρ = m : V, m = ρ · V, V = m : ρ.">
<style>
/* Předloha: PDF Hustota — ručně psané „Výpočet hustoty“: ρ = m/V, modré šipky „v kg“, „v m³“, „v kg/m³“. Překresleno, ne kopie.
   Tři tvary vztahu dole podle textu „Ze známé hustoty tělesa můžeme vypočítat jeho hmotnost nebo objem“. Statický obrázek. */
</style>
