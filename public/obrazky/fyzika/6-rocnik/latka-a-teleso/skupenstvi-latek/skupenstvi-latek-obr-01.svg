<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Ledovec v moři. Ledová kra nad hladinou je led, tedy pevné skupenství vody. Moře je voda, kapalné skupenství. Ve vzduchu nad mořem je vodní pára, plynné skupenství, která není vidět. Animace: vlny se pohybují.">
<style>
.vl { animation: vl 4s linear infinite; } @keyframes vl { to { transform: translateX(80px); } }
@media (prefers-reduced-motion: reduce) { .vl { animation: none; } }
/* Předloha: PDF Skupenství látek, foto ledovce s popisky Pára – plyn, Led – pevný, Voda – kapalina. Překresleno. V PDF je popisek páry u mraků; mrak jsou kapičky vody, pára je neviditelná – na webu správně: pára ve vzduchu, není vidět. */
</style>
