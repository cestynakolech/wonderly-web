<svg viewBox="0 1894 460 600" width="460" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Příklad na čas: Tomáš jede na kole stálou rychlostí 5 m/s. Za jak dlouho ujede 3 km? Zápis: v = 5 m/s, s = 3 km = 3 000 m, t = ?. Rychlost je v m/s, proto dráhu převedeme na metry. Řešení: t = s : v = 3 000 m : 5 m/s = 600 s, to je 600 : 60 = 10 min. Cyklista jede po silnici od 0 m do 3 000 m. Tomáš ujede 3 km za 10 minut" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Příklady na výpočet rychlosti 4/6: Příklad na čas</title>
	<style>
		.p4-c { transform: translate(270px, 0px); animation: p4-c 14s linear infinite; } @keyframes p4-c { 0% { transform: translate(0px, 0px); opacity: 1; } 8% { transform: translate(0px, 0px); opacity: 1; } 58% { transform: translate(270px, 0px); opacity: 1; } 90% { transform: translate(270px, 0px); opacity: 1; } 95% { transform: translate(270px, 0px); opacity: 0; } 96% { transform: translate(0px, 0px); opacity: 0; } 100% { transform: translate(0px, 0px); opacity: 1; } }
		.p4-r0 { opacity: 1; animation: p4-r0 14s linear infinite; } @keyframes p4-r0 { 0%, 14% { opacity: 0; } 16.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p4-r1 { opacity: 1; animation: p4-r1 14s linear infinite; } @keyframes p4-r1 { 0%, 26% { opacity: 0; } 28.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p4-r2 { opacity: 1; animation: p4-r2 14s linear infinite; } @keyframes p4-r2 { 0%, 38% { opacity: 0; } 40.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p4-b { opacity: 1; animation: p4-b 14s linear infinite; } @keyframes p4-b { 0%, 38% { opacity: 0; } 40.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		.p4-o { opacity: 1; animation: p4-o 14s linear infinite; } @keyframes p4-o { 0%, 50% { opacity: 0; } 52.5%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) { .p4-c, .p4-r0, .p4-r1, .p4-r2, .p4-b, .p4-o { animation: none; } }
	</style>
