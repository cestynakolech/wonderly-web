<svg viewBox="0 160 460 560" width="460" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vzájemné působení: Eva a Petr stojí na skateboardech a odstrčí se dlaněmi; při dotyku působí síla na Evu doleva a stejně velká síla na Petra doprava, oba odjedou od sebe; obě síly jsou stejně velké, míří opačně, každá působí na jiné těleso, proto se neruší; působit lze dotykem, nebo na dálku" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Působení těles a deformace 1/5: Vzájemné působení</title>
	<style>
		.zmiz { animation: zmiz 8s linear infinite; }
		@keyframes zmiz { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
		.objev { opacity: 0; animation: objev 8s linear infinite; }
		@keyframes objev { 0%, 92% { opacity: 0; } 98%, 100% { opacity: 1; } }
		.p1-eva { transform: translateX(-90px); animation: p1-eva 8s linear infinite; }
		@keyframes p1-eva { 0%, 14% { transform: translateX(0); animation-timing-function: cubic-bezier(.15,.7,.35,1); } 60%, 100% { transform: translateX(-90px); } }
		.p1-petr { transform: translateX(90px); animation: p1-petr 8s linear infinite; }
		@keyframes p1-petr { 0%, 14% { transform: translateX(0); animation-timing-function: cubic-bezier(.15,.7,.35,1); } 60%, 100% { transform: translateX(90px); } }
		.p1-sip { opacity: 0.45; animation: p1-sip 8s linear infinite; }
		@keyframes p1-sip { 0%, 3% { opacity: 0; } 6%, 14% { opacity: 1; } 20%, 100% { opacity: 0.45; } }
		.p1-pop { opacity: 1; animation: p1-pop 8s linear infinite; }
		@keyframes p1-pop { 0%, 3% { opacity: 0; } 6%, 100% { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) { .zmiz, .objev, .p1-eva, .p1-petr, .p1-sip, .p1-pop { animation: none; } }
	</style>
