<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Schéma transformátoru: vlevo primární cívka s N1 závity a napětím U1, vpravo sekundární cívka s N2 závity a napětím U2, vzorec U2 ku U1 se rovná N2 ku N1 a transformační poměr k se rovná N2 ku N1. Když je k větší než jedna, napětí roste, když je menší než jedna, napětí klesá.">
