<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Pokus s plastelínou: stejný kousek plastelíny jako kulička klesne ve vodě ke dnu, jako lodička s dutinou plove.">
<rect x="3" y="3" width="594" height="414" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="300" y="42" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">Stejný kousek plastelíny</text>
<!-- levá nádoba -->
<rect x="40" y="150" width="220" height="180" fill="#a5d8ff"/>
<line x1="40" y1="150" x2="260" y2="150" stroke="#1c7ed6" stroke-width="3"/>
<path d="M40,80 L40,330 L260,330 L260,80" fill="none" stroke="#495057" stroke-width="5"/>
<!-- kulička: kruh r = 25 → plocha asi 1 963 px² -->
<circle cx="150" cy="303" r="25" fill="#c2703d" stroke="#7a3e17" stroke-width="2"/>
<!-- směr pohybu: žlutá šipka (červená = jen Fg) -->
<polygon points="199,200 211,200 211,256 223,256 205,282 187,256 199,256" fill="#ffd43b" stroke="#5c4300" stroke-width="2"/>
<text x="150" y="370" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">kulička</text>
<text x="150" y="398" font-size="22" fill="#495057" text-anchor="middle">klesne ke dnu</text>
<!-- pravá nádoba -->
<rect x="340" y="150" width="220" height="180" fill="#a5d8ff"/>
<!-- lodička: polovina elipsy 70×44 se stěnou 12 px → plocha stěny asi 1 923 px² (≈ kulička);
     hladina 14 px pod okrajem → ponořeno asi 60 % obalu, tj. průměrná hustota plastelíny asi 1,5× hustota vody -->
<path d="M392,136 A58,32 0 0 0 508,136 Z" fill="#ffffff"/>
<path d="M380,136 A70,44 0 0 0 520,136 L508,136 A58,32 0 0 1 392,136 Z" fill="#c2703d" stroke="#7a3e17" stroke-width="2"/>
<line x1="340" y1="150" x2="384" y2="150" stroke="#1c7ed6" stroke-width="3"/>
<line x1="516" y1="150" x2="560" y2="150" stroke="#1c7ed6" stroke-width="3"/>
<path d="M340,80 L340,330 L560,330 L560,80" fill="none" stroke="#495057" stroke-width="5"/>
<line x1="450" y1="104" x2="450" y2="146" stroke="#495057" stroke-width="2"/>
<text x="450" y="98" font-size="22" fill="#495057" text-anchor="middle">vzduch</text>
<text x="450" y="370" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">lodička</text>
<text x="450" y="398" font-size="22" fill="#495057" text-anchor="middle">plove na hladině</text>
<text x="150" y="230" font-size="22" fill="#1864ab" text-anchor="middle" dx="-40">voda</text>
<text x="450" y="250" font-size="22" fill="#1864ab" text-anchor="middle">voda</text>
</svg>
