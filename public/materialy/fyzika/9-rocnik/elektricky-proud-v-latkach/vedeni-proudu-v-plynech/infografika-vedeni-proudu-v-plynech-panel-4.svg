<svg viewBox="0 1994 460 486" width="460" height="486" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bleskosvod chrání budovu před bleskem, nesprávně se mu říká hromosvod. Je to kovová tyč na nejvyšším místě budovy, spojená kovovým vodičem se zemí. V 18. století ho nezávisle na sobě vynalezli Benjamin Franklin a český přírodovědec Prokop Diviš" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
