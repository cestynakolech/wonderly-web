<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Rovnoběžný svazek tří paprsků dopadá nahoře na nerovnou plochu a odráží se do různých směrů, to je rozptyl světla. Dole dopadá na rovnou lesklou plochu a po odrazu zůstane svazek rovnoběžný. Animace: paprsky doletí k ploše a pak se odrazí.">
<style>
/* Animace (8 s, smyčka): paprsky doletí k ploše (5–30 %), odrazí se (30–55 %), drží se, zmizí (92–98 %).
   Bez animace (prefers-reduced-motion) = koncový stav: atributy níže ukazují vše dokreslené. */
.pin { stroke-dasharray: 100; animation: pin 8s linear infinite; }
.pout { stroke-dasharray: 100; animation: pout 8s linear infinite; }
.ain { animation: ain 8s linear infinite; }
.aout { animation: aout 8s linear infinite; }
.celek { animation: celek 8s linear infinite; }
@keyframes pin { 0%, 5% { stroke-dashoffset: 100; } 30%, 100% { stroke-dashoffset: 0; } }
@keyframes pout { 0%, 30% { stroke-dashoffset: 100; } 55%, 100% { stroke-dashoffset: 0; } }
@keyframes ain { 0%, 29% { opacity: 0; } 30%, 100% { opacity: 1; } }
@keyframes aout { 0%, 54% { opacity: 0; } 55%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pin, .pout, .ain, .aout, .celek { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="594" rx="14" fill="#fff9db" stroke="#2b2a26" stroke-width="3"/>
<text x="300" y="38" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Odraz na různých površích</text>

<!-- 1) nerovná plocha: zubatá čára; každý paprsek se odrazí podle sklonu plošky, kam dopadl (spočítáno zákonem odrazu) -->
<text x="30" y="74" font-size="22" font-weight="bold" fill="#212529">nerovná plocha</text>
<path d="M5,275 L60,275 L130,275 L180,240 L210,258 L270,247 L292,227 L362,252 L390,275 L540,275 L595,275 V316 H5 Z" fill="#dee2e6"/>
<path d="M5,275 L60,275 L130,275 L180,240 L210,258 L270,247 L292,227 L362,252 L390,275 L540,275 L595,275" fill="none" stroke="#343a40" stroke-width="4" stroke-linejoin="round"/>
<g class="celek" fill="#e8590c">
<g stroke="#e8590c" stroke-width="4" stroke-linecap="round">
<line class="pin" pathLength="100" x1="58.6" y1="142.6" x2="155" y2="257.5"/>
<line class="pin" pathLength="100" x1="143.6" y1="137.6" x2="240" y2="252.5"/>
<line class="pin" pathLength="100" x1="230.6" y1="124.6" x2="327" y2="239.5"/>
<line class="pout" pathLength="100" x1="155" y1="257.5" x2="82.4" y2="131.7"/>
<line class="pout" pathLength="100" x1="240" y1="252.5" x2="288.6" y2="115.6"/>
<line class="pout" pathLength="100" x1="327" y1="239.5" x2="469.5" y2="212.6"/>
</g>
<polygon class="ain" points="155,257.5 137.3,248.9 149.6,238.6"/>
<polygon class="ain" points="240,252.5 222.3,243.9 234.6,233.6"/>
<polygon class="ain" points="327,239.5 309.3,230.9 321.6,220.6"/>
<polygon class="aout" points="80,127.6 96,139.2 82.1,147.2"/>
<polygon class="aout" points="289.4,110.9 291,130.5 275.9,125.2"/>
<polygon class="aout" points="474.4,211.7 458.2,222.9 455.2,207.1"/>
</g>
<text x="300" y="306" font-size="22" fill="#212529" text-anchor="middle">→ <tspan font-weight="bold">rozptyl světla</tspan> (každý paprsek jinam)</text>

<line x1="3" y1="325" x2="597" y2="325" stroke="#2b2a26" stroke-width="2"/>

<!-- 2) rovná lesklá plocha: všechny paprsky dopadají i odrážejí se pod stejným úhlem -->
<text x="30" y="360" font-size="22" font-weight="bold" fill="#212529">rovná lesklá plocha</text>
<rect x="60" y="520" width="480" height="14" fill="#ced4da"/>
<line x1="60" y1="520" x2="540" y2="520" stroke="#343a40" stroke-width="4"/>
<g class="celek" fill="#e8590c">
<g stroke="#e8590c" stroke-width="4" stroke-linecap="round">
<line class="pin" pathLength="100" x1="120.7" y1="389.8" x2="230" y2="520"/>
<line class="pin" pathLength="100" x1="180.7" y1="389.8" x2="290" y2="520"/>
<line class="pin" pathLength="100" x1="240.7" y1="389.8" x2="350" y2="520"/>
<line class="pout" pathLength="100" x1="230" y1="520" x2="337" y2="392.5"/>
<line class="pout" pathLength="100" x1="290" y1="520" x2="397" y2="392.5"/>
<line class="pout" pathLength="100" x1="350" y1="520" x2="457" y2="392.5"/>
</g>
<polygon class="ain" points="230,520 212.3,511.4 224.6,501.1"/>
<polygon class="ain" points="290,520 272.3,511.4 284.6,501.1"/>
<polygon class="ain" points="350,520 332.3,511.4 344.6,501.1"/>
<polygon class="aout" points="339.3,389.8 333.8,408.7 321.6,398.4"/>
<polygon class="aout" points="399.3,389.8 393.8,408.7 381.6,398.4"/>
<polygon class="aout" points="459.3,389.8 453.8,408.7 441.6,398.4"/>
</g>
<text x="300" y="570" font-size="22" fill="#212529" text-anchor="middle">→ svazek zůstane <tspan font-weight="bold">rovnoběžný</tspan></text>
</svg>
