<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Jak vidíme duhu: pozorovatel má Slunce za zády a před sebou déšť. Sluneční paprsky dopadají na dešťové kapky, v nich se lámou, odrážejí a rozkládají a barevné paprsky se vracejí k oku pozorovatele. Červenou vidí z výše položené kapky, fialovou z níže položené. Hlavní duha má červenou nahoře a fialovou dole, nad ní je slabší vedlejší duha s opačným pořadím barev. Animace: paprsky ze Slunce doletí ke kapkám, barevné paprsky k oku, pak se objeví hlavní a nakonec vedlejší duha.">
<style>
/* Animace (12 s, smyčka) podle předlohy (PDF lekce 28, str. 8 dole — pozorovatel 9, kapky 10 a 11, duhy 3 a 5;
   str. 5–6 fotografie duhy a dvojité duhy):
   sluneční paprsky doletí ke kapkám (5–22 %), kapky se rozsvítí (22–25 %), barevné paprsky k oku (25–42 %),
   hlavní duha (42–52 %), vedlejší duha (55–65 %), paprsky a duhy zmizí (92–98 %). Déšť padá stále.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy níže ukazují vše. */
.sl, .cl { stroke-dasharray: 100; }
.sl { animation: sl 12s linear infinite; }
.kp { animation: kp 12s linear infinite; }
.cl { animation: cl 12s linear infinite; }
.hd { animation: hd 12s linear infinite; }
.vd { animation: vd 12s linear infinite; }
.celek { animation: celek 12s linear infinite; }
.dest { animation: dest 0.7s linear infinite; }
@keyframes sl { 0%, 5% { stroke-dashoffset: 100; } 22%, 100% { stroke-dashoffset: 0; } }
@keyframes kp { 0%, 22% { opacity: 0; } 25%, 100% { opacity: 1; } }
@keyframes cl { 0%, 25% { stroke-dashoffset: 100; } 42%, 100% { stroke-dashoffset: 0; } }
@keyframes hd { 0%, 42% { opacity: 0; } 52%, 100% { opacity: 1; } }
@keyframes vd { 0%, 55% { opacity: 0; } 65%, 100% { opacity: 1; } }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@keyframes dest { from { transform: translate(0, 0); } to { transform: translate(0, 48px); } }
@media (prefers-reduced-motion: reduce) { .sl, .kp, .cl, .hd, .vd, .celek, .dest { animation: none; } }
</style>
<defs>
<linearGradient id="r4nebe" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#a5d8ff"/><stop offset="0.35" stop-color="#8fb8d8"/><stop offset="1" stop-color="#6f8598"/>
</linearGradient>
