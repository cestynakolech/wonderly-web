<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 484" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: na pánvičce leží krystalový cukr, jeho částice jsou v pravidelných řadách. Pod pánvičkou se zapálí oheň, cukr taje a částice se rozptýlí. Po vychladnutí zůstane karamel s nepravidelně rozmístěnými částicemi. Složení je stejné, změnilo se jen uspořádání částic.">
