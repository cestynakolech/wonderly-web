<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Těleso: kladivo. Šikmo položené kladivo s kovovou hlavou a dřevěnou násadou. Popisek Železo ukazuje na hlavu, popisek Dřevo na násadu. Dole stojí: Těleso může být z více látek.">
