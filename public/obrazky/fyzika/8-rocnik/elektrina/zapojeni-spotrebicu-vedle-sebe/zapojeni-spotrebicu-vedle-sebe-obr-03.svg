troke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.85"/><path class="tok" d="M150 205C215 205 215 272 275 272H325C385 272 385 205 450 205" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.85"/><path d="M44 209L102 209L102 216L120 205L102 194L102 201L44 201Z" fill="#fff" stroke="#1864ab" stroke-width="2" stroke-linejoin="round"/><path d="M476 209L534 209L534 216L552 205L534 194L534 201L476 201Z" fill="#fff" stroke="#1864ab" stroke-width="2" stroke-linejoin="round"/><text x="90" y="108" font-size="20" fill="#212529" text-anchor="middle">řeka se</text><text x="90" y="132" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">rozdělí</text><text x="510" y="108" font-size="20" fill="#212529" text-anchor="middle">a zase</text><text x="510" y="132" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">spojí</text><text x="300" y="326" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">Voda se nikde neztrácí.</text><text x="300" y="98" font-size="20" fill="#212529" text-anchor="middle">dvě koryta – jako dvě větve</text><path d="M20 342H580" stroke="#ced4da" stroke-width="2"/><text x="300" y="380" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">Odporové dráty</text><text x="30" y="420" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">Za sebou:</text><path d="M40 443H140V457H40Z" fill="#adb5bd" stroke="#495057" stroke-width="1.5"/><rect x="40" y="445.1" width="100" height="2.5" fill="#fff" opacity="0.45"/><ellipse cx="140" cy="450" rx="4.2" ry="7" fill="#dee2e6" stroke="#495057" stroke-width="2"/><path d="M146 443H246V457H146Z" fill="#adb5bd" stroke="#495057" stroke-width="1.5"/><rect x="146" y="445.1" width="100" height="2.5" fill="#fff" opacity="0.45"/><ellipse cx="246" cy="450" rx="4.2" ry="7" fill="#dee2e6" stroke="#495057" stroke-width="2"/><path d="M268 454L298 454L298 461L316 450L298 439L298 446L268 446Z" fill="#868e96" stroke="#495057" stroke-width="2" stroke-linejoin="round"/><path d="M336 443H536V457H336Z" fill="#adb5bd" stroke="#495057" stroke-width="1.5"/><rect x="336" y="445.1" width="200" height="2.5" fill="#fff" opacity="0.45"/><ellipse cx="536" cy="450" rx="4.2" ry="7" fill="#dee2e6" stroke="#495057" stroke-width="2"/><text x="300" y="492" font-size="22" fill="#212529" text-anchor="middle">jako delší drát → větší odpor</text><text x="30" y="540" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">Vedle sebe:</text><path d="M90 565H210V579H90Z" fill="#adb5bd" stroke="#495057" stroke-width="1.5"/><rect x="90" y="567.1" width="120" height="2.5" fill="#fff" opacity="0.45"/><ellipse cx="210" cy="572" rx="4.2" ry="7" fill="#dee2e6" stroke="#495057" stroke-width="2"/><path d="M90 599H210V613H90Z" fill="#adb5bd" stroke="#495057" stroke-width="1.5"/><rect x="90" y="601.1" width="120" height="2.5" fill="#fff" opacity="0.45"/><ellipse cx="210" cy="606" rx="4.2" ry="7" fill="#dee2e6" stroke="#495057" stroke-width="2"/><path d="M70 572V606M70 589H54M230 572V606M230 589H246" fill="none" stroke="#495057" stroke-width="4"/><path d="M70 572H90M70 606H90M214 572H230M214 606H230" fill="none" stroke="#495057" stroke-width="4"/><path d="M268 593L298 593L298 600L316 589L298 578L298 585L268 585Z" fill="#868e96" stroke="#495057" stroke-width="2" stroke-linejoin="round"/><path d="M356 574H476V604H356Z" fill="#adb5bd" stroke="#495057" stroke-width="1.5"/><rect x="356" y="578.5" width="120" height="5.4" fill="#fff" opacity="0.45"/><ellipse cx="476" cy="589" rx="9" ry="15" fill="#dee2e6" stroke="#495057" stroke-width="2"/><text x="496" y="566" font-size="20" fill="#212529" text-anchor="start">větší</text><text x="496" y="590" font-size="20" fill="#212529" text-anchor="start">průřez</text><text x="300" y="648" font-size="22" fill="#212529" text-anchor="middle">jako tlustší drát → menší odpor</text>
</svg>
