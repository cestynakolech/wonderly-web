<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: elektrometr – kovová kulička nahoře, skleněné kruhové pouzdro s otočnou ručičkou a stupnicí bez čísel, kovový stojan. Nejdřív má kulička malý náboj a ručička se vychýlí jen málo. Pak má větší náboj a ručička se vychýlí víc. Čím větší výchylka, tím větší náboj.">
<style>
/* Předloha: PDF Elektrické vlastnosti látek, kresba elektrometru (zlatá kulička, kruhové prosklené pouzdro, ručička, stupnice vlevo dole, stojan s kruhovou patkou). Překresleno. Stupnice bez čísel a jednotek (jen porovnání). Animace 10 s: 2 elektrony → výchylka 18°, 5 elektronů → výchylka 46°. Bez animace = koncový stav (5 elektronů, 46°). */
@keyframes ru { 0%, 6% { transform: rotate(0deg); } 16%, 40% { transform: rotate(18deg); } 48%, 54% { transform: rotate(0deg); } 66%, 92% { transform: rotate(46deg); } 100% { transform: rotate(0deg); } }
@keyframes q1 { 0%, 4% { opacity: 0; } 8%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes q2 { 0%, 52% { opacity: 0; } 58%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes k1 { 0%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes k2 { 0%, 48% { opacity: 0; } 50%, 100% { opacity: 1; } }
.ru { transform-box: view-box; transform-origin: 300px 420px; transform: rotate(46deg); animation: ru 10s ease-in-out infinite; }
.q1 { animation: q1 10s linear infinite; } .q2 { animation: q2 10s linear infinite; } .k1 { animation: k1 10s linear infinite; } .k2 { animation: k2 10s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><radialGradient id="gP" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#f19a9a"/><stop offset="0.45" stop-color="#c92a2a"/><stop offset="1" stop-color="#7d1a1a"/></radialGradient>
<radialGradient id="gE" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#7db3e3"/><stop offset="0.45" stop-color="#1864ab"/><stop offset="1" stop-color="#0b3a63"/></radialGradient>
<radialGradient id="gN" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#adb5bd"/><stop offset="1" stop-color="#5c636a"/></radialGradient>
<radialGradient id="gObal" cx="50%" cy="50%" r="50%" fx="40%" fy="35%"><stop offset="0" stop-color="#f4fbef"/><stop offset="1" stop-color="#c5e1b0"/></radialGradient>
<radialGradient id="gJadro" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff4e6"/><stop offset="1" stop-color="#ffc9a0"/></radialGradient>
<linearGradient id="gKov" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6c757d"/><stop offset="0.35" stop-color="#f1f3f5"/><stop offset="0.7" stop-color="#adb5bd"/><stop offset="1" stop-color="#495057"/></linearGradient>
<linearGradient id="gKovV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f3f5"/><stop offset="0.5" stop-color="#ced4da"/><stop offset="1" stop-color="#868e96"/></linearGradient>
<radialGradient id="gZlato" cx="50%" cy="50%" r="50%" fx="38%" fy="32%"><stop offset="0" stop-color="#fff9db"/><stop offset="0.35" stop-color="#fcc419"/><stop offset="1" stop-color="#a86b00"/></radialGradient>
<radialGradient id="gSklo" cx="50%" cy="50%" r="50%" fx="30%" fy="25%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#e7f5ff"/><stop offset="1" stop-color="#c5f6fa"/></radialGradient>
<radialGradient id="gKuze" cx="50%" cy="50%" r="50%" fx="40%" fy="35%"><stop offset="0" stop-color="#ffe8d6"/><stop offset="1" stop-color="#eeb48a"/></radialGradient>
<linearGradient id="gPlast" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd8a8"/><stop offset="0.5" stop-color="#fd7e14"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
<linearGradient id="gDeska" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#212529"/><stop offset="0.45" stop-color="#6c757d"/><stop offset="1" stop-color="#212529"/></linearGradient></defs>
<rect x="3" y="3" width="594" height="734" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<rect x="90" y="16" width="420" height="48" rx="10" fill="#ffe066" stroke="#e67700" stroke-width="2"/><text x="300" y="49" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Elektrometr</text>
<text x="300" y="100" font-size="20" fill="#212529" text-anchor="middle">Elektroskop se stupnicí – náboje jen porovnává.</text>
<ellipse cx="300" cy="666" rx="118" ry="22" fill="#868e96"/><ellipse cx="300" cy="658" rx="118" ry="22" fill="url(#gKov)" stroke="#495057" stroke-width="2"/><path d="M284 560L284 610C284 630 230 640 200 652L400 652C370 640 316 630 316 610L316 560Z" fill="url(#gKov)" stroke="#495057" stroke-width="2"/><circle cx="300" cy="420" r="142" fill="url(#gSklo)" stroke="url(#gKov)" stroke-width="16"/><circle cx="300" cy="420" r="150" fill="none" stroke="#495057" stroke-width="2"/><circle cx="300" cy="420" r="134" fill="none" stroke="#495057" stroke-width="1.5"/><path d="M210 350C230 310 270 296 310 296" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.8"/><path d="M303.2 511.9A92 92 0 0 1 217.3 460.3L188.5 474.4A124 124 0 0 0 304.3 543.9Z" fill="#ffffff" stroke="#495057" stroke-width="1.5"/><path d="M300 518L300 538M281.9 522.4L279.5 536.2M266.5 512.1L259.6 530.9M248 510.1L241 522.2M237 495.1L224.2 510.4M220.3 486.8L209.6 495.8M215.1 469L197.8 479" stroke="#212529" stroke-width="3.5" stroke-linecap="round"/><rect x="278" y="252" width="44" height="26" rx="6" fill="#343a40"/><rect x="270" y="270" width="60" height="12" rx="4" fill="url(#gKov)" stroke="#495057"/><rect x="296" y="190" width="8" height="296" fill="url(#gKov)" stroke="#495057" stroke-width="1.2"/><circle cx="300" cy="175" r="40" fill="url(#gZlato)" stroke="#a86b00" stroke-width="2"/><g class="q1"><g><circle cx="258" cy="150" r="10" fill="url(#gE)" stroke="#212529" stroke-width="1.5"/><path d="M252.8 150H263.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><g><circle cx="342" cy="150" r="10" fill="url(#gE)" stroke="#212529" stroke-width="1.5"/><path d="M336.8 150H347.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g></g><g class="q2"><g><circle cx="300" cy="122" r="10" fill="url(#gE)" stroke="#212529" stroke-width="1.5"/><path d="M294.8 122H305.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><g><circle cx="250" cy="196" r="10" fill="url(#gE)" stroke="#212529" stroke-width="1.5"/><path d="M244.8 196H255.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><g><circle cx="350" cy="196" r="10" fill="url(#gE)" stroke="#212529" stroke-width="1.5"/><path d="M344.8 196H355.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g></g>
<g class="ru"><rect x="297" y="324" width="6" height="192" rx="3" fill="#343a40"/></g>
<circle cx="300" cy="420" r="8" fill="url(#gKovV)" stroke="#343a40" stroke-width="2"/>
<text x="96" y="600" font-size="20" fill="#212529" text-anchor="middle" font-weight="bold">stupnice</text>
<path d="M110 584L196 520" stroke="#212529" stroke-width="2"/>
<text x="520" y="300" font-size="20" fill="#212529" text-anchor="middle" font-weight="bold">ručička</text>
<path d="M500 308L372 360" stroke="#212529" stroke-width="2"/>
<text class="k1" x="300" y="718" font-size="21" font-weight="bold" fill="#212529" text-anchor="middle" opacity="0">Menší náboj → menší výchylka ručičky</text>
<text class="k2" x="300" y="718" font-size="21" font-weight="bold" fill="#212529" text-anchor="middle">Větší náboj → větší výchylka ručičky</text>
</svg>
