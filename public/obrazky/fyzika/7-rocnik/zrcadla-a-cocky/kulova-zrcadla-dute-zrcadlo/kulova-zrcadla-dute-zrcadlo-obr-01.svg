<text x="230" y="304" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">S</text><text x="320" y="304" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">F</text><text x="432" y="304" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">V</text><text x="210" y="332" font-size="22" font-weight="normal" fill="#212529" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">střed křivosti</text><text x="326" y="332" font-size="22" font-weight="normal" fill="#212529" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">ohnisko</text><text x="424" y="332" font-size="22" font-weight="normal" fill="#212529" text-anchor="start" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">vrchol</text>
<text x="575" y="258" font-size="22" font-weight="normal" fill="#495057" text-anchor="end" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">optická osa o</text>
<line x1="407.1" y1="205.4" x2="470" y2="168" stroke="#495057" stroke-width="2"/><text x="476" y="166" font-size="22" font-weight="normal" fill="#212529" text-anchor="start" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">vrchlík</text>
<line x1="230" y1="270" x2="377.4" y2="166.8" stroke="#495057" stroke-width="2.5"/><text x="293.7" y="208.4" font-size="24" font-weight="bold" fill="#495057" text-anchor="middle" paint-order="stroke" stroke="#f8f9fa" stroke-width="6" stroke-linejoin="round">r</text>
