<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dvě postavy zepředu. U levé vede proud z levé ruky přes hrudník a srdce do nohou: tato cesta je zvlášť nebezpečná. U pravé se kabel dotkne hlavy a proud vede hlavou do nohou: může poškodit mozek. Animace: oranžové čárky ukazují, kudy proud tělem prochází.">
<style>
.tok { animation: tok 0.9s linear infinite; }
@keyframes tok { to { stroke-dashoffset: -26; } }
.bije { animation: bije 0.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes bije { 50% { transform: scale(1.15); } }
@media (prefers-reduced-motion: reduce) { .tok, .bije { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="654" rx="14" fill="#f8f9fa"/>

