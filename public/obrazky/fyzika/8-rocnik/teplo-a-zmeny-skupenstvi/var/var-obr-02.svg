<svg xmlns="http://www.w3.org/2000/svg" width="375" height="590" viewBox="0 0 375 590" role="img" aria-labelledby="title desc"><title id="title">Zahřívání vody</title><desc id="desc">Graf od 20 do 100 stupňů, vodorovný úsek při varu a další vzestup teploty páry. Čas bez číselné stupnice.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="375" height="590" rx="0" fill="#fff" stroke="none"/><text x="187" y="33" font-size="21" text-anchor="middle" fill="#17324d">Zahřívání vody</text><text x="110" y="82" font-size="18" text-anchor="middle" fill="#17324d">Teplota [°C]</text><path d="M65 340 L65 105" fill="none" stroke="#17324d" stroke-width="3"/><path d="M58.5 117.0 L65.0 105.0 L71.5 117.0" fill="none" stroke="#17324d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M65 340 L339 340" fill="none" stroke="#17324d" stroke-width="3"/><path d="M327.0 333.5 L339.0 340.0 L327.0 346.5" fill="none" stroke="#17324d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="40" y="314" font-size="18" text-anchor="middle" fill="#17324d">20</text><text x="37" y="204" font-size="18" text-anchor="middle" fill="#17324d">100</text><path d="M65 310 L135 200 L260 200 L319 134" fill="none" stroke="#e03131" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M65 200 H260" fill="none" stroke="#7798b0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="210" y="375" font-size="18" text-anchor="middle" fill="#17324d">Čas zahřívání</text><text x="187" y="418" font-size="18" text-anchor="middle" fill="#17324d">1  Ohřívání kapaliny</text><text x="187" y="451" font-size="18" text-anchor="middle" fill="#17324d">2  Var: kapalina a pára</text><text x="187" y="484" font-size="18" text-anchor="middle" fill="#17324d">3  Další ohřívání páry</text><text x="187" y="537" font-size="18" text-anchor="middle" fill="#17324d">Čistá voda</text><text x="187" y="563" font-size="18" text-anchor="middle" fill="#17324d">Běžný atmosférický tlak</text><circle cx="94" cy="244" r="14" fill="#fff" stroke="#17324d" stroke-width="2"/><text x="94" y="250" font-size="18" text-anchor="middle" fill="#17324d">1</text><circle cx="195" cy="174" r="14" fill="#fff" stroke="#17324d" stroke-width="2"/><text x="195" y="180" font-size="18" text-anchor="middle" fill="#17324d">2</text><circle cx="294" cy="131" r="14" fill="#fff" stroke="#17324d" stroke-width="2"/><text x="294" y="137" font-size="18" text-anchor="middle" fill="#17324d">3</text></g></svg>