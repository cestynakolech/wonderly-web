<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Popis kulového zrcadla: zrcadlo je malá část kulové plochy, tzv. vrchlík. Na optické ose o leží střed křivosti S, ohnisko F a vrchol V. Poloměr křivosti r je vzdálenost S od V, ohnisková vzdálenost f je vzdálenost F od V; ohnisko leží uprostřed, proto f = r/2. Dole: duté zrcadlo odráží vnitřní stranou a S i F leží před ním; vypuklé zrcadlo odráží vnější stranou a S i F leží za ním.">
<rect x="3" y="3" width="594" height="794" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="38" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Popis kulového zrcadla</text><text x="300" y="66" font-size="22" font-weight="normal" fill="#212529" text-anchor="middle">zrcadlo je malá část kulové plochy</text>
<circle cx="230" cy="270" r="180" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6"/>
<path d="M382.4,163.3 A186,186 0 0 1 382.4,376.7" fill="none" stroke="#adb5bd" stroke-width="9"/><path d="M377.4,166.8 A180,180 0 0 1 377.4,373.2" fill="none" stroke="#212529" stroke-width="4"/>
<line x1="30" y1="270" x2="575" y2="270" stroke="#343a40" stroke-width="2" stroke-dasharray="16 5 3 5"/>
