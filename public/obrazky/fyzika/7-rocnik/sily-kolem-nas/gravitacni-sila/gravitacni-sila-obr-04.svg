<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 500" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Trojúhelník rozdělený vodorovnou čarou: nahoře Fg, dole vlevo m a vpravo g. Čte se z něj Fg = m krát g, m = Fg děleno g a g = Fg děleno m.">
<defs>
<marker id="a-cer" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e03131"/></marker>
<marker id="a-mod" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1971c2"/></marker>
<marker id="a-zel" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2f9e44"/></marker>
<marker id="a-ora" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e8590c"/></marker>
<marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2b2a26"/></marker>
<marker id="a-sed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#495057"/></marker>
<marker id="a-zlu" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#f08c00"/></marker>
<marker id="a-fia" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#7048e8"/></marker>
<marker id="b-cer" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e03131"/></marker>
<marker id="b-zel" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#2f9e44"/></marker>
<marker id="b-mod" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#1971c2"/></marker>
<marker id="b-ora" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e8590c"/></marker>
<marker id="b-ink" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#2b2a26"/></marker>
</defs>
<rect x="3" y="3" width="954" height="494" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="480.0" y="46.0" font-size="26" font-weight="bold" fill="#2b2a26" text-anchor="middle">Vzorcový trojúhelník: Fg, m, g</text>
<path d="M250.0,90.0 L70.0,420.0 L430.0,420.0 z" fill="#fff3bf" stroke="#f08c00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="135.5" y1="300.0" x2="364.5" y2="300.0" stroke="#f08c00" stroke-width="4" stroke-linecap="round"/>
<line x1="250.0" y1="300.0" x2="250.0" y2="420.0" stroke="#f08c00" stroke-width="4" stroke-linecap="round"/>
<text x="250.0" y="235.0" font-size="46" font-weight="bold" fill="#e03131" text-anchor="middle">F<tspan font-size="18" dy="5">g</tspan></text>
<text x="160.0" y="380.0" font-size="46" font-weight="bold" fill="#2b2a26" text-anchor="middle">m</text>
<text x="340.0" y="380.0" font-size="46" font-weight="bold" fill="#2b2a26" text-anchor="middle">g</text>
<text x="560.0" y="130.0" font-size="24" font-weight="bold" fill="#2b2a26" text-anchor="start">Zakryj hledanou veličinu:</text>
<text x="560.0" y="200.0" font-size="32" font-weight="bold" fill="#e03131" text-anchor="start">F<tspan font-size="18" dy="5">g</tspan> = m · g</text>
<text x="560.0" y="232.0" font-size="20" fill="#495057" text-anchor="start">nahoře je Fg, dole m a g se násobí</text>
<text x="560.0" y="290.0" font-size="32" font-weight="bold" fill="#2b2a26" text-anchor="start">m = F<tspan font-size="18" dy="5">g</tspan> : g</text>
<text x="560.0" y="322.0" font-size="20" fill="#495057" text-anchor="start">m je dole vlevo, dělíme Fg číslem g</text>
<text x="560.0" y="380.0" font-size="32" font-weight="bold" fill="#2b2a26" text-anchor="start">g = F<tspan font-size="18" dy="5">g</tspan> : m</text>
<text x="560.0" y="412.0" font-size="20" fill="#495057" text-anchor="start">g je dole vpravo, dělíme Fg číslem m</text>
<text x="480.0" y="470.0" font-size="22" font-weight="bold" fill="#2b2a26" text-anchor="middle">Jednotky: Fg v N, m v kg, g v N/kg</text>
</svg>
