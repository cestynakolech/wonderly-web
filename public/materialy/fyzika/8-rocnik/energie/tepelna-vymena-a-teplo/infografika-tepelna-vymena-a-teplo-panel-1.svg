		<text x="26" y="418" font-size="22" fill="#2b2a26">Rychlejší částice teplejšího tělesa</text>
		<text x="26" y="446" font-size="22" fill="#2b2a26">narážejí do pomalejších a předají jim</text>
		<text x="26" y="474" font-size="22" fill="#2b2a26">část energie. Rychlé zpomalí,</text>
		<text x="26" y="502" font-size="22" fill="#2b2a26">pomalé zrychlí.</text>
		<text x="26" y="540" font-size="22" fill="#2b2a26"><tspan font-weight="bold" fill="#c92a2a">teplejší</tspan>: vnitřní energie klesá</text>
