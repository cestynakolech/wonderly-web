<svg viewBox="0 0 460 720" width="460" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stejná frekvence: transformátor má na primární cívce 500 závitů a napětí 200 V, na sekundární cívce 100 závitů a napětí 40 V, transformační poměr k = 100 : 500 = 1 : 5; dva záznamy napětí se kreslí současně: napětí na sekundární cívce je pětkrát menší, ale kmitá stejně rychle, z 50 Hz zůstane 50 Hz; záznam je zpomalený" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Transformátor v pohybu 1/3: Stejná frekvence</title>
	<style>
		.p7-kryt { transform: translateX(360px); animation: p7x 5s linear infinite; }
		.p7-pero { transform: translateX(360px); animation: p7x 5s linear infinite; }
		@keyframes p7x { 0% { transform: translateX(0px); } 80%, 100% { transform: translateX(360px); } }
		.p7-y1 { animation: p7y1 5s infinite; }
		.p7-y2 { animation: p7y2 5s infinite; }
		@keyframes p7y1 { 0% { transform: translateY(0.0px); animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1); } 10% { transform: translateY(-42.0px); animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); } 20% { transform: translateY(0.0px); animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1); } 30% { transform: translateY(42.0px); animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); } 40% { transform: translateY(0.0px); animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1); } 50% { transform: translateY(-42.0px); animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); } 60% { transform: translateY(0.0px); animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1); } 70% { transform: translateY(42.0px); animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); } 80% { transform: translateY(0.0px); animation-timing-function: linear; } 100% { transform: translateY(0.0px); animation-timing-function: linear; } }
		@keyframes p7y2 { 0% { transform: translateY(0.0px); animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1); } 10% { transform: translateY(-8.4px); animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); } 20% { transform: translateY(0.0px); animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1); } 30% { transform: translateY(8.4px); animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); } 40% { transform: translateY(0.0px); animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1); } 50% { transform: translateY(-8.4px); animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); } 60% { transform: translateY(0.0px); animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1); } 70% { transform: translateY(8.4px); animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); } 80% { transform: translateY(0.0px); animation-timing-function: linear; } 100% { transform: translateY(0.0px); animation-timing-function: linear; } }
		@media (prefers-reduced-motion: reduce) { .p7-kryt, .p7-pero, .p7-y1, .p7-y2 { animation: none; } }
	</style>
