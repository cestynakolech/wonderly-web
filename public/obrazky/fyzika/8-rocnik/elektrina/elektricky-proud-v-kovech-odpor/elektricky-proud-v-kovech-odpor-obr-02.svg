<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dva stejné obvody s článkem, spínačem a žárovkou. V horním je do obvodu zapojený měděný drát, v dolním plastová tyčinka. Po zavření spínačů žárovka s měděným drátem svítí – měď je vodič. Žárovka s plastovou tyčinkou nesvítí – plast je izolant, má velmi velký odpor. Animace: spínače se zavřou, rozsvítí se jen horní žárovka, pak se spínače zase otevřou.">
<style>
/* Předloha: PDF lekce 25, s. 4 (vodiče s malým odporem – měď; izolanty s velmi vysokým odporem – plast, keramika; žádný kov není izolant). Obrázek v PDF chybí, děj nakreslen podle textu.
   8 s: 0–30 % spínače otevřené, obě žárovky nesvítí; 30–36 % spínače se zavřou; 36–85 % žárovka s měděným drátem svítí, s plastem nesvítí; 85–91 % spínače se otevřou.
   Bez animace (reduced-motion) = koncový stav děje: oba spínače zavřené, horní žárovka svítí, dolní ne. */
.ps { animation: ps 8s ease-in-out infinite; }
@keyframes ps { 0%, 30% { transform: rotate(-24deg); } 36%, 85% { transform: rotate(0deg); } 91%, 100% { transform: rotate(-24deg); } }
.lit, .sz { animation: sv 8s step-end infinite; }
.so { opacity: 0; animation: tm 8s step-end infinite; }
@keyframes sv { 0% { opacity: 0; } 36% { opacity: 1; } 86% { opacity: 0; } }
@keyframes tm { 0% { opacity: 1; } 36% { opacity: 0; } 86% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ps, .lit, .sz, .so { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="634" rx="14" fill="#f8f9fa"/>
