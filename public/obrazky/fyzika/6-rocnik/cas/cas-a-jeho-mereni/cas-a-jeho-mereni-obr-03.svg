<linearGradient id="voda3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74c0fc"/><stop offset="1" stop-color="#1c7ed6"/></linearGradient>
<linearGradient id="drevo3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b4423"/><stop offset="0.5" stop-color="#a0703f"/><stop offset="1" stop-color="#6b4423"/></linearGradient>
<linearGradient id="vaha3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ecef"/><stop offset="1" stop-color="#adb5bd"/></linearGradient>
