<text x="315" y="280" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">Nepřibližuj se!</text>
<text x="315" y="306" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">Volej 112.</text>
<rect x="24" y="490" width="552" height="136" rx="10" fill="#fff" stroke="#ced4da" stroke-width="2"/>
<text x="300" y="522" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">Vysoké napětí může přeskočit vzduchem</text>
<text x="300" y="548" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">jako oblouk – i bez dotyku.</text>
<text x="300" y="584" font-size="20" fill="#212529" text-anchor="middle">Nelez na stožáry. Spadlý drát může být</text>
<text x="300" y="610" font-size="20" fill="#212529" text-anchor="middle">pod napětím, i když nejiskří.</text>
</svg>
