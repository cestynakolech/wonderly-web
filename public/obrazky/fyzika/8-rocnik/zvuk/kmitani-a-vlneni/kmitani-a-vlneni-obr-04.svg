<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Příčné vlnění: řada částic na vlnité čáře. Vlna s kopečky a údolími postupuje doprava, každá částice přitom kmitá jen nahoru a dolů, kolmo na směr šíření. Tři červeně zvýrazněné částice s červenými svislými šipkami kmitají stejně; vzdálenost dvou sousedních z nich je vlnová délka λ. Modrá šipka ukazuje směr šíření vlnění.">
<style>
/* Předloha: PDF lekce 33, s. 8 (dolní pruh „Příčné vlnění“: vlnitá čára, na ní kuličky s červenými svislými šipkami;
   rámeček: částice kmitají kolmo ke směru šíření, vytváří viditelné vlny s „kopečky a údolími“). Výklad § Druhy
   mechanického vlnění a § Vlnová délka (nejmenší vzdálenost dvou bodů, které kmitají stejně).
   Vlnová délka 240 px, perioda 3 s, vlna jede doprava rychlostí 240 px za 3 s. Částice po 30 px; zpoždění každé
   částice = x : 240 · 3 s (osm tříd q0–q7). Červené částice (x = 180, 420, 660) jsou přesně λ od sebe → kmitají stejně.
   Bez animace (reduced-motion) = okamžik t = 0: částice leží na nakreslené vlně. */
.vl { animation: vl 3s linear infinite; }
@keyframes vl { from { transform: translateX(0); } to { transform: translateX(240px); } }
.q0, .q1, .q2, .q3, .q4, .q5, .q6, .q7 { animation: kp 1.5s cubic-bezier(.37,0,.63,1) infinite alternate; }
@keyframes kp { from { transform: translateY(-50px); } to { transform: translateY(50px); } }
.q0 { transform: translateY(0); animation-delay: -2.25s; }
.q1 { transform: translateY(35.4px); animation-delay: -1.875s; }
.q2 { transform: translateY(50px); animation-delay: -1.5s; }
.q3 { transform: translateY(35.4px); animation-delay: -1.125s; }
.q4 { transform: translateY(0); animation-delay: -.75s; }
.q5 { transform: translateY(-35.4px); animation-delay: -.375s; }
.q6 { transform: translateY(-50px); animation-delay: 0s; }
.q7 { transform: translateY(-35.4px); animation-delay: -2.625s; }
@media (prefers-reduced-motion: reduce) { .vl, .q0, .q1, .q2, .q3, .q4, .q5, .q6, .q7 { animation: none; } }
</style>
