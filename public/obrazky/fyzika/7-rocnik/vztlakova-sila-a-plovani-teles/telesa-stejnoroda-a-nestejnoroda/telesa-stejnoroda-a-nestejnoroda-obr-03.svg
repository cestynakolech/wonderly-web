<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Ocelová loď v řezu: trup je jen tenká ocelová skořepina a podpalubí je plné vzduchu. Animace: loď se spustí na vodu, ponoří se jen částečně a plove. Voda 1 000 kg/m³, ocel asi 7 800 kg/m³, průměrná hustota lodi je menší než 1 000 kg/m³.">
<style>
/* Animace (7 s, smyčka): loď se spustí na hladinu, dosedne s dozníváním a plove. Bez animace = koncový stav (atributy níže). */
.lod { animation: lod 7s ease-in-out infinite; }
@keyframes lod {
  0% { transform: translateY(-96px); opacity: 0; }
  8% { transform: translateY(-96px); opacity: 1; }
  32% { transform: translateY(0); }
  38% { transform: translateY(10px); }
  44% { transform: translateY(-5px); }
  50% { transform: translateY(2px); }
  55%, 92% { transform: translateY(0); opacity: 1; }
  97%, 100% { transform: translateY(0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .lod { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="474" rx="14" fill="#e7f5ff" stroke="#2b2a26" stroke-width="3"/>
<text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Proč plove ocelová loď</text>
<!-- voda: hladina y=268 (ponor 92 z 130 px výšky trupu) -->
<path d="M5,268 H595 V463 Q595,475 583,475 H17 Q5,475 5,463 Z" fill="#74c0fc"/>
<line x1="5" y1="268" x2="595" y2="268" stroke="#1971c2" stroke-width="3"/>
<!-- loď (koncová poloha) -->
<g class="lod">
<!-- nástavba -->
<rect x="380" y="172" width="110" height="58" fill="#f1f3f5" stroke="#2b2a26" stroke-width="2"/>
<rect x="452" y="140" width="26" height="32" fill="#fab005" stroke="#2b2a26" stroke-width="2"/>
<rect x="392" y="188" width="20" height="14" fill="#a5d8ff" stroke="#2b2a26" stroke-width="1"/>
<rect x="422" y="188" width="20" height="14" fill="#a5d8ff" stroke="#2b2a26" stroke-width="1"/>
<rect x="452" y="188" width="20" height="14" fill="#a5d8ff" stroke="#2b2a26" stroke-width="1"/>
<!-- trup v řezu: tenká ocelová skořepina (4 px), uvnitř vzduch, dvě tenké přepážky -->
<path d="M50,230 L560,230 L520,360 L100,360 Z" fill="#ffffff" stroke="#343a40" stroke-width="4" stroke-linejoin="round"/>
<line x1="240" y1="232" x2="240" y2="358" stroke="#343a40" stroke-width="2"/>
<line x1="380" y1="232" x2="380" y2="358" stroke="#343a40" stroke-width="2"/>
<text x="165" y="310" font-size="22" fill="#212529" text-anchor="middle">vzduch</text>
<text x="310" y="310" font-size="22" fill="#212529" text-anchor="middle">vzduch</text>
<text x="450" y="310" font-size="22" fill="#212529" text-anchor="middle">vzduch</text>
<line x1="72" y1="234" x2="64" y2="190" stroke="#2b2a26" stroke-width="2"/>
<text x="24" y="182" font-size="22" fill="#212529">ocelový trup</text>
</g>
<text x="30" y="400" font-size="22" fill="#0b3d6b">voda: 1 000 kg/m³</text>
<text x="30" y="428" font-size="22" fill="#0b3d6b">ocel: asi 7 800 kg/m³</text>
<text x="30" y="460" font-size="22" font-weight="bold" fill="#0b3d6b">průměrná hustota lodi &lt; 1 000 kg/m³</text>
</svg>
