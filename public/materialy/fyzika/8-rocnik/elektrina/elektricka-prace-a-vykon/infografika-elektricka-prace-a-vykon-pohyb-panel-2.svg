<svg xmlns="http://www.w3.org/2000/svg" width="460" height="600" viewBox="0 0 460 600" role="img" aria-label="Elektrická práce a výkon v pohybu, teplo: ztráta, nebo užitek?: Vlevo stolní lampa se stínidlem a klasickou žárovkou, vpravo terárium s žárovkou nahoře a ještěrkou na písku. Lampa i žárovka terária jsou zapojené kabelem do zásuvky. Ruka zapne lampu: žárovka svítí a hřeje. U lampy chceme světlo, takže světlo je užitek a teplo ztráta. Druhá ruka zapne žárovku v teráriu, ještěrka přeleze pod ni a ohřívá se: tady je teplo užitek. Co je užitek, záleží na účelu. Pak ruce obě žárovky vypnou.">
<title>Elektrická práce a výkon v pohybu 2/2: Teplo: ztráta, nebo užitek?</title>
<!-- W114 (oprava po kontrole 1, 15. 10. 2026). Opora: výklad oddíl 6 „Ztrátami nazýváme energii, kterou nevyužijeme k zamýšlenému účelu“, „U topidla je naopak ohřívání žádoucí. Proto musíme nejprve říct, co považujeme za užitečný výsledek.“; Pro zvídavé „Klasická žárovka mění velkou část energie na teplo“, „V teráriu může být žádoucí i teplo žárovky.“; PDF 31, s. 6 „používají se jen v teráriích pro teplomilná zvířata“. Čísla záměrně žádná (5 %/95 % má obr-06). Žárovka jako W107; lampa se stínidlem, kabel do zásuvky, ruka a tlačítko jako W108 (oprava po W114-kontrola-1, nález 3: i žárovka terária má kabel do zásuvky). Panel 1/3 (akumulátor) vyřazen pro zdvojení s obr-02 (nález 1), panely přečíslovány. Cyklus 16 s: 1,9 s lampa zapnuta, 5,9 s terárium zapnuto, 6,4–8,4 ještěrka pod žárovku, 10,0 závěr, 13,9 obě vypnuty, 14,4–15,8 ještěrka zpět. Bez pohybu: obě svítí, ještěrka pod žárovkou, všechny texty. -->
