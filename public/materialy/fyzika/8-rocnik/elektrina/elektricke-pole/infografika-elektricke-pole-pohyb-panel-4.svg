  <g class="electron-b"><circle cx="187" cy="329" r="10" fill="#1864ab" stroke="#2b2a26" stroke-width="1.5"/><path d="M182 329H192" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
  <g class="grounded"><text x="181" y="181" font-size="24" font-weight="bold" fill="#9c1c1c">+</text><text x="216" y="181" font-size="24" font-weight="bold" fill="#9c1c1c">+</text></g>
  <g class="positive"><text x="181" y="181" font-size="24" font-weight="bold" fill="#9c1c1c">+</text></g>
  <path d="M382 349V365M364 365H400M370 374H394M377 383H387" stroke="#2b2a26" stroke-width="3" stroke-linecap="round"/>

  <rect x="36" y="410" width="388" height="108" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/>
  <g class="caption-a"><text x="52" y="452" font-size="20" font-weight="bold" fill="#2b2a26">Část elektronů odejde</text><text x="52" y="481" font-size="20" fill="#2b2a26">do Země.</text></g>
  <g class="caption-b"><text x="52" y="452" font-size="19" font-weight="bold" fill="#2b2a26">Nejdřív odtáhneme ruku,</text><text x="52" y="481" font-size="19" fill="#2b2a26">potom tyč.</text></g>
  <g class="caption-c"><text x="52" y="468" font-size="20" font-weight="bold" fill="#2b2a26">Elektroskop zůstane nabitý.</text></g>
  <rect class="loop-fade" x="20" y="16" width="420" height="524" rx="10" fill="#fbfaf6"/>
</svg>
