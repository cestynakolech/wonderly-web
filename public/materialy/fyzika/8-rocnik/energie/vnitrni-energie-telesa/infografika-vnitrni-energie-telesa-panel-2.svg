<svg viewBox="0 626 460 450" width="460" height="450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Teplota a částice: čím vyšší teplota, tím rychleji se částice pohybují. Studená voda: částice pomalé, čaj se mísí pomalu; horká voda: částice rychlé, mísí se rychle." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Vnitřní energie tělesa 2/7: Teplota a částice</title>
	<!-- Panel 2/7 výřezu z infografika-vnitrni-energie-telesa.svg (souřadnice beze změny, jen viewBox). -->
	<style>
		.cs { animation: jemne 2.4s linear infinite; }
		.hs { animation: silne 0.5s linear infinite; }
		.cs2, .hs2 { animation-delay: -0.8s; }
		.hs2 { animation-delay: -0.17s; }
		.cs3 { animation-delay: -1.6s; }
		.hs3 { animation-delay: -0.33s; }
		.dc, .dh { transform-box: fill-box; transform-origin: center; }
		.dc { animation: dc 6s ease-out infinite; }
		.dh { animation: dh 6s ease-out infinite; }
		.para { animation: para 2s ease-out infinite; }
		.para2 { animation-delay: -0.7s; }
		.para3 { animation-delay: -1.4s; }
		@keyframes jemne { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(2px, -1px); } 50% { transform: translate(-1px, 2px); } 75% { transform: translate(-2px, -1px); } }
		@keyframes silne { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(6px, -4px); } 50% { transform: translate(-4px, 6px); } 75% { transform: translate(-6px, -4px); } }
		@keyframes dc { 0% { transform: scale(0.4); } 100% { transform: scale(1); } }
		@keyframes dh { 0% { transform: scale(0.15); } 25%, 100% { transform: scale(1); } }
		@keyframes para { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-8px); opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.cs, .hs, .dc, .dh, .para { animation: none; }
		}
	</style>
	<defs>
		<clipPath id="vodaS"><polygon points="71.5,190 178.5,190 172,304 78,304" /></clipPath>
		<clipPath id="vodaH"><polygon points="281.5,190 388.5,190 382,304 288,304" /></clipPath>
	</defs>
	<rect x="0" y="626" width="460" height="450" fill="#f3f1ea" />
	<g id="panel-2" transform="translate(0,636)">
		<rect x="26" y="6" width="420" height="424" rx="10" fill="#2b2a26" />
		<rect x="20" y="0" width="420" height="424" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="34" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="41" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="43" font-size="28" font-weight="bold" fill="#2b2a26">Teplota a částice</text>

		<text x="230" y="80" text-anchor="middle" font-size="21" fill="#2b2a26">čím <tspan font-weight="bold">vyšší teplota</tspan>, tím <tspan font-weight="bold">rychleji</tspan></text>
		<text x="230" y="108" text-anchor="middle" font-size="21" fill="#2b2a26">se částice pohybují</text>

		<!-- pára nad horkou vodou -->
		<g fill="none" stroke="#868e96" stroke-width="3" stroke-linecap="round">
			<path class="para" d="M 318 158 q -6 -6 0 -12 q 6 -6 0 -12" />
			<path class="para para2" d="M 338 160 q -6 -6 0 -12 q 6 -6 0 -12" />
			<path class="para para3" d="M 358 158 q -6 -6 0 -12 q 6 -6 0 -12" />
		</g>

		<!-- deska stolu -->
		<rect x="34" y="304" width="392" height="14" fill="#c9a77c" stroke="#2b2a26" stroke-width="2" />
		<line x1="200" y1="311" x2="260" y2="311" stroke="#8d5a2b" stroke-width="2" />

		<!-- studená voda -->
		<polygon points="70,164 180,164 172,304 78,304" fill="#f1f3f5" />
		<polygon points="71.5,190 178.5,190 172,304 78,304" fill="#d0ebff" />
		<g clip-path="url(#vodaS)"><ellipse class="dc" cx="115" cy="250" rx="30" ry="26" fill="#8d5a2b" opacity="0.45" /></g>
		<line x1="71.5" y1="190" x2="178.5" y2="190" stroke="#1864ab" stroke-width="2" />
		<rect x="100" y="224" width="30" height="36" rx="3" fill="#e9d8a6" stroke="#8d5a2b" stroke-width="2" />
		<path d="M 115 224 L 180 165 L 189 182" fill="none" stroke="#495057" stroke-width="1.5" />
		<rect x="181" y="182" width="16" height="18" fill="#fff" stroke="#495057" stroke-width="1.5" />
		<g fill="#0c8599" stroke="#2b2a26" stroke-width="1.5">
			<circle class="cs" cx="92" cy="282" r="7" />
			<circle class="cs cs2" cx="155" cy="219" r="7" />
			<circle class="cs cs3" cx="156" cy="282" r="7" />
		</g>
		<polygon points="70,164 180,164 172,304 78,304" fill="none" stroke="#495057" stroke-width="2.5" stroke-linejoin="round" />

		<!-- horká voda -->
		<polygon points="280,164 390,164 382,304 288,304" fill="#f1f3f5" />
		<polygon points="281.5,190 388.5,190 382,304 288,304" fill="#ffe3e3" />
		<g clip-path="url(#vodaH)"><ellipse class="dh" cx="325" cy="250" rx="110" ry="90" fill="#8d5a2b" opacity="0.45" /></g>
		<line x1="281.5" y1="190" x2="388.5" y2="190" stroke="#c92a2a" stroke-width="2" />
		<rect x="310" y="224" width="30" height="36" rx="3" fill="#e9d8a6" stroke="#8d5a2b" stroke-width="2" />
		<path d="M 325 224 L 390 165 L 399 182" fill="none" stroke="#495057" stroke-width="1.5" />
		<rect x="391" y="182" width="16" height="18" fill="#fff" stroke="#495057" stroke-width="1.5" />
		<g fill="#0c8599" stroke="#2b2a26" stroke-width="1.5">
			<circle class="hs" cx="304" cy="282" r="7" />
			<circle class="hs hs2" cx="365" cy="219" r="7" />
			<circle class="hs hs3" cx="366" cy="282" r="7" />
		</g>
		<polygon points="280,164 390,164 382,304 288,304" fill="none" stroke="#495057" stroke-width="2.5" stroke-linejoin="round" />

		<text x="125" y="348" text-anchor="middle" font-size="21" font-weight="bold" fill="#1864ab">studená voda</text>
		<text x="335" y="348" text-anchor="middle" font-size="21" font-weight="bold" fill="#c92a2a">horká voda</text>
		<text x="125" y="376" text-anchor="middle" font-size="21" fill="#2b2a26">částice pomalé</text>
		<text x="335" y="376" text-anchor="middle" font-size="21" fill="#2b2a26">částice rychlé</text>
		<text x="125" y="404" text-anchor="middle" font-size="21" fill="#495057">čaj se mísí pomalu</text>
		<text x="335" y="404" text-anchor="middle" font-size="21" fill="#495057">mísí se rychle</text>
	</g>
</svg>
