<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Jaderné síly. V jádře jsou dva protony a dva neutrony. Protony se elektrickou silou odpuzují, dva protony silou asi 230 N. Jaderné síly je přitahují a jsou silnější, proto jádro drží pohromadě. Jaderné síly působí jen na krátkou vzdálenost uvnitř jádra; čím je jádro větší, tím je méně stabilní. Animace: protony se začnou odpuzovat, jaderné síly je vrátí zpět.">
<style>
.pl { animation: pl 6s ease-in-out infinite; } @keyframes pl { 0%, 8% { transform: translate(0, 0); } 30% { transform: translate(-14px, 0); } 52%, 100% { transform: translate(0, 0); } }
.pp { animation: pp 6s ease-in-out infinite; } @keyframes pp { 0%, 8% { transform: translate(0, 0); } 30% { transform: translate(14px, 0); } 52%, 100% { transform: translate(0, 0); } }
.se { animation: se 6s linear infinite; } @keyframes se { 0%, 4% { opacity: 0; } 10%, 100% { opacity: 1; } }
.sj { animation: sj 6s linear infinite; } @keyframes sj { 0%, 26% { opacity: 0; } 32%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pl, .pp, .se, .sj { animation: none; } }
/* Předloha: PDF lekce 17, s. 12 (text, bez obrázku) – jaderné síly: přitažlivé, jen na krátkou vzdálenost (v jádře),
   překonávají odpudivou elektrickou sílu mezi protony (2 protony asi 230 N); čím větší atom, tím méně stabilní.
   Uspořádání jádra a barvy jako obr-01. Smyčka 6 s: protony se odpuzují a vzdalují (oranžové šipky ven),
   pak se objeví zelené vazby jaderných sil (jen uvnitř jádra) a protony se vrátí. Bez animace = obě síly vidět, jádro v klidu. */
</style>
<rect x="3" y="3" width="594" height="614" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<text x="300" y="42" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Co drží jádro pohromadě</text>
<defs><marker id="sipE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e8590c"/></marker><marker id="sipJ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2b8a3e"/></marker></defs><circle cx="300" cy="220" r="112" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/><g class="sj" fill="none" stroke="#2b8a3e" stroke-width="7" stroke-linecap="round"><path d="M250 220L300 160L350 220L300 280Z"/><path d="M250 220H350M300 160V280"/></g><circle cx="300" cy="160" r="28" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><circle cx="300" cy="280" r="28" fill="#adb5bd" stroke="#212529" stroke-width="1.5"/><g class="pl"><g><circle cx="250" cy="220" r="28" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M234.6 220H265.4M250 204.6V235.4" stroke="#fff" stroke-width="5.6" stroke-linecap="round"/></g><path class="se" d="M216 220H146" stroke="#e8590c" stroke-width="8" marker-end="url(#sipE)"/></g><g class="pp"><g><circle cx="350" cy="220" r="28" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M334.6 220H365.4M350 204.6V235.4" stroke="#fff" stroke-width="5.6" stroke-linecap="round"/></g><path class="se" d="M384 220H454" stroke="#e8590c" stroke-width="8" marker-end="url(#sipE)"/></g><text x="100" y="160" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">elektrická síla</text><text x="100" y="184" font-size="20" fill="#212529" text-anchor="middle">odpuzuje</text><text x="500" y="160" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">elektrická síla</text><text x="500" y="184" font-size="20" fill="#212529" text-anchor="middle">odpuzuje</text><path d="M190 330L268 252" stroke="#212529" stroke-width="2"/><circle cx="268" cy="252" r="4" fill="#212529"/><text x="150" y="362" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">jaderné síly přitahují</text><path d="M44 410H104" stroke="#e8590c" stroke-width="8" marker-end="url(#sipE)"/><text x="120" y="418" font-size="20" fill="#212529" text-anchor="start">dva protony se odpuzují silou asi <tspan font-weight="bold">230 N</tspan></text><path d="M48 450H104" stroke="#2b8a3e" stroke-width="7" stroke-linecap="round"/><text x="120" y="458" font-size="20" fill="#212529" text-anchor="start">jaderné síly jsou silnější – drží jádro</text><rect x="22" y="484" width="556" height="112" rx="12" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/><text x="300" y="517" font-size="20" fill="#212529" text-anchor="middle">Jaderné síly působí jen na krátkou vzdálenost,</text><text x="300" y="547" font-size="20" fill="#212529" text-anchor="middle">pouze uvnitř jádra. Čím je jádro větší,</text><text x="300" y="577" font-size="20" fill="#212529" text-anchor="middle">tím je méně stabilní.</text>
</svg>
