<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 585" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Schéma: nahoře šipka proudu od plusu k mínusu. Vlevo rámeček kov, v něm volné elektrony s šipkami jedním směrem. Uprostřed rámeček kapalina jen s ionty: kationty plus se šipkami doleva a anionty mínus se šipkami doprava, bez elektronů. Vpravo rámeček plyn: kationty, anionty i elektrony. Dole vzorec I = Q : t s popisky elektrický proud, elektrický náboj, čas.">
