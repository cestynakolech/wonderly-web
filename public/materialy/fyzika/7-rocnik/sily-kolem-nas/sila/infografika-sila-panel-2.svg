<svg xmlns="http://www.w3.org/2000/svg" width="460" height="630" viewBox="0 0 460 630" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Síla se značí F, jednotkou je newton (N), měří se siloměrem. Siloměr visí na stojanu, ruka táhne za háček dolů. Uvnitř je pružina a stupnice od 0 do 5 N. Čím větší síla, tím víc se pružina natáhne.">
