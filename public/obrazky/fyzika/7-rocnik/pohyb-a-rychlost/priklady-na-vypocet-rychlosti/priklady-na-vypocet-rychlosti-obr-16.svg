<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 550" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Výpočet průměrné rychlosti autobusu: 12 km za 12 min je 60 km/h">
<defs>
<marker id="a-cer" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e03131"/></marker>
<marker id="a-mod" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#1971c2"/></marker>
<marker id="a-zel" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2f9e44"/></marker>
<marker id="a-ora" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#e8590c"/></marker>
<marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#2b2a26"/></marker>
<marker id="a-sed" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#495057"/></marker>
<marker id="a-fia" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#7048e8"/></marker>
</defs>
<rect x="3" y="3" width="894" height="544" rx="14" fill="#f8f9fa" stroke="#2b2a26" stroke-width="3"/>
<text x="450.0" y="44.0" font-size="26" font-weight="bold" fill="#2b2a26" text-anchor="middle">Průměrná rychlost autobusu</text>
<text x="50.0" y="96.0" font-size="24" fill="#2b2a26" text-anchor="start">s = 12 km</text>
<text x="50.0" y="130.0" font-size="24" fill="#2b2a26" text-anchor="start">t = 10:52 − 10:40 = 12 min</text>
<text x="50.0" y="200.0" font-size="26" font-weight="bold" fill="#2b2a26" text-anchor="start">v = s : t</text>
<text x="50.0" y="262.0" font-size="26" font-weight="bold" fill="#2b2a26" text-anchor="start">v =</text>
<text x="160.0" y="244.0" font-size="26" fill="#2b2a26" text-anchor="middle">12 km</text>
<line x1="112.0" y1="256.0" x2="208.0" y2="256.0" stroke="#2b2a26" stroke-width="3" stroke-linecap="round"/>
<text x="160.0" y="290.0" font-size="26" fill="#2b2a26" text-anchor="middle">12 min</text>
<text x="224.0" y="262.0" font-size="26" font-weight="bold" fill="#2b2a26" text-anchor="start">= 1 km/min</text>
<path d="M470,247 L420,250 L470,273 z" fill="#fff3bf" stroke="#f08c00" stroke-width="2" stroke-linejoin="round"/>
<rect x="470.0" y="200.0" width="400.0" height="120.0" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
<rect x="467" y="249" width="6" height="22" fill="#fff3bf"/>
<text x="670.0" y="240.0" font-size="20" fill="#2b2a26" text-anchor="middle">Rychlost chceme v km/h.</text>
<text x="670.0" y="267.0" font-size="20" fill="#2b2a26" text-anchor="middle">1 h = 60 min, tedy za hodinu</text>
<text x="670.0" y="294.0" font-size="20" fill="#2b2a26" text-anchor="middle">autobus ujede 60 krát víc.</text>
<text x="50.0" y="380.0" font-size="28" font-weight="bold" fill="#1971c2" text-anchor="start">v = 1 km/min · 60 = 60 km/h</text>
<line x1="50.0" y1="415.0" x2="850.0" y2="415.0" stroke="#ced4da" stroke-width="2" stroke-linecap="round"/>
<rect x="120.0" y="440.0" width="660.0" height="76.0" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="3"/>
<text x="450.0" y="488.0" font-size="25" font-weight="bold" fill="#2b2a26" text-anchor="middle">Autobus jede průměrnou rychlostí 60 km/h.</text>
