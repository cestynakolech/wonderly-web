<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 616" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Hadicová vodováha: dvě skleněné trubice se stupnicí spojené hadicí s vodou. Hladiny v obou trubicích jsou ve stejné výšce, čárkovaná čára to ukazuje. Animace: pravou trubici zvedáme a spouštíme, hladina zůstává pořád ve stejné výšce jako vlevo.">
<style>
.pr { animation: pr 10s ease-in-out infinite; } @keyframes pr { 0%, 10% { transform: translateY(0); } 30%, 45% { transform: translateY(-50px); } 65%, 80% { transform: translateY(30px); } 100% { transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .pr { animation: none; } }
/* Předloha: PDF Skupenství látek, obrázek vodováhy (dvě trubice se stupnicí, hadice, čárkovaná čára). Překresleno; animace posunu pravé trubice ±50/30 px, voda drží výšku hladiny. Bez animace = obě trubice vedle sebe ve stejné výšce. */
</style>
