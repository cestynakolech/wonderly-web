<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dvě postavy se dotýkají odkrytého vodiče. Vlevo suché ruce a suchá izolační obuv na suché podlaze: odpor člověka v suchu a v suché obuvi je asi 150 000 ohmů, tělem projde jen slabý proud. Vpravo mokré ruce a bosé nohy na mokré zemi: odpor člověka ve vlhku a ve vlhké obuvi je asi 2 000 ohmů, proudu projde mnohem víc. Pro 230 V a 2 000 ohmů vychází 115 mA. Ani suché ruce a boty nejsou zárukou bezpečí.">
