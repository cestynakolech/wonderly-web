<svg viewBox="0 0 460 660" width="460" height="660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sluneční soustava v pohybu 2/3, Meteorický roj: noční obloha nad krajinou, pozorovatel se dívá nahoru. Meteory jeden po druhém přelétnou po obloze. Když jejich stopy prodloužíme zpět, všechny vycházejí ze stejného místa na obloze. Meteory roje přilétají ve stejnou dobu ze stejného směru na obloze. Roj má jméno podle souhvězdí, odkud meteory přilétají: Perseidy v srpnu přilétají ze souhvězdí Persea. Hvězdy souhvězdí jsou jen naznačené." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Sluneční soustava v pohybu 2/3: Meteorický roj</title>
	<!-- W84 (14. 10. 2026). Předloha: PDF 22 Sluneční soustava, s. 20–21 (Meteorické roje: „v srpnu … Perseidy, v listopadu Leonidy“,
	     „název nesou podle souhvězdí, odkud je vidíme na obloze přicházet“; foto Perseid na noční obloze) + s. 20 (meteor = „padající hvězda“).
	     Výklad: „Meteorické roje — meteory přicházející ve stejnou dobu ze stejného směru na obloze. Jmenují se podle souhvězdí, odkud přilétají,
	     třeba Perseidy (srpen) nebo Leonidy (listopad).“ obr-08 kreslí jeden meteoroid → meteor → meteorit z boku; tady je pohled pozorovatele
	     na oblohu a společný směr roje (na stránce dosud není). Hvězdy souhvězdí jen naznačené (ne skutečný obrazec Persea) – napsáno v textu.
	     Cyklus 6 s: každou 1 s přelétne jeden meteor (0,96 s, 110 px), stopy od společného místa čárkovaně (stále, i bez pohybu).
	     Bez pohybu = všech 6 meteorů naráz uprostřed dráhy. -->
	<style>
		.m { opacity: 0; animation: mt 6s linear infinite; }
		@keyframes mt { 0% { opacity: 0; transform: translate(40px, 0px); } 4% { opacity: 1; } 13% { opacity: 1; } 16% { opacity: 0; transform: translate(150px, 0px); } 100% { opacity: 0; transform: translate(150px, 0px); } }
		.d1 { animation-delay: 1s; } .d2 { animation-delay: 2s; } .d3 { animation-delay: 3s; } .d4 { animation-delay: 4s; } .d5 { animation-delay: 5s; }
		@media (prefers-reduced-motion: reduce) {
			.m { animation: none; opacity: 1; transform: translate(110px, 0px); }
		}
	</style>
	<defs>
		<linearGradient id="gm" gradientUnits="userSpaceOnUse" x1="-64" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fff3bf" stop-opacity="0" /><stop offset="1" stop-color="#fff9db" /></linearGradient>
		<g id="met"><line x1="-64" y1="0" x2="0" y2="0" stroke="url(#gm)" stroke-width="6" stroke-linecap="round" /><circle r="5" fill="#fff9db" /></g>
		<path id="hv" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6Z" fill="#f8f9fa" />
	</defs>
	<rect x="0" y="0" width="460" height="660" fill="#f8f9fa" />
	<g id="panel-2">
		<rect x="26" y="22" width="420" height="628" rx="10" fill="#2b2a26" />
		<rect x="20" y="16" width="420" height="628" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="50" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="57" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">2</text>
		<text x="80" y="59" font-size="26" font-weight="bold" fill="#2b2a26">Meteorický roj</text>

		<!-- noční obloha -->
		<rect x="40" y="82" width="380" height="320" rx="10" fill="#0f1b3d" />
		<circle cx="70" cy="110" r="1.5" fill="#dee2e6" /><circle cx="400" cy="108" r="1.5" fill="#dee2e6" /><circle cx="330" cy="140" r="1.5" fill="#dee2e6" />
		<circle cx="90" cy="250" r="1.5" fill="#dee2e6" /><circle cx="404" cy="290" r="1.5" fill="#dee2e6" /><circle cx="150" cy="300" r="1.5" fill="#dee2e6" />
		<circle cx="340" cy="320" r="1.5" fill="#dee2e6" /><circle cx="60" cy="180" r="1.5" fill="#dee2e6" />

		<!-- souhvězdí (naznačené) a místo, odkud roj přilétá -->
		<text x="250" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#f8f9fa">souhvězdí Persea</text>
		<use href="#hv" x="232" y="134" /><use href="#hv" x="266" y="130" /><use href="#hv" x="278" y="160" /><use href="#hv" x="236" y="172" /><use href="#hv" x="218" y="150" />

		<!-- stopy meteorů prodloužené zpět: všechny ze stejného místa -->
		<g stroke="#adb5bd" stroke-width="2" stroke-dasharray="5 6" fill="none">
			<path d="M244 155L127 253" /><path d="M256 155L373 253" /><path d="M242 152L95 191" />
			<path d="M252 158L291 305" /><path d="M258 152L405 191" /><path d="M247 157L182 295" />
		</g>

		<!-- meteory: jeden za druhým, každý letí od společného místa ven -->
		<g transform="translate(250,150) rotate(140)"><g class="m"><use href="#met" /></g></g>
		<g transform="translate(250,150) rotate(40)"><g class="m d1"><use href="#met" /></g></g>
		<g transform="translate(250,150) rotate(165)"><g class="m d2"><use href="#met" /></g></g>
		<g transform="translate(250,150) rotate(75)"><g class="m d3"><use href="#met" /></g></g>
		<g transform="translate(250,150) rotate(15)"><g class="m d4"><use href="#met" /></g></g>
		<g transform="translate(250,150) rotate(115)"><g class="m d5"><use href="#met" /></g></g>

		<!-- krajina a pozorovatel -->
		<path d="M40 338 Q120 318 210 334 T420 328 V392 A10 10 0 0 1 410 402 H50 A10 10 0 0 1 40 392 Z" fill="#2f3b2f" stroke="#868e96" stroke-width="2" />
		<g fill="#ced4da">
			<circle cx="92" cy="300" r="7" />
			<path d="M86 309 H98 L100 330 H84 Z" />
			<path d="M97 312 L112 290" stroke="#ced4da" stroke-width="4" stroke-linecap="round" />
			<path d="M88 330 L86 336 M96 330 L98 336" stroke="#ced4da" stroke-width="4" stroke-linecap="round" />
		</g>
		<path d="M150 381 H178" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5 6" />
		<text x="186" y="388" font-size="20" fill="#f8f9fa">= odkud meteory letí</text>

		<text x="40" y="440" font-size="20" fill="#2b2a26">Meteory roje přilétají ve stejnou</text>
		<text x="40" y="466" font-size="20" fill="#2b2a26">dobu ze stejného směru na obloze.</text>
		<text x="40" y="502" font-size="20" fill="#2b2a26">Roj má jméno podle souhvězdí,</text>
		<text x="40" y="528" font-size="20" fill="#2b2a26">odkud meteory přilétají.</text>
		<text x="40" y="566" font-size="21" font-weight="bold" fill="#2b2a26">Perseidy (srpen) přilétají</text>
		<text x="40" y="592" font-size="21" font-weight="bold" fill="#2b2a26">ze souhvězdí Persea.</text>
		<text x="40" y="626" font-size="20" fill="#495057">Hvězdy souhvězdí jsou jen naznačené.</text>
	</g>
</svg>
