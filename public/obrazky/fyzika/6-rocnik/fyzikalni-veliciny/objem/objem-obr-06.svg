<g class="v2"><rect x="450" y="90" width="220" height="80" rx="6" fill="#fff" stroke="#e8590c" stroke-width="3"/><text x="560" y="122" font-size="21" fill="#212529" text-anchor="middle">objem vody s tělesem</text><text x="560" y="156" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">V<tspan font-size="16" dy="6">2</tspan><tspan dy="-6"> = 13 ml</tspan></text></g>
<g class="kota"><path d="M286 422H474M286 342H474" stroke="#868e96" stroke-width="2.5" stroke-dasharray="10 7"/><path d="M380 356V408" stroke="#c92a2a" stroke-width="4"/><path d="M370 360L380 344L390 360ZM370 404L380 420L390 404Z" fill="#c92a2a"/><text x="404" y="394" font-size="34" font-weight="bold" fill="#c92a2a">V</text></g>
<g class="vys"><rect x="130" y="600" width="540" height="96" rx="6" fill="#fff" stroke="#e8590c" stroke-width="3"/><text x="400" y="636" font-size="21" fill="#212529" text-anchor="middle">objem tělesa</text><text x="400" y="676" font-size="26" font-weight="bold" fill="#c92a2a" text-anchor="middle">V = V<tspan font-size="16" dy="6">2</tspan><tspan dy="-6"> − </tspan>V<tspan font-size="16" dy="6">1</tspan><tspan dy="-6"> = 13 ml − 8 ml = 5 ml</tspan></text></g>

</svg>
