<svg viewBox="0 0 460 520" width="460" height="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tělesa a látky v pohybu, Dá se to spočítat?: ruka přináší a pokládá na stůl jeden hřebík po druhém a nad každým se objeví číslo 1, 2, 3. Tři hřebíky – hřebík je těleso. Z čeho je hřebík? Ze železa. Železo spočítat nejde – je to látka." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Tělesa a látky v pohybu 2/2: Dá se to spočítat?</title>
	<!-- W104 (oprava po kontrole 1). Předloha: PDF 6/01 Látka/2. Tělesa a látky, s. 2 (těleso: „hřebík (ze železa)“; látka: železo); výklad temata.ts („Dá se to spočítat? Tělesa ano — dvě sklenice, tři hřebíky. U látky to nedává smysl“; „Jde se toho zeptat ‚z čeho je to?‘ U tělesa ano“). Hřebík převzat z obr-04 (měřítko 0.75, náklon 6.84° — hlavička i hrot leží na desce). Ruka nese hřebík zprava, paže vychází z pravého okraje panelu, hřebík je mimo ruku jen ležící na stole. Cyklus 10 s: hřebík 1/2/3 přinesen 0,3–0,75 / 1,8–2,25 / 3,3–3,75 s, položen do 0,95 / 2,45 / 3,95 s, ruka se zvedne a odejde zprava do 1,5 / 3,0 / 4,5 s, teprve pak číslo 1/2/3; 4,7 s „Tři hřebíky. Hřebík je těleso.“; 6,5 s štítek „látka: železo“ a otázka „Z čeho je hřebík?“. Klid: tři hřebíky, čísla, vše vysvětleno, ruka mimo panel. -->
	<style>
		.p2ru { transform: translate(482.8px, 238.2px); animation: p2ru 10s ease-in-out infinite; }
		@keyframes p2ru { 0% { transform: translate(482.8px, 238.2px); } 3% { transform: translate(482.8px, 238.2px); } 7.5% { transform: translate(62.8px, 238.2px); } 9.5%, 10.5% { transform: translate(62.8px, 278.2px); } 11.5% { transform: translate(62.8px, 238.2px); } 15% { transform: translate(482.8px, 238.2px); } 18% { transform: translate(482.8px, 238.2px); } 22.5% { transform: translate(192.8px, 238.2px); } 24.5%, 25.5% { transform: translate(192.8px, 278.2px); } 26.5% { transform: translate(192.8px, 238.2px); } 30% { transform: translate(482.8px, 238.2px); } 33% { transform: translate(482.8px, 238.2px); } 37.5% { transform: translate(322.8px, 238.2px); } 39.5%, 40.5% { transform: translate(322.8px, 278.2px); } 41.5% { transform: translate(322.8px, 238.2px); } 45% { transform: translate(482.8px, 238.2px); } 100% { transform: translate(482.8px, 238.2px); } }
		.p2h0 { transform: translate(100.0px, 282.7px); animation: p2h0 10s ease-in-out infinite; }
