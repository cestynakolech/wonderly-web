<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Schéma obvodu: článek, spínač, žárovka a ampérmetr jsou zapojené za sebou v jedné proudové cestě. Voltmetr je připojený ke dvěma bodům na koncích žárovky. Animace: spínač se zavře a žárovka se rozsvítí; nejdřív se zvýrazní proudová cesta s ampérmetrem, potom připojení voltmetru mezi konce žárovky; pak se spínač zase otevře.">
<style>
/* Předloha: PDF Ohmův zákon, s. 2 (schéma: článek, spínač, žárovka, voltmetr připojený mezi konce žárovky, ampérmetr v proudové cestě).
   10 s: 0–20 % spínač otevřený, žárovka nesvítí; 20–23 % spínač se zavře; 23–91 % žárovka svítí;
   28–58 % zvýrazněna proudová cesta s ampérmetrem (žlutý pruh + věta); 60–89 % zvýrazněno připojení voltmetru mezi konce žárovky (tyrkysový pruh + věta);
   91–94 % spínač se otevře. Bez animace (reduced-motion) = koncový stav: spínač zavřený, žárovka svítí, obě zvýraznění vidět. */
.ps { animation: ps 10s ease-in-out infinite; }
@keyframes ps { 0%, 20% { transform: rotate(-24deg); } 23%, 91% { transform: rotate(0deg); } 94%, 100% { transform: rotate(-24deg); } }
.lit, .sz { animation: sv 10s step-end infinite; }
.so { opacity: 0; animation: tm 10s step-end infinite; }
@keyframes sv { 0% { opacity: 0; } 23% { opacity: 1; } 92% { opacity: 0; } }
@keyframes tm { 0% { opacity: 1; } 23% { opacity: 0; } 92% { opacity: 1; } }
.pa { animation: pa 10s linear infinite; }
.pv { animation: pv 10s linear infinite; }
@keyframes pa { 0%, 28% { opacity: 0; } 31%, 55% { opacity: 1; } 58%, 100% { opacity: 0; } }
@keyframes pv { 0%, 60% { opacity: 0; } 63%, 86% { opacity: 1; } 89%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ps, .lit, .sz, .so, .pa, .pv { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="714" rx="14" fill="#f8f9fa"/>
<text x="300" y="42" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Měření proudu a napětí žárovky</text><path class="pa" d="M70 250H530V470H70Z" fill="none" stroke="#ffe066" stroke-width="20" stroke-linejoin="round"/><path class="pv" d="M150 250V130H310V250" fill="none" stroke="#96f2d7" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 470V250H196M264 250H376M444 250H530V470H392M370 470H244M164 470H70" fill="none" stroke="#212529" stroke-width="4" stroke-linecap="square"/><path d="M150 250V130H196M264 130H310V250" fill="none" stroke="#212529" stroke-width="4" stroke-linecap="square"/><circle cx="150" cy="250" r="7" fill="#212529"/><circle cx="310" cy="250" r="7" fill="#212529"/><g class="lit"><path d="M267.9 265.7L279 270.3" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/><path d="M245.7 287.9L250.3 299" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/><path d="M214.3 287.9L209.7 299" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/><path d="M192.1 265.7L181 270.3" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/><path d="M192.1 234.3L181 229.7" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/><path d="M214.3 212.1L209.7 201" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/><path d="M245.7 212.1L250.3 201" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/><path d="M267.9 234.3L279 229.7" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/><circle cx="230" cy="250" r="34" fill="#ffd43b"/></g><circle cx="230" cy="250" r="34" fill="none" stroke="#212529" stroke-width="4"/><path d="M206 226L254 274M254 226L206 274" stroke="#212529" stroke-width="4"/><text x="230" y="330" font-size="22" fill="#212529" text-anchor="middle">žárovka</text><circle cx="230" cy="130" r="34" fill="#fff" stroke="#212529" stroke-width="4"/><text x="230" y="143" font-size="36" font-weight="bold" fill="#212529" text-anchor="middle">V</text><text x="330" y="138" font-size="22" fill="#212529" text-anchor="start">voltmetr</text><circle cx="410" cy="250" r="34" fill="#fff" stroke="#212529" stroke-width="4"/><text x="410" y="263" font-size="36" font-weight="bold" fill="#212529" text-anchor="middle">A</text><text x="410" y="318" font-size="22" fill="#212529" text-anchor="middle">ampérmetr</text><path d="M392 428V512" stroke="#212529" stroke-width="4"/><path d="M370 448V492" stroke="#212529" stroke-width="9"/><path d="M402 420H418M410 412V428" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><path d="M344 436H360" stroke="#1864ab" stroke-width="4" stroke-linecap="round"/><text x="381" y="548" font-size="22" fill="#212529" text-anchor="middle">článek</text><circle cx="170" cy="470" r="6" fill="#fff" stroke="#212529" stroke-width="3"/><circle cx="238" cy="470" r="6" fill="#fff" stroke="#212529" stroke-width="3"/><path class="ps" style="transform-origin:170px 470px" d="M176 468L240 464" stroke="#212529" stroke-width="4" stroke-linecap="round"/><text x="204" y="512" font-size="22" fill="#212529" text-anchor="middle">spínač</text><path d="M20 572H580" stroke="#ced4da" stroke-width="2"/><text x="300" y="610" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle" class="sz">Spínač zavřený: žárovka svítí.</text><text x="300" y="610" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle" class="so">Spínač otevřený: proud neprochází.</text><rect class="pa" x="40" y="628" width="520" height="34" rx="8" fill="#ffe066"/><text x="300" y="652" font-size="22" fill="#212529" text-anchor="middle">Ampérmetr zapojujeme do proudové cesty.</text><rect class="pv" x="40" y="668" width="520" height="34" rx="8" fill="#96f2d7"/><text x="300" y="692" font-size="22" fill="#212529" text-anchor="middle">Voltmetr připojujeme mezi konce žárovky.</text></svg>
