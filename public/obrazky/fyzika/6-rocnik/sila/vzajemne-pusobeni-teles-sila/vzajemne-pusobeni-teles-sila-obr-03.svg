<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace pružinového siloměru: nahoře kroužek a hlavička s jednotkou [N], v okénku pružina, dole trubička se stupnicí 0 až 40 a háček. Bez síly ukazuje u okraje pouzdra 0 N. Ruka chytí háček a táhne dolů, pružina se protáhne, trubička vyjede a siloměr ukazuje 20 N.">
<style>
/* Předloha: PDF Vzájemné působení těles, síla – kresba trubičkového siloměru (kroužek, [N], pružina v okénku, stupnice 10–40, háček). Překresleno, děj tahu animován. Stupnice 4 px na 1 N. Bez animace = stav 20 N. */
/* cyklus 8 s: 0–22 % klid (0 N), 22–30 % ruka chytí háček, 30–52 % táhne dolů (20 N), drží do 86 %, 86–96 % povolí */
@keyframes tah { 0%, 30% { transform: translateY(0px); } 52%, 86% { transform: translateY(80px); } 96%, 100% { transform: translateY(0px); } }
@keyframes pruz { 0%, 30% { transform: scaleY(1); } 52%, 86% { transform: scaleY(1.7547); } 96%, 100% { transform: scaleY(1); } }
@keyframes ruka { 0%, 20% { opacity: 0; } 28%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
@keyframes nula { 0%, 30% { opacity: 1; } 36%, 90% { opacity: 0; } 96%, 100% { opacity: 1; } }
@keyframes dvacet { 0%, 46% { opacity: 0; } 52%, 86% { opacity: 1; } 92%, 100% { opacity: 0; } }
.tg { animation: tah 8s ease-in-out infinite; }
.pz { transform-origin: 0 0; animation: pruz 8s ease-in-out infinite; }
.rk { animation: ruka 8s linear infinite; }
.n0 { animation: nula 8s linear infinite; }
.n20 { animation: dvacet 8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .tg, .pz, .rk, .n0, .n20 { animation: none; } }
</style>
<defs><marker id="b-cer" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e03131"/></marker><marker id="b-mod" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#1971c2"/></marker><marker id="b-ora" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#e8590c"/></marker><marker id="b-sed" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#868e96"/></marker><marker id="m-sed" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#868e96"/></marker><linearGradient id="kov" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#343a40"/><stop offset="0.3" stop-color="#adb5bd"/><stop offset="0.55" stop-color="#868e96"/><stop offset="1" stop-color="#212529"/></linearGradient><linearGradient id="kovs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ced4da"/><stop offset="0.35" stop-color="#ffffff"/><stop offset="1" stop-color="#adb5bd"/></linearGradient><linearGradient id="hlav" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#495057"/><stop offset="0.35" stop-color="#e9ecef"/><stop offset="1" stop-color="#868e96"/></linearGradient><linearGradient id="sklo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a5b4bf"/><stop offset="0.4" stop-color="#f1f3f5"/><stop offset="1" stop-color="#ced4da"/></linearGradient><clipPath id="okno"><rect x="176" y="172" width="48" height="94"/></clipPath></defs>
<rect x="3" y="3" width="594" height="654" rx="14" fill="#f8f9fa"/>
<text x="300" y="42" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Pružinový siloměr</text><rect x="176" y="172" width="48" height="94" fill="url(#sklo)"/><g clip-path="url(#okno)"><g transform="translate(0 164)"><g class="pz" transform="scale(1 1.7547)"><g transform="translate(0 -164)"><path d="M200,164 L216,169.9 L184,175.8 L216,181.7 L184,187.6 L216,193.4 L184,199.3 L216,205.2 L184,211.1 L216,217 L184,222.9 L216,228.8 L184,234.7 L216,240.6 L184,246.4 L216,252.3 L184,258.2 L216,264.1 L200,270" fill="none" stroke="#212529" stroke-width="4.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g></g></g></g><g class="tg" transform="translate(0 80)"><rect x="172" y="262" width="56" height="208" rx="3" fill="url(#kovs)" stroke="#495057" stroke-width="2"/><path d="M172 440h14 M228 440h-14" stroke="#212529" stroke-width="2.4"/><text x="200" y="459" font-size="17" font-weight="bold" fill="#212529" text-anchor="middle">0</text><path d="M172 420h8 M228 420h-8" stroke="#212529" stroke-width="2.4"/><path d="M172 400h14 M228 400h-14" stroke="#212529" stroke-width="2.4"/><text x="200" y="419" font-size="17" font-weight="bold" fill="#212529" text-anchor="middle">10</text><path d="M172 380h8 M228 380h-8" stroke="#212529" stroke-width="2.4"/><path d="M172 360h14 M228 360h-14" stroke="#212529" stroke-width="2.4"/><text x="200" y="379" font-size="17" font-weight="bold" fill="#212529" text-anchor="middle">20</text><path d="M172 340h8 M228 340h-8" stroke="#212529" stroke-width="2.4"/><path d="M172 320h14 M228 320h-14" stroke="#212529" stroke-width="2.4"/><text x="200" y="339" font-size="17" font-weight="bold" fill="#212529" text-anchor="middle">30</text><path d="M172 300h8 M228 300h-8" stroke="#212529" stroke-width="2.4"/><path d="M172 280h14 M228 280h-14" stroke="#212529" stroke-width="2.4"/><text x="200" y="299" font-size="17" font-weight="bold" fill="#212529" text-anchor="middle">40</text><rect x="196" y="470" width="8" height="14" fill="#868e96" stroke="#495057" stroke-width="1.5"/><path d="M200,484 C216,488 216,510 200,512 C186,514 184,500 192,496" fill="none" stroke="#495057" stroke-width="5" stroke-linecap="round"/><path d="M232 454 L292 454" stroke="#495057" stroke-width="2"/><text x="300" y="461" font-size="22" fill="#212529" text-anchor="start">stupnice</text><path d="M216 500 L292 500" stroke="#495057" stroke-width="2"/><text x="300" y="507" font-size="22" fill="#212529" text-anchor="start">háček</text><g class="rk"><path d="M194,522 L230,610" stroke="#b07a52" stroke-width="34" stroke-linecap="round"/><path d="M194,522 L230,610" stroke="#f1c9a5" stroke-width="30" stroke-linecap="round"/><path d="M218,574 L252,660" stroke="#4dabf7" stroke-width="40"/><rect x="178" y="504" width="42" height="34" rx="14" fill="#f1c9a5" stroke="#b07a52" stroke-width="2.5"/><path d="M186 514 h26 M186 524 h26" stroke="#b07a52" stroke-width="2"/></g></g><path d="M162,164 H238 V440 H162 Z M176,172 V266 H224 V172 Z" fill-rule="evenodd" fill="url(#kov)" stroke="#212529" stroke-width="2.5"/><path d="M176,172 V266 H224 V172 Z" fill="none" stroke="#495057" stroke-width="2"/><rect x="183" y="176" width="6" height="86" fill="#ffffff" opacity="0.45"/><path d="M150 433 L162 440 L150 447 Z" fill="#e03131"/><path d="M250 433 L238 440 L250 447 Z" fill="#e03131"/><circle cx="200" cy="82" r="22" fill="none" stroke="#495057" stroke-width="10"/><circle cx="200" cy="82" r="22" fill="none" stroke="#ced4da" stroke-width="4"/><rect x="195" y="102" width="10" height="16" fill="#868e96" stroke="#495057" stroke-width="1.5"/><rect x="156" y="118" width="88" height="48" rx="6" fill="url(#hlav)" stroke="#212529" stroke-width="2.5"/><text x="200" y="150" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">[N]</text><path d="M226 218 L292 218" stroke="#495057" stroke-width="2"/><text x="300" y="225" font-size="22" fill="#212529" text-anchor="start">pružina</text><path d="M226 142 L292 142" stroke="#495057" stroke-width="2"/><text x="300" y="149" font-size="22" fill="#212529" text-anchor="start">jednotka: newton</text><g class="n0" opacity="0"><rect x="300" y="290" width="286" height="48" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/><text x="443" y="321.9" font-size="22" fill="#212529" text-anchor="middle">Bez síly ukazuje 0 N.</text></g><g class="n20"><rect x="300" y="290" width="286" height="76.1" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2.5"/><text x="443" y="321.9" font-size="22" fill="#212529" text-anchor="middle">Ruka táhne háček:</text><text x="443" y="350" font-size="22" fill="#212529" text-anchor="middle">siloměr ukazuje 20 N.</text></g>
</svg>
