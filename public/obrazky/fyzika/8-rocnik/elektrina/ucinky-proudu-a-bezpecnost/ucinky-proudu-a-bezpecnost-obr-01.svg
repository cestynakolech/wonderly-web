<text x="158" y="550" font-size="21" font-weight="bold" fill="#212529" text-anchor="middle">do nohou</text>
<text x="158" y="584" font-size="20" fill="#c92a2a" text-anchor="middle">zvlášť nebezpečné</text>
<text x="158" y="612" font-size="20" fill="#c92a2a" text-anchor="middle">pro srdce</text>
