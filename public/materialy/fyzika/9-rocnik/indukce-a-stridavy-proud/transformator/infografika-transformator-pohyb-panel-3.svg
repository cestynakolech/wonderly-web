		.p9-vyp { opacity: 0; animation: p9vyp 8s steps(1, end) infinite; }
		@keyframes p9vyp { 0% { opacity: 1; } 15% { opacity: 0; } 60% { opacity: 1; } 100% { opacity: 1; } }
		.p9-blik { opacity: 0; animation: p9blik 8s linear infinite; }
		@keyframes p9blik { 0%, 15% { opacity: 0; } 16% { opacity: 1; } 23%, 60% { opacity: 0; } 61% { opacity: 1; } 68%, 100% { opacity: 0; } }
		.p9-t1 { opacity: 0; animation: p9t1 8s steps(1, end) infinite; }
		@keyframes p9t1 { 0% { opacity: 0; } 15% { opacity: 1; } 23% { opacity: 0; } 60% { opacity: 1; } 68% { opacity: 0; } 100% { opacity: 0; } }
		.p9-t2 { animation: p9t2 8s steps(1, end) infinite; }
		@keyframes p9t2 { 0% { opacity: 0; } 23% { opacity: 1; } 60% { opacity: 0; } 100% { opacity: 0; } }
		.p9-t0 { opacity: 0; animation: p9t0 8s steps(1, end) infinite; }
		@keyframes p9t0 { 0% { opacity: 1; } 15% { opacity: 0; } 68% { opacity: 1; } 100% { opacity: 1; } }
		@media (prefers-reduced-motion: reduce) { .p9-zap, .p9-vyp, .p9-blik, .p9-t1, .p9-t2, .p9-t0 { animation: none; } }
	</style>
