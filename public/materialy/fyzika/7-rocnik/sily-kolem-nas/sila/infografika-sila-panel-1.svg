a na bednu</text></g><text x="230" y="326" font-size="18" text-anchor="middle" fill="#495057">šipky stejně dlouhé, opačný směr</text><text x="40" y="372" font-size="21" font-weight="bold" fill="#b8460b">Na dálku: magnet a hřebík</text><line x1="40" y1="440" x2="420" y2="440" stroke="#2b2a26" stroke-width="2"/><rect x="50" y="408" width="50" height="32" fill="#ced4da" stroke="#2b2a26" stroke-width="2"/><rect x="100" y="408" width="50" height="32" fill="#495057" stroke="#2b2a26" stroke-width="2"/><text x="75" y="431" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b2a26">S</text><text x="125" y="431" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">N</text><rect x="262" y="426" width="7" height="14" rx="1.5" fill="#868e96" stroke="#2b2a26" stroke-width="1.5"/><path d="M269,433 L330,433 L342,440 L269,440 Z" fill="#868e96" stroke="#2b2a26" stroke-width="1.5"/><g class="p1-pole"><g transform="translate(150,424) rotate(0)"><line x1="0" y1="0" x2="33" y2="0" stroke="#e03131" stroke-width="5" pathLength="100" stroke-dasharray="100 100"/><polygon points="46,0 32,-7 32,7" fill="#e03131"/><circle cx="0" cy="0" r="5" fill="#2b2a26"/></g><g transform="translate(262,433) rotate(180)"><line x1="0" y1="0" x2="33" y2="0" stroke="#e03131" stroke-width="5" pathLength="100" stroke-dasharray="100 100"/><polygon points="46,0 32,-7 32,7" fill="#e03131"/><circle cx="0" cy="0" r="5" fill="#2b2a26"/></g></g><text x="100" y="466" font-size="18" text-anchor="middle" fill="#495057">magnet</text><text x="302" y="466" font-size="18" text-anchor="middle" fill="#495057">hřebík</text><text x="230" y="496" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">Působení je vždy vzájemné.</text>
