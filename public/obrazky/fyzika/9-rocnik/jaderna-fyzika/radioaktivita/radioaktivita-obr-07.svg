<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Ochrana před zářením: kratší čas, větší vzdálenost a stínění. Ze zdroje v olověném kontejneru se znakem radiace vychází záření, silná stěna ho výrazně zeslabí. Za stěnou stojí pracovník v ochranném obleku s maskou a dozimetrem na hrudi. Dozimetr sleduje ozáření, jednotka je sievert. Oblek a maska brání znečištění radioaktivními látkami, stínění ale nenahradí. Animace: záření běží ke stěně, za ní je slabé; dozimetr bliká.">
<title>Ochrana před zářením: kratší čas, větší vzdálenost a stínění. Ze zdroje v olověném kontejneru se znakem radiace vychází záření, silná stěna ho výrazně zeslabí. Za stěnou stojí pracovník v ochranném obleku s maskou a dozimetrem na hrudi. Dozimetr sleduje ozáření, jednotka je sievert. Oblek a maska brání znečištění radioaktivními látkami, stínění ale nenahradí. Animace: záření běží ke stěně, za ní je slabé; dozimetr bliká.</title>
