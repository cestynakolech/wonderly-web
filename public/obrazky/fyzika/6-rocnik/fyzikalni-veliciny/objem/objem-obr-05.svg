<g class="pohled"><path d="M196 448H382" stroke="#c92a2a" stroke-width="3" stroke-dasharray="10 7"/><path d="M368 440L384 448L368 456Z" fill="#c92a2a"/><circle cx="390" cy="448" r="6" fill="#c92a2a"/></g>
