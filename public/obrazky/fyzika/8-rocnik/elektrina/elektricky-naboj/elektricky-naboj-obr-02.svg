<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Elektrování třením. Nahoře se plastový hřeben tře o vlasy. Vlasy i hřeben mají na začátku stejně kladných a záporných nábojů. Při česání přecházejí elektrony z vlasů na hřeben: hřeben se nabije záporně, vlasům elektrony chybějí a nabijí se kladně. Dole po česání: kladné vlasy se přitahují k zápornému hřebenu a mezi sebou se odpuzují, proto vstávají. Animace: hřeben se pohybuje, elektrony přeskočí na hřeben, vlasy se zvednou.">
<style>
/* Animace 12 s, smyčka. Předloha: PDF lekce 18, str. 12 (česání: elektrony z vlasů do hřebenu; vlasy +, hřeben −), str. 11 a 15 (text: stejně velký opačný náboj; vlasy se přitahují k hřebenu, mezi sebou se odpuzují), str. 2 (vstávající vlasy).
   Česání (hřeben nahoru a dolů) 3–30 %, elektrony přecházejí 33–55 %, popisek 1 od 0 %, popisek 2 55–60 %, vlasy vstávají 62–78 %, popisek dole 78–84 %; zmizí 92–98 %.
   Bez animace (prefers-reduced-motion) = koncový stav: atributy ukazují vše. */
.hreben { animation: hreben 12s linear infinite; }
@keyframes hreben { 0%, 3% { transform: translate(0px, 0px); } 9.5% { transform: translate(0px, -34px); } 16% { transform: translate(0px, 0px); } 23% { transform: translate(0px, -34px); } 30%, 100% { transform: translate(0px, 0px); } }
.p1 { animation: p1 12s linear infinite; }
@keyframes p1 { 0%, 33% { transform: translate(-155px, -53px); } 50%, 100% { transform: translate(0px, 0px); } }
.p2 { animation: p2 12s linear infinite; }
@keyframes p2 { 0%, 36% { transform: translate(-95px, -113px); } 53%, 100% { transform: translate(0px, 0px); } }
.p3 { animation: p3 12s linear infinite; }
@keyframes p3 { 0%, 38% { transform: translate(-76px, -49px); } 55%, 100% { transform: translate(0px, 0px); } }
.v2 { animation: v2 12s linear infinite; }
@keyframes v2 { 0%, 55% { opacity: 0; } 60%, 100% { opacity: 1; } }
.vlL { animation: vlL 12s linear infinite; }
@keyframes vlL { 0%, 62% { transform: rotate(-70deg); } 78%, 100% { transform: rotate(0deg); } }
.vlP { animation: vlP 12s linear infinite; }
@keyframes vlP { 0%, 62% { transform: rotate(70deg); } 78%, 100% { transform: rotate(0deg); } }
.v3 { animation: v3 12s linear infinite; }
@keyframes v3 { 0%, 78% { opacity: 0; } 84%, 100% { opacity: 1; } }
.celek { animation: celek 12s linear infinite; }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hreben, .p1, .p2, .p3, .v2, .vlL, .vlP, .v3, .celek { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="844" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
