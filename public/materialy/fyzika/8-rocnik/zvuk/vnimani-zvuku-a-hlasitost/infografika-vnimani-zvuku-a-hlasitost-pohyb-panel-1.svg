		</g>

		<text x="40" y="704" font-size="20" fill="#2b2a26">Do mozku se zvuk nedostane přímo,</text>
		<text x="40" y="732" font-size="20" fill="#2b2a26">ale až po několika přeměnách.</text>
	</g>
</svg>
