<rect x="20" y="620" width="560" height="115" rx="12" fill="#e3fafc" stroke="#0b7285" stroke-width="2.5"/><text x="300" y="655" font-size="20" fill="#212529" text-anchor="middle">Země: a = 1 AU, T = 1 rok.  Planeta: a = 4 AU.</text><text x="300" y="686" font-size="20" fill="#212529" text-anchor="middle">1<tspan font-size="15" dy="-8">2</tspan><tspan dy="8"> : T</tspan><tspan font-size="15" dy="-8">2</tspan><tspan dy="8"> = 1</tspan><tspan font-size="15" dy="-8">3</tspan><tspan dy="8"> : 4</tspan><tspan font-size="15" dy="-8">3</tspan><tspan dy="8"> → T</tspan><tspan font-size="15" dy="-8">2</tspan><tspan dy="8"> = 64 → T = 8 let</tspan></text><text x="300" y="717" font-size="20" fill="#212529" text-anchor="middle">Než planeta oběhne jednou, Země oběhne 8krát.</text>
<text x="300" y="768" font-size="18" fill="#495057" text-anchor="middle">1 AU = 150 milionů km. Dráhy jsou ve správném</text>
<text x="300" y="790" font-size="18" fill="#495057" text-anchor="middle">poměru 1 : 4, velikosti těles nejsou v měřítku.</text>
