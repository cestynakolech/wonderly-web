<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Schéma sériového obvodu: nahoře dva rezistory R₁ a R₂ za sebou, dole článek a spínač. Obvod má jedinou proudovou cestu a nerozvětvuje se. Animace: spínač se zavře a oranžové čárky ukazují, že proud prochází celým obvodem – z kladného pólu článku přes R₁ a R₂ zpět k zápornému pólu – všude stejně. Když se spínač otevře, proud přestane procházet celým obvodem.">
<style>
/* Předloha: PDF lekce 28, s. 2 (schéma: dva rezistory za sebou nahoře, článek + spínač dole, + na dlouhé desce vlevo).
   Doplněno z výkladu § 1–2: proud prochází jedinou cestou; přerušením cesty přestane procházet celým obvodem.
   Proud = oranžové čárky ve směru dohodnutého proudu (od + přes R₁ a R₂ k −), všude stejně rychle.
   10 s: 0–20 % spínač otevřený, proud nikde; 20–25 % spínač se zavře; 25–75 % proud v celém obvodu;
   75–80 % spínač se otevře; 80–100 % proud nikde.
   Bez animace (reduced-motion) = stav se zavřeným spínačem a proudem v celém obvodu. */
.ps { animation: ps 10s ease-in-out infinite; }
@keyframes ps { 0%, 20% { transform: rotate(-24deg); } 25%, 75% { transform: rotate(0deg); } 80%, 100% { transform: rotate(-24deg); } }
.zap { animation: zap 10s step-end infinite; }
.vyp { opacity: 0; animation: vyp 10s step-end infinite; }
@keyframes zap { 0% { opacity: 0; } 25% { opacity: 1; } 75% { opacity: 0; } }
@keyframes vyp { 0% { opacity: 1; } 25% { opacity: 0; } 75% { opacity: 1; } }
.tok { animation: tok 1s linear infinite; }
@keyframes tok { to { stroke-dashoffset: -40; } }
@media (prefers-reduced-motion: reduce) { .ps, .zap, .vyp, .tok { animation: none; } }
</style>
<defs>
<marker id="v-ora" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e8590c"/></marker>
<marker id="v-nap" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0b7285"/></marker>
</defs>
<rect x="3" y="3" width="594" height="484" rx="14" fill="#f8f9fa"/>
<text x="300" y="42" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Spotřebiče zapojené za sebou</text>
<text x="300" y="96" font-size="20" fill="#495057" text-anchor="middle">spotřebiče nahrazené rezistory</text>
<path d="M200 360H70V140H150M250 140H350M450 140H530V360H396M324 360H216" fill="none" stroke="#212529" stroke-width="4" stroke-linecap="square"/>
<g class="zap"><path class="tok" d="M200 360H70V140H530V360H216" fill="none" stroke="#e8590c" stroke-width="6" stroke-dasharray="16 24" stroke-linecap="round"/></g>
<rect x="150" y="120.0" width="100" height="40" fill="#fff" stroke="#212529" stroke-width="4"/><text x="200.0" y="148" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">R₁</text><rect x="350" y="120.0" width="100" height="40" fill="#fff" stroke="#212529" stroke-width="4"/><text x="400.0" y="148" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">R₂</text>
<path d="M200 330V390" stroke="#212529" stroke-width="4"/><path d="M216 344V376" stroke="#212529" stroke-width="9"/><path d="M174 324H190M182 316V332" stroke="#c92a2a" stroke-width="4" stroke-linecap="round"/><path d="M226 324H242" stroke="#1864ab" stroke-width="4" stroke-linecap="round"/>
<circle cx="330" cy="360" r="6" fill="#fff" stroke="#212529" stroke-width="3"/><circle cx="390" cy="360" r="6" fill="#fff" stroke="#212529" stroke-width="3"/><path class="ps" style="transform-origin:330px 360px" d="M336 358L392 357" stroke="#212529" stroke-width="4" stroke-linecap="round"/>
<text x="208" y="424" font-size="22" fill="#212529" text-anchor="middle">článek</text><text x="360.0" y="404" font-size="22" fill="#212529" text-anchor="middle">spínač</text>
<text class="zap" x="300" y="228" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Spínač zavřený:</text><text class="zap" x="300" y="260" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">proud prochází celým obvodem.</text>
<text class="vyp" x="300" y="228" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Spínač otevřený:</text><text class="vyp" x="300" y="260" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">proud neprochází nikde.</text>
<text x="300" y="466" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Jediná cesta – obvod se nerozvětvuje.</text>
</svg>
