<g><rect x="34" y="400" width="192" height="290" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><circle cx="54" cy="422" r="14" fill="#e8590c"/><text x="54" y="429" font-size="21" font-weight="bold" text-anchor="middle" fill="#fff">!</text><text x="130" y="610" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">Volej 155 hned</text><text x="130" y="636" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">a souběžně,</text><text x="130" y="662" font-size="21" text-anchor="middle" fill="#2b2a26">zapni odposlech.</text><rect x="98" y="448" width="64" height="116" rx="10" fill="#343a40"/><rect x="104" y="460" width="52" height="88" rx="4" fill="#e7f5ff"/><text x="130" y="512" font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2a26">155</text><g class="vl"><path d="M172,486 A20,20 0 0 1 172,522" fill="none" stroke="#343a40" stroke-width="3" stroke-linecap="round"/><path d="M180,476 A32,32 0 0 1 180,532" fill="none" stroke="#343a40" stroke-width="3" stroke-linecap="round"/></g></g>
