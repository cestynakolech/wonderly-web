<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 565" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Elektrická síla. Dvě záporné kuličky se odpuzují. Záporná a kladná kulička se přitahují. Dvě kladné kuličky se odpuzují. Záporná a kladná kulička dál od sebe se přitahují slabší silou, šipky jsou kratší. Animace: kuličky se postupně od sebe odsunou nebo k sobě přiblíží a objeví se šipky sil.">
<style>
/* Animace 10 s, smyčka. Předloha: PDF lekce 18, str. 16 (kuličky − −, − +, + + se šipkami sil), str. 15 (souhlasné se odpuzují, nesouhlasné přitahují), str. 16 dole (čím větší vzdálenost, tím menší síla).
   Řádek 1 5–20 %, řádek 2 25–40 %, řádek 3 45–60 %, řádek 4 65–80 % (kuličky se rozjedou/přiblíží, šipky a popisky se objeví na konci pohybu); zmizí 92–98 %.
   Šipky elektrické síly fialové #5f3dc4 – stejně jako v elektricke-pole-obr-03 (oranžová znamená v kapitole dohodnutý směr proudu).
   Bez animace (prefers-reduced-motion) = koncový stav: atributy ukazují vše. */
.aL { animation: aL 10s linear infinite; }
@keyframes aL { 0%, 5% { transform: translate(34px, 0px); } 20%, 100% { transform: translate(0px, 0px); } }
.aP { animation: aP 10s linear infinite; }
@keyframes aP { 0%, 5% { transform: translate(-34px, 0px); } 20%, 100% { transform: translate(0px, 0px); } }
.as { animation: as 10s linear infinite; }
@keyframes as { 0%, 5% { opacity: 0; } 9%, 100% { opacity: 1; } }
.at { animation: at 10s linear infinite; }
@keyframes at { 0%, 18% { opacity: 0; } 22%, 100% { opacity: 1; } }
.bL { animation: bL 10s linear infinite; }
@keyframes bL { 0%, 25% { transform: translate(-34px, 0px); } 40%, 100% { transform: translate(0px, 0px); } }
.bP { animation: bP 10s linear infinite; }
@keyframes bP { 0%, 25% { transform: translate(34px, 0px); } 40%, 100% { transform: translate(0px, 0px); } }
.bs { animation: bs 10s linear infinite; }
@keyframes bs { 0%, 25% { opacity: 0; } 29%, 100% { opacity: 1; } }
.bt { animation: bt 10s linear infinite; }
@keyframes bt { 0%, 38% { opacity: 0; } 42%, 100% { opacity: 1; } }
.cL { animation: cL 10s linear infinite; }
@keyframes cL { 0%, 45% { transform: translate(34px, 0px); } 60%, 100% { transform: translate(0px, 0px); } }
.cP { animation: cP 10s linear infinite; }
@keyframes cP { 0%, 45% { transform: translate(-34px, 0px); } 60%, 100% { transform: translate(0px, 0px); } }
.cs { animation: cs 10s linear infinite; }
@keyframes cs { 0%, 45% { opacity: 0; } 49%, 100% { opacity: 1; } }
.ct { animation: ct 10s linear infinite; }
@keyframes ct { 0%, 58% { opacity: 0; } 62%, 100% { opacity: 1; } }
.dL { animation: dL 10s linear infinite; }
@keyframes dL { 0%, 65% { transform: translate(60px, 0px); } 80%, 100% { transform: translate(0px, 0px); } }
.dP { animation: dP 10s linear infinite; }
@keyframes dP { 0%, 65% { transform: translate(-60px, 0px); } 80%, 100% { transform: translate(0px, 0px); } }
.ds { animation: ds 10s linear infinite; }
@keyframes ds { 0%, 75% { opacity: 0; } 80%, 100% { opacity: 1; } }
.dt { animation: dt 10s linear infinite; }
@keyframes dt { 0%, 78% { opacity: 0; } 82%, 100% { opacity: 1; } }
.rd { animation: rd 10s linear infinite; }
@keyframes rd { 0%, 63% { opacity: 0; } 66%, 100% { opacity: 1; } }
.celek { animation: celek 10s linear infinite; }
@keyframes celek { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .aL, .aP, .as, .at, .bL, .bP, .bs, .bt, .cL, .cP, .cs, .ct, .dL, .dP, .ds, .dt, .rd, .celek { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="559" rx="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3"/>
<g class="celek"><text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Elektrická síla</text><text x="300" y="68" font-size="22" fill="#495057" text-anchor="middle">souhlasné se odpuzují, nesouhlasné přitahují</text><g transform="translate(110,140)"><g class="aL"><g><circle cx="0" cy="0" r="30" fill="#1864ab" stroke="#212529" stroke-width="1.5"/><path d="M-16.5 0H16.5" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="as"><line x1="-32" y1="0" x2="-68" y2="0" stroke="#5f3dc4" stroke-width="8" stroke-linecap="round"/><polygon points="-84,0 -68,-12 -68,12" fill="#5f3dc4"/></g></g></g><g transform="translate(290,140)"><g class="aP"><g><circle cx="0" cy="0" r="30" fill="#1864ab" stroke="#212529" stroke-width="1.5"/><path d="M-16.5 0H16.5" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="as"><line x1="32" y1="0" x2="68" y2="0" stroke="#5f3dc4" stroke-width="8" stroke-linecap="round"/><polygon points="84,0 68,-12 68,12" fill="#5f3dc4"/></g></g></g><text class="at" x="400" y="148" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">odpuzují se</text><g transform="translate(110,260)"><g class="bL"><g><circle cx="0" cy="0" r="30" fill="#1864ab" stroke="#212529" stroke-width="1.5"/><path d="M-16.5 0H16.5" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="bs"><line x1="32" y1="0" x2="68" y2="0" stroke="#5f3dc4" stroke-width="8" stroke-linecap="round"/><polygon points="84,0 68,-12 68,12" fill="#5f3dc4"/></g></g></g><g transform="translate(290,260)"><g class="bP"><g><circle cx="0" cy="0" r="30" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M-16.5 0H16.5M0 -16.5V16.5" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="bs"><line x1="-32" y1="0" x2="-68" y2="0" stroke="#5f3dc4" stroke-width="8" stroke-linecap="round"/><polygon points="-84,0 -68,-12 -68,12" fill="#5f3dc4"/></g></g></g><text class="bt" x="400" y="268" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">přitahují se</text><g transform="translate(110,380)"><g class="cL"><g><circle cx="0" cy="0" r="30" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M-16.5 0H16.5M0 -16.5V16.5" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="cs"><line x1="-32" y1="0" x2="-68" y2="0" stroke="#5f3dc4" stroke-width="8" stroke-linecap="round"/><polygon points="-84,0 -68,-12 -68,12" fill="#5f3dc4"/></g></g></g><g transform="translate(290,380)"><g class="cP"><g><circle cx="0" cy="0" r="30" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M-16.5 0H16.5M0 -16.5V16.5" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="cs"><line x1="32" y1="0" x2="68" y2="0" stroke="#5f3dc4" stroke-width="8" stroke-linecap="round"/><polygon points="84,0 68,-12 68,12" fill="#5f3dc4"/></g></g></g><text class="ct" x="400" y="388" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">odpuzují se</text><line x1="30" y1="440" x2="570" y2="440" stroke="#ced4da" stroke-width="2"/><g class="rd"><g transform="translate(50,510)"><g class="dL"><g><circle cx="0" cy="0" r="30" fill="#1864ab" stroke="#212529" stroke-width="1.5"/><path d="M-16.5 0H16.5" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="ds"><line x1="32" y1="0" x2="38" y2="0" stroke="#5f3dc4" stroke-width="6" stroke-linecap="round"/><polygon points="54,0 38,-12 38,12" fill="#5f3dc4"/></g></g></g><g transform="translate(350,510)"><g class="dP"><g><circle cx="0" cy="0" r="30" fill="#c92a2a" stroke="#212529" stroke-width="1.5"/><path d="M-16.5 0H16.5M0 -16.5V16.5" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="ds"><line x1="-32" y1="0" x2="-38" y2="0" stroke="#5f3dc4" stroke-width="6" stroke-linecap="round"/><polygon points="-54,0 -38,-12 -38,12" fill="#5f3dc4"/></g></g></g></g><text class="dt" x="400" y="500" font-size="22" fill="#212529" text-anchor="start">dál od sebe:</text><text class="dt" x="400" y="528" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">slabší síla</text></g>
</svg>
