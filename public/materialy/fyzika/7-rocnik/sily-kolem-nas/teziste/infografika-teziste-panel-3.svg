<svg viewBox="0 1060 460 546" width="460" height="546" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Těžiště 3/6, Nepravidelné těleso: těžiště nepravidelného tělesa najdeme zavěšením za dva různé body v průsečíku těžnic; vychýlená deska se vrátí s těžištěm pod hřebík; u smetáku leží těžiště blíž ke kartáči a smeták na prstu podepřeme pod ním" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Těžiště 3/6: Nepravidelné těleso</title>
	<!-- Vyříznuto z infografika-teziste.svg (panel 3), souřadnice beze změny. -->
	<defs>
		<!-- pravítko: počátek = úchyt provázku uprostřed horní hrany -->
		<g id="d-pravitko">
			<rect x="-80" y="0" width="160" height="14" fill="#ffe066" stroke="#2b2a26" stroke-width="2" />
			<path d="M -70 0 v 4 M -60 0 v 4 M -50 0 v 4 M -40 0 v 4 M -30 0 v 6 M -20 0 v 4 M -10 0 v 4 M 10 0 v 4 M 20 0 v 6 M 30 0 v 4 M 40 0 v 4 M 50 0 v 4 M 60 0 v 4 M 70 0 v 6" stroke="#2b2a26" stroke-width="1.5" />
			<path d="M -6 1 h 12" stroke="#495057" stroke-width="3" />
		</g>
		<!-- guma na provázku: počátek = uzel na spodní hraně pravítka, visí svisle -->
		<g id="d-guma">
			<line x1="0" y1="0" x2="0" y2="12" stroke="#495057" stroke-width="2" />
			<rect x="-12" y="12" width="24" height="22" rx="4" fill="#f783ac" stroke="#2b2a26" stroke-width="2" />
			<line x1="-8" y1="18" x2="8" y2="18" stroke="#c2255c" stroke-width="1.5" />
		</g>
		<!-- ruka s ukazováčkem: počátek = špička prstu -->
		<g id="d-ruka">
			<rect x="-16" y="28" width="30" height="28" rx="10" fill="#f1c9a5" stroke="#2b2a26" stroke-width="2" />
			<rect x="-7" y="0" width="14" height="34" rx="7" fill="#f1c9a5" stroke="#2b2a26" stroke-width="2" />
			<path d="M -12 40 h 22 M -12 48 h 22" stroke="#c8956c" stroke-width="1.5" />
		</g>
		<!-- těžiště s tíhovou silou (panel 1): počátek = T -->
		<g id="d-tfg1">
			<line x1="0" y1="0" x2="0" y2="44" stroke="#c92a2a" stroke-width="5" />
			<polygon points="0,58 -7,44 7,44" fill="#c92a2a" />
			<path d="M -5 -5 L 5 5 M 5 -5 L -5 5" stroke="#2b2a26" stroke-width="2.5" />
			<text x="-26" y="30" font-size="22" font-weight="bold" fill="#2b2a26">T</text>
			<text x="-36" y="56" font-size="22" font-weight="bold" fill="#c92a2a">F<tspan font-size="18" dy="5">g</tspan></text>
		</g>
		<!-- deska nepravidelného tvaru (panel 3) v místních souřadnicích, otvory v obou bodech závěsu -->
		<g id="d-deska">
			<path d="M 0 0 L 40 -12 L 95 -8 L 130 20 L 120 60 L 80 95 L 35 100 L 10 70 L -15 40 Z" fill="#ffd43b" stroke="#2b2a26" stroke-width="2.5" stroke-linejoin="round" />
			<line x1="42" y1="-2" x2="76" y2="90" stroke="#5f3dc4" stroke-width="3.5" stroke-dasharray="8 5" />
			<circle cx="42" cy="-2" r="4" fill="#fbfaf6" stroke="#2b2a26" stroke-width="1.5" />
			<circle cx="120" cy="22" r="4" fill="#fbfaf6" stroke="#2b2a26" stroke-width="1.5" />
		</g>
		<!-- těžiště se svislicí a tíhovou silou (panel 4): počátek = T; svislice se ořízne podlahou -->
		<g id="d-tsv">
			<line x1="0" y1="-36" x2="0" y2="200" stroke="#5f3dc4" stroke-width="3" stroke-dasharray="6 4" />
			<line x1="0" y1="0" x2="0" y2="9" stroke="#c92a2a" stroke-width="5" />
			<polygon points="0,20 -6,9 6,9" fill="#c92a2a" />
			<path d="M -5 -5 L 5 5 M 5 -5 L -5 5" stroke="#2b2a26" stroke-width="2.5" />
		</g>
		<!-- bedna 110 × 56: počátek = pravá dolní hrana (osa překlápění) -->
		<g id="d-bedna">
			<rect x="-110" y="-56" width="110" height="56" fill="#d9a066" stroke="#2b2a26" stroke-width="2.5" />
			<line x1="-110" y1="-28" x2="0" y2="-28" stroke="#8d5a2b" stroke-width="2" />
			<line x1="-110" y1="0" x2="0" y2="0" stroke="#2b2a26" stroke-width="5" />
		</g>
		<!-- skříňka 40 × 130: počátek = pravá dolní hrana -->
		<g id="d-skrin">
			<rect x="-40" y="-130" width="40" height="130" fill="#e8c39e" stroke="#2b2a26" stroke-width="2.5" />
			<rect x="-40" y="-134" width="40" height="8" rx="2" fill="#c9a77c" stroke="#2b2a26" stroke-width="2" />
			<line x1="-40" y1="-45" x2="0" y2="-45" stroke="#8d5a2b" stroke-width="1.5" />
			<circle cx="-10" cy="-100" r="2.5" fill="#2b2a26" /><circle cx="-10" cy="-30" r="2.5" fill="#2b2a26" />
			<line x1="-40" y1="0" x2="0" y2="0" stroke="#2b2a26" stroke-width="5" />
		</g>
		<!-- ořez svislic podlahou (v souřadnicích skupiny posunuté na osu překlápění) -->
		<clipPath id="p4-klip" clipPathUnits="userSpaceOnUse">
			<rect x="-300" y="-300" width="600" height="301.5" />
		</clipPath>
		<!-- tíhová síla (panel 6): počátek = T -->
		<g id="d-fg6">
			<line x1="0" y1="0" x2="0" y2="22" stroke="#c92a2a" stroke-width="5" />
			<polygon points="0,36 -7,22 7,22" fill="#c92a2a" />
		</g>
	</defs>
	<rect x="0" y="1060" width="460" height="546" fill="#f8f9fa" />
	<!-- ===== Panel 3: Nepravidelné těleso ===== -->
	<g id="panel-3">
		<rect x="26" y="1076" width="420" height="520" rx="10" fill="#2b2a26" />
		<rect x="20" y="1070" width="420" height="520" rx="10" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2.5" />
		<circle cx="52" cy="1104" r="17" fill="#fbfaf6" stroke="#2b2a26" stroke-width="2" />
		<text x="52" y="1111" text-anchor="middle" font-size="21" font-weight="bold" fill="#b8460b">3</text>
		<text x="80" y="1113" font-size="28" font-weight="bold" fill="#2b2a26">Nepravidelné těleso</text>

		<text x="40" y="1158" font-size="21" fill="#2b2a26">zavěsíme ho za <tspan font-weight="bold">dva různé body</tspan></text>
		<text x="40" y="1188" font-size="21" fill="#2b2a26">T leží v <tspan font-weight="bold" fill="#5f3dc4">průsečíku těžnic</tspan></text>

		<!-- lišta na stěně -->
		<rect x="34" y="1220" width="392" height="20" fill="#d9a066" stroke="#2b2a26" stroke-width="2" />
		<path d="M 50 1230 Q 90 1226 130 1231 M 230 1229 Q 280 1225 320 1230" fill="none" stroke="#8d5a2b" stroke-width="1.5" />

		<!-- první závěs (statický): deska v klidu s těžištěm pod hřebíkem; slabě čárkovaně vychýlená
		     poloha (o 25°) a šipka, kam se puštěná deska vrátí -->
		<path d="M 0 0 L 40 -12 L 95 -8 L 130 20 L 120 60 L 80 95 L 35 100 L 10 70 L -15 40 Z" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" transform="translate(125,1230) rotate(25) rotate(20.53) translate(-42,2)" />
		<use href="#d-deska" xlink:href="#d-deska" transform="translate(125,1230) rotate(20.53) translate(-42,2)" />
		<path d="M 69.6 1334.2 A 118 118 0 0 0 112.7 1347.4" fill="none" stroke="#495057" stroke-width="3" />
		<polygon points="121.6,1348.3 112.2,1352.4 113.2,1342.4" fill="#495057" />
		<line x1="125" y1="1230" x2="125" y2="1384" stroke="#2b2a26" stroke-width="1.5" />
		<path d="M 118 1384 L 132 1384 L 125 1402 Z" fill="#495057" stroke="#2b2a26" stroke-width="1.5" stroke-linejoin="round" />
		<circle cx="125" cy="1230" r="5" fill="#868e96" stroke="#2b2a26" stroke-width="2" />
		<text x="138" y="1400" font-size="21" font-weight="bold" fill="#5f3dc4">těžnice</text>

		<!-- druhý závěs: dvě těžnice, T v průsečíku -->
		<g transform="translate(335,1230) rotate(-73.99) translate(-120,-22)">
			<use href="#d-deska" xlink:href="#d-deska" />
			<line x1="120" y1="22" x2="8" y2="54" stroke="#5f3dc4" stroke-width="3.5" stroke-dasharray="8 5" />
		</g>
		<line x1="335" y1="1230" x2="335" y2="1395" stroke="#2b2a26" stroke-width="1.5" />
		<path d="M 328 1395 L 342 1395 L 335 1413 Z" fill="#495057" stroke="#2b2a26" stroke-width="1.5" stroke-linejoin="round" />
		<circle cx="335" cy="1230" r="5" fill="#868e96" stroke="#2b2a26" stroke-width="2" />
		<path d="M 329 1289 L 341 1301 M 341 1289 L 329 1301" stroke="#2b2a26" stroke-width="3" />
		<text x="344" y="1290" font-size="22" font-weight="bold" fill="#2b2a26">T</text>

		<text x="110" y="1442" text-anchor="middle" font-size="21" fill="#2b2a26">první závěs</text>
		<text x="335" y="1442" text-anchor="middle" font-size="21" fill="#2b2a26">druhý závěs</text>

		<!-- smeták na prstu: těžiště blíž k těžší části, podepřený přesně pod T -->
		<text x="40" y="1484" font-size="21" fill="#2b2a26">T je blíž k místu, kde je <tspan font-weight="bold">víc hmoty</tspan></text>
		<rect x="50" y="1512" width="250" height="10" rx="5" fill="#b07a4a" stroke="#2b2a26" stroke-width="2" />
		<rect x="296" y="1500" width="104" height="22" rx="4" fill="#fab005" stroke="#2b2a26" stroke-width="2" />
		<g stroke="#8a5a2b" stroke-width="3">
			<line x1="304" y1="1522" x2="302" y2="1552" /><line x1="314" y1="1522" x2="313" y2="1552" /><line x1="324" y1="1522" x2="324" y2="1552" />
			<line x1="334" y1="1522" x2="334" y2="1552" /><line x1="344" y1="1522" x2="344" y2="1552" /><line x1="354" y1="1522" x2="354" y2="1552" />
			<line x1="364" y1="1522" x2="364" y2="1552" /><line x1="374" y1="1522" x2="375" y2="1552" /><line x1="384" y1="1522" x2="385" y2="1552" />
			<line x1="392" y1="1522" x2="394" y2="1552" />
		</g>
		<use href="#d-ruka" xlink:href="#d-ruka" transform="translate(262,1522)" />
		<path d="M 256 1511 L 268 1523 M 268 1511 L 256 1523" stroke="#2b2a26" stroke-width="2.5" />
		<text x="252" y="1504" font-size="22" font-weight="bold" fill="#2b2a26">T</text>
		<text x="130" y="1550" text-anchor="middle" font-size="21" fill="#2b2a26">smeták na prstu</text>
		<text x="130" y="1575" text-anchor="middle" font-size="21" fill="#2b2a26">podepřený <tspan font-weight="bold">pod T</tspan></text>
	</g>
</svg>
