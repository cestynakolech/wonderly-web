<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace: elektroskop s kovovou destičkou nahoře, skleněným pouzdrem, svislou tyčinkou a otočnou ručičkou. Záporně nabitou plastovou tyčí se dotkneme destičky, elektrony přejdou na tyčinku i ručičku, ty se odpuzují a ručička se vychýlí. Pak se destičky dotkneme rukou, elektroskop se uzemněním vybije a ručička se vrátí.">
<style>
/* Předloha: PDF Elektrické vlastnosti látek, oddíl Určení, zda je těleso nabité (text bez obrázku: kovová destička, vnitřní tyčinka a otočná ručička se nabijí souhlasně a odpuzují se; vybití uzemněním dotykem ruky). Tělo přístroje kresleno jako elektrometr z PDF, ale bez stupnice a s destičkou. Animace 12 s: dotyk tyče → elektrony na tyčince a ručičce → výchylka 34° → dotyk ruky → vybití → ručička zpět. Bez animace = stav po nabití (výchylka 34°). */
@keyframes tyc { 0% { transform: translate(-70px, -30px); opacity: 0; } 4% { transform: translate(-70px, -30px); opacity: 1; } 14%, 40% { transform: translate(0, 0); opacity: 1; } 50% { transform: translate(-70px, -30px); opacity: 0; } 100% { transform: translate(-70px, -30px); opacity: 0; } }
@keyframes tyl { 0% { opacity: 0; } 4%, 38% { opacity: 1; } 48%, 100% { opacity: 0; } }
@keyframes nb { 0%, 13% { opacity: 0; } 18%, 64% { opacity: 1; } 72%, 100% { opacity: 0; } }
@keyframes ru { 0%, 16% { transform: rotate(0deg); } 28%, 64% { transform: rotate(34deg); } 76%, 100% { transform: rotate(0deg); } }
@keyframes ruka { 0%, 52% { transform: translateX(90px); opacity: 0; } 58% { transform: translateX(90px); opacity: 1; } 62%, 80% { transform: translateX(0); opacity: 1; } 88%, 100% { transform: translateX(90px); opacity: 0; } }
@keyframes s1 { 0%, 15% { opacity: 1; } 17%, 100% { opacity: 0; } }
@keyframes s2 { 0%, 15% { opacity: 0; } 17%, 54% { opacity: 1; } 56%, 100% { opacity: 0; } }
@keyframes s3 { 0%, 54% { opacity: 0; } 56%, 100% { opacity: 1; } }
.tyc { animation: tyc 12s ease-in-out infinite; } .tyl { animation: tyl 12s ease-in-out infinite; } .nb { animation: nb 12s linear infinite; }
.ru { transform-box: view-box; transform-origin: 300px 420px; transform: rotate(34deg); animation: ru 12s ease-in-out infinite; }
.ruka { opacity: 0; animation: ruka 12s ease-in-out infinite; }
.s1 { animation: s1 12s linear infinite; } .s2 { animation: s2 12s linear infinite; } .s3 { animation: s3 12s linear infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><radialGradient id="gP" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#f19a9a"/><stop offset="0.45" stop-color="#c92a2a"/><stop offset="1" stop-color="#7d1a1a"/></radialGradient>
<radialGradient id="gE" cx="50%" cy="50%" r="50%" fx="35%" fy="30%"><stop offset="0" stop-color="#7db3e3"/><stop offset="0.45" stop-color="#1864ab"/><stop offset="1" stop-color="#0b3a63"/></radialGradient>
