		<path d="M362 398 Q366 403 370 398" fill="none" stroke="#4c6ef5" stroke-width="1.5"/>
		<circle cx="398" cy="396" r="6" fill="#495057"/><circle cx="398" cy="396" r="2.5" fill="#e7f5ff"/>
		<text x="369" y="456" font-size="15" text-anchor="middle" fill="#2b2a26">vak na oblečení</text>
