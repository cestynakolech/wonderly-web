<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vláskové buňky v hlemýždi. Vlevo zdravé buňky: z každé vyčnívá svazek vlásků seřazených od nejkratšího po nejdelší, kapalina je rozkmitá jako chaluhy v moři a nervovým vláknem odchází signál. Vpravo poškozené buňky: vlásky jsou ohnuté, zlomené nebo chybí a signál neodchází. Plakety: kapalina rozkmitá vlásky a buňky vyšlou nervový signál; buňky jsou velmi jemné a po poškození se už neobnoví. Animace: vlásky zdravých buněk se kývou a vlákny běží signál.">
<title>Vláskové buňky v hlemýždi</title>
<style>
/* Předloha: PDF lekce 35 (Škola/8/6 Zvuk/35 …/35. Vnímání zvuku, hlasitost zvuku .pdf), s. 4 – šest snímků
   vláskových buněk z mikroskopu (A–F: řady vlásků seřazené podle délky; na některých snímcích vlásky zlomené,
   polehlé nebo chybějící) + text „jsou rozkmitány kapalinou (podobně jako chaluhy v moři) a vysílají nervový
   signál, jsou velmi jemné a lze je lehce poškodit, při poškození se již neobnoví“. Fotografie nahrazeny kresbou.
   Infografika ve složce lekce: „NE“ u poškozených buněk. Barvy jako obr. 01: modrá kapalina, žluté nervové
   vlákno s červeným signálem.
   Animace: vlásky se kývou s periodou 2 s, signál běží vláknem; poškozené buňky jsou bez pohybu a bez signálu.
   Bez animace (reduced-motion) = vlásky rovně, signál stojí. */
.sw { transform-box: fill-box; transform-origin: 50% 100%; animation: sw 1s ease-in-out infinite alternate; }
.d1 { animation-delay: .25s; } .d2 { animation-delay: .5s; }
@keyframes sw { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
.kap { stroke-dasharray: 14 12; animation: kap 1.4s linear infinite; }
@keyframes kap { to { stroke-dashoffset: -52; } }
.sig { stroke-dasharray: 2 18; animation: sig .8s linear infinite; }
@keyframes sig { to { stroke-dashoffset: -40; } }
@media (prefers-reduced-motion: reduce) { .sw, .kap, .sig { animation: none; } }
</style>
<defs>
<linearGradient id="vl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e9ecef"/><stop offset="1" stop-color="#adb5bd"/></linearGradient>
<linearGradient id="kapg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7f5ff"/><stop offset="1" stop-color="#a5d8ff"/></linearGradient>
<g id="zdrava">
<path d="M-44 4C-44 60-20 76 0 76C20 76 44 60 44 4Z" fill="#ffc9c9" stroke="#c2504a" stroke-width="2.5"/>
<circle cx="0" cy="38" r="12" fill="#f783ac" stroke="#a61e4d" stroke-width="2"/>
<path d="M0 76V124" stroke="#e8a317" stroke-width="11" stroke-linecap="round"/>
<path d="M0 76V124" stroke="#ffe066" stroke-width="5" stroke-linecap="round"/>
<path class="sig" d="M0 78V124" stroke="#c92a2a" stroke-width="7" stroke-linecap="round"/>
</g>
<g id="vlasky" fill="url(#vl)" stroke="#495057" stroke-width="2">
<rect x="-31" y="-40" width="10" height="42" rx="5"/><rect x="-17" y="-56" width="10" height="58" rx="5"/><rect x="-3" y="-72" width="10" height="74" rx="5"/><rect x="11" y="-88" width="10" height="90" rx="5"/><rect x="25" y="-104" width="10" height="106" rx="5"/>
</g>
<g id="mrtva">
<path d="M-44 4C-44 60-20 76 0 76C20 76 44 60 44 4Z" fill="#e9ecef" stroke="#868e96" stroke-width="2.5"/>
<circle cx="0" cy="38" r="12" fill="#ced4da" stroke="#868e96" stroke-width="2"/>
<path d="M0 76V124" stroke="#ced4da" stroke-width="11" stroke-linecap="round"/>
</g>
</defs>
<rect x="3" y="3" width="954" height="604" rx="14" fill="#f8f9fa"/>
<text x="480" y="44" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">Vláskové buňky v hlemýždi</text>

<!-- LEVÝ PANEL: zdravé buňky -->
<text x="250" y="96" font-size="22" font-weight="bold" fill="#237032" text-anchor="middle">Zdravé buňky</text>
<rect x="30" y="112" width="440" height="220" fill="url(#kapg)"/>
<rect x="30" y="330" width="440" height="128" fill="#f8e1d8"/>
<path d="M30 330H470" stroke="#c2504a" stroke-width="3"/>
<path class="kap" d="M44 146C120 136 200 156 280 146S420 136 456 146M44 180C120 170 200 190 280 180S420 170 456 180" fill="none" stroke="#1864ab" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(110 330)"><use href="#zdrava"/><g class="sw"><use href="#vlasky"/></g></g>
<g transform="translate(250 330)"><use href="#zdrava"/><g class="sw d1"><use href="#vlasky"/></g></g>
<g transform="translate(390 330)"><use href="#zdrava"/><g class="sw d2"><use href="#vlasky"/></g></g>
<rect x="30" y="112" width="440" height="346" fill="none" stroke="#237032" stroke-width="3"/>
<g font-size="20" fill="#212529">
<text x="44" y="222" font-weight="bold" fill="#1864ab">kapalina</text>
<text x="160" y="250">vlásky</text>
<path d="M190 254L222 262" stroke="#495057" stroke-width="2"/>
</g>
<text x="270" y="448" font-size="20" font-weight="bold" fill="#a51d1d">nervový signál</text>
<path d="M266 442L256 442" stroke="#a51d1d" stroke-width="2"/>

<!-- PRAVÝ PANEL: poškozené buňky -->
<text x="710" y="96" font-size="22" font-weight="bold" fill="#a51d1d" text-anchor="middle">Poškozené buňky</text>
<rect x="490" y="112" width="440" height="220" fill="url(#kapg)"/>
<rect x="490" y="330" width="440" height="128" fill="#f1f3f5"/>
<path d="M490 330H930" stroke="#868e96" stroke-width="3"/>
<path class="kap" d="M504 146C580 136 660 156 740 146S880 136 916 146M504 180C580 170 660 190 740 180S880 170 916 180" fill="none" stroke="#1864ab" stroke-width="3" stroke-linecap="round"/>
<g fill="#dee2e6" stroke="#868e96" stroke-width="2">
<g transform="translate(570 330)"><use href="#mrtva"/>
<rect x="-31" y="-18" width="10" height="20" rx="5"/><rect x="-17" y="-10" width="10" height="12" rx="5"/>
<rect x="-3" y="-72" width="10" height="74" rx="5" transform="rotate(62 2 0)"/><rect x="11" y="-88" width="10" height="90" rx="5" transform="rotate(48 16 0)"/><rect x="25" y="-30" width="10" height="32" rx="5"/></g>
<g transform="translate(710 330)"><use href="#mrtva"/>
<rect x="-31" y="-40" width="10" height="42" rx="5" transform="rotate(-38 -26 0)"/><rect x="-3" y="-20" width="10" height="22" rx="5"/><rect x="25" y="-104" width="10" height="106" rx="5" transform="rotate(-70 30 0)"/></g>
<g transform="translate(850 330)"><use href="#mrtva"/>
<rect x="-17" y="-14" width="10" height="16" rx="5"/><rect x="11" y="-24" width="10" height="26" rx="5"/></g>
</g>
<rect x="490" y="112" width="440" height="346" fill="none" stroke="#a51d1d" stroke-width="3"/>
<text x="730" y="448" font-size="20" font-weight="bold" fill="#a51d1d">bez signálu</text>
<path d="M726 442L716 442" stroke="#a51d1d" stroke-width="2"/>

<!-- plakety -->
<rect x="30" y="476" width="440" height="110" rx="12" fill="#fff" stroke="#237032" stroke-width="2.5"/>
<g font-size="20" fill="#212529" text-anchor="middle">
<text x="250" y="512">Kapalina rozkmitá vlásky,</text>
<text x="250" y="540">jako vlny kývou chaluhami v moři.</text>
<text x="250" y="568" font-weight="bold">Buňky vyšlou nervový signál.</text>
</g>
<rect x="490" y="476" width="440" height="110" rx="12" fill="#fff" stroke="#a51d1d" stroke-width="2.5"/>
<g font-size="20" fill="#212529" text-anchor="middle">
<text x="710" y="512">Buňky jsou velmi jemné</text>
<text x="710" y="540">a snadno se poškodí.</text>
<text x="710" y="568" font-weight="bold" fill="#a51d1d">Po poškození se už neobnoví.</text>
</g>
</svg>
