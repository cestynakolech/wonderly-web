<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Nahoře dva rezistory za sebou: R₁ = 4 Ω s kratším odporovým drátem a R₂ = 6 Ω s delším drátem. Prochází jimi stejný proud I = 2 A; na R₁ je napětí 8 V, na R₂ 12 V. Šipka dolů: chovají se jako jeden rezistor. Dole jeden rezistor s drátem tak dlouhým jako oba dohromady: R = 4 Ω + 6 Ω = 10 Ω, napětí U = 8 V + 12 V = 20 V, proud I = 2 A.">
<style>
/* Předloha: PDF lekce 28, s. 5 (rezistory za sebou se chovají jako jeden rezistor s větším odporem – sčítá se délka
   odporového drátu; R = R₁ + R₂). Obrázek v PDF chybí, nakresleno podle textu PDF a výkladu § 4.
   Čísla z výkladu (zvídavé): R₁ = 4 Ω, R₂ = 6 Ω, I = 2 A → U₁ = 8 V, U₂ = 12 V, R = 10 Ω, U = 20 V.
   Odporový drát: 1 zub klikatky na 1 Ω, takže délka drátu 4 + 6 = 10 zubů. Statický obrázek. */
</style>
<defs>
<marker id="v-ora" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e8590c"/></marker>
<marker id="v-nap" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0b7285"/></marker>
</defs>
<rect x="3" y="3" width="594" height="514" rx="14" fill="#f8f9fa"/>
<text x="300" y="40" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Odpory za sebou se sčítají</text>
<path d="M30 150H120M240 150H300M480 150H570" fill="none" stroke="#212529" stroke-width="4"/><rect x="120" y="124" width="120" height="52" fill="#fff" stroke="#212529" stroke-width="4"/><path d="M120 150L127.5 138L142.5 162L150 150L157.5 138L172.5 162L180 150L187.5 138L202.5 162L210 150L217.5 138L232.5 162L240 150" fill="none" stroke="#9c4a17" stroke-width="3" stroke-linejoin="round"/><rect x="300" y="124" width="180" height="52" fill="#fff" stroke="#212529" stroke-width="4"/><path d="M300 150L307.5 138L322.5 162L330 150L337.5 138L352.5 162L360 150L367.5 138L382.5 162L390 150L397.5 138L412.5 162L420 150L427.5 138L442.5 162L450 150L457.5 138L472.5 162L480 150" fill="none" stroke="#9c4a17" stroke-width="3" stroke-linejoin="round"/>
<text x="180" y="108" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">R₁ = 4 Ω</text><text x="390" y="108" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">R₂ = 6 Ω</text><line x1="36" y1="124" x2="100" y2="124" stroke="#e8590c" stroke-width="7" stroke-linecap="round" marker-end="url(#v-ora)"/><text x="60" y="104" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">I = 2 A</text><line x1="128" y1="196" x2="232" y2="196" stroke="#0b7285" stroke-width="5" marker-start="url(#v-nap)" marker-end="url(#v-nap)"/><text x="180" y="230" font-size="22" font-weight="bold" fill="#0b7285" text-anchor="middle">U₁ = 8 V</text><line x1="308" y1="196" x2="472" y2="196" stroke="#0b7285" stroke-width="5" marker-start="url(#v-nap)" marker-end="url(#v-nap)"/><text x="390" y="230" font-size="22" font-weight="bold" fill="#0b7285" text-anchor="middle">U₂ = 12 V</text>
<path d="M180 256V300" stroke="#495057" stroke-width="6"/><path d="M166 296L180 318L194 296Z" fill="#495057"/><text x="210" y="292" font-size="20" fill="#495057" text-anchor="start">chovají se jako jeden rezistor</text>
<path d="M30 400H150M450 400H570" fill="none" stroke="#212529" stroke-width="4"/><rect x="150" y="374" width="300" height="52" fill="#fff" stroke="#212529" stroke-width="4"/><path d="M150 400L157.5 388L172.5 412L180 400L187.5 388L202.5 412L210 400L217.5 388L232.5 412L240 400L247.5 388L262.5 412L270 400L277.5 388L292.5 412L300 400L307.5 388L322.5 412L330 400L337.5 388L352.5 412L360 400L367.5 388L382.5 412L390 400L397.5 388L412.5 412L420 400L427.5 388L442.5 412L450 400" fill="none" stroke="#9c4a17" stroke-width="3" stroke-linejoin="round"/>
<text x="300" y="358" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">R = 4 Ω + 6 Ω = 10 Ω</text><line x1="36" y1="374" x2="100" y2="374" stroke="#e8590c" stroke-width="7" stroke-linecap="round" marker-end="url(#v-ora)"/><text x="60" y="354" font-size="20" font-weight="bold" fill="#e8590c" text-anchor="middle">I = 2 A</text><line x1="158" y1="446" x2="442" y2="446" stroke="#0b7285" stroke-width="5" marker-start="url(#v-nap)" marker-end="url(#v-nap)"/><text x="300" y="480" font-size="22" font-weight="bold" fill="#0b7285" text-anchor="middle">U = 8 V + 12 V = 20 V</text>
<text x="300" y="506" font-size="20" fill="#495057" text-anchor="middle">delší odporový drát = větší odpor</text>
</svg>
