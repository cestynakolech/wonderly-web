<svg xmlns="http://www.w3.org/2000/svg" width="460" height="560" viewBox="0 0 460 560" role="img" aria-labelledby="title desc"><title id="title">Účinnost v pohybu 1/3: Vysavač při práci</title><desc id="desc">Motor se otáčí a prach se pohybuje po podlaze do sací hubice. Příkon ze zásuvky není totéž co užitečný výkon u hubice.</desc><style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:22px;fill:#2b2a26} .nadpis{font-size:25px;font-weight:bold}.mensi{font-size:20px}.zelena{fill:#1e7031}.oranzova{fill:#b5400a}.cervena{fill:#c92a2a} .anim{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:linear} @media(prefers-reduced-motion:reduce){.anim{animation:none!important}}@keyframes prach{0%,15%{transform:translateX(0);opacity:1}65%{transform:translateX(75px);opacity:1}70%,100%{transform:translateX(75px);opacity:0}}.prach{animation-name:prach}@keyframes rotor{to{transform:rotate(360deg)}}.rotor{animation-name:rotor;animation-duration:2s}</style><rect width="460" height="560" rx="18" fill="#f8f9fa"/><rect x="12" y="12" width="436" height="536" rx="12" fill="white" stroke="#ced4da"/><text x="28" y="50" class="nadpis" text-anchor="start">Vysavač při práci</text><text x="28" y="86" class="oranzova" text-anchor="start">Příkon ze zásuvky → motor</text><path d="M70 160 H105 Q130 160 130 215" fill="none" stroke="#e8590c" stroke-width="5"/><rect x="35" y="125" width="40" height="65" rx="9" fill="#edf1f4" stroke="#2b2a26" stroke-width="3"/><circle cx="47" cy="149" r="3"/><circle cx="62" cy="149" r="3"/>
<path d="M100 220 Q100 195 130 195 H205 Q240 195 240 235 V270 H100Z" fill="#dce8f0" stroke="#2b2a26" stroke-width="3"/><circle cx="128" cy="273" r="17" fill="#536775"/><circle cx="214" cy="273" r="17" fill="#536775"/>
<path d="M236 222 C285 170 322 203 300 252 L346 345" fill="none" stroke="#536775" stroke-width="13"/><path d="M316 344 H380 L394 366 H306Z" fill="#dce8f0" stroke="#2b2a26" stroke-width="3"/><path d="M30 376 H430" stroke="#536775" stroke-width="3"/>
<g class="anim prach" fill="#868e96"><circle cx="263" cy="365" r="5"/><circle cx="281" cy="368" r="4"/><circle cx="249" cy="369" r="3"/></g>
<g transform="translate(176 233)"><g class="anim rotor" stroke="#536775" stroke-width="5"><path d="M-17 0 H17 M0 -17 V17"/><circle r="21" fill="none"/></g></g><path d="M176 255 V301" stroke="#868e96" stroke-width="2"/><text x="146" y="326" class="" text-anchor="start">motor</text><text x="28" y="424" class="zelena" text-anchor="start">Výkon: sání u hubice</text><text x="28" y="467" class="" text-anchor="start">Jen část dodané práce</text><text x="28" y="497" class="" text-anchor="start">využijeme k vysávání.</text><text x="28" y="530" class="mensi" text-anchor="start">Prach se pohybuje do hubice.</text></svg>