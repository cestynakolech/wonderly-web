		<rect x="81" y="471" width="20" height="5" rx="2" fill="#495057"/>
		<text x="91" y="556" font-size="15" text-anchor="middle" fill="#2b2a26">lahev potápěče</text>
	</g>

	<!-- PODTLAK, x = 230 -->
	<g>
		<path d="M208 206 L252 206 L248 242 L212 242 Z" fill="#fff" stroke="#495057" stroke-width="2.5"/>
		<path d="M209.5 218 L250.5 218 L248 242 L212 242 Z" fill="#fab005"/>
		<path d="M236 240 L236 190 L246 182" fill="none" stroke="#868e96" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
		<text x="230" y="262" font-size="15" text-anchor="middle" fill="#2b2a26">brčko</text>
	</g>
	<g>
		<!-- zeď, gumová přísavka s háčkem; okolní vzduch ji tlačí ke zdi -->
		<rect x="196" y="282" width="10" height="64" fill="#ced4da" stroke="#adb5bd" stroke-width="1"/>
		<path d="M206 290 C220 292 228 304 228 314 C228 324 220 336 206 338 Z" fill="#a5d8ff" stroke="#1c7ed6" stroke-width="2"/>
		<rect x="228" y="310" width="8" height="8" fill="#1c7ed6"/>
		<path d="M236 314 L242 314 Q248 314 248 320 Q248 326 242 326" fill="none" stroke="#1c7ed6" stroke-width="3" stroke-linecap="round"/>
		<g class="tlaci" fill="#1864ab" stroke="#1864ab" stroke-width="2.5" stroke-linecap="round">
			<line x1="270" y1="298" x2="234" y2="298"/><path d="M226 298 L236 292 L236 304 Z" stroke="none"/>
			<line x1="270" y1="334" x2="232" y2="334"/><path d="M224 334 L234 328 L234 340 Z" stroke="none"/>
		</g>
		<text x="230" y="362" font-size="15" text-anchor="middle" fill="#2b2a26">přísavka</text>
	</g>
	<g>
		<!-- vysavač: hubice na podlaze nasává vzduch s prachem -->
		<line x1="186" y1="438" x2="286" y2="438" stroke="#adb5bd" stroke-width="2"/>
		<rect x="194" y="402" width="34" height="28" rx="10" fill="#e64980" stroke="#a61e4d" stroke-width="2"/>
		<circle cx="201" cy="432" r="5" fill="#343a40"/><circle cx="221" cy="432" r="5" fill="#343a40"/>
		<path d="M228 410 Q246 382 258 398 L262 426" fill="none" stroke="#495057" stroke-width="4" stroke-linecap="round"/>
		<rect x="252" y="426" width="22" height="7" rx="2" fill="#495057"/>
		<g fill="#868e96">
			<g class="vs1"><circle cx="277" cy="425" r="2.2"/><circle cx="285" cy="431" r="2.2"/><circle cx="281" cy="417" r="2.2"/></g>
			<g class="vs2"><circle cx="289" cy="423" r="2.2"/><circle cx="273" cy="419" r="2.2"/><circle cx="283" cy="435" r="2.2"/></g>
			<g class="vs3"><circle cx="279" cy="411" r="2.2"/><circle cx="288" cy="415" r="2.2"/><circle cx="275" cy="433" r="2.2"/></g>
		</g>
		<text x="230" y="462" font-size="15" text-anchor="middle" fill="#2b2a26">vysavač</text>
	</g>
	<g>
