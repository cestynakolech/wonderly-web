<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="První pomoc při úrazu elektrickým proudem ve čtyřech krocích. 1. Nedotýkej se zraněného ani jeho oděvu; je-li to bezpečné, vypni jistič. 2. Volej 155, zapni hlasitý odposlech a poslouchej operátora. 3. V bezpečí zjisti, zda zraněný reaguje a normálně dýchá. 4. Pokud nereaguje a nedýchá normálně, stlačuj hrudník podle pokynů operátora. Animace: kroky se po řadě zvýrazní modrým rámečkem, páčka jističe sjede do polohy vypnuto a ruce zachránce stlačují hrudník.">
<style>
.k1 { animation: k1 12s step-end infinite; }
@keyframes k1 { 0% { opacity: 1; } 0% { opacity: 1; } 25% { opacity: 0; } }
.k2 { animation: k2 12s step-end infinite; }
@keyframes k2 { 0% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } }
.k3 { animation: k3 12s step-end infinite; }
@keyframes k3 { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0; } }
.k4 { animation: k4 12s step-end infinite; }
@keyframes k4 { 0% { opacity: 0; } 75% { opacity: 1; } 100% { opacity: 1; } }
.packa { animation: packa 3s ease-in-out infinite; }
@keyframes packa { 0%, 30% { transform: translate(0, -40px); } 50%, 100% { transform: translate(0, 0); } }
.tlak { animation: tlak 0.55s ease-in-out infinite; }
@keyframes tlak { 50% { transform: translate(0, 8px); } }
@media (prefers-reduced-motion: reduce) { .k1, .k2, .k3, .k4, .packa, .tlak { animation: none; } }
</style>
<rect x="3" y="3" width="594" height="854" rx="14" fill="#f8f9fa"/>

<text x="300" y="44" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">První pomoc: nejdřív vlastní bezpečí</text>
<g><rect x="20" y="66" width="270" height="376" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/><rect class="k1" x="20" y="66" width="270" height="376" rx="10" fill="#e7f5ff" stroke="#1864ab" stroke-width="6" opacity="0"/><g transform="translate(20 66)"><circle cx="32" cy="32" r="20" fill="#1864ab"/><text x="32" y="40" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">1</text><rect x="70" y="40" width="130" height="190" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="3"/><rect x="96" y="70" width="78" height="130" rx="6" fill="#fff" stroke="#adb5bd" stroke-width="2"/><rect x="125" y="96" width="20" height="90" rx="4" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/><g class="packa"><rect x="127" y="140" width="16" height="36" rx="3" fill="#c92a2a"/></g><text x="135" y="90" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">ZAP</text><text x="135" y="220" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">VYP</text><circle cx="232" cy="90" r="15" fill="#ffd8a8" stroke="#d9a066" stroke-width="2"/><path d="M217 86q2 -14 15 -14t15 14q-7 -6 -15 -5q-8 -1 -15 5Z" fill="#6b4423"/><rect x="216" y="108" width="32" height="58" rx="10" fill="#f08c00"/><rect x="219" y="164" width="11" height="44" rx="4" fill="#343a40"/><rect x="234" y="164" width="11" height="44" rx="4" fill="#343a40"/><circle cx="232" cy="140" r="30" fill="none" stroke="#c92a2a" stroke-width="6"/><path d="M211 161L253 119" stroke="#c92a2a" stroke-width="6"/><text x="135" y="270" font-size="19" font-weight="bold" fill="#212529" text-anchor="middle">Nesahej na zraněného.</text><text x="135" y="296" font-size="19" fill="#212529" text-anchor="middle">Je-li to bezpečné,</text><text x="135" y="322" font-size="19" fill="#212529" text-anchor="middle">vypni jistič.</text></g></g>
<g><rect x="310" y="66" width="270" height="376" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/><rect class="k2" x="310" y="66" width="270" height="376" rx="10" fill="#e7f5ff" stroke="#1864ab" stroke-width="6" opacity="0"/><g transform="translate(310 66)"><circle cx="32" cy="32" r="20" fill="#1864ab"/><text x="32" y="40" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">2</text><rect x="90" y="40" width="96" height="190" rx="16" fill="#343a40"/><rect x="98" y="58" width="80" height="148" rx="6" fill="#e7f5ff"/><text x="138" y="122" font-size="30" font-weight="bold" fill="#1864ab" text-anchor="middle">155</text><circle cx="138" cy="164" r="18" fill="#2b8a3e"/><path d="M130 158q2 12 14 14l4 -4l-5 -4l-3 2q-4 -2 -6 -6l2 -3l-4 -5Z" fill="#fff"/><path d="M200 110q12 18 0 36M212 100q20 28 0 56" fill="none" stroke="#495057" stroke-width="4" stroke-linecap="round"/><text x="135" y="270" font-size="19" font-weight="bold" fill="#212529" text-anchor="middle">Volej 155.</text><text x="135" y="296" font-size="19" fill="#212529" text-anchor="middle">Zapni hlasitý</text><text x="135" y="322" font-size="19" fill="#212529" text-anchor="middle">odposlech.</text></g></g>
<g><rect x="20" y="462" width="270" height="376" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/><rect class="k3" x="20" y="462" width="270" height="376" rx="10" fill="#e7f5ff" stroke="#1864ab" stroke-width="6" opacity="0"/><g transform="translate(20 462)"><circle cx="32" cy="32" r="20" fill="#1864ab"/><text x="32" y="40" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">3</text><ellipse cx="135" cy="214" rx="110" ry="8" fill="#000" opacity="0.12"/><rect x="70" y="178" width="96" height="34" rx="12" fill="#1c7ed6"/><rect x="160" y="182" width="78" height="26" rx="8" fill="#343a40"/><circle cx="50" cy="192" r="22" fill="#ffd8a8" stroke="#d9a066" stroke-width="2"/><path d="M30 180q10 -14 26 -10" fill="none" stroke="#6b4423" stroke-width="8" stroke-linecap="round"/><path d="M90 60h150q12 0 12 12v34q0 12 -12 12h-96l-24 22l4 -22h-34q-12 0 -12 -12v-34q0 -12 12 -12Z" fill="#fff9db" stroke="#e67700" stroke-width="2"/><text x="166" y="98" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">Slyšíš mě?</text><path d="M110 166v-14M126 166l4 -12M94 166l-4 -12" stroke="#1971c2" stroke-width="3" stroke-linecap="round"/><text x="135" y="270" font-size="19" font-weight="bold" fill="#212529" text-anchor="middle">V bezpečí zjisti:</text><text x="135" y="296" font-size="19" fill="#212529" text-anchor="middle">reaguje? dýchá</text><text x="135" y="322" font-size="19" fill="#212529" text-anchor="middle">normálně?</text></g></g>
<g><rect x="310" y="462" width="270" height="376" rx="10" fill="#fff" stroke="#adb5bd" stroke-width="2"/><rect class="k4" x="310" y="462" width="270" height="376" rx="10" fill="#e7f5ff" stroke="#1864ab" stroke-width="6" opacity="0"/><g transform="translate(310 462)"><circle cx="32" cy="32" r="20" fill="#1864ab"/><text x="32" y="40" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">4</text><ellipse cx="135" cy="214" rx="110" ry="8" fill="#000" opacity="0.12"/><rect x="70" y="178" width="96" height="34" rx="12" fill="#1c7ed6"/><rect x="160" y="182" width="78" height="26" rx="8" fill="#343a40"/><circle cx="50" cy="192" r="22" fill="#ffd8a8" stroke="#d9a066" stroke-width="2"/><path d="M30 180q10 -14 26 -10" fill="none" stroke="#6b4423" stroke-width="8" stroke-linecap="round"/><g class="tlak"><path d="M102 132V86q0 -14 16 -14t16 14V132Z" fill="#2f9e44"/><circle cx="118" cy="52" r="17" fill="#ffd8a8" stroke="#d9a066" stroke-width="2"/><path d="M101 48q2 -18 17 -18t17 18q-8 -8 -17 -7q-9 -1 -17 7Z" fill="#6b4423"/><path d="M106 84L114 166M130 84L122 166" stroke="#2f9e44" stroke-width="12" stroke-linecap="round"/><path d="M118 130L150 172M150 172V204" fill="none" stroke="#2b8a3e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="156" cy="208" rx="12" ry="5" fill="#343a40"/><path d="M110 120L114 166M126 120L122 166" stroke="#ffd8a8" stroke-width="9" stroke-linecap="round"/><ellipse cx="118" cy="172" rx="16" ry="7" fill="#ffd8a8" stroke="#d9a066" stroke-width="2"/></g><path d="M160 116v34M152 140l8 10l8 -10" fill="none" stroke="#c92a2a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="270" font-size="19" font-weight="bold" fill="#212529" text-anchor="middle">Nedýchá normálně?</text><text x="135" y="296" font-size="19" fill="#212529" text-anchor="middle">Stlačuj hrudník</text><text x="135" y="322" font-size="19" fill="#212529" text-anchor="middle">podle operátora.</text></g></g>
</svg>
