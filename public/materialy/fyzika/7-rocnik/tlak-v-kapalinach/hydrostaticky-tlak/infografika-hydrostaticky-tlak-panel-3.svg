	<text x="40" y="92" font-size="19" fill="#2b2a26">Tři nádoby: stejné dno,</text><text x="40" y="116" font-size="19" fill="#2b2a26">stejná výška hladiny.</text><g clip-path="url(#p3-ca)"><rect class="p3-wa" x="40" y="220" width="400" height="164" fill="#74c0fc"/></g><polyline points="94,186 94,330 68,380 128,380 102,330 102,186" fill="none" stroke="#2b2a26" stroke-width="4" stroke-linejoin="round"/><line x1="68" y1="380" x2="128" y2="380" stroke="#e03131" stroke-width="5"/><g class="p3-la"><text x="98.0" y="410" font-size="17" font-weight="bold" text-anchor="middle" fill="#b8460b">stejný tlak</text></g><g clip-path="url(#p3-cb)"><rect class="p3-wb" x="40" y="220" width="400" height="164" fill="#74c0fc"/></g><polyline points="200,186 200,380 260,380 260,186" fill="none" stroke="#2b2a26" stroke-width="4" stroke-linejoin="round"/><line x1="200" y1="380" x2="260" y2="380" stroke="#e03131" stroke-width="5"/><g class="p3-lb"><text x="230.0" y="410" font-size="17" font-weight="bold" text-anchor="middle" fill="#b8460b">stejný tlak</text></g><g clip-path="url(#p3-cc)"><rect class="p3-wc" x="40" y="220" width="400" height="164" fill="#74c0fc"/></g><polyline points="316,186 342,380 402,380 428,186" fill="none" stroke="#2b2a26" stroke-width="4" stroke-linejoin="round"/><line x1="342" y1="380" x2="402" y2="380" stroke="#e03131" stroke-width="5"/><g class="p3-lc"><text x="372.0" y="410" font-size="17" font-weight="bold" text-anchor="middle" fill="#b8460b">stejný tlak</text></g><line class="p3-hl" x1="40" y1="220" x2="420" y2="220" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="7 6"/><line x1="48" y1="224" x2="48" y2="376" stroke="#2b2a26" stroke-width="1.5" marker-start="url(#sip)" marker-end="url(#sip)"/><text x="60" y="306.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#2b2a26" font-style="italic">h</text><rect x="40" y="440" width="380" height="124" rx="10" fill="#fff4e6" stroke="#b8460b" stroke-width="2"/><text x="56" y="468" font-size="19" font-weight="bold" fill="#2b2a26">Tlak u dna je všude stejný.</text><text x="56" y="494" font-size="18" fill="#2b2a26">Nezáleží na tvaru nádoby</text><text x="56" y="518" font-size="18" fill="#2b2a26">ani na množství vody.</text><text x="56" y="546" font-size="18" fill="#2b2a26">Stejné dno → stejná síla na dno.</text><text x="230" y="588" font-size="15" text-anchor="middle" fill="#6b6a60">hydrostatický paradox</text>
