<rect x="3" y="3" width="594" height="484" rx="14" fill="#f8f9fa"/>
<text x="300" y="34" font-size="26" font-weight="bold" fill="#212529" text-anchor="middle">Na čem závisí odpor drátu</text><text x="300" y="56" font-size="20" fill="#212529" text-anchor="middle">materiál, délka, tloušťka, teplota</text><text x="30" y="86" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">Délka (stejný kov, stejná tloušťka)</text><path d="M40 111H170V125H40Z" fill="#9c4a17"/><ellipse cx="40" cy="118" rx="4" ry="7" fill="#9c4a17"/><rect x="40" y="113.1" width="130" height="2" fill="#fff" opacity="0.25"/><ellipse cx="170" cy="118" rx="4" ry="7" fill="#e8a66b" stroke="#6b3410" stroke-width="2"/><text x="196" y="126" font-size="22" fill="#212529" text-anchor="start">kratší – menší odpor</text><path d="M40 155H340V169H40Z" fill="#9c4a17"/><ellipse cx="40" cy="162" rx="4" ry="7" fill="#9c4a17"/><rect x="40" y="157.1" width="300" height="2" fill="#fff" opacity="0.25"/><ellipse cx="340" cy="162" rx="4" ry="7" fill="#e8a66b" stroke="#6b3410" stroke-width="2"/><text x="364" y="170" font-size="22" fill="#212529" text-anchor="start">delší – větší odpor</text><text x="30" y="222" font-size="22" font-weight="bold" fill="#212529" text-anchor="start">Tloušťka (stejný kov, stejná délka)</text><path d="M40 250H300V262H40Z" fill="#9c4a17"/><ellipse cx="40" cy="256" rx="4" ry="6" fill="#9c4a17"/><rect x="40" y="251.8" width="260" height="2" fill="#fff" opacity="0.25"/><ellipse cx="300" cy="256" rx="4" ry="6" fill="#e8a66b" stroke="#6b3410" stroke-width="2"/><text x="328" y="264" font-size="22" fill="#212529" text-anchor="start">tenčí – větší odpor</text><path d="M40 294H300V342H40Z" fill="#9c4a17"/><ellipse cx="40" cy="318" rx="12" ry="24" fill="#9c4a17"/><rect x="40" y="301.2" width="260" height="6.7" fill="#fff" opacity="0.25"/><ellipse cx="300" cy="318" rx="12" ry="24" fill="#e8a66b" stroke="#6b3410" stroke-width="2"/><text x="328" y="326" font-size="22" fill="#212529" text-anchor="start">tlustší – menší odpor</text><path d="M150 362H320Q332 362 332 374V412Q332 424 320 424H150Q138 424 138 412V374Q138 362 150 362Z" fill="#fff3bf" stroke="#212529" stroke-width="2.5"/><path d="M262 363L300 330L292 363" fill="#fff3bf" stroke="#212529" stroke-width="2.5" stroke-linejoin="round"/><path d="M264 364.5H290" stroke="#fff3bf" stroke-width="4"/><text x="235" y="401" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">příčný řez</text><text x="30" y="466" font-size="22" fill="#212529" text-anchor="start">Teplota: zahřátý kovový drát má větší odpor.</text>
</svg>
