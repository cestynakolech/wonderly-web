<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 948" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Animace ve čtyřech řádcích. 1: fotbalista kopne do ležícího míče a míč se rozjede – uvedení do pohybu. 2: míč se kutálí k hráči, ten do něj kopne a míč letí jiným směrem – změna směru. 3: cyklista šlape a zrychluje, pak brzdí a zpomaluje – změna rychlosti. 4: míč letí na branku a brankář ho chytí do rukavic – zastavení pohybu.">
<style>
/* Předloha: PDF Vzájemné působení těles, síla – oddíl Účinky vzájemného působení, Pohybové (vykopnutí míče, přihrávky, cyklista zrychlí a zpomalí, brankář chytne míč). V PDF bez obrázku, nakresleno podle textu. */
/* cyklus 6 s, všechny čtyři řádky naráz. Bez animace = koncové stavy (míč odkopnutý, přihraný, cyklista vpravo, míč v rukavicích). */
@keyframes k1 { 0%, 12% { transform: rotate(40deg); } 26% { transform: rotate(-30deg); } 45%, 100% { transform: rotate(0deg); } }
@keyframes b1 { 0%, 25% { transform: translateX(0px); } 62%, 100% { transform: translateX(360px); } }
@keyframes b1r { 0%, 25% { transform: rotate(0deg); } 62%, 100% { transform: rotate(720deg); } }
@keyframes k2 { 0%, 22% { transform: rotate(40deg); } 36% { transform: rotate(-30deg); } 55%, 100% { transform: rotate(0deg); } }
@keyframes b2 { 0% { transform: translate(0px, 0px); } 35% { transform: translate(372px, 0px); } 70%, 100% { transform: translate(110px, -100px); } }
@keyframes c3 { 0% { transform: translateX(0px); animation-timing-function: ease-in; } 45% { transform: translateX(230px); animation-timing-function: ease-out; } 88%, 100% { transform: translateX(380px); } }
@keyframes t3a { 0%, 45% { opacity: 1; } 48%, 100% { opacity: 0; } }
@keyframes t3b { 0%, 45% { opacity: 0; } 48%, 100% { opacity: 1; } }
@keyframes b4 { 0%, 8% { transform: translateX(0px); } 45%, 100% { transform: translateX(378px); } }
@keyframes b4r { 0%, 8% { transform: rotate(0deg); } 45%, 100% { transform: rotate(540deg); } }
.k1 { animation: k1 6s ease-in-out infinite; } .b1 { animation: b1 6s ease-out infinite; } .b1r { animation: b1r 6s ease-out infinite; }
.k2 { animation: k2 6s ease-in-out infinite; } .b2 { animation: b2 6s linear infinite; }
.c3 { animation: c3 6s infinite; } .t3a { animation: t3a 6s linear infinite; } .t3b { animation: t3b 6s linear infinite; }
.b4 { animation: b4 6s linear infinite; } .b4r { animation: b4r 6s linear infinite; }
@keyframes sc { 0% { opacity: 0; } 4%, 94% { opacity: 1; } 100% { opacity: 0; } }
.sc { animation: sc 6s linear infinite; }

@media (prefers-reduced-motion: reduce) { .k1, .b1, .b1r, .k2, .b2, .c3, .t3a, .t3b, .b4, .b4r, .sc { animation: none; } }
</style>
