<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dva čtverce se siločárami. Vlevo kladně nabitá kulička, siločáry z ní míří na všechny strany ven. Vpravo záporně nabitá kulička, siločáry do ní míří ze všech stran dovnitř. Dál od kuličky jsou čáry řidší – pole slábne. Animace: žluté čárky běží po siločárách ve směru šipek.">
<style>
/* Předloha: PDF lekce 19, s. 7 (siločáry kladné a záporné kuličky, 16 čar). Čárky (amber) běží ve směru siločar:
   úsek 30 px za 0,8 s. Bez animace se čárky skryjí a zůstanou siločáry se šipkami. */
.tok { stroke-dasharray: 8 22; animation: tok 0.8s linear infinite; }
@keyframes tok { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .tok { animation: none; opacity: 0; } }
</style>
