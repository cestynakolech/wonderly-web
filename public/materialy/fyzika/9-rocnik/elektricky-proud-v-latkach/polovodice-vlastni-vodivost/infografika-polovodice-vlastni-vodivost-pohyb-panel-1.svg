		<path d="M250,296 L250,363 L262,363" fill="none" stroke="#343a40" stroke-width="4" stroke-linejoin="round"/>
		<path d="M398,363 L410,363 L410,236 L368,236" fill="none" stroke="#343a40" stroke-width="4" stroke-linejoin="round"/>
		<line x1="236" y1="284" x2="264" y2="284" stroke="#2b2a26" stroke-width="3"/>
